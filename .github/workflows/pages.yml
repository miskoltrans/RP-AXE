# Publishes the standalone tree viewer as the GitHub Pages site root:
#   https://miskoltrans.github.io/RP-AXE/
# Only the viewer is deployed (sparse checkout), never the repo itself.
name: Publish tree viewer

on:
  push:
    branches: [main]
    paths:
      - tree/render/prototype/axe-tree-standalone.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tree/render/prototype/axe-tree-standalone.html
          sparse-checkout-cone-mode: false
      - name: Assemble site
        run: |
          mkdir -p _site
          cp tree/render/prototype/axe-tree-standalone.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
