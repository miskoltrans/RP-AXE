// KerbalChangelog entry (KerbalChangelog is a dependency): shown in-game once per new version.
KERBALCHANGELOG
{
	showChangelog = True
	modName = RP-AXE
	license = CC-BY-NC-SA 4.0
	author = miskoltrans
	website = github.com/miskoltrans/RP-AXE

	VERSION
	{
		version = 0.9.2
		versionKSP = 1.12.5
		CHANGE
		{
			change = Avionics overload is back to 0.9.0 strength
			subchange = 0.9.1's fix for the doubled patches also halved the overload penalty, and every avionics number had been tuned with it doubled. The double strength is now restored on purpose: misdirection up to 180 degrees off-axis (the controls reverse from about 6% over), twice the noise, overgain squared
			subchange = The PAW's off-axis figure now shows the real limit. RCS translation is doubled the same way, without 0.9.0's leak from one thruster to the next
		}
		CHANGE
		{
			change = Over-capacity avionics rows are red in the PAW
			subchange = Every row that means "this vessel lacks capacity" uses one alarm colour, and Capacity shows the vessel mass next to the rating
			subchange = A crewed stack with a probe core reads "crewed pod has control", a unit over its own rating while a larger unit steers says so, and launch clamps no longer count toward VAB mass
		}
		CHANGE
		{
			change = Install presets renamed
			subchange = RP-AXE-Express-High and -Low are now RP-AXE-Express-RSS-High and RP-AXE-Express-RSS-Low, next to RP-AXE-Express-Sol. Same contents
		}
	}

	VERSION
	{
		version = 0.9.1
		versionKSP = 1.12.5
		CHANGE
		{
			change = Fixed: AXE's patches on current CKAN installs
			subchange = RealFuels 15.16 changed its engine-config window and one AXE patch failed to apply, which made Harmony skip the AXE patches after it. Each patch now applies on its own, on both RealFuels versions
		}
		CHANGE
		{
			change = Fixed: every AXE patch was applied twice
			subchange = The avionics overload penalty ran twice per physics tick, so it was about double the design (twice the misdirection angle, twice the noise, overgain squared). Over capacity, a craft now flies at the designed strength, which is noticeably gentler
			subchange = Engine-upgrade tooltip stats no longer appear twice, and the bimodal-toggle message no longer posts twice
		}
		CHANGE
		{
			change = Sol support
			subchange = RP-AXE runs on Sol (RSS-Reborn) as well as Real Solar System. On Sol it keeps RP-AXE's per-body science, Earth science removal, gas-giant heat fix, SCANsat altitudes, ground-station antennas and outer-planet resources, so a Sol career plays to the same numbers
			subchange = New install preset RP-AXE-Express-Sol.ckan; guide in docs/SOL.md on GitHub
		}
	}

	VERSION
	{
		version = 0.9.0
		versionKSP = 1.12.5
		CHANGE
		{
			change = Public beta -- first release
			subchange = A from-scratch, discipline-based tech tree (~530 breakthrough nodes, science-gated) on the RP-1 realism stack, with RP-1's career plugin replaced by AXE.dll
			subchange = Ported from RP-1: science instruments and crewed science, 35 programs with contracts, the engine-config upgrade ladders, DSN tracking-station levels, airlaunch, range safety, non-reentry-rated parts
			subchange = AXE's own: avionics with steerable-mass capacity and control noise on overload, an in-editor flight simulator, a funds economy without build times, tooling, maintenance or crew training, free launch-site switching
			subchange = KerbalismLab crewed-station science (65 experiments) integrated and rebalanced
		}
	}
}
