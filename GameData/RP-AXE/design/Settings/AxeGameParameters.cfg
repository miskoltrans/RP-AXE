// RP-AXE — difficulty preset defaults (GAMEPARAMETERS)
// ---------------------------------------------------------------------------
// AXE shipped no GAMEPARAMETERS, so career difficulty silently booted KSP's stock Preset.Normal,
// re-enabling reentry comms blackout, fragile KSC buildings, gated action groups and a hard funds
// floor that RP-1 had removed. This restores RP-1's difficulty defaults (ported from RP-1's own
// GameParameters.cfg).
//
// MECHANISM: GAMEPARAMETERS is NOT a stock KSP node — stock never reads it (the string does not
// occur in Assembly-CSharp at all), so this file does nothing on its own. It is an RP-1 convention,
// applied by a plugin: RP-1 has RP0/Singletons/DifficultyPresetChanger.cs, LRTR has its own copy,
// and AXE has Source/AXE/AxeDifficultyPresets.cs — which calls GameParameters.SetDifficultyPresets()
// (stock defaults) and then Loads each preset sub-node below over it, at MainMenu.
//   HISTORY: AXE originally shipped this config WITHOUT the reader, so all of it was inert and every
//   career silently booted stock Normal — most visibly BypassEntryPurchaseAfterResearch = True, i.e.
//   researching a node handed you every part in it for free.
// Once applied, these are DEFAULTS the player can still tweak through the stock UI (most of them
// mid-game, via Settings -> Difficulty Options). They affect NEW games only: an existing save stores
// its own resolved parameters and keeps them. AXE's effective default preset is Normal (what a new
// career selects and what AxeAutoTest boots via GetDefaultParameters(CAREER, Normal)).
//
// All four presets share one identical QoL/realism block; they differ ONLY in the CAREER economy
// block (starting funds + gain/loss multipliers), which is RP-1's numbers kept as a PLACEHOLDER
// pending the economy pass. Crew fields (AutoHireCrews / MissingCrewsRespawn / EnableKerbalExperience)
// are inert — crew is cut — but left at RP-1's values, harmless.
//
// ADVANCED TWEAKABLES is deliberately NOT forced: RP-1 doesn't touch it either (verified — no config
// or RP0.dll code sets ADVANCED_TWEAKABLES); it's a per-user setting in KSP's root settings.cfg.
// Enable it in Settings -> General so the autostrut toggle (AxeAutostrut.cfg), fuel-flow priority and
// per-part fuel transfer are visible — same as RP-1 players do.
//
// CONTRACTS: each preset also carries a StockContractParametersTemplate block — ContractConfigurator's
// per-save toggles for stock/expansion/Kerbalism contract types — with every one of them off, so a new
// career's Mission Control is all RP0-group contracts. Rationale and the list's provenance live in
// design/Contracts/AxeDisableStockContracts.cfg, which sets the same defaults CC's own way.
//
// Confirmed tedium-reducers: plasmaBlackout off, AllowNegativeCurrency on, ActionGroupsAlways on,
// BuildingImpactDamageMult 0.1, reverts/quickload on, requireSignalForControl off (keep control out
// of DSN range). Realism kept: pressure/G part limits, reentry heat, crossfeed. Entry costs kept
// (BypassEntryPurchaseAfterResearch = False) so part-unlock cost stays as funds texture.

GAMEPARAMETERS
{
	Easy
	{
		DIFFICULTY
		{
			AutoHireCrews = False
			MissingCrewsRespawn = False
			RespawnTimer = 7200
			BypassEntryPurchaseAfterResearch = False
			AllowStockVessels = False
			IndestructibleFacilities = False
			ResourceAbundance = 1
			ReentryHeatScale = 1
			EnableCommNet = True
		}
		FLIGHT
		{
			CanRestart = True
			CanLeaveToEditor = True
			CanQuickLoad = True
		}
		CommNetParams
		{
			requireSignalForControl = False
			plasmaBlackout = False
			rangeModifier = 1
			DSNModifier = 1
			occlusionMultiplierVac = 1
			occlusionMultiplierAtm = 1
			enableGroundStations = True
		}
		AdvancedParams
		{
			EnableKerbalExperience = True
			ImmediateLevelUp = False
			AllowNegativeCurrency = True
			PressurePartLimits = True
			GPartLimits = True
			GKerbalLimits = True
			KerbalGToleranceMult = 1
			ResourceTransferObeyCrossfeed = True
			ActionGroupsAlways = True
			BuildingImpactDamageMult = 0.1
			PartUpgradesInSandbox = True
			PartUpgradesInCareer = True
		}
