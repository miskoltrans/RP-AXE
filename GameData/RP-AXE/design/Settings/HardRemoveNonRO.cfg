// RP-AXE — enable RO's HardRemoveNonRO floor.
// ------------------------------------------------------------------------------------------------
// RP-1-Express ships this flag (RP-1Express.cfg: @RP1EXPRESSINSTALL:FOR[HardRemoveNonRO]); AXE
// replaces RP-1, so we register it ourselves. The :FOR[HardRemoveNonRO] tag makes ModuleManager
// treat "HardRemoveNonRO" as an installed mod, which satisfies RealismOverhaul's deletion patch
//   RealismOverhaul_Global_Config.cfg:  !PART:HAS[~RSSROConfig[True]]:BEFORE[zzzTagCleanup]:NEEDS[HardRemoveNonRO]
// i.e. it DELETES every part that RO did not make realistic (RSSROConfig != True) — the "non RO"
// plausibility floor. This is AXE's settled RO-config floor (docs/RESTART.md): cuts the ~825 "non RO"
// uncurated parts. Every curated part survived this same flag in ksp_rp1_clean (the manifest source),
// so the 1820 are unaffected; the residual RO-valid uncurated parts are a P2 Experimental-node concern.
//
// DELIBERATELY ONLY HardRemoveNonRO — NOT HardRemoveNonRP0. RP-0 part configs come from RP-1, which we
// don't have, so HardRemoveNonRP0 would delete nearly every part.
RPAXE_REMOVAL_FLAGS
{
	stub = true
}
@RPAXE_REMOVAL_FLAGS:FOR[HardRemoveNonRO]
{
	%hardRemoveNonRO = true
}
