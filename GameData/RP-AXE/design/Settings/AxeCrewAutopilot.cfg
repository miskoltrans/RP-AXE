// RP-AXE — an astronaut aboard always gives the vessel FULL SAS.
//
// THE STOCK RULE, DECOMPILED (Experience.Effects.AutopilotSkill / APSkillExtensions.AvailableAtLevel):
//
//   vessel SAS level = MAX over parts of part.PartValues.AutopilotSkill, fed by exactly two sources —
//     * ModuleSAS            -> its SASServiceLevel
//     * a crew member        -> the AutopilotSkill EFFECT, whose value is that kerbal's XP LEVEL
//   and a mode is offered when that max >= its required skill:
//     0 stability assist | 1 pro/retrograde | 2 normal/radial | 3 target/anti-target/maneuver node
//
// So stock ties a crewed craft's SAS to *who happens to be sitting in the seat*: a rookie pilot gets
// stability assist and nothing else, and an engineer or scientist gets no SAS at all (the effect is
// on the Pilot trait only, and with no contributor the value stays at its -1 default — SAS is not
// merely limited, it is absent).
//
// AXE does not want that. The avionics design already states the rule the other way round — "crew are
// exempt outright" (AxeAvionicsController.VesselHasAttitudeReference, and the MechJeb half honours it)
// — on the grounds that a human aboard IS the attitude reference and the guidance computer. AXE also
// cut crew progression forever (docs/RESTART.md), so kerbal XP is not a currency the player spends or
// plans around; letting it silently decide whether a capsule can hold prograde is a leftover, not a
// mechanic. An astronaut is a trained astronaut.
//
// THE PORTED CLAIM THIS REPLACES. docs/AVIONICS_SPEC.md and AxeAvionicsCore.cfg both asserted that a
// crewed pod "carries its own ModuleSAS at full level and simply wins the max", so no crew special
// case was needed. That was never true: of the 72 crewed command parts in the live ModuleManager
// cache, 52 have no ModuleSAS node at all, 11 sit at level 1 and only 9 at level 3. The claim is
// corrected where it appears; this file is what actually makes it hold.
//
// TWO HALVES, because neither alone is enough:
//   1. (here) every crewed trait gets the AutopilotSkill effect, so *any* astronaut is a contributor.
//   2. (AXE.dll, Avionics/AxeCrewSasSkill.cs) a Harmony postfix pins that effect's value to 3 instead
//      of the kerbal's XP level. It cannot be done in config: AutopilotSkill.GetValue() returns
//      Parent.CrewMemberExperienceLevel() outright and reads neither `level` nor `modifiers`, so the
//      EFFECT node has no dial to turn.
//
// Tourist is deliberately left out — a paying passenger is not aircrew. Pilot already ships the
// effect in Squad/Experience/Traits.cfg and needs no edit here; only its value changes, in the patch.
//
// :LAST[RP-AXE] for the same reason as AxeCrewPhysics.cfg, which owns the other half of the trait
// edits (G tolerance): land after every mod that rewrites the traits.
//
// A WRINKLE WORTH KNOWING, since it decides which node this lands on. Breaking Ground ships a SECOND
// pair of EXPERIENCE_TRAIT[Engineer] / [Scientist] nodes (SquadExpansion/Serenity/Experience/Traits.cfg,
// carrying just the deployed-science effects), so two nodes share each name. An unindexed `@NODE[x]`
// takes the FIRST, which is Squad's — verified in the live MM cache, where AxeCrewPhysics.cfg's
// GeeForceTolerance edit sits on the Squad node. Either would do: ExperienceSystemConfig.LoadTraitConfigs
// MERGES same-named traits, folding later nodes' effects into the first, and it explicitly refuses (and
// logs) a duplicate effect name — so this cannot double-register even if a mod adds AutopilotSkill too.
@EXPERIENCE_TRAIT[Engineer]:LAST[RP-AXE]
{
	EFFECT
	{
		name = AutopilotSkill
	}
}

@EXPERIENCE_TRAIT[Scientist]:LAST[RP-AXE]
{
	EFFECT
	{
		name = AutopilotSkill
	}
}
