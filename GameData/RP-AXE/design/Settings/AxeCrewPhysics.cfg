// RP-AXE — kerbal G-force tolerance. Ported from RP-1's CrewSettings.cfg (the PHYSICSGLOBALS
// half; RP-1's crew progression, training and retirement around it stay CUT).
//
// WHY THIS FILE EXISTS. RP-1 was the only source of these keys, so dropping RP-1 restored stock's
// values with nobody choosing them — bug family A5 (docs/BUG-CLASSES.md). The earlier settings
// audit cleared "G/pressure limits" as intact, but that was the *part* limits (GPartLimits /
// PressurePartLimits, both True in AxeGameParameters.cfg). These are the *kerbal* limits, a
// different set, and they had never been checked. Found 2026-07-29 by check_settings_parity.py.
//
// THE MODEL, DECOMPILED (ProtoCrewMember.ActiveFixedUpdate / _GToleranceMult / _MaxSustainedG):
//
//     tol   = (1 + (kerbalGBraveMult - 1) * courage) * GeeForceTolerance(level) * (badass ? kerbalGBadMult : 1)
//     dG/dt = min(geeForce, kerbalGClamp)^kerbalGPower - kerbalGOffset * tol
//     warn at gExperienced > kerbalGThresholdWarn * tol; LOC at > kerbalGThresholdLOC * tol
//
// so `kerbalGOffset` is a FLOOR, not a limit: below (kerbalGOffset * tol)^(1/kerbalGPower) g
// nothing accumulates at all, and above it the load integrates until the LOC threshold. With
// kerbalGPower = 4 that floor is offset^0.25, which is the number worth reasoning about:
//
//              floor (level-0 crew)   LOC at a sustained 8 g
//   stock/AXE  900^0.25  = 5.48 g     60,000 / (8^4 - 900)  = 18.8 s
//   RP-1       1786^0.25 = 6.50 g     90,000 / (8^4 - 1786) = 39.0 s
//
// A ballistic Soyuz reentry — the case this actually decides — runs 8-9 g for roughly half a
// minute and was survived in reality every time it happened. Under stock's numbers it is a
// blackout; under RP-1's it is a bad day. GKerbalLimits = True in AxeGameParameters.cfg and
// KerbalGToleranceMult = 1 in every preset, so these values apply directly and unscaled.
//
// :LAST[RP-AXE] to land after RO's own :FOR[RealismOverhaul] PHYSICSGLOBALS edit, matching
// design/Tree/AxeAutostrut.cfg (which owns autoStrutTechRequired in the same node).
@PHYSICSGLOBALS:LAST[RP-AXE]
{
	@kerbalGThresholdLOC  = 90000    // stock 60000 — accumulated load before loss of consciousness
	@kerbalGThresholdWarn = 45000    // stock 30000 — stock keeps this at half of LOC; so do we
	@kerbalGOffset        = 1786     // stock 900 — raises the no-accumulation floor 5.48 g -> 6.50 g
	@kerbalGBraveMult     = 1        // stock 1.5 — courage no longer buys G tolerance
	@kerbalGBadMult       = 1.025    // stock 1.5 — badass is a rounding error, not a 50% bonus
}

// The trait multipliers are the other half of the same dial, and they are NOT a PHYSICSGLOBALS
// key — `GeeForceTolerance(level)` multiplies both the floor and the LOC threshold, so leaving
// them at stock would undo most of what the block above just bought:
//
//   sustained-G floor, (kerbalGOffset * tol)^0.25, at the values shipped here
//     stock traits + RP-1 globals : engineer L1 6.66 g … pilot L5 7.73 g   (a 1.16x spread)
//     RP-1 traits  + RP-1 globals : engineer L1 6.54 g … pilot L5 6.87 g   (a 1.05x spread)
//
// RP-1's intent is that a trained crew member tolerates ~6.5-6.9 g and *who* they are barely
// matters — which is how real crew selection works. Stock's 2.0x veteran-pilot bonus is a
// role-playing stat, not a physiological one. Ported verbatim from RP-1 CrewSettings.cfg:95-133.
//
// EVAChuteSkill goes to 0 on all three for the same reason RP-1 does it: CustomBarnKit
// Harmony-replaces ModuleEvaChute.CanCrewMemberUseParachute outright (see the note on
// unlockedEVAChute in AxeFacilities.cfg), so the trait effect is dead code while CBK is
// installed — but agreeing with the live rule costs nothing and removes a contradiction.
@EXPERIENCE_TRAIT[Pilot]:LAST[RP-AXE]
{
	@EFFECT[GeeForceTolerance]
	{
		@modifiers = 1.183, 1.206, 1.223, 1.235, 1.246    // stock 1.3, 1.45, 1.6, 1.85, 2.0
	}
	@EFFECT[EVAChuteSkill]
	{
		@level = 0
	}
}

@EXPERIENCE_TRAIT[Engineer]:LAST[RP-AXE]
{
	@EFFECT[GeeForceTolerance]
	{
		@modifiers = 1.025, 1.045, 1.06, 1.07, 1.08       // stock 1.1, 1.2, 1.3, 1.4, 1.5
	}
	@EFFECT[EVAChuteSkill]
	{
		@level = 0
	}
}

@EXPERIENCE_TRAIT[Scientist]:LAST[RP-AXE]
{
	@EFFECT[GeeForceTolerance]
	{
		@modifiers = 1.025, 1.045, 1.06, 1.07, 1.08       // stock 1.1, 1.2, 1.3, 1.4, 1.5
	}
	@EFFECT[EVAChuteSkill]
	{
		@level = 0
	}
}
