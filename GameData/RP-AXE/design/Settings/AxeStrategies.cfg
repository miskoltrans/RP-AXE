// ============================================================================
// RP-AXE — Administration building strategies (Channel 2 of the funds economy).
//
// WHY THIS FILE EXISTS
// AXE's contracts pay REPUTATION, not funds — 284 paying types, 146k reputation across a career on
// the Normal preset (measured by tools/rep_budget.py; 105,542 in config x1.385 for the prestige
// factor and RepGainMultiplier, both of which stock applies on top of rewardReputation). And
// reputation has no other use here: RP-1 spent it on the yearly subsidy, which went out with
// RP0.dll. So reputation is the currency the player actually earns, and the Administration
// building is where it becomes spendable. docs/PROGRAMS.md already assumed this ("currencies are
// fungible via the stock Administration building"); it was never balanced, and the stock rates are
// tuned for stock-KSP magnitudes (thousands of funds, single-digit science), not RSS ones.
//
// THE RATE (docs/ECONOMY.md §3)
// Channel 2 is budgeted at 16,000,000 of the 40,000,000 lifetime target — ~140 funds/reputation at
// full commitment, about 1/9th of stock's 1,002–1,253. Re-derived 2026-07-28: at the real 146k the
// channel tops out at 22.9M (Normal), i.e. it CLEARS its target rather than falling short, and still
// clears it on Hard (15.3M vs 16M). The rate is therefore left alone.
//
// ONLY CONTRACT REPUTATION CONVERTS. The EFFECT below lists AffectReasons = ContractReward,
// ScienceTransmission, Progression. Crew recovery pays reputation too (stock's
// reputationKerbalRecovery, 25/kerbal x RepGainMultiplier) but under TransactionReasons.VesselRecovery,
// which is NOT in that list — so it builds a reputation BALANCE and never converts to funds. Keep it
// that way: it is what keeps the 750-reputation requirement at Administration L3 reachable at 100%
// commitment (where every converted point is deducted from the gain), and it stops cheap crewed hops
// from being farmed for money.
// Stock's min/max spread (×1.25) is preserved so the commitment slider still means something.
// Full commitment needs a level-3 Administration building. **strategyCommitRange is now AXE's, at
// 0.5 / 0.75 / 1.0** (`AxeFacilities.cfg` @ADMINISTRATION, 2026-07-29, §11) — it was CustomBarnKit's
// 0.25 / 0.6 / 1.0, which combined with the quadratic yield below to leave Administration L1 at 21%
// of the L3 rate. Administration level is still the pacing knob; it is just no longer a second one
// stacked on top of reputation's own back-loading.
//
// requiredReputationMin/Max IS NOT A WINDOW — AND IS DELIBERATELY LEFT UNPATCHED (2026-07-28)
// It reads like "activatable only while reputation is inside [min, max]", and this file used to say
// exactly that, then "widened" it to +/-1,000,000. It is not a window. Decompiled
// `Strategies.Strategy` (Assembly-CSharp):
//     RequiredReputation => FactorLerp(RequiredReputationMin, RequiredReputationMax)
//     if (RequiredReputation != 0f && Ceil(CurrentRep) < Floor(RequiredReputation)) -> cannot activate
// The two numbers are the ENDPOINTS OF A LERP OVER THE COMMITMENT SLIDER: they set how much
// reputation you must POSSESS to commit that hard. Stock's -500 -> 750 means "commit 0% for free,
// commit 100% once you are famous." High reputation makes a stock strategy MORE available, never
// less — the ceiling the old comment described does not exist. Checked in CanBeActivated only, so
// it never deactivates a running strategy.
//
// The old widening therefore did real damage: it demanded Lerp(-1e6, 1e6, f) reputation, i.e.
// 200,000 at 60% commitment and 1,000,000 at 100%, against a ~114k career total. The slider was
// pinned near 50% for the whole game, and since the CurrencyConverter effect lerps BOTH the share
// of reputation diverted AND the rate off that same factor
// (CurrencyConverter.OnEffectQuery: input * Lerp(minShare,maxShare) * Lerp(minRate,maxRate)),
// Channel 2 was yielding ~70 funds/rep instead of 157 — roughly half its budgeted 16,000,000, with
// Administration L3 (750,000 funds) buying nothing at all.
//
// STOCK'S OWN -500 -> 750 IS ALREADY CORRECTLY SCALED FOR AXE, so the fix is to stop patching it.
// Against Administration's strategyCommitRange — **restated 2026-07-29 for AXE's 0.5 / 0.75 / 1.0**:
//     Admin L1, slider caps at 0.50 -> requires  125 reputation  (was -188 at CBK's 0.25: never bound)
//     Admin L2, slider caps at 0.75 -> requires  438 reputation  (was  250 at 0.60)
//     Admin L3, slider caps at 1.00 -> requires  750 reputation  (unchanged)
// So the gate now genuinely binds in the first era, which is the mechanic doing its job rather than
// a regression: a fresh career at 0 reputation commits at whatever it can afford (f = 0.2 needs
// -250, i.e. free) and raises the slider as it earns fame. Reaching 125 is one or two contracts —
// the 2026-07 playtest save held 596 — and the L2/L3 figures are unreachable long before the
// 150,000 / 563,000 those levels cost is. That is the stock mechanic working as designed, "commit as
// hard as your fame allows", with no patch to maintain.
//
// ⚠ This is why minShare must stay below 1.0 — see the note on the EFFECT below. The requirement is
// checked against the reputation BALANCE, and a share of 1.0 would stop that balance from ever
// growing out of contract rewards.
//
// If this ever needs a stronger fame axis, RESCALE the pair (against EARLY-career reputation, which
// is in the hundreds — not the 114k lifetime total) and re-derive ECONOMY.md §3's 16M, which
// assumes full commitment is reachable. Never widen it.
//
// THE SCIENCE CONVERTERS ARE DELETED, ON PURPOSE
// Science is AXE's PRIMARY progression gate and it is deliberately abundant relative to the tree:
// docs/SCIENCE.md budgets ~3.93M theoretically available against a ~362k tree. Surplus science is
// therefore expected, large, and open-ended — so any science -> funds path is unbounded income:
//   * PatentsLicensing converts science -> funds directly at ~2,075–2,595/point.
//   * OpenSourceTechProgram converts science -> reputation at ~1.66–2.07/point, which Fundraising
//     then turns into funds — the same leak with an extra hop, so nerfing only the first is useless.
// Both are removed rather than repriced: there is no rate at which "convert an unbounded surplus of
// the gating currency into the gated one" is a decision worth offering. To re-enable one, delete
// its `!STRATEGY` line below and give it a rate consistent with §3's budget.
//
// KEPT AS-IS: OutsourcedResearch (funds -> science) and AppreciationCampaign (funds -> reputation)
// are funds SINKS, which this economy is short of, and both round-trip at a heavy loss
// (5,000 funds -> 1 reputation -> ~140 funds), so neither is a laundering path.
// ============================================================================

// ---- Channel 2: reputation -> funds. AXE changes the RATE and the SHARE FLOOR here. ----------
//
// minShare 0.55 — added 2026-07-29 (docs/ECONOMY.md §11), paired with @ADMINISTRATION's
// strategyCommitRange in AxeFacilities.cfg. The two together fix a defect visible only in the
// decompile: CurrencyConverter.OnEffectQuery lerps BOTH terms off the same commitment factor,
//     taken = incomingReputation x Lerp(minShare, maxShare, f);  funds = taken x Lerp(minRate, maxRate, f)
// so the yield is QUADRATIC in f. With stock's minShare = 0, an early career capped at f = 0.25
// converted a quarter of its reputation at 85% of the rate = 21% of the L3 yield — a second gate on
// a channel whose input (reputation) is ALREADY back-loaded to 0.4% pre-orbit (§10). 0.55 lifts the
// floor of the share lerp so Administration level still decides HOW MUCH converts, but no longer
// also decides how WELL it converts.
//
// It does not move the lifetime ceiling: that is measured at f = 1, where Lerp(0.55, 1, 1) = 1.0,
// identical to stock. Every number in §3's Channel 2 table stands.
//
// Do NOT push minShare to 1.0. At full share the player banks no contract reputation at all, and
// the reputation BALANCE is what stock's requiredReputation lerp checks at activation — 250 to
// commit at 0.6, 750 at 1.0. Only crew-recovery reputation would accrue (it is under
// TransactionReasons.VesselRecovery, absent from AffectReasons below), which is not enough to reach
// 750, so a 100% share would lock the player out of the very commitment level it was meant to serve.
@STRATEGY[FundraisingCampaignCfg]:FOR[RP-AXE]
{
	@EFFECT[CurrencyConverter]:HAS[#input[Reputation]]
	{
		%minShare = 0.55
		%minRate = 125
		%maxRate = 157
	}
}

// ---- UNPATCHED ON PURPOSE: UnpaidResearchProgram, OutsourcedResearch, AppreciationCampaign ----
// All three used to carry a requiredReputation override and nothing else, so removing it removes
// the patch. They now ship exactly as stock defines them (see the header for why stock's numbers
// are already right at AXE scale). UnpaidResearchProgram (rep -> science) is a weak option by
// construction since science is not scarce, but it is a legitimate call for a player science-blocked
// in one lane; the other two are funds SINKS, which this economy is short of.

// ---- The science -> funds leaks (see header) ------------------------------------------------
!STRATEGY[PatentsLicensingCfg]:FOR[RP-AXE] {}
!STRATEGY[OpenSourceTechProgramCfg]:FOR[RP-AXE] {}
