// RP-AXE — KSPCommunityFixes patches AXE turns on.
//
// KSPCF ships several fixes DISABLED by default, because enabling them changes stock behaviour
// and the mod is conservative about that. RP-1 turned them on; AXE was inheriting the mod's
// defaults purely because RP-1 was the only thing that had ever set them (bug family A5,
// docs/BUG-CLASSES.md). Found 2026-07-29 by check_settings_parity.py.
//
// :AFTER[KSPCommunityFixes] mirrors RP-1's own patch, and is self-guarding — ModuleManager only
// runs an :AFTER[X] patch when X is installed, so this is inert without the mod.
@KSP_COMMUNITY_FIXES:AFTER[KSPCommunityFixes]
{
	// AXE ships 603 PARTUPGRADEs — the engine-config ladder is the backbone of the whole tree —
	// so a part tooltip that applies upgrades to the prefab is a correctness problem here in a way
	// it is not in a mod with a handful of them. Requires UpgradeBugs, which is already on by
	// default (KSPCommunityFixes/Settings.cfg:113).
	@PartTooltipUpgradesApplyToSubstituteParts = true

	// QoL, no mechanical effect: stop the autosave that fires every time you leave a UI-only
	// space-centre building, and drop the new-career intro popups.
	@FewerSaves = true
	@DisableNewGameIntro = true

	// Makes UI_Control.onSymmetryFieldChanged behave like onFieldChanged (fires only on a real
	// change; hands the PREVIOUS value to the callback). An editor bugfix RP-1 also takes.
	@OnSymmetryFieldChanged = true

	// NOT TAKEN — StrategyDuration. RP-1 sets it true; AXE deliberately does not.
	//
	// It makes strategies honour their Duration fields, which are live in this install: the seven
	// stock strategies all carry minLeastDuration 60 / maxLeastDuration 100 and minLongestDuration
	// 1200 / maxLongestDuration 1600 (days). AXE runs stock strategies as funds-economy Channel 2
	// (Administration reputation -> funds, docs/ECONOMY.md §3), so switching this on would lock
	// that channel for the first 60-100 days after each commitment and expire it every 3-4 years,
	// forcing a re-commit. That is a time-pressure mechanic, and AXE cut time pressure with KCT —
	// the strategy slider is meant to be a standing choice, not a subscription. Leaving it at the
	// mod default is the decision, not the absence of one. (User call, 2026-07-29.)
}
