// RP-AXE — Deep Space Network tracking-station ladder (DSN port, Piece A).
//
// Restores RP-1's 11-level tracking station (stock/RO ships only 3). CustomBarnKit.dll consumes
// @TRACKING natively; RealAntennas scales its ground-station antenna gain by the tracking-station
// facility level, so each added level is a real comms-range gain. Numbers copied verbatim from
// RP-1 (GameData/RP-1/CustomBarnKit.cfg @TRACKING).
//
// The per-level TECH GATE (which node unlocks which level) is the generated companion
// design/Tree/AxeFacilityGates.cfg (AXEBUILDINGTECHS), enforced in AXE.dll (AxeTrackingStationGate)
// — RP-1 did that gating in RP0.dll, which AXE removed.
//
// :LAST[RP-AXE] so this lands AFTER RealismOverhaul/RO_DSN_Ranges.cfg (:AFTER[RealSolarSystem]),
// which otherwise leaves the station capped at 3 levels.
@CUSTOMBARNKIT:LAST[RP-AXE]:NEEDS[CustomBarnKit]
{
	@TRACKING
	{
		@levels = 11
		@upgradesVisual = 1, 1, 2, 2, 2, 3, 3, 3, 3, 3, 3
		// ⚠ upgrades[0] IS NEVER CHARGED — see the indexing note at the top of AxeFacilities.cfg.
		// KSP charges upgradeLevels[level + 1], so the leading 50000 is the STARTING level's own
		// cost and no player pays it; the first purchase is the second 50000. CBK still requires
		// len(upgrades) == levels, which is why the dead slot has to be there. This array is
		// copied VERBATIM from RP-1, which carried no such note — 11 levels, 10 purchases,
		// 2,525,000 purchasable. docs/ECONOMY.md already counts it correctly; only the warning
		// was missing (docs/BUG-CLASSES.md finding 8).
		@upgrades = 50000, 50000, 50000, 100000, 175000, 100000, 150000, 1000000, 300000, 300000, 300000
		@unlockedSpaceObjectDiscovery = 8
		@orbitDisplayMode = 2, 3, 3, 3, 3, 3, 3, 3, 3, 3, 3
		@patchesAheadLimit = 0, 1, 2, 3, 4, 4, 4, 4, 4, 4, 4
		@trackedObjectLimit = 0, 1, 2, 3, 4, 5, 6, 8, 10, -1, -1
		@DSNRange = 4.2047e11, 8.4093e11, 1.3329e12, 4.2652e12, 1.3649e13, 4.0946e13, 1.1465e14, 3.6688e14, 5.1363e14, 8.9885e14, 8.9885e14
		// Replace the base curve wholesale (avoid the MM FloatCurve key-append gotcha).
		-DSNRangeCurve {}
		DSNRangeCurve
		{
			key = 0 0 0 1
			key = 1 1 1 0
		}
	}
}
