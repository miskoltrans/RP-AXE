// Intended config-based career enable for RealismOverhaul.
//
// HEADS UP: this is INERT in the currently-shipped RO build. RO's main-menu gate
// (Source/Harmony/MainMenu.cs) only reads this node when its private flag `_needCheckDB` is
// true, but that flag is initialised false and never set -> the config path is dead code.
// The actual career enable is done by AXE.dll (Source/AXE/EnableCareer.cs), which flips RO's
// `_overrideCareer` flag. We keep this node anyway: it is harmless and will "just work" if a
// future RO build fixes `_needCheckDB`, at which point the plugin reflection can be retired.
// See docs/DECISIONS.md D5.
REALISMOVERHAULSETTINGS
{
	allowCareer = true
}
