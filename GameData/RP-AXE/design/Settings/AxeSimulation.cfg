// RP-AXE — editor flight simulator toggle (AXE_SIMULATION)
// ---------------------------------------------------------------------------
// The "Simulate" app-launcher button in the VAB/SPH spawns the current craft into a throwaway test
// flight — pick a world + orbit, fly it, revert for free, nothing persists. Purpose: validate a
// craft in an environment you haven't reached yet (does the lunar ascent stage actually make orbit?)
// before committing a real mission. See docs/SIMULATION.md for the full design + build record.
//
// MECHANISM: AXE.dll reads this node once (RPAxe.Simulation.AxeSimulation.LoadSettings). It is the
// ONLY switch — with enabled = false the editor button never registers and no flight hooks run, so
// the feature is fully dark. Defaults on even if this file is missing (the plugin assumes enabled).
//
// GATING is in code, not here: the home world is always simulatable; every other world (and the
// "warp forward" time control) unlocks with the Digital Guidance Computer node
// (comp_digitalGuidanceComputer). Locked worlds show greyed in the target chooser.

AXE_SIMULATION
{
    enabled = true
}
