// RP-AXE — CustomBarnKit facility curves: launchpad size/mass cap, Mission Control contract limit,
// plus VAB/SPH (uncapped from turn 1), runway (RP-1-style free upgrades), and turn-1 on-orbit fuel.
//
// The tracking-station ladder is separate (design/Settings/AxeTrackingStation.cfg) because it
// needs a per-level TECH gate; launchpad + Mission Control do NOT — RP-1 tech-gated only the
// tracking station (its KCTBUILDINGTECHS has no LaunchPad/MissionControl entry), so these are
// pure funds-upgraded facility curves. No AXE.dll changes: the launchpad cap is enforced by
// stock GameVariables (which CustomBarnKit rewrites from @LAUNCHPAD), and the Mission Control
// contract cap is picked up automatically by ContractLimitOverrider.cs, which reads
// GetActiveContractsLimit(missionControlLevel) and flattens ContractConfigurator's per-prestige
// caps to it.
//
// ⚠ HOW `upgrades` IS INDEXED — the entry that looks like the first price is never charged.
// KSP's UpgradeableFacility charges `upgradeLevels[currentLevel + 1].levelCost` (decompiled), and
// CustomBarnKit assigns `levelCost = upgrades[k]` for level k. So upgrades[0] is the STARTING
// level's own cost and no player ever pays it; upgrades[1] is the first purchase. CBK requires
// len(upgrades) == levels ("Wrong numbers of upgrade price for ..."), which is why the dead slot
// has to be there at all. It is written 0 here to make that self-documenting. (The only code that
// reads it is the downgrade refund, upgradeLevels[level-1].levelCost * 0.667 — unreachable in a
// normal career.) Two AXE ladders were authored as if upgrades[0] were the first price, which put
// the real cost of every step one slot to the right of the documented one; see docs/ECONOMY.md §2.
//
// LAUNCHPAD: RP-1's launchpad was inert in CustomBarnKit (levels=3, upgrades=1,1,1) because KCT
// replaced it with continuously-built pads whose allowed mass grew with pad construction. AXE
// has no KCT, so the pad is a normal stock facility again and we author our own multi-level
// mass/size curve here (stock/CBK default is just 18t / 140t / unlimited). Seven levels give a
// realistic RSS progression: sounding rockets -> first small orbit -> orbital workhorse ->
// heavy/crewed -> lunar-class -> Saturn-class superheavy -> unlimited. Mass (t) is the primary
// gate; the bounding box (x, height, z) is kept generous so it rarely binds before mass does.
//
// PRICES RE-SHAPED 2026-07-28 (docs/ECONOMY.md §6). Was 19000/75000/250000/600000/1400000/
// 3000000/5000000, i.e. really charging 75k … 5M for a purchasable total of 10.33M — 56% of every
// lump sink in the game, and 2.7M of it (the 1,200 t and 3,000 t steps) landing in the single era
// that also has to pay for a Moon landing. A minimum-path solvency model put that milestone
// 4.3M short. The curve keeps its shape — each step still roughly doubles, mass is still the
// gate — at a purchasable total of 7.29M, which the model clears with margin. The Saturn-class
// step is 1.8M rather than 3M; the unlimited top stays deliberately expensive because nothing in
// a normal playthrough needs it.
//
// 200 t STEP CUT 150,000 -> 90,000, 2026-07-29 (tools/gate_feasibility.py, docs/ECONOMY.md §10).
// This is the rung that decides whether the tree's own orbital spines are flyable when the tree
// hands them to you. Atlas B is 118 t and Titan II 154 t, so both need it — and a career arriving
// at first orbit could not pay for it, because the pad has to be bought BEFORE the missions that
// pay for it can be flown. Cutting it to 90,000 puts the 200 t rung at 130,000 cumulative and the
// 500 t rung at 530,000, against ~590,000 banked at that gate once the programme payout curve is
// flattened (build_economy.py FUNDING_EXPONENT). Purchasable total 7.29M -> 7.23M; the shape above
// the 200 t rung is untouched.
//
// ⚠ KNOWN RESIDUAL, deliberately not fixed here: the MASS RUNGS skip the R-7 class. The R-7
// (270 t), Vostok 8K72 (287 t) and Soyuz (308 t) all sit just above the 200 t rung, so the single
// most iconic first-orbit vehicle in the game needs the 500 t pad — 530,000 cumulative against
// ~590,000 banked, i.e. affordable but with nothing left over. Re-rung it (200 -> 300 t) rather
// than discounting it further if that turns out to bite in play; discounting the 500 t step
// instead would also cheapen Saturn I / Titan III, which are correctly priced there.
//
// MISSION (= Mission Control): ported from RP-1's @MISSION (5 levels, 3/5/7/10/unlimited). Only
// the per-level arrays are overridden; the default node's scoring / recovery / prestige fields
// are left untouched. Note this is a lighter lever in AXE than in RP-1: RP-1's Programs layer
// (which drove contract pacing) was not ported, so the cap is the whole mechanic here.
//
// :LAST[RP-AXE] so it lands after CustomBarnKit/default.cfg (and any RO facility config).
@CUSTOMBARNKIT:LAST[RP-AXE]:NEEDS[CustomBarnKit]
{
	@LAUNCHPAD
	{
		@levels = 7
		@upgradesVisual = 1, 2, 2, 3, 3, 3, 3
		// never-charged slot, then: 75 t 40k · 200 t 90k · 500 t 400k · 1,200 t 900k ·
		// 3,000 t 1.8M · unlimited 4M  = 7,230,000 purchasable
		@upgrades = 0, 40000, 90000, 400000, 900000, 1800000, 4000000
		@craftMassLimit = 25, 75, 200, 500, 1200, 3000, -1
		// Replace the 3-entry default box list wholesale (avoid per-index MM edits).
		-craftSizeLimit {}
		craftSizeLimit
		{
			size = 12, 24, 12    // 25 t
			size = 16, 32, 16    // 75 t
			size = 20, 45, 20    // 200 t
			size = 25, 60, 25    // 500 t
			size = 30, 85, 30    // 1200 t
			size = 40, 120, 40   // 3000 t
			size = -1, -1, -1    // unlimited
		}
	}
	@MISSION
	{
		@levels = 5
		@upgradesVisual = 1, 2, 2, 3, 3
		// Left as authored, but read it with the indexing note above: 25000 is the dead slot, so
		// 5 contracts costs 60k, 7 costs 120k, 10 costs 200k, unlimited 300k = 680,000 purchasable.
		@upgrades = 25000, 60000, 120000, 200000, 300000
		@activeContractsLimit = 3, 5, 7, 10, -1
	}

	// ASTRONAUTS (= Astronaut Complex) — AXE cut crew progression, so this building is one AXE
	// never designed: it keeps CustomBarnKit's stock 3 levels and stock prices (19000 dead slot,
	// then 75,000 and 282,000). That is deliberate. What was NOT deliberate is that EVA rides on
	// this building rather than on the crew system, so cutting crew progression silently handed
	// the EVA rules to stock as well. Two of them are corrected here; the rest are recorded in
	// tools/check_settings_parity.py. Found 2026-07-29; decompiled before acting, because three
	// of the five keys do not mean what their names suggest.
	//
	// homebodyAtmoEVA — THE ONE THAT MATTERED. Decompiled (CustomGameVariables.EVAIsPossible):
	//
	//     if (evaUnlocked)                     return true;
	//     if (homebodyEVA && body == Home)     return homebodyAtmoEVA ? true : v.LandedOrSplashed;
	//     return false;
	//
	// so at stock's `false`, a crew that has not bought the facility can EVA only while LANDED OR
	// SPLASHED on Earth — no LEO spacewalk, and none of AXE's orbital EVA science. RP-1 sets it
	// true, which is what actually makes EVA free: anywhere in Earth's SOI needs no purchase, and
	// the facility gate only ever bites beyond Earth. We take RP-1's SHAPE at AXE's price — the
	// beyond-Earth gate stays `unlockedEVA = 2` (Astronaut Complex L2 = 75,000, a legible one-off
	// for the lunar era) rather than RP-1's own `4`, which on its 5-level ladder is L4 = 480,000.
	// (User call, 2026-07-29.)
	//
	// unlockedEVAChute — NOT a facility level, despite sitting in this block and being named like
	// unlockedEVA. CustomBarnKit Harmony-replaces ModuleEvaChute.CanCrewMemberUseParachute with:
	//
	//     EVAChuteOnBuilding ? (facilityLevel >= (unlockedEVAChute - 1.1)/(levels - 1))
	//                        : (crewMember.experience >= unlockedEVAChute)
	//
	// and EVAChuteOnBuilding is false everywhere in this install, so the live rule is a raw CREW
	// XP threshold — stock's 3 means "has banked 3 XP", i.e. a flight or two (xpPerLevel is
	// 2/8/16/32/64, so 3 sits between level 1 and level 2). It is not, as the parity table used to
	// claim, "EVA chutes at a maxed Astronaut Complex". Set to RP-1's 1 to match the decision
	// above: an EVA parachute is hardware you launched with, not a reward for seniority.
	//
	// Left at stock deliberately, now that the mechanics are known:
	//   unlockedEVA      = 2  the beyond-Earth gate above; L2 = 75,000.
	//   unlockedEVAClamber = 3  L3 (max). Same SHAPE as RP-1, which puts it at its own top level.
	//   unlockedEVAFlags   = 2  L2. RP-1 is stricter here (its top level); flags are cosmetic.
	//   activeCrewLimit  = 5, 12, -1   ENFORCED (KerbalRoster/AstronautComplex, on hiring). Five
	//                                  hired kerbals at L1 — but RP-1's own first rung is FOUR, so
	//                                  stock is already the more generous of the two. No action.
	//   crewLevelLimit   = 1, 3, -1    NOT enforced. `GameVariables.GetCrewLevelLimit` has exactly
	//                                  two references in Assembly-CSharp: its own definition and
	//                                  Upgradeables/KSCFacilityLevelText, the upgrade TOOLTIP. It
	//                                  caps nothing. This is what closes the KerbalismLab
	//                                  crew-star question (docs/KERBALISMLAB.md "Open / deferred"):
	//                                  Scientist:4+ is reachable at any Astronaut Complex level,
	//                                  so the 36 experiments behind it are a progression curve, not
	//                                  dead content.
	@ASTRONAUTS
	{
		@homebodyAtmoEVA = true    // stock false — EVA anywhere in Earth's SOI, no purchase
		@unlockedEVAChute = 1      // stock 3 — a crew-XP threshold, not a facility level
	}

	// VAB / SPH — RP-1 makes both a non-constraint from turn 1: unlimited part count, all action
	// groups unlocked, trivial upgrade cost. (CBK default.cfg caps parts at 30 and locks custom
	// action groups until level 3 = 845k funds — the stock build grind RP-1 deleted.) `levels` is
	// left to CBK code (matched to the other buildings); we override only the arrays, exactly as
	// RP-1's own CustomBarnKit.cfg @VAB/@SPH do.
	@VAB
	{
		@upgrades = 1, 1, 1
		@actionGroupsStockUnlock = 0
		@actionGroupsCustomUnlock = 0
		@partCountLimit = -1, -1, -1
	}
	@SPH
	{
		@upgrades = 1, 1, 1
		@actionGroupsStockUnlock = 0
		@actionGroupsCustomUnlock = 0
		@partCountLimit = -1, -1, -1
	}

	// RUNWAY — do it like RP-1: free/instant upgrades so the 18 t craft-mass cap is a formality,
	// not a paid grind. RP-1 leaves the mass array at CBK default (18 / 140 / -1 t) but sets
	// upgrades = 1,1,1 + upgradesVisual = 3,3,3, so a maxed (unlimited-mass) runway costs 2 funds
	// total — guards the aviation lane (jets/rocketplanes) from default.cfg's 19k/75k/282k gate.
	@RUNWAY
	{
		@levels = 3
		@upgrades = 1, 1, 1
		@upgradesVisual = 3, 3, 3
	}

	// RESEARCH — AXE's own 8-level ladder. AUTHORED 2026-07-29 (docs/ECONOMY.md §8); was CBK stock
	// default until then, which is the whole reason this block exists.
	//
	// WHY IT IS OURS TO SET. `scienceCostLimit` refuses any node whose science cost exceeds the cap
	// for the current R&D level — decompiled: RDNode picks RESEARCHABLE vs FADED on
	// `effectiveCost < RDController.ScienceCap`, and ScienceCap is
	// `GameVariables.GetScienceCostLimit(RnD facility level)`. It is a hard refusal, not a hint.
	// Since science is AXE's primary progression gate, this ladder is the primary FUNDS gate laid
	// across it — and AXE was inheriting stock's 100/500/-1 at 451,000 + 1,690,000, which put
	// **89.7% of the tree's science behind one purchase** and stood the first wall (451,000) right
	// at the applications-satellite era, the tightest point on the income curve.
	//
	// RP-1 IS NOT THE PRECEDENT HERE — it DELETED this mechanic. RP-1/CustomBarnKit.cfg sets
	// `scienceCostLimit = -1, -1, -1`, `upgrades = 1, 1, 1`, `dataToScienceRatio = 1, 1, 1`; its
	// changelog v3.0.0.0 reads "Remove RnD upgrades and researcher caps. Instead, researchers cost a
	// bit more per year in salary, and base research rate is a bit slower." RP-1 could zero it
	// because KCT still paced research by TIME (salaried researchers, research points/day). AXE cut
	// KCT, so it has no time gate at all — zeroing this too would leave science pure bank-and-spend.
	// So AXE keeps the mechanic (ECONOMY.md §4) but OWNS the numbers instead of inheriting them.
	//
	// THE LADDER. Caps sit at the GEOMETRIC MIDPOINT of the gap between adjacent tier rates, so each
	// boundary tolerates ~15-40% of scalar drift in either direction before it breaks. (Stock's 500
	// cap sat 0.8% under T9 = 504 — one scalar nudge from silently un-gating a third of the tree.)
	// build_tree.py's `science cap gate` asserts every boundary below on each build; if you retune
	// tree/nodes.yaml `tier_cost`/`scalar`, that gate is what tells you a cap has to move.
	//
	//   lvl  cap       opens          nodes   science  share   price
	//   L1     82  T0-5  sounding->appsats  131    2,887   0.9%   start
	//   L2    265  T6-7  first crewed        85   15,229   5.0%    25,000
	//   L3    404  T8    lunar/Apollo        41   13,284   4.3%    50,000
	//   L4    600  T9    stations, shuttle   58   29,232   9.5%   100,000
	//   L5    865  T10   shuttle flagships   54   38,880  12.7%   200,000
	//   L6   1225  T11   Mir-class, Cassini  52   54,243  17.7%   400,000
	//   L7   1655  T12   modern robotic      40   57,600  18.8%   700,000
	//   L8     -1  T13+  far future          46   95,364  31.1% 1,200,000
	//
	// (L6 carries 52 nodes rather than T11's 51 because `parking`, the unsorted-parts catch-all, has
	// an explicit cost of 999 rather than a tier rate. It is a detached root that gates nothing, and
	// it needed the old ladder's TOP level to reach, so L6 is a loosening. `start` is free, and
	// `experimental` / `hire_JPL` / `hire_OKB` cost 1 — all four reachable at L1, as intended.)
	//
	// Purchasable total 2,675,000. A career that stops at T12 — i.e. every node with real hardware
	// short of the deferred far-future band — pays 1,475,000 of that across SIX purchases, against
	// 2,141,000 across two before. No step now opens more than 18.8% of the tree except the top,
	// which is the endgame catch-all and deliberately expensive for the same reason the launchpad's
	// unlimited tier is: nothing in a normal playthrough needs it.
	//
	// `-1` reads as UNLIMITED, not as a literal: CustomBarnKit's float[] loader maps any negative to
	// float.MaxValue (decompiled, LoadValue(ref float[])). Without that, `cost < -1` would fade every
	// node at max level. Array indexing is `RoundToInt(normLevel * (len-1))`, exact at any level count.
	//
	// `dataToScienceRatio` flattened to 1 at every level, matching RP-1. It is stock's transmission
	// science ratio; Kerbalism owns transmission here so it is very likely inert, but RP-1 flattened
	// it rather than rely on that, and so do we — it costs nothing and removes the question.
	//
	// `unlockedFuelTransfer = 1` = on-orbit refuelling from turn 1 (RP-1 = 1; CBK default 2 locks it
	// behind an upgrade). It is a facility-LEVEL gate covering in-flight AND cross-docking transfer.
	// The level count does NOT shift it: CBK tests `normLevel > (unlockedFuelTransfer - 1.1)/(levels-1)`,
	// which stays true at level 0 for any `levels`.
	//
	// EVERY array below must have exactly `levels` entries — CBK logs "scienceCostLimit wrong size" /
	// "dataToScienceRatio wrong size" / "Wrong numbers of upgrade price for ..." and silently falls
	// back to STOCK for that field otherwise, which would restore the 100/500 wall without an error.
	@RESEARCH
	{
		@levels = 8
		@upgradesVisual = 1, 1, 2, 2, 2, 3, 3, 3
		// never-charged slot (see the indexing note at the top of this file), then the 7 purchases
		@upgrades = 0, 25000, 50000, 100000, 200000, 400000, 700000, 1200000
		@scienceCostLimit = 82, 265, 404, 600, 865, 1225, 1655, -1
		@dataToScienceRatio = 1, 1, 1, 1, 1, 1, 1, 1
		@unlockedFuelTransfer = 1
	}
}
