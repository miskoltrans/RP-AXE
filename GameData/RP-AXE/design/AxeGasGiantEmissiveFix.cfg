// Gas-giant emissive-flux fix (RSS compat)
//
// Stock KSP radiates a body at the temperature its temperatureCurve reports for
// altitude 0.  CelestialBody.GetAtmoThermalStats() feeds GetTemperature(0.0)
// straight into
//     bodyEmissiveFlux = sigma * emissivity * T^4 * R^2 / (R+alt)^2
// with no sunlight term and no atmospheric opacity -- distance from the body is
// the only falloff.
//
// RSS sets the altitude datum for the gas giants at the 1000 atm level, so that
// key is a deep-interior temperature roughly 12x the body's true effective
// temperature.  The game then radiates each planet as a full-size blackbody at
// that temperature.  Saturn: 1005.6 K -> 13.2 kW/m^2 at 40,000 km altitude,
// 9.7x Earth sunlight, which cooks anything with a low maxTemp in orbit
// (RO's RelayAntenna3m, maxTemp 448 K, reaches 529 K dish-face-on and explodes).
//
// RSS already applies exactly this fudge to Jupiter -- see Jupiter.cfg, "Fudge
// data point to fix emissivity from planet - this value is used for radiative
// heating for orbiting craft", key 0 = 152 K with the real profile resuming at
// 10 km.  Saturn, Uranus and Neptune never got it.  Same treatment here: key 0
// becomes the body's effective temperature, and a spacer key at 10 km restores
// the original profile (extrapolated along the original key-0 out-tangent).
//
// NOT applied to Venus: its 753 K datum is the real surface temperature and is
// reachable by landers.  KSP over-radiates it too (true effective temperature is
// 232 K), but Venus's low emissivity of 0.25 keeps orbital flux to ~2 kW/m^2,
// which no part in the tree fails at.
//
// :AFTER[RealSolarSystem] rather than :FOR[RP-AXE] -- ModuleManager permits only
// one pass specifier, and ordering after RSS is the hard requirement here.

@Kopernicus:AFTER[RealSolarSystem]
{
	@Body[Saturn]
	{
		@Atmosphere
		{
			@temperatureCurve
			{
				@key,0 = 0 95 0.09014 0.09014		// Saturn effective temperature
				key = 10000 996.4 0.09014 -0.000922	// resume original profile
			}
		}
	}

	@Body[Uranus]
	{
		@Atmosphere
		{
			@temperatureCurve
			{
				@key,0 = 0 59.1 0.06614 0.06614		// Uranus effective temperature
				key = 10000 720.5 0.06614 -0.001083	// resume original profile
			}
		}
	}

	@Body[Neptune]
	{
		@Atmosphere
		{
			@temperatureCurve
			{
				@key,0 = 0 59.3 0.06449 0.06449		// Neptune effective temperature
				key = 10000 704.2 0.06449 -0.001348	// resume original profile
			}
		}
	}
}
