// ============================================================================
// RP-AXE: PARTUPGRADE definitions for the Kerbalism `Configure`-GROUP upgrades
// (extra experiment slots / field reconfiguration). Without these the R&D node
// lists them as "Unknown Upgrade".
//
// Mechanism (stock KSP, no RP0.dll): a module's
//     UPGRADES { UPGRADE { name__ = X  techRequired__ = Y  <stat> } }
// is only a REFERENCE. PartUpgradeHandler.LinkUpgrades() looks X up in the
// PARTUPGRADE dictionary; if nothing defines it, it fabricates an "untracked"
// Upgrade via SetFromUntrackedUpgrade() -- title = Localizer("#autoLOC_6002276")
// = literally "Unknown Upgrade", empty manufacturer/description, entryCost 0.
// It still WORKS (and AxeGrantUpgradeUnlock still grants it on research); it is
// just nameless in R&D. Bug family A1: a config that looks authored and is half
// inert -- the definition side was never ported.
//
// Two sources were missing:
//   * Lab-Upgrade1/2 -- referenced by KerbalismLab/Framework-3-LabProcessing.cfg
//     (generated from KerbalismScienceOnly). Its upstream definitions live in
//     KerbalismScienceOnly/System/ScienceRework/Groups/Upgrades.cfg, of which AXE
//     only ported the HDD half (-> design/Science/HardDriveUpgrades.cfg). Titles
//     and descriptions below are upstream's, with AXE's actual numbers filled in.
//   * Upgrade-Slots -- KerbalismConfig/Support/US2.cfg, never defined upstream at
//     all. See the name-collision note below.
//
// techRequired here MATCHES tree/nodes.yaml (which generates the authoritative
// design/Tree/AxePartPlacement.cfg `%techRequired` override) AND the group
// settings the UPGRADE blocks are built from. If any of the three moves, re-sync
// the other two:
//   Lab-Upgrade1  life_convertedStageStation  = KerbalismLab/Framework-2-LabGroup.cfg UpgradeTech
//   Lab-Upgrade2  life_stationHabitation      = KerbalismLab/Framework-2-LabGroup.cfg ReconfigureTech
//   AXE-US2-*     see below                   = AxeKerbalismTechRemap.cfg @UPGRADES remaps
//
// entryCost is cosmetic: AxePartCost.cfg zeroes every PARTUPGRADE and AXE.dll's
// AxeGrantUpgradeUnlock marks it owned on research (UPGRADES ARE GRANTED, NEVER
// SOLD -- docs/SCIENCE.md 5d).
// ============================================================================

// --- Kerbalism laboratory experiment group ----------------------------------
PARTUPGRADE:NEEDS[FeatureScience]
{
	name = Lab-Upgrade1
	partIcon = Large_Crewed_Lab
	title = Laboratory Experiments Slot Upgrade
	manufacturer = #roMfrGeneric
	description = A second experiment rack, so a laboratory can run two long-duration studies at once instead of one. <color=green>Laboratory experiment slots: 1 -> 2</color>
	techRequired = life_convertedStageStation
	entryCost = 0
}

PARTUPGRADE:NEEDS[FeatureScience]
{
	name = Lab-Upgrade2
	partIcon = Large_Crewed_Lab
	title = Laboratory Reconfiguration Upgrade
	manufacturer = #roMfrGeneric
	description = Racks built to be pulled and swapped by the crew rather than bolted in on the ground — a laboratory's experiment loadout can be changed in flight, not just in the VAB. <color=green>Requires a level 5 Scientist aboard</color>
	techRequired = life_stationHabitation
	entryCost = 0
}

// --- Universal Storage 2 life-support / chemical-plant slot upgrades ---------
// Upstream (KerbalismConfig/Support/US2.cfg) gives THREE parts an UPGRADE named
// `Upgrade-Slots` under two different techs -- USWaterPurifier at
// improvedLifeSupport, USSabatier + USElektron at longTermLifeSupport (remapped
// to life_stationHabitation / life_bioregenerativeECLSS by AxeKerbalismTechRemap
// .cfg). One name cannot carry two techs: LinkUpgrades() keys the dictionary by
// name and FIRST ONE SEEN WINS, so all three silently shared whichever tech
// PartLoader happened to reach first -- either the chemical plants unlocked three
// tiers early or the life-support module three tiers late, depending on load
// order. Splitting the name is what makes the two authored gates both real.
@PART[USSabatier|USElektron]:HAS[@MODULE[Configure]]:NEEDS[UniversalStorage2,Kerbalism]:AFTER[RP-AXE]
{
	@MODULE[Configure],*
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Upgrade-Slots]],* { @name__ = AXE-US2-ChemPlant-Slots }
		}
	}
}

@PART[USWaterPurifier]:HAS[@MODULE[Configure]]:NEEDS[UniversalStorage2,Kerbalism]:AFTER[RP-AXE]
{
	@MODULE[Configure],*
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[Upgrade-Slots]],* { @name__ = AXE-US2-LifeSupport-Slots }
		}
	}
}

PARTUPGRADE:NEEDS[UniversalStorage2,Kerbalism]
{
	name = AXE-US2-LifeSupport-Slots
	partIcon = USWaterPurifier
	title = Life Support Wedge Slot Upgrade
	manufacturer = #roMfrGeneric
	description = Denser plumbing and a shared controller free up a third bay in the Universal Storage life-support wedge. <color=green>Life Support slots: 2 -> 3</color>
	techRequired = life_stationHabitation
	entryCost = 0
}

PARTUPGRADE:NEEDS[UniversalStorage2,Kerbalism]
{
	name = AXE-US2-ChemPlant-Slots
	partIcon = USSabatier
	title = Chemical Plant Slot Upgrade
	manufacturer = #roMfrGeneric
	description = A second reactor bay in the Universal Storage chemical plant wedges, so one plant can run two processes without flying a second wedge. <color=green>Chemical Plant slots: 1 -> 2</color>
	techRequired = life_bioregenerativeECLSS
	entryCost = 0
}
