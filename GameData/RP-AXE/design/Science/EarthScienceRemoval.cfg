// M5 Pass E — take Earth (homeworld) exploration out of the science economy.
// RP-1 leaves Earth's sub-40km science low-but-farmable (landed/splashed/flyingLow = 1). RP-AXE
// follows LRTR: near-zero everything below the 40 km flying threshold so you cannot grind science by
// driving around / hopping biomes / low passes on the home planet. Science must come from real
// spaceflight — high-altitude (>40 km), orbit, recovery, and above all OTHER bodies (whose multipliers
// are 2-50x Earth's, so this removal costs almost nothing in total available science).
//
// We keep >=40 km and orbital Earth science (flyingHigh / inSpaceLow / inSpaceHigh) — reaching them is
// genuine spaceflight, not "exploring Earth". Near-zero (not exactly 0) matches LRTR and avoids
// Kerbalism treating the situation as undefined.
//
// Runs :AFTER[RP-0] so it overrides RP-1's BodyScienceParams. Body is still named "Kerbin" at
// patch time (RSS renames it to Earth at runtime).
@Kopernicus:AFTER[RP-0]
{
	@Body[Kerbin]
	{
		@Properties
		{
			%ScienceValues
			{
				%landedDataValue = 0.00001
				%splashedDataValue = 0.00001
				%flyingLowDataValue = 0.001
				// flyingHighDataValue / inSpaceLowDataValue / inSpaceHighDataValue / recoveryValue
				// left at RP-1's values — that's >=40 km and orbit, which we keep.
			}
		}
	}
}
