// M5 Pass E — science pace ("Gentle trim"). RP-1's tree is ~215k science across 332 nodes — a
// punishing grind. RP-AXE scales every real node's science cost x0.8 (tree total -> ~172k, ~20%
// less grind) while keeping RP-1's realism and era structure intact. Science is finite (the world
// only holds so much; see EarthScienceRemoval.cfg), so we ease the *requirement* rather than inflate
// income — the fixed available science then goes further.
//
// Skips the free start node (cost 0) and our cost=1 browser/placeholder nodes. Runs :FINAL so it
// applies after RP-1's @TechTree and our placement/browser node additions.
@TechTree:FINAL
{
	@RDNode:HAS[~cost[0],~cost[1]]
	{
		@cost *= 0.8
	}
}
