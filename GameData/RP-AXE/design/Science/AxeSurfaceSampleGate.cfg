// ============================================================================
// RP-AXE: remap the one Kerbalism Configure SETUP tech-gate that lives in
// seed/Science/Experiments/SurfaceSample.cfg (which otherwise stays a verbatim
// RP-1 vendor). The "Deep Surface Sample" SETUP on the EVA-astronaut Configure is
// gated `tech = surfaceScience` (an RP-1 node absent from AXE) -> fail-closed. A
// late-pass overlay re-selects it to the AXE lunar-surface node, matching the
// RP0ALSEP/surfaceScience mapping used in design/Science/Configure.cfg.
// (Single gate -> a targeted overlay is fine; the bulk Configure.cfg is authored
// in full because doing all ~80 gates this way would be brittle.)
// ============================================================================
@PART[kerbalEVA*]:HAS[@MODULE[Configure]:HAS[#title[EVA?Astronaut]]]:LAST[RP-AXE]
{
	@MODULE[Configure]:HAS[#title[EVA?Astronaut]]
	{
		@SETUP:HAS[#name[Deep?Surface?Sample]]
		{
			@tech = fd_deepThrottleLanding
		}
	}
}
