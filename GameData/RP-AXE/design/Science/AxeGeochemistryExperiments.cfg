// ============================================================================================
// RP-AXE — Orbital Geochemistry experiments (docs/SCIENCE.md §6a).
// Companion to design/Parts/Science/AxeGeochemistry.cfg. Structure follows the vendored kit
// (seed/Science/Experiments/CosmicRay.cfg is the reference).
//
// THE MASKS ARE THE DESIGN, not the count.
//   situationMask = 48   -> runs in-space LOW and HIGH. The standard orbital-instrument mask.
//   biomeMask     = 16   -> biome-resolved in LOW space ONLY.
// Biome-splitting only the low pass is both the physics and the mechanic: Lunar Prospector mapped
// from 100 km and Mars Odyssey from 400 km because resolution demands it, and from high orbit you
// get one global average. So a lazy high orbit banks a single reading; a proper low mapping orbit
// pays per region. Of the 39 experiments AXE inherits, only the four RP0infraredRad* are
// biome-resolved from orbit at all, and they split both situations -- this family is the first to
// make the ALTITUDE the thing that decides. That is the new shape of science here, and the actual
// reason to add the category.
//
// VALUES ARE SET AGAINST THE BIOME MULTIPLIER, NOT THE HEADLINE NUMBER. Science is per subject =
// experiment x body x situation x biome, and `biomeValue` sums a body's biome weights: Moon 8.5,
// Earth ~12, Mars 19, Pluto 20 (docs/SCIENCE.md §1b). So a biome-split experiment is worth roughly
// an order of magnitude more than its baseValue suggests, and the right benchmark is the other
// biome-from-orbit family -- RP0infraredRad1-4 at 2/3/4/6 -- NOT magScan (6/12/40) or massSpec
// (8/12/20/30), which are biome-blind or landed-only. 6/10/16 sits just above the radiometers,
// which is where a later and more consequential instrument belongs; against the biome-blind
// families it would read as absurdly cheap, and that reading is the trap.
// TODO before this is blessed: measure the real career total with tools/science_budget.py once the
// instance has booted with these in it. The arithmetic above is an estimate, not a measurement.
//
// dataScale + the 3-month data_rate are copied from CosmicRay: a long integration, which is
// exactly right for an instrument whose job is to build up a map.
// ============================================================================================

EXPERIMENT_DEFINITION
{
	id = AXEgammaRaySpec1
	title = Gamma-Ray Spectrometry
	baseValue = 6
	scienceCap = 6
	dataScale = 1.9656
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 16

	RESULTS
	{
		default = The gamma-ray spectrum of the surface below is recorded, and the peaks sorted into elements.
	}

	KERBALISM_EXPERIMENT { SampleMass = 0 }
}

EXPERIMENT_DEFINITION
{
	id = AXExrayFluorescence1
	title = X-Ray Fluorescence Spectrometry
	baseValue = 10
	scienceCap = 10
	dataScale = 1.9656
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 16

	RESULTS
	{
		default = The surface fluoresces under the Sun's X-rays, and the light rock-forming elements are read off the returning spectrum.
	}

	KERBALISM_EXPERIMENT { SampleMass = 0 }
}

EXPERIMENT_DEFINITION
{
	id = AXEneutronSpec1
	title = Neutron Spectrometry
	baseValue = 16
	scienceCap = 16
	dataScale = 1.9656
	requireAtmosphere = False
	situationMask = 48
	biomeMask = 16

	RESULTS
	{
		default = The epithermal neutron count comes back suppressed, and the hydrogen hiding under the surface is mapped.
	}

	KERBALISM_EXPERIMENT { SampleMass = 0 }
}

// ============================================================================================
// Kerbalism runtime tuning. Same pass and idiom the vendored experiments use, so these land
// alongside them rather than fighting them.
// ============================================================================================
@PART[*]:HAS[@MODULE[Experiment]]:AFTER[RP-0-Kerbalism]
{
	@MODULE[Experiment]:HAS[#experiment_id[AXEgammaRaySpec1]]
	{
		%ec_rate = 0.0003
		%data_rate = 1.9656
		@data_rate /= 7862400          // 3 months: you are building a map, not taking a reading
		%resources =
		%experiment_desc = A scintillator counting gamma rays kicked out of the surface by cosmic rays. Reads potassium, thorium, uranium, iron and titanium. Biome-resolved from low orbit, so a proper mapping pass makes every region its own measurement.
	}
	@MODULE[Experiment]:HAS[#experiment_id[AXExrayFluorescence1]]
	{
		%ec_rate = 0.0004
		%data_rate = 1.9656
		@data_rate /= 7862400
		%requires = Sunlight             // no solar X-rays, no fluorescence
		%resources =
		%experiment_desc = Proportional counters reading the surface's X-ray fluorescence under solar illumination. Finds magnesium, aluminium and silicon, which gamma-ray spectrometry reads poorly. Requires sunlight, and is biome-resolved from low orbit.
	}
	@MODULE[Experiment]:HAS[#experiment_id[AXEneutronSpec1]]
	{
		%ec_rate = 0.0005
		%data_rate = 1.9656
		@data_rate /= 7862400
		%resources =
		%experiment_desc = Counts the epithermal neutrons the surface fails to return. Suppression means hydrogen, and hydrogen means buried water ice. Biome-resolved from low orbit, so a polar map is built crater by crater.
	}
}
