// ============================================================================
// Make the authored lab `value` the actual science payout.
//
// Kerbalism 3.x pays out on scienceCap, NOT baseValue:
//     ExperimentInfo:  DataSize        = baseValue  * dataScale     (applyScienceScale = true)
//                      ScienceCap      = scienceCap * ScienceGainMultiplier
//     SubjectData:     ScienceMaxValue = ScienceCap * Situation.SituationMultiplier
//                      SciencePerMB    = ScienceMaxValue / DataSize
// A completed run collects DataSize MB, so it banks exactly scienceCap x situationMultiplier.
// baseValue only sizes the data stream.
//
// The fork authors its balance in the group `value` field, and Framework-3 writes that to baseValue
// only -- every fork EXPERIMENT_DEFINITION keeps its template literal `scienceCap = 180`. Without
// this patch all 71 lab experiments pay a flat 180 x multiplier and the creator's 10-500 value curve
// is inert: 13.07M theoretical instead of 1.23M (tools/lab_budget.py --model both).
//
// Upstream does this globally in KerbalismScienceOnly ScienceRework/Patches-Global.cfg, which AXE does
// not vendor (it also reconfigures stock experiments AXE owns). Scoped here to the lab set instead:
// `kerbalism_*` matches exactly the 65 fork + 6 base experiments this folder ships and nothing else.
// Deployed/Serenity experiments are excluded by that scope anyway -- they use baseValue as an hourly
// rate and scienceCap as the total, so equalising them would be wrong.
//
// Ordering: must run after Framework-3 and the per-experiment patches set baseValue from `value`,
// which they do at :FOR[zzzKerbalismDefault]. Same stage upstream uses.
// ============================================================================

@EXPERIMENT_DEFINITION:HAS[#id[kerbalism_*]]:NEEDS[FeatureScience]:AFTER[zzzKerbalismDefault]
{
	@scienceCap = #$baseValue$
}
