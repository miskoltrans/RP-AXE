// KerbalismLab framework subset (Path A — docs/KERBALISMLAB.md §2, piece D).
// Attach the "Laboratory Experiments" Configure host to AXE's crewed-lab parts.
//
// This one patch is what turns a part into a lab: the fork's 65 experiments + 6 base experiments all
// self-attach to ANYTHING carrying a Configure module titled "Laboratory Experiments" (see
// Framework-3-LabProcessing.cfg + Experiments/*.cfg). In stock KerbalismScienceOnly the host is added
// keyed on ModuleScienceLab; AXE converts labs to the Kerbalism `Laboratory` module at a later MM pass,
// so we attach by explicit part name at :FIRST — robust to that conversion timing.
//
// REVIEW POINT (parts): this is the AXE crewed-lab set. Add/remove parts here to change which vehicles
// can run station science. Crewless pallets are harmless to include (the crew gate blocks them anyway).

@PART[Large_Crewed_Lab|L25mSci|FASAGeminiMOLSci|ROC-ApolloMissionModule4|aquila_lab_s1_1|aquila_lab_s1p5_1|aquila_lab_s1p5_2|sspx-lab-375-1|sspx-lab-5-1|sspx-lab-pallet-1|sspx-lab-pallet-2]:NEEDS[FeatureScience]:FIRST
{
	MODULE
	{
		name = Configure
		title = Laboratory Experiments
	}
}
