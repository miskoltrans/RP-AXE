// KerbalismLab — instrument tagging, RE-POINTED to AXE/RO parts (docs/KERBALISMLAB.md §3, polish pass).
//
// Each *LabExperimentPackage MODULE marks a part as carrying an instrument; an experiment with
// `requirements = Module:XLabExperimentPackage` needs such a part present on the vessel to run.
// The fork tagged stock science parts — but RO+HardRemoveNonRO strips most of them, so 6 packages had
// no host in AXE. Re-pointed here onto the equivalent RO/RP0* instrument (or a station part). The
// runtime requirement in each experiment cfg is unchanged; only the part carrying the tag moves.
//
// REVIEW POINT (parts): the part on the right of each block. Two were left on the surviving stock donor
// as a safe fallback (Radar->SurveyScanner) pending a confirmed RO analog.

// ============================ kept on the surviving stock donor ============================
// Materials Bay survives in AXE — in-lab materials science, no RO instrument analog.
@PART[*]:HAS[@MODULE[Experiment]:HAS[#experiment_id[mobileMaterialsLab]]]:NEEDS[FeatureScience] {
	MODULE { name = MaterialsLabExperimentPackage }
}
// Goo canister survives — in-lab biology, no RO instrument analog.
@PART[*]:HAS[@MODULE[Experiment]:HAS[#experiment_id[mysteryGoo]]]:NEEDS[FeatureScience] {
	MODULE { name = BiologyLabExperimentPackage }
}

// ============================ re-pointed onto RO / RP0* instruments ============================
// Magnetometer  (was: stock experiment `magnetometer`, deleted by RO)
@PART[RO-EarlyMagnet|RO-HeliumMagnet|RO-FluxgateMagnet]:NEEDS[FeatureScience] {
	MODULE { name = MagnetometerLabExperimentPackage }
}
// Gravity  (was: stock `gravityScan`, deleted by RO)
@PART[sensorGravimeter|retinaGravimeter]:NEEDS[FeatureScience] {
	MODULE { name = GravityLabExperimentPackage }
}
// Telescope  (was: stock `infraredTelescope`, deleted by RO) -> SSPX station telescope dome
@PART[sspx-cupola-telescope-125-1]:NEEDS[FeatureScience,StationPartsExpansionRedux] {
	MODULE { name = TelescopeLabExperimentPackage }
}
// Atmosphere  (was: stock `atmosphereAnalysis`, deleted by RO)
@PART[sensorAtmosphere|PAPBarometer|sensorBarometer]:NEEDS[FeatureScience] {
	MODULE { name = AtmosphereLabExperimentPackage }
}
// Visual  (was: `Cupola`, deleted by RO) -> the RO TV-camera ladder
@PART[RO-EarlyTVCamera|RO-BasicTVCamera|RO-ImprovedTVCamera|RO-AdvancedImager|RO-HIRES]:NEEDS[FeatureScience] {
	MODULE { name = VisualLabExperimentPackage }
}
// High-Energy / particle  (was: the ScienceBox clone, donor absent) -> RO cosmic-ray detectors
@PART[RO-GeigerMuller|FASAProbeGeigerCounter|RO-ScintillationCounter|RP0Cherenkov]:NEEDS[FeatureScience] {
	MODULE { name = HighEnergyLabExperimentPackage }
}
// Plasma  (fork put this on SurveyScanner) -> RO plasma-wave / solar-wind instruments
@PART[RO-PlasmaWave|RO-SWPlasmaAnalyzer|RO-RPWS]:NEEDS[FeatureScience] {
	MODULE { name = PlasmaLabExperimentPackage }
}
// Multispectral  (fork: OrbitalScanner) -> RO imaging spectrometers
@PART[RO-IRIS|RO-NIMS|RO-VIMS]:NEEDS[FeatureScience] {
	MODULE { name = MultispectralLabExperimentPackage }
}
// Spectrometer  (fork: OrbitalScanner) -> RO UV/IR spectrometers
@PART[RO-UVSpectrometer|RO-IRIS]:NEEDS[FeatureScience] {
	MODULE { name = SpectrometerLabExperimentPackage }
}

// Greenhouse  (was: Kerbalism's own `Greenhouse` MODULE) -> SSPX food-growing modules.
// NOT an instrument package in the fork -- `requirements = Greenhouse` is a Kerbalism built-in that
// tests `vd.Greenhouses.Count > 0`, i.e. the presence of the stock Kerbalism Greenhouse MODULE. The RO
// profile ships that part disabled (KerbalismConfig/Parts/Greenhouse/kerbalism-greenhouse.disabled) and
// re-implements food growing as a `ProcessController` instead, so a merged AXE cache contains ZERO
// Greenhouse modules and the requirement could never pass -- ADVASC, PWM-4, ORZS-3 and the base CHILLED
// were unrunnable, silently. Same failure as the 6 packages above (a fork requirement whose host RO
// removed), so it gets the same treatment: a marker module, and the experiments re-pointed onto it by
// tools/build_kerbalismlab.py (REQ_REPOINT).
// Membership is by MECHANISM, checked against the merged cache: exactly these 5 parts carry a
// `ProcessController` with `resource = _algae` (the RO profile's food process). `sspx-cupola-greenhouse-125-1`
// is deliberately NOT here -- despite the name it is a window dome with no food process at all.
// Earliest carrier is sspx-greenhouse-25-1 at life_bioregenerativeECLSS (T11), which is also exactly
// where ADVASC / PWM-4 / ORZS-3 unlock.
@PART[sspx-greenhouse-25-1|sspx-greenhouse-375-1|sspx-greenhouse-5-1|sspx-dome-greenhouse-5-1|sspx-aquaculture-375-1]:NEEDS[FeatureScience,StationPartsExpansionRedux] {
	MODULE { name = GreenhouseLabExperimentPackage }
}

// ============================ kept: donor survives in AXE ============================
// Radar -> SurveyScanner survives (safe fallback; swap to an RO radar-altimeter instrument if desired).
@PART[SurveyScanner]:NEEDS[FeatureScience] {
	MODULE { name = RadarLabExperimentPackage }
}
// Surface -> SurfaceScanner survives.
@PART[SurfaceScanner]:NEEDS[FeatureScience] {
	MODULE { name = SurfaceLabExperimentPackage }
}
// Fluid (underwater) -> sensorAtmosphere survives.
@PART[sensorAtmosphere]:NEEDS[FeatureScience] {
	MODULE { name = FluidLabExperimentPackage }
}
// Drill -> stock/Kerbalism drills survive.
@PART[*Drill*]:NEEDS[FeatureScience] {
	MODULE { name = DrillLabExperimentPackage }
}

// Radio -> the fork's repurposed relay dish (RelayAntenna100 survives). Kept as-authored.
+PART[RelayAntenna100]:NEEDS[FeatureScience]:FOR[RP-AXE] {
	@name = AntennaRadioLab
	@title = RA-100T Radio Telescope
	@description = A specialized version of the RA-100 dish, repurposed as a radio telescope for scientific observations.
	@category = Science
	!MODULE[PlannerController] {}
	!MODULE[ModuleDataTransmitter] {}
	!MODULE[ModuleAntennaFeed] {}
	!MODULE[ModuleDataTransmitterFeedeable] {}
	!MODULE[ModuleRelayAntenna] {}
	!MODULE[Reliability] {}
	MODULE { name = RadioLabExperimentPackage }
}

// NOTE (docs/KERBALISMLAB.md §5): the fork's +PART[ScienceBox]->ScienceBox-HighEnergy clone is DELETED
// (donor ScienceBox absent in AXE); HighEnergy is covered by the RO cosmic-ray re-point above.

// ============================ third-party (inert unless the mod is present) ============================
@PART[scansat-radar*]:NEEDS[SCANsat,FeatureScience]   { MODULE { name = RadarLabExperimentPackage } }
@PART[scansat-sar*]:NEEDS[SCANsat,FeatureScience]     { MODULE { name = RadarLabExperimentPackage } }
@PART[scansat-multi*]:NEEDS[SCANsat,FeatureScience]   { MODULE { name = MultispectralLabExperimentPackage } }
@PART[scansat-recon*]:NEEDS[SCANsat,FeatureScience]   { MODULE { name = VisualLabExperimentPackage } }
@PART[scansat-resources*]:NEEDS[SCANsat,FeatureScience] { MODULE { name = SpectrometerLabExperimentPackage } }
