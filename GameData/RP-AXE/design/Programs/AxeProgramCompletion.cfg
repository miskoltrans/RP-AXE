// ============================================================================
// RP-AXE — programme completion bonuses. GENERATED by tools/build_economy.py; do not hand-edit.
//
// One contract per chartered programme, gated on ALL of that programme's `complete_contract`
// objectives plus the programme being active. Accepting it completes it on the spot (AXEInstant),
// so it reads as a payout for finishing the programme rather than a mission to fly.
//
// It is DELIBERATELY not `autoAccept`. It used to be, and the money worked — but the contract was
// offered, accepted and completed inside one frame, so it never appeared in Mission Control's
// Available or Active list and the player only ever saw an unexplained funds bump (both instances in
// the 2026-07 playtest save finished `viewed = Unseen`). Sitting in Mission Control as an offer costs
// one click and buys two things: the payout is legible when it lands, and a programme you have
// finished but not yet collected advertises what it is worth. AxeInstantComplete self-completes only
// once the contract is Active, so an un-accepted offer just waits — which is the point.
//
// It IS the ending, and the only one. The ConcludeProgram behaviour calls
// AxeProgramHandler.Conclude(), which drops the programme out of the active set, so it stops
// satisfying `ProgramActive` and its member contracts stop being offered — including the repeatable
// ones. Closure is earned, never chosen: this contract is not offered until every objective is
// complete, and there is no path to abandon a programme mid-flight. Of the 35 chartered programmes
// 34 can be finished by flying their objectives, so an abandon path would have existed to serve one
// upstream config artefact, which the reachability gate in the generator now prunes instead.
//
// Contracts of the programme the player has ALREADY ACCEPTED survive and stay flyable; only the
// offering stops. That is ProgramActiveRequirement's `checkOnActiveContract = false` (AXE diverges
// from RP-1 here, deliberately) — without it, CC responds to a mid-flight requirement going unmet by
// calling Contract.Fail(), and stock's Fail() charges failure penalties. Collecting your reward for
// finishing a programme must not fine you for the repeatable mission still in the air.
//
// This is the half of the budget that reaches every programme. 21 of 35 chartered
// programmes have no capstone at all — including CrewedLunar and CrewedMarsExp — so without this
// whole eras would earn nothing. Programmes WITH a capstone split their budget with it
// (50% / 50%); programmes without put all of it here.
//
// `rewardFunds` here is the RETAINED SLICE, not the whole completion half. Since 2026-07-29 the
// completion pot is staged across the programme's own objectives (design/Programs/
// AxeProgramObjectiveFunds.cfg, docs/ECONOMY.md §11) and this contract keeps one slice of
// `objectives + 1`, so a programme pays as you fly it instead of only at the end. The bonus is kept
// as a real payout rather than dropped to zero because it is the only in-game readout of a
// programme's value — see the autoAccept note above.
//
// Never expires (minExpiry = maxExpiry = 0): Contract Configurator defaults to withdrawing an offer
// after 5–100 days, and AXE does not gate time. Same rule as the Begin Programme charters.
// ============================================================================

CONTRACT_GROUP
{
	name = AXEProgramCompletion
	displayName = AXE Programme Completion
	minVersion = 1.12.2
}

