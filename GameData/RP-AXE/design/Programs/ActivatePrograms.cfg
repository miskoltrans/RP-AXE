// M4 program switcher (config side). Each "Begin Program" contract, when accepted, fires the
// ActivateProgram behaviour -> AxeProgramHandler marks the program active -> contracts gated by
// `ProgramActive { program = X }` start being offered. The AXEInstant parameter completes the
// charter immediately at the space centre.
//
// Guidance chain: the first three are always available; later programs require an earlier program
// to be active, forming an onboarding DAG (theme + funding order). The gating is flavour/onboarding,
// not a hard tech lock. Coverage is COMPLETE: every live program referenced by a seed contract has a
// charter here.
//
// Deliberately omitted: the 5 programs RP-1 ships with `isDisabled = true` — CommercialApplications1,
// CommercialApplications2, GEOCommNetwork, CrewedOrbit, CrewedSpaceplaneDev. They are superseded by
// the Skopos commercial series and the CrewedOrbitEarly/Adv track. Leaving them un-chartered keeps
// their seed contracts dormant (never offered), matching RP-1. Add a charter below to re-enable one.
//
// Charters never expire (minExpiry = maxExpiry = 0). Contract Configurator's DEFAULT is
// minExpiry = 5 / maxExpiry = 100 — an offer withdraws itself after a random 5–100 days unless it
// explicitly writes 0 — so without these lines every "Begin Program" offer silently vanished from
// Mission Control and the program became unreachable until it happened to be re-offered. A charter
// is an onboarding choice, not a timed opportunity, and AXE does not gate time anyway (no KCT, no
// deadlines, no upkeep — docs/PROGRAMS.md "Economy model"). Written per-contract rather than as a
// blanket patch on purpose: this is a rule about AXE's own charters, not about RP-1's seed
// contracts, which keep RP-1's own expiry behaviour.
//
// NOTE: KSP config is line-based — one key = value per line. Keep PARAMETER/BEHAVIOUR/REQUIREMENT
// blocks expanded (do NOT collapse onto one line).

CONTRACT_GROUP
{
	name = AXEPrograms
	displayName = AXE Programs
	minVersion = 1.12.2
}

