// M4 program switcher (config side). Each "Begin Program" contract, when accepted, fires the
// ActivateProgram behaviour -> AxeProgramHandler marks the program active -> contracts gated by
// `ProgramActive { program = X }` start being offered. The AXEInstant parameter completes the
// charter immediately at the space centre.
//
// Guidance chain: the first three are always available; later programs require an earlier program
// to be active (a light, ahistorical-friendly tech-agnostic sequence). Tune / expand coverage later
// (only ~12 early programs here; remaining programs in docs/PROGRAMS.md need their own charters).

CONTRACT_GROUP
{
	name = AXEPrograms
	displayName = AXE Programs
	minVersion = 1.12.2
}

// ---- helper note: every charter shares this shape ----
//   name, title, group, prestige, maxCompletions=1, maxSimultaneous=1
//   PARAMETER AXEInstant ; BEHAVIOUR ActivateProgram program=<P> ; [REQUIREMENT ProgramActive ...]

// ===== Tier 0 — always available =====
CONTRACT_TYPE
{
	name = AXE_Begin_SuborbRocketDev
	group = AXEPrograms
	title = Begin Program: Suborbital Rocket Development
	description = Stand up a program to develop the first liquid-fuelled sounding rockets.
	synopsis = Start the Suborbital Rocket Development program.
	completedMessage = Suborbital Rocket Development is now active.
	prestige = Trivial
	maxCompletions = 1
	maxSimultaneous = 1
	PARAMETER { name = auth type = AXEInstant title = Authorise the program }
	BEHAVIOUR { name = activate type = ActivateProgram program = SuborbRocketDev }
}
