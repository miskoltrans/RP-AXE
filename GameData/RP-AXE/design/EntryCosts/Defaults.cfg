// M3 Pass D (v1): establish a funds sink. RP-1 left most part entryCost at 1 (it priced parts via
// its plugin tooling, which we removed). Give those parts a conservative, category-based default so
// unlocking costs *something*. This is a PLACEHOLDER: the real per-part values come from LRTR's
// tree/parts (see docs/ENTRYCOSTS.md) once the shipped part set is fixed and we can balance in-game.
//
// Only touches parts currently at entryCost = 1 (RP-1's marker); RO-priced parts are left alone.
// Order matters: specific categories first, generic fallback last (a part is repriced once, then no
// longer matches entryCost[1]).

@PART:HAS[#entryCost[1],#category[Pods]]:AFTER[RP-AXE]          { %entryCost = 10000 }
@PART:HAS[#entryCost[1],#category[Command]]:AFTER[RP-AXE]       { %entryCost = 10000 }
@PART:HAS[#entryCost[1],#category[Engine]]:AFTER[RP-AXE]        { %entryCost = 6000 }
@PART:HAS[#entryCost[1],#category[Propulsion]]:AFTER[RP-AXE]    { %entryCost = 6000 }
@PART:HAS[#entryCost[1],#category[Science]]:AFTER[RP-AXE]       { %entryCost = 4000 }
@PART:HAS[#entryCost[1],#category[Communication]]:AFTER[RP-AXE] { %entryCost = 3000 }
@PART:HAS[#entryCost[1],#category[Aero]]:AFTER[RP-AXE]          { %entryCost = 2500 }
@PART:HAS[#entryCost[1],#category[Electrical]]:AFTER[RP-AXE]    { %entryCost = 2000 }
@PART:HAS[#entryCost[1],#category[FuelTank]]:AFTER[RP-AXE]      { %entryCost = 1500 }

// fallback: any remaining part still at entryCost = 1
@PART:HAS[#entryCost[1]]:AFTER[RP-AXE]                          { %entryCost = 2000 }
