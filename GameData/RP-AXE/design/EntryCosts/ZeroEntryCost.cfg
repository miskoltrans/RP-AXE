// RP-AXE economy (decision: parts free to unlock, RealFuels engine-CONFIG costs kept).
// We do NOT use BypassEntryPurchaseAfterResearch — that switch ALSO disables RealFuels' config
// charging (RP0/Harmony/RealFuels.cs gates config cost on it, and RealFuels.dll honours it). Instead
// we zero every part's entryCost so unlocking the PART is free (no funds), while RealFuels' separate
// EntryCostManager keeps charging to develop each engine CONFIG/variant (the engineering gate).
//
// NOTE: RealFuels / ProceduralParts may recompute a part's entryCost at runtime; if the probe shows
// parts still priced in-game, we follow this with a plugin that zeroes AvailablePart.entryCost after
// modules load. Supersedes the old category-default EntryCosts/Defaults.cfg.
@PART[*]:FINAL
{
	%entryCost = 0
}
