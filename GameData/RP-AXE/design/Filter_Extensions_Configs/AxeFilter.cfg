// Filter Extensions subcategory so you can browse everything RP-AXE placed/changed as a dedicated
// filter in the editor parts panel. Filters on the ModuleAxeMarker we add to those parts.
SUBCATEGORY
{
	name = RP-AXE
	displayName = RP-AXE
	icon = Experiment

	FILTER
	{
		CHECK
		{
			type = moduleName
			value = ModuleAxeMarker
		}
	}
}
