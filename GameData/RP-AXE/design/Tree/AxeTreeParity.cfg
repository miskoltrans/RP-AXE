// RP-AXE tree parity — restore RP-1's INTENDED tech-tree node for parts that RP-1's generated
// TREE-Parts.cfg fails to place (upstream generator gaps), so they don't fall back to ProceduralParts'
// native `TechRequired = start` and leak onto the start node.
//
// Scope rule (per the project's tree-parity invariant): RP-AXE's tree must be 1:1 with RP-1, the only
// deliberate deltas being the start node and the orphan/debug browser nodes. This file is ONLY for
// "restore the node RP-1 means to use" — never a place for new RP-AXE design choices.
//
// Reference for each node = RP-1's own tree-source data
//   RP-1/Source/Tech Tree/Parts Browser/data/*.json  (the `technology` field)
//   + original_sheet_data/PartsSheet.csv.
// Found by `tools/tree_parity.py` (the STRANDED bucket). Re-run it after any RP-1 re-sync to catch new
// gap victims.
//
// We set ONLY TechRequired (no cost/entryCost/category): RP-AXE's economy zeroes entryCost
// (ZeroEntryCost.cfg) and unlocks free with science, so the gate is "research the node", exactly RP-AXE's
// science-driven model. The part stays visible/usable as in RP-1; it's just gated where RP-1 gates it.

// proceduralSRBRealFuels (Solid Rocket Motor [Procedural]): RealFuels renames proceduralTankSRB ->
// proceduralSRBRealFuels; RP-1's generator never emits the placement for the renamed name, so it keeps
// the ProceduralParts native `start`. RP-1 intends solids1958 (entryCost 50000, era 02-SAT).
@PART[proceduralSRBRealFuels]:FINAL
{
	%TechRequired = solids1958
}
