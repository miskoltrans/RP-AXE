// RP-AXE Avionics Core (V2)
// -------------------------
// Replaces RP-1's mass-gated avionics with a single procedural "core". All control logic lives in
// AXE.dll (ModuleAxeAvionics + AxeAvionicsController); THIS core has no hard controllable-mass gate
// -- what going over capacity costs is a selectable consequence (Source/AXE/Avionics/AxeControlPenalty.cs,
// docs/AVIONICS_PLAN.md), shared by the procedural core and the named parts alike. The EC overload penalty
// this comment used to describe was deleted: it was inert against a ~39-hour battery in a 6-10 minute
// ascent, and RP-1 has no overload EC term either, so removing it is parity rather than divergence.
// Named parts (Sputnik, Voyager, an Apollo CM, a guidance ring) are the other half of the system and do
// keep RP-1's mass rule: they carry authored, unsizeable hardware, so design/Parts/AxeFixedAvionics.cfg
// gives them a fixed capacity and going over it locks attitude (ModuleAxeFixedAvionics). The penalty
// exists to soften a sizing mistake; a fixed part has no sizing decision to get wrong.
//
// SCOPE: the three parts RP-1 also wires to one avionics module -- `proceduralAvionics` (ProceduralParts,
// the grey box, `start`), `ROT-ProbeCore` (ROTanks, the Probe Bus, th_hermeticBus) and reDIRECT's
// `ROT-reDIRECTAvionics` if installed. Same mechanics, two different shape drivers; ModuleAxeAvionics
// reads ProceduralPart.Volume or ModuleROTank.Volume, whichever the part has.
//
// What this patch does to those parts:
//   * retitle ("Avionics Core [Procedural]" / "Probe Bus [Procedural]")
//   * strip the three dead RP0.dll husk modules (ModuleProceduralAvionics / ModuleToolingProcAvionics /
//     ModuleRangeSafety). They are unresolved without RP0.dll and pinned the part at ~4t by freezing its
//     ModuleFuelTanks volume; removing them lets the RealFuels Battery tank resize normally.
//   * add ModuleAxeAvionics. Two independent VAB-frozen toggles:
//       - Guided/Unguided (Near-Earth/Science-Core): Guided derives hardware mass from the player's own
//         battery/hardware/empty-space volume split (Allocation PAW button), runs it through the inverse
//         of the mass polynomial to get a CAPACITY ("how much vessel mass this core can steer"), and
//         penalizes EC draw smoothly (not a lock) once live vessel mass exceeds the vessel's effective
//         capacity (MAX across active cores). Unguided keeps RP-1's flat per-tier mass, no capacity concept.
//       - Unshielded/Shielded (Guided only, RP-1's Deep-Space): Shielded is its own full mass/cost ladder
//         (own massConstant/costConstant/powerConstant + per-tier shMassFactor/shCostFactor), not a
//         multiplier, unlocked ~10 tiers late of Guided's own ladder; it also unlocks a deep hibernate
//         depth from its own tier 0, where Unshielded only reaches a shallow depth from a late tier.
//     EC DRAW runs live off DRY mass (steady on fuel burn, steps down on staging), fed straight into stock
//     ModuleCommand's own EC input resource -- an empty battery loses control via KSP's own control-source
//     logic, same as RP-1, no custom brownout check. Draw also auto-drops to the hibernate-equivalent rate
//     while on rails (timewarp), independent of the manual Hibernate toggle (ported from RP-1's
//     ModuleAvionics). A "Set to Debris: Never/On Stage" toggle (also ported from RP-1) keeps a spent
//     avionics-carrying stage from cluttering the tracking station after separation.
//     Per-tier factors for both axes come from the TIER nodes below.
//   * hand the ModuleCommand EC input to ModuleAxeAvionics (which sets its live rate every update, or zeroes it
//     when Kerbalism is present to avoid double-counting) and disable stock hibernation.
//   * set ModuleSAS to level 3 (full SAS once guidance is active, matching RP-1).
//   * mark as an RP-AXE change + keep it on the `start` node.
//
// Range is NOT gated here (no near-Earth/deep-space distance lock) — that belongs to comms (RealAntennas).
// Kerbalism radiation-reliability wiring (docs/AVIONICS_SPEC.md) is deliberately NOT part of this pass --
// Kerbalism's Reliability feature is off instance-wide; that's a separate, later, game-wide balance task.
//
// :LAST[RP-AXE] runs after seed's :FOR[RP-0] pass and before StartParts.cfg's :FINAL repoint.

// Applies to BOTH procedural shape drivers. ProceduralParts drives `proceduralAvionics` (the grey box);
// ROTanks' ModuleROTank drives ROT-ProbeCore and reDIRECT's avionics. ModuleAxeAvionics reads whichever
// is present (ReadProceduralVolume) -- RP-1 wires the exact same three parts to one module for the same
// reason. Per-part identity (title, description, default shape, tree node) is set in the follow-up
// patches below, so nothing here can clobber a curated placement.
@PART[proceduralAvionics|ROT-ProbeCore|ROT-reDIRECTAvionics]:LAST[RP-AXE]
{
	// --- strip the dead RP0.dll husk modules ---
	!MODULE[ModuleProceduralAvionics] {}
	!MODULE[ModuleToolingProcAvionics] {}
	!MODULE[ModuleRangeSafety] {}

	// --- heater load, as its OWN Kerbalism line ---
	// Kerbalism labels a resource contribution once per PartModule (ResourceSimulator applies the single
	// string returned by PlannerUpdate to every entry that call produced), so heaters can only appear as a
	// separate line in the planner if they are a separate module. It owns the thermal state; the avionics
	// core below pushes it the insulation coefficient and radiating area.
	MODULE
	{
		name = ModuleAxeThermal
		// Heaters defend the BATTERY -- the tightest-toleranced thing aboard, and the real reason
		// spacecraft carry heater tape. minK is a FLOOR the bus may drift down to for free, not a
		// setpoint to hold; that deadband is why a well-massed LEO satellite pays nothing.
		specificHeat   = 900   // J/kg.K, aluminium-ish structure
		setpointK      = 293   // 20 C nominal
		minK           = 273   // 0 C battery floor
		bodyIrFraction = 0.35  // albedo + planetary IR, as a fraction of the solar constant at that body
	}

	// --- the new unified avionics brain ---
	MODULE
	{
		name          = ModuleAxeAvionics
		guidanceTech  = gnc_postWarAvionics // FIX 2026-07-08: was bare "postWarAvionics", doesn't exist in
		                                    // AXE's own tree (only gnc_postWarAvionics does) -- GetTechnologyState()
		                                    // silently returns Unavailable on a miss, so GuidanceUnlocked was
		                                    // permanently false and Guided avionics could never reach real
		                                    // control in any non-sandbox campaign, regardless of research.
		// EC DRAW curve (live DRY mass): watts = (dryMass^exp + const) * powerFactor(tier)
		powerExponent = 0.57853
		powerConstant = 1.035
		// (idleFactor deleted 2026-08-05 -- idle/disengaged no longer reduces draw at all. Hibernation is
		// the power feature; engage/disengage is a control feature. See ModuleAxeAvionics.ComputeWatts.)
		hibernationFactor = 0.05 // Shielded hibernate depth (tier-invariant, RP-1 deep-space depth); Unshielded's own depth is unshHibernateFactor per TIER below
		// HARDWARE MASS curve, run INVERTED (V2): hwVolume * density -> mass; capacity = inverse of
		// t = (capacity^exp + const) * massFactor(tier) / 1000, solved for capacity given a known mass.
		massExponent  = 0.46172
		massConstant  = 0.96
		// HARDWARE COST curve (RP-1 Near-Earth, same load basis as mass, frozen at launch, no /1000):
		// funds = (load^exp + const) * costFactor(tier). Science-Core cost is flat scCostFactor(tier) funds.
		costExponent  = 0.46172
		costConstant  = 3.034
		// Shielded axis (V2 redesign): own full ladder, ground-truthed against RP-1's real Deep-Space
		// AVIONICSCONFIG (RP-1/GameData/RP-1/Tree/ProceduralAvionics.cfg) -- same exponents as Unshielded,
		// own constants (shMassFactor/shCostFactor per TIER below; shPowerFactor reuses powerFactor, verified
		// byte-identical to Unshielded at every corresponding tier in RP-1's real data).
		shMassConstant = 1.043
		shCostConstant = 9.1
		shPowerConstant = 1.096
		// extra surface-area-scaled shielding mass RP-1 adds on top of the curve mass for Deep-Space
		// (GetShieldingMass: avionicsMass^(2/3) * shieldingMassFactor), tier-invariant. Mass only, no cost equivalent.
		shieldingMassFactor = 0.1
		// volume emulation: hardware reserves (mass / avionicsDensity) m^3 of the part; the rest is EC battery
		avionicsDensity = 0.5
		// NOTE: no powered-brownout gate here. The live draw feeds stock ModuleCommand's own EC input resource
		// (ModuleAxeAvionics.UpdateRate) -- an empty battery loses control via KSP's own control-source logic,
		// same as RP-1. No custom hysteresis/reserve-seconds check.

		// per-tier factors for BOTH models (single source of truth, mirrored by tools/avionics_compare.py).
		// Near-Earth (massFactor/powerFactor/costFactor = RP-1 Near-Earth ladder, vessel-scaled); Science-Core
		// (scMassFactor[kg]/scPowerFactor[W]/scCostFactor[funds] = RP-1 Science-Core flat per-tier values,
		// scDensity = hardware density t/m^3, scAllowAxial = axial-thrust control). hasScienceContainer gates
		// ModuleScienceContainer (RP-1: on from basicAvionics, both models). kos* = RP-1 Near-Earth's kOS
		// per-tier disk/power/cost/mass scaling, applied to a kOSProcessor module if present (either model —
		// kOS isn't currently an AXE dependency, so this is a no-op until it is). tier-0 (`start`) is the
		// UNCONDITIONAL floor (no research needed, ApplyTier always starts there) — its NE numbers equal
		// postWarAvionics' (RP-1 Near-Earth has no rung below `start`), but its SC numbers are RP-1 Science-
		// Core's own heavier `start` techLevel (48 kg/100 W/density 3.35), one rung below RP-1's SC
		// `postWarAvionics`. Without this, AXE's earliest Science-Core was lighter than RP-1's actual starting
		// one. tiers 1-13 gate on AXE's OWN tech-tree node IDs, each commented with the RP-1 tier name it
		// corresponds to for cross-referencing (see docs/AVIONICS_SPEC.md "KNOWN LIVE BUG" for the full
		// investigation). FIX 2026-07-08: these were previously RP-1's bare tech names (e.g. "postWarAvionics"),
		// which don't exist as node IDs anywhere in AXE's own from-scratch tree -- GetTechnologyState() silently
		// returns Unavailable on an unrecognized ID, so `Researched()` always failed past tier 0 and every core
		// was permanently frozen at the `start` floor regardless of research. Tiers 1-4 were a clean prefix fix
		// (AXE kept the same name, just discipline-prefixed); tiers 5-13 were fully renamed during the tree
		// rebuild with no lexical relation to the original RP-1 name, recovered only via a dead
		// `Science-Core-<name>` PARTUPGRADE comment left behind in the tree data. Edit/extend without a
		// rebuild; remove to fall back to the in-code copy (all mass/power/density/axial keys are required per
		// tier, else that tier is dropped; cost/kOS/science-container keys are optional, default 0/false).
		// shMassFactor/shCostFactor (optional, default 0 = "no Shielded rung at this tier") add a Shielded-
		// axis rung, GATED BY shTech -- the shd_* tree node the player must research to unlock it (2026-07-14:
		// the Shielded axis is its own investment on the shd_* lane, not free with the guided gnc_/comp_ tier
		// at the same index). unshHibernateFactor (optional, default -1 = "can't hibernate yet") marks the tier
		// where Unshielded's own shallow hibernate depth unlocks. RP-1 has no Deep-Space data before
		// basicAvionics, so tiers start/gnc_postWarAvionics/gnc_avionicsPrototypes/gnc_earlyAvionics carry a
		// reused-for-symmetry shMassFactor but NO shTech -- with no shd_ node to gate them they are never
		// selectable (ApplyShieldedTier skips any rung lacking an shTech). The Shielded TOGGLE appears once the
		// player has researched a real Shielded tier (ShieldedUnlocked => a researched shTech, in ModuleAxeAvionics.cs).
		//
		// ============================================================================================
		// ONE `key = value` PER LINE. DO NOT COMPACT THESE BACK INTO A TABLE.
		//
		// These blocks were written as a readable 14-row table, several assignments per line, and that
		// made the WHOLE LADDER INERT for as long as it existed. KSP's ConfigNode splits a line at the
		// FIRST '=' and takes everything after it as the value (decompiled: `int num = str.IndexOf('=')`),
		// so `tech = start   massFactor = 87.99   costFactor = 48.12` parsed as ONE key, `tech`, whose
		// value was the rest of the line. massFactor/powerFactor/costFactor/... were not keys at all,
		// every TryGetValue below returned false, and the all-or-nothing guard in ModuleAxeAvionics
		// (`if (mf <= 0f || pf <= 0f || ...) continue;`) dropped EVERY tier -- so `tech.Count == 0` and
		// the module silently fell back to its hardcoded in-code ladder.
		//
		// It looked fine because the in-code fallback is complete and identical to this table, so the
		// game behaved correctly and nothing logged a warning. It surfaced only when a ModuleManager
		// patch tried to scale costFactor and had nothing to bind to -- you cannot patch keys that are
		// not keys. Fixed 2026-07-30, values verified unchanged tier-by-tier against the C# arrays.
		//
		// Compacting this table again would re-break it in exactly the same silent way.
		// ============================================================================================
		TIER
		{
			// reused from Unshielded -- no RP-1 Deep-Space data this early
			tech = start
			massFactor = 87.99
			powerFactor = 56.415
			costFactor = 48.12
			scMassFactor = 48
			scPowerFactor = 100
			scCostFactor = 3
			scDensity = 3.35
			scAllowAxial = false
			hasScienceContainer = false
			kosDiskSpace = 500
			kosSpaceCostFactor = 0.1
			kosSpaceMassFactor = 0.0001
			kosECPerInstruction = 0.000001
			shMassFactor = 87.99
			shCostFactor = 48.12
		}
		TIER
		{
			// RP-1: postWarAvionics
			// reused from Unshielded -- no RP-1 Deep-Space data this early
			tech = gnc_postWarAvionics
			massFactor = 87.99
			powerFactor = 56.415
			costFactor = 48.12
			scMassFactor = 33
			scPowerFactor = 50
			scCostFactor = 6
			scDensity = 2.4
			scAllowAxial = false
			hasScienceContainer = false
			kosDiskSpace = 500
			kosSpaceCostFactor = 0.1
			kosSpaceMassFactor = 0.0001
			kosECPerInstruction = 0.000001
			shMassFactor = 87.99
			shCostFactor = 48.12
		}
		TIER
		{
			// RP-1: avionicsPrototypes
			// reused from Unshielded -- no RP-1 Deep-Space data this early
			tech = gnc_avionicsPrototypes
			massFactor = 69.712
			powerFactor = 47.851
			costFactor = 51.56
			scMassFactor = 17
			scPowerFactor = 25
			scCostFactor = 8
			scDensity = 1.4
			scAllowAxial = false
			hasScienceContainer = false
			kosDiskSpace = 500
			kosSpaceCostFactor = 0.1
			kosSpaceMassFactor = 0.0001
			kosECPerInstruction = 0.000004
			shMassFactor = 69.712
			shCostFactor = 51.56
		}
		TIER
		{
			// RP-1: earlyAvionics
			// reused from Unshielded -- no RP-1 Deep-Space data this early
			tech = gnc_earlyAvionics
			massFactor = 59.13
			powerFactor = 40.587
			costFactor = 54.13
			scMassFactor = 4
			scPowerFactor = 0.15
			scCostFactor = 10
			scDensity = 0.5
			scAllowAxial = false
			hasScienceContainer = false
			kosDiskSpace = 500
			kosSpaceCostFactor = 0.1
			kosSpaceMassFactor = 0.0001
			kosECPerInstruction = 0.000002
			shMassFactor = 59.13
			shCostFactor = 54.13
		}
		TIER
		{
			// RP-1: basicAvionics
			// RP-1 Deep-Space: basicAvionics (first REAL Shielded rung; shTech = shd_basicAvionics gates it, and the toggle unlocks here)
			tech = gnc_basicAvionics
			shTech = shd_basicAvionics
			massFactor = 50.153
			powerFactor = 34.426
			costFactor = 56.84
			scMassFactor = 1.5
