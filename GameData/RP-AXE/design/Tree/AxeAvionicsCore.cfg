			kosECPerInstruction = 0.0000002
			shMassFactor = 39.69
			shCostFactor = 94.0
		}
		TIER
		{
			// RP-1: matureAvionics
			// RP-1 Deep-Space: matureAvionics
			tech = comp_realTimeFlightComputer
			shTech = shd_realTimeFlightComputer
			massFactor = 30.605
			powerFactor = 21.007
			costFactor = 65.8
			scMassFactor = 0.73
			scPowerFactor = 0.073
			scCostFactor = 12
			scDensity = 0.5
			scAllowAxial = true
			hasScienceContainer = true
			kosDiskSpace = 20480
			kosSpaceCostFactor = 0.0025
			kosSpaceMassFactor = 0.0000001
			kosECPerInstruction = 0.0000001
			shMassFactor = 33.665
