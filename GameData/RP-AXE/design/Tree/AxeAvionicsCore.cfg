			kosSpaceMassFactor = 0.0000005
			kosECPerInstruction = 0.0000004
			shMassFactor = 46.794
			shCostFactor = 89.52
		}
		TIER
		{
			// RP-1: improvedAvionics
			// RP-1 Deep-Space: improvedAvionics
			tech = comp_digitalGuidanceComputer
			shTech = shd_digitalGuidanceComputer
			massFactor = 36.082
			powerFactor = 24.767
			costFactor = 62.67
			scMassFactor = 0.81
			scPowerFactor = 0.081
			scCostFactor = 12
