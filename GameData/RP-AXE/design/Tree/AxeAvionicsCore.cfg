			shMassFactor = 55.168
			shCostFactor = 85.26
		}
		TIER
		{
			// RP-1: interplanetaryProbes
			// RP-1 Deep-Space: interplanetaryProbes
			tech = gnc_interplanetaryAvionics
			shTech = shd_interplanetaryAvionics
			massFactor = 42.54
			powerFactor = 29.2
