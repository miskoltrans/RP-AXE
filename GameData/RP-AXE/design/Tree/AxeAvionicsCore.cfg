		}
		TIER
		{
			// RP-1: advancedAvionics
			// RP-1 Deep-Space: advancedAvionics; first Unshielded-hibernate-capable tier
			tech = comp_multiplyRedundantFlightComputer
			shTech = shd_multiplyRedundantFlightComputer
			massFactor = 22.018
			powerFactor = 15.113
			costFactor = 47.08
			scMassFactor = 0.59
