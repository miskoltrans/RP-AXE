// RP-AXE Avionics Core
// ---------------------
// Replaces RP-1's mass-gated avionics with a single procedural "core". All control logic lives in
// AXE.dll (ModuleAxeAvionics + AxeAvionicsController); there is NO controllable-mass gate anywhere.
//
// What this patch does to the existing `proceduralAvionics` part:
//   * retitle "Avionics Core [Procedural]"
//   * strip the three dead RP0.dll husk modules (ModuleProceduralAvionics / ModuleToolingProcAvionics /
//     ModuleRangeSafety). They are unresolved without RP0.dll and pinned the part at ~4t by freezing its
//     ModuleFuelTanks volume; removing them lets the RealFuels Battery tank resize normally
//     (volume -> EC capacity + dry mass + cost).
//   * add ModuleAxeAvionics (guidance unlock at postWarAvionics, on by default + toggleable). Avionics mass =
//     a HARDWARE curve (RP-1 Near-Earth mass coeffs on the per-craft load, frozen at launch) + the BATTERY
//     you size; EC DRAW runs live off vessel mass; per-tier mass/power factors come from the TIER nodes
//     below; runs dumb if the battery goes flat in flight. The hardware reserves its footprint out of the
//     part volume (RP-1-style, auto-growing the box to fit), the rest is EC battery.
//   * zero the ModuleCommand EC input so the avionics draw isn't double-counted.
//   * set ModuleSAS to level 3 (full SAS once guidance is active, matching RP-1).
//   * mark as an RP-AXE change + keep it on the `start` node.
//
// :LAST[RP-AXE] runs after seed's :FOR[RP-0] pass and before StartParts.cfg's :FINAL repoint.

@PART[proceduralAvionics]:LAST[RP-AXE]
{
	%title = Avionics Core [Procedural]
	@description = A single procedural avionics core: command, guidance, electric power, telemetry, science storage, SAS and flight computer in one resizable box. Uncrewed craft fly dumb (throttle and staging only) until guidance is researched. Size it to trade mass and drag against electric-power endurance.

	// --- strip the dead RP0.dll husk modules ---
	!MODULE[ModuleProceduralAvionics] {}
	!MODULE[ModuleToolingProcAvionics] {}
	!MODULE[ModuleRangeSafety] {}

	// --- the new unified avionics brain ---
	MODULE
	{
		name          = ModuleAxeAvionics
		guidanceTech  = postWarAvionics
		// EC DRAW curve (live vessel mass): watts = (mass^exp + const) * powerFactor(tier)
		powerExponent = 0.57853
		powerConstant = 1.035
		idleFactor    = 0.1
		// HARDWARE MASS curve (per-craft load, frozen at launch): t = (load^exp + const) * massFactor(tier) / 1000
		massExponent  = 0.46172
		massConstant  = 0.96
		// volume emulation: hardware reserves (mass / avionicsDensity) m^3 of the part; the rest is EC battery
		avionicsDensity = 0.5
		// flight power gate (hysteresis): go dumb below cutoff*draw of EC reserve, recover above recover*draw
		poweredCutoffSeconds  = 2
		poweredRecoverSeconds = 10

		// per-tier mass + power factors (RP-1 Near-Earth ladder; single source of truth, mirrored by
		// tools/avionics_compare.py). tier-0 is keyed to the guidance-gate tech postWarAvionics; tiers 1-12
		// match RP-1 node names. Edit/extend these without a rebuild; remove them to fall back to the in-code copy.
		TIER { tech = postWarAvionics       massFactor = 87.99   powerFactor = 56.415 }
		TIER { tech = avionicsPrototypes    massFactor = 69.712  powerFactor = 47.851 }
		TIER { tech = earlyAvionics         massFactor = 59.13   powerFactor = 40.587 }
		TIER { tech = basicAvionics         massFactor = 50.153  powerFactor = 34.426 }
		TIER { tech = interplanetaryProbes  massFactor = 42.54   powerFactor = 29.2   }
		TIER { tech = improvedAvionics      massFactor = 36.082  powerFactor = 24.767 }
		TIER { tech = matureAvionics        massFactor = 30.605  powerFactor = 21.007 }
		TIER { tech = largeScaleAvionics    massFactor = 25.959  powerFactor = 17.818 }
		TIER { tech = advancedAvionics      massFactor = 22.018  powerFactor = 15.113 }
		TIER { tech = nextGenAvionics       massFactor = 18.675  powerFactor = 12.819 }
		TIER { tech = longTermAvionics      massFactor = 15.84   powerFactor = 10.873 }
		TIER { tech = internationalAvionics massFactor = 13.436  powerFactor = 9.222  }
		TIER { tech = modernAvionics        massFactor = 11.396  powerFactor = 7.822  }
	}

	// hand the EC draw to ModuleAxeAvionics / Kerbalism (avoid double-counting with ModuleCommand)
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge] { %rate = 0 }
	}

	// Full SAS (level 3) once guidance is active, matching RP-1. AxeAvionicsController suppresses SAS while the
	// craft is dumb (no guidance / unpowered), so level 3 only takes effect when guidance is online.
	@MODULE[ModuleSAS] { @SASServiceLevel = 3 }

	// default shape is just a starting point: ModuleAxeAvionics auto-grows the box to fit the hardware
	// footprint (mass / avionicsDensity), then the player sizes it up further for battery endurance.
	@MODULE[ProceduralShapeCylinder]
	{
		@length   = 0.5
		@diameter = 0.5
	}

	// --- RP-AXE change marker + start placement ---
	%TechRequired = start
	%MODULE[ModuleAxeMarker] {}
	@description ^=:$: <b><color=#7fd3ff>[RP-AXE] unified avionics core</color></b>:
}

// The seed adds the same three dead RP0 modules to the sibling ROTanks probe cores
// (@PART[proceduralAvionics|ROT-ProbeCore|ROT-reDIRECTAvionics]:FOR[RP-0]). Strip them there too so
// they stop throwing "Cannot find a PartModule" at load. Strip-only: these stay plain probe cores
// (stock ModuleCommand control) — under the pure-a rule a bare probe core just grants control.
// (ROT-reDIRECTAvionics may not be installed; MM skips absent parts harmlessly.)
@PART[ROT-ProbeCore|ROT-reDIRECTAvionics]:LAST[RP-AXE]
{
	!MODULE[ModuleProceduralAvionics] {}
	!MODULE[ModuleToolingProcAvionics] {}
	!MODULE[ModuleRangeSafety] {}
}

// --- declutter: drop the now-inert RP-1 procedural-avionics PARTUPGRADEs (nothing reads them now) ---
!PARTUPGRADE[Near-Earth-*]:FINAL {}
!PARTUPGRADE[Science-Core-*]:FINAL {}
!PARTUPGRADE[Deep-Space-*]:FINAL {}
