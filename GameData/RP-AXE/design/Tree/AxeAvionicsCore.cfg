// RP-AXE Avionics Core
// ---------------------
// Replaces RP-1's mass-gated avionics with a single procedural "core". All control logic lives in
// AXE.dll (ModuleAxeAvionics + AxeAvionicsController); there is NO controllable-mass gate anywhere.
//
// What this patch does to the existing `proceduralAvionics` part:
//   * retitle "Avionics Core [Procedural]"
//   * strip the three dead RP0.dll husk modules (ModuleProceduralAvionics / ModuleToolingProcAvionics /
//     ModuleRangeSafety). They are unresolved without RP0.dll and pinned the part at ~4t by freezing its
//     ModuleFuelTanks volume; removing them lets the RealFuels Battery tank resize normally
//     (volume -> EC capacity + dry mass + cost).
//   * add ModuleAxeAvionics. A VAB-only toggle picks the as-built MODEL (frozen at launch): Near-Earth (guided,
//     heavy vessel-scaled hardware, full control) or Science-Core (unguided, light flat-mass sequencer, axial
//     thrust only at high tiers). Both: avionics mass = a HARDWARE curve + the BATTERY you size; EC DRAW runs
//     live off DRY mass (steady on fuel burn, steps down on staging); per-tier factors for both models come from
//     the TIER nodes below. Guidance unlocks at postWarAvionics; runs dumb if the battery goes flat. A flight-only
//     Hibernate toggle deep-sleeps the core (draw -> hibernationFactor, control suspended). The hardware reserves
//     its footprint out of the part volume (RP-1-style, auto-growing the box to fit), the rest is EC battery.
//   * zero the ModuleCommand EC input (no double-count) and disable stock hibernation.
//   * set ModuleSAS to level 3 (full SAS once guidance is active, matching RP-1).
//   * mark as an RP-AXE change + keep it on the `start` node.
//
// Range is NOT gated here (no near-Earth/deep-space distance lock) — that belongs to comms (RealAntennas).
//
// :LAST[RP-AXE] runs after seed's :FOR[RP-0] pass and before StartParts.cfg's :FINAL repoint.

@PART[proceduralAvionics]:LAST[RP-AXE]
{
	%title = Avionics Core [Procedural]
	@description = A single procedural avionics core: command, guidance, electric power, telemetry, science storage, SAS and flight computer in one resizable box. Uncrewed craft fly dumb (throttle and staging only) until guidance is researched. Size it to trade mass and drag against electric-power endurance.

	// --- strip the dead RP0.dll husk modules ---
	!MODULE[ModuleProceduralAvionics] {}
	!MODULE[ModuleToolingProcAvionics] {}
	!MODULE[ModuleRangeSafety] {}

	// --- the new unified avionics brain ---
	MODULE
	{
		name          = ModuleAxeAvionics
		guidanceTech  = postWarAvionics
		// EC DRAW curve (live DRY mass): watts = (dryMass^exp + const) * powerFactor(tier)
		powerExponent = 0.57853
		powerConstant = 1.035
		idleFactor    = 0.1     // Near-Earth draw multiplier while dumb (guidance off / browned-out)
		hibernationFactor = 0.05 // deep-sleep (Hibernate toggle) draw multiplier, RP-1 deep-space depth
		// HARDWARE MASS curve (per-craft load, frozen at launch): t = (load^exp + const) * massFactor(tier) / 1000
		massExponent  = 0.46172
		massConstant  = 0.96
		// HARDWARE COST curve (RP-1 Near-Earth, same load basis as mass, frozen at launch, no /1000):
		// funds = (load^exp + const) * costFactor(tier). Science-Core cost is flat scCostFactor(tier) funds.
		costExponent  = 0.46172
		costConstant  = 3.034
		// volume emulation: hardware reserves (mass / avionicsDensity) m^3 of the part; the rest is EC battery
		avionicsDensity = 0.5
		// flight power gate (hysteresis): go dumb below cutoff*draw of EC reserve, recover above recover*draw
		poweredCutoffSeconds  = 2
		poweredRecoverSeconds = 10

		// per-tier factors for BOTH models (single source of truth, mirrored by tools/avionics_compare.py).
		// Near-Earth (massFactor/powerFactor/costFactor = RP-1 Near-Earth ladder, vessel-scaled); Science-Core
		// (scMassFactor[kg]/scPowerFactor[W]/scCostFactor[funds] = RP-1 Science-Core flat per-tier values,
		// scDensity = hardware density t/m^3, scAllowAxial = axial-thrust control). hasScienceContainer gates
		// ModuleScienceContainer (RP-1: on from basicAvionics, both models). kos* = RP-1 Near-Earth's kOS
		// per-tier disk/power/cost/mass scaling, applied to a kOSProcessor module if present (either model —
		// kOS isn't currently an AXE dependency, so this is a no-op until it is). tier-0 (`start`) is the
		// UNCONDITIONAL floor (no research needed, ApplyTier always starts there) — its NE numbers equal
		// postWarAvionics' (RP-1 Near-Earth has no rung below `start`), but its SC numbers are RP-1 Science-
		// Core's own heavier `start` techLevel (48 kg/100 W/density 3.35), one rung below RP-1's SC
		// `postWarAvionics`. Without this, AXE's earliest Science-Core was lighter than RP-1's actual starting
		// one. tiers 1-13 gate on postWarAvionics..modernAvionics matching RP-1 node names. Edit/extend without
		// a rebuild; remove to fall back to the in-code copy (all mass/power/density/axial keys are required
		// per tier, else that tier is dropped; cost/kOS/science-container keys are optional, default 0/false).
		TIER { tech = start                 massFactor = 87.99   powerFactor = 56.415  costFactor = 48.12  scMassFactor = 48    scPowerFactor = 100    scCostFactor = 3   scDensity = 3.35 scAllowAxial = false  hasScienceContainer = false
			kosDiskSpace = 500     kosSpaceCostFactor = 0.1     kosSpaceMassFactor = 0.0001        kosECPerInstruction = 0.000001 }
		TIER { tech = postWarAvionics       massFactor = 87.99   powerFactor = 56.415  costFactor = 48.12  scMassFactor = 33    scPowerFactor = 50     scCostFactor = 6   scDensity = 2.4  scAllowAxial = false  hasScienceContainer = false
			kosDiskSpace = 500     kosSpaceCostFactor = 0.1     kosSpaceMassFactor = 0.0001        kosECPerInstruction = 0.000001 }
		TIER { tech = avionicsPrototypes    massFactor = 69.712  powerFactor = 47.851  costFactor = 51.56  scMassFactor = 17    scPowerFactor = 25     scCostFactor = 8   scDensity = 1.4  scAllowAxial = false  hasScienceContainer = false
			kosDiskSpace = 500     kosSpaceCostFactor = 0.1     kosSpaceMassFactor = 0.0001        kosECPerInstruction = 0.000004 }
		TIER { tech = earlyAvionics         massFactor = 59.13   powerFactor = 40.587  costFactor = 54.13  scMassFactor = 4     scPowerFactor = 0.15   scCostFactor = 10  scDensity = 0.5  scAllowAxial = false  hasScienceContainer = false
			kosDiskSpace = 500     kosSpaceCostFactor = 0.1     kosSpaceMassFactor = 0.0001        kosECPerInstruction = 0.000002 }
		TIER { tech = basicAvionics         massFactor = 50.153  powerFactor = 34.426  costFactor = 56.84  scMassFactor = 1.5   scPowerFactor = 0.1    scCostFactor = 12  scDensity = 0.5  scAllowAxial = false  hasScienceContainer = true
			kosDiskSpace = 500     kosSpaceCostFactor = 0.1     kosSpaceMassFactor = 0.0001        kosECPerInstruction = 0.000001 }
		TIER { tech = interplanetaryProbes  massFactor = 42.54   powerFactor = 29.2    costFactor = 59.68  scMassFactor = 1     scPowerFactor = 0.09   scCostFactor = 12  scDensity = 0.5  scAllowAxial = false  hasScienceContainer = true
			kosDiskSpace = 5120    kosSpaceCostFactor = 0.01    kosSpaceMassFactor = 0.0000005     kosECPerInstruction = 0.0000004 }
		TIER { tech = improvedAvionics      massFactor = 36.082  powerFactor = 24.767  costFactor = 62.67  scMassFactor = 0.81  scPowerFactor = 0.081  scCostFactor = 12  scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 10240   kosSpaceCostFactor = 0.005   kosSpaceMassFactor = 0.0000002     kosECPerInstruction = 0.0000002 }
		TIER { tech = matureAvionics        massFactor = 30.605  powerFactor = 21.007  costFactor = 65.8   scMassFactor = 0.73  scPowerFactor = 0.073  scCostFactor = 12  scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 20480   kosSpaceCostFactor = 0.0025  kosSpaceMassFactor = 0.0000001     kosECPerInstruction = 0.0000001 }
		TIER { tech = largeScaleAvionics    massFactor = 25.959  powerFactor = 17.818  costFactor = 58.85  scMassFactor = 0.66  scPowerFactor = 0.066  scCostFactor = 10  scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 51200   kosSpaceCostFactor = 0.001   kosSpaceMassFactor = 0.00000005    kosECPerInstruction = 0.00000008 }
		TIER { tech = advancedAvionics      massFactor = 22.018  powerFactor = 15.113  costFactor = 47.08  scMassFactor = 0.59  scPowerFactor = 0.059  scCostFactor = 9   scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 102400  kosSpaceCostFactor = 0.0005  kosSpaceMassFactor = 0.000000005   kosECPerInstruction = 0.00000004 }
		TIER { tech = nextGenAvionics       massFactor = 18.675  powerFactor = 12.819  costFactor = 37.67  scMassFactor = 0.53  scPowerFactor = 0.053  scCostFactor = 8.1 scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 204800  kosSpaceCostFactor = 0.00025 kosSpaceMassFactor = 0.000000002   kosECPerInstruction = 0.00000001 }
		TIER { tech = longTermAvionics      massFactor = 15.84   powerFactor = 10.873  costFactor = 30.13  scMassFactor = 0.48  scPowerFactor = 0.048  scCostFactor = 7.3 scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 307200  kosSpaceCostFactor = 0.0001  kosSpaceMassFactor = 0.000000001   kosECPerInstruction = 0.00000001 }
		TIER { tech = internationalAvionics massFactor = 13.436  powerFactor = 9.222   costFactor = 24.11  scMassFactor = 0.43  scPowerFactor = 0.043  scCostFactor = 6.6 scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 409600  kosSpaceCostFactor = 0.0001  kosSpaceMassFactor = 0.0000000005  kosECPerInstruction = 0.00000001 }
		TIER { tech = modernAvionics        massFactor = 11.396  powerFactor = 7.822   costFactor = 19.29  scMassFactor = 0.39  scPowerFactor = 0.039  scCostFactor = 5.9 scDensity = 0.5  scAllowAxial = true   hasScienceContainer = true
			kosDiskSpace = 512000  kosSpaceCostFactor = 0.0001  kosSpaceMassFactor = 0.0000000002  kosECPerInstruction = 0.00000001 }
	}

	// hand the EC draw to ModuleAxeAvionics / Kerbalism (avoid double-counting with ModuleCommand), and disable
	// stock probe hibernation so it doesn't shadow the avionics' own Hibernate toggle (mirrors RP-1's axed patch).
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge] { %rate = 0 }
		%hasHibernation = False
	}

	// Full SAS (level 3) once guidance is active, matching RP-1. AxeAvionicsController suppresses SAS while the
	// craft is dumb (no guidance / unpowered), so level 3 only takes effect when guidance is online.
	@MODULE[ModuleSAS] { @SASServiceLevel = 3 }

	// default shape is just a starting point: ModuleAxeAvionics auto-grows the box to fit the hardware
	// footprint (mass / avionicsDensity), then the player sizes it up further for battery endurance.
	@MODULE[ProceduralShapeCylinder]
	{
		@length   = 0.5
		@diameter = 0.5
	}

	// --- RP-AXE change marker + start placement ---
	%TechRequired = start
	%MODULE[ModuleAxeMarker] {}
	@description ^=:$: <b><color=#7fd3ff>[RP-AXE] unified avionics core</color></b>:
}

// The seed adds the same three dead RP0 modules to the sibling ROTanks probe cores
// (@PART[proceduralAvionics|ROT-ProbeCore|ROT-reDIRECTAvionics]:FOR[RP-0]). Strip them there too so
// they stop throwing "Cannot find a PartModule" at load. Strip-only: these stay plain probe cores
// (stock ModuleCommand control) — under the pure-a rule a bare probe core just grants control.
// (ROT-reDIRECTAvionics may not be installed; MM skips absent parts harmlessly.)
@PART[ROT-ProbeCore|ROT-reDIRECTAvionics]:LAST[RP-AXE]
{
	!MODULE[ModuleProceduralAvionics] {}
	!MODULE[ModuleToolingProcAvionics] {}
	!MODULE[ModuleRangeSafety] {}
}

// --- declutter: drop the now-inert RP-1 procedural-avionics PARTUPGRADEs (nothing reads them now) ---
!PARTUPGRADE[Near-Earth-*]:FINAL {}
!PARTUPGRADE[Science-Core-*]:FINAL {}
!PARTUPGRADE[Deep-Space-*]:FINAL {}
