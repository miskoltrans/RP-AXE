	// hand the EC draw to ModuleAxeAvionics / Kerbalism (avoid double-counting with ModuleCommand), and disable
	// stock probe hibernation so it doesn't shadow the avionics' own Hibernate toggle (mirrors RP-1's axed patch).
	@MODULE[ModuleCommand]
	{
		@RESOURCE[ElectricCharge] { %rate = 0 }
		%hasHibernation = False
	}

	// Full SAS (level 3) once guidance is active, matching RP-1. AxeAvionicsController suppresses SAS while the
	// craft is dumb (no guidance / unpowered), so level 3 only takes effect when guidance is online.
	//
	// 2026-08-05: this is now the PREFAB value only. ModuleAxeAvionics.ApplyAttitudeReference() drives
	// `targetSASServiceLevel` live -- 3 on a Deep-Space Bus, 0 (gyro attitude-hold only) on a Standard bus,
	// because only a deep-space unit has an inertial attitude reference. Vessel level is KSP's own MAX
	// across parts, so a crewed pod keeps full SAS regardless. See docs/AVIONICS_SPEC.md, Axis 2.
	@MODULE[ModuleSAS] { @SASServiceLevel = 3 }

	// --- RP-AXE change marker ---
	%MODULE[ModuleAxeMarker] {}
}

// --- identity: the grey box, equipment you bury inside a stage ---
// Default shape matches RP-1's own real procedural-avionics default (1.25m diameter x 0.2m length,
// ~245 L) -- safely above the ~169 L minimum-for-any-positive-capacity floor at postWarAvionics, so a
// freshly-placed, unresized core is functional out of the box. The box no longer auto-grows to fit the
// hardware (V2 redesign): the player splits this fixed starting volume via the Allocation PAW button.
@PART[proceduralAvionics]:LAST[RP-AXE]
{
	%title = Avionics Core [Procedural]
	@description = A single procedural avionics core: command, guidance, electric power, telemetry, science storage, SAS and flight computer in one resizable box. Uncrewed craft fly dumb (throttle and staging only) until guidance is researched. Use the Allocation window to split the box between battery and hardware, trading capacity against electric-power endurance.
	@MODULE[ProceduralShapeCylinder]
	{
		@length   = 0.2
		@diameter = 1.25
	}
	%TechRequired = start
	@description ^=:$: <b><color=#7fd3ff>[RP-AXE] unified avionics core</color></b>:
}

// --- identity: the bus, the spacecraft itself ---
// Same avionics as the grey core, wearing a real probe body -- ROTanks' core-model dropdown (HECS, OKTO,
// QBE, Torekka, Barquetta, Quetzal, Sputnik 3, Venera, Explorer 33, OGO, Ranger, ...). Tree node and entry
// cost are deliberately NOT set here: AxePartPlacement.cfg puts it on th_hermeticBus (the sealed-bus node,
// which is exactly the role) and AxePartCost.cfg prices it, both in the earlier :FOR[RP-AXE] pass.
//
// The model dropdown is a CAPACITY input here, not merely a skin: every ROTanks core model carries its own
// authored volume -- 28 L for BDB-OGOProbe up to 3090 L for CA-Hera at native size -- and volume is what
// this system converts into steerable mass. At `start` the floor for any positive capacity is 169 L of
// hardware, so most of the small historical buses steer nothing until they are scaled up or the ladder
// advances. That is correct flavour (a 28 L OGO bus steering nothing in 1958 is right), which is why the
// Capacity readout names that state in words instead of showing "0.00 t".
//
// NOTE this part has no box floor and no auto-grow: ROLib exposes neither volumeMin nor SeekVolume, so
// EnforceBoxFloor/SeekVolume no-op (RP-1 is in the same position and tells the player to resize by hand).
// The overload penalty is the guardrail instead -- shrink the box and capacity visibly falls.
@PART[ROT-ProbeCore]:LAST[RP-AXE]
{
	%title = Probe Bus [Procedural]
	@description = A complete spacecraft bus: command, guidance, electric power, telemetry, science storage, SAS and flight computer inside a real probe body. Choose a bus that suits the mission, size it, then use the Allocation window to split it between battery and hardware. Mechanically identical to the Avionics Core -- this one just looks like a spacecraft instead of a box.
	@description ^=:$: <b><color=#7fd3ff>[RP-AXE] unified avionics core</color></b>:
}

// (Was: a strip-only patch here that pulled the three dead RP0 modules off the ROTanks cores and stopped.
// With no avionics module of their own they then fell to the blanket fallback in
// design/Parts/AxeFixedAvionics.cfg and shipped as capacity-0, command-but-dumb parts -- while
// design/Science/HardDriveConfigs.cfg was already granting them the per-tier avionics HardDrive ladder.
// Both halves now agree: the shared patch above strips the husks AND fits the real avionics module, and
// the :FINAL fallback skips them on its own !MODULE[ModuleAxeAvionics] guard. reDIRECT may not be
// installed; MM skips absent parts harmlessly.)
//
// Old note, kept because the reasoning still governs the fallback rule itself:
// The seed adds the same three dead RP0 modules to the sibling ROTanks probe cores
// (@PART[proceduralAvionics|ROT-ProbeCore|ROT-reDIRECTAvionics]:FOR[RP-0]). Strip them there too so
// they stop throwing "Cannot find a PartModule" at load. Strip-only here: with no authored capacity of
// their own they fall to the blanket fallback in design/Parts/AxeFixedAvionics.cfg and end up command-
// but-dumb, like any other unauthored probe core. (This used to read "a bare probe core just grants
// control" — that bypass is exactly what let every named probe core steer unlimited mass; see
// AxeControlLockerUtils.)

// --- Avionics tier display tokens ---
// Science-Core-* (Guided/Unguided ladder) and Deep-Space-* (Shielded ladder) are KEPT: the tree grants
// them as the visible R&D tokens for each avionics tier (retitled/redescribed + repointed at AXE's own
// node IDs by the generated design/Tree/AxeGrantUpgrades.cfg + AxePartPlacement.cfg; auto-unlocked on
// research by AXE.dll's AxeGrantUpgradeUnlock). They carry NO stat MODULE -- the tier effect is applied
// by ModuleAxeAvionics reading the researched node -- exactly the display-token shape RP-1 itself uses.
// Near-Earth-* stays dropped: AXE's ladder exposes the Guided model through the Science-Core-* tokens,
// so the parallel Near-Earth-* set is unreferenced clutter.
!PARTUPGRADE[Near-Earth-*]:FINAL {}
