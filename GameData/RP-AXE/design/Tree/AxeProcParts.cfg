// RP-AXE procedural sizing — AXE's port of RP-1's GameData/RP-1/Tree/ProcSizes.cfg
// ---------------------------------------------------------------------------
// Two independent sections, mirroring the two halves of RP-1's file:
//   1. ProceduralParts shapes  — unlock every ProceduralShape from `start`.
//   2. ProceduralFairings size — un-gate the PF base diameter (added 2026-07-28).
// ===========================================================================
// 1. PROCEDURAL PART SHAPES
// ---------------------------------------------------------------------------
// ProceduralParts ships each shape (Cylinder, Cone, Smooth Cone, Fillet Cylinder, Polygon, the
// Hollow variants, Truss) with its OWN nested `techRequired` field, independent of the part's own
// TechRequired. Most default to `start`, but Cone/Smooth Cone/Fillet Cylinder default to stock KSP's
// `generalConstruction`/`advConstruction` — tech IDs that don't exist anywhere in AXE's from-scratch
// tree (confirmed: zero matches across all ~443 nodes in AxeTechTree.cfg), so those three shapes were
// permanently unobtainable rather than merely gated behind research.
//
// Ported from RP-1's GameData/RP-1/Tree/ProcSizes.cfg ("Proc Parts sizes" section): RP-1 forces every
// ProceduralShape* module's techRequired to `start` on every procedural part, plus resets the part's
// own TechRequired to `start` (AxePartPlacement.cfg's :FOR[RP-AXE] then properly overrides that per
// curated part). Deliberately NOT porting that section's ProceduralPart TECHLIMIT block — that's a
// separate mechanic (per-tech min/max dimension caps) that risks fighting ModuleAxeAvionics' own
// reflection-driven volumeMin management; left alone until we know it needs the same treatment.
//
// :BEFORE[RP-AXE] so it runs before AxePartPlacement.cfg's :FOR[RP-AXE] tech assignments (mirrors
// RP-1's :BEFORE[RP-0] — "to not collide with the tree").
@PART:HAS[@MODULE[ProceduralPart]]:BEFORE[RP-AXE]
{
	@MODULE[ProceduralShape*],*
	{
		%techRequired = start
	}
	@TechRequired = start
}

// ===========================================================================
// 2. PROCEDURAL FAIRINGS BASE DIAMETER
// ---------------------------------------------------------------------------
// Verbatim port of ProcSizes.cfg's "Procedural Fairings v6+ Support" section (2026-07-28), which was
// missed when section 1 was ported. Without it, EVERY PF base — payload fairing bases, interstage
// adapters, boattails and thrust plates alike — is stuck at the plugin's compiled-in default
// `maxSize = 1.5f` (`Keramzit.ProceduralFairingBase`), because:
//
//   * the only thing that raises maxSize is the UPGRADES block in ProceduralFairings/Parts/
//     FairingBaseCommon.cfg (2.75m / 4m / 12m / Infinity, + a 0.4m minimum), and
//   * those UPGRADEs fire only when their PARTUPGRADE is researched — but PF declares those in
//     PF_Settings.cfg against STOCK tech IDs (specializedConstruction, advConstruction,
//     heavyAerodynamics, experimentalAerodynamics, miniaturization, metaMaterials, aerospaceTech),
//     none of which exist in AXE's from-scratch tree, so AxePartPlacement.cfg's blanket
//     `@PARTUPGRADE[*]:FOR[RP-AXE] { %techRequired = parking }` parks all seven permanently.
//
// Confirmed against a live ModuleManager.ConfigCache: all 7 read `techRequired = parking`. Same failure
// shape as AxeOrphanedTech.cfg's cases, one level up (PARTUPGRADE, not nested-module techRequired).
// The symptom is worse than a plain cap: RO sets `baseSize = 3.0` on these parts and PFUtils
// .setFieldRange only rewrites the slider's UI range, never clamping the stored value — so a boattail
// SPAWNS at 3m but its slider tops out at 1.5m, and touching it once is irreversible.
//
// NOT affected, and deliberately untouched: the PF *mass* ladder (PFTech-Fairing-I..VI, seed/Tree/
// PFTechLevels.cfg) — those are properly re-homed onto AXE nodes (met_stiffenedFairings,
// cmp_compositeFairingShells, cmp_advancedCompositeFairings) and remain the real fairing progression.
// Diameter is simply not a thing AXE gates; a tech ladder on it was considered and declined.
!PARTUPGRADE[FairingBaseMin*]:BEFORE[RP-AXE] {}
!PARTUPGRADE[FairingBaseMax*]:BEFORE[RP-AXE] {}
!PARTUPGRADE[ThrustPlateMax*]:BEFORE[RP-AXE] {}
@PART:HAS[@MODULE[ProceduralFairingBase]]:BEFORE[RP-AXE]
{
	@MODULE[ProceduralFairingBase]
	{
		%minSize = 0.1
		%maxSize = Infinity
		!UPGRADES {}
	}
}
