// RP-AXE — Launch-pad progression (fix: pads were all dumping onto `start`).
//
// THE BUG. ModularLaunchPads ships its own launch-facility nodes (generalLaunchPad, launchStands,
// launchPlates, soyuzLaunchBase, saturnLaunchPad, shuttleLaunchPad) and assigns each of its ~233
// parts to one of them. RP-1 ignores that: `Tree/CustomPartPlacement.cfg` flattens EVERY `AM_MLP_*`
// part onto `unlockParts` (:FOR[xxxRP0]), and MLP's nodes never make it into RP-1's rebuilt @TechTree.
// In RP-AXE that then chains one step further — StartParts.cfg repoints `unlockParts -> start` (:FINAL)
// — so all 233 pad parts pile onto the `start` node and MLP's launch-facility nodes are absent
// (0 RDNode defs in the merged cache). Net: the start node is bloated and there is no pad progression.
//
// THE FIX (option A — restore MLP's own progression).
//   1. Re-create the 6 MLP launch-facility nodes in our tree (MLP's defs are dropped by the rebuild).
//   2. Snapshot each AM_MLP part's native MLP node at :FIRST (before CustomPartPlacement overwrites it),
//      then restore it at :LAST[RP-AXE] — which runs AFTER CustomPartPlacement(:FOR) and BEFORE
//      StartParts(:FINAL). Once a part's TechRequired is back to e.g. generalLaunchPad it no longer
//      matches StartParts' `#TechRequired[unlockParts]`, so it stays on its facility node.
//   3. MLP nodes we don't recreate (`none`, `generalConstruction`) -> `start` (core launch bases +
//      mount platform stay available from turn one).
//
// LAYOUT/FORMAT (see OrphanBrowser.cfg — learned the hard way):
//   - Every RDNode field AND every Parent sub-field on ITS OWN LINE (a one-line Parent{} makes KSP read
//     the whole string as parentID -> dangling parent -> NullRef in RDNode.DrawArrow -> never renders).
//   - The R&D pan area is stock KSP, auto-fit to the node bbox, NOT enlargeable. Nodes must sit inside
//     the reachable zone X in [-3817,-62], Y in ~[300,2400]. The first version put this column LEFT of
//     start (x=-3970/-4123 < min-x -3817) so the chain ran off the left edge. FIX: a horizontal ROW in
//     the empty y-band [2150,2400], on the RIGHT (x -900..-200) — the opposite end from the orphan row
//     (which occupies the left of the same band). `generalLaunchPad` still hangs off `start` so the
//     basic pads unlock from turn one; arrow length is not a constraint (the NRE was the malformed
//     Parent, not distance), so the long start->general connector is fine.

// ============================ (1) launch-facility nodes ============================
@TechTree:FINAL
{
	RDNode
	{
		id = generalLaunchPad
		title = General Launch Bases
		description = Modular Launch Pads: general-purpose launch bases, holddowns, crew elevators & service towers. [RP-AXE]
		cost = 1
		hideEmpty = False
		nodeName = generalLaunchPad
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_atlas
		pos = -900,2200,-1
		scale = 0.7
		Parent
		{
			parentID = start
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	RDNode
	{
		id = launchStands
		title = Launch Stands
		description = Modular Launch Pads: Atlas / Delta / Titan launch stands, service towers & umbilical arms. [RP-AXE]
		cost = 1
		hideEmpty = False
		nodeName = launchStands
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_start
		pos = -760,2200,-1
		scale = 0.7
		Parent
		{
			parentID = generalLaunchPad
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	RDNode
	{
		id = launchPlates
		title = Launch Plates
		description = Modular Launch Pads: launch plates & milkstool mounts. [RP-AXE]
		cost = 1
		hideEmpty = False
		nodeName = launchPlates
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_start
		pos = -620,2200,-1
		scale = 0.7
		Parent
		{
			parentID = launchStands
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	RDNode
	{
		id = soyuzLaunchBase
		title = Soyuz Launch Base
		description = Modular Launch Pads: Soyuz launch base, gantry, arms & elevator. [RP-AXE]
		cost = 3
		hideEmpty = False
		nodeName = soyuzLaunchBase
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_soyuzTM
		pos = -480,2200,-1
		scale = 0.7
		Parent
		{
			parentID = launchPlates
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	RDNode
	{
		id = saturnLaunchPad
		title = Saturn Mobile Launcher
		description = Modular Launch Pads: Saturn IB / V mobile launcher, swing arms, crew arm & hammerhead crane. [RP-AXE]
		cost = 8
		hideEmpty = False
		nodeName = saturnLaunchPad
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_apollo
		pos = -340,2200,-1
		scale = 0.7
		Parent
		{
			parentID = soyuzLaunchBase
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
	RDNode
	{
		id = shuttleLaunchPad
		title = Space Shuttle Launch Platform
		description = Modular Launch Pads: Space Shuttle fixed/rotating service structures & launch platform. [RP-AXE]
		cost = 8
		hideEmpty = False
		nodeName = shuttleLaunchPad
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_shuttle
		pos = -200,2200,-1
		scale = 0.7
		Parent
		{
			parentID = saturnLaunchPad
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
}

// ============================ (2) snapshot native MLP node BEFORE the flatten ============================
// At :FIRST the part still carries MLP's own TechRequired (generalLaunchPad/launchStands/.../start/none).
@PART[AM_MLP_*|MountPlatform_MLP]:FIRST
{
	%axeNativePadTech = #$TechRequired$
}

// ============================ (2) restore it AFTER the flatten, BEFORE StartParts ============================
// CustomPartPlacement(:FOR[xxxRP0]) has by now set TechRequired = unlockParts. Put it back. :LAST[RP-AXE]
// is after :FOR and before :FINAL, so StartParts(:FINAL, unlockParts->start) no longer matches these.
@PART[AM_MLP_*|MountPlatform_MLP]:LAST[RP-AXE]
{
	@TechRequired = #$axeNativePadTech$
}

// ============================ (3) MLP nodes we don't recreate -> start ============================
// `none` = MLP's always-available core launch bases (GeneralLaunchBase[/Small/Medium]); `generalConstruction`
// = MountPlatform_MLP. Neither node exists in our tree; keep these available from the start node.
@PART[AM_MLP_*|MountPlatform_MLP]:HAS[#TechRequired[none]]:LAST[RP-AXE]
{
	@TechRequired = start
}
@PART[AM_MLP_*|MountPlatform_MLP]:HAS[#TechRequired[generalConstruction]]:LAST[RP-AXE]
{
	@TechRequired = start
}

// ============================ (4) mark the re-routed parts as RP-AXE changes ============================
// Same convention as OrphanBrowser/AxePlace: ModuleAxeMarker (FE "RP-AXE" subcategory) + desc note. The
// `rp-axe` search tag is added by zzzAxeTags.cfg (:FINAL, keyed on the marker; runs after this file).
// One patch per node — MM does NOT support pipe-OR inside a :HAS[#field[...]] value match, and these
// six nodes hold only the parts we just routed there, so `@PART[*]:HAS[#TechRequired[node]]` is exact.
@PART[*]:HAS[#TechRequired[generalLaunchPad]]:FINAL { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
@PART[*]:HAS[#TechRequired[launchStands]]:FINAL     { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
@PART[*]:HAS[#TechRequired[launchPlates]]:FINAL     { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
@PART[*]:HAS[#TechRequired[soyuzLaunchBase]]:FINAL  { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
@PART[*]:HAS[#TechRequired[saturnLaunchPad]]:FINAL  { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
@PART[*]:HAS[#TechRequired[shuttleLaunchPad]]:FINAL { %MODULE[ModuleAxeMarker] {} @description ^= :$: [RP-AXE: launch facility]: }
