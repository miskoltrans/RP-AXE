// RP-AXE Orphaned Tech Fixes — nested module tech-gates the global wildcard can't reach
// ---------------------------------------------------------------------------
// AxePartPlacement.cfg's blanket @PART[*]/@PARTUPGRADE[*] wildcards (:FOR[RP-AXE]) reset every part's
// OWN top-level TechRequired to a real AXE tech (or `parking` if uncurated) — but %TechRequired only
// touches that top-level field, never a field nested inside a MODULE/CONFIG sub-node. Any third-party
// mod gating a MODULE-level feature on a stock/CTT tech ID that doesn't exist in AXE's tree (confirmed:
// zero matches across all ~443 AxeTechTree.cfg nodes) leaves that feature permanently, silently disabled
// — same failure shape as the ProceduralShape bug fixed in AxeProcParts.cfg, different modules.
//
// Found by a full instance-wide sweep (2026-07-08), cross-checked against a real ModuleManager.log (not
// just static grep) to separate genuinely-broken cases from ones already covered by the existing global
// wildcard or by curated placements. See [[rp-axe-orphaned-stock-tech]] memory for the full audit.

// A) ModuleToggleCrossfeed.techRequired = fuelSystems — permanently disables the crossfeed-toggle
// right-click action. Confirmed broken on 8 parts across 6 mods (incl. 3 stock Squad radial decouplers);
// 110 more parts use this module without an explicit techRequired (unverified default, presumably fine).
// Blanket by module presence, not by file — resetting an already-fine default to `start` is harmless.
@PART:HAS[@MODULE[ModuleToggleCrossfeed]]:BEFORE[RP-AXE]
{
	@MODULE[ModuleToggleCrossfeed]
	{
		%techRequired = start
	}
}

// B) ProceduralParts DecouplerTweaker.separatorTechRequired = advMetalworks
// (ProceduralParts/Parts/Structural/StackDecoupler.cfg) — permanently disables "Separator mode" on the
// procedural stack decoupler. Isolated to this one module in the audit; blanket by module presence
// anyway, matching (A)'s reasoning.
@PART:HAS[@MODULE[DecouplerTweaker]]:BEFORE[RP-AXE]
{
	@MODULE[DecouplerTweaker]
	{
		%separatorTechRequired = start
	}
}

// C) SXT MEM Descent Module (MEMDescentMod)'s LMDE-J RealFuels engine-config variant, gated on
// heavierRocketry (doesn't exist in AXE's tree) -- RealismOverhaul/RO_SuggestedMods/SXT/RO_SXT_LEM.cfg.
// Narrow, NOT a blanket ModuleEngineConfigs reset: CONFIG-level techRequired is how AXE's own engine
// upgrade progression works everywhere else (engine-stats.tsv-driven), so resetting it broadly would
// break real, intended gates. Low priority (this part is separately RODeprecated by RealismOverhaul) but
// cheap and precise to fix.
@PART[MEMDescentMod]:BEFORE[RP-AXE]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG:HAS[#name[LMDE-J]]
		{
			%techRequired = start
		}
	}
}
