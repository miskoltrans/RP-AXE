// Fix tech-tree node icons.
//
// The vendored tree (seed/Tree/RP0TechTree.cfg) references icons as "RP-1/Tree/Icons/..." (212
// times). RP-1 is absent under RP-AXE, so those GameDatabase URLs don't resolve -> blank node
// icons. The same icon files ship in our seed at "RP-AXE/seed/Tree/Icons/...", so rewrite the
// path on every RDNode. Stock RDicon_* paths contain no "RP-1/Tree/Icons" substring and are
// left untouched by the regex replace.
@TechTree:FINAL
{
	@RDNode,*
	{
		@icon ^= :RP-1/Tree/Icons:RP-AXE/seed/Tree/Icons:
	}
}
