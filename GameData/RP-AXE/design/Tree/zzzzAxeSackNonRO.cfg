// RP-AXE — soft-sack of non-RO parts (DECISIONS D10: "every part in the tree must be RO-configured").
//
// RealismOverhaul rewrites every part it has NO config for: it prepends "non RO - " to the title and
// appends "(PART NOT SUPPORTED BY RO)" to the description (RealismOverhaul_Global_Config.cfg, the
// `@PART[*]:HAS[~RSSROConfig[]]:FOR[zzzRealismOverhaul]` block). Those parts run on un-physical stock
// stats in an RSS game and are unwanted.
//
// !!! DO NOT key on `RSSROConfig` !!!  RO uses that field only as a TEMPORARY marker during its
// passes and DELETES it again in its `zzzTagCleanup` pass — which runs BEFORE :FINAL. So at :FINAL no
// part has RSSROConfig and `~RSSROConfig[]` matches EVERYTHING (this over-sacked 2330 parts incl.
// ROEngines/ROCapsules on the first attempt). The persistent, cache-surviving marker is the
// description tag, so we match that. MM forbids literal SPACES inside a patch selector — they must be
// written as `?` (MM's single-char wildcard) — so the tag "PART NOT SUPPORTED BY RO" becomes
// `*PART?NOT?SUPPORTED?BY?RO*` (verified 1049 hits in the merged ConfigCache; RO-supported parts like
// ROE-AJ10-137 do NOT carry it).
//
// SOFT sack: rather than delete them, move every such part OFF the play tree onto a single visible
// quarantine node (`axeNonRO`). They stay installed and recoverable (cost = 1), just out of the
// progression. Audit: `tools/ro_coverage.py`.
//
// :NEEDS[RealismOverhaul] guard: without RO the tag never exists, so the selector matches nothing —
// the tree is left intact. Runs at :FINAL with a `zzzz` filename so it sorts AFTER RO's tagging,
// AxePlace_*.cfg (:LAST) and OrphanBrowser.cfg (:FINAL).

// ============================ quarantine node ============================
@TechTree:FINAL:NEEDS[RealismOverhaul]
{
	RDNode
	{
		id = axeNonRO
		title = RP-AXE: Non-RO (sacked)
		description = Parts RealismOverhaul has no config for ("PART NOT SUPPORTED BY RO"). Moved off the play tree per the RO-only policy (DECISIONS D10). Soft-sacked here so they stay installed & recoverable, not deleted. [RP-AXE]
		cost = 1
		hideEmpty = False
		nodeName = axeNonRO
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_x1
		// Right end of the RP-AXE debug ROW (empty y=2200 band, just under the spaceplane branch).
		// In-bounds (X in [-3817,-62], Y in ~[300,2400]); chains off axeBrowseMisc to its left. EVERY
		// Parent sub-field on its OWN line — a one-line Parent makes KSP read the whole thing as the
		// parentID -> NullRef in RDNode.DrawArrow -> the node never renders.
		pos = -1100,2200,-1
		scale = 0.7
		Parent
		{
			parentID = axeBrowseMisc
			lineFrom = RIGHT
			lineTo = LEFT
		}
	}
}

// ============================ route non-RO play-tree parts to the sack node ============================
// Select: carries RO's "(PART NOT SUPPORTED BY RO)" description tag AND currently on a real node.
// Exclude the browser nodes (separate parked area), RP-1's hidden orphan dumps (defensive), parts with
// no TechRequired (unplaced/hidden — don't un-hide them), and anything already on the sack node.
@PART[*]:HAS[#description[*PART?NOT?SUPPORTED?BY?RO*],#TechRequired[*],~TechRequired[axeBrowse*],~TechRequired[orphanParts],~TechRequired[ORPHANS],~TechRequired[axeNonRO]]:NEEDS[RealismOverhaul]:FINAL
{
	@TechRequired = axeNonRO
	%MODULE[ModuleAxeMarker] {}
	@description ^= :$: <b><color=#ff6b6b>[RP-AXE: non-RO — sacked from tree]</color></b>:
}

// ============================ keep the rp-axe search tag uniform ============================
// zzzAxeTags.cfg already tagged the parts marked before :FINAL (the AxePlace set). Any part we *newly*
// marked above (RP-1's own base placements) ran after it, so tag them here too. Two sweeps: append if
// tags exist, else create. Guard against double-add.
@PART[*]:HAS[#TechRequired[axeNonRO],#tags[*],~tags[*rp-axe*]]:FINAL:NEEDS[RealismOverhaul] { @tags ^= :$: rp-axe: }
@PART[*]:HAS[#TechRequired[axeNonRO],~tags[]]:FINAL:NEEDS[RealismOverhaul]                  { tags = rp-axe }
