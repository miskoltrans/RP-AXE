// RP-AXE — Tantares spacecraft/LV/SP placement.
// Ported from LRTR tree/parts/Tantares*.cfg. RP-1 only places TantaresLV's launch parts; the
// crewed spacecraft, stations and SP parts orphan. We lift LRTR's per-part tier judgement, strip
// its :NEEDS[LRTRTechTree] gate, run at :LAST[RP-AXE] (after RP-1's OrphanNode :FOR pass so we win),
// and remap LRTR's stock/CTT node ids -> RP-1 era nodes. Every placed part is marked (ModuleAxeMarker
// -> FE "RP-AXE" filter; "[RP-AXE]" description note; `rp-axe` tag added by zzzAxeMarking.cfg).
// cost/entryCost are LRTR's RO-scaled values (feeds M3 Pass D).

// ======================== Tantares ========================
@PART[aquila_low_gain_antenna_srf_1]:LAST[RP-AXE]
{
