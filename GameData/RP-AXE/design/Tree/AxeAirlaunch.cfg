// RP-AXE airlaunch — capability tokens + tech-gated launch envelopes.
//
// Reimplements RP-1's airlaunch feature (dropped with the KCT/RP0.dll career layer, T3). The mechanic
// itself lives in the AXE plugin (Source/AXE/Airlaunch/*): build a rocketplane / lifting body in the
// editor, pick "Airlaunch" at the Launch button, and it spawns already airborne inside the unlocked
// envelope. This file is the config half:
//
//   1. PARTUPGRADE airlaunchTL1..4 — the player-facing capability icons on the tree (do nothing on their
//      own; they mirror RP-1's airlaunchTL* tokens). Associated to a node via techRequired, exactly as
//      RP-1 gated them.
//   2. KCTAIRLAUNCHTECHS — the envelope table the plugin reads (AxeAirlaunchTechLevel). TechRequired keys
//      each envelope to the SAME node; unlocking that node is what enables the envelope in-game (the
//      PARTUPGRADE is display sugar). Envelope values are RP-1's, modelled on real carrier/launch pairs;
//      TechRequired remapped from RP-1 node ids to the AXE rocketplane lane.
//
//   RP-1 node        -> AXE node                 aircraft      alt(m)  vel(m/s)  mass(t)
//   supersonicDev    -> fd_rocketplaneRocket     X-1  (B-29)     7600     150       7.5
//   supersonicFlight -> fd_throttleableRocketpl. X-2  (B-50)     9100     175      11.3
//   matureSupersonic -> fd_throttlingRocket      X-15 (B-52)    13750     272      15
//   hypersonicFlight -> aero_hotStructure        X-15A-2(B-52)  13750     272      25
//
//   LaunchCost is an AXE addition (not in RP-1's schema): the per-launch funds fee, scaled by tier.
//   Tunable; the plugin deducts it on confirm and treats a missing/zero value as free.

PARTUPGRADE
{
	name = airlaunchTL1
	partIcon = RO-X1Cockpit
	techRequired = fd_rocketplaneRocket
	entryCost = 1
	cost = 0
	title = Airlaunch — Level 1
	manufacturer = Generic
	description = Drop a rocketplane from a carrier aircraft: vessels up to 7.5 t within 12 x 6 x 13 m (w x h x l), released at up to 7600 m and 150 m/s. This is not a usable part — it marks a new airlaunch capability. Pick "Airlaunch" at the editor Launch button to use it.
}

PARTUPGRADE
{
	name = airlaunchTL2
	partIcon = RO-X1Cockpit
	techRequired = fd_throttleableRocketplane
	entryCost = 1
	cost = 0
	title = Airlaunch — Level 2
	manufacturer = Generic
	description = Airlaunch envelope extended to 11.3 t within 13 x 7 x 17 m (w x h x l), released at up to 9100 m and 175 m/s. This is not a usable part — it marks a new airlaunch capability.
}

PARTUPGRADE
{
	name = airlaunchTL3
	partIcon = RO-X1Cockpit
	techRequired = fd_throttlingRocket
	entryCost = 1
	cost = 0
	title = Airlaunch — Level 3
	manufacturer = Generic
	description = Airlaunch envelope extended to 15 t within 15 x 8 x 21 m (w x h x l), released at up to 13,750 m and 272 m/s. This is not a usable part — it marks a new airlaunch capability.
}

PARTUPGRADE
{
	name = airlaunchTL4
	partIcon = RO-X1Cockpit
	techRequired = aero_hotStructure
	entryCost = 1
	cost = 0
	title = Airlaunch — Level 4
	manufacturer = Generic
	description = Airlaunch mass limit raised to 25 t while other limits stay at 15 x 8 x 21 m (w x h x l), 13,750 m and 272 m/s. This is not a usable part — it marks a new airlaunch capability.
}

// Envelope table read by AxeAirlaunchTechLevel. Sizes carry RP-1's +3/+2/+1 m padding on w/h/l to absorb
// B9 reporting ship bounds slightly larger than actual. Ordered by progression (plugin walks last->first).
KCTAIRLAUNCHTECHS
{
	// X-1 from B-29A
	AIRLAUNCHTECHLEVEL
	{
		TechRequired = fd_rocketplaneRocket
		MinAltitude = 5000
		MaxAltitude = 7600
		MaxKscDistance = 1000000
		MinVelocity = 125
		MaxVelocity = 150
		MaxMass = 7500
		MaxSize = 12, 6, 13
		LaunchCost = 2000
	}

	// X-2 from B-50
	AIRLAUNCHTECHLEVEL
	{
		TechRequired = fd_throttleableRocketplane
		MinAltitude = 5000
		MaxAltitude = 9100
		MaxKscDistance = 1000000
		MinVelocity = 125
		MaxVelocity = 175
		MaxMass = 11300
		MaxSize = 13, 7, 17
		LaunchCost = 4000
	}

	// X-15A from B-52
	AIRLAUNCHTECHLEVEL
	{
		TechRequired = fd_throttlingRocket
		MinAltitude = 5000
		MaxAltitude = 13750
		MaxKscDistance = 1000000
		MinVelocity = 125
		MaxVelocity = 272
		MaxMass = 15000
		MaxSize = 15, 8, 21
		LaunchCost = 8000
	}

	// X-15A-2 from B-52
	AIRLAUNCHTECHLEVEL
	{
		TechRequired = aero_hotStructure
		MinAltitude = 5000
		MaxAltitude = 13750
		MaxKscDistance = 1000000
		MinVelocity = 125
		MaxVelocity = 272
		MaxMass = 25000
		MaxSize = 15, 8, 21
		LaunchCost = 12000
	}
}
