// GENERATED by tools/build_tree.py — DO NOT EDIT BY HAND
// launch_cost_scalar = 1.2, applied to the MODULE-priced half of a vehicle. AxePartFlyCost.cfg
// carries the same scalar for statically-priced (named) parts; this file is the other half, and
// without it the knob would govern only ~49% of the launch bill. See docs/ECONOMY.md §14.
//
// Measured split of vehicle cost (28 craft, saves/default3): avionics 31.8%, RF/ROTank baseCost
// 19.3%, other procedural ~0.1%. Resource (propellant) costs are NOT scaled — fuel is 0-3
// funds/tonne at any size, so vehicle cost is hardware.

// --- AXE avionics: funds = (load^costExponent + costConstant) * costFactor(tier). costFactor is
//     multiplicative, so scaling it scales the curve. scCostFactor (Science-Core, flat per tier)
//     and shCostFactor (Radiation-Shielded ladder) are separate cost outputs and scale too.
@PART[proceduralAvionics|ROT-ProbeCore|ROT-reDIRECTAvionics]:FINAL
{
	@MODULE[ModuleAxeAvionics]
	{
		@TIER,*
		{
			@costFactor *= 1.2
			@scCostFactor *= 1.2
			@shCostFactor *= 1.2
		}
	}
}

// --- RealFuels tanks: baseCost is a STRING expression, so strip ' * volume', multiply the bare
//     number, re-append. This is seed/ProcCosts.cfg's own idiom (its line 300 does the same to
//     fold resource cost in); :FINAL so we land after that, not instead of it.
@TANK_DEFINITION[*]:HAS[#baseCost[*volume]]:FINAL
{
	@baseCost ^=: \* volume::
	@baseCost *= 1.2
	@baseCost ^=:$: * volume:
}

// --- the ~0.1% tail: ProceduralParts volume pricing and the fairing per-tonne rates. Patched for
//     completeness so the knob means one thing everywhere; RP-1 zeroes most of these already.
@PART[*]:HAS[@MODULE[ProceduralPart]:HAS[#costPerkL]]:FINAL
{
	@MODULE[ProceduralPart] { @costPerkL *= 1.2 }
}
@PART[*]:HAS[@MODULE[ProceduralFairingBase]:HAS[#costPerTonne]]:FINAL
{
	@MODULE[ProceduralFairingBase] { @costPerTonne *= 1.2 }
}
@PART[*]:HAS[@MODULE[ProceduralFairingSide]:HAS[#costPerTonne]]:FINAL
{
	@MODULE[ProceduralFairingSide] { @costPerTonne *= 1.2 }
}

// --- RealFuels' fallback per-volume cost, for tank types with no explicit baseCost.
@MFSSETTINGS[MFSSettings]:FINAL { @baseCostPV *= 1.2 }
