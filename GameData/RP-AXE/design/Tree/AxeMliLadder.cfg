// RP-AXE — multi-layer insulation ladder: layer counts re-valued to a constant-ratio curve.
// ---------------------------------------------------------------------------------------
// WHAT THIS OWNS: the maxMLILayers each MLI.UpgradeN grants, and the player-facing titles that
// quote those numbers. WHERE THE RUNGS LIVE in the tree is tree/nodes.yaml (five Thermodynamics
// nodes, one rung each) -> AxePartPlacement.cfg. Change a number here, change nothing there.
//
// WHY RE-VALUE. RealFuels ships 20/40/60/80/100; seed/Tree/RFTechLevels.cfg (vendored from RP-1)
// overrides that to 0 base and 1/25/50/75/100. RF's heat leak through the blanket is very close to
// 1/N -- GetMLITransferRate() sums a radiative term that divides by N and a solid-conduction term
// that divides by N+1 -- so what the player feels from a rung is the RATIO to the previous one, not
// the difference. RP-1's ladder spends its whole dynamic range on the first step and then flattens:
//
//     layers   W/m^2 (300K skin, 70K contents, vacuum)   vs. previous rung
//        1        6.31                                        --
//       25        0.283                                     22.3x
//       50        0.142                                      2.0x
//       75        0.095                                      1.5x
//      100        0.071                                      1.3x
//
// One layer is not a blanket, it is a switch that turns the MLI code path on; and the last two rungs
// buy 50% and 33% between them, which is not worth a tech node each. Re-valued to a constant ratio:
//
//     layers   W/m^2      vs. previous rung
//        6      1.045          --
//       12      0.585        1.79x
//       25      0.283        2.07x
//       50      0.142        1.99x
//      100      0.071        1.99x
//
// Every rung roughly HALVES the parasitic heat into a cryogenic tank -- i.e. roughly doubles how
// long it holds. That is one promise, repeated five times, and it is legible without a spreadsheet.
// Top and bottom both land somewhere real: 6 layers is a genuine early blanket rather than a token,
// and 100 is unchanged, so the balloon-tank rung (RFTech-MLI-UpgradeBalloon, which takes balloon
// tanks from NO insulation at all straight to 100) still tops the ladder out.
//
// Layers are not free: RF charges MLIArealDensity 1.5e-5 t and MLIArealCost 0.20764 funds per m^2
// per layer, so 100 layers on a 3 m x 10 m stage is ~162 kg and ~2,240 funds. The slider is still a
// decision, and the ceiling this ladder raises is what makes it one.
//
// :LAST[RP-AXE] because seed/Tree/RFTechLevels.cfg patches :AFTER[zzzRealFuels], which runs after
// every :FOR[RP-AXE] pass -- a :FOR-tagged override here would be silently overwritten by the seed.
// Same reason design/AxeExternalTechRemap.cfg and design/Parts/AxeFixedAvionics.cfg use LAST.

@PART[*]:HAS[@MODULE[ModuleFuelTanks]]:NEEDS[RealFuels]:LAST[RP-AXE]
{
	@MODULE[ModuleFuelTanks],*
	{
		@UPGRADES
		{
			@UPGRADE:HAS[#name__[MLI.Upgrade1]]
			{
				@description__ = Improved tank wrapping techniques allow 6 layers now.
				@maxMLILayers = 6
			}
			@UPGRADE:HAS[#name__[MLI.Upgrade2]]
			{
				@description__ = Improved tank wrapping techniques allow 12 layers now.
				@maxMLILayers = 12
			}
			@UPGRADE:HAS[#name__[MLI.Upgrade3]]
			{
				@description__ = Improved tank wrapping techniques allow 25 layers now.
				@maxMLILayers = 25
			}
			@UPGRADE:HAS[#name__[MLI.Upgrade4]]
			{
				@description__ = Improved tank wrapping techniques allow 50 layers now.
				@maxMLILayers = 50
			}
			// Upgrade5 is already 100 from RealFuels' own MLITechUpgrades.cfg (the seed file does not
			// re-value it). Set it here anyway so all five rungs read off one block instead of four
			// here and one implied upstream.
			@UPGRADE:HAS[#name__[MLI.Upgrade5]]
			{
				@description__ = Improved tank wrapping techniques allow 100 layers now.
				@maxMLILayers = 100
			}
		}
	}
	// Balloon tanks keep their own single rung (RFTech-MLI-UpgradeBalloon, 100 layers): the seed file
	// strips every MLI* UPGRADE off #type[Tank-Balloon*] and grants that one instead, so there is
	// nothing to re-value here. Battery tanks keep maxMLILayers 0 for the same reason.
}

// The titles quote the layer count, so they are part of the same edit -- leaving them would leave
// "(1 layer)" on the rung that now grants six.
@PARTUPGRADE[MLI.Upgrade1]:NEEDS[RealFuels]:LAST[RP-AXE] { @title = MLI Wrapping Upgrade (6 layers) }
@PARTUPGRADE[MLI.Upgrade2]:NEEDS[RealFuels]:LAST[RP-AXE] { @title = MLI Wrapping Upgrade (12 layers) }
@PARTUPGRADE[MLI.Upgrade3]:NEEDS[RealFuels]:LAST[RP-AXE] { @title = MLI Wrapping Upgrade (25 layers) }
@PARTUPGRADE[MLI.Upgrade4]:NEEDS[RealFuels]:LAST[RP-AXE] { @title = MLI Wrapping Upgrade (50 layers) }
@PARTUPGRADE[MLI.Upgrade5]:NEEDS[RealFuels]:LAST[RP-AXE] { @title = MLI Wrapping Upgrade (100 layers) }
