// RP-AXE Orphan Browser.
// RP-1 sweeps every part it doesn't curate onto the single hidden `orphanParts` node. This surfaces
// them as a categorised, visible ROW of nodes laid out along the EMPTY bottom band of the tree
// (y=2200, just under the spaceplane branch at y=2090) so they're reachable and browsable. Parts
// routed here are MARKED:
//   - MODULE[ModuleAxeMarker]   -> Filter Extensions "RP-AXE" subcategory (type = moduleName)
//   - tag `rp-axe`              -> editor parts-search filter
//   - " [RP-AXE: orphan]" appended to the description
//
// LAYOUT/FORMAT NOTES (learned the hard way):
//  - Every RDNode field AND every Parent sub-field (parentID/lineFrom/lineTo) must be on ITS OWN LINE.
//    A one-line `Parent { parentID = X lineFrom = RIGHT lineTo = LEFT }` makes KSP read the parentID as
//    the whole string -> dangling parent -> NullRef in RDNode.DrawArrow -> the node never renders.
//  - The R&D pan area is stock KSP, auto-fit to the node bounding box, NOT enlargeable. Nodes must sit
//    inside the reachable zone: X in [-3817,-62], Y in ~[300,2400]. The y-band [2150,2400] is empty
//    across the whole x-range (RP-1's own ORPHANS node at y=3000 is parked there *because* it's
//    unreachable) -> we lay the row at y=2200.
//  - Arrow length is NOT a constraint (the NRE was the malformed Parent, not distance). Hub hangs off
//    `start`; the rest chain left->right along the row.

@TechTree:FINAL
{
	RDNode
	{
		id = axeBrowseHub
		title = RP-AXE: Orphan Browser
		description = Parts RP-1 doesn't place (the hidden 'orphan' pool), surfaced by category for browsing. Everything here is marked [RP-AXE].
		cost = 1
		hideEmpty = False
		nodeName = axeBrowseHub
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys
		pos = -3700,2200,-1
		scale = 0.7
		Parent
		{
			parentID = start
			lineFrom = BOTTOM
			lineTo = TOP
		}
	}
	RDNode
	{
		id = axeBrowseEngines
		title = Orphans: Engines
		description = Orphaned engines & propulsion. [RP-AXE]
		cost = 1
		hideEmpty = False
		nodeName = axeBrowseEngines
