// RP-AXE Orphan Browser.
// RP-1 sweeps every part it doesn't curate onto the single hidden `orphanParts` node. This surfaces
// them as a categorised, visible cluster of nodes (right of the main tree, x>0) so you can browse
// what RP-1 hides and study its balancing. Parts routed here are MARKED as RP-AXE changes:
//   - MODULE[ModuleAxeMarker]   -> Filter Extensions "RP-AXE" subcategory (type = moduleName)
//   - tag `rp-axe`              -> editor parts-search filter
//   - " [RP-AXE]" appended to the description
// Runs at :FINAL (after RP-1's OrphanNode, after any real placement we add later), so it only ever
// scoops up whatever is *still* orphaned.

// ============================ browser nodes ============================
@TechTree:FINAL
{
	RDNode
	{
		id = axeBrowseHub
		title = RP-AXE: Orphan Browser
		description = Parts RP-1 doesn't place (the hidden 'orphan' pool), surfaced by category for browsing. Everything here is marked [RP-AXE].
		cost = 1
		hideEmpty = False
		nodeName = axeBrowseHub
		anyToUnlock = False
		icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys
		pos = 200,1650,-1
		scale = 0.8
		Parent { parentID = start lineFrom = RIGHT lineTo = LEFT }
	}
	RDNode { id = axeBrowseEngines     title = Orphans: Engines        description = Orphaned engines & propulsion. [RP-AXE]      cost = 1 hideEmpty = False nodeName = axeBrowseEngines     anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_x1   pos = 700,2400,-1  scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseTanks       title = Orphans: Fuel Tanks     description = Orphaned fuel tanks. [RP-AXE]                cost = 1 hideEmpty = False nodeName = axeBrowseTanks       anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_start pos = 1150,2400,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowsePods        title = Orphans: Command Pods   description = Orphaned crew pods & cockpits. [RP-AXE]      cost = 1 hideEmpty = False nodeName = axeBrowsePods        anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys  pos = 1600,2400,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseControl     title = Orphans: Control/RCS    description = Orphaned RCS, reaction wheels, control. [RP-AXE] cost = 1 hideEmpty = False nodeName = axeBrowseControl     anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_x1   pos = 700,1950,-1  scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseStructural  title = Orphans: Structural     description = Orphaned structural parts & adapters. [RP-AXE] cost = 1 hideEmpty = False nodeName = axeBrowseStructural  anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_start pos = 1150,1950,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseCoupling    title = Orphans: Coupling       description = Orphaned decouplers & docking. [RP-AXE]      cost = 1 hideEmpty = False nodeName = axeBrowseCoupling    anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys  pos = 1600,1950,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseElectrical  title = Orphans: Electrical     description = Orphaned batteries, solar, reactors. [RP-AXE] cost = 1 hideEmpty = False nodeName = axeBrowseElectrical  anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_x1   pos = 700,1500,-1  scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseComms       title = Orphans: Communication  description = Orphaned antennas & comms. [RP-AXE]          cost = 1 hideEmpty = False nodeName = axeBrowseComms       anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_start pos = 1150,1500,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseScience     title = Orphans: Science        description = Orphaned science instruments. [RP-AXE]      cost = 1 hideEmpty = False nodeName = axeBrowseScience     anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys  pos = 1600,1500,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseAero        title = Orphans: Aero           description = Orphaned wings & control surfaces. [RP-AXE]  cost = 1 hideEmpty = False nodeName = axeBrowseAero        anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_x1   pos = 700,1050,-1  scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseThermal     title = Orphans: Thermal        description = Orphaned radiators & heatshields. [RP-AXE]   cost = 1 hideEmpty = False nodeName = axeBrowseThermal     anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_start pos = 1150,1050,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
	RDNode { id = axeBrowseMisc        title = Orphans: Misc/Utility   description = Orphaned utility, cargo, payload & uncategorised. [RP-AXE] cost = 1 hideEmpty = False nodeName = axeBrowseMisc anyToUnlock = False icon = RP-AXE/seed/Tree/Icons/rp0_icon_keys pos = 1600,1050,-1 scale = 0.7 Parent { parentID = axeBrowseHub lineFrom = RIGHT lineTo = LEFT } }
}

// ============================ route orphans to category nodes ============================
@PART[*]:HAS[#TechRequired[orphanParts],#category[Engine]]:FINAL        { @TechRequired = axeBrowseEngines }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Propulsion]]:FINAL    { @TechRequired = axeBrowseEngines }
@PART[*]:HAS[#TechRequired[orphanParts],#category[FuelTank]]:FINAL      { @TechRequired = axeBrowseTanks }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Pods]]:FINAL          { @TechRequired = axeBrowsePods }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Control]]:FINAL       { @TechRequired = axeBrowseControl }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Structural]]:FINAL    { @TechRequired = axeBrowseStructural }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Coupling]]:FINAL      { @TechRequired = axeBrowseCoupling }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Electrical]]:FINAL    { @TechRequired = axeBrowseElectrical }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Communication]]:FINAL { @TechRequired = axeBrowseComms }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Science]]:FINAL       { @TechRequired = axeBrowseScience }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Aero]]:FINAL          { @TechRequired = axeBrowseAero }
@PART[*]:HAS[#TechRequired[orphanParts],#category[Thermal]]:FINAL       { @TechRequired = axeBrowseThermal }
// catch-all for everything still orphaned (Utility, Cargo, Payload, Ground, none, ...). Must be last.
@PART[*]:HAS[#TechRequired[orphanParts]]:FINAL                          { @TechRequired = axeBrowseMisc }

// ============================ mark them as RP-AXE changes ============================
// module marker (FE filter) + description note, on every part now on a browser node:
@PART[*]:HAS[#TechRequired[axeBrowse*]]:FINAL
{
	%MODULE[ModuleAxeMarker] {}
	@description ^= :$: [RP-AXE: orphan]:
}
// search tag: append if the part already has tags, else create.
@PART[*]:HAS[#TechRequired[axeBrowse*],#tags[*]]:FINAL { @tags ^= :$: rp-axe: }
@PART[*]:HAS[#TechRequired[axeBrowse*],~tags[]]:FINAL  { tags = rp-axe }
