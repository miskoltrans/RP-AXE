// RP-AXE — shared search-tag marking.
// Adds the `rp-axe` editor parts-search tag to EVERY part carrying our ModuleAxeMarker — both the
// parts we PLACED (AxePlace_*.cfg, marker added at :LAST) and the still-orphaned parts surfaced by
// the OrphanBrowser (marker added at :FINAL). Runs at :FINAL with a `zzz` filename so it sorts after
// both, guaranteeing every marker is present before we tag. Two sweeps: append if the part already
// has tags, else create the field.
@PART[*]:HAS[@MODULE[ModuleAxeMarker],#tags[*]]:FINAL { @tags ^= :$: rp-axe: }
@PART[*]:HAS[@MODULE[ModuleAxeMarker],~tags[]]:FINAL  { tags = rp-axe }
