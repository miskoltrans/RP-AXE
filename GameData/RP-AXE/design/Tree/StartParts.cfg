// M6 — fix start-of-career flyability.
// RP-1's `unlockParts` node ("Starting Parts": 506 basic 1940s-50s parts — sounding-rocket engines
// TinyTim / Aerobee / A4(V-2), early guidance GuidanceStart1m / RP0probeSounding, early cockpits and
// procedural parts) is auto-unlocked at career start by RP-1's ConfigurableStart/FirstStart plugin.
// With that plugin axed, the node is stranded behind its 999-science cost you don't have at turn 1 —
// leaving only the 43 real `start` parts and NO guided sounding rocket. That is the "start-of-career
// broken" issue.
//
// Fix: repoint the whole "Starting Parts" set onto `start` (which IS auto-unlocked, and parts are free
// via FreePartUnlock) so the basic hardware — and a buildable first sounding rocket — is available from
// turn one. Then hide the now-empty unlockParts node.
@PART[*]:HAS[#TechRequired[unlockParts]]:FINAL
{
	@TechRequired = start
}

@TechTree:FINAL
{
	@RDNode:HAS[#id[unlockParts]]
	{
		%hideEmpty = True
	}
}
