// RP-AXE — autostrut unlock gate
// ---------------------------------------------------------------------------
// KSP gates autostruts behind a single global tech id (PHYSICSGLOBALS.autoStrutTechRequired).
// Stock/RO set it to `generalConstruction`, a tech id that does NOT exist anywhere in AXE's
// from-scratch tree — so through the normal research path autostruts would never unlock at all
// (verified live: ModuleManager.Physics has `autoStrutTechRequired = generalConstruction`). This
// is the same dead-stock-tech-id trap AxeProcParts.cfg fixes for procedural cone shapes.
//
// Intended design: autostruts switch on when you research the strut part itself. AXE's tree homes
// the EAS-4 Strut Connector (`strutConnector`) at node `str_rigidBracing` ("Rigid Airframe
// Bracing"), whose flavor already states that unlocking the EAS-4 is what turns autostrut on.
// Point the global there so mechanic and fiction agree. (Node ids, not nodeNames, are the tech ids
// KSP compares against — same convention RP-1's Tree/AutoStrut.cfg uses with `start`.)
//
// :LAST[RP-AXE] so it lands after RO's :FOR[RealismOverhaul] PHYSICSGLOBALS edit; % edits-or-adds.
@PHYSICSGLOBALS:LAST[RP-AXE]
{
	%autoStrutTechRequired = str_rigidBracing
}
