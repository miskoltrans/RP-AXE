// RP-AXE — flight-termination (Range Safety) on uncrewed guided vehicles.
//
// AXE.dll ships a working ModuleRangeSafety (a "Range Safety" self-destruct button + action group,
// leaf-first destruction that skips fairing sides so it doesn't orphan a live lower stage; ported
// verbatim from RP-1). But RP-1's seed/PartHacks.cfg only adds it to parts carrying RP-1's
// ModuleAvionics -- which AXE replaced with ModuleAxeAvionics and strips (StripAxedRP1Modules.cfg) --
// so that trigger is dead and only ~2 parts ended up with the button.
//
// This re-keys it to AXE's equivalent of "an uncrewed guided vehicle": every part with a ModuleCommand
// (probe cores + the avionics core), then stripped from crewed parts -- RP-1's own rule (a crewed
// vehicle aborts, it doesn't remote-self-destruct). The button blows the whole vessel, so having it on
// the command part(s) covers every controllable craft.
//
// :LAST[RP-AXE] so ModuleCommand + CrewCapacity are settled (after RO/seed) and it lands before
// StripAxedRP1Modules' :FINAL. The add runs first, then the crewed strip (MM applies these top-to-bottom
// within the pass). ~[~MODULE[ModuleRangeSafety]] on the add keeps it idempotent (never double-adds).

// add to every command part...
@PART[*]:HAS[@MODULE[ModuleCommand],~MODULE[ModuleRangeSafety]]:LAST[RP-AXE]
{
	MODULE { name = ModuleRangeSafety }
}

// ...then strip it back off crewed ones (RP-1 parity: has a CrewCapacity field that isn't 0 = crewed).
@PART[*]:HAS[@MODULE[ModuleRangeSafety],#CrewCapacity[*],~CrewCapacity[0]]:LAST[RP-AXE]
{
	!MODULE[ModuleRangeSafety] {}
}
