// RP-AXE EVA-restriction tagging (plugin module ModuleNoEVA).
//
// Blocks EVA except when safe to actually climb out (landed/pre-launch/splashed on the home world,
// or flying below 20 km). Applied to the early open-cockpit / early-capsule set — the parts a pilot
// or cosmonaut can't step out of at altitude or in orbit. Mirrors RP-1's ModuleNoEVA coverage; AXE
// doesn't vendor RP-1's Tree/, so it's re-authored here. Patches for absent parts no-op.
//
// Extend the list as more early crewed parts (Mercury/Vostok capsules, etc.) enter the curated
// manifest.

@PART[RP0Nose-Cockpit|X1_Crew|RO-X1Cockpit|Trainer?Cockpit|Mk1?S39?Cockpit|F-104?Cockpit|fightercockpit|fighterinlinecockpit|FSfighterCockpit|RO-FighterInlineCockpit|FS_BiplaneCockpit|F8f?Bearcat?Cockpit|Focke-Wulf?Bearcat?Cockpit|Interceptor?Cockpit|25mKossak|625mBonny|IronVostok_Crew_A|KerbCan]:AFTER[RP-0]
{
	%MODULE[ModuleNoEVA] {}
}

// Flag it in the part description (matches RP-1's zFinal note), for any part that ended up with the module.
@PART[*]:HAS[@MODULE[ModuleNoEVA]]:FINAL
{
	@description ^=:$: <b><color=red>THIS PART DOESN'T ALLOW EVA!</color></b>
}
