// RP-AXE EVA-restriction tagging (plugin module ModuleNoEVA).
//
// Blocks EVA except when safe to actually climb out (landed/pre-launch/splashed on the home world,
// or flying below 20 km). Applied to the early open-cockpit / early-capsule set — the parts a pilot
// or cosmonaut can't step out of at altitude or in orbit. AXE doesn't vendor RP-1's Tree/, so the
// coverage is re-authored here; the list below is RP-1's set verbatim (the 43 parts carrying
// ModuleNoEVA in RP-1's Tree/TREE-Parts.cfg). Patches for absent parts no-op.
//
// DELIBERATELY ABSENT: ROC-VoskhodAirlock. RP-1 blocks EVA on the Voskhod descent module but NOT on
// the airlock, which is the whole point of the part — the inflatable tunnel is the only way out of a
// Voskhod, exactly as flown on Voskhod 2. Same for any future dedicated airlock: never list one here.

// --- Early capsules: hatch is the reentry hatch and/or the cabin can't be vented ---
@PART[ROC-VostokCapsule|ROC-VoskhodCapsule|ROC-MercuryCM|ROC-MercuryCMBDB|ROC-D2CM|IronVostok_Crew_A|Voskhod_Crew_A|rn_vostok_sc|rn_voskhod_sc|restock-pod-sphere-1|mk1pod|mk1pod_v2|KerbCan]:AFTER[RP-0]
{
	%MODULE[ModuleNoEVA] {}
}

// --- Research / X-plane cockpits ---
@PART[RP0Nose-Cockpit|X1_Crew|RO-X1Cockpit|Trainer?Cockpit|Mk1?S39?Cockpit|Mk1?Su30?Cockpit|25mKossak|625mBonny]:AFTER[RP-0]
{
	%MODULE[ModuleNoEVA] {}
}

// --- Fighter / aircraft cockpits ---
@PART[F-104?Cockpit|F8f?Bearcat?Cockpit|Focke-Wulf?Bearcat?Cockpit|Interceptor?Cockpit|Typhoon?Cockpit|fightercockpit|fighterinlinecockpit|oldfightercockpit|zerocockpit|FSfighterCockpit|FS_BiplaneCockpit|RO-FighterInlineCockpit|RO-OldFighterCockpit|Mark1Cockpit|Mark2Cockpit]:AFTER[RP-0]
{
	%MODULE[ModuleNoEVA] {}
}

// --- SXT airframes ---
@PART[SXTBuzzard|SXTClyde|SXTEntenteCordiale|SXTOsaulNoseCockpitAn225|SXTOsualRadCockpit|SXTke111|SXTmk3Cockpit52]:AFTER[RP-0]
{
	%MODULE[ModuleNoEVA] {}
}

// Flag it in the part description (matches RP-1's zFinal note), for any part that ended up with the module.
@PART[*]:HAS[@MODULE[ModuleNoEVA]]:FINAL
{
	@description ^=:$: <b><color=red>THIS PART DOESN'T ALLOW EVA!</color></b>
}
