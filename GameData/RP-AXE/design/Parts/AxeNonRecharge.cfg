// RP-AXE primary (non-rechargeable) batteries.
//
// ModuleNonRecharge caps a resource's max to its current level every frame, so once drained it can
// never refill — the finite-power reality of the earliest satellites, which carried no solar and
// simply went silent when the battery died (Sputnik 1 fell quiet after ~3 weeks). A real
// mission-planning constraint that pairs with AXE's live-EC avionics/transmitter draw.
//
// Applied ONLY to battery-only early satellites (verified: no solar panel module). Solar-powered
// contemporaries — Vanguard 1 (the first solar satellite), later Explorers/probes — are deliberately
// left rechargeable. Patches for absent parts no-op (ModuleManager); sputnik1/2 ship with RaiderNick's
// Soviet probe pack, probeCoreSphere_v2 is the stock "Sputnik PS-1".
@PART[sputnik1|sputnik2|probeCoreSphere_v2]:AFTER[RP-0]
{
	%MODULE[ModuleNonRecharge] {}
}
