// ROC-CSTSM — CST-100 service module, integrated (3.89 t of service module, of which the array is a
// sliver), so W/kg says nothing: it fits TL0 with 224% error. Level 5 by the node cap
// (int_commercialCrewCapsule, T11 -> TL8 -> 1990s).
@PART[ROC-CSTSM]:AFTER[RealismOverhaul]:NEEDS[ROCapsules]
{
	SolarConfig
	{
		level = 5
		solarUseCharge = False
	}
