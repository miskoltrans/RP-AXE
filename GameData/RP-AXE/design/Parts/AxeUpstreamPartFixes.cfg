	{
		level = 2	// RO_CA_ProbesPlus_Electrical.cfg:674 "Level 2 solar array (~100 W/m2)"
		solarUseCharge = False
	}
}
@PART[ca_vor_sp]:AFTER[RealismOverhaul]:NEEDS[CoatlAerospace]
