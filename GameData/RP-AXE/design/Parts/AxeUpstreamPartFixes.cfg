// RP-AXE — the three parts that fail to COMPILE in this install. All three are upstream defects in
// mods AXE only consumes; each is corrected here with a minimal override rather than left to spew
// errors on every load. Drop any stanza whose upstream fixes it — the provenance line on each says
// exactly what to re-check.
//
// ---------------------------------------------------------------------------------------------
// 1. A part that clones a stock model ReStock has taken out of circulation.
//
// ReStock does not delete the stock .mu files; it BLACKLISTS their folders
// (ReStock/Restock.restockblacklist) so its plugin drops them from the asset database, then
// re-points each stock part at its own replacement mesh. A part that clones the stock model path
// by hand never gets that re-point, so it dies at load with:
//
//     PartCompiler: Cannot clone model '<path>' as model does not exist
//     PartCompiler: Cannot compile part
//
// which is one of the few failures in this family that is NOT silent — but it costs the whole
// part, and check_liveness.py check A only notices once the part is placed in the tree. Found
// 2026-07-29 (docs/BUG-CLASSES.md finding 4).
//
// :NEEDS[ReStock] because without ReStock the stock model is present and the original clone is
// correct — this must not "fix" an install that was never broken.

// aje_solarPanels ("ST-0 Solar Panel") — AJE/Parts/solarpanel.cfg clones solarPanels5, drops the
// inherited MODEL, and hardcodes `Squad/Parts/Electrical/radialFlatSolarPanel/model` at 4.47x, a
// folder ReStock blacklists (Restock.restockblacklist:43). ReStock re-points solarPanels5 itself to
// restock-solarpanel-static-small at scale 1,1,1 (ReStock/Patches/Electrical/restock-solarpanels.cfg
// :137), so the replacement is dimensionally a drop-in for the model AJE was scaling and AJE's own
// 4.47 carries over unchanged. Stats are untouched — this is the mesh only.
//
// It matters because the part is NOT redundant: it is the same panel at 4.47x the area and 4x the
// charge rate, and it is placed at elec_deployablePanelII alongside the solarPanels5 it clones.
// :LAST[RP-AXE] so it lands after AJE has created the clone AND after RO's own
// @PART[aje_solarPanels]:FOR[RealismOverhaul] pass (which retitles it and rewrites SolarConfig but
// never touches MODEL, so nothing here is fighting it).
@PART[aje_solarPanels]:LAST[RP-AXE]:NEEDS[ReStock,AJE]
{
	!MODEL,* {}
	MODEL
	{
		model = ReStock/Assets/Electrical/restock-solarpanel-static-small
		scale = 4.47, 4.47, 4.47
	}
}

// ---------------------------------------------------------------------------------------------
// 2. A typo in an RO config — one character, one dead engine.
//
// RealismOverhaul/RO_SuggestedMods/ReStock/RO_Restock_Engines_SRB.cfg:94 writes the Castor 30B's
// model scale as `1.1482. 1, 1.1482` — a period where the first comma belongs. ConfigNode.
// ParseVector3 splits on commas, so it gets two components and tries to parse "1.1482. 1" as a
// float: System.FormatException at compile time, and the part is gone. Nothing else in the chain
// is wrong, so restating the vector is the whole fix.
//
// RO-Castor30B is not in manifest/curated-parts.tsv and is not placed in the tree, so this buys no
// gameplay today — it buys a clean load and a real Antares upper-stage motor that WORKS if it is
// ever curated. :NEEDS[ReStock] because the part only exists on the ReStock path (RO clones it from
// solidBooster_sm_v2 under the same guard).
@PART[RO-Castor30B]:LAST[RP-AXE]:NEEDS[ReStock]
{
	@MODEL
	{
		%scale = 1.1482, 1, 1.1482
	}
}

// ---------------------------------------------------------------------------------------------
// 3. A part guarded against the wrong mod.
//
// ROCapsules/Assets/BDB/APAS/B10_APASv2.cfg ships Benjee10's APAS port under
// `PART:NEEDS[!Benjee10_sharedAssets]` — "use our copy unless the author's own mod is installed" —
// but its MODEL points at `Bluedog_DB/Parts/APAS/B10_APASv2`. The guard names the wrong dependency:
// without Bluedog_DB the model does not exist and the part cannot compile, whatever Benjee10's
// mods are doing. AXE installs neither, so it fails every load.
//
// Deleting it when BDB is absent is what the upstream guard was trying to express. Nothing is lost:
// the part never compiled, so no craft in an AXE career can contain it, and AXE's own curated APAS
// ports (ROCapsules ROC-APAS*) are unaffected.
!PART[B10_APASv2]:LAST[RP-AXE]:NEEDS[!Bluedog_DB] {}
