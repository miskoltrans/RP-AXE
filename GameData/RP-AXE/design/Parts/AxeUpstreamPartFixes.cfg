// RP-AXE — upstream part defects, corrected here. Every stanza is a bug in a mod AXE only consumes,
// not in AXE's own design: parts that fail to COMPILE (1-3), a part that shipped the wrong number
// (4), a part whose button throws when pressed (5), and a part that does not do the thing its own
// title and description say it does (6). Each is a minimal override rather than a
// fork, and each carries the provenance line that says exactly what to re-check — drop any stanza
// whose upstream fixes it.
//
// ---------------------------------------------------------------------------------------------
// 1. A part that clones a stock model ReStock has taken out of circulation.
//
// ReStock does not delete the stock .mu files; it BLACKLISTS their folders
// (ReStock/Restock.restockblacklist) so its plugin drops them from the asset database, then
// re-points each stock part at its own replacement mesh. A part that clones the stock model path
// by hand never gets that re-point, so it dies at load with:
//
//     PartCompiler: Cannot clone model '<path>' as model does not exist
//     PartCompiler: Cannot compile part
//
// which is one of the few failures in this family that is NOT silent — but it costs the whole
// part, and check_liveness.py check A only notices once the part is placed in the tree. Found
// 2026-07-29 (docs/BUG-CLASSES.md finding 4).
//
// :NEEDS[ReStock] because without ReStock the stock model is present and the original clone is
// correct — this must not "fix" an install that was never broken.

// aje_solarPanels ("ST-0 Solar Panel") — AJE/Parts/solarpanel.cfg clones solarPanels5, drops the
// inherited MODEL, and hardcodes `Squad/Parts/Electrical/radialFlatSolarPanel/model` at 4.47x, a
// folder ReStock blacklists (Restock.restockblacklist:43). ReStock re-points solarPanels5 itself to
// restock-solarpanel-static-small at scale 1,1,1 (ReStock/Patches/Electrical/restock-solarpanels.cfg
// :137), so the replacement is dimensionally a drop-in for the model AJE was scaling and AJE's own
// 4.47 carries over unchanged. Stats are untouched — this is the mesh only.
//
// It matters because the part is NOT redundant: it is the same panel at 4.47x the area and 4x the
// charge rate, and it is placed at elec_deployablePanelII alongside the solarPanels5 it clones.
// :LAST[RP-AXE] so it lands after AJE has created the clone AND after RO's own
// @PART[aje_solarPanels]:FOR[RealismOverhaul] pass (which retitles it and rewrites SolarConfig but
// never touches MODEL, so nothing here is fighting it).
@PART[aje_solarPanels]:LAST[RP-AXE]:NEEDS[ReStock,AJE]
{
	!MODEL,* {}
	MODEL
	{
		model = ReStock/Assets/Electrical/restock-solarpanel-static-small
		scale = 4.47, 4.47, 4.47
	}
}

// ---------------------------------------------------------------------------------------------
// 2. A typo in an RO config — one character, one dead engine.
//
// RealismOverhaul/RO_SuggestedMods/ReStock/RO_Restock_Engines_SRB.cfg:94 writes the Castor 30B's
// model scale as `1.1482. 1, 1.1482` — a period where the first comma belongs. ConfigNode.
// ParseVector3 splits on commas, so it gets two components and tries to parse "1.1482. 1" as a
// float: System.FormatException at compile time, and the part is gone. Nothing else in the chain
// is wrong, so restating the vector is the whole fix.
//
// RO-Castor30B is not in manifest/curated-parts.tsv and is not placed in the tree, so this buys no
// gameplay today — it buys a clean load and a real Antares upper-stage motor that WORKS if it is
// ever curated. :NEEDS[ReStock] because the part only exists on the ReStock path (RO clones it from
// solidBooster_sm_v2 under the same guard).
@PART[RO-Castor30B]:LAST[RP-AXE]:NEEDS[ReStock]
{
	@MODEL
	{
		%scale = 1.1482, 1, 1.1482
	}
}

// ---------------------------------------------------------------------------------------------
// 3. A part guarded against the wrong mod.
//
// ROCapsules/Assets/BDB/APAS/B10_APASv2.cfg ships Benjee10's APAS port under
// `PART:NEEDS[!Benjee10_sharedAssets]` — "use our copy unless the author's own mod is installed" —
// but its MODEL points at `Bluedog_DB/Parts/APAS/B10_APASv2`. The guard names the wrong dependency:
// without Bluedog_DB the model does not exist and the part cannot compile, whatever Benjee10's
// mods are doing. AXE installs neither, so it fails every load.
//
// Deleting it when BDB is absent is what the upstream guard was trying to express. Nothing is lost:
// the part never compiled, so no craft in an AXE career can contain it, and AXE's own curated APAS
// ports (ROCapsules ROC-APAS*) are unaffected.
!PART[B10_APASv2]:LAST[RP-AXE]:NEEDS[!Bluedog_DB] {}

// ---------------------------------------------------------------------------------------------
// 4. A part that kept RO's mass and its own mod's stock power output.
//
// NearFutureSolar's curved panels use their own `ModuleCurvedSolarPanel`, not the stock
// ModuleDeployableSolarPanel that RO's solar pass computes on, so RO handles them with a three-step
// dance (RO_SuggestedMods/NearFutureTechnologies/RO_NearFuture_Solar.cfg:253-270): create a FAKE
// MDSP `:BEFORE[RealismOverhaul_SolarPanels]` carrying TotalEnergyRate as its chargeRate, let the
// solar pass size it from `SolarConfig { area }`, then `:AFTER[...]` copy the computed chargeRate
// back into TotalEnergyRate and delete the fake module.
//
// On this part the round-trip does not complete. The MASS proves the pass ran: RO sets this exact
// part's area to 2.2384 m2 (same file, line 156) and ROSolar's TL10 rung is 0.0008 t/m2, so the
// expected mass is 2.2384 x 0.0008 = 0.00179072 t -- which is what the part carries, to the digit.
// But TotalEnergyRate is still NearFutureSolar's stock 75 EC/s instead of 2.2384 x 0.301 kW/m2 =
// 0.6738. The part therefore ships with RO's mass and its own mod's output:
//
//     41,883 W/kg, against the 376 W/kg its four RO-scaled siblings sit at -- 111x.
//
// That is the single largest power outlier found in the tier-balance audit (docs/TIER-BALANCE.md F),
// and it sits on elec_curvedExpandingArray at T11, where the solar ladder only reaches TL8
// (122.6 W/kg). It is silent: the part loads, works, and simply out-performs the entire lane.
//
// The fix restates what RO's own numbers say the value should be, which lands the part exactly on
// its siblings' 376.2 W/kg. :LAST[RP-AXE] so it wins the round-trip regardless of pass ordering.
// Re-check if RO fixes the copy-back: the tell is TotalEnergyRate arriving as ~0.674 on its own.
@PART[nfs-panel-deploying-curved-375-1]:LAST[RP-AXE]:NEEDS[NearFutureSolar]
{
	@MODULE[ModuleCurvedSolarPanel]
	{
		%TotalEnergyRate = 0.6738
	}
}

// ---------------------------------------------------------------------------------------------
// 5. A button that animates a clip the model does not have -- clicked in flight, it throws.
//
// ROCapsules/PartConfigs/Vostok/VoskhodCapsule.cfg:169 gives the Voskhod SA a ModuleAnimateGeneric
// on `animationName = Deploy`, presented as "Extend Antenna" / "Retract Antenna". That module is
// copied from the Vostok SA next door, and on Vostok it is correct: VostokCapsule and ZenitCapsule
// both load `Assets/RN/vostok_sc`, whose .mu carries a `Deploy` clip plus the SC_UUEAntenna1/2 and
// SC_UUAMotor1/2 transforms it drives. Voskhod loads `Assets/RN/voskhod_sc` instead -- a different
// mesh, with NO animations at all. The name resolves to nothing.
//
// KSP does not drop the module for that. It logs one [LOG] line when the part is first instantiated
//
//     ModuleAnimateGeneric: Could not find animation component 'Deploy' - on part
//     ROC-VoskhodCapsule failed to load! Check the model file
//
// and leaves the module live with a null `anim`, so the PAW button and the action-group action are
// both still there. UpdateAnimSwitch() re-tries FindAnimation() and then dereferences
// `anim[animationName]` unconditionally, so the first press throws:
//
//     NullReferenceException
//       ModuleAnimateGeneric.UpdateAnimSwitch () / .Toggle () / BaseEvent.Invoke ()
//       UIPartActionButton.OnClick ()
//
// Observed in flight 2026-08-13 on a crewed Voskhod. Deleting the module is the whole fix and costs
// nothing: there is no antenna on the mesh to extend, and the part's actual comms is a separate
// module (ModuleDataTransmitter, which the mod's own :BEFORE[RealAntennas] pass swaps for
// ModuleRealAntenna). Nothing in this install patches or reads the animation module -- every
// antenna patch that touches this part keys on ModuleRealAntenna.
//
// RP-1 does not fix this either; it ships the same latent trap.
//
// Guarded on the model, not the mod: if ROCapsules ever gives voskhod_sc real antennae with a
// Deploy clip, this stanza must go -- tools/check_model_anims.py stops reporting the part on the
// same day, which is the signal to drop it.
@PART[ROC-VoskhodCapsule]:LAST[RP-AXE]:NEEDS[ROCapsules]
{
	!MODULE[ModuleAnimateGeneric] {}
}

// ---------------------------------------------------------------------------------------------
// 6. A SAR antenna that is not a SAR antenna -- an override the clone forgot.
//
// RO builds the Magellan radar as a CLONE of the lo-res part:
// RO_SuggestedMods/SCANSat/RO_SCANsat.cfg:171 is `+PART[scansat-radar-poseidon-3b-1]` renamed to
// RO-MagellanRadar at :173. The clone overrides rescaleFactor, mass, title, description, fov,
// max_alt, best_alt and EC rate -- and stops there. It never touches `sensorType` or the
// SCANexperiment's `experimentType`, both of which it inherits from poseidon-3b:
//
//     sensorType = 1               // 2^0, lo-res altimetry
//     experimentType = SCANsatAltimetryLoRes
//
// So the part scans lo-res, while its own description (same file, :180) reads "Early SAR radar and
// high gain antenna, used by Magellan ... extremely high resolution Radar maps with a resolution of
// just a few meters". The seasat patch 78 lines below (:262, :277) does exactly the two overrides
// this one is missing, on the same kind of part, which is what makes this an omission rather than a
// deliberate downgrade -- and Magellan's real RDRS was of course a SAR.
//
// It is silent in the worst way: the part loads, deploys, scans, and produces the wrong map. The
// merged cache is the only place it shows (`sensorType = 1` under a part titled "RDRS Radar
// Antenna"); nothing in the log complains.
//
// It matters to AXE specifically because RO-MagellanRadar is the KING PART of
// opt_syntheticApertureRadar, a node whose entire reason to exist is unlocking hi-res SAR. Unfixed,
// that node ships one lo-res altimeter and one real SAR (scansat-sar-paz-1), with the lo-res one
// leading. Found 2026-08-14 alongside the Seasat mis-placement that put hi-res on opt_radarAltimetry
// two tiers earlier (tree/nodes.yaml, both nodes carry the note).
//
// The altitudes have to move WITH the sensor type, and that is the subtle half of this stanza.
// RealSolarSystem/Compatibility/SCANsat.cfg:74 carries a catch-all
//
//     @PART[*]:HAS[@MODULE[SCANsat]]:FOR[RealSolarSystem]
//
// that rewrites min_alt/max_alt/best_alt from `sensorType` alone -- 10/500/10 km for sensorType 1,
// 10/8000/7500 km for sensorType 2 -- and `:FOR[RealSolarSystem]` sorts AFTER
// `:FOR[RealismOverhaul]`, so it overwrites RO's per-part tuning across the whole install. (RO's own
// comment at RO_SCANsat.cfg:114 says it means to configure these "after RSS"; it does not. The one
// part that escapes is scansat-sar-paz-1, patched at :LAST[SCANsat], which is why PAZ still carries
// RO's authored 1000/500 km while Seasat runs on RSS's 8000/7500 km.)
//
// This stanza is :LAST[RP-AXE], i.e. after RSS. So flipping sensorType alone would leave the part on
// the sensorType-1 altitudes it was given -- a SAR with max_alt 500 km and best_alt 10 km, which is
// nobody's SAR and would be a fresh silent defect of exactly the kind this file exists to close.
// Restating RO's authored max/best for Magellan (RO_SCANsat.cfg:186-187) fixes that and lands the
// part on PAZ's profile, which is both the coherent in-family answer and the historically right one
// -- Magellan mapped from a ~290 km periapsis orbit, not from 7500 km. min_alt stays at RSS's
// 10 km, matching PAZ. EC rate is left alone: RSS's rate override lives in its sensorType-2 branch,
// which this part never took, so RO's authored 0.5 EC/s survived and sits sensibly between Seasat's
// 0.1 and PAZ's 0.64.
//
// Nothing else about the part is touched. Re-check if RO fixes the clone: the tell is
// RO-MagellanRadar arriving with sensorType 2 on its own.
@PART[RO-MagellanRadar]:LAST[RP-AXE]:NEEDS[SCANsat]
{
	@MODULE[SCANsat]
	{
		%sensorType = 2
		%scanName = SAR
		%max_alt = 1000000
		%best_alt = 500000
	}
	@MODULE[SCANexperiment]
	{
		%experimentType = SCANsatAltimetryHiRes
	}
}

// ---------------------------------------------------------------------------------------------
// 7. Twelve solar panels that never degrade, in a stack where every other panel does.
//
// RO's entire solar model hangs off ONE node: `SolarConfig`. RO_SolarConfig.cfg selects on
// `@PART[*]:HAS[...,@SolarConfig]` and nothing else — an era `level` expands into kwm2/kgm2 plus
// four `key*` lines (:1-107), and those keys are then written onto the panel as its
// `timeEfficCurve` (:126-138). That curve IS solar degradation. A part with no SolarConfig node is
// not degrading slowly; it is skipped by every patch in the pass and keeps a flat 1.0 curve for the
// life of the save.
//
// Both consumers agree, so nothing downstream catches it:
//   stock      ModuleDeployableSolarPanel:136-148 substitutes `timeEfficCurve = {0,1}` when the
//              field is null, then evaluates it at (UT - launchUT)/86400 — days.
//   Kerbalism  SolarPanelFixer.StockPanel.GetTimeCurve() reads that same MDSP curve and rescales it
//              to HOURS (x24 on time, /24 on the tangents, evaluated at /3600). With no curve it
//              falls through to SupportedPanel.GetTimeCurve()'s single {0,1} key, the
//              `Curve.length > 1` test fails, and `wearFactor` pins at 1.0 forever. That is also
//              why the PAW never shows a Wear row on these parts — the field is only switched
//              guiActive when wearFactor < 1, so the absence reads as "no wear yet".
//
// RO meanwhile tells the player the opposite: RO_SolarConfig.cfg:159 appends "Solar Panels degrade,
// affecting the power output over time. Check this effect in the PAW." to EVERY part carrying an
// MDSP, SolarConfig or not. All twelve descriptions advertise a mechanic the part does not have.
//
// Found 2026-08-28 from a player question about the Orion arrays — KSS 1 Station flies 16 of them,
// 44 kW that had not lost a watt in 484 days. It is a whole family, not one part: 41 of the 131
// MDSP parts in the merged cache have no curve, 12 of them curated.
//
// WHAT THIS STANZA DOES NOT CHANGE. `solarUseCharge = False` suppresses RO's chargeRate rewrite
// (RO_SolarConfig.cfg:120 selects `@SolarConfig:HAS[~solarUseCharge[?alse]]`), and no
// `solarUseMass` is set, so RO's mass patch (:141) never fires either. Power and mass stay exactly
// as they are today — the tier-balance placement of all twelve parts (docs/TIER-BALANCE.md F) was
// made on those numbers and stays valid. The ONLY thing added is the life curve. `area` is
// deliberately omitted: with the charge rewrite off nothing reads it, and a made-up area would read
// as a measurement.
//
// It applies RETROACTIVELY. Kerbalism persists `launchUT` per panel, so a flying vessel takes its
// accrued wear the moment this lands (KSS 1: ~22% off 16 panels, 44 kW -> ~34 kW).
//
// LEVEL, per part, in order of authority:
//   (a) RO's own annotation. The Coatl configs state the intended rung in a comment and then never
//       apply it, because the family patch deletes SolarConfig wholesale —
//       RO_CA_ProbesPlus_Electrical.cfg:396 `!SolarConfig,* {}` + "We configure masses directly
//       here", and :815 "Can't use SolarConfig for this yet" (ca_explorer_solar splits its output
//       across three suncatchers, which is a chargeRate problem, not a curve problem). Those
//       comments are the upstream author's answer; this stanza supplies the node they name.
//   (b) the tree's own clock, where RO annotates nothing. tree/nodes.yaml places solarTL(n) at
//       tier n+3, and a rung maps to an RO level by identical era AND identical curve (ROSolar
//       TechLimits.cfg vs RO_SolarConfig.cfg): TL0/1 -> 0 (1958), TL2/3 -> 1 (1961),
//       TL4/5 -> 2 (1967), TL6 -> 3 (1975), TL7 -> 4 (1980s), TL8 -> 5 (1990s), TL9 -> 6 (ISS),
//       TL10 -> 7 (modern). A catalog panel is then capped at the procedural rung the player
//       actually holds at that node. For ROC-OrionSolar the cap (T9 -> TL6 -> level 3) agrees with
//       both the W/kg fit (TL6, 9% error) and the tier audit's own reading of the part, which is
//       the cross-check that this rule is not inventing a ladder.
//
// PASS WINDOW — the crux, and the reason this stanza is not :LAST[RP-AXE] like the rest of the
// file. The node has to exist BEFORE RO's solar pass and AFTER the mod-family patches that delete
// it. Those deletions all live in :FOR[RealismOverhaul] (Coatl, FASA, AJE, Squad, SXT, VNP, NFS),
// and the solar pass runs in the RealismOverhaul_SolarPanels pseudo-mod, which sorts after every
// RealismOverhaul pass. :AFTER[RealismOverhaul] is the one window between them; the AXE default
// :FOR[RP-AXE] is far too late (RP-AXE sorts after RealismOverhaul_SolarPanels_Late, which deletes
// SolarConfig again on its way out). If upstream ever moves one of those deletions later, this
// stanza stops working silently — tools/check_solar_wear.py is the gate that turns that into a
// build failure instead of a mystery. Re-check any part here if RO gives it a SolarConfig of its
// own: the tell is the part arriving with a timeEfficCurve already on it, which the gate reports.

// (a) RO's stated level — Coatl ProbesPlus / GroundOps panels.
@PART[sp_mariner_a]:AFTER[RealismOverhaul]:NEEDS[CoatlAerospace]
{
	SolarConfig
	{
		level = 2	// RO_CA_ProbesPlus_Electrical.cfg:538 "Level 2 solar array (~85 W/m2)"
		solarUseCharge = False
	}
}
@PART[sp_mariner_b]:AFTER[RealismOverhaul]:NEEDS[CoatlAerospace]
{
	SolarConfig
	{
		level = 2	// RO_CA_ProbesPlus_Electrical.cfg:576 "Level 2 solar array (~85 W/m2)"
		solarUseCharge = False
	}
}
@PART[ca_fom_sp]:AFTER[RealismOverhaul]:NEEDS[CoatlAerospace]
