// nfs-panel-deploying-curved-375-1 is the thirteenth part in this family and is deliberately NOT
// here — it cannot be fixed from config. Its power comes from NearFutureSolar's own
// ModuleCurvedSolarPanel (stanza 4 above), not an MDSP, so there is no `timeEfficCurve` field for
// RO's pass to write and Kerbalism binds it to SolarPanelFixer.NFSCurvedPanel, which does not
// override GetTimeCurve() at all. Kerbalism's own `timeEfficCurve` KSPField on SolarPanelFixer
// looks like a way in, but it is gated on a private `prefabDefinesTimeEfficCurve` that is only
// assigned in the LOADING scene and is not a serialized field, so whether it survives cloning to a
// part instance is not something config can guarantee. Left as a known gap, exempt in
// tools/check_solar_wear.py with this reason.
