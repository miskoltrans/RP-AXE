// RP-AXE reentry / cockpit-pressurization tagging.
//
// Puts the two (real, plugin-backed) part modules onto parts:
//   * ModuleUnpressurizedCockpit — crew die of hypoxia above a per-cockpit altitude ceiling.
//   * ModuleNonReentryRated      — the part burns up on a full reentry (can't hide in a drag shadow).
//
// AXE builds its own tech tree and does NOT vendor RP-1's Tree/TREE-Parts.cfg / CockpitUpgrades.cfg,
// so the tagging RP-1 did there is re-authored here. Scope of THIS pass = the early open-cockpit
// X-plane / aircraft families (the iconic, unambiguous set, and the exact parts AXE's early tree
// cares about). Ceilings mirror RP-1. Every cockpit here is also flagged non-reentry-rated, since an
// open cockpit is by definition not an orbital reentry vehicle — this is what makes the crewed
// test-flight contract check "vessel has no parts not rated for reentry" bite (a proper heat-shielded
// capsule is NOT tagged, so it passes).
//
// Patches for parts that aren't installed simply no-op (ModuleManager), so the full family list is
// safe to ship regardless of which cockpit mods are present.
//
// DEFERRED (follow-up balance pass, intentionally not done here):
//   * Broad non-cockpit reentry tagging (adapters, structural, uncrewed buses) as RP-1 does per-part
//     across thousands of lines of TREE-Parts.cfg — a large inversion that deserves its own review.
//   * The RP-1 tiered ceiling upgrade (X-1 30km -> X-2 75km via a researched PARTUPGRADE); here the
//     X-1/X-2 cockpits get a flat 30km base. Re-add as an AXE PARTUPGRADE when the tree gates it.

// --- X-1 / X-2 class research cockpits (RP-1 base 30 km) ---
@PART[RP0Nose-Cockpit|X1_Crew|RO-X1Cockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 30000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Century-series fighter / trainer cockpits (F-104 unofficial ~36.8 km, 1963) ---
@PART[Trainer?Cockpit|Mk1?S39?Cockpit|F-104?Cockpit|fightercockpit|fighterinlinecockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 37000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Early jet-fighter cockpits (F-86 / MiG-15 era, ~15 km real; a little extra so they're useful) ---
@PART[FSfighterCockpit|RO-FighterInlineCockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 20000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Open biplane cockpit: no canopy at all ---
@PART[FS_BiplaneCockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 6000 }
	%MODULE[ModuleNonReentryRated] {}
}
