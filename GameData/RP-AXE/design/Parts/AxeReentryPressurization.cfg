// RP-AXE reentry / cockpit-pressurization tagging.
//
// Puts the two (real, plugin-backed) part modules onto parts:
//   * ModuleUnpressurizedCockpit — crew die of hypoxia above a per-cockpit altitude ceiling.
//   * ModuleNonReentryRated      — the part burns up on a full reentry (can't hide in a drag shadow).
//
// AXE builds its own tech tree and does NOT vendor RP-1's Tree/, so RP-1's tagging is re-authored here.
// This now covers RP-1's FULL ModuleNonReentryRated set (verified against TREE-Parts.cfg: 45 parts =
// crewed cockpits + crewed lunar landers / ascent stages — NOT tanks/engines/structural, which stay
// untagged and reentry-survivable), the per-cockpit hypoxia ceilings, and the X-1 -> X-2 tiered
// ceiling upgrade (PARTUPGRADE at the foot of this file).
//
// Every cockpit is also flagged non-reentry-rated — an open cockpit is not an orbital reentry vehicle,
// which is what makes the crewed test-flight contract check "vessel has no parts not rated for reentry"
// bite (a proper heat-shielded capsule is NOT tagged, so it passes). Patches for absent parts no-op.

// --- X-1 class research cockpits: base 30 km, upgradeable to 75 km (X-2 spec) — see PARTUPGRADE below ---
@PART[RP0Nose-Cockpit|X1_Crew|RO-X1Cockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit]
	{
		%crewDeathAltitude = 30000
		UPGRADES
		{
			UPGRADE
			{
				name__ = X2CockpitUpgrade
				crewDeathAltitude = 75000
			}
		}
	}
	%MODULE[ModuleNonReentryRated] {}
}

// --- Century-series fighter / trainer cockpits (F-104 unofficial ~36.8 km, 1963) ---
@PART[Trainer?Cockpit|Mk1?S39?Cockpit|F-104?Cockpit|fightercockpit|fighterinlinecockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 37000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Early jet-fighter cockpits (F-86 / MiG-15 era, ~15 km real; a little extra so they're useful) ---
@PART[FSfighterCockpit|RO-FighterInlineCockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 20000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Open biplane cockpit: no canopy at all ---
@PART[FS_BiplaneCockpit]:AFTER[RP-0]
{
	%MODULE[ModuleUnpressurizedCockpit] { %crewDeathAltitude = 6000 }
	%MODULE[ModuleNonReentryRated] {}
}

// --- Crewed lunar / lander vehicles (the non-cockpit half of RP-1's non-reentry-rated set): they
//     carry crew but are built to land, not to survive an Earth reentry. Pressurized modules you DO
//     EVA from, so ONLY the reentry flag — no hypoxia, no EVA lock. ---
@PART[ALCOR_LanderCapsule|LEM_ASCENT_STAGE|MEMLander|MEMLanderSXT|rn_lk_lander|ROC-LEMAscent|ROC-LEMAscentBDB|ROC-LEMAscentTaxiBDB|ROC-LEMShelterBDB|landerCabinMedium|landerCabinSmall|mk2CrewCabin|mk2LanderCabin|mk2LanderCabin_v2|SXTClyde|SXTEntenteCordiale|SXTke111]:AFTER[RP-0]
{
	%MODULE[ModuleNonReentryRated] {}
}

// --- X-2 cockpit upgrade: raises the X-1 cockpit ceiling 30 km -> 75 km once the X-2's throttle-valve
//     rocketplane tech is researched. Self-contained (techRequired baked in); to also show it in the
//     tree render + auto-cost it, add `X2CockpitUpgrade` to fd_throttleableRocketplane's `upgrades:` in
//     tree/nodes.yaml. ---
PARTUPGRADE
{
	name = X2CockpitUpgrade
	partIcon = RO-X1Cockpit
	techRequired = fd_throttleableRocketplane
	entryCost = 3000
	cost = 0
	title = X-2 Cockpit Upgrade
	manufacturer = Generic
	description = Raises the X-1 cockpit's service ceiling to X-2 specification (75 km) — a reinforced canopy and cabin sealing for the throttle-valve rocketplane's higher, faster envelope.
}
