// RP-AXE — deliberate part CUTS.
// ------------------------------------------------------------------------------------------------
// Parts that RO configures (so RSSROConfig=True carries them past HardRemoveNonRO) but AXE does not
// ship. They are deleted OUTRIGHT rather than merely left out of manifest/curated-parts.tsv, because
// "left out" is not a cut: tools/build_tree.py's emit_placement_patch parks EVERY part on the
// `parking` node first and only overrides the placed ones, so an uncurated-but-live part lands on
// `parking` — a 999-science parentless holding pen that is meant to stay EMPTY and that the build
// warns about ("N unplaced parts -> parking"). Deleting is the honest expression of the decision.
//
// :LAST[RP-AXE] so this runs after every AXE pass (including the :FOR[RP-AXE] wildcards in the
// generated design/Tree/AxePartPlacement.cfg and AxePartCost.cfg) — those patches simply no-op on a
// part that is then removed. Same pass AxeUpstreamPartFixes.cfg uses for its one conditional cut.
//
// The MM cache lags a cut by one KSP load: build_tree.py reads Instance/GameData/
// ModuleManager.ConfigCache to enumerate live parts, so the first build after adding a name here can
// still report it. Re-run after KSP has reloaded if the count looks wrong.

// ==== UniversalStorage2 — the 2026-08-27 promotion pass ====================================
// The us2_serviceSandbox trial node (added 2026-07 to judge all 35 dropped US2 parts in the editor)
// is resolved. KEPT and promoted into the tree: the 4 bay cores, the 12 service-module skins, and
// the 3 chemical plants. CUT below: everything whose job a procedural or already-placed part does
// better. The wedges are form factors, not capabilities — a wedge that is merely another shape of a
// tank/battery/avionics box we already ship earns nothing.

// Attitude Control Decouplers (5). Decoupler + a token reaction wheel (RO cuts the torque to 2%).
// AXE already ships procedural decouplers and a full RCS/reaction-wheel ladder; these are neither
// a new mechanism nor a better one, and RO prices them at a tenth of stock to say the same thing.
!PART[USACDTiny]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USACDSmall]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USACD1500]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USACDMedium]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USACDLarge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}

// Bulk tank wedges (9): propellant, ECLSS consumables and waste. Every one is a fixed-size tank in
// wedge form; RealFuels procedural tankage covers all of it at any size with any propellant, and the
// promoted CORES carry Aerozine50+NTO / UDMH+IRFNA-III / Hydrazine in the spine anyway.
!PART[USAerozineWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USHydrazineWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USHydrogenWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USOxygenWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USCarbonDioxideWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USFoodWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USWaterWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USGreyWaterWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USSolidWasteWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}

// Battery wedge. AXE's battery ladder is procedural/RO parts; a 0.15 t fixed wedge adds no capability.
!PART[USBatteryWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}

// "Modern Avionics Unit" (RO's title for USDoubleProbeCore). AXE runs its own no-gate avionics core
// (docs/AVIONICS_SPEC.md) on proceduralAvionics + the RO probe cores; a third-party command pod with
// 5000 EC and SASServiceLevel 3 bolted on sits outside that whole design.
!PART[USDoubleProbeCore]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}

// Science wedges whose experiments are already carried elsewhere — see tools/build_manifest.py
// (US2_WEDGES) for the full reasoning. Both were curated until this pass, so they are also removed
// from manifest/curated-parts.tsv.
//   USAccelGravWedge: micrometeoriteDetect + RP0orbitalPurturbation1 + RP0cosmicRay1/2, all four of
//   which proceduralAvionics carries on `start`, plus dedicated instruments for each.
//   USThermoBaroWedge: homeless since mic_atmoSounding was emptied 2026-07-29.
!PART[USAccelGravWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
!PART[USThermoBaroWedge]:LAST[RP-AXE]:NEEDS[UniversalStorage2] {}
