// RP-AXE — "not rated for reentry" tagging (ModuleNonReentryRated).
//
// The AXE.dll module + its ModularFI thermo hook (AxeThermoChanger, ported verbatim from RP-1's
// RP0ThermoChanger) already ship; they just had no parts to act on because AXE replaces RP-1's
// TREE-Parts.cfg (which is where RP-1 does this tagging). This restores that tagging.
//
// EFFECT: a tagged part can't hide in another part's wake to dodge reentry heating (its convective
// multipliers are floored at 0.75), so it takes full heating and burns up. It stops you flying an
// aircraft/spaceplane cockpit or an off-world lander back down through Earth's atmosphere and
// recovering it — you need a real reentry-rated capsule (heat shield) instead.
//
// RULE (RP-1's, ground-truthed from RP-1/GameData/RP-1/Tree/TREE-Parts.cfg — 45 parts): tag
// atmospheric COCKPITS and extraterrestrial LANDERS. Do NOT tag reentry-rated CAPSULES (Mercury/
// Gemini/Apollo/Vostok/KV reentry vehicles — they have heat shields and are meant to come home) or
// orbital STATION modules (they never reenter). The two groups below are RP-1's exact list (parts
// absent from AXE's install just no-op); the one AXE-only addition is called out.
//
// :HAS[~MODULE[ModuleNonReentryRated]] makes each patch idempotent (never double-adds).

// --- Atmospheric / spaceplane cockpits (RP-1's list) ---
@PART[25mKossak|625mBonny|F-104?Cockpit|F8f?Bearcat?Cockpit|fightercockpit|fighterinlinecockpit|Focke-Wulf?Bearcat?Cockpit|FS_BiplaneCockpit|FSfighterCockpit|Interceptor?Cockpit|Mark1Cockpit|Mark2Cockpit|Mk1?S39?Cockpit|Mk1?Su30?Cockpit|mk2Cockpit_Standard|mk2CrewCabin|oldfightercockpit|RO-FighterInlineCockpit|RO-OldFighterCockpit|RO-X1Cockpit|RP0Nose-Cockpit|SXTBuzzard|SXTClyde|SXTEntenteCordiale|SXTke111|SXTmk3Cockpit52|SXTOsaulNoseCockpitAn225|SXTOsualRadCockpit|Trainer?Cockpit|Typhoon?Cockpit|X1_Crew|zerocockpit]:HAS[~MODULE[ModuleNonReentryRated]]:LAST[RP-AXE]
{
	MODULE { name = ModuleNonReentryRated }
}

// --- Off-world landers / lander cabins (RP-1's list + SXTLander) ---
// SXTLander ("PPD-8 Lander Can") is AXE-only (RP-1 doesn't carry it); tagged by the same rule as
// RP-1's own landerCabin*/MEM/LEM parts — a lander can, not a reentry capsule.
@PART[ALCOR_LanderCapsule|landerCabinMedium|landerCabinSmall|LEM_ASCENT_STAGE|MEMLander|MEMLanderSXT|mk2LanderCabin|mk2LanderCabin_v2|rn_lk_lander|ROC-LEMAscent|ROC-LEMAscentBDB|ROC-LEMAscentTaxiBDB|ROC-LEMShelterBDB|SXTLander]:HAS[~MODULE[ModuleNonReentryRated]]:LAST[RP-AXE]
{
	MODULE { name = ModuleNonReentryRated }
}
