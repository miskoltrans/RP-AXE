// M5 / M3 funds trim: ~x1.25 contract income. (Parts unlock FREE — DECISIONS D8 — so there is no
// part-entryCost sink; launch cost + RealFuels engine-config charging are the only money sinks.)
// Two income channels, both eased x1.25:
//   (1) RP-1's formula contracts (sounding-rocket altitude/distance/payload, etc.) all multiply their
//       payout by CONTRACT_GROUP[RP0]:globalHardContractMultiplier. Seed ships 1.0 (RP-1's hard
//       baseline); we raise it to 1.25.
//   (2) Our per-program flat rewards live in ProgramRewards.cfg and already bake in the x1.25 factor
//       (baseFunding / N * 1.25), so they are NOT touched here (they overwrote the formula, so the
//       multiplier above no longer applies to them — no double-count).
// globalHardContractMultiplier lives in the RP0 group's nested DATA node, not at the group root.
@CONTRACT_GROUP[RP0]:FOR[RP-AXE]
{
	@DATA:HAS[#globalHardContractMultiplier[*]]
	{
		@globalHardContractMultiplier = 1.25
	}
}
