// M3 Pass C (v1): rebuild contract income. RP-1 parked funds in program baseFunding (now dead);
// we set a flat rewardFunds on every contract gated by each program = program baseFunding / number
// of gated contracts (see docs/PROGRAMS.md). v1 is FLAT per program; capstone weighting and
// rewardScience tuning are follow-ups. Matches contracts by their `ProgramActive` requirement.
// (Begin-Program charters have no ProgramActive requirement, so they are not matched.)

