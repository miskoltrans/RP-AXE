// The "Begin Program" charters use ProgramActive only as a PREREQ, so the patches above tagged some
// of them with a reward. Reset charters to no funds (starting a program should be free). Runs after.
@CONTRACT_TYPE[AXE_Begin*]:AFTER[RP-AXE]
{
	%rewardFunds = 0
}
