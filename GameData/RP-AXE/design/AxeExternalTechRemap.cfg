// ============================================================================
// RP-AXE: remaining non-Kerbalism external orphaned-tech (found by
// tools/check_tech_refs.py). Kerbalism LS/power Configure gates are in
// AxeKerbalismTechRemap.cfg; this is the leftover.
// ============================================================================

// RealFuels engine CONFIG gated on an RP-1 solid-propellant node (ROEngines Altair etc.)
@PART[*]:HAS[@MODULE[ModuleEngineConfigs]:HAS[@CONFIG:HAS[#techRequired[solids1957]]]]:NEEDS[RealFuels]:LAST[RP-AXE]
{
	@MODULE[ModuleEngineConfigs]
	{
		@CONFIG:HAS[#techRequired[solids1957]],* { @techRequired = pc_doubleBaseSolid }
	}
}

// Kerbalism Sickbay "Permanent habitation" UPGRADE (Upgrade-Colony), on all 40 landed habitats
// and 6 GravityRing centrifuges -- gated on the RP-1 improvedHabitats node.
//
// COSMETIC ONLY, and it must stay in step with tree/nodes.yaml by hand. PartModule never reads
// `techRequired__` (0 references in Assembly-CSharp's PartModule); the live gate is
// PartUpgradeManager.Handler.IsUnlocked(name__), which AxeGrantUpgradeUnlock sets from the
// PARTUPGRADE's own techRequired -- and that is assigned by the generated AxePartPlacement.cfg
// from the `upgrades:` entry on life_permanentHabitation. Retarget both together or this line
// will quietly name a node that no longer gates anything.
@PART[*]:HAS[@MODULE[Sickbay]]:NEEDS[Kerbalism]:LAST[RP-AXE]
{
	@MODULE[Sickbay],*
	{
		@UPGRADES { @UPGRADE:HAS[#techRequired__[improvedHabitats]],* { @techRequired__ = life_permanentHabitation } }
	}
}
