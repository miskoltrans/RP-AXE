// RP-AXE — strip axed RP-1 / RP0.dll part modules (cleanup per docs/RESTART.md decisions).
// ------------------------------------------------------------------------------------------------
// Three settled decisions drive this:
//   * Tooling REMOVED  -> drop all ModuleTooling* (build-time tooling system is gone; no RP0.dll).
//   * Avionics REWRITTEN by AXE -> drop RP-1's ModuleAvionics / ModuleProceduralAvionics; AXE's own
//     ModuleAxeAvionics (design/Tree/AxeAvionicsCore.cfg) is the replacement on the procedural core.
//   * Tag metadata UNUSED -> drop ModuleTagList (2026-07-14). It's pure metadata whose every consumer AXE
//     cut (KCT cost modifiers, Leaders integration-rate, RP0's avionics/RealFuels tag appliers); AXE.dll
//     reads no part tags, and vendored contracts use Contract Configurator's own `tag` field, not part
//     tags. RP-1's PartHacks.cfg adds it to every engine + tank, so it was throwing ~510 "Cannot find a
//     PartModule" errors per load for zero effect.
// Without this, the kept :FOR[RP-0] pass (re)adds these RP0.dll modules to parts, which then throw
// "Cannot find a PartModule" at load (harmless but noisy: ~1100 lines) and would shadow AXE avionics.
//
// :FINAL so it runs AFTER the kept RP-0 pass that adds them, and after AxeAvionicsCore's :LAST[RP-AXE]
// (which already strips these from the proc core + adds ModuleAxeAvionics — a no-op here, not a conflict).
// Exact name match on ModuleAvionics/ModuleProceduralAvionics never touches AXE's ModuleAxeAvionics.
@PART[*]:FINAL
{
	!MODULE[ModuleTooling*] {}          // ModuleToolingPTank / ModuleToolingPFSide / ModuleToolingSSTUTank / ModuleToolingProcAvionics / ...
	!MODULE[ModuleAvionics] {}          // RP-1 avionics -> replaced by AXE's ModuleAxeAvionics
	!MODULE[ModuleProceduralAvionics] {}// RP-1 proc avionics -> replaced by AXE's ModuleAxeAvionics
	!MODULE[ModuleTagList] {}           // RP-1 tag metadata -> no consumer in AXE (KCT/Leaders/cost cut); just kills ~510 load errors
}
