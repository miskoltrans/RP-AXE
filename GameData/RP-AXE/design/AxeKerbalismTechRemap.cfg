// ============================================================================
// RP-AXE: remap Kerbalism-Config-RO's life-support / power `Configure` SETUP
// tech-gates to AXE tree nodes. KerbalismConfig (+ US2) gate LS/power part
// loadouts on RP-1 LS/power node IDs that don't exist in AXE's from-scratch tree
// -> the SETUP is never selectable (fail-closed) -> LS/power parts can't be
// configured. Found by tools/check_tech_refs.py (543 refs, the dominant external
// orphaned-tech cluster). First-pass era-matched mapping (user-approved); RP-1
// bundles "Life Support AND ISRU" per node, collapsed here to the LS side.
//
// Late-pass (:LAST[RP-AXE]) so the Configure + its SETUPs already exist as real
// nodes (KerbalismConfig creates them at RP-0-Kerbalism); ,* edits every matching
// Configure module and every matching SETUP on the part.
// ============================================================================
@PART[*]:HAS[@MODULE[Configure]]:NEEDS[Kerbalism]:LAST[RP-AXE]
{
	@MODULE[Configure],*
	{
		// --- life support (life_ ECLSS ladder) ---
		@SETUP:HAS[#tech[earlyLifeSupport]],*    { @tech = life_openLoopECLSS }
		@SETUP:HAS[#tech[basicLifeSupport]],*    { @tech = life_openLoopECLSS }
		@SETUP:HAS[#tech[crewSurvivability]],*   { @tech = life_openLoopECLSS }
		@SETUP:HAS[#tech[improvedLifeSupport]],* { @tech = life_stationHabitation }
		@SETUP:HAS[#tech[advancedLifeSupport]],* { @tech = life_convertedStageStation }
		@SETUP:HAS[#tech[efficientLifeSupport]],*{ @tech = life_bioregenerativeECLSS }
		@SETUP:HAS[#tech[longTermLifeSupport]],* { @tech = life_bioregenerativeECLSS }
		@SETUP:HAS[#tech[lifeSupportNF]],*       { @tech = life_aquacultureModule }
		@SETUP:HAS[#tech[lifeSupportISRU]],*     { @tech = life_isru }
		// --- power (elec_ ladder) ---
		@SETUP:HAS[#tech[improvedPower]],*           { @tech = elec_secondaryBatteries }
		@SETUP:HAS[#tech[maturePower]],*             { @tech = elec_fuelCellPower }
		@SETUP:HAS[#tech[spaceStationSolarPanels]],* { @tech = elec_stationClassSolarArrays }
		@SETUP:HAS[#tech[lunarRatedPower]],*         { @tech = elec_multiHundredWattRTG }
		@SETUP:HAS[#tech[powerNF]],*                 { @tech = elec_matureSolarArrays }
	}
}
