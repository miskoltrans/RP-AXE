// ============================================================================
// RP-AXE — capstone contract funds. GENERATED by tools/build_economy.py; do not hand-edit.
//
// RP-1 hand-marks 15 contracts as `Type: <color=red>CAPSTONE</color>` in their description —
// the crowning mission of a programme. That label is player-facing markup, not a config field, so
// it is scraped from seed/Contracts rather than derived. Each capstone pays
// 50% of its programme's funds budget; the rest lands on the programme-completion
// contract (design/Programs/AxeProgramCompletion.cfg).
//
// Budget: programme funds = RP-1 baseFunding^0.65 × 29.44239, sized so a player who does everything
// earns ~40,000,000 lifetime against ~22M of facility + part-unlock sinks. The exponent compresses
// RP-1's spread — which was back-loaded hard enough that an era could not afford the launchpad its
// own missions needed — without inverting RP-1's judgement about which programmes are big.
// See docs/ECONOMY.md §6.
//
// Design overlay, not an edit to seed/ — that folder is re-vendored verbatim by tools/sync-seed.ps1
// and any in-place change would be clobbered. `%` = set-or-create.
// ============================================================================

