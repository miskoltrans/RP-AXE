// ============================================================================
// RP-AXE: remap RP-1 contract TechResearched requirements to AXE tree nodes.
// The vendored RP-1 contracts (seed/Contracts/) gate on RP-1 tech-node IDs that
// don't exist in AXE's from-scratch tree -> Contract Configurator's TechResearched
// requirement is never satisfiable -> the contract is silently never offered.
// CONTRACT_TYPE/REQUIREMENT are top-level nodes, so a design overlay can fix them
// (no author-substitution). Requirements are either direct children of the
// CONTRACT_TYPE (depth 2) or nested one level inside an Any/All REQUIREMENT
// (depth 3) -- both shapes handled below. Found by tools/check_tech_refs.py.
// ============================================================================

// --- direct-child TechResearched requirements -------------------------------
@CONTRACT_TYPE:HAS[@REQUIREMENT:HAS[#tech[earlyDocking]]]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@REQUIREMENT:HAS[#tech[earlyDocking]] { @tech = gnc_rendezvousDocking }
}
@CONTRACT_TYPE:HAS[@REQUIREMENT:HAS[#tech[lunarRatedHeatshields]]]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@REQUIREMENT:HAS[#tech[lunarRatedHeatshields]] { @tech = cmp_lunarReturnAblator }
}

// --- nested (inside an Any/All REQUIREMENT) ---------------------------------
@CONTRACT_TYPE:HAS[@REQUIREMENT:HAS[@REQUIREMENT:HAS[#tech[secondGenCapsules]]]]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@REQUIREMENT:HAS[@REQUIREMENT:HAS[#tech[secondGenCapsules]]]
	{
		@REQUIREMENT:HAS[#tech[secondGenCapsules]] { @tech = int_geminiCapsule }
	}
}
@CONTRACT_TYPE:HAS[@REQUIREMENT:HAS[@REQUIREMENT:HAS[#tech[prototypeSpaceplanes]]]]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@REQUIREMENT:HAS[@REQUIREMENT:HAS[#tech[prototypeSpaceplanes]]]
	{
		@REQUIREMENT:HAS[#tech[prototypeSpaceplanes]] { @tech = life_spaceplaneCockpit }
	}
}
