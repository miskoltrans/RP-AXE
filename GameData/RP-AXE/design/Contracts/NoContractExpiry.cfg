// ============================================================================
// RP-AXE: a contract offer never expires.
//
// WHY: Contract Configurator's *defaults* are minExpiry = 5 / maxExpiry = 100 — an
// offered contract withdraws itself after a random 5–100 days unless it opts out. The
// opt-out is writing 0 (same convention as `deadline = 0` = no deadline). RP-1 writes
// it on 230 of its 255 contract types — but not on all of them, and AXE's own content
// never writes it at all. So today:
//   - all 35 AXE "Begin Program" charters (design/Programs/ActivatePrograms.cfg)
//   - the 6 RP-1 record contracts (seed/Contracts/{Records,Human Records})
// inherit 5–100 days and silently vanish from Mission Control, and a further 25 seed
// contracts (X-Plane Research, repeat comsats, sounding rockets) ship an explicit
// 1-day expiry. Verified against CC's own parsed dump in
// ContractConfigurator/log/{AXEPrograms,RP0}/*.log, not inferred from the .cfg text.
//
// AXE does not gate time — no KCT, no deadlines, no upkeep, free timewarp
// (docs/PROGRAMS.md "Economy model"). A self-withdrawing *offer* is the last place a
// clock can quietly take content away from the player. So make it a global rule rather
// than a per-contract opt-out: every CONTRACT_TYPE, from any source, stays on the board
// until it is taken.
//
// PASS: :FINAL on purpose — must land after Skopos's legacy-pass contract generation
// and after any ":AFTER[RP-1]" per-contract override. `%` = set-or-create, so it also
// covers the contracts that never declared the field and were riding the CC default.
// ============================================================================

@CONTRACT_TYPE:NEEDS[ContractConfigurator]:FINAL
{
	%minExpiry = 0
	%maxExpiry = 0
}

// ---------------------------------------------------------------------------
// EXCEPTION — re-offerable anti-grind contracts keep their 1-day tick.
//
// 14 seed contracts (the repeat comsat/navsat set, the repeatable sounding rockets,
// and XPlanesSupersonicOptionalHigh) scale their payout by a DATA-node `rewardFactor`
// derived from days elapsed since the last completion. CC evaluates DATA at contract
// *generation* and bakes the result into the offer, so RP-1's 1-day expiry here is NOT
// a deadline — it is the refresh tick that re-rolls the factor (and the randomised
// payload / altitude / orbit). Freeze the offer and you freeze the factor with it: the
// offer generated immediately after a completion is stuck at ~0% reward forever, which
// permanently guts the contract. The tick costs the player nothing — these are
// re-offered, not lost, and they are exactly the contracts you can always get again.
//
// Matched by shape, not by name: reward-factored AND re-offerable. A one-shot contract
// can never regenerate, so its factor cannot go stale — those stay frozen-on-the-board
// per the blanket rule above. Same file, so this lands after it.
// Delete this block if you want the anti-grind set never to expire either; the cost is
// the dead-reward behaviour described above.
// ---------------------------------------------------------------------------

@CONTRACT_TYPE:NEEDS[ContractConfigurator]:HAS[@DATA:HAS[#rewardFactor],~maxCompletions[1]]:FINAL
{
	%minExpiry = 1
	%maxExpiry = 1
}
