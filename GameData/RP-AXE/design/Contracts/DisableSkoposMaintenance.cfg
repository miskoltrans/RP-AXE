// RP-AXE Pass A fixup — disable the Skopos recurring / "maintenance" contract layer.
//
// WHY: for each of its ~46 one-shot "establish the network" master contracts, Skopos clones a
// `maintenance_<name>` contract that repeats forever, auto-accepts, and pays reputation on a monthly
// cadence (seed/Contracts/Skopos_Contract_Configs.cfg, lines 55-97). That is *elapsed-time* income.
// RP-AXE does not gate time by design (no KCT, no deadlines, no upkeep), so timewarp makes any
// per-time reward farmable. This was harmless while reputation did nothing — but RP-AXE keeps the
// stock Administration-building strategies, and Fundraising Campaign converts reputation -> funds.
// A time-farmable reputation source therefore becomes a direct warp-for-money exploit. The layer also
// spams the contract list (autoAccept = true, maxCompletions = 0). See docs/PROGRAMS.md "Economy model".
//
// FIX: delete every generated maintenance_* contract type. The one-shot master contracts
// (AchieveConnectionAvailability over a moving 90-day window) are action-gated and left untouched —
// the good half of Skopos (comsat networks as real objectives) stays; only the perpetual loop goes.
//
// PASS: :FINAL (not :FOR[RP-AXE]) on purpose — must run AFTER Skopos generates the clones (legacy
// pass) and AFTER the per-contract ":AFTER[RP-1]" "level 0" overrides. Verified: nothing requires a
// maintenance_ contract, so deleting them breaks no CompleteContract requirement or program objective.

!CONTRACT_TYPE[maintenance_*]:FINAL {}
