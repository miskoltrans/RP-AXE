// ============================================================================
// RP-AXE: the "First Launch" contract pays a token 6 science.
//
// WHY: RP-1 zeroes rewardScience on every contract — science comes from experiments
// only. AXE keeps that as the rule (docs/PROGRAMS.md, "Reward distribution":
// rewardScience is "a modest supplement only"), with one deliberate exception at the
// very start. first_FirstFlight fires before any instrument is unlocked, and T1 nodes
// cost 1 science each (docs/SCIENCE.md §4 rate table, T1 = 1), so 6 points buys the
// first six nodes: a bootstrap nudge out of the cold start, not income. Early tiers are
// meant to be capability-gated rather than science-gated, so this costs no pacing.
//
// Design overlay, not an edit to the contract: seed/ is re-vendored verbatim from RP-1
// by tools/sync-seed.ps1 and any in-place change there would be clobbered.
// `%` = set-or-create so this holds even if RP-1 drops the field upstream.
// ============================================================================

@CONTRACT_TYPE[first_FirstFlight]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	%rewardScience = 6
}
