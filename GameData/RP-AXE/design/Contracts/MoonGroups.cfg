// Define the two outer-moon-landing CONTRACT_GROUPs RP-1's Groups.cfg is missing (only
// JupiterMoonLandings and SaturnMoonLandings are declared there). Without these, the Uranian and
// Neptunian landing contracts (landingTriton, landingUmbriel/Titania/Oberon/Miranda/Ariel) fail to
// load with "Error parsing group". Mirrors the Saturn/Jupiter group shape.

CONTRACT_GROUP
{
	name = UranusMoonLandings
	displayName = Uranian Moon Landings
	minVersion = 1.12.2
	agent = Surveys
}

CONTRACT_GROUP
{
	name = NeptuneMoonLandings
	displayName = Neptunian Moon Landings
	minVersion = 1.12.2
	agent = Surveys
}
