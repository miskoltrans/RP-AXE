// --- Collect Basic Crew Science ---------------------------------------------
// All four are REQUIRED, and all four shipped both untitled and identically
// named, so the contract listed "Collect and transmit science" four times.
@CONTRACT_TYPE[CollectCrewedScienceBasic]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@PARAMETER:HAS[#experiment[RP0LiquidsMicrogravity]]
	{
		%title = Liquids in Microgravity — 3 hours in low orbit, 1 crew
	}
	@PARAMETER:HAS[#experiment[RP0FlightControl]]
	{
		%title = Flight Control Experiments — 3 hours in low orbit, 1 crew
	}
	@PARAMETER:HAS[#experiment[RP0VisualTracking]]
	{
		%title = Visual Tracking — 4 hours in low orbit, 1 crew
	}
	@PARAMETER:HAS[#experiment[RP0EarthPhotography]]
	{
		%title = Earth Photography — 6 hours in low orbit, 1 crew
	}
}

// --- First crewed lunar orbit -----------------------------------------------
// Two broadcasts of the SAME experiment at different bodies, so these key on
// name. Nested inside PARAMETER[VesselGroup].
@CONTRACT_TYPE[FirstCrewedLunarOrbit]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@PARAMETER[VesselGroup]
	{
		@PARAMETER[liveTVBroadcastEarth]
		{
			%title = Television broadcast from high Earth orbit — 4 hours, 2 crew and a live comms link
		}
		@PARAMETER[liveTVBroadcastMoon]
		{
			%title = Television broadcast from high lunar orbit — 4 hours, 2 crew and a live comms link
		}
	}
}

