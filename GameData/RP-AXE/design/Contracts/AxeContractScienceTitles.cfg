// ============================================================================
// RP-AXE: titles for the RP1CollectScience contract parameters that ship
// without one.
//
// Source/AXE/Contracts/CollectScience.cs, GetParameterTitle():
//
//     string text = string.IsNullOrEmpty(title) ? "Collect and transmit science" : title;
//
// A PARAMETER with no `title` therefore renders as that one generic string.
// 27 of the 86 RP1CollectScience parameters in seed/Contracts have no title,
// and they cluster -- Collect Prototype Crewed Station Science shows seven
// identical "Collect and transmit science" lines, Collect Basic Crew Science
// shows four (and those four are REQUIRED, not optional). The player is given
// no way to tell the lines apart, which experiment each wants, how long it
// runs, or which ones actually gate the contract.
//
// Bug family A1: config that looks authored and is half inert -- the parameter
// side was ported from RP-1 verbatim, including RP-1's missing titles.
//
// Authored in design/ rather than fixed in place because seed/Contracts is
// vendor-synced from the RP-1 clone; sync-seed would clobber edits made there.
// Keyed on `#experiment[...]` rather than on the parameter's `name` because
// several of these share a name (Proto Station Science has two parameters both
// called NarrowLaser, and all four of CrewedScienceBasic's are called
// RP1CollectScience) -- the experiment id is unique inside each contract. The
// two lunar contracts are the exception: their broadcasts use the SAME
// experiment at different bodies, so those key on `name`, and they sit nested
// inside PARAMETER[VesselGroup].
//
// Durations below are the real ones -- dataScale / data_rate from
// design/Science/CrewScience/StationExperiments.cfg -- not the "30d Placeholder"
// comments RP-1 left next to several of the divisors, which disagree with the
// arithmetic. Crew counts are the module's `requires = CrewMin_N`, which is what
// Kerbalism enforces; EXPERIMENT_DEFINITION `minCrew` is a stock field and is
// inert here (they disagree for Solar X-Ray Detection -- 2 authored, 1 live).
//
// NOTE: ContractConfigurator bakes each parameter's title into the save when the
// contract is offered. These titles reach contracts offered from now on; one
// already sitting in a save keeps its blank ones.
// ============================================================================

// --- Collect Prototype Crewed Station Science -------------------------------
// One required parameter, seven optional (100 rep each on top of the base 500).
// The three hidden IteratorCheck parameters also match RP0longDurationHabit1,
// so the required one is selected by NOT carrying `hidden`.
@CONTRACT_TYPE[CollectProtoStationScience]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@description ^= :$:<br><br>Only the multi-week habitation experiment is required. The others are optional and pay bonus reputation.:

	@PARAMETER:HAS[#experiment[RP0longDurationHabit1],~hidden[true]]
	{
		%title = Multi-Week Space Habitation — 182 days in low orbit, 2 crew, 4,560 L of Research Payload
	}
	@PARAMETER:HAS[#experiment[RP0oceanSurveillance]]
	{
		%title = Optional — Ocean Surveillance, 30 days, 3 crew
	}
	@PARAMETER:HAS[#experiment[RP0ultravioletRadiationOrthicon]]
	{
		%title = Optional — Ultraviolet Radiation Orthicon, 4 minutes, 1 crew
	}
	@PARAMETER:HAS[#experiment[RP0airglowHorizonSpectroscopy]]
	{
		%title = Optional — Airglow Horizon Spectroscopy, 6 hours, 1 crew, sun-surface angle under 60 degrees
	}
	@PARAMETER:HAS[#experiment[RP0narrowBeamLaserCommunication]]
	{
		%title = Optional — Narrow Beam Laser Communication, 24 hours, 2 crew, Tracking Station level 4
	}
	@PARAMETER:HAS[#experiment[RP0narrowBeamRadioCommunication]]
	{
		%title = Optional — Narrow Beam Radio Communication, 43 hours, 2 crew, Tracking Station level 4
	}
	@PARAMETER:HAS[#experiment[RP0vaporDistillationWaterPurification]]
	{
		%title = Optional — Vapor Distillation Water Purification, 7 days, 2 crew
	}
	@PARAMETER:HAS[#experiment[RP0solarXRayDetection]]
	{
		%title = Optional — Solar X-Ray Detection, 30 days, 1 crew, in sunlight
	}
}

