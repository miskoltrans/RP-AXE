// ============================================================================
// RP-AXE: make the First EVA contract's requirements match AXE's design.
//
// seed/Contracts/Earth Crewed Adv/FirstEVA.cfg is RP-1's, and two of its four
// requirements were written against facts that are only true in RP-1. Neither
// survives the port, and both fail CLOSED -- the contract is simply never
// offered, with no error anywhere to say why.
//
// (The third and fourth requirements -- ProgramActive and the AcceptContract
// anti-overlap guard -- port cleanly and are left alone. The TechResearched
// IDs themselves were already re-homed by AxeContractTechRemap.cfg; this file
// is about what those requirements MEAN, not what they are named.)
// ============================================================================

// --- 1. The Astronaut Complex gate: unreachable, and contrary to AXE's design.
//
// RP-1 asks for AstronautComplex minLevel = 4, and in RP-1 that is exactly
// right: RP-1's CustomBarnKit.cfg gives the complex `levels = 5` and sets
// `unlockedEVA = 4`, so the contract requirement is a restatement of "the
// player has bought the EVA unlock".
//
// AXE never re-authored that section, so the complex runs at CustomBarnKit's
// default `levels = 3`. minLevel = 4 is therefore not a high bar, it is an
// IMPOSSIBLE one -- the facility cannot reach level 4, so the requirement can
// never be met and the contract can never appear. (Swept the whole contract
// set against the merged cache: this is the only unreachable facility gate in
// AXE. Every other one is a TrackingStation level, and the DSN port gives that
// building 11 levels, so minLevel 4 and 7 are both fine.)
//
// Renumbering it to a reachable level would still be wrong, because AXE
// deliberately took EVA off the facility ladder entirely. design/Settings/
// AxeFacilities.cfg sets `homebodyAtmoEVA = true` ("EVA anywhere in Earth's
// SOI, no purchase"), and CustomBarnKit's own override is what reads it:
//
//     public override bool EVAIsPossible(bool evaUnlocked, Vessel v) {
//         if (evaUnlocked) return true;
//         if (homebodyEVA && v.mainBody == Planetarium.fetch.Home) {
//             if (!homebodyAtmoEVA) return v.LandedOrSplashed;
//             return true;                      // <- AXE lands here
//         }
//         return false;
//     }
//
// With homebodyEVA and homebodyAtmoEVA both true, a crew in Earth orbit can
// EVA at Astronaut Complex level 1. There is no level that gates the thing
// this requirement was gating, so the requirement is deleted rather than
// renumbered. In AXE what gates a first EVA is having a craft you can get out
// of -- which is requirement 2.
@CONTRACT_TYPE[first_EVA]:NEEDS[ContractConfigurator]:AFTER[RP-AXE]
{
	!REQUIREMENT:HAS[#name[FacilityEVA]] {}
}

// --- 2. The EVA-capable craft gate: missing AXE's Soviet path.
//
// RP-1 offers two ways to satisfy "must have the tech for an EVA-capable craft
// unlocked" -- a second-generation capsule or a prototype spaceplane -- which
// AxeContractTechRemap.cfg re-homes to int_geminiCapsule and
// life_spaceplaneCockpit. Both are correct, and both are on the AMERICAN side
// of the tree.
//
// AXE's tree has a third, earlier, and historically prior route that RP-1's
// requirement predates: int_voskhodCabin, which grants ROC-VoskhodAirlock.
// That part is EVA-capable BY EXPLICIT DESIGN -- design/Parts/AxeNoEva.cfg
// tags the whole early-capsule set with ModuleNoEVA and then carves the
// airlock out by name, with the note "the inflatable tunnel is the only way
// out of a Voskhod, exactly as flown on Voskhod 2".
//
// So a player on the Soviet branch can be holding the one vehicle in the game
// built for the job and still not qualify for the contract about doing it.
// Verified against the merged cache -- the crewed parts each node grants, and
// whether ModuleNoEVA is on them:
//
//     int_geminiCapsule       ROC-GeminiCMBDB, ROAdvCapsule        EVA-capable
//     life_spaceplaneCockpit  mk2/Mk1/Dyna cockpits + cabins       EVA-capable
//     int_voskhodCabin        ROC-VoskhodAirlock                   EVA-capable
//                             ROC-VoskhodCapsule                   ModuleNoEVA
//
// The descent module staying blocked is the point: the airlock is what makes
// the vehicle EVA-capable, and it is what this node grants.
//
// Selected on int_geminiCapsule (post-remap, hence :AFTER[RP-AXE]) rather than
// on the block's title, so it cannot bind to the wrong Any-block; first_EVA is
// the only contract in the set that references either tech, so this reaches
// exactly one requirement.
@CONTRACT_TYPE[first_EVA]:NEEDS[ContractConfigurator]:AFTER[RP-AXE]
{
	@REQUIREMENT:HAS[@REQUIREMENT:HAS[#tech[int_geminiCapsule]]]
	{
		REQUIREMENT
		{
			name = VoskhodAirlockResearched
			type = TechResearched
			tech = int_voskhodCabin
			title = Inflatable-Airlock Descent Module
		}
	}
}
