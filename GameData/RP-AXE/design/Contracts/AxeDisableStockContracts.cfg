// RP-AXE — turn off every stock / third-party contract type
// ---------------------------------------------------------------------------
// AXE's career runs on ContractConfigurator contracts (the RP0 group, seeded from RP-1) plus
// Programs. Everything else that generates contracts — KSP's own FinePrint/Templates set, the
// expansion contracts, and Kerbalism's — is off-design: they hand out funds and rep for goals the
// tree and the program ladder already own, and they read as Kerbal-flavoured noise in a Mission
// Control that is otherwise all RP-AXE.
//
// SYMPTOM THIS FIXES: careers were offering "Tourism" flights and Kerbalism's "Cross the belt"
// alongside the RP0 contracts (found in saves/default: 3 x TourismContract + 1 x CrossBelt, live and
// offered). RP-1 never shows these — its log disables 32 contract types at load, ours disabled zero.
//
// WHY IT LEAKED: AXE ported RP-1's StockContracts.cfg verbatim (seed/Contracts/StockContracts.cfg,
// byte-identical to upstream), but that file only disables stock PROGRESSION contracts and zeroes
// the progression rewards. It never touched the other ~27 contract types, and nothing else in AXE
// did either — same shape of gap as the GAMEPARAMETERS one (a vendored RP-1 config whose real effect
// came from somewhere else in the RP-1 install).
//
// MECHANISM: CONTRACT_CONFIGURATOR is ContractConfigurator's own node (read in SettingsBuilder via
// GameDatabase.GetConfigNodes("CONTRACT_CONFIGURATOR")). Each disabledContractType value is matched
// against the sanitized short type name and flips that contract's toggle OFF by default;
// ContractDisabler then removes the type from ContractSystem.ContractTypes and withdraws any copy
// already offered. The types still get a player-facing checkbox — see SCOPE.
//
// SCOPE — NEW CAREERS. These are DEFAULTS for CC's per-save toggles, which live in the save as the
// StockContractParametersTemplate node and win over this file once written. An existing career keeps
// whatever it was created with; fix one in-game via Settings -> Difficulty Options -> Contract
// Configurator (unticking a type withdraws its offered contracts), or edit that node in
// persistent.sfs to False.
//
// The list is exactly the 27 types this install exposes (KSP.log: "Found 28 contract types", the
// 28th being CC's own ConfiguredContract, which must stay). Adding a mod that ships its own
// stock-style Contract subclass means adding it here too — e.g. DMagic Orbital Science, which RP-1
// disables, would need DMAnomalyContract / DMReconContract / DMMagneticSurveyContract /
// DMSurveyContract / DMAsteroidSurveyContract.

CONTRACT_CONFIGURATOR
{
	// Stock — FinePrint.Contracts
	disabledContractType = ARMContract
	disabledContractType = BaseContract
	disabledContractType = ExplorationContract
	disabledContractType = ISRUContract
	disabledContractType = SatelliteContract
	disabledContractType = StationContract
	disabledContractType = SurveyContract
	disabledContractType = TourismContract

	// Stock — Contracts.Templates
	disabledContractType = CollectScience
	disabledContractType = GrandTour
	disabledContractType = OrbitalConstructionContract
	disabledContractType = PartTest
	disabledContractType = PlantFlag
	disabledContractType = RecoverAsset
	disabledContractType = RoverConstructionContract
	disabledContractType = VesselRepairContract

	// Stock — comet / Sentinel telescope
	disabledContractType = CometDetectionContract
	disabledContractType = CometSampleContract
	disabledContractType = SentinelContract

	// Breaking Ground (Serenity)
	disabledContractType = DeployedScienceContract
	disabledContractType = ROCScienceArmContract
	disabledContractType = ROCScienceRetrievalContract

	// Kerbalism
	disabledContractType = CrossBelt
	disabledContractType = CrossHeliopause
	disabledContractType = MannedOrbit
	disabledContractType = SpaceAnalysis
	disabledContractType = SpaceHarvest
}
