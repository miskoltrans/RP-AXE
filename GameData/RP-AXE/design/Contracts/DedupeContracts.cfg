// Resolve duplicate CONTRACT_TYPE names that RP-1's CC_RP0 plugin (ContractClobberer) used to
// dedupe at runtime. Without that plugin, ContractConfigurator drops one copy with a "duplicate
// name" error. We delete the redundant copy here (MM runs before CC parses contracts), keeping the
// better-categorised one. Distinguished by the contracts' `group` field.

// FirstTundraSat: keep TargetedSats ("First Tundra Orbit Satellite"); drop the CommApp2 test variant.
!CONTRACT_TYPE[FirstTundraSat]:HAS[#group[CommApp2]]:FOR[RP-AXE] {}

// landingTriton: keep NeptuneMoonLandings (Triton is a moon of Neptune); drop the OuterGasGiantSurvey copy.
!CONTRACT_TYPE[landingTriton]:HAS[#group[OuterGasGiantSurvey]]:FOR[RP-AXE] {}
