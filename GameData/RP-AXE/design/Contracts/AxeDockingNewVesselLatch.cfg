// ============================================================================
// RP-AXE: keep `NewVessel` satisfied through the dock that completes the
// contract.
//
// A VesselParameterGroup that asks for BOTH "launch a new vessel" and "dock
// two spacecraft" is asking for two things that cannot be true at the same
// instant, because docking is what destroys the first one. Reported from a
// live First Docking attempt: the parameter is green right up to hard lock,
// then flips to unmet at the moment of contact and the contract never fires.
//
// Contract Configurator's NewVessel is an ALL-PARTS predicate, not a fact
// about the launch:
//
//     NewVessel.VesselMeetsCondition(v)
//       -> VesselUtilities.VesselLaunchedAfterID(launchID, v, <no ignores>)
//          foreach (Part part in v.Parts)
//              if (part.launchID >= launchID) continue;
//              return false;              // ANY pre-contract part disqualifies
//
// where launchID is stamped from HighLogic.CurrentGame.launchID when the
// contract is accepted. Docking merges the two craft into ONE vessel whose
// Parts list now contains the target's parts, every one of them launched
// before the contract existed -- so the predicate goes false the instant the
// Docking parameter goes true, and the group can never have all its children
// met at once.
//
// Contract Configurator is aware of the merge and tries to carry the result
// across it. VesselParameter.OnPartAttach propagates a completed state from
// the docked vessel that has it to the one that does not (VesselInfo.strength
// defaults to STRONG, so the `strength != WEAK` guard passes) -- and then ends
// with CheckVessel(e.host.vessel), which re-runs the predicate on the merged
// vessel, gets false, and overwrites what it just propagated. The overwrite is
// only possible because the parameter still allows a state RESET:
//
//     VesselParameter.SetState(vessel, state)
//       if (this.disableOnStateChange) { this.disableOnStateChange = false;
//                                        allowStateReset = false; }
//       ...
//       if (allowStateReset || state != Incomplete) { ...apply... }
//
// So `disableOnStateChange = true` is exactly the lever: it clears
// allowStateReset, after which an Incomplete result is discarded and the
// earned completion stands. It cannot wrongly complete anything -- Complete
// (state != Incomplete) always applies, so a player who never launches a new
// vessel never latches anything.
//
// This is RP-1's own pattern, not an invention: of the four vessel groups in
// the set that combine NewVessel with Docking, the two station-supply ones
// (supplyProtoStation, supplySecondGenerationStation) already carry
// `disableOnStateChange = true` on their NewVessel. Only the two capstone
// docking contracts -- first_Docking and first_SpaceplaneDocking -- were
// missed, and both seed files are byte-identical to RP-1 upstream, so the bug
// is RP-1's rather than a porting error.
//
// Written against the SHAPE (a group holding both parameters) rather than
// against the two contract names, so a vendored contract that arrives later
// with the same combination is covered on the day it lands. `%` makes it
// idempotent, so the two already-correct groups are simply reasserted.
@CONTRACT_TYPE:HAS[@PARAMETER:HAS[@PARAMETER:HAS[#type[NewVessel]],@PARAMETER:HAS[#type[Docking]]]]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@PARAMETER:HAS[@PARAMETER:HAS[#type[NewVessel]],@PARAMETER:HAS[#type[Docking]]]
	{
		@PARAMETER:HAS[#type[NewVessel]]
		{
			%disableOnStateChange = true
		}
	}
}
