// Rename the top-level Mission Control folder. RP-1's seed/Contracts/Groups.cfg declares the parent
// CONTRACT_GROUP as `name = RP0` / `displayName = RP-1`, and Contract Configurator shows the
// displayName as the folder every seed contract sits in. AXE is not RP-1, so the folder just says
// what it holds. Only the displayName moves: `name = RP0` is the group's identity (every nested
// group hangs under it), so it stays.

@CONTRACT_GROUP[RP0]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	@displayName = Contracts
}
