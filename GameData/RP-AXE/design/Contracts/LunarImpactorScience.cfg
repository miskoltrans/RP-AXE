// ============================================================================
// RP-AXE: the lunar impactor pays ~60 science.
//
// WHY: the impactor is the one early contract whose *mission* is the experiment —
// RP-1 already treats it as such (it is one of only two contract types upstream
// that carries a non-zero rewardScience: 15 on both the required first flight and
// the repeats, everything else in the programme is 0). AXE keeps the doctrine that
// science comes from instruments, not from contract text (docs/PROGRAMS.md,
// "Reward distribution"), with the impactor as the deliberate second exception
// after first_FirstFlight (see FirstLaunchScience.cfg). Hitting the Moon hard
// enough to be seen from home IS the measurement; there is no instrument to fly.
//
// SIZING: ~60 points lands between a tier-4 node (40) and a tier-5 node (80) —
// tree/nodes.yaml `tier_cost` — i.e. the mission buys roughly one contemporary
// breakthrough. It is a nudge across an era boundary, not an income stream.
//
// THE NUMBER IS NOT THE PAYOUT. Stock scales every contract reward before paying
// it (Assembly-CSharp, Contract.SetScience → GameVariables):
//
//     ScienceCompletion = Round(rewardScience
//                             x GetContractPrestigeFactor(prestige)   // 1 / 1.25 / 1.5
//                             x contractScienceCompletionFactor       // 1, untouched by AXE
//                             x Career.ScienceGainMultiplier          // 1.1 on Normal
//                             x destWeight)                           // 1: the RP0 root group
//                                                                     //    sets useTargetBodyForReward = false
// So at the reference preset (Normal, design/Settings/AxeGameParameters.cfg):
//
//     LunarImpactor          43.6 x 1.25 (Significant) x 1.1 = 59.95 -> 60 science
//     LunarImpactorOptional  43.6 x 1.00 (Trivial)     x 1.1 = 47.96 -> 48 science, x2 completions
//
// The two share one config value on purpose: prestige alone separates the first
// impact from the repeats, exactly as RP-1 intended when it wrote 15 on both.
// Other presets move with ScienceGainMultiplier (Easy 1.2, Moderate/Hard 1.0).
// See [[ksp-contract-reward-multipliers]] / docs/ECONOMY.md.
//
// Design overlay, not an edit to the contract: seed/ is re-vendored verbatim from
// RP-1 by tools/sync-seed.ps1 and any in-place change there would be clobbered.
// `%` = set-or-create so this holds even if RP-1 drops the field upstream.
// ============================================================================

@CONTRACT_TYPE[LunarImpactor]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	%rewardScience = 43.6
}

@CONTRACT_TYPE[LunarImpactorOptional]:NEEDS[ContractConfigurator]:FOR[RP-AXE]
{
	%rewardScience = 43.6
}
