// RP-AXE in-game R&D render port settings. Read by AXE.dll (Source/AXE/RnD) on R&D scene load
// via GameDatabase.GetConfigNodes("RPAXE_RENDER"). ModuleManager-patchable.
//
//   layout      = sugiyama | bands | stock   layered Sugiyama layout (default), discipline bands, or leave stock/compiler positions
//   laneRouting = true | false    tight lane-routed orthogonal arrows vs stock elbows
//   fan         = true | false     spread edge endpoints along the node side vs stock convergence
//   lanePitch   = <px>            spacing between parallel routed arrows (0 = collapse to one line; try 1 / 6 / 20)
//   discColor   = true | false    tint nodes + edges by discipline colour
//   legend      = true | false    show the discipline colour legend overlay in R&D
//   hover       = true | false    hover a node to trace its lineage (dim the rest); click still pins
//
// Settings are read once at KSP startup — edit + RESTART KSP to see changes.
// Safe fallback: set layout = stock to disable the whole feature (nodes + arrows revert to stock).
RPAXE_RENDER
{
	layout = sugiyama
	laneRouting = true
	fan = true
	lanePitch = 1
	discColor = true
	legend = true
	hover = true
}
