// ============================================================================
// Kerbalism takes SCANsat's scanners over: KerbalismScansat replaces SCANexperiment
// so the science, the background scanning and the stop/resume-on-low-EC logic all
// run through Kerbalism.
// ============================================================================
@PART[*]:HAS[@MODULE[SCANexperiment]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = #$../MODULE[SCANexperiment]/experimentType$
	}
	!MODULE[SCANexperiment] {}
}

@PART[*]:HAS[@MODULE[SCANsat],@MODULE[KerbalismScansat]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[SCANsat]/RESOURCE[ElectricCharge]/rate$
	}
}

@PART[*]:HAS[@MODULE[ModuleSCANresourceScanner],@MODULE[KerbalismScansat]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[ModuleSCANresourceScanner]/RESOURCE[ElectricCharge]/rate$
	}
}

// ============================================================================
// LATE ARRIVALS. The pass above is the upstream shape, and it runs at
// AFTER[RP-0-Kerbalism] -- which sorts BEFORE :BEFORE[SCANsat], because MM orders mod
// passes by name and "RP-0-Kerbalism" < "SCANsat". RN_US_Probes builds its scanner
// parts at :BEFORE[SCANsat], so rn_galileo_scanner, rn_ladee_scanner and
// rn_magellan_scanner grew four SCANexperiment modules each AFTER the takeover had
// already looked at them and found nothing. They kept SCANsat's own stock-science
// module in a Kerbalism-science install, and never scanned in the background at all.
//
// Sweep again at :FINAL. One block per experiment type rather than one for the node
// name, because the upstream shape copies MODULE[SCANexperiment] index 0 and these
// parts carry four -- and because the type is the closed set Kerbalism itself
// switches on (SCANsat.ScienceSensorType).
// ============================================================================
@PART[*]:HAS[@MODULE[SCANexperiment]:HAS[#experimentType[SCANsatAltimetryLoRes]]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatAltimetryLoRes
	}
	!MODULE[SCANexperiment]:HAS[#experimentType[SCANsatAltimetryLoRes]] {}
}

@PART[*]:HAS[@MODULE[SCANexperiment]:HAS[#experimentType[SCANsatAltimetryHiRes]]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatAltimetryHiRes
	}
	!MODULE[SCANexperiment]:HAS[#experimentType[SCANsatAltimetryHiRes]] {}
}

@PART[*]:HAS[@MODULE[SCANexperiment]:HAS[#experimentType[SCANsatBiomeAnomaly]]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatBiomeAnomaly
	}
	!MODULE[SCANexperiment]:HAS[#experimentType[SCANsatBiomeAnomaly]] {}
}

@PART[*]:HAS[@MODULE[SCANexperiment]:HAS[#experimentType[SCANsatVisual]]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatVisual
