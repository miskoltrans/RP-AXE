	!MODULE[SCANexperiment]:HAS[#experimentType[SCANsatVisual]] {}
}

@PART[*]:HAS[@MODULE[SCANexperiment]:HAS[#experimentType[SCANsatResources]]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatResources
	}
	!MODULE[SCANexperiment]:HAS[#experimentType[SCANsatResources]] {}
}

// The stock orbital survey scanner is a SCANsat ResourceHiRes head -- sensorType 256,
// the exact bit SCANsat.ScienceSensorType maps SCANsatResources onto -- that SCANsat
// never gave a SCANexperiment, so nothing above reaches it.
//
// Its sibling SurveyScanner is deliberately NOT here. It is ResourceLoRes (128),
// Kerbalism maps no experiment to that bit, and KerbalismScansat.OnStart would
// overwrite its persistent sensorType with 256 -- silently promoting a lo-res scanner
// to hi-res to buy it power management. It keeps its stock draw instead.
@PART[OrbitalScanner]:HAS[@MODULE[ModuleSCANresourceScanner]:HAS[#sensorType[256]],!MODULE[KerbalismScansat]]:NEEDS[SCANsat]:FINAL
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = SCANsatResources
	}
}

// ============================================================================
// POWER HAND-OFF. KerbalismScansat bills ec_rate through the Kerbalism resource sim,
// loaded and unloaded alike, while SCANsat's own module goes on billing its RESOURCE
// node through the stock path (resHandler.UpdateModuleResourceInputs in
// SCANsat.FixedUpdate) for as long as the vessel is loaded. Two systems, one radio
// set: a scanner cost 2x in flight what the same scanner cost in the background, and
// Kerbalism's planner -- which only knows the KerbalismScansat case -- quoted the
// single rate, so the VAB under-read by the same amount that flight over-charged.
//
// Re-copy the rate, then zero SCANsat's side, so exactly one system bills for the
// hardware. At :FINAL rather than alongside the copy above because RO's own part
// patches land as late as :LAST[SCANsat] -- scansat-sar-paz-1 takes its 0.640 EC/s
// there, long after AFTER[RP-0-Kerbalism] had captured RSS's 0.1.
//
// Zeroing is safe on SCANsat's side: with rate 0 the stock check reads
// `currentAmount(0) < currentRequest(0) * threshold`, stays false, and never trips
// powerIsProblem -- so stop/resume-on-low-EC stays in KerbalismScansat, which is where
// the background path needs it.
// ============================================================================

// A part with SEVERAL scanner heads cannot use the single-head rule further down: that
// one copies from MODULE[SCANsat] index 0 and zeroes index 0, whereas Kerbalism binds
// each KerbalismScansat to a head by BITMASK at runtime (SCANsat.FindScanner), which MM
// cannot evaluate. The single-head rule is exactly right whenever there IS one head,
// because FindScanner's own last resort is "the only scanner module on the part" --
// six of the wired parts declare an experiment bit their head does not even carry
// (RO-BasicTVCamera claims Visual/64 on a head of 12) and work only via that fallback.
//
// So mark the multi-head parts, and hand their power over head by head. RN gives each
// head a distinct scanName, which is the only discriminator on these parts that MM can
// read. If a value lookup below ever fails, the rate simply stays unset and that head
// keeps its stock draw -- the pre-existing behaviour, never a double bill.
@PART[rn_galileo_scanner|rn_ladee_scanner|rn_magellan_scanner]:NEEDS[SCANsat,RN_US_Probes]:FINAL
{
	%AxeScansatMultiHead = true
}

@PART[*]:HAS[#AxeScansatMultiHead[true],@MODULE[KerbalismScansat]:HAS[#experimentType[SCANsatAltimetryLoRes]],@MODULE[SCANsat]:HAS[#scanName[RADAR],@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[KerbalismScansat]:HAS[#experimentType[SCANsatAltimetryLoRes]]
	{
		%ec_rate = #$../MODULE[SCANsat]:HAS[#scanName[RADAR]]/RESOURCE[ElectricCharge]/rate$
	}
	@MODULE[SCANsat]:HAS[#scanName[RADAR]]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0
		}
	}
}

@PART[*]:HAS[#AxeScansatMultiHead[true],@MODULE[KerbalismScansat]:HAS[#experimentType[SCANsatAltimetryHiRes]],@MODULE[SCANsat]:HAS[#scanName[SAR],@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[KerbalismScansat]:HAS[#experimentType[SCANsatAltimetryHiRes]]
	{
		%ec_rate = #$../MODULE[SCANsat]:HAS[#scanName[SAR]]/RESOURCE[ElectricCharge]/rate$
	}
	@MODULE[SCANsat]:HAS[#scanName[SAR]]
	{
