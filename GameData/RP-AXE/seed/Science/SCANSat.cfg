		{
			@rate = 0
		}
	}
}

@PART[*]:HAS[#AxeScansatMultiHead[true],@MODULE[KerbalismScansat]:HAS[#experimentType[SCANsatBiomeAnomaly]],@MODULE[SCANsat]:HAS[#scanName[Multispectral],@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
