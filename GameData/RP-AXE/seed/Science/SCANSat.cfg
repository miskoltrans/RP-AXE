// Kerbalism takes SCANsat's scanners over: KerbalismScansat replaces SCANexperiment
// so the science, the background scanning and the stop/resume-on-low-EC logic all
// run through Kerbalism.
@PART[*]:HAS[@MODULE[SCANexperiment]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	MODULE
	{
		name = KerbalismScansat
		experimentType = #$../MODULE[SCANexperiment]/experimentType$
	}
	!MODULE[SCANexperiment] {}
}

@PART[*]:HAS[@MODULE[SCANsat],@MODULE[KerbalismScansat]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[SCANsat]/RESOURCE[ElectricCharge]/rate$
	}
}

@PART[*]:HAS[@MODULE[ModuleSCANresourceScanner],@MODULE[KerbalismScansat]]:NEEDS[SCANsat]:AFTER[RP-0-Kerbalism]
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[ModuleSCANresourceScanner]/RESOURCE[ElectricCharge]/rate$
	}
}

// ... but the power was still being billed TWICE on a loaded vessel. KerbalismScansat
// bills ec_rate through the Kerbalism resource sim (loaded and unloaded alike), while
// SCANsat's own module keeps billing its RESOURCE node through the stock path
// (resHandler.UpdateModuleResourceInputs in SCANsat.FixedUpdate) for as long as the
// vessel is loaded. Two systems, one radio set: a scanner cost 2x in flight what the
// same scanner cost in the background, and Kerbalism's planner — which only knows the
// KerbalismScansat case — quoted the single rate, so the VAB under-read by the same
// amount that flight over-charged.
//
// Re-copy the rate and then zero SCANsat's side, so exactly one system bills for the
// hardware. This runs at :FINAL rather than alongside the copy above because RO's own
// part patches land as late as :LAST[SCANsat] — scansat-sar-paz-1 gets its 0.640 EC/s
// there, long after AFTER[RP-0-Kerbalism] captured RSS's 0.1.
@PART[*]:HAS[@MODULE[KerbalismScansat],@MODULE[SCANsat]:HAS[@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[SCANsat]/RESOURCE[ElectricCharge]/rate$
	}
}

@PART[*]:HAS[@MODULE[KerbalismScansat],@MODULE[ModuleSCANresourceScanner]:HAS[@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[KerbalismScansat]
	{
		%ec_rate = #$../MODULE[ModuleSCANresourceScanner]/RESOURCE[ElectricCharge]/rate$
	}
}

@PART[*]:HAS[@MODULE[KerbalismScansat],@MODULE[SCANsat]:HAS[@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0
		}
	}
}

@PART[*]:HAS[@MODULE[KerbalismScansat],@MODULE[ModuleSCANresourceScanner]:HAS[@RESOURCE[ElectricCharge]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[ModuleSCANresourceScanner]
	{
		@RESOURCE[ElectricCharge]
		{
			@rate = 0
		}
	}
}
