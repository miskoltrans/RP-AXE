epThrottleLanding": {"title": "Deep-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once — or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people.", "parts": [{"name": "RO-KTDU417", "mod": "Squad", "title": "KTDU-417"}, {"name": "ROC-LEMLMAEBDB", "mod": "ROCapsules", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROC-LEMLMDEBDB", "mod": "ROCapsules", "title": "Lunar Module Descent Engine (LMDE)"}, {"name": "ROE-LMAE", "mod": "ROEngines", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROE-LMDE", "mod": "ROEngines", "title": "Lunar Module Descent Engine (LMDE)"}], "upgrades": [], "grants": []}, "fd_lunarSurfaceMobility": {"title": "Powered Hop Transit", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Once you are down, get around — a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints.", "parts": [{"name": "ROC-LEMRover", "mod": "ROCapsules", "title": "Apollo Lunar Roving Vehicle (LRV)"}, {"name": "ROC-LFVBDB", "mod": "ROCapsules", "title": "Lunar Flying Vehicle"}], "upgrades": ["RFUpgrade_LMDE-J", "RFUpgrade_RS-18"], "grants": []}, "fd_gasGeneratorApex": {"title": "Diminishing-Return Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One more percent of thrust from a cycle with nothing left to give. The mightiest engine ever built is also the end of its line — spend a whole tier here and you have bought a rounding error while staged combustion and hydrolox walk past you.", "parts": [{"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_E-1-500k", "RFUpgrade_F-1-1.52M", "RFUpgrade_LR87-AJ-11-Kero", "RFUpgrade_LR91-AJ-11-Kero", "RFUpgrade_RS-27", "RFUpgrade_Viking-5C"], "grants": []}, "fd_matureKeroloxClusterUprating": {"title": "Mature Kerolox Cluster Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Refine the whole family of clustered gas-generator kerolox boosters mark by mark — more thrust, longer service life, no change to the chemistry. The same diminishing-return story as F-1's own trap, one tier over, for its smaller siblings.", "parts": [], "upgrades": ["RFUpgrade_H-1-200K", "RFUpgrade_H-1-205K"], "grants": []}, "cryo_extendedBurnExpander": {"title": "Extended-Burn Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Qualify the expander for the long haul: a chamber and turbine that survive nine minutes of firing instead of five, and a nozzle re-cut for the vacuum it will actually spend that time in. The upper stage stops being a kick motor and becomes something you can coast on, restart, and trust with the whole mission.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3A"], "grants": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed — trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_AJ10-133-LH", "RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster — a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-J2X", "mod": "ROEngines", "title": "J-2X"}, {"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2-230K", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_RL10A-3-3B"], "grants": []}, "cryo_refinedExpander": {"title": "Refined Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Wring more specific impulse out of the closed expander cycle — hotter, tighter plumbing on the efficient small upper stage.", "parts": [], "upgrades": ["RFUpgrade_LE-5A", "RFUpgrade_RL10A-3-3", "RFUpgrade_RL10A-4-1N", "RFUpgrade_RL10A-4N", "RFUpgrade_RL10B-2"], "grants": []}, "pc_throttledClosedCycle": {"title": "Derated Closed-Cycle Sustainer", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Take the booster's closed-cycle engine and deliberately run it below what it can do. Chamber pressure comes down, the turbine stops living on the edge, and the engine that was a reliability problem at full throttle becomes one you can stack thirty of and still expect to reach orbit.", "parts": [], "upgrades": ["RFUpgrade_NK-21"], "grants": []}, "pc_refinedMixtureClosedCycle": {"title": "Trimmed Closed-Cycle Mixture Ratio", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Re-trim the oxidiser-to-fuel ratio and the preburner split until the cycle gives up another twelve seconds without touching the hardware — the cheapest specific impulse in rocketry, and the hardest to find, because everything upstream of the injector has to be measured before it can be moved.", "parts": [], "upgrades": ["RFUpgrade_NK-39"], "grants": []}, "pc_restartableClosedCycle": {"title": "Restartable Oxidiser-Rich Closed Cycle", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Relight a staged-combustion engine in vacuum, which means restarting an oxidiser-rich preburner that will happily burn its own turbine if the start sequence slips. Two ignitions instead of one, and the upper stage can finally choose when to fall.", "parts": [], "upgrades": ["RFUpgrade_NK-31"], "grants": []}, "pc_closedCycleUpper": {"title": "Closed-Cycle Upper-Stage Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Shrink the oxidiser-rich preburner until it fits an upper stage, where the gain is not thrust but the specific impulse you carry all the way to escape. A small closed-cycle engine is harder per kilonewton than a big one — the turbine still has to survive its own exhaust, and now there is no mass budget to armour it with.", "parts": [], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M"], "grants": []}, "pc_rg1": {"title": "High-Density Kerosene Cut", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Distil the kerosene to a narrower, denser, more thermally stable cut than anything an aircraft would burn — more mass of fuel in the same tank, and it stops coking the regenerative passages when the chamber runs hot. The fuel stops being a commodity and becomes part of the engine's design.", "parts": [], "upgrades": ["RFUpgrade_NK-9-1972", "RFUpgrade_RD-58"], "grants": []}, "pc_rg1Uprating": {"title": "Oxidiser-Rich Preburner Uprating", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Drive the preburner harder and re-trim the mixture until the closed cycle gives up another seven seconds — the last easy specific impulse in a design that is already recycling everything it burns.", "parts": [], "upgrades": ["RFUpgrade_RD-58M"], "grants": []}, "pc_extendedNozzleUpper": {"title": "Extended-Nozzle Upper Stage", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Hang a far larger bell on an upper-stage engine that will never see air: sea-level performance collapses and nobody cares, because every second of it is spent in vacuum. The nozzle stops being a compromise between two regimes and is cut for the only one that matters.", "parts": [], "upgrades": ["RFUpgrade_RD-58M-CCN"], "grants": []}, "pc_syntin": {"title": "Strained-Ring Synthetic Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Synthesise the fuel instead of refining it: pack the energy into strained hydrocarbon rings that give it back when they break. Denser and hotter than any kerosene cut, absurdly expensive, and flown anyway when a few seconds of specific impulse were worth more than the money.", "parts": [], "upgrades": ["RFUpgrade_17D12", "RFUpgrade_RD-107-11D512P", "RFUpgrade_RD-108-11D511P"], "grants": []}, "pc_n1ClosedCycle": {"title": "Subcooled-Propellant Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale — the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did.", "parts": [{"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}, {"name": "ROE-NK43", "mod": "ROEngines", "title": "NK-15V/43"}, {"name": "SXTNK21BlockV", "mod": "SXT", "title": "N1 Block V"}], "upgrades": ["RFUpgrade_NK-19"], "grants": []}, "pc_protonStagedCombustion": {"title": "Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying.", "parts": [{"name": "ROE-RD0210", "mod": "ROEngines", "title": "RD-0208/0210"}, {"name": "ROE-RD254", "mod": "ROEngines", "title": "RD-254"}, {"name": "ROE-RD275", "mod": "ROEngines", "title": "RD-253/RD-275"}], "upgrades": [], "grants": []}, "pc_refinedStorableORSC": {"title": "Refined Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Squeeze the storable staged-combustion boosters a little further — Mk-II chambers, higher flow, the same dependable poison.", "parts": [], "upgrades": ["RFUpgrade_RD-0203U", "RFUpgrade_RD-0210", "RFUpgrade_RD-0212", "RFUpgrade_RD-0213", "RFUpgrade_RD-0214", "RFUpgrade_RD-253-Mk2", "RFUpgrade_RD-254-11D44-Mk2"], "grants": []}, "nuc_nuclearThermalRocket": {"title": "Solid-Core Nuclear Thermal Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Heat liquid hydrogen in a fission reactor and blow it out a nozzle — twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here.", "parts": [{"name": "KIWIA24", "mod": "Squad", "title": "Kiwi A3 Atomic Rocket Motor"}, {"name": "KIWIB48", "mod": "Squad", "title": "Kiwi B4E Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_nuclearRamjet": {"title": "Reactor-Heated Ramjet", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest — an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose.", "parts": [{"name": "RO-A136", "mod": "Squad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"]}, "shd_interplanetaryAvionics": {"title": "Radiation-Shielded Avionics — Interplanetary", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Harden the long-duration cruise stack itself, not just its chassis — shielded electronics for a coast that spends months, not hours, deep in interplanetary radiation.", "parts": [], "upgrades": [], "grants": ["Deep-Space-interplanetaryProbes"]}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good.", "parts": [{"name": "RO-SaturnI-IU", "mod": "ReStockPlus", "title": "Saturn I Instrument Unit [3.9 m]"}], "upgrades": [], "grants": ["Science-Core-improvedAvionics"]}, "shd_digitalGuidanceComputer": {"title": "Radiation-Shielded Avionics — Digital", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The first digital guidance computer, rebuilt around radiation-hardened logic — a machine that keeps computing fresh corrections after a dose that would upset an unshielded chip.", "parts": [], "upgrades": [], "grants": ["Deep-Space-improvedAvionics"]}, "comp_realTimeFlightComputer": {"title": "Priority-Interrupt Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one.", "parts": [{"name": "restock-drone-core-375-1", "mod": "ReStockPlus", "title": "Saturn IB/V Instrument Unit [6.6 m]"}], "upgrades": [], "grants": ["Science-Core-matureAvionics"]}, "shd_realTimeFlightComputer": {"title": "Radiation-Shielded Avionics — Real-Time", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The priority-interrupt flight computer, shielded to keep juggling guidance, navigation and engine control after a dose that would otherwise upset its scheduler.", "parts": [], "upgrades": [], "grants": ["Deep-Space-matureAvionics"]}, "comp_networkedAvionics": {"title": "Multi-Vehicle Avionics Integration", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together.", "parts": [], "upgrades": ["HDD-Upgrade-1969", "RFTech-ComSat-III", "RFTech-NavSat-III"], "grants": ["Science-Core-largeScaleAvionics"]}, "shd_networkedAvionics": {"title": "Radiation-Shielded Avionics — Networked", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Multi-vehicle avionics integration, hardened for a station or relay constellation that spends its whole service life outside Earth's protective magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-largeScaleAvionics"]}, "comp_multiplyRedundantFlightComputer": {"title": "Multiply-Redundant General-Purpose Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Four identical general-purpose computers vote on every result, and a fifth arbitrates a tie — fly-by-wire trusted with a crew's life because no single failure, or even a single disagreement, can bring it down. The Shuttle's own avionics generation.", "parts": [], "upgrades": ["HDD-Upgrade-1975"], "grants": ["Science-Core-advancedAvionics"]}, "shd_multiplyRedundantFlightComputer": {"title": "Radiation-Shielded Avionics — Redundant", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Quadruple-redundant fly-by-wire, shielded to keep out-voting a radiation-flipped bit the same way it out-votes any other single failure — trusted with a crew on a mission that never comes home to Earth's shelter.", "parts": [], "upgrades": [], "grants": ["Deep-Space-advancedAvionics"]}, "comp_distributedAvionicsBus": {"title": "Distributed Avionics Data Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Stop wiring every sensor and actuator straight to the computer and put them all on one shared data bus instead — a single twisted pair carrying every subsystem's traffic, addressed and time-sliced instead of home-run cabled. The wiring-harness weight a modular station can no longer afford to carry.", "parts": [], "upgrades": [], "grants": ["Science-Core-nextGenAvionics"]}, "shd_distributedAvionicsBus": {"title": "Radiation-Shielded Avionics — Distributed Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "The shared data bus, radiation-hardened end to end — every sensor and actuator on the line survives the same dose the flight computer does, for an outer-system mission with no wiring-harness weight to spare.", "parts": [], "upgrades": [], "grants": ["Deep-Space-nextGenAvionics"]}, "comp_digitalEngineControl": {"title": "Full-Authority Digital Engine Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Put a computer between the throttle and the engine and let it, not a hydromechanical governor, decide what the valves do. It trims mixture ratio in closed loop against measured chamber pressure, holds the engine at a margin a mechanical linkage could never be trusted near, and shuts it down cleanly on a sensor trend instead of a failure. The same step that turned a carburettor into an engine management unit, applied to something with a turbopump.", "parts": [], "upgrades": ["RFUpgrade_HG-3A-SL", "RFUpgrade_RS-68B"], "grants": []}, "comp_softwareDefinedFlightControl": {"title": "Software-Defined Flight Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Move the control laws out of hardwired logic and into software that can be patched after launch — a flight computer whose behaviour is a file to update, not a board to re-etch, for a vehicle meant to keep flying for years.", "parts": [], "upgrades": ["HDD-Upgrade-1990"], "grants": ["Science-Core-longTermAvionics"]}, "shd_softwareDefinedFlightControl": {"title": "Radiation-Shielded Avionics — Software-Defined", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Software-patchable flight control, shielded for a vehicle meant to keep flying for years deep in the outer system, where a board re-etch is never an option.", "parts": [], "upgrades": [], "grants": ["Deep-Space-longTermAvionics"]}, "comp_interoperableAvionicsStandard": {"title": "Interoperable Avionics Standard", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Agree on a common data-bus protocol and command format across national space programmes, so a module built on one continent can dock, hand off power and share telemetry with one built on another without a custom adapter for every pairing.", "parts": [], "upgrades": ["HDD-Upgrade-1998"], "grants": ["Science-Core-internationalAvionics"]}, "shd_interoperableAvionicsStandard": {"title": "Radiation-Shielded Avionics — Interoperable", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "The common data-bus standard, hardened alike across every national programme's hardware — an international deep-space handoff that survives the same radiation on either end.", "parts": [], "upgrades": [], "grants": ["Deep-Space-internationalAvionics"]}, "comp_commercialOffTheShelfAvionics": {"title": "Commercial Off-The-Shelf Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Skip the custom-built, radiation-hardened rack and fly triple-redundant commercial processors instead — orders of magnitude more computing power for a fraction of the cost and years off the schedule, the same bet the whole modern commercial launch industry made.", "parts": [], "upgrades": ["HDD-Upgrade-2010", "HDD-Upgrade-2020"], "grants": ["Science-Core-modernAvionics"]}, "shd_commercialOffTheShelfAvionics": {"title": "Radiation-Shielded Avionics — Commercial", "discipline": "Computing", "color": "#d13bc4", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Take the same commercial processors and wrap them in the hardening they skipped — cheap compute, radiation-rated, for a deep-space mission that can't afford a custom rack but also can't afford a bit-flipped autopilot.", "parts": [], "upgrades": [], "grants": ["Deep-Space-modernAvionics"]}, "av_highBypassTurbofan": {"title": "High-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Wrap the core in a huge ducted fan and let most of the air bypass the burner entirely — the quiet, thrifty engine that made long-haul jets economical, trading raw exhaust speed for fuel it never has to carry.", "parts": [{"name": "JetEngine", "mod": "Squad", "title": "TF/CF34 High-Bypass Turbofan"}, {"name": "SXTMiniJet", "mod": "SXT", "title": "Williams/Rolls-Royce FJ44-2A turbofan"}, {"name": "turboFanSize2", "mod": "Squad", "title": "CF6 High-Bypass Turbofan"}], "upgrades": [], "grants": []}, "av_lowBypassTurbofan": {"title": "Low-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "A modest bypass fan bolted to a fighter's afterburning core — some of the turbofan's thrift without giving up the supersonic dash. The engine of the teen-series fighters.", "parts": [{"name": "RO-D30F6", "mod": "Squad", "title": "D-30 Low-Bypass Turbofan"}, {"name": "aje_f404", "mod": "Squad", "title": "F404 Low-Bypass Turbofan"}, {"name": "turboJet", "mod": "Squad", "title": "F100 Low-Bypass Turbofan"}], "upgrades": [], "grants": []}, "av_advancedJetEngines": {"title": "Turbine-Temperature Uprating", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 324, "anyToUnlock": true, "flavor": "The mature marks of the bypass turbofans in the hangar — hotter turbines, tighter tolerances, a few percent more thrust and a few percent less fuel, engine by engine.", "parts": [], "upgrades": ["RFUpgrade_CF6-50A", "RFUpgrade_CF6-80A", "RFUpgrade_F100-PW-220", "RFUpgrade_J57-P-420", "RFUpgrade_J79-GE-11", "RFUpgrade_TF34-GE-400A"], "grants": []}, "av_advancedFighterTurbojets": {"title": "Variable-Stator Fighter Turbojet Uprating", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "The mature marks of the variable-stator fighter turbojets — J79, J85 and their Chinese WP derivatives, refined engine by engine for a few more percent of thrust.", "parts": [], "upgrades": ["RFUpgrade_J79-MTU-J1K", "RFUpgrade_J85-GE-21", "RFUpgrade_R-11F2-300", "RFUpgrade_WP-13", "RFUpgrade_WP-6Z"], "grants": []}, "av_advancedHighSpeedTurbojets": {"title": "High-Speed Turbojet Uprating", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 324, "anyToUnlock": true, "flavor": "The mature marks of the sustained-Mach-2 cruise engines (the MiG-21's R-13, the MiG-25's R-15) and the dedicated hover lift-jets — two unrelated missions, both refined mark by mark past their first cut.", "parts": [], "upgrades": ["RFUpgrade_J75-P-5A", "RFUpgrade_J79-GE-10", "RFUpgrade_J79-GE-17", "RFUpgrade_R-13F-300", "RFUpgrade_R-15BF2-300", "RFUpgrade_RB162-81"], "grants": []}, "av_refinedTurboprop": {"title": "Refined Free-Turbine Turboprop", "discipline": "Air-Breathing Propulsion", "color": "#6c ar Pulse Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Skip the reactor and the nozzle entirely — drop small fission charges out the back and ride the shockwave off an ablative plate, one controlled detonation at a time. Absurd, filthy, and on paper the only chemistry-free way to put a truly heavy ship anywhere in the solar system fast. Project Orion never flew; here, it can.", "parts": [{"name": "RO-fft20mMMOtank", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Pulse Unit Magazine"}, {"name": "RO-fftorion12", "mod": "FarFutureTechnologies", "title": "12 Meter Orion Drive"}, {"name": "RO-fftorion8", "mod": "FarFutureTechnologies", "title": "8 Meter Orion Drive"}, {"name": "fft-fission-orion-5-1", "mod": "FarFutureTechnologies", "title": "10 Meter Orion Drive"}, {"name": "fft-fueltank-pulseunits-5-1", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Small)"}, {"name": "fft-fueltank-pulseunits-5-2", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Medium)"}, {"name": "fft-fueltank-pulseunits-5-3", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Large)"}, {"name": "fft-fueltank-targets-5-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Pulse Unit Magazine"}], "upgrades": [], "grants": []}, "ep_hallEffectThruster": {"title": "Hall-Effect Ion Acceleration", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Trap electrons in a magnetic field to ionise a noble gas, then let an electric field fling the ions out far faster than any flame — thrust measured in millinewtons, specific impulse measured in the thousands of seconds. Too weak to launch anything, and exactly what a satellite needs to hold its station for a decade on a tank of xenon.", "parts": [{"name": "RO-SPT50", "mod": "NearFuturePropulsion", "title": "SPT-50 Hall Effect Thr  ["RFTech-Tank-Iso-Comp", "RFTech-Tank-Sep-Stir"], "grants": []}, "met_stainlessSteelTankage": {"title": "Stir-Welded Stainless-Steel Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Go back to steel — but a cryo-tough stainless that keeps its strength through re-entry heat and down to liquid-oxygen cold, cheap enough to build a reusable tank-and-hull as one piece. The counter-intuitive material choice behind a fully-reusable heavy launcher.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Magic", "RFTech-Tank-Sep-Starship"], "grants": []}, "cmp_compositeNozzleExtension": {"title": "Carbon-Carbon Nozzle Extension", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Weave carbon fibre in a carbon matrix and it gets stronger as it gets hotter, right up past the point where any alloy has gone soft. Bolt a skirt of it below the metal chamber and the nozzle grows without the mass a cooled metal extension would have cost — expansion ratio for free, paid for in a two-year layup and cure.", "parts": [], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RS-68K"], "grants": []}, "cmp_advancedCompositeFairings": {"title": "High-Temperature Composite Fairings", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Cure the fairing from higher-temperature resins and out-of-autoclave layups — lighter shells that also take the aerothermal load of a faster ascent, and come off a production line instead of a hand-layup bench. The payload shroud grown into a manufactured part.", "parts": [], "upgrades": ["PFTech-Fairing-V", "PFTech-Fairing-VI"], "grants": []}, "th_advancedMLI": {"title": "Perforated Double-Aluminised Insulation", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Refine the multi-layer blanket — more and thinner double-alumin
