ies", "title": "KF  Tiny Rover Wheel"}, {"name": "roverWheel1", "mod": "Squad", "title": "RoveMax Model M1"}, {"name": "roverWheel2", "mod": "Squad", "title": "RoveMax Model S2"}], "upgrades": [], "grants": []}, "str_fuelCrossfeed": {"title": "Inter-Tank Fuel Crossfeed", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Pipe propellant across a strut between two tanks still bolted together — drain the strap-on boosters first and keep the core stage topped off, so when the boosters finally drop away the core is still full. Asparagus staging: three half-empty cores flying like one that never emptied at all.", "parts": [{"name": "fuelLine", "mod": "Squad", "title": "FTX-2 External Fuel Duct"}], "upgrades": [], "grants": []}, "tel_realAntennaTelemetry": {"title": "Modeled Antenna Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A comms antenna simulated as a real system — gain, pattern and tracking modelled, not just a data-rate number — the same telemetry hardware whichever crewed vehicle happens to carry it.", "parts": [{"name": "ROC-DynaAntenna", "mod": "ROCapsules", "title": "DynaSoar Telemetry Antenna"}, {"name": "ROC-GeminiAntenna", "mod": "ROCapsules", "title": "Gemini Antenna"}, {"name": "ROC-GeminiAntennaBDB", "mod": "ROCapsules", "title": "Gemini UHF Whip Antenna"}], "upgrades": [], "grants": []}, "cmp_lunarReturnAblator": {"title": "Lunar-Return Ablator Rating", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Rate the same ablator for a translunar-return entry instead of a low-orbit one — the ladder's next real step is speed, not shape, and it doesn't care which airframe it's bolted to.", "parts": [{"name": "ROC-ApolloHSBDB", "mod": "ROCapsules", "title": "Apollo Command Module Heatshield"}, {"name": "ROC-GeminiHSLunarBDB", "mod": "ROCapsules", "title": "Gemini Lunar Heatshield"}], "upgrades": ["EarlyLunarHS"], "grants": []}, "cmp_lunarLandingAblator": {"title": "Refined Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Push the same ablator formulation a margin further — the heat load of an actual landing-and-return mission rather than a single translunar pass, still bolted to whichever airframe happens to need it.", "parts": [], "upgrades": ["LunarHS"], "grants": []}, "nuc_isotopePower": {"title": "Radioisotope Thermoelectric Power", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Stack thermocouples across a radioactive pellet and draw current straight from the heat of its own decay — power with no sun angle and no moving part, fuelled with whatever isotope happens to be on hand. Polonium-210 proves the generator works; it does not prove it lasts — the source itself is mostly spent within a season.", "parts": [{"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}], "upgrades": [], "grants": []}, "nuc_isotopePowerII": {"title": "Long-Lived Isotope Power", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Swap in plutonium-238 for the same generator and the output barely sags in a decade instead of collapsing in a season — the fuel choice that turns a demonstration into a power source you can fly past the orbit of Mars and still hear from.", "parts": [{"name": "RO-SNAP-9-RTG", "mod": "VenStockRevamp", "title": "SNAP-9 Series RTG"}, {"name": "rtgMini", "mod": "VenStockRevamp", "title": "SNAP-3B Series RTG (Pu238)"}], "upgrades": [], "grants": []}, "av_mach2Turbojet": {"title": "Sustained-Cruise Afterburning Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Push the afterburning and variable-stator tricks together into one engine built for sustained Mach 2 cruise, not just a burst through the transonic wall — Concorde's Olympus, the MiG-21's R-13, the MiG-25's R-15.", "parts": [{"name": "RO-Olympus593", "mod": "Squad", "title": "Olympus 593 Turbojet"}, {"name": "RO-R13", "mod": "Squad", "title": "R-13 Turbojet"}, {"name": "RO-R15BD", "mod": "Squad", "title": "R-15 Turbojet"}, {"name": "RO-R25F", "mod": "Squad", "title": "R-25 Turbojet"}, {"name": "nfa-turbofan-25-2", "mod": "NearFutureAeronautics", "title": "Olympus 593 Turbojet"}, {"name": "nfa-turbojet-25-1", "mod": "NearFutureAeronautics", "title": "GE4 Turbojet"}], "upgrades": [], "grants": []}, "av_dedicatedLiftJet": {"title": "Dedicated Lift Jet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A turbojet built to point straight down and do nothing but hold a hover — no forward thrust to speak of, the whole engine is the vertical-lift half of a VTOL aircraft.", "parts": [{"name": "nfa-vtol-0625-1", "mod": "NearFutureAeronautics", "title": "RB.162 Turbojet"}, {"name": "nfa-vtol-125-1", "mod": "NearFutureAeronautics", "title": "2x RB.162 Turbojet"}], "upgrades": [], "grants": []}, "gnc_reactionWheelAttitude": {"title": "Reaction-Wheel Attitude Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Spin a flywheel up or down and the whole spacecraft turns the other way — attitude held and changed with no propellant spent at all, as long as a star tracker keeps telling it which way it's actually pointed.", "parts": [{"name": "SXTAlouetteI", "mod": "SXT", "title": "Alouette Core"}, {"name": "ca_rw_small", "mod": "CoatlAerospace", "title": "RW4 Radial Reaction Wheel"}, {"name": "ca_rw_xsmall", "mod": "CoatlAerospace", "title": "RW1 Radial Reaction Wheel"}, {"name": "ca_startrack", "mod": "CoatlAerospace", "title": "CA-ACS 'StarTrack' Attitude Control System"}], "upgrades": [], "grants": []}, "th_activeLouvers": {"title": "Active Thermal Louvers", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Blades that open to radiate heat away and close to hold it in, driven by the bus temperature itself — the hermetic sphere's fixed skin becomes a thermostat instead of a single fixed compromise.", "parts": [{"name": "ca_louver_s", "mod": "CoatlAerospace", "title": "CA-TCL4 Thermal Control Louver"}], "upgrades": [], "grants": []}, "int_compactCrewPod": {"title": "Minimal Life-Support Cabin", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "The smallest sealed cabin that still keeps a single Kerbal alive and working — no service module, no full capsule program, just a can with a hatch and an experiment slot built in.", "parts": [{"name": "landerCabinSmall", "mod": "Squad", "title": "Mk1 Lander Can"}], "upgrades": [], "grants": []}, "fd_deepThrottleLanding": {"title": "Deep-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once - or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people.", "parts": [{"name": "RO-KTDU417", "mod": "Squad", "title": "KTDU-417"}, {"name": "ROC-LEMLMAEBDB", "mod": "ROCapsules", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROC-LEMLMDEBDB", "mod": "ROCapsules", "title": "Lunar Module Descent Engine (LMDE)"}, {"name": "ROE-LMAE", "mod": "ROEngines", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROE-LMDE", "mod": "ROEngines", "title": "Lunar Module Descent Engine (LMDE)"}], "upgrades": [], "grants": []}, "fd_lunarSurfaceMobility": {"title": "Powered Hop Transit", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Once you are down, get around - a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints.", "parts": [{"name": "ROC-LFVBDB", "mod": "ROCapsules", "title": "Lunar Flying Vehicle"}], "upgrades": ["RFUpgrade_LMDE-J"], "grants": []}, "fd_gasGeneratorApex": {"title": "Diminishing-Return Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One more percent of thrust from a cycle with nothing left to give. The mightiest engine ever built is also the end of its line - spend a whole tier here and you have bought a rounding error while staged combustion and hydrolox walk past you.", "parts": [], "upgrades": ["RFUpgrade_F-1-1.52M"], "grants": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed - trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_LR87-LH2-VacuumUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster - a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2-230K"], "grants": []}, "cryo_refinedExpander": {"title": "Refined Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Wring more specific impulse out of the closed expander cycle - hotter, tighter plumbing on the efficient small upper stage.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3", "RFUpgrade_RL10A-3-7"], "grants": []}, "pc_n1ClosedCycle": {"title": "Subcooled-Propellant Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale - the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did.", "parts": [{"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}, {"name": "ROE-NK43", "mod": "ROEngines", "title": "NK-15V/43"}, {"name": "SXTNK21BlockV", "mod": "SXT", "title": "N1 Block V"}], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M", "RFUpgrade_NK-19", "RFUpgrade_NK-21", "RFUpgrade_RD-58"], "grants": []}, "pc_protonStagedCombustion": {"title": "Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying.", "parts": [{"name": "ROE-RD0210", "mod": "ROEngines", "title": "RD-0208/0210"}, {"name": "ROE-RD254", "mod": "ROEngines", "title": "RD-254"}, {"name": "ROE-RD275", "mod": "ROEngines", "title": "RD-253/RD-275"}], "upgrades": [], "grants": []}, "pc_refinedStorableORSC": {"title": "Refined Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Squeeze the storable staged-combustion boosters a little further - Mk-II chambers, higher flow, the same dependable poison.", "parts": [], "upgrades": ["RFUpgrade_RD-0203U", "RFUpgrade_RD-0210", "RFUpgrade_RD-0212", "RFUpgrade_RD-0213", "RFUpgrade_RD-0214", "RFUpgrade_RD-253-Mk2", "RFUpgrade_RD-254-11D44-Mk2"], "grants": []}, "nuc_nuclearThermalRocket": {"title": "Solid-Core Nuclear Thermal Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Heat liquid hydrogen in a fission reactor and blow it out a nozzle - twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here.", "parts": [{"name": "KIWIA24", "mod": "Squad", "title": "Kiwi A3 Atomic Rocket Motor"}, {"name": "KIWIB48", "mod": "Squad", "title": "Kiwi B4E Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_nuclearRamjet": {"title": "Reactor-Heated Ramjet", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest - an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose.", "parts": [{"name": "RO-A136", "mod": "Squad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"]}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good.", "parts": [], "upgrades": [], "grants": ["Science-Core-improvedAvionics"]}, "comp_realTimeFlightComputer": {"title": "Priority-Interrupt Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one.", "parts": [], "upgrades": [], "grants": ["Science-Core-matureAvionics"]}, "comp_networkedAvionics": {"title": "Multi-Vehicle Avionics Integration", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together.", "parts": [], "upgrades": [], "grants": ["Science-Core-largeScaleAvionics"]}, "av_highBypassTurbofan": {"title": "High-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Wrap the core in a huge ducted fan and let most of the air bypass the burner entirely - the quiet, thrifty engine that made long-haul jets economical, trading raw exhaust speed for fuel it never has to carry.", "parts": [{"name": "JetEngine", "mod": "Squad", "title": "TF/CF34 High-Bypass Turbofan"}, {"name": "turboFanSize2", "mod": "Squad", "title": "CF6 High-Bypass Turbofan"}], "upgrades": [], "grants": []}, "av_lowBypassTurbofan": {"title": "Low-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A modest bypass fan bolted to a fighter's afterburning core - some of the turbofan's thrift without giving up the supersonic dash. The engine of the teen-series fighters.", "parts": [{"name": "RO-D30F6", "mod": "Squad", "title": "D-30 Low-Bypass Turbofan"}, {"name": "aje_f404", "mod": "Squad", "title": "F404 Low-Bypass Turbofan"}, {"name": "turboJet", "mod": "Squad", "title": "F100 Low-Bypass Turbofan"}], "upgrades": [], "grants": []}, "av_advancedJetEngines": {"title": "Advanced Jet Engines", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "The mature marks of every jet in the hangar - hotter turbines, ti nd the mission calls for — five real combinations flown across five different programs, none of them meaningfully better than the others. A menu, not a ladder.", "parts": [], "upgrades": ["RFTech-rcs-tltech2", "RFTech-rcs-tltech3", "RFUpgrade_Aerozine50+NTO", "RFUpgrade_Hydrazine", "RFUpgrade_ISPS", "RFUpgrade_ISPS-HDA", "RFUpgrade_MMH+MON10", "RFUpgrade_MMH+MON3", "RFUpgrade_MMH+NTO", "RFUpgrade_UDMH+NTO"], "grants": []}, "pc_caveaB": {"title": "Cavea-B Oxidiser (gamble)", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "A storable blend studied but never flown — specLevel=concept in its own source data, the one entry in this family that never left the bench. Worse thrust and worse Isp than every operational choice beside it; nobody flew it because it never won the argument, but a completionist can still burn it.", "parts": [], "upgrades": ["RFUpgrade_Cavea-B"], "grants": []}, "int_heavyLaunchEscape": {"title": "Heavy Launch-Escape Motor", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A solid escape tower sized to yank a three-seat lunar capsule clear of a fully-fuelled Moon rocket - the same abort mechanism as Mercury's, scaled to the mass it now has to save.", "parts": [{"name": "LaunchEscapeSystem", "mod": "Squad", "title": "Launch Escape System (Apollo)"}, {"name": "ROC-ApolloLESBDB", "mod": "ROCapsules", "title": "Apollo Launch Escape System (LES)"}, {"name": "ROC-D2Block1LES", "mod": "ROCapsules", "title": "D-2 Block I Abort Motor"}, {"name": "ROC-D2Block2LES", "mod": "ROCapsules", "title": "D-2 Block II Launch Escape System"}], "upgrades": [], "grants": []}, "fd_advancedSpacecraftPropulsion": {"title": "Sustained-Duty Service Propulsion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Grow the spacecraft's own engine from a probe's one-shot nudge into a crewed sh const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
