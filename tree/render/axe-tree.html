actor-TOPAZII", "mod": "NearFutureElectrical", "title": "TOPAZ-II Nuclear Reactor"}], "upgrades": [], "grants": []}, "opt_hyperspectralImaging": {"title": "Hyperspectral Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Not three colours but hundreds. A hyperspectral imager splits each pixel into a continuous spectrum, reading the mineral, chemical and biological signature of the surface below — the scanner that maps what a place is made of, not just what it looks like.", "parts": [{"name": "scansat-multi-abi-1", "mod": "SCANsat", "title": "ABI Multi-Spectral Imager"}, {"name": "scansat-multi-modis-1", "mod": "SCANsat", "title": "MODIS Multi-Spectral Imager"}, {"name": "scansat-multi-msi-1", "mod": "SCANsat", "title": "MSI Multi-Spectral Imager"}, {"name": "scansat-resources-crism-1", "mod": "SCANsat", "title": "CRISM Multi-Spectral Resource Scanner"}, {"name": "scansat-resources-hyperion-1", "mod": "SCANsat", "title": "Hyperion Multi-Spectral Resource Scanner"}, {"name": "scansat-resources-mise-1", "mod": "SCANsat", "title": "MISE Multi-Spectral Resource Scanner"}], "upgrades": [], "grants": []}, "opt_thermalMappingSpectrometry": {"title": "Thermal-Mapping Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Map a world by its heat and its infrared fingerprint. A thermal-mapping spectrometer builds up the temperature and composition of a surface or atmosphere band by band — the Cassini/Mars-class instrument for reading planets in the infrared.", "parts": [{"name": "RO-PMIRR", "mod": "RP-1", "title": "IR04 - Pressure Modulated Infrared Radiometer (PMIRR)"}, {"name": "RO-VIMS", "mod": "RP-1", "title": "IS04 - Advanced Infrared Mapping Spectrometer (AIMS)"}], "upgrades": [], "grants": []}, "opt_highResolutionImager": {"title": "High-Resolution Orbital Imager", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The sharpest eye yet — a large-optics, solid-state imager that resolves fine surface detail from orbit, the reconnaissance-grade camera turned on other worlds.", "parts": [{"name": "RO-HIRES", "mod": "RP-1", "title": "VI05 - High Resolution Imaging Device"}], "upgrades": [], "grants": []}, "opt_syntheticApertureRadar": {"title": "Synthetic-Aperture Radar", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "See through cloud and darkness by making your own illumination. Synthetic-aperture radar bounces a beam off the surface and reconstructs a high-resolution image from the echoes — the instrument that mapped the whole cloud-shrouded surface of Venus.", "parts": [{"name": "RO-MagellanRadar", "mod": "SCANsat", "title": "RDRS Radar Antenna"}, {"name": "scansat-sar-paz-1", "mod": "SCANsat", "title": "PAZ-SAR Radar Antenna"}], "upgrades": [], "grants": []}, "opt_orbitalResourceScanning": {"title": "Orbital Resource Scanning", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Survey a whole body from orbit for what's worth landing on — narrow-band and surface scanners that build global maps of terrain, resources and anomalies, the reconnaissance a surface mission is planned from.", "parts": [{"name": "OrbitalScanner", "mod": "Squad", "title": "M4435 Narrow-Band Scanner"}, {"name": "SurfaceScanner", "mod": "Squad", "title": "Surface Scanning Module"}], "upgrades": [], "grants": []}, "tel_deepSpaceParabolic": {"title": "Deep-Space Parabolic Dish", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "A large steerable parabolic dish — the high-gain antenna that closes the link across hundreds of millions of kilometres, turning a whisper from the outer Solar System into a usable data stream.", "parts": [{"name": "ROC-ApolloHGABlockV", "mod": "ROCapsules", "title": "Apollo Block V High Gain Antenna"}, {"name": "dish_S", "mod": "CoatlAerospace", "title": "Ulysses Parabolic Antenna"}, {"name": "dish_hera", "mod": "CoatlAerospace", "title": "Juno Parabolic Antenna"}, {"name": "dish_tatsujin", "mod": "CoatlAerospace", "title": "MAVEN Parabolic Antenna"}, {"name": "dish_xihe", "mod": "CoatlAerospace", "title": "STEREO Parabolic Antenna"}, {"name": "mer_dish", "mod": "CoatlAerospace", "title": "Cassini Parabolic Antenna"}], "upgrades": [], "grants": []}, "int_atmosphericEntryProbe": {"title": "Atmospheric Entry Probe", "discipline": "Systems Integration", "color": "#ededed", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "A probe built to survive falling into an atmosphere: an aeroshell and a descent body that ride a fireball down and then float the rest of the way, returning data from inside a world's air rather than from orbit above it — the Huygens way to reach a surface.", "parts": [{"name": "ca_draco", "mod": "CoatlAerospace", "title": "Huygens Atmospheric Lander"}, {"name": "ca_draco_as", "mod": "CoatlAerospace", "title": "Huygens Aeroshell"}], "upgrades": [], "grants": []}, "life_inflatableHabitat": {"title": "Inflatable Habitat", "discipline": "Life Support", "color": "#f0508a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Launch it packed tight, inflate it to full volume in orbit. An expandable habitat trades a rigid metal shell for a soft, layered one that unfolds into far more living space than its launch diameter would allow — the BEAM/Bigelow way to fly a big room in a small fairing.", "parts": [{"name": "InflatableHAB", "mod": "VenStockRevamp", "title": "IKU-03 Kerbal Safety Bubble"}, {"name": "SXTDLK83EHabitat", "mod": "SXT", "title": "Ares LK-S3E Heavy Planetary Habitat"}, {"name": "sspx-extendable-tube-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Extendable Crew Tube"}, {"name": "sspx-inflatable-hab-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Inflatable Habitat (Long)"}, {"name": "sspx-inflatable-hab-125-2", "mod": "StationPartsExpansionRedux", "title": "2.25m Inflatable Habitat (Medium)"}, {"name": "sspx-inflatable-hab-125-3", "mod": "StationPartsExpansionRedux", "title": "2.25m Inflatable Habitat (Short)"}, {"name": "sspx-inflatable-hab-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Inflatable Habitat (Long)"}, {"name": "sspx-inflatable-hab-25-2", "mod": "StationPartsExpansionRedux", "title": "4.5m Inflatable Habitat (Short)"}], "upgrades": [], "grants": []}, "life_centrifugeHabitat": {"title": "Centrifuge Habitat", "discipline": "Life Support", "color": "#f0508a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Spin for gravity. A rotating habitat module generates centrifugal weight for its crew, holding off the bone and muscle loss of long-duration freefall — the first artificial-gravity station rooms, inflatable and expandable to the diameter a comfortable spin needs.", "parts": [{"name": "sspx-expandable-centrifuge-375-2", "mod": "StationPartsExpansionRedux", "title": "6.75m Expandable Centrifuge (36m Diameter)"}, {"name": "sspx-inflatable-centrifuge-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Inflatable Centrifuge (16m Diameter)"}, {"name": "sspx-inflatable-centrifuge-125-2", "mod": "StationPartsExpansionRedux", "title": "2.25m Inflatable Centrifuge (13m Diameter)"}, {"name": "sspx-inflatable-centrifuge-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Inflatable Centrifuge (25m Diameter)"}], "upgrades": [], "grants": []}, "life_largeStationModule": {"title": "Large Station Module", "discipline": "Life Support", "color": "#f0508a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The heavy station module class — nine-metre cores, habitation blocks and science labs that dwarf the early ISS parts, the pressurised volume of a permanent orbital or surface base built for a large crew.", "parts": [{"name": "sspx-core-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Station Core"}, {"name": "sspx-core-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Station Core"}, {"name": "sspx-core-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Station Core"}, {"name": "sspx-habitation-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Habitation Module (Large)"}, {"name": "sspx-habitation-375-3", "mod": "StationPartsExpansionRedux", "title": "6.75m Habitation Module (Shielded)"}, {"name": "sspx-habitation-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Habitation Module (Large)"}, {"name": "sspx-habitation-5-2", "mod": "StationPartsExpansionRedux", "title": "9m Habitation Module (Small)"}, {"name": "sspx-lab-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Station Science Lab"}, {"name": "sspx-lab-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Station Science Lab"}], "upgrades": [], "grants": []}, "life_aquacultureModule": {"title": "Closed-Loop Food Modules", "discipline": "Life Support", "color": "#f0508a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Grow protein, not just greens. Aquaculture and full-scale greenhouse modules extend bioregenerative life support from air and vegetables to a fuller closed food chain — the ecosystem a base needs to feed itself for years.", "parts": [{"name": "sspx-aquaculture-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Aquaculture Module"}, {"name": "sspx-greenhouse-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Greenhouse Module"}, {"name": "sspx-greenhouse-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Greenhouse"}], "upgrades": [], "grants": []}, "str_annularTruss": {"title": "Annular Truss Structure", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "A ring rather than a beam. Annular truss segments close a structure back on itself — the circular backbone for a rotating habitat, a large aperture or a torus station.", "parts": [{"name": "truss-circular-01", "mod": "NearFutureConstruction", "title": "Annular Modular Truss XL"}, {"name": "truss-circular-02", "mod": "NearFutureConstruction", "title": "Annular Modular Truss"}, {"name": "truss-circular-03", "mod": "NearFutureConstruction", "title": "Annular Modular Truss Mini"}, {"name": "truss-circular-04", "mod": "NearFutureConstruction", "title": "Annular Modular Truss Micro"}, {"name": "truss-circular-adapter-01", "mod": "NearFutureConstruction", "title": "Annular Truss Adapter"}, {"name": "truss-circular-adapter-02", "mod": "NearFutureConstruction", "title": "Annular Truss Adapter V2"}, {"name": "truss-circular-docking-01", "mod": "NearFutureConstruction", "title": "Annular Truss Docking Connector"}], "upgrades": [], "grants": []}, "str_strongbackTruss": {"title": "Strongback Truss", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The strongback — a heavy closed or open girder that carries the primary loads of a large integrated vehicle or launch stack, in a family of lengths sized to the payload.", "parts": [{"name": "SXTMTVGirder", "mod": "SXT", "title": "Strongback Truss (Closed Long)"}, {"name": "SXTMTVGirderBasic", "mod": "SXT", "title": "Strongback Truss (Closed Short)"}, {"name": "SXTMTVGirderOpen", "mod": "SXT", "title": "Strongback Truss (Open Long)"}, {"name": "SXTMTVGirderOpenMedium", "mod": "SXT", "title": "Strongback Truss (Open Medium)"}, {"name": "SXTMTVGirderOpenSmall", "mod": "SXT", "title": "Strongback Truss (Open Short)"}], "upgrades": [], "grants": []}, "str_reusableLandingLeg": {"title": "Reusable Booster Landing Leg", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Bring the booster home standing up. A heavy, energy-absorbing landing leg that lets a returning stage touch down on its own tail and be flown again — the strut that made propulsive recovery routine.", "parts": [{"name": "largeLandingLeg", "mod": "VenStockRevamp", "title": "LT-5 Macro Super Landing Strut"}], "upgrades": [], "grants": []}, "gnc_nasaDockingSystem": {"title": "NASA Docking System", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The modern international standard: the NASA Docking System and its IDSS-compatible ports, a low-impact androgynous mechanism that any commercial-crew vehicle can use to berth at the station — docking as an interface everyone builds to.", "parts": [{"name": "ROC-CSTNDSActive", "mod": "ROCapsules", "title": "NASA Docking System (Active)"}, {"name": "ROC-CSTNDSPassive", "mod": "ROCapsules", "title": "NASA Docking System (Passive)"}, {"name": "dockingPort1", "mod": "Squad", "title": "NASA Docking System (Shielded)"}, {"name": "dockingPort2", "mod": "Squad", "title": "NASA Docking System"}, {"name": "dockingPortLateral", "mod": "Squad", "title": "NASA Docking System"}, {"name": "sspx-docking-125-1", "mod": "StationPartsExpansionRedux", "title": "Extendable NASA Docking System"}], "upgrades": [], "grants": []}, "int_commercialCrewCapsule": {"title": "Commercial Crew Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Crew to orbit, bought as a service. The Orion and CST-100 command modules — a new generation of reusable crew capsules with modern avionics, glass cockpits and their own service modules, flown by contractors rather than a single national programme.", "parts": [{"name": "ROC-CSTCM", "mod": "ROCapsules", "title": "CST-100 Command Module"}, {"name": "ROC-CSTSM", "mod": "ROCapsules", "title": "CST-100 Service Module"}, {"name": "ROC-OrionCM", "mod": "ROCapsules", "title": "Orion Command Module"}], "upgrades": [], "grants": []}, "cmp_inflatableDecelerator": {"title": "Inflatable Aerodynamic Decelerator", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Slow down with an umbrella instead of a wall. An inflatable heat shield deploys a wide, soft aeroshell that decelerates a heavy payload high in a thin atmosphere — the HIAD, the way to land tonnes on Mars where a rigid shield can't be built big enough.", "parts": [{"name": "ROH-AdjustableHIAD", "mod": "ROHeatshields", "title": "Adjustable HIAD"}], "upgrades": ["Inflatable"], "grants": []}, "nuc_modernFissionReactor": {"title": "Compact Fission Power Reactor", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Compact fission power for the surface and deep space, sized to the mission — a few to a few hundred kilowatts from a reactor that fits on a lander. Kilopower, SAFE-400 and their kin: the power source a crewed base or a nuclear-electric tug runs on, past what any array or isotope pellet delivers.", "parts": [{"name": "RO-reactor-RAPIDL", "mod": "NearFutureElectrical", "title": "RAPID-L Nuclear Reactor"}, {"name": "RO-reactor-SAFE400", "mod": "NearFutureElectrical", "title": "NASA SAFE-400 Nuclear Reactor"}, {"name": "RO-reactor-kilopower", "mod": "NearFutureElectrical", "title": "NASA Kilopower 10kWe Reactor"}, {"name": "RO-reactor-prometheus", "mod": "NearFutureElectrical", "title": "Prometheus 200 KWe Nuclear Reactor"}], "upgrades": [], "grants": []}, "nuc_fissilePropellantMagazine": {"title": "Fissile Propellant Magazine", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Storing the fuel for a nuclear engine — fissile-material magazines that feed a fission-fragment or gas-core drive, the tankage an advanced nuclear stage carries its reactor charge in.", "parts": [{"name": "fft-fueltank-fission-25-1", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-25-2", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Medium)"}, {"name": "fft-fueltank-fission-25-3", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Short)"}, {"name": "fft-fueltank-fission-5-1", "mod": "FarFutureTechnologies", "title": "20 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-5-2", "mod": "FarFutureTechnologies", "title": "20 m Fissiles Tank (Short)"}, {"name": "fft-fueltank-fission-radial-1", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-radial-2", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Medium)"}, {"name": "fft-fueltank-fission-radial-3", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Short)"}], "upgrades": [], "grants": []}, "nuc_fuelReprocessing": {"title": "Nuclear Fuel Reprocessing", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "A power reactor fills with fission products as it runs, and its enriched-uranium charge burns down — left alone it has a fixed lifespan. Fuel drums top the charge back up, and a reprocessor pulls the still-fissile material out of spent fuel to load again — the difference between a plant a crew has to replace and one they keep running on station for years.", "parts": [{"name": "nuclear-recycler-25", "mod": "NearFutureElectrical", "title": "Whirlijig Nuclear Reprocessor"}, {"name": "nuclearfuel-0625", "mod": "NearFutureElectrical", "title": "MF-0 Nuclear Fuel Drum"}, {"name": "nuclearfuel-125", "mod": "NearFutureElectrical", "title": "MF-1 Nuclear Fuel Drum"}, {"name": "nuclearfuel-25", "mod": "NearFutureElectrical", "title": "MF-2 Nuclear Fuel Drum"}], "upgrades": [], "grants": []}, "cryo_combustionTapOff": {"title": "Combustion Tap-Off Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Skip the separate gas-generator combustor entirely — bleed hot gas straight off the main chamber wall to spin the turbopump, then dump it overboard. Simpler than a gas generator, cheaper than staged combustion: the operational middle path Blue Origin bet New Shepard and New Glenn's upper stage on.", "parts": [{"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": ["RFUpgrade_RS-68A"], "grants": []}, "cryo_highThrustExpander": {"title": "Higher-Thrust Closed Expander", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Scale the closed expander cycle past the RL-10's own ceiling — two parallel American and European programs converge on the same bigger turbopump, the same clean cycle, roughly triple the thrust.", "parts": [{"name": "ROE-MB35", "mod": "ROEngines", "title": "MB-35"}, {"name": "ROE-MB60", "mod": "ROEngines", "title": "MB-60"}, {"name": "cryoengine-pavonis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}, {"name": "cryoengine-tharsis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}], "upgrades": ["RFUpgrade_CECE-High", "RFUpgrade_RD-0146D", "RFUpgrade_RL10A-3-9"], "grants": []}, "cryo_smallScaleMethalox": {"title": "Small-Scale Methalox Upper Stage", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "A simpler, plainer methalox debut at small scale — no staged-combustion preburner, just a clean upper-stage engine sized for a commercial small-satellite launcher. The unglamorous sibling to the booster-scale methalox story unfolding one node over.", "parts": [{"name": "cryoengine-buzzard-1", "mod": "CryoEngines", "title": "M10"}], "upgrades": ["RFUpgrade_CECE-Methane", "RFUpgrade_CH4+O2"], "grants": []}, "cryo_fullFlowMethaloxII": {"title": "Matured Full-Flow Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "The third pass at a cycle where both propellants run through their own preburners and nothing is thrown away. Parts count falls, the plumbing that made the first version a nightmare is machined out of the casting, and thrust climbs twenty percent because the engine finally stops being the reason to hold the schedule.", "parts": [], "upgrades": ["RFUpgrade_Raptor-3", "RFUpgrade_Raptor-3V"], "grants": []}, "cryo_expanderBoosterScale": {"title": "Expander-Bleed Cycle at Booster Scale", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Vent a little of the cooling-jacket gas overboard instead of routing every drop through the turbopump, and the expander cycle's thrust ceiling — always capped by a small upper-stage engine's own heat-exchange area — breaks wide open. The expander cycle finally reaches core-stage scale.", "parts": [{"name": "cryoengine-fuji-1", "mod": "CryoEngines", "title": "LE-9"}], "upgrades": ["RFUpgrade_RL10A-5", "RFUpgrade_Vinci-180"], "grants": []}, "cryo_fullFlowMethalox": {"title": "Full-Flow Staged-Combustion Methalox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Burn both turbopump drive-gas streams through combustion at once — a fuel-rich preburner AND an oxidiser-rich preburner, nothing vented overboard at all. The thermodynamic endpoint of the staged-combustion idea, and the only cycle that ever reached it in metal.", "parts": [{"name": "ROE-Raptor", "mod": "ROEngines", "title": "Raptor (Surface Variant)"}, {"name": "ROE-RaptorVac", "mod": "ROEngines", "title": "Raptor-Vacuum"}, {"name": "cryoengine-eagle-1", "mod": "CryoEngines", "title": "Raptor-Vacuum"}], "upgrades": [], "grants": []}, "fd_reusableGasGenKerolox": {"title": "Reusable Gas-Generator Kerolox", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "After a whole tree of gas-generator kerolox engines chasing diminishing returns while staged combustion walked past, one company bets the other way: keep the simple open cycle, keep it deliberately u title": "20 m Nuclear Salt Water Rocket"}], "upgrades": [], "grants": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
