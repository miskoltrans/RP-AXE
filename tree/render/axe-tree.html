<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

ambers. Unflyable without vernier steering, which its engines carry built-in.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}], "upgrades": [], "grants": []}, "fd_orbitalMultiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Scale the clustered-chamber approach to a meganewton — a bank of chambers on a common turbopump delivering booster thrust without ever risking one large unstable chamber. The storable orbital boosters (RD-211, YF-2) that lofted payloads on propellant you could keep in the tank for years.", "parts": [{"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": [], "grants": []}, "fd_matureOrbital": {"title": "High-Expansion Vacuum Nozzles", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A nozzle bell too large to fire at sea level — the flow would rip away from the walls — but in vacuum it extracts every last metre-per-second from the exhaust. The dedicated upper-stage engines that let the R-7 reach past low orbit toward the Moon: high specific impulse where there is no air to fight.", "parts": [{"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": [], "grants": []}, "fd_verniers": {"title": "Auxiliary-Chamber Thrust Vectoring", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Steer and roll a large rocket in powered flight with small gimballed auxiliary chambers — full three-axis control, roll especially, before a single main engine can be trusted to gimbal for it. The R-7's verniers are integral to its engines, so you cannot fly the cluster without this; Atlas and Jupiter bolt theirs on.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}], "upgrades": [], "grants": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen: vacuum-jacketed tanks, multilayer insulation and enormous pumps for a low-density fuel, all for the highest specific impulse chemistry there is. It costs a whole node of program time up front just to commit - and this is that commitment.", "parts": [], "upgrades": [], "grants": []}, "cryo_hydroloxPrototype": {"title": "Hydrogen-Oxygen Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game.", "parts": [{"name": "ROE-RZ20", "mod": "ROEngines", "title": "RZ.20"}], "upgrades": [], "grants": []}, "cryo_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": [], "grants": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Nitrocellulose plasticised with nitroglycerin and extruded into a grain that carries its own oxygen — the older solid chemistry: simple, dense, storable, lit once and done. The JATO boosters and the first Nike stages.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-R103", "mod": "ROEngines", "title": "R-103 Booster"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}, {"name": "sepMotorLarge", "mod": "Squad", "title": "Radial Separation Motor (Large)"}, {"name": "sepMotorSmall", "mod": "Squad", "title": "Radial Separation Motor (Small)"}], "upgrades": [], "grants": []}, "pc_doubleBaseBooster": {"title": "Double-Base Booster Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Cast a double-base grain large enough to boost a stack off the pad — case-bonded to the motor wall so it burns from the core out without cracking. The Nike booster and the heavy JATO units, where double-base is pushed to its size limit before composite takes over.", "parts": [{"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", "mod": "ROEngines", "title": "Alcyone 1 BE-3"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}], "upgrades": [], "grants": []}, "pc_compositeSolid": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery polysulfide matrix, cast to shape around an integral nozzle — higher energy than double-base and castable to any ttitude — no combustion, nothing to go wrong, just enough impulse to point. The simplest way to hold an orientation in vacuum.", "parts": [{"name": "RO-2kN-Thruster", "mod": "Squad", "title": "2.2/3.6kN Thruster"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": [], "grants": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A small drogue bites the thin high air to hold a falling body straight and slow it enough that a main canopy can open without tearing — the difference between a returned payload and a crater.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": [], "grants": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}, {"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-Samp twoChannelIR": {"title": "Two-Channel Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's.", "parts": [{"name": "RO-TwoChannelIR", "mod": "RP-1", "title": "IR03 - Two-Channel Infrared Radiometer"}], "upgrades": [], "grants": []}, "opt_uvSpectrometry": {"title": "Ultraviolet Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it.", "parts": [{"name": "RO-NIMS", "mod": "RP-1", "title": "IS03 - Near Infrared Mapping Spectrometer (NIMS) and Ultraviolet Spectrometer (UVS)"}, {"name": "RO-UVSpectrometer", "mod": "RP-1", "title": "IS02 - Ultraviolet Spectrometer"}], "upgrades": [], "grants": []}, "opt_refinedTV": {"title": "Refined Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-ImprovedTVCamera", "mod": "RP-1", "title": "VI03 - Improved TV Camera"}], "upgrades": [], "grants": []}, "mic_boomMagnetometry": {"title": "Boom-Deployed Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there.", "parts": [{"name": "dmUS2MagBoom", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "opt_precisionOptics": {"title": "Precision Orbital Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A long-focal-length telescope trained on the surface from orbit, resolving detail a wide-angle camera smears into a blur — the optical reconnaissance that reads a runway, not just a coastline. Glass figured to the edge of the aperture and held rock-steady on a stabilised platform, for at this focal length the smallest jitter is a smear.", "parts": [{"name": "dmUS2Scope", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "elec_deployableArrays": {"title": "Deployable Photovoltaic Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch.", "parts": [{"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}], "upgrades": ["solarTL1"], "grants": []}, "gnc_basicAvionics": {"title": "Miniaturised Inertial Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised.", "parts": [], "upgrades": ["HDD-Upgrade-1961", "HDD-Upgrade-1964", "HDD-Upgrade-Basic", "RFTech-ComSat-II", "RFTech-NavSat-II", "RP-1-PayloadTech-Axial"], "grants": ["Science-Core-basicAvionics"]}, "tel_dopplerRanging": {"title": "Coherent Doppler Ranging", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon.", "parts": [], "upgrades": ["commsTL1"], "grants": ["RP0Level2TrackingStation"]}, "tel_pcmTelemetry": {"title": "Pulse-Code Modulation Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": ["commsTL2"], "grants": ["RP0Level3TrackingStation"]}, "str_equipmentBays": {"title": "Enclosed Equipment Bays", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose.", "parts": [{"name": "ROC-GeminiEquipmentSectionBDB", "mod": "ROCapsules", "title": "Gemini Equipment Section"}, {"name": "ROC-LEMMESABDB", "mod": "ROCapsules", "title": "Apollo LM Material Experiment Stowage Assembly"}, {"name": "RO_ServiceBay_300", "mod": "Squad", "title": "Service Bay [3m]"}, {"name": "ServiceBay_250_v2", "mod": "Squad", "title": "Service Bay [4m]"}, {"name": "USRadialTanks", "mod": "UniversalStorage2", "title": "Universal Storage: Radial Tank"}, {"name": "restock-nosecone-1875-1", "mod": "ReStockPlus", "title": "Protective Rocket Nose Mk18"}], "upgrades": ["RFTech-SM-II"], "grants": []}, "pc_ntoHypergolics": {"title": "Dinitrogen-Tetroxide Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it.", "parts": [], "upgrades": ["RFUpgrade_RD-214-8D59", "RFUpgrade_RD-214U-8D59U", "RFUpgrade_RD-217-8D515", "RFUpgrade_RD-250-8D518", "RFUpgrade_RD-252-8D724", "RFUpgrade_RD-855", "RFUpgrade_RD-856", "RFUpgrade_S5.2", "RFUpgrade_XLR81-BA-5", "RFUpgrade_XLR81-BA-7", "RFUpgrade_YF-1A", "RFUpgrade_YF-1B", "RFUpgrade_YF-3A"], "grants": []}, "pc_htpSustainer": {"title": "Multi-Chamber Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}], "upgrades": [], "grants": []}, "pc_larchPeroxide": {"title": "Refined Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off.", "parts": [], "upgrades": ["RFUpgrade_Gamma-301", "RFUpgrade_Larch-2", "RFUpgrade_Larch-4", "RFUpgrade_Larch-8"], "grants": []}, "pc_fluorine": {"title": "Liquid-Fluorine Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": ["RFUpgrade_XLR81-LF2-SPS"], "grants": []}, "pc_scoutSolids": {"title": "Staged Solid Boost", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it.", "parts": [{"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}], "upgrades": ["RFUpgrade_Castor-1-SL", "RFUpgrade_Castor-1-Vac"], "grants": []}, "pc_strapOnSolids": {"title": "Strap-On Thrust Augmentation", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta.", "parts": [{"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Castor1_Inline", "mod": "ROEngines", "title": "Castor 1"}], "upgrades": [], "grants": []}, "pc_retroKick": {"title": "Vacuum-Start Solid Impulse", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail.", "parts": [{"name": "ROC-GeminiRetroMECBDB", "mod": "ROCapsules", "title": "Gemini Retro Rocket (Star-13E)"}, {"name": "ROC-MercuryPosigradeBDB", "mod": "ROCapsules", "title": "Mercury Posigrade Kick Motor"}, {"name": "ROC-MercuryRetroBDB", "mod": "ROCapsules", "title": "Mercury Retro (TE-M-316)"}, {"name": "ROC-VoskhodRetroBooster", "mod": "ROCapsules", "title": "Voskhod Retro Package"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-Agena_Spinrocket", "mod": "ROEngines", "title": "Agena 1KS30HA Spin Rocket"}], "upgrades": [], "grants": []}, "fd_regenCooling": {"title": "Regenerative Chamber Cooling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware.", "parts": [], "upgrades": ["RFUpgrade_LR105-NA-3", "RFUpgrade_LR105-NA-5", "RFUpgrade_LR79-NA-11", "RFUpgrade_LR79-NA-9", "RFUpgrade_LR87-AJ-3", "RFUpgrade_LR89-NA-3", "RFUpgrade_LR89-NA-5", "RFUpgrade_LR91-AJ-3", "RFUpgrade_RD-107-8D74-1958", "RFUpgrade_RD-107-8D74-1959", "RFUpgrade_RD-107-8D74K", "RFUpgrade_RD-107-8D76", "RFUpgrade_RD-108-8D75-1958", "RFUpgrade_RD-108-8D75-1959", "RFUpgrade_RD-108-8D75K", "RFUpgrade_RD-108-8D77", "RFUpgrade_RZ.2-Mk3", "RFUpgrade_RZ.2-Mk4", "RFUpgrade_S-3D", "RFUpgrade_Viking-4", "RFUpgrade_Viking-5"], "grants": []}, "fd_vacuumExpansion": {"title": "Extended Vacuum Expansion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}], "upgrades": ["RFUpgrade_LR101-NA-11", "RFUpgrade_LR105-NA-6", "RFUpgrade_LR105-NA-7.1", "RFUpgrade_LR105-NA-7.2", "RFUpgrade_LR79-NA-13", "RFUpgrade_LR89-NA-6", "RFUpgrade_LR89-NA-7.1", "RFUpgrade_LR89-NA-7.2", "RFUpgrade_RD-0106", "RFUpgrade_RD-0108", "RFUpgrade_RD-0109", "RFUpgrade_RD-119-8D710", "RFUpgrade_RD-225-8D721", "RFUpgrade_RL10A-3-1", "RFUpgrade_S-3FH", "RFUpgrade_X-405H", "RFUpgrade_X-405H-2", "RFUpgrade_X-405H-3", "RFUpgrade_X-405H-4", "RFUpgrade_XLR11-RM-13-10K", "RFUpgrade_XLR81-BA-11", "RFUpgrade_YF-22B", "RFUpgrade_YF-23B"], "grants": []}, "fd_restartableUpper": {"title": "Restartable Vacuum Ignition", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come.", "parts": [{"name": "LargeOMS", "mod": "VenStockRevamp", "title": "Astris"}, {"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": ["RFUpgrade_AJ10-101A", "RFUpgrade_AJ10-118", "RFUpgrade_AJ10-118D", "RFUpgrade_AJ10-142", "RFUpgrade_AJ10-42"], "grants": []}, "fd_spacecraftPropulsion": {"title": "Restartable Deep-Throttling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-C1", "mod": "ROEngines", "title": "C-1"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": ["RFUpgrade_Model8096-HDA", "RFUpgrade_XLR81-BA-1", "RFUpgrade_XLR81-BA-3"], "grants": []}, "fd_storableSustainer": {"title": "Storable Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute.", "parts": [{"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF3_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-3 (no gimbal)"}, {"name": "YF3_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-3 with Boattail"}], "upgrades": [], "grants": []}, "fd_titanTandem": {"title": "Altitude-Start Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design.", "parts": [{"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}], "upgrades": [], "grants": []}, "fd_longMarchStorable": {"title": "Storable Chamber Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice.", "parts": [{"name": "YF20_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20"}, {"name": "YF21_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-21"}, {"name": "YF22_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-22"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}, {"name": "YF25K_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20 with Boattail (no gimbal)"}], "upgrades": [], "grants": []}, "int_dongFangHong1": {"title": "China's First Satellite", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A third nation reaches orbit on its own hardware — a small sphere broadcasting a patriotic melody instead of a beeping tone, riding the same clustered-storable first stage into space.", "parts": [{"name": "DFH-1", "mod": "KerwisChineseAerospacePack", "title": "DongFangHong-1 Satelite"}], "upgrades": [], "grants": []}, "fd_sovietStorable": {"title": "Storable Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}], "upgrades": [], "grants": []}, "fd_saturnKerolox": {"title": "High-Pressure Kerolox Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-H1C", "mod": "ROEngines", "title": "H-1C Series"}, {"name": "ROE-H1D", "mod": "ROEngines", "title": "H-1D Series"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RS27", "mod": "ROEngines", "title": "H-1/RS-27"}], "upgrades": [], "grants": []}, "met_cooledTurbine": {"title": "Air-Cooled Turbine Blades", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust.", "parts": [], "upgrades": ["RFUpgrade_AL-7F-1", "RFUpgrade_AL-7F-2", "RFUpgrade_Atar09K-50", "RFUpgrade_Atar101E-3", "RF e able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage.", "parts": [{"name": "RO-R11F", "mod": "Squad", "title": "R-11 Turbojet"}, {"name": "aje_atar", "mod": "Squad", "title": "Atar 09 Turbojet"}, {"name": "miniJetEngine", "mod": "Squad", "title": "J85 Turbojet (No Afterburner)"}], "upgrades": [], "grants": []}, "av_ramjetAdvanced": {"title": "Refined Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearLargeSpaceplane", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear (Spaceplane)"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}, {"name": "GearMediumSpaceplane", "mod": "Squad", "title": "LY-60 Large Landing Gear (Spaceplane)"}], "upgrades": [], "grants": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour and holding the structure behind it cool. The one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}, {"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A denser char layer and a slower burn-through rate let the same shield shrug off a hotter, faster reentry — the material getting better, not the shape changing. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS", "MercuryHS"], "grants": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", "title": "Life Support Config Engine"}, {"name": "kerbalism-lifesupportmodule", "mod": "KerbalismConfig", "title": "External ECLSS Module"}], "upgrades": [], "grants": []}, "life_crewedExperimentBay": {"title": "Crew-Tended Experiment Locker", "discipline": "Life Support", "color": "#f0508a", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A modular science bay built into the cabin wall, serviced by hand instead of run by a timer — the same slot-in experiment rig whichever crewed vehicle happens to carry it, so long as someone is aboard to work it.", "parts": [{"name": "USMatBayWedge", "mod": "UniversalStorage2", "title": "Crewed Experiment Bay"}], "upgrades": ["RFTech-AddLifeSupport"], "grants": []}, "gnc_spacecraftRCS": {"title": "Storable-Propellant Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Trade the cold-gas puffers for small liquid thrusters on a storable propellant — peroxide, or hypergolics that light on contact — for many times the impulse in the same mass. The reaction control a manoeuvring spacecraft needs to point, hold and turn through a whole mission.", "parts": [{"name": "ROE-generic-full", "mod": "ROEngines", "title": "1.1/1.78kN Thruster"}, {"name": "ROE-generic-half", "mod": "ROEngines", "title": "550/890N Thruster"}, {"name": "ROE-generic-quarter", "mod": "ROEngines", "title": "275/445N Thruster"}, {"name": "ca_jib", "mod": "CoatlAerospace", "title": "Generic 0.5 kN Thruster"}, {"name": "microEngine", "mod": "Squad", "title": "1.1/1.78kN Thruster"}, {"name": "vernierEngine", "mod": "Squad", "title": "Attitude Jet, Conformal (275/445 N class)"}], "upgrades": ["RFTech-rcs-tltech1"], "grants": []}, "life_pressurisedCabin": {"title": "Sealed Cabin Pressurisation", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Seal a cabin tight enough to hold near sea-level pressure while the air outside thins to nothing, feeding it breathing gas and bleeding off the heat of hypersonic flight — the pilot rides to the edge of space in something close to shirtsleeves. The X-15's sealed cabin and the pressurised fuselage behind it.", "parts": [{"name": "MK1Cargobay", "mod": "VenStockRevamp", "title": "1.25m Cargo Bay"}, {"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "SXTSmallFuselage", "mod": "SXT", "title": "0.625m Fuselage (Pressurized)"}], "upgrades": [], "grants": []}, "int_launchEscape": {"title": "Tractor Escape Rocket", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused.", "parts": [{"name": "ROC-MercuryLESBDB", "mod": "ROCapsules", "title": "Mercury Launch Escape System"}, {"name": "RO_mk1_LES", "mod": "Squad", "title": "Launch Escape System (Mercury)"}], "upgrades": [], "grants": []}, "int_mercuryCapsule": {"title": "Blunt-Body Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}], "upgrades": [], "grants": []}, "int_vostokCapsule": {"title": "Spherical Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A perfect sphere, its mass offset so it finds its own heat-shielded attitude with no active control — crude, heavy, utterly reliable. Vostok brought the first human back from orbit, the cosmonaut ejecting to land under his own parachute while the ball thumped down nearby.", "parts": [{"name": "ROC-VostokCapsule", "mod": "ROCapsules", "title": "Vostok Descent Module"}, {"name": "mk1pod_v2", "mod": "Squad", "title": "Mk1 Pod (2m)"}], "upgrades": [], "grants": []}, "int_zenitRecon": {"title": "Film-Return Reconnaissance Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Strip the cosmonaut out of the sphere and fill it with cameras — the same descent capsule flown unmanned, exposing long rolls of film over the target and dropping them home to be recovered. Vostok and Zenit are one airframe: one carries a man, the other carries the eyes.", "parts": [{"name": "ROC-ZenitCapsule", "mod": "ROCapsules", "title": "Zenit Descent Module (Improved Film Camera)"}], "upgrades": [], "grants": []}, "edl_crewedRecovery": {"title": "Crewed Descent Recovery", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Bring a crewed capsule down soft enough to survive: a heavy main canopy that will not tear at the loads a manned mass demands, a retro-pack to drop it from orbit on time, and airbags or crushable legs to soften the final thump. The last minutes of every flight, where recovery is the whole point.", "parts": [{"name": "ROC-ApolloDrogueParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Drogue Parachute Pack"}, {"name": "ROC-ApolloParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Ma rything on one vehicle instead of two.", "parts": [{"name": "aquarius_crew_s1p5_1", "mod": "Tantares", "title": "LK-700 Capsule"}], "upgrades": [], "grants": []}, "fd_deepThrottleLanding": {"title": "Deep-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once - or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people.", "parts": [{"name": "RO-KTDU417", "mod": "Squad", "title": "KTDU-417"}, {"name": "ROC-LEMLMAEBDB", "mod": "ROCapsules", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROC-LEMLMDEBDB", "mod": "ROCapsules", "title": "Lunar Module Descent Engine (LMDE)"}, {"name": "ROE-LMAE", "mod": "ROEngines", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROE-LMDE", "mod": "ROEngines", "title": "Lunar Module Descent Engine (LMDE)"}], "upgrades": ["RFUpgrade_RS-18"], "grants": []}, "fd_lunarSurfaceMobility": {"title": "Powered Hop Transit", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Once you are down, get around - a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints.", "parts": [{"name": "ROC-LEMRover", "mod": "ROCapsules", "title": "Apollo Lunar Roving Vehicle (LRV)"}, {"name": "ROC-LFVBDB", "mod": "ROCapsules", "title": "Lunar Flying Vehicle"}], "upgrades": ["RFUpgrade_LMDE-J"], "grants": []}, "fd_gasGeneratorApex": {"title": "Diminishing-Return Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One more percent of thrust from a cycle with nothing left to give. The mightiest engine ever built is also the end of its line - spend a whole tier here and you have bought a rounding error while staged combustion and hydrolox walk past you.", "parts": [{"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_F-1-1.52M", "RFUpgrade_F-1A"], "grants": []}, "fd_matureKeroloxClusterUprating": {"title": "Mature Kerolox Cluster Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Refine the whole family of clustered gas-generator kerolox boosters mark by mark - more thrust, longer service life, no change to the chemistry. The same diminishing-return story as F-1's own trap, one tier over, for its smaller siblings.", "parts": [], "upgrades": ["RFUpgrade_E-1-575k", "RFUpgrade_E-1-Upgrade2", "RFUpgrade_E-1A_KS", "RFUpgrade_H-1-205K", "RFUpgrade_H-1-250K", "RFUpgrade_H-2-300K", "RFUpgrade_RS-27"], "grants": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed - trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_LR87-LH2-VacuumUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Scale the gas-generator hyd grades": ["RFUpgrade_RS-68A", "RFUpgrade_RS-68B", "RFUpgrade_RS-68K", "RFUpgrade_RS-800"], "grants": []}, "cryo_operationalFRSC": {"title": "Operational Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The hardest cycle in rocketry stops being one nation's secret. Fuel-rich staged-combustion hydrolox - the SSME's cycle - is rebuilt by two more programs: the RD-0120 lifts Energia, the LE-7 lifts the H-II. What took a superpower to master becomes something three space programs can pour.", "parts": [{"name": "ROE-LE7", "mod": "ROEngines", "title": "LE-7"}, {"name": "ROE-RD0120", "mod": "ROEngines", "title": "RD-0120"}, {"name": "rmm_ishtar", "mod": "RocketMotorMenagerie", "title": "RS-25-50X (SSME-50X)"}], "upgrades": [], "grants": []}, "cryo_reusableEngineUprating": {"title": "Reusable-Engine Production Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Every reusable and staged-combustion hydrolox engine now in service settles into its production marks - the SSME Block-I and Block-II, the RD-0120M, the LE-7A, the maturing HG-3 and deep-throttle chains - the unglamorous decade of squeezing margin out of engines already flying.", "parts": [{"name": "rmm_arsia", "mod": "RocketMotorMenagerie", "title": "RS-25-650 (SSME-650)"}], "upgrades": ["RFUpgrade_HG-3B", "RFUpgrade_HG-3B-2", "RFUpgrade_HG-3B-SL", "RFUpgrade_HG-3B-SL-2", "RFUpgrade_LE-7A", "RFUpgrade_LE-7A-2", "RFUpgrade_LR129-P-3", "RFUpgrade_LRBE-BlockII", "RFUpgrade_RD-0120M", "RFUpgrade_RD-0122", "RFUpgrade_RD-57A-1", "RFUpgrade_RD-57M", "RFUpgrade_RS-25A", "RFUpgrade_RS-25C", "RFUpgrade_RS-25D-50X", "RFUpgrade_RS-25D-E", "RFUpgrade_SSBE-BlockII"], "grants": []}, "cryo_tripropellant": {"title": "Tripropellant Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "One engine, two fuels, switched in flight. At liftoff it burns dense kerosene for thrust off the pad; at altitude it crosses over to hydrogen for Isp - a single powerplant doing the job of a two-propellant staircase. The RD-701 was meant to lift the MAKS spaceplane; making it work needs both the staged-combustion hydrolox cycle and oxidiser-rich kerolox at once.", "parts": [{"name": "nflv-engine-rd701-1", "mod": "NearFutureLaunchVehicles", "title": "RD-701"}, {"name": "nflv-engine-rd704-1", "mod": "NearFutureLaunchVehicles", "title": "RD-704"}, {"name": "rmm_dugong", "mod": "RocketMotorMenagerie", "title": "SSBE"}], "upgrades": [], "grants": []}, "cryo_methaloxStagedCombustion": {"title": "Methalox Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Methane splits the difference: colder than kerosene, denser than hydrogen, clean-burning and one day makeable on Mars. The LRBE is the tree's first methalox engine - a staged-combustion booster on a fuel nobody flew yet, the seed of a lane that a later era will grow into.", "parts": [{"name": "ROE-BE4", "mod": "ROEngines", "title": "BE-4"}, {"name": "rmm_arenysaurus", "mod": "RocketMotorMenagerie", "title": "LRBE"}], "upgrades": [], "grants": []}, "pc_multiChamberORSC": {"title": "High-Thrust Multi-Chamber ORSC", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Oxidiser-rich staged combustion hits its ceiling. The RD-170 - four chambers off one turbopump, 7900 kilonewtons - is the most powerful liquid-propellant engine ever built, the monster that lifts Energia and Zenit. Where the N1's engines never flew and Zenit's was only an upper, this is the chemistry's operational record.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "YF100_Engine-double-withShell2", "mod": "KerwisChineseAerospacePack", "title": "YF-100 with CZ-5 Boattail"}, {"name": "YF100_Engine_S", "mod": "KerwisChineseAerospacePack", "title": "YF-100"}], "upgrades": ["RFUpgrade_RD-171M", "RFUpgrade_YF-100K"], "grants": []}, "pc_modularORSC": {"title": "Modular Oxidiser-Rich Kerolox", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The record engine gets cut into pieces you can sell. Halve the RD-170's four chambers and you have the RD-180 for Atlas; quarter it and you have the single-chamber Angara engine. Same core hardware, packaged into a modular family for the export and commercial market.", "parts": [{"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-RD191", "mod": "ROEngines", "title": "RD-191"}], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RD-120K", "RFUpgrade_RD-171", "RFUpgrade_RD-172-173", "RFUpgrade_RD-181", "RFUpgrade_RD-191", "RFUpgrade_RD-193"], "grants": []}, "pc_operationalStorableORSC": {"title": "Operational Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The storable staged-combustion engines of Proton and its kin reach their final operational marks - the RD-275 first stage, the Kosberg upper stages - the last refinements of a hypergolic booster line that has been flying since the sixties.", "parts": [], "upgrades": ["RFUpgrade_RD-0210-Mk3", "RFUpgrade_RD-0212-Mk3", "RFUpgrade_RD-0213-Mk3", "RFUpgrade_RD-253-Mk4", "RFUpgrade_RD-254-11D44-Mk4", "RFUpgrade_RD-275", "RFUpgrade_RD-277-14D16"], "grants": []}, "fd_multiRestartStorableUpper": {"title": "Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Coast, reignite, coast again - dozens of times, across days. The Fregat and Briz upper stages and their kin are storable propulsion modules built for the choreography of an interplanetary or multi-orbit mission, restarting on demand where the single-shot Agena and early AJ10 could not. The Transtar rates five hundred ignitions.", "parts": [{"name": "ROE-AJ10-transtar", "mod": "ROEngines", "title": "AJ23 Transtar"}, {"name": "ROE-AJ10AdvLong", "mod": "ROEngines", "title": "AJ10 Series (Advanced Long Nozzle)"}, {"name": "ROE-S592", "mod": "ROEngines", "title": "S5.92"}, {"name": "ROE-S598M", "mod": "ROEngines", "title": "S5.98M"}, {"name": "restock-engine-125-pug", "mod": "ReStockPlus", "title": "Aestus"}], "upgrades": ["RFUpgrade_Aestus-II", "RFUpgrade_AestusMod"], "grants": []}, "fd_terminalGasGenKerolox": {"title": "Terminal Gas-Generator Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The gas-generator kerolox engines that built the space age take their final bow. The last production marks of Delta's RS-27, Atlas's RS-56 and Titan's LR87/LR91 - a lineage of open-cycle workhorses being uprated one last time as staged combustion walks past them.", "parts": [], "upgrades": ["RFUpgrade_LR101-NA-15", "RFUpgrade_LR87-AJ-11A", "RFUpgrade_LR87-AJ-11A-Kero", "RFUpgrade_LR91-AJ-11A", "RFUpgrade_LR91-AJ-11A-Kero", "RFUpgrade_Model8096C", "RFUpgrade_RD-58S", "RFUpgrade_RS-27A", "RFUpgrade_RS-56-OBA", "RFUpgrade_RS-56-OSA"], "grants": []}, "fd_advancedGasGenKerolox": {"title": "Advanced Gas-Generator Kerolox Booster", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "America's answer to the imported RD-180 that never got built. The STBE was a big, simple gas-generator kerolox booster engine drawn for the next launcher - the domestic alternative to buying Russian staged combustion, shelved when the RD-180 won on price.", "parts": [{"name": "cryoengine-allosaur-1", "mod": "CryoEngines", "title": "STBE-3"}, {"name": "nflv-engine-stbe-kero-1", "mod": "NearFutureLaunchVehicles", "title": "STBE (Pratt \u0026 Whitney)"}, {"name": "rmm_turiasaurus", "mod": "RocketMotorMenagerie", "title": "STBE (Pratt \u0026 Whitney)"}], "upgrades": [], "grants": []}, "pc_filamentWoundSolid": {"title": "Filament-Wound Composite-Case Solids", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Wind the motor case out of graphite and epoxy instead of forging it from steel, and the dead weight falls away. The filament-wound composite case - on the giant SRMU, the standalone Castor 120, the Titan solids - is the material leap past the heavy segmented steel of the Shuttle booster, more impulse for less structure.", "parts": [{"name": "ROE-1208sepMotor", "mod": "ROEngines", "title": "UA1208 Nosecone \u0026 Separation Motor"}, {"name": "ROE-Castor120", "mod": "ROEngines", "title": "Castor 120"}, {"name": "ROE-Castor30", "mod": "ROEngines", "title": "Castor 30A"}, {"name": "ROE-Castor30XL", "mod": "ROEngines", "title": "Castor 30XL"}, {"name": "ROE-SRMU", "mod": "ROEngines", "title": "SRMU"}, {"name": "ROE-UA1208", "mod": "ROEngines", "title": "UA1208"}], "upgrades": ["RFTech-solids-tltech6", "RFTech-solids-tltech7", "RFUpgrade_FWC-SRM", "RFUpgrade_RSRM-1986"], "grants": []}, "pc_gemStrapOnCatalog": {"title": "Graphite-Epoxy Strap-On Catalog", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The commercial strap-on aisle. Bolt on as many graphite-epoxy motors as the payload needs - the Delta GEM family in three lengths, the Atlas AJ-60 - a fixed catalogue of composite boosters sized to order off the composite-case breakthrough.", "parts": [{"name": "ROE-AJ60", "mod": "ROEngines", "title": "AJ-60A"}, {"name": "ROE-GEM40", "mod": "ROEngines", "title": "GEM 40"}, {"name": "ROE-GEM46", "mod": "ROEngines", "title": "GEM 46"}, {"name": "ROE-GEM60", "mod": "ROEngines", "title": "GEM 60"}, {"name": "ROE-GEM63", "mod": "ROEngines", "title": "GEM 63"}], "upgrades": [], "grants": []}, "ep_operationalHall": {"title": "Operational Hall-Effect Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The Hall thruster leaves the laboratory. The SPT-100 and its bigger siblings become flight-qualified hardware, first for stationkeeping and then as primary propulsion - a few grams-force of thrust at sixteen hundred seconds of Isp, the electric workhorse of the coming decades.", "parts": [{"name": "RO-PPS1350", "mod": "NearFuturePropulsion", "title": "PPS-1350 Hall Effect Thruster"}, {"name": "RO-SPT100", "mod": "NearFuturePropulsion", "title": "SPT-100 Hall Effect Thruster"}, {"name": "RO-SPT140", "mod": "NearFuturePropulsion", "title": "SPT-140 Hall Effect Thruster"}], "upgrades": ["RFUpgrade_457M-V1-K", "RFUpgrade_SPT-100D", "RFUpgrade_SPT-100M", "RFUpgrade_SPT-140D", "RFUpgrade_SPT-50M"], "grants": []}, "ep_highPowerHall": {"title": "High-Power Nested Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Scale the Hall thruster into the tens of kilowatts. The 457M's nested channels swallow seventy-two kilowatts and push the Isp past two thousand seconds - the class of electric engine that could one day move cargo rather than just trim an orbit.", "parts": [{"name": "RO-457M", "mod": "NearFuturePropulsion", "title": "457M 72kW Hall Effect Thruster"}], "upgrades": ["RFUpgrade_457M-V2", "RFUpgrade_PITV-Hydrazine-40", "RFUpgrade_SPT-100B"], "grants": []}, "ep_griddedIon": {"title": "Gridded Ion Electrostatic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "A different way to throw ions: accelerate them through charged grids instead of a magnetic field, and the exhaust speed climbs higher still. NSTAR flew on Deep Space 1 - the first time an ion engine, not a chemical rocket, was the main drive of a probe to another world.", "parts": [{"name": "ionEngine", "mod": "Squad", "title": "NSTAR Gridded Ion Thruster"}], "upgrades": [], "grants": []}, "ep_pulsedInductive": {"title": "Pulsed Inductive Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "No electrodes to erode - a pulsed magnetic field ionises and flings a puff of ammonia, and repeats thousands of times a second. The PIT reaches seven thousand seconds of Isp, an experimental high-power concept for the kind of cruise no chemical stage could sustain.", "parts": [{"name": "RO-nupit", "mod": "NearFuturePropulsion", "title": "NuPIT Pulsed Inductive Thruster"}, {"name": "pit-0625", "mod": "NearFuturePropulsion", "title": "FARAD Pulsed Inductive Thruster"}, {"name": "pit-125", "mod": "NearFuturePropulsion", "title": "PIT Mk Va Pulsed Inductive Thruster"}], "upgrades": ["RFUpgrade_NuPIT-7000", "RFUpgrade_PITV-Ammonia-1200", "RFUpgrade_PITV-Hydrazine-1200"], "grants": []}, "nuc_flightDesignNTR": {"title": "Flight-Design Solid-Core NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The nuclear rocket stops being a ground-test article and becomes a flight design. The Soviet RD-0410 was actually built and fired; NERVA II is the largest solid-core engine ever drawn. The end of the solid-core line - reactors meant, at last, to leave the ground.", "parts": [{"name": "RD0410MID", "mod": "Squad", "title": "RD-0410"}, {"name": "ROE-NERVAII", "mod": "ROEngines", "title": "NERVA II"}, {"name": "restock-engine-cherenkov", "mod": "ReStockPlus", "title": "RD-0410"}], "upgrades": [], "grants": []}, "nuc_particleBedNTR": {"title": "Particle-Bed NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Pack the reactor fuel as loose particles instead of solid rods and the coolant can pull heat out far faster - more power in less core. The particle-bed NTR of the Timberwind program is a denser, hotter path to the same nuclear thrust.", "parts": [{"name": "ROE-SNTPPFE100", "mod": "ROEngines", "title": "SNTP-PFE100 Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_advancedCoreNTR": {"title": "Advanced-Core NTR Concepts", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Let the fuel melt, or turn to gas, and the temperature ceiling - and the Isp - rises with it. The liquid-core NTR reaches fourteen hundred seconds; the low-pressure gas-core start pushes further. Engineering fiction for now, and the doorway to the gas-core lane a later era will open.", "parts": [{"name": "RO-KA-LRCNTR", "mod": "KerbalAtomics", "title": "Lewis Research Center LNTR"}, {"name": "ntr-gc-25-1", "mod": "KerbalAtomics", "title": "Low-Pressure NTR"}], "upgrades": ["RFUpgrade_PrincetonLNTR-WCH"], "grants": []}, "av_vtolVectoredTurbofan": {"title": "Vectored-Thrust VTOL Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Point the thrust down and a fighter takes off with no runway. The R-79's swivelling nozzle lifts the Yak-141 vertically then rotates aft for supersonic flight, the lift jets handling the hover - vectored thrust as a whole new way to leave the ground.", "parts": [{"name": "RO-SXT-R79", "mod": "SXT", "title": "R-79 Turbofan"}, {"name": "RO-nfa-RD41", "mod": "NearFutureAeronautics", "title": "2x RD-41 Turbojet"}], "upgrades": [], "grants": []}, "av_fourthGenFighterTurbofan": {"title": "Fourth-Generation Fighter Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "The fourth-generation fighter engine: high bypass for a combat turbofan, high pressure ratio, high turbine temperature. The F135 that powers the F-35 is the most powerful fighter engine ever built; the WS-10 is its Chinese contemporary. The long tail of teen-series and Flanker engine marks matures here.", "parts": [{"name": "RO-WS10", "mod": "Squad", "title": "WS-10 Low-Bypass Turbofan"}, {"name": "SXTVTOLturboFan", "mod": "SXT", "title": "F135 Low-Bypass Turbofan"}], "upgrades": ["RFUpgrade_AL-31FM", "RFUpgrade_AL-41F-1S", "RFUpgrade_CF34-3B", "RFUpgrade_F100-PW-229", "RFUpgrade_F100-PW-229PYBBN", "RFUpgrade_F404-GE-402", "RFUpgrade_J58-P-4A", "RFUpgrade_J58-P-4B", "RFUpgrade_R-79M-300", "RFUpgrade_R-79V-300", "RFUpgrade_RM12", "RFUpgrade_WP-13A-II", "RFUpgrade_WP-13F", "RFUpgrade_WP-13FI"], "grants": []}, "gnc_deepSpaceApogeeEngine": {"title": "Deep-Space Bipropellant Apogee Engine", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The little bipropellant engine that inserts a probe into orbit around another planet. The LEROS-1b - flight-proven on NEAR, MESSENGER and Juno - and the R-42 are the mature descendants of the R-4D thruster, built to sit cold through years of cruise and then fire once, exactly right, at the far end.", "parts": [{"name": "ROE-LEROS1B", "mod": "ROEngines", "title": "LEROS-1b (635N)"}, {"name": "ROE-LEROS4", "mod": "ROEngines", "title": "LEROS-4 (1100N)"}, {"name": "ROE-R42", "mod": "ROEngines", "title": "R-42"}, {"name": "ca_mer_ft", "mod": "CoatlAerospace", "title": "Cassini Propulsion Module"}], "upgrades": [], "grants": []}, "cmp_venusEntryAeroshell": {"title": "High-Pressure Atmospheric Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Face an atmosphere ninety times denser than Earth's and hot enough to melt lead at the surface - the Venera aeroshell's heatshield and twin parachutes, built for a descent that ends in a furnace no matter how gently you land in it.", "parts": [{"name": "ca_draco_hs", "mod": "CoatlAerospace", "title": "Huygens Heat Shield"}, {"name": "ca_fom_drogue", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Drogue Parachute)"}, {"name": "ca_fom_heatS", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Heat Shield)"}, {"name": "ca_fom_parachute", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Main Parachute)"}], "upgrades": [], "grants": []}, "cmp_extremeAtmosphericEntry": {"title": "Extreme Atmospheric-Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Hit a gas giant's atmosphere at tens of kilometres a second and shed more heat in two minutes than a lunar return sheds in the whole reentry - the most extreme ablator ever asked to survive, carried on a probe built to transmit for as long as it can before it's cooked.", "parts": [{"name": "galileo_hs_bot", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Bottom"}, {"name": "galileo_hs_mid", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Middle"}, {"name": "galileo_hs_top", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Top"}], "upgrades": [], "grants": []}, "cmp_extremeEntryParachutes": {"title": "Extreme-Entry Recovery Parachutes", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "A parachute stack timed to deploy only once the heatshield has done its worst work and the shockwave has finally fallen behind - Galileo's own descent sequence, the last mechanical step between the hottest entry in the tree and a working probe.", "parts": [{"name": "ca_draco_drogue", "mod": "CoatlAerospace", "title": "Huygens Drogue Parachute"}, {"name": "ca_draco_parachute", "mod": "CoatlAerospace", "title": "Huygens Main Parachute"}, {"name": "galileo_probe_hs_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Heatshield Parachute"}, {"name": "galileo_probe_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Parachute"}], "upgrades": [], "grants": []}, "res_regolithExtraction": {"title": "Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Bore into loose surface material with a motorised bit and bring up what you find - the first step of living off a world instead of just visiting it. Needs nothing more than the same motor already turning a rover's wheels, aimed down instead of forward.", "parts": [{"name": "kerbalism-drill", "mod": "Squad", "title": "Regolith Harvester"}], "upgrades": [], "grants": []}, "res_oreStorageTankage": {"title": "Ore Storage Tankage", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Somewhere to put what the drill brings up - bulk hopper tankage sized for raw, unprocessed ore rather than a refined propellant.", "parts": [{"name": "proceduralTankOre", "mod": "ProceduralParts", "title": "Tank - Ore [Procedural]"}], "upgrades": [], "grants": []}, "res_largeRegolithExtraction": {"title": "Large-Scale Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "The same drill, scaled up for a real mining rate instead of a proof of concept - the difference between sampling a world and living off it.", "parts": [{"name": "kerbalism-large-drill", "mod": "Squad", "title": "Large Regolith Harvester"}], "upgrades": [], "grants": []}, "gnc_sovietProbeBusFamily": {"title": "Soviet Interplanetary Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One bus architecture, flown as both an orbiter and a lander carrier - the 4MV core that became Venera, Zond and Mars probes across a decade, with its own tankage and reentry-module release built in from the start.", "parts": [{"name": "ca_fom_lander", "mod": "CoatlAerospace", "title": "Venera Lander Bus"}, {"name": "ca_vor_core", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus"}, {"name": "ca_vor_mptank", "mod": "CoatlAerospace", "title": "CAE-MT12 Propellant Tank (Pressurized)"}, {"name": "ca_vor_sep1", "mod": "CoatlAerospace", "title": "Venera Reentry Module Decoupler"}, {"name": "ca_vor_tank", "mod": "CoatlAerospace", "title": "4MV-1/2 Spacecraft Bus Propellant Tank"}], "upgrades": [], "grants": []}, "gnc_usProbeBusFamily": {"title": "US Deep-Space Probe Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "The generic 3-axis deep-space probe bus catalog — the spin-stabilised and fully-3-axis-stabilised cores, the attitude-control hardware and the ultraviolet-explorer bus that ride the same shelf. The flagship craft built on them (Pioneer, Voyager) arrive through the charter.", "parts": [{"name": "ca_aacs", "mod": "CoatlAerospace", "title": "CA-AACS Advanced Attitude Control System"}, {"name": "ca_explorer", "mod": "CoatlAerospace", "title": "IUE Spacecraft Bus"}, {"name": "quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10/11 Core"}, {"name": "torekka", "mod": "CoatlAerospace", "title": "Voyager Core"}], "upgrades": [], "grants": []}, "elec_stationClassSolarArrays": {"title": "Station-Class Solar Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "The same fold-out array, sized for a station's appetite instead of a probe's - more cells on a bigger paddle, nothing new about how it works.", "parts": [{"name": "largeSolarPanelEarly", "mod": "Squad", "title": "XT3 Solar Panel Array Mk1"}, {"name": "solarPanels1", "mod": "Squad", "title": "XT2 Solar Panel Array Mk2"}, {"name": "solarPanels3", "mod": "Squad", "title": "XT1 Solar Panel Array Mk2"}], "upgrades": ["solarTL6"], "grants": []}, "elec_probeBusSolarWings": {"title": "Probe-Bus Solar Wings", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "A deployable wing cut to the exact power budget of one bus family - the IUE, Venera and 4MV arrays, each sized for its own mission rather than pulled off a generic sh tional Antenna"}, {"name": "ca_vor_comm", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus Antenna Array"}, {"name": "ca_vor_dish", "mod": "CoatlAerospace", "title": "4MV-1 Spacecraft Bus Parabolic Antenna"}, {"name": "dish_L", "mod": "CoatlAerospace", "title": "Voyager 1 \u0026 2 Parabolic Antenna"}, {"name": "dish_quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10 \u0026 11 Parabolic Antenna"}], "upgrades": [], "grants": []}, "tel_largeApertureReflectors": {"title": "Large-Aperture Reflector Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "The same parabolic-reflector mechanism, scaled past what any single mission needs - giant, huge and large dish reflectors off the shelf for whatever downlink budget the mission calls for.", "parts": [{"name": "nfex-antenna-reflector-giant-1", "mod": "NearFutureExploration", "title": "RFL-2000 Dish Reflector Array"}, {"name": "nfex-antenna-reflector-huge-1", "mod": "NearFutureExploration", "title": "RFL-100 Giant Dish Reflector"}, {"name": "nfex-antenna-reflector-large-1", "mod": "NearFutureExploration", "title": "RFL-50 Large Dish Reflector"}], "upgrades": [], "grants": []}, "mic_gasChromatographMassSpec": {"title": "Gas Chromatograph-Mass Spectrometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Separate a gas sample by how fast each component moves through a column, then weigh what comes out in the mass spectrometer behind it - two instruments in series reading a single sample far more precisely than either alone.", "parts": [{"name": "SXTsciencenosecone", "mod": "SXT", "title": "GC-MS + Antenna"}, {"name": "sensorAtmosphere", "mod": "Squad", "title": "MS04 - Gas Chromatograph-Mass Spectrometer (GC/MS)"}], "upgrades": [], "grants": []}, "opt_digitalImaging": {"title": "Solid-State Digital Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Replace the vidicon's scanned electron beam with a solid-state sensor read out electronically, line by line - the same instinct that took reconnaissance from film to television, one generation further. Higher resolution than any vidicon, and nothing left to wear out or burn in.", "parts": [{"name": "RO-DigitalCamera", "mod": "RP-1", "title": "PH05 - Ultra Resolution Digital Imaging Camera"}], "upgrades": [], "grants": []}, "fd_reusableOMSEngine": {"title": "Reusable Orbital-Maneuvering Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Take the pressure-fed multi-restart engine that once had to fire once, perfectly, on the way to the Moon, and shrink it into a routine orbital-maneuvering thruster - sized for a dozen burns a mission instead of one, flown on the same shape for decades after. The Shuttle's OMS, and the same lineage still flying on Orion.", "parts": [{"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": [], "grants": []}, "cryo_toroidalAerospikeNozzle": {"title": "Toroidal Aerospike Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Bend the bell into an open ring around a truncated plug and let the atmosphere itself complete the nozzle - an annular chamber that keeps its thrust efficient from the pad to vacuum without ever changing shape. Ground-tested for a shortened Saturn upper stage that was never built.", "parts": [{"name": "ROE-J2T", "mod": "ROEngines", "title": "J-2T"}], "upgrades": [], "grants": []}, "pc_fluorineOxidizerChemistry": {"title": "Fluorine Oxidizer Chemistry", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Trade nitrogen tetroxide for liquid fluorine and gain the highest specific impulse any storable propellant will ever deliver - at the cost of an oxidiser that i ", "mod": "NearFuturePropulsion", "title": "VF-200 VASIMR"}], "upgrades": ["RFUpgrade_VF-200-Kr", "RFUpgrade_VX-200SS-Kr"], "grants": []}, "nuc_bimodalNTR": {"title": "Bimodal Nuclear Thermal + Power", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 14, "cost": 0, "anyToUnlock": false, "flavor": "The same reactor that heats propellant for thrust keeps running between burns as a power source - real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry.", "parts": [{"name": "ROE-BNTR", "mod": "ROEngines", "title": "Bimodal NTR"}], "upgrades": [], "grants": []}, "nuc_fissionFragmentRocket": {"title": "Fission-Fragment Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 15, "cost": 0, "anyToUnlock": false, "flavor": "Let the fission fragments themselves be the exhaust - no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach.", "parts": [{"name": "RO-fftdustyplasmaffre", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Fission Fragment Rocket Engine"}, {"name": "fft-ffre-plasma-1", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Afterburning Fission Fragment Rocket Engine"}], "upgrades": [], "grants": []}, "nuc_magneticFusionPulsePropulsion": {"title": "Magnetically-Confined Fusion Pulse Drive", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 0, "anyToUnlock": false, "flavor": "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate - Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion.", "parts": [{"name": "RO-fft20mMMO", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Drive"}, {"name": "f   if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
