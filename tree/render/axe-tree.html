<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

 "upgrades": [], "grants": []}, "charter_sovietEarly": {"title": "First Soviet Satellites", "discipline": "Systems Integration", "color": "#ededed", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Sputnik 2 and 3 — the heavy early Soviet satellites that carried first a dog and then a laboratory into orbit while the West was still counting its failures.", "parts": [{"name": "sputnik2", "mod": "RN_Soviet_Probes", "title": "Sputnik 2"}, {"name": "sputnik3", "mod": "RN_Soviet_Probes", "title": "Sputnik 3 \"Object D\""}], "upgrades": [], "grants": []}, "pc_storables": {"title": "Nitric-Acid Storable Propellants", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "An oxidiser you can keep in the tank for months — fuming nitric acid — that ignites on contact with its fuel, so the engine needs no igniter and no turbopump. The chemistry of the first cheap storable rockets: the sounding motors that clear the Karman line and return the first data from the edge of space.", "parts": [{"name": "ROE-Aerobee", "mod": "ROEngines", "title": "Aerobee"}, {"name": "ROE-VeroniqueAK", "mod": "ROEngines", "title": "Véronique"}, {"name": "ROMeteoSustainer", "mod": "Squad", "title": "U-1250"}], "upgrades": [], "grants": []}, "fd_turbopumpFeed": {"title": "Turbopump Feed", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": true, "flavor": "Drive the propellants with a turbine-spun pump instead of tank pressure — the tank stops being a heavy pressure vessel and the chamber can run far harder than any sounding motor reaches. The step from a powder dart to the turbopump-fed V-2: a large liquid rocket at last.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}], "upgrades": [], "grants": []}, "fd_singleChamber": {"title": "Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A single small chamber held stable by careful injector design — the first purpose-built kerosene-oxygen boosters a satellite could ride: Vanguard's X-405, and the Atlas sustainer that runs on to orbit after the boosters drop away.", "parts": [{"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}, {"name": "ROE-X405H", "mod": "ROEngines", "title": "X-405H"}], "upgrades": [], "grants": []}, "fd_largeChamber": {"title": "Combustion-Instability Damping", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Scale a single combustion chamber to a meganewton and its own acoustics threaten to tear it apart — injector design and damping hold the burn stable at a size the small chambers never faced. The hard way the West reached orbit: one big stable chamber, where the Soviets clustered many small ones. Atlas, Thor, Blue Streak.", "parts": [{"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-RZ", "mod": "ROEngines", "title": "RZ.1/RZ.2"}], "upgrades": [], "grants": []}, "fd_orbitalSoviet": {"title": "Parallel Engine Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Twenty combustion chambers across four strap-on boosters and a core, all lit on the pad and synchronised — the R-7 that carried Sputnik to orbit. Brute multiplicity where the West built single chambers. Unflyable without vernier steering, which its engines carry built-in.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}], "upgrades": [], "grants": []}, "fd_orbitalMultiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Scale the clustered-chamber approach to a meganewton — a bank of chambers on a common turbopump delivering booster thrust without ever risking one large unstable chamber. The storable orbital boosters (RD-211, YF-2) that lofted payloads on propellant you could keep in the tank for years.", "parts": [{"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": [], "grants": []}, "fd_matureOrbital": {"title": "High-Expansion Vacuum Nozzles", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A nozzle bell too large to fire at sea level — the flow would rip away from the walls — but in vacuum it extracts every last metre-per-second from the exhaust. The dedicated upper-stage engines that let the R-7 reach past low orbit toward the Moon: high specific impulse where there is no air to fight.", "parts": [{"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": [], "grants": []}, "fd_verniers": {"title": "Auxiliary-Chamber Thrust Vectoring", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Steer and roll a large rocket in powered flight with small gimballed auxiliary chambers — full three-axis control, roll especially, before a single main engine can be trusted to gimbal for it. The R-7's verniers are integral to its engines, so you cannot fly the cluster without this; Atlas and Jupiter bolt theirs on.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}], "upgrades": [], "grants": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen: vacuum-jacketed tanks, multilayer insulation and enormous pumps for a low-density fuel, all for the highest specific impulse chemistry there is. It costs a whole node of program time up front just to commit - and this is that commitment.", "parts": [], "upgrades": [], "grants": []}, "cryo_hydroloxPrototype": {"title": "Hydrogen-Oxygen Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game.", "parts": [{"name": "ROE-RZ20", "mod": "ROEngines", "title": "RZ.20"}], "upgrades": [], "grants": []}, "cryo_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": [], "grants": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Nitrocellulose plasticised with nitroglycerin and extruded into a grain that carries its own oxygen — the older solid chemistry: simple, dense, storable, lit once and done. The JATO boosters and the first Nike stages.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-R103", "mod": "ROEngines", "title": "R-103 Booster"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}, {"name": "sepMotorLarge", "mod": "Squad", "title": "Radial Separation Motor (Large)"}, {"name": "sepMotorSmall", "mod": "Squad", "title": "Radial Separation Motor (Small)"}], "upgrades": [], "grants": []}, "pc_doubleBaseBooster": {"title": "Double-Base Booster Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Cast a double-base grain large enough to boost a stack off the pad — case-bonded to the motor wall so it burns from the core out without cracking. The Nike booster and the heavy JATO units, where double-base is pushed to its size limit before composite takes over.", "parts": [{"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", "mod": "ROEngines", "title": "Alcyone 1 BE-3"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}], "upgrades": [], "grants": []}, "pc_compositeSolid": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery polysulfide matrix, cast to shape around an integral nozzle — higher energy than double-base and castable to any size. The Baby Sergeant cluster that spun Explorer 1 to orbit.", "parts": [{"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-BabySergeantX11", "mod": "ROEngines", "title": "Baby Sergeant 11x Cluster  - Procedural Interstage Fairing Adapter"}, {"name": "KzProcFairingSide1", "mod": "ProceduralFairings", "title": "Procedural Fairing"}, {"name": "KzProcFairingSide1_TU", "mod": "ProceduralFairings", "title": "Procedural Fairing (Recolorable)"}, {"name": "KzResizableFairingBase", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base"}, {"name": "KzResizableFairingBaseRing", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base Ring"}], "upgrades": [], "grants": []}, "tel_telemetry": {"title": "Pulse-Interval Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Encode a reading as the gap between radio pulses and beam it down on a fixed carrier — the beep-beep that proved a satellite was alive and returned its first data. The whole point of orbit, if you can't hear it.", "parts": [{"name": "SXTAntenna", "mod": "SXT", "title": "Sputnik PS-1 Antenna"}, {"name": "SurfAntenna", "mod": "Squad", "title": "Communotron 16-S"}, {"name": "longAntenna", "mod": "Squad", "title": "Communotron 16"}, {"name": "nfex-antenna-rover-2", "mod": "NearFutureExploration", "title": "AX-5 Aerial Micro-Antenna"}], "upgrades": [], "grants": []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Seal the electronics in a pressurised sphere with a circulating gas and a polished radiating skin, holding them at room temperature through the swing from sunlight to shadow. Sputnik was mostly this: a bus that keeps its instruments alive.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}, {"name": "sputnik1", "mod": "RN_Soviet_Probes", "title": "Sputnik 1"}], "upgrades": ["MLI.Upgrade1"], "grants": []}, "elec_semiconductorDiode": {"title": "Semiconductor Diodes", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A sliver of doped crystal that passes current one way only — grown up from the cat's-whisker radio detector into a rugged solid-state device. It lights an indicator on almost no power, and it is the seed of everything solid-state: rectifiers, transistors, the integrated circuit still to come. Microelectronics grows from here.", "parts": [{"name": "SmallPointLight", "mod": "VenStockRevamp", "title": "MK 4 Point Light"}, {"name": "SmallSpotLight", "mod": "VenStockRevamp", "title": "MK 3 Mini Spotlight"}, {"name": "SmallStripLight", "mod": "VenStockRevamp", "title": "MK 5 Strip Light"}, {"name": "domeLight1", "mod": "Squad", "title": "Domelight Mk1"}, {"name": "groundLight1", "mod": "Squad", "title": "Work Lamp (Small)"}, {"name": "groundLight2", "mod": "Squad", "title": "Work Lamp (Stand)"}, {"name": "navLight1", "mod": "Squad", "title": "Navigation Light Mk1"}, {"name": "spotLight1", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight1_v2", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight2_v2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight3", "mod": "Squad", "title": "Spotlight Mk1"}, {"name": "stripLight1", "mod": "Squad", "title": "Lightstrip Mk1"}], "upgrades": [], "grants": []}, "elec_transistor": {"title": "Transistor Amplification", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Replace the fragile, power-hungry vacuum tube with a sliver of doped germanium that amplifies and switches a signal cold, on almost nothing — the active device the diode could never be. Microelectronics proper begins here: every transistorised instrument, guidance platform and television camera that follows is built on this one breakthrough.", "parts": [], "upgrades": [], "grants": []}, "elec_siliconPV": {"title": "Diffused-Junction Photovoltaics", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Diffuse a shallow junction into a silicon wafer so sunlight knocks a current across it — grams of cells that trickle-charge a battery indefinitely, outliving every chemical primary. Vanguard 1 is still up there, still lit.", "parts": [{"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}, {"name": "RO_EarlyTinySolarPanel", "mod": "Squad", "title": "ST1 Tiny Solar Panel"}], "upgrades": [], "grants": []}, "rob_rotorActuation": {"title": "Electric Rotor Actuation", "discipline": "Robotics", "color": "#d98c2b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A brushless electric motor married to a solid-state controller that holds it at any commanded speed or angle — the first actuator a machine can move on its own. Nothing in an unmanned launcher spins one yet, but every arm, rover wheel, tracking mount and deployable to come turns on this.", "parts": [{"name": "rotor_01", "mod": "SquadExpansion", "title": "EM-16 Light Duty Rotor"}, {"name": "rotor_01s", "mod": "SquadExpansion", "title": "EM-16S Light Duty Rotor"}], "upgrades": [], "grants": []}, "gnc_rcs": {"title": "Cold-Gas Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Bleed compressed nitrogen through opposed nozzles to nudge a craft's attitude — no combustion, nothing to go wrong, just enough impulse to point. The simplest way to hold an orientation in vacuum.", "parts": [{"name": "RO-2kN-Thruster", "mod": "Squad", "title": "2.2/3.6kN Thruster"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": [], "grants": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A small drogue bites the thin high air to hold a falling body straight and slow it enough that a main canopy can open without tearing — the difference between a returned payload and a crater.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": [], "grants": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}, {"name": "science_module", "mod": "Squad", "title": "PH01 - Early Film Camera"}], "upgrades": [], "grants": []}, "opt_vidicon": {"title": "Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Scan a photoconductive target with an electron beam and read the image off as a video signal — lower resolution than film, but it comes down the radio link the instant you take it. No capsule to recover.", "parts": [{"name": "RO-EarlyTVCamera", "mod": "RP-1", "title": "VI01 - Early Television Camera"}, {"nam ometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Drive a soft-ferrite core in and out of saturation and read how the ambient field skews the cycle — a solid-state compass sensitive enough to map the planet's field from orbit, on a boom to escape the craft's own iron.", "parts": [{"name": "RO-EarlyMagnet", "mod": "RP-1", "title": "MG01 - Early Magnetometer"}], "upgrades": [], "grants": []}, "bio_cultures": {"title": "Space-Exposed Biology", "discipline": "Life Support", "color": "#f0508a", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Fly gels, spores and living cultures sealed in a capsule, then recover them to see what vacuum, cold and raw radiation did — the first read on whether anything alive survives above the atmosphere. The seed of every later life-sciences payload.", "parts": [{"name": "BioCapsule", "mod": "SXT", "title": "Advanced Biological Capsule"}, {"name": "GooExperiment", "mod": "Squad", "title": "Biological Sample Capsule"}, {"name": "SXTProbeGooo", "mod": "SXT", "title": "Biological Sample Capsule"}, {"name": "USGooBayWedge", "mod": "UniversalStorage2", "title": "Biological Sample Capsule"}], "upgrades": [], "grants": []}, "mic_atmoSounding": {"title": "Upper-Atmosphere Sounding", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A wedge of thermometers, barometers and sample cells flown up a sounding rocket to log temperature, pressure and density where balloons can't reach — the first instruments to tell us what the air is doing at the edge of space.", "parts": [{"name": "USThermoBaroWedge", "mod": "UniversalStorage2", "title": "Atmospheric Science Unit"}], "upgrades": [], "grants": []}, "aero_subsonicWing": {"title": "Subsonic Aerodynamics", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Beyond the bare procedural wing you begin with, the craft of su h no runway at all.", "parts": [{"name": "landingLeg1", "mod": "Squad", "title": "LT-1 Landing Struts"}], "upgrades": [], "grants": []}, "str_adjustableGear": {"title": "Adjustable Heavy Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Load-rated landing gear with adjustable ride height and stance, sized from a light trainer to a heavy jet — the sophisticated oleo strut for aircraft too big or too fast for the basic legs it grows past. A separate research, off the stock undercarriage.", "parts": [{"name": "KF-ALG-Large", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Large)"}, {"name": "KF-ALG-Medium", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Medium)"}, {"name": "KF-ALG-Small", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Small)"}, {"name": "KF-ALG-SmallSide", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Small - Side)"}], "upgrades": [], "grants": []}, "av_centrifugalJet": {"title": "Centrifugal-Flow Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A single centrifugal impeller flings air outward into the combustor — robust, simple, and the first jet to fly a fighter, though its fat frontal area caps the speed. Continuous thrust with no propeller.", "parts": [{"name": "RO-DerwentV", "mod": "SXT", "title": "Derwent Turbojet"}, {"name": "RO-VK1", "mod": "SXT", "title": "VK-1 Turbojet"}], "upgrades": [], "grants": []}, "fd_rocketplaneRocket": {"title": "Chamber-Staged Aircraft Rocket", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Four small ethanol-oxygen chambers lit one at a time to step the thrust up and down — no throttle valve, but control enough to push a piloted aeroplane past the sound barrier and glide it home. The X-1's engine.", "parts": [{"name": "ROE-S155", "mod": "ROEngines", "title": "S-155"}, {"name": "ROE-XLR10", "mod": "ROEngines", "title": "XLR10"}, {"name": "ROE-XLR11", "mod": "ROEngines", "title": "XLR11"}], "upgrades": [], "grants": []}, "av_axialJet": {"title": "Axial-Flow Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Stack many stages of bladed rotor and stator so the air is squeezed along the axis instead of flung sideways — a slim engine that swallows far more air and scales to real thrust. The architecture every later jet keeps.", "parts": [{"name": "RO-Atar101D", "mod": "SXT", "title": "Atar 101 Turbojet"}, {"name": "RO-J35", "mod": "SXT", "title": "J35 Turbojet"}, {"name": "RO-J47", "mod": "SXT", "title": "J47 Turbojet"}, {"name": "RO-JT3C", "mod": "Squad", "title": "J57 Turbojet (No Afterburner)"}], "upgrades": [], "grants": []}, "aero_supersonicWing": {"title": "Swept-Wing Planform", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Rake the wing back so the flow across it stays subsonic while the aircraft goes supersonic, delaying the shock stall — with a shock-cone intake that decelerates the air before it reaches the compressor. What makes level supersonic flight possible at all.", "parts": [{"name": "RO-B9ProcAMWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing, All-Moving (Supersonic)"}, {"name": "RO-B9ProcCS-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Control Surface (Supersonic)"}, {"name": "RO-B9ProcWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Supersonic)"}, {"name": "RO-shockConeIntake125", "mod": "Squad", "title": "1.25m Shock Cone Intake"}, {"name": "RO-shockConeIntakeBomarc", "mod": "Squad", "title": "0.70m Shock Cone Intake"}, {"name": "RO-shockConeIntakeMig", "mod": "Squad", "title": "0.86m Shock Cone Intake"}, {"name": "SXTRadialAirIntakeShockCon zle. Useless from a standstill, unbeatable once you are already fast. Missiles and interceptors.", "parts": [{"name": "RO-Nord1500", "mod": "Squad", "title": "Nord 1500/Atar Combined Cycle Ramjet"}, {"name": "RO-RJ43", "mod": "Squad", "title": "RJ43 Ramjet"}, {"name": "RO-RJ47", "mod": "Squad", "title": "RJ47 Ramjet"}, {"name": "RO-RJ55", "mod": "Squad", "title": "RJ55/J67 Combined Cycle Ramjet"}, {"name": "RO-RJ59", "mod": "Squad", "title": "RJ59 Ramjet"}, {"name": "aje_ramjet", "mod": "Squad", "title": "CR2 Ramjet"}], "upgrades": [], "grants": []}, "fd_throttleableRocketplane": {"title": "Throttle-Valve Aircraft Rocket", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A throttle valve on an aircraft rocket at last — the Curtiss-Wright XLR25 could be modulated continuously in flight instead of stepped chamber by chamber, the first US rocket a pilot flew on the stick. The X-2's engine: the bridge from the X-1's fixed chambers to the X-15's man-rated throttle.", "parts": [{"name": "ROE-XLR25", "mod": "ROEngines", "title": "XLR25"}], "upgrades": [], "grants": []}, "fd_throttlingRocket": {"title": "Throttleable Restartable Rocket", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A rocket a pilot can throttle deeply and relight in flight, burning ammonia and oxygen with control enough to fly the edge of space and come back. The X-15's XLR99: the first man-rated throttleable engine, and the doorway to hypersonics.", "parts": [{"name": "ROE-XLR99", "mod": "ROEngines", "title": "XLR99"}], "upgrades": [], "grants": []}, "str_structuralHardware": {"title": "Riveted Airframe Structure", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Rivet and weld sheet, extrusion and tube into a load-bearing frame — the everyday structural craft of 1950: struts, I-beams, panels, mounts and nose cones, the skeleton every vehicle hangs on. The root the rest of structures grows from.", "parts": [{"name": "Angledpanel", "mod": "VenStockRevamp", "title": "M-1x1T Structural Panel"}, {"name": "KzThrustPlate", "mod": "ProceduralFairings", "title": "Thrust Plate [Procedural]"}, {"name": "ROT-Mount", "mod": "ROTanks", "title": "Modular Mount (Structural)"}, {"name": "microIbeam", "mod": "VenStockRevamp", "title": "M-Beam 100 I-Beam"}, {"name": "smallHardpoint", "mod": "Squad", "title": "Small Hardpoint"}, {"name": "stackPoint1", "mod": "Squad", "title": "BZ-52 Radial Attachment Point"}, {"name": "structuralIBeam1", "mod": "Squad", "title": "M-Beam 650 I-Beam"}, {"name": "structuralIBeam2", "mod": "Squad", "title": "M-Beam 200 I-Beam"}, {"name": "structuralIBeam3", "mod": "Squad", "title": "M-Beam 200 I-Beam Pocket Edition"}, {"name": "structuralMiniNode", "mod": "Squad", "title": "The Not-Rockomax Micronode"}, {"name": "structuralPanel1", "mod": "Squad", "title": "M-1x1 Structural Panel"}, {"name": "structuralPanel2", "mod": "Squad", "title": "M-2x2 Structural Panel"}, {"name": "structuralPylon", "mod": "Squad", "title": "Structural Pylon"}, {"name": "strutCube", "mod": "Squad", "title": "Cubic Octagonal Strut"}, {"name": "strutCube3way", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Three Way Connector"}, {"name": "strutCube90", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Angle Connector"}, {"name": "strutCubeLarge", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Mk IV"}, {"name": "strutCubeMedium", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Mk III"}, {"name": "strutCubeMountingPlate", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Slim Mounting Plate"}, {"name": "strutCubeSmall", "mod": "VenStockRevamp", "title": "Cubic Octagonal Strut Mk II"}, {"name": "strutOcto", "mod": "Squad", "title": "Octagonal Strut"}, {"name": "truss-micro-01", "mod": "NearFutureConstruction", "title": "Cubic-Family Large Strut"}, {" #83c341", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Stack scintillators and photomultipliers in coincidence so only a particle passing clean through every layer is counted: a telescope not for light but for cosmic rays, reading their energy and direction. The photomultiplier and its fast coincidence circuit run on the vacuum-tube electronics of the day — no transistor required.", "parts": [{"name": "RO-ScintillationCounter", "mod": "RP-1", "title": "CR02 - Scintillation Counter Cosmic Ray Telescope"}, {"name": "RP0Cherenkov", "mod": "RP-1", "title": "CD01 - Cherenkov Cosmic Ray Detector"}], "upgrades": [], "grants": []}, "opt_recon": {"title": "Film Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Long-focal-length optics and fine-grain emulsion resolve a vehicle from orbit and drop the exposed film home in a capsule — the high-resolution reconnaissance that was the real reason the first satellites flew. No electronics, just better glass and finer grain: it gets there before the television does.", "parts": [{"name": "RO-HighResFilmCamera", "mod": "RP-1", "title": "PH04 - High Resolution Film Camera"}, {"name": "RO-ImprovedFilmCamera", "mod": "RP-1", "title": "PH03 - Improved Film Camera"}], "upgrades": [], "grants": []}, "opt_tvRecon": {"title": "Television Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Higher-resolution vidicon cameras that scan the reconnaissance image down a radio link the moment it is taken — no capsule to recover, the picture on the ground in minutes. The electronic eye catching up to the spy film.", "parts": [{"name": "RO-BasicTVCamera", "mod": "RP-1", "title": "VI02 - Basic TV Camera"}], "upgrades": [], "grants": []}, "opt_remoteSensing": {"title": "Infrared Remote Sensing", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Scan the planet in wavelengths the eye cannot see: an infrared radiometer maps cloud-top temperature, an ultraviolet spectrometer reads the high atmosphere. The first weather and earth-resource sensing from orbit.", "parts": [{"name": "RO-IRRadiometer", "mod": "RP-1", "title": "IR01 - Infrared Radiometer"}], "upgrades": [], "grants": []}, "opt_irRadiometry": {"title": "High-Resolution Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A finer detector and a tighter scan resolve the infrared scene into detail the first radiometer blurred — the warm and cold of a coastline or a storm system mapped sharply, still in a single band but now worth the downlink.", "parts": [{"name": "RO-HRIRRadiometer", "mod": "RP-1", "title": "IR02 - High-Resolution Infrared Radiometer"}, {"name": "dmUS2GoreSat", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "opt_twoChannelIR": {"title": "Two-Channel Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's.", "parts": [{"name": "RO-TwoChannelIR", "mod": "RP-1", "title": "IR03 - Two-Channel Infrared Radiometer"}], "upgrades": [], "grants": []}, "opt_uvSpectrometry": {"title": "Ultraviolet Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it.", "parts": [{"name": "RO-UVSpectrometer", "mod": "RP-1", "title": "IS02 - Ultraviolet Spectrometer"}], "upgrades": [], "grants": []}, "opt_refinedTV": {"title": "Refined Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up.", "parts": [{"name": "RO-ImprovedTVCamera", "mod": "RP-1", "title": "VI03 - Improved TV Camera"}], "upgrades": [], "grants": []}, "mic_boomMagnetometry": {"title": "Boom-Deployed Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there.", "parts": [{"name": "dmUS2MagBoom", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "opt_precisionOptics": {"title": "Precision Orbital Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A long-focal-length telescope trained on the surface from orbit, resolving detail a wide-angle camera smears into a blur — the optical reconnaissance that reads a runway, not just a coastline. Glass figured to the edge of the aperture and held rock-steady on a stabilised platform, for at this focal length the smallest jitter is a smear.", "parts": [{"name": "dmUS2Scope", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "elec_deployableArrays": {"title": "Deployable Photovoltaic Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch.", "parts": [{"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}], "upgrades": ["solarTL1"], "grants": []}, "gnc_basicAvionics": {"title": "Miniaturised Inertial Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised.", "parts": [], "upgrades": ["HDD-Upgrade-1961", "HDD-Upgrade-1964", "HDD-Upgrade-Basic", "RFTech-ComSat-II", "RFTech-NavSat-II", "RP-1-PayloadTech-Axial"], "grants": ["Science-Core-basicAvionics"]}, "tel_dopplerRanging": {"title": "Coherent Doppler Ranging", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon.", "parts": [], "upgrades": ["commsTL1"], "grants": ["RP0Level2TrackingStation"]}, "tel_pcmTelemetry": {"title": "Pulse-Code Modulation Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": ["commsTL2"], "grants": ["RP0Level3TrackingStation"]}, "str_equipmentBays": {"title": "Enclosed Equipment Bays", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose.", "parts": [{"name": "RO_ServiceBay_300", "mod": "Squad", "title": "Service Bay [3m]"}, {"name": "ServiceBay_250_v2", "mod": "Squad", "title": "Service Bay [4m]"}, {"name": "USRadialTanks", "mod": "UniversalStorage2", "title": "Universal Storage: Radial Tank"}, {"name": "restock-nosecone-1875-1", "mod": "ReStockPlus", "title": "Protective Rocket Nose Mk18"}], "upgrades": ["RFTech-SM-II"], "grants": []}, "pc_ntoHypergolics": {"title": "Dinitrogen-Tetroxide Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it.", "parts": [], "upgrades": ["RFUpgrade_RD-214-8D59", "RFUpgrade_RD-214U-8D59U", "RFUpgrade_RD-217-8D515", "RFUpgrade_RD-250-8D518", "RFUpgrade_RD-252-8D724", "RFUpgrade_RD-855", "RFUpgrade_RD-856", "RFUpgrade_S5.2", "RFUpgrade_XLR81-BA-5", "RFUpgrade_XLR81-BA-7", "RFUpgrade_YF-1A", "RFUpgrade_YF-1B", "RFUpgrade_YF-3A"], "grants": []}, "pc_htpSustainer": {"title": "Multi-Chamber Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}], "upgrades": [], "grants": []}, "pc_larchPeroxide": {"title": "Refined Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off.", "parts": [], "upgrades": ["RFUpgrade_Gamma-301", "RFUpgrade_Larch-2", "RFUpgrade_Larch-4", "RFUpgrade_Larch-8"], "grants": []}, "pc_fluorine": {"title": "Liquid-Fluorine Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": ["RFUpgrade_XLR81-LF2-SPS"], "grants": []}, "pc_scoutSolids": {"title": "Staged Solid Boost", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it.", "parts": [{"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}], "upgrades": ["RFUpgrade_Castor-1-SL", "RFUpgrade_Castor-1-Vac"], "grants": []}, "pc_strapOnSolids": {"title": "Strap-On Thrust Augmentation", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta.", "parts": [{"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Castor1_Inline", "mod": "ROEngines", "title": "Castor 1"}], "upgrades": [], "grants": []}, "pc_retroKick": {"title": "Vacuum-Start Solid Impulse", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail.", "parts": [{"name": "ROC-GeminiRetroMECBDB", "mod": "ROCapsules", "title": "Gemini Retro Rocket (Star-13E)"}, {"name": "ROC-MercuryPosigradeBDB", "mod": "ROCapsules", "title": "Mercury Posigrade Kick Motor"}, {"name": "ROC-MercuryRetroBDB", "mod": "ROCapsules", "title": "Mercury Retro (TE-M-316)"}, {"name": "ROC-VoskhodRetroBooster", "mod": "ROCapsules", "title": "Voskhod Retro Package"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-Agena_Spinrocket", "mod": "ROEngines", "title": "Agena 1KS30HA Spin Rocket"}], "upgrades": [], "grants": []}, "fd_regenCooling": {"title": "Regenerative Chamber Cooling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware.", "parts": [], "upgrades": ["RFUpgrade_LR105-NA-3", "RFUpgrade_LR105-NA-5", "RFUpgrade_LR79-NA-11", "RFUpgrade_LR79-NA-9", "RFUpgrade_LR87-AJ-3", "RFUpgrade_LR89-NA-3", "RFUpgrade_LR89-NA-5", "RFUpgrade_LR91-AJ-3", "RFUpgrade_RD-107-8D74-1958", "RFUpgrade_RD-107-8D74-1959", "RFUpgrade_RD-107-8D74K", "RFUpgrade_RD-107-8D76", "RFUpgrade_RD-108-8D75-1958", "RFUpgrade_RD-108-8D75-1959", "RFUpgrade_RD-108-8D75K", "RFUpgrade_RD-108-8D77", "RFUpgrade_RZ.2-Mk3", "RFUpgrade_RZ.2-Mk4", "RFUpgrade_S-3D", "RFUpgrade_Viking-4", "RFUpgrade_Viking-5"], "grants": []}, "fd_vacuumExpansion": {"title": "Extended Vacuum Expansion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}], "upgrades": ["RFUpgrade_LR101-NA-11", "RFUpgrade_LR105-NA-6", "RFUpgrade_LR105-NA-7.1", "RFUpgrade_LR105-NA-7.2", "RFUpgrade_LR79-NA-13", "RFUpgrade_LR89-NA-6", "RFUpgrade_LR89-NA-7.1", "RFUpgrade_LR89-NA-7.2", "RFUpgrade_RD-0106", "RFUpgrade_RD-0108", "RFUpgrade_RD-0109", "RFUpgrade_RD-119-8D710", "RFUpgrade_RD-225-8D721", "RFUpgrade_RL10A-3-1", "RFUpgrade_S-3FH", "RFUpgrade_X-405H", "RFUpgrade_X-405H-2", "RFUpgrade_X-405H-3", "RFUpgrade_X-405H-4", "RFUpgrade_XLR11-RM-13-10K", "RFUpgrade_XLR81-BA-11", "RFUpgrade_YF-22B", "RFUpgrade_YF-23B"], "grants": []}, "fd_restartableUpper": {"title": "Restartable Vacuum Ignition", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come.", "parts": [{"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": ["RFUpgrade_AJ10-101A", "RFUpgrade_AJ10-118", "RFUpgrade_AJ10-118D", "RFUpgrade_AJ10-142", "RFUpgrade_AJ10-42"], "grants": []}, "fd_spacecraftPropulsion": {"title": "Restartable Deep-Throttling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-C1", "mod": "ROEngines", "title": "C-1"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": ["RFUpgrade_Model8096-HDA", "RFUpgrade_XLR81-BA-1", "RFUpgrade_XLR81-BA-3"], "grants": []}, "fd_storableSustainer": {"title": "Storable Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute.", "parts": [{"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF3_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-3 (no gimbal)"}, {"name": "YF3_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-3 with Boattail"}], "upgrades": [], "grants": []}, "fd_titanTandem": {"title": "Altitude-Start Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design.", "parts": [{"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}], "upgrades": [], "grants": []}, "fd_longMarchStorable": {"title": "Storable Chamber Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice.", "parts": [{"name": "YF20_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20"}, {"name": "YF21_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-21"}, {"name": "YF22_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-22"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}, {"name": "YF25K_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20 with Boattail (no gimbal)"}], "upgrades": [], "grants": []}, "fd_sovietStorable": {"title": "Storable Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}], "upgrades": [], "grants": []}, "fd_saturnKerolox": {"title": "High-Pressure Kerolox Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-H1C", "mod": "ROEngines", "title": "H-1C Series"}, {"name": "ROE-H1D", "mod": "ROEngines", "title": "H-1D Series"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RS27", "mod": "ROEngines", "title": "H-1/RS-27"}], "upgrades": [], "grants": []}, "met_cooledTurbine": {"title": "Air-Cooled Turbine Blades", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust.", "parts": [], "upgrades": ["RFUpgrade_AL-7F-1", "RFUpgrade_AL-7F-2", "RFUpgrade_Atar09K-50", "RFUpgrade_Atar101E-3", "RFUpgrade_Avon200R", "RFUpgrade_Avon302", "RFUpgrade_CJ805-3B", "RFUpgrade_J57-P-20A", "RFUpgrade_J57-P-420", "RFUpgrade_J75-P-19", "RFUpgrade_J75-P-5A", "RFUpgrade_J79-GE-10", "RFUpgrade_J79-GE-11", "RFUpgrade_J79-GE-17", "RFUpgrade_J79-GE-2A", "RFUpgrade_J79-GE-5C", "RFUpgrade_J79-GE-8", "RFUpgrade_J85-GE-5", "RFUpgrade_PT6A-27", "RFUpgrade_PT6A-28", "RFUpgrade_R-11F2-300", "RFUpgrade_R-11F2S-300", "RFUpgrade_R-15BD-300", "RFUpgrade_RB162-4D", "RFUpgrade_RD-9AF2-300", "RFUpgrade_WP-6", "RFUpgrade_WP-6A", "RFUpgrade_WP-7", "RFUpgrade_WP-7A"], "grants": []}, "av_turboprop": {"title": "Geared Turboprop", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Gear the axial turbine down to swing a large propeller instead of blasting a jet — trading top speed for the fuel economy and heavy-lift pull a jet cannot match down low. The Tu-95's monstrous contra-rotating NK-12 and the workhorse PT6: turbine power delivered through a propeller.", "parts": [{"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "SXTPWPT6", "mod": "SXT", "title": "PT6A Turboprop"}], "upgrades": [], "grants": []}, "av_hydrogenJet": {"title": "Hydrogen-Fuelled Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Feed the jet liquid hydrogen instead of kerosene — a fuel so energetic it promises altitude and range no kerosene burner can reach, at the price of a vacuum-jacketed fuel system feeding a red-hot engine. The Model 304 of the CL-400 Suntan spyplane: a gamble that flew on the coldest fuel there is, then stayed on the bench.", "parts": [{"name": "RO-model304", "mod": "Squad", "title": "Model 304 Turbojet"}], "upgrades": [], "grants": []}, "av_highTempTurbojet": {"title": "High-Temperature Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "With a cooled turbine able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage.", "parts": [{"name": "RO-R11F", "mod": "Squad", "title": "R-11 Turbojet"}, {"name": "aje_atar", "mod": "Squad", "title": "Atar 09 Turbojet"}, {"name": "miniJetEngine", "mod": "Squad", "title": "J85 Turbojet (No Afterburner)"}], "upgrades": [], "grants": []}, "av_ramjetAdvanced": {"title": "Refined Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}], "upgrades": [], "grants": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour and holding the structure behind it cool. The one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}, {"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A denser char layer and a slower burn-through rate let the same shield shrug off a hotter, faster reentry — the material getting better, not the shape changing. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS", "MercuryHS"], "grants": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", "title": "Life Support Config Engine"}, {"name": "kerbalism-lifesupportmodule", "mod": "KerbalismConfig", "title": "External ECLSS Module"}], "upgrades": [], "grants": []}, "life_crewedExperimentBay": {"title": "Crew-Tended Experiment Locker", "discipline": "Life Support", "color": "#f0508a", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A modular science bay built into the cabin wall, serviced by hand instead of run by a timer — the same slot-in experiment rig whichever crewed vehicle happens to carry it, so long as someone is aboard to work it.", "parts": [{"name": "USMatBayWedge", "mod": "UniversalStorage2", "title": "Crewed Experiment Bay"}], "upgrades": ["RFTech-AddLifeSupport"], "grants": []}, "gnc_spacecraftRCS": {"title": "Storable-Propellant Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Trade the cold-gas puffers for small liquid thrusters on a storable propellant — peroxide, or hypergolics that light on contact — for many times the impulse in the same mass. The reaction control a manoeuvring spacecraft needs to point, hold and turn through a whole mission.", "parts": [{"name": "ROE-generic-full", "mod": "ROEngines", "title": "1.1/1.78kN Thruster"}, {"name": "ROE-generic-half", "mod": "ROEngines", "title": "550/890N Thruster"}, {"name": "ROE-generic-quarter", "mod": "ROEngines", "title": "275/445N Thruster"}, {"name": "ca_jib", "mod": "CoatlAerospace", "title": "Generic 0.5 kN Thruster"}, {"name": "microEngine", "mod": "Squad", "title": "1.1/1.78kN Thruster"}, {"name": "vernierEngine", "mod": "Squad", "title": "Attitude Jet, Conformal (275/445 N class)"}], "upgrades": ["RFTech-rcs-tltech1"], "grants": []}, "life_pressurisedCabin": {"title": "Sealed Cabin Pressurisation", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Seal a cabin tight enough to hold near sea-level pressure while the air outside thins to nothing, feeding it breathing gas and bleeding off the heat of hypersonic flight — the pilot rides to the edge of space in something close to shirtsleeves. The X-15's sealed cabin and the pressurised fuselage behind it.", "parts": [{"name": "MK1Cargobay", "mod": "VenStockRevamp", "title": "1.25m Cargo Bay"}, {"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "SXTSmallFuselage", "mod": "SXT", "title": "0.625m Fuselage (Pressurized)"}], "upgrades": [], "grants": []}, "int_launchEscape": {"title": "Tractor Escape Rocket", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused.", "parts": [{"name": "ROC-MercuryLESBDB", "mod": "ROCapsules", "title": "Mercury Launch Escape System"}, {"name": "RO_mk1_LES", "mod": "Squad", "title": "Launch Escape System (Mercury)"}], "upgrades": [], "grants": []}, "int_mercuryCapsule": {"title": "Blunt-Body Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "ROC-MercuryDecouplerAtlasBDB", "mod": "ROCapsules", "title": "Mercury-Atlas Adapter"}, {"name": "ROC-MercuryDecouplerBDB", "mod": "ROCapsules", "title": "Mercury Redstone Adapter"}, {"name": "ROC-MercuryNoseCapBDB", "mod": "ROCapsules", "title": "Mercury M-DCAM Nose Unit"}, here recovery is the whole point.", "parts": [{"name": "ROC-GeminiParachuteBDB", "mod": "ROCapsules", "title": "Gemini Landing Parachute System"}, {"name": "ROC-GeminiParachuteDrogueBDB", "mod": "ROCapsules", "title": "Gemini Drogue Parachute"}, {"name": "ROC-GeminiRetrogradeSectionBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section"}, {"name": "ROC-MercuryParachuteBDB", "mod": "ROCapsules", "title": "Mercury M-ASD Main Parachute"}, {"name": "ROC-MercuryRetropackBDB", "mod": "ROCapsules", "title": "Mercury Retropack"}, {"name": "ROC-ReentryControlSystemBDB", "mod": "ROCapsules", "title": "Gemini Re-entry Control System"}, {"name": "ROC-RetrogradeDecouplerBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section Decoupler"}, {"name": "ROC-VoskhodRetroDecoupler", "mod": "ROCapsules", "title": "Voskhod Retro Decoupler"}, {"name": "ROC-VostokParachute", "mod": "ROCapsules", "title": "Vostok/Voskhod Parachute"}], "upgrades": [], "grants": []}, "opt_orbitalMapping": {"title": "Synoptic Orbital Scanning", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Sweep a body strip by strip as the orbit carries the scanner across it, assembling a complete map from thousands of passes — terrain, altimetry and anomaly built from coverage no single frame could give. The first instrument that maps a world instead of photographing a scene. The seed of the mapping lane that fills out among the planets.", "parts": [{"name": "SCANsat_Tracker", "mod": "SCANsat", "title": "SCAN MapTraq®"}], "upgrades": [], "grants": []}, "fd_clusteredThrustGrowth": {"title": "Clustered-Chamber Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Squeeze more thrust from the same four-chamber cluster without touching the chemistry — the storable engines already flying, simply pushed harder.", "parts": [], "upgrades": ["RFUpgrade_YF-20B", "RFUpgrade_YF-
