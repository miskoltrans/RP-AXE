mod": "RP-1", "title": "CD01 - Cherenkov Cosmic Ray Detector"}], "upgrades": [], "grants": [], "experiments": [{"name": "Cherenkov Detector 1", "id": "RP0Cherenkov", "sci": 20, "group": "Experiments"}, {"name": "Radiation Detector 2", "id": "RP0cosmicRay2", "sci": 30, "group": "Experiments"}]}, "nuc_gammaRaySpectrometry": {"title": "Gamma-Ray Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Cosmic rays knock the nuclei of a planet's surface into excited states, and they fall back emitting gamma rays at energies unique to each element. Count those photons from orbit and sort them by energy and the ground below resolves into potassium, thorium, uranium, iron and titanium — the first instrument that says what another world is made of, not what it looks like. Luna 10 did it in 1966, before anything had landed.", "parts": [{"name": "AXE-GammaRaySpectrometer", "mod": "RP-AXE", "title": "GR01 - Gamma-Ray Spectrometer"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_xrayFluorescence": {"title": "X-Ray Fluorescence Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "The Sun's X-rays strike the surface and it fluoresces back, and in that returning light sit the elements gamma rays read poorly — magnesium, aluminium, silicon, the rock-forming majority. The catch is that you are reading an echo, so the instrument must also look at the Sun to know what was shouted. Apollo's service module carried both, staring down and up at once.", "parts": [{"name": "AXE-XRayFluorescence", "mod": "RP-AXE", "title": "XR01 - X-Ray Fluorescence Spectrometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Solar X-Ray Detection", "id": "RP0solarXRayDetection", "sci": 150, "group": "Crew Science"}]}, "nuc_neutronSpectrometry": {"title": "Neutron Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Cosmic rays spall neutrons out of the ground, and hydrogen — alone among nuclei in weighing exactly what a neutron does — robs them of their energy on the way out. So you count what does NOT come back. Suppressed neutrons mean buried hydrogen, buried hydrogen means water ice, and the map that falls out tells you which permanently shadowed crater is worth landing in.", "parts": [{"name": "AXE-NeutronSpectrometer", "mod": "RP-AXE", "title": "NS01 - Neutron Spectrometer"}], "upgrades": [], "grants": [], "experiments": []}, "opt_recon": {"title": "Film Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A rotating lens sweeps the ground across a curved film gate, laying a horizon-to-horizon strip onto one frame — the whole swath at reconnaissance scale, in a camera small enough to orbit. The high-resolution photography that was the real reason the first satellites flew, and it gets there before the television does.", "parts": [{"name": "RO-ImprovedFilmCamera", "mod": "RP-1", "title": "PH03 - Improved Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_largeApertureOptics": {"title": "Large-Aperture Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Resolution is set by the diameter of the glass, so the camera stops being a payload and becomes the spacecraft — a mirror the length of the bus, folded to fit a fairing and held in focus while the structure warms and cools. Grain and lens motion are no longer the limit; diffraction is.", "parts": [{"name": "RO-HighResFilmCamera", "mod": "RP-1", "title": "PH04 - High Resolution Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_tvRecon": {"title": "Television Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Higher-resolution vidicon cameras that scan the reconnaissance image down a radio link the moment it is taken — no capsule to recover, the picture on the ground in minutes. The electronic eye catching up to the spy film.", "parts": [{"name": "RO-BasicTVCamera", "mod": "RP-1", "title": "VI02 - Basic TV Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Basic TV Camera", "id": "RP0visibleImaging2", "sci": 2, "group": "Experiments"}]}, "opt_remoteSensing": {"title": "Infrared Remote Sensing", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Scan the planet in wavelengths the eye cannot see: an infrared radiometer maps cloud-top temperature, an ultraviolet spectrometer reads the high atmosphere. The first weather and earth-resource sensing from orbit.", "parts": [{"name": "RO-IRRadiometer", "mod": "RP-1", "title": "IR01 - Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer", "id": "RP0infraredRad1", "sci": 2, "group": "Experiments"}]}, "opt_irRadiometry": {"title": "High-Resolution Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A finer detector and a tighter scan resolve the infrared scene into detail the first radiometer blurred — the warm and cold of a coastline or a storm system mapped sharply, still in a single band but now worth the downlink.", "parts": [{"name": "RO-HRIRRadiometer", "mod": "RP-1", "title": "IR02 - High-Resolution Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer 2", "id": "RP0infraredRad2", "sci": 3, "group": "Experiments"}]}, "opt_twoChannelIR": {"title": "Two-Channel Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's.", "parts": [{"name": "RO-TwoChannelIR", "mod": "RP-1", "title": "IR03 - Two-Channel Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer 3", "id": "RP0infraredRad3", "sci": 4, "group": "Experiments"}]}, "opt_uvSpectrometry": {"title": "Ultraviolet Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it.", "parts": [{"name": "RO-UVSpectrometer", "mod": "RP-1", "title": "IS02 - Ultraviolet Spectrometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Spectrometer 2", "id": "RP0imageSpec2", "sci": 3, "group": "Experiments"}]}, "opt_refinedTV": {"title": "Refined Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-ImprovedTVCamera", "mod": "RP-1", "title": "VI03 - Improved TV Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Advanced Visible Imaging Device", "id": "RP0visibleImaging4", "sci": 6, "group": "Experiments"}, {"name": "Improved TV Camera", "id": "RP0visibleImaging3", "sci": 3, "group": "Experiments"}]}, "mic_boomMagnetometry": {"title": "Boom-Deployed Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there. The boom buys sensitivity, not new ground: Earth still answers with one number, and the crustal patchwork worth resolving is still sitting on the lunar surface.", "parts": [{"name": "RO-HeliumMagnet", "mod": "RP-1", "title": "MG02 - Helium Magnetometer Boom"}], "upgrades": [], "grants": [], "experiments": []}, "elec_deployableArrays": {"title": "Deployable Photovoltaic Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch.", "parts": [{"name": "1x3SPanels", "mod": "VenStockRevamp", "title": "OX-2L 1x3 Photovoltaic Panels"}, {"name": "solarPanels2", "mod": "Squad", "title": "XT2 Solar Panel Array Mk1"}, {"name": "solarPanels4", "mod": "Squad", "title": "XT1 Solar Panel Array Mk1"}, {"name": "solarPanels5", "mod": "Squad", "title": "ST1 Solar Panel"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_basicAvionics": {"title": "Miniaturised Inertial Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised.", "parts": [], "upgrades": ["RFTech-ComSat-II", "RFTech-NavSat-II", "RP-1-PayloadTech-Axial"], "grants": ["Science-Core-basicAvionics"], "experiments": []}, "shd_basicAvionics": {"title": "Deep-Space Bus — Basic", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Build the guidance stack for somewhere the Sun is the only landmark and Earth's field no longer reaches — star trackers to know which way is up, heaters and insulation against the cold, hardened parts and redundant paths for a mission measured in years. Heavier and costlier than the bare avionics inside it, and the price of working outside the magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-basicAvionics"], "experiments": []}, "tel_minitrackInterferometry": {"title": "Phase-Comparison Satellite Tracking", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A fence of ground aerials reading the same carrier tone and comparing its phase between them, fixing where the spacecraft crossed to a fraction of its own beamwidth. Fly enough passes and the orbit itself becomes the instrument: it refuses to close, and what it refuses by is the shape of the mass underneath.", "parts": [], "upgrades": [], "grants": [], "experiments": [{"name": "Orbital Perturbation", "id": "RP0orbitalPurturbation1", "sci": 200, "group": "Experiments"}]}, "tel_dopplerRanging": {"title": "Coherent Doppler Ranging", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon.", "parts": [], "upgrades": ["commsTL1"], "grants": ["RP0Level2TrackingStation"], "experiments": []}, "tel_pcmTelemetry": {"title": "Pulse-Code Modulation Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": ["commsTL2"], "grants": ["RP0Level3TrackingStation"], "experiments": [{"name": "Lunar Surface Television Broadcast", "id": "RP0LunarLandingTelevisionBroadcast", "sci": 80, "group": "Crew Science"}, {"name": "Space Television Broadcast", "id": "RP0TelevisionBroadcast", "sci": 80, "group": "Crew Science"}]}, "str_equipmentBays": {"title": "Enclosed Equipment Bays", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose.", "parts": [{"name": "ROC-GeminiEquipmentSectionBDB", "mod": "ROCapsules", "title": "Gemini Equipment Section"}, {"name": "ROC-LEMMESABDB", "mod": "ROCapsules", "title": "Apollo LM Material Experiment Stowage Assembly"}, {"name": "RO_ServiceBay_300", "mod": "Squad", "title": "Service Bay [3m]"}, {"name": "ServiceBay_250_v2", "mod": "Squad", "title": "Service Bay [4m]"}, {"name": "USRadialTanks", "mod": "UniversalStorage2", "title": "Universal Storage: Radial Tank"}, {"name": "restock-nosecone-1875-1", "mod": "ReStockPlus", "title": "Protective Rocket Nose Mk18"}], "upgrades": ["RFTech-SM-II"], "grants": [], "experiments": []}, "pc_akOxidiser": {"title": "Inhibited Nitric-Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Red fuming nitric acid dissolves the tank it is stored in; add a fraction of a percent of hydrofluoric acid and it lays down a fluoride film that stops the attack instead. The oxidiser that was only ever a laboratory problem becomes something a missile can sit fuelled with for years.", "parts": [], "upgrades": ["RFUpgrade_AJ10-118D", "RFUpgrade_RD-213-8D13", "RFUpgrade_RD-217-8D515", "RFUpgrade_XLR81-BA-7", "RFUpgrade_YF-1A"], "grants": [], "experiments": []}, "pc_ntoHypergolics": {"title": "Dinitrogen-Tetroxide Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it.", "parts": [], "upgrades": ["RFUpgrade_R-40A-NTO", "RFUpgrade_RD-214-8D59", "RFUpgrade_RD-214U-8D59U", "RFUpgrade_RD-250-8D518", "RFUpgrade_RD-250PM", "RFUpgrade_RD-252-8D724", "RFUpgrade_RD-855", "RFUpgrade_RD-856", "RFUpgrade_S5.2", "RFUpgrade_YF-1B", "RFUpgrade_YF-3A"], "grants": [], "experiments": []}, "pc_htpSustainer": {"title": "Multi-Chamber Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}], "upgrades": [], "grants": [], "experiments": []}, "pc_larchPeroxide": {"title": "Refined Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off.", "parts": [], "upgrades": ["RFUpgrade_Gamma-301", "RFUpgrade_Larch-2", "RFUpgrade_Larch-8"], "grants": [], "experiments": []}, "pc_fluorine": {"title": "Liquid-Fluorine Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": ["RFUpgrade_XLR81-LF2-SPS"], "grants": [], "experiments": []}, "pc_scoutSolids": {"title": "Staged Solid Boost", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it.", "parts": [{"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}], "upgrades": ["RFUpgrade_Castor-1-SL"], "grants": [], "experiments": []}, "pc_strapOnSolids": {"title": "Strap-On Thrust Augmentation", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta.", "parts": [{"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Castor1_Inline", "mod": "ROEngines", "title": "Castor 1"}], "upgrades": [], "grants": [], "experiments": []}, "pc_retroKick": {"title": "Vacuum-Start Solid Impulse", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail.", "parts": [{"name": "ROC-GeminiRetroMECBDB", "mod": "ROCapsules", "title": "Gemini Retro Rocket (Star-13E)"}, {"name": "ROC-MercuryPosigradeBDB", "mod": "ROCapsules", "title": "Mercury Posigrade Kick Motor"}, {"name": "ROC-MercuryRetroBDB", "mod": "ROCapsules", "title": "Mercury Retro (TE-M-316)"}, {"name": "ROC-VoskhodRetroBooster", "mod": "ROCapsules", "title": "Voskhod Retro Package"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-Agena_Spinrocket", "mod": "ROEngines", "title": "Agena 1KS30HA Spin Rocket"}], "upgrades": ["RFUpgrade_Castor-1-Vac"], "grants": [], "experiments": []}, "fd_regenCooling": {"title": "Regenerative Chamber Cooling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware.", "parts": [], "upgrades": ["RFUpgrade_LR105-NA-3", "RFUpgrade_LR79-NA-9", "RFUpgrade_LR87-AJ-3", "RFUpgrade_LR89-NA-5", "RFUpgrade_LR89-NA-6", "RFUpgrade_LR91-AJ-3", "RFUpgrade_RD-108-8D77", "RFUpgrade_RZ.2-Mk3", "RFUpgrade_S-3D", "RFUpgrade_Viking-4", "RFUpgrade_Viking-5", "RFUpgrade_XLR11-RM-13-8K"], "grants": [], "experiments": []}, "fd_vacuumExpansion": {"title": "Extended Vacuum Expansion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}], "upgrades": ["RFUpgrade_LR101-NA-11", "RFUpgrade_LR105-NA-5", "RFUpgrade_LR105-NA-6", "RFUpgrade_LR89-NA-7.1", "RFUpgrade_LR89-NA-7.2", "RFUpgrade_RD-0106", "RFUpgrade_RD-0109", "RFUpgrade_RD-119-8D710", "RFUpgrade_RD-225-8D721", "RFUpgrade_RL10A-3-1", "RFUpgrade_X-405H", "RFUpgrade_X-405H-2", "RFUpgrade_XLR11-RM-13-10K", "RFUpgrade_XLR81-BA-11", "RFUpgrade_YF-22B", "RFUpgrade_YF-23B"], "grants": [], "experiments": []}, "fd_restartableUpper": {"title": "Vacuum Turbopump Restart", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come.", "parts": [{"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": ["RFUpgrade_AJ10-101A", "RFUpgrade_AJ10-118", "RFUpgrade_AJ10-42"], "grants": [], "experiments": []}, "fd_blowdownRestart": {"title": "Blowdown Vacuum Restart", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "No pump to restart, so nothing to spin back up: hold the tanks under gas pressure and the engine relights as often as the valves will cycle. It buys the manoeuvring stage cheaply, and pays for it in tank walls heavy enough to hold that pressure all the way up.", "parts": [{"name": "LargeOMS", "mod": "VenStockRevamp", "title": "Astris"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}], "upgrades": [], "grants": [], "experiments": []}, "fd_spacecraftPropulsion": {"title": "Restartable Deep-Throttling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-C1", "mod": "ROEngines", "title": "C-1"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": ["RFUpgrade_AJ10-142", "RFUpgrade_XLR81-BA-1"], "grants": [], "experiments": []}, "fd_storableSustainer": {"title": "Storable Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute.", "parts": [{"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF3_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-3 (no gimbal)"}, {"name": "YF3_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-3 with Boattail"}], "upgrades": ["RFUpgrade_U-2000", "RFUpgrade_XLR81-BA-3"], "grants": [], "experiments": []}, "fd_titanTandem": {"title": "Altitude-Start Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design.", "parts": [{"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}], "upgrades": [], "grants": [], "experiments": []}, "fd_longMarchStorable": {"title": "Storable Chamber Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice.", "parts": [{"name": "YF20_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20"}, {"name": "YF21_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-21"}, {"name": "YF22_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-22"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}, {"name": "YF25K_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20 with Boattail (no gimbal)"}], "upgrades": [], "grants": [], "experiments": []}, "fd_longMarchBoattail": {"title": "Integrated Booster Boattail", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Wrap the clustered first stage in its aerodynamic boattail and it stops being a bare cluster of chambers and becomes a complete, flight-configured stage — the CZ-2, CZ-2C and CZ-2D as they actually stacked. Same four storable chambers as the clustered first stage it branches from; procedural structure builds the same fairing for nothing, so this is off-the-shelf convenience, not a new engine.", "parts": [{"name": "YF21_with_shell_CZ-2", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2 Boattail"}, {"name": "YF21_with_shell_CZ-2C", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2C Boattail"}, {"name": "YF21_with_shell_CZ-2D", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2D Boattail"}], "upgrades": [], "grants": [], "experiments": []}, "int_dongFangHong1": {"title": "China's First Satellite", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A third nation reaches orbit on its own hardware — a small sphere broadcasting a patriotic melody instead of a beeping tone, riding the same clustered-storable first stage into space.", "parts": [{"name": "DFH-1", "mod": "KerwisChineseAerospacePack", "title": "DongFangHong-1 Satelite"}], "upgrades": [], "grants": [], "experiments": []}, "fd_sovietStorable": {"title": "Storable Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}], "upgrades": [], "grants": [], "experiments": []}, "fd_saturnKerolox": {"title": "High-Pressure Kerolox Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": true, "flavor": "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-H1C", "mod": "ROEngines", "title": "H-1C Series"}, {"name": "ROE-H1D", "mod": "ROEngines", "title": "H-1D Series"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RS27", "mod": "ROEngines", "title": "H-1/RS-27"}], "upgrades": [], "grants": [], "experiments": []}, "met_cooledTurbine": {"title": "Air-Cooled Turbine Blades", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust.", "parts": [], "upgrades": ["RFUpgrade_AL-7F-1", "RFUpgrade_Atar09K-50", "RFUpgrade_Atar101E-3", "RFUpgrade_Avon200R", "RFUpgrade_J57-P-20A", "RFUpgrade_J75-P-19", "RFUpgrade_J79-GE-5C", "RFUpgrade_J85-GE-5", "RFUpgrade_R-15BD-300", "RFUpgrade_RB162-4D", "RFUpgrade_RD-9AF2-300", "RFUpgrade_RD-9BF-811", "RFUpgrade_WP-6A", "RFUpgrade_WP-6A-III", "RFUpgrade_WP-7"], "grants": [], "experiments": []}, "av_turboprop": {"title": "Geared Turboprop", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Gear the axial turbine down to swing a large propeller instead of blasting a jet — trading top speed for the fuel economy and heavy-lift pull a jet cannot match down low. The Tu-95's monstrous contra-rotating NK-12 and the workhorse PT6: turbine power delivered through a propeller.", "parts": [{"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "SXTPWPT6", "mod": "SXT", "title": "PT6A Turboprop"}], "upgrades": [], "grants": [], "experiments": []}, "av_hydrogenJet": {"title": "Hydrogen-Fuelled Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Feed the jet liquid hydrogen instead of kerosene — a fuel so energetic it promises altitude and range no kerosene burner can reach, at the price of a vacuum-jacketed fuel system feeding a red-hot engine. The Model 304 of the CL-400 Suntan spyplane: a gamble that flew on the coldest fuel there is, then stayed on the bench.", "parts": [{"name": "RO-model304", "mod": "Squad", "title": "Model 304 Turbojet"}], "upgrades": [], "grants": [], "experiments": []}, "av_highTempTurbojet": {"title": "High-Temperature Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "With a cooled turbine able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage.", "parts": [{"name": "RO-R11F", "mod": "Squad", "title": "R-11 Turbojet"}, {"name": "aje_atar", "mod": "Squad", "title": "Atar 09 Turbojet"}, {"name": "miniJetEngine", "mod": "Squad", "title": "J85 Turbojet (No Afterburner)"}], "upgrades": ["RFUpgrade_J79-GE-2A"], "grants": [], "experiments": []}, "av_ramjetAdvanced": {"title": "Refined Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": [], "experiments": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": [], "experiments": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearLargeSpaceplane", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear (Spaceplane)"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}, {"name": "GearMediumSpaceplane", "mod": "Squad", "title": "LY-60 Large Landing Gear (Spaceplane)"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_heatSinkTPS": {"title": "Heat-Sink Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Survive the fireball by out-massing it. A machined beryllium block soaks the whole entry heat pulse into its own thermal mass and carries it back down still glowing — no chemistry, no char, just metal and patience. Crude and heavy, but the first thing that brings a payload home intact.", "parts": [{"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": [], "experiments": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour instead of hoarding it. Less than half the weight of a metal heat sink, and the one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}], "upgrades": ["MercuryHS"], "grants": [], "experiments": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Halve the shield and fly it at an angle. The same ablator laid up thinner and denser takes the same peak heat over the longer, shallower entry you fly when you steer a capsule to a landing site instead of dropping it wherever the ballistics put it. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS"], "grants": [], "experiments": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", endezvous entirely, betting everything on one vehicle instead of two.", "parts": [{"name": "aquarius_crew_s1p5_1", "mod": "Tantares", "title": "LK-700 Capsule"}], "upgrades": [], "grants": [], "experiments": []}, "fd_deepThrottleLanding": {"title": "Deep-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once — or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people.", "parts": [{"name": "RO-KTDU417", "mod": "Squad", "title": "KTDU-417"}, {"name": "ROC-LEMLMAEBDB", "mod": "ROCapsules", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROC-LEMLMDEBDB", "mod": "ROCapsules", "title": "Lunar Module Descent Engine (LMDE)"}, {"name": "ROE-LMAE", "mod": "ROEngines", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROE-LMDE", "mod": "ROEngines", "title": "Lunar Module Descent Engine (LMDE)"}], "upgrades": [], "grants": [], "experiments": [{"name": "Deep Surface Sample", "id": "surfaceSample3", "sci": 15, "group": "EVA Astronaut"}, {"name": "Lunar Surface Experiments Package", "id": "RP0ALSEP", "sci": 40, "group": "Lunar Surface Crew Science"}]}, "fd_lunarSurfaceMobility": {"title": "Powered Hop Transit", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Once you are down, get around — a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints.", "parts": [{"name": "ROC-LEMRover", "mod": "ROCapsules", "title": "Apollo Lunar Roving Vehicle (LRV)"}, {"name": "ROC-LFVBDB", "mod": "ROCapsules", "title": "Lunar Flying Vehicle"}], "upgrades": ["RFUpgrade_LMDE-J", "RFUpgrade_RS-18"], "grants": [], "experiments": [{"name": "Closed-Loop Lunar pander": {"title": "Extended-Burn Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Qualify the expander for the long haul: a chamber and turbine that survive nine minutes of firing instead of five, and a nozzle re-cut for the vacuum it will actually spend that time in. The upper stage stops being a kick motor and becomes something you can coast on, restart, and trust with the whole mission.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3A"], "grants": [], "experiments": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed — trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_AJ10-133-LH", "RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": [], "experiments": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster — a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-J2X", "mod": "ROEngines", "title": "J-2X"}, {"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2-230K", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_RL10A-3-3B"], "grants": [], "experiments": []}, "cryo_refinedExpander": {"title": "Refined Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Wring more specific impulse out of the closed expander cycle — hotter, tighter plumbing on the efficient small upper stage.", "parts": [], "upgrades": ["RFUpgrade_LE-5A", "RFUpgrade_RL10A-3-3", "RFUpgrade_RL10A-4-1N", "RFUpgrade_RL10A-4N", "RFUpgrade_RL10B-2"], "grants": [], "experiments": []}, "pc_throttledClosedCycle": {"title": "Derated Closed-Cycle Sustainer", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Take the booster's closed-cycle engine and deliberately run it below what it can do. Chamber pressure comes down, the turbine stops living on the edge, and the engine that was a reliability problem at full throttle becomes one you can stack thirty of and still expect to reach orbit.", "parts": [], "upgrades": ["RFUpgrade_NK-21"], "grants": [], "experiments": []}, "pc_refinedMixtureClosedCycle": {"title": "Trimmed Closed-Cycle Mixture Ratio", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Re-trim the oxidiser-to-fuel ratio and the preburner split until the cycle gives up another twelve seconds without touching the hardware — the cheapest specific impulse in rocketry, and the hardest to find, because everything upstream of the injector has to be measured before it can be moved.", "parts": [], "upgrades": ["RFUpgrade_NK-39"], "grants": [], "experiments": []}, "pc_restartableClosedCycle": {"title": "Restartable Oxidiser-Rich Closed Cycle", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Relight a staged-combustion engine in vacuum, which means restarting an oxidiser-rich preburner that will happily burn its own turbine if the start sequence slips. Two ignitions instead of one, and the upper stage can finally choose when to fall.", "parts": [], "upgrades": ["RFUpgrade_NK-31"], "grants": [], "experiments": []}, "pc_closedCycleUpper": {"title": "Closed-Cycle Upper-Stage Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Shrink the oxidiser-rich preburner until it fits an upper stage, where the gain is not thrust but the specific impulse you carry all the way to escape. A small closed-cycle engine is harder per kilonewton than a big one — the turbine still has to survive its own exhaust, and now there is no mass budget to armour it with.", "parts": [], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M"], "grants": [], "experiments": []}, "pc_rg1": {"title": "High-Density Kerosene Cut", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Distil the kerosene to a narrower, denser, more thermally stable cut than anything an aircraft would burn — more mass of fuel in the same tank, and it stops coking the regenerative passages when the chamber runs hot. The fuel stops being a commodity and becomes part of the engine's design.", "parts": [], "upgrades": ["RFUpgrade_NK-9-1972", "RFUpgrade_RD-58"], "grants": [], "experiments": []}, "pc_rg1Uprating": {"title": "Oxidiser-Rich Preburner Uprating", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Drive the preburner harder and re-trim the mixture until the closed cycle gives up another seven seconds — the last easy specific impulse in a design that is already recycling everything it burns.", "parts": [], "upgrades": ["RFUpgrade_RD-58M"], "grants": [], "experiments": []}, "pc_extendedNozzleUpper": {"title": "Extended-Nozzle Upper Stage", "discipline": "Propellant Chemistry", "color": quad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"], "experiments": []}, "shd_interplanetaryAvionics": {"title": "Deep-Space Bus — Interplanetary", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Harden the long-duration cruise stack itself, not just its chassis — shielded electronics for a coast that spends months, not hours, deep in interplanetary radiation.", "parts": [], "upgrades": [], "grants": ["Deep-Space-interplanetaryProbes"], "experiments": []}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": [], "experiments": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good.", "parts": [{"name": "RO-SaturnI-IU", "mod": "ReStockPlus", "title": "Saturn I Instrument Unit [3.9 m]"}], "upgrades": [], "grants": ["Science-Core-improvedAvionics"], "experiments": []}, "shd_digitalGuidanceComputer": {"title": "Deep-Space Bus — Digital", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The first digital guidance computer, rebuilt around radiation-hardened logic — a machine that keeps computing fresh corrections after a dose that would upset an unshielded chip.", "parts": [], "upgrades": [], "grants": ["Deep-Space-improvedAvionics"], "experiments": []}, "comp_realTimeFlightComputer": {"title": "Priority-Interrupt Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one.", "parts": [{"name": "restock-drone-core-375-1", "mod": "ReStockPlus", "title": "Saturn IB/V Instrument Unit [6.6 m]"}], "upgrades": [], "grants": ["Science-Core-matureAvionics"], "experiments": []}, "shd_realTimeFlightComputer": {"title": "Deep-Space Bus — Real-Time", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The priority-interrupt flight computer, shielded to keep juggling guidance, navigation and engine control after a dose that would otherwise upset its scheduler.", "parts": [], "upgrades": [], "grants": ["Deep-Space-matureAvionics"], "experiments": []}, "comp_networkedAvionics": {"title": "Multi-Vehicle Avionics Integration", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together.", "parts": [], "upgrades": ["HDD-Upgrade-1969", "RFTech-ComSat-III", "RFTech-NavSat-III"], "grants": ["Science-Core-largeScaleAvionics"], "experiments": []}, "shd_networkedAvionics": {"title": "Deep-Space Bus — Networked", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Multi-vehicle avionics integration, hardened for a station or relay constellation that spends its whole service life outside Earth's protective magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-largeScaleAvionics"], "experiments": []}, "comp_multiplyRedundantFlightComputer": {"title": "Multiply-Redundant General-Purpose Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Four identical general-purpose computers vote on every result, and a fifth arbitrates a tie — fly-by-wire trusted with a crew's life because no single failure, or even a single disagreement, can bring it down. The Shuttle's own avionics generation.", "parts": [], "upgrades": ["HDD-Upgrade-1975"], "grants": ["Science-Core-advancedAvionics"], "experiments": []}, "shd_multiplyRedundantFlightComputer": {"title": "Deep-Space Bus — Redundant", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Quadruple-redundant fly-by-wire, shielded to keep out-voting a radiation-flipped bit the same way it out-votes any other single failure — trusted with a crew on a mission that never comes home to Earth's shelter.", "parts": [], "upgrades": [], "grants": ["Deep-Space-advancedAvionics"], "experiments": []}, "comp_distributedAvionicsBus": {"title": "Distributed Avionics Data Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Stop wiring every sensor and actuator straight to the computer and put them all on one shared data bus instead — a single twisted pair carrying every subsystem's traffic, addressed and time-sliced instead of home-run cabled. The wiring-harness weight a modular station can no longer afford to carry.", "parts": [], "upgrades": [], "grants": ["Science-Core-nextGenAvionics"], "experiments": []}, "shd_distributedAvionicsBus": {"title": "Deep-Space Bus — Distributed", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "The shared data bus, radiation-hardened end to end — every sensor and actuator on the line survives the same dose the flight computer does, for an outer-system mission with no wiring-harness weight to spare.", "parts": [], "upgrades": [], "grants": ["Deep-Space-nextGenAvionics"], "experiments": []}, "comp_digitalEngineControl": {"title": "Full-Authority Digital Engine Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Put a computer between the throttle and the engine and let it, not a hydromechanical governor, decide what the valves do. It trims mixture ratio in closed loop against measured chamber pressure, holds the engine at a margin a mechanical linkage could never be trusted near, and shuts it down cleanly on a sensor trend instead of a failure. The same step that turned a carburettor into an engine management unit, applied to something with a turbopump.", "parts": [], "upgrades": ["RFUpgrade_HG-3A-SL", "RFUpgrade_RS-68B"], "grants": [], "experiments": []}, "comp_softwareDefinedFlightControl": {"title": "Software-Defined Flight Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Move the control laws out of ha grade_J79-IAI-J1E", "RFUpgrade_R-13F2-300", "RFUpgrade_R-79V-300"], "grants": [], "experiments": []}, "th_extendedMLIWrapping": {"title": "Extended Multi-Layer Insulation", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Wrap the bus in another few layers of aluminised film and the heat leak keeps dropping further still — the same passive blanket, thickened for a mission measured in months rather than weeks.", "parts": [], "upgrades": ["MLI.Upgrade2", "MLI.Upgrade3"], "grants": [], "experiments": []}, "th_pumpedLoopRadiators": {"title": "Pumped-Loop Radiator Panels", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Stop relying on the hull's own skin to shed heat and circulate coolant out to dedicated panels instead — a heat-rejection system sized independently of the spacecraft it serves, because a crewed orbiter or a station generates more waste heat than any body-mounted radiator could ever carry alone.", "parts": [{"name": "foldingRadLarge", "mod": "Squad", "title": "EATCS Retractable Radiator (Large)"}, {"name": "foldingRadMed", "mod": "Squad", "title": "EATCS Retractable Radiator (Medium)"}, {"name": "foldingRadSmall", "mod": "Squad", "title": "EATCS Retractable Radiator (Small)"}, {"name": "radPanelEdge", "mod": "Squad", "title": "EATCS Radiator Panel (Fin)"}, {"name": "radPanelLg", "mod": "Squad", "title": "EATCS Radiator Panel (Long)"}, {"name": "radPanelSm", "mod": "Squad", "title": "EATCS Radiator Panel (Short)"}], "upgrades": [], "grants": [], "experiments": []}, "met_aluminiumCopperBalloonTank": {"title": "Aluminium-Copper Balloon Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Swap the pressure-stabilised tank's stainless skin for an aluminium-copper alloy and the same trick — a wall so thin it needs its own pressure to stand — sheds a third of its weight again. The material the Shuttle's own External Tank flies on.", "parts": [], "upgrades": ["RFTech-SM-IV", "RFTech-Tank-Balloon-SteelAlCu", "RFTech-Tank-Iso-AlCu"], "grants": [], "experiments": []}, "met_aluminiumLithiumTankage": {"title": "Aluminium-Lithium Alloy Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Alloy the tank wall with lithium and it comes out several percent lighter and stiffer at the same strength — the dry-mass saving that goes straight into payload. The alloy the Shuttle's Super-Lightweight Tank and a generation of launchers after it are built from.", "parts": [], "upgrades": ["RFTech-Tank-Balloon-SteelAlLi", "RFTech-Tank-Iso-AlLi", "RFTech-Tank-Sep-AlLi", "RFTech-Tank-Wet-Wing2"], "grants": [], "experiments": []}, "met_stirWeldedTankage": {"title": "Friction-Stir-Welded Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Join the tank barrel with a spinning shoulder that stirs the metal together below its melting point instead of melting it — a weld with none of the porosity or heat-warp of an arc, strong enough to trust an integral tank wall to. The process behind the friction-stir-welded barrels of the modern launch fleet.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Comp", "RFTech-Tank-Sep-Stir"], "grants": [], "experiments": []}, "met_stainlessSteelTankage": {"title": "Stir-Welded Stainless-Steel Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Go back to steel — but a cryo-tough stainless that keeps its strength through re-entry heat and down to liquid-oxygen cold, cheap enough to build a reusable tank-and-hull as one piece. The counter-intuitive material choice behind a fully-reusable heavy launcher.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Magic", "RFTech-Tank-Sep-Starship"], "grants": [], "experiments": []}, "cmp_compositeNozzleExtension": {"title": "Carbon-Carbon Nozzle Extension", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Weave carbon fibre in a carbon matrix and it gets stronger as it gets hotter, right up past the point where any alloy has gone soft. Bolt a skirt of it below the metal chamber and the nozzle grows without the mass a cooled metal extension would have cost — expansion ratio for free, paid for in a two-year layup and cure.", "parts": [], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RS-68K"], "grants": [], "experiments": []}, "cmp_advancedCompositeFairings": {"title": "High-Temperature Composite Fairings", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Cure the fairing from higher-temperature resins and out-of-autoclave layups — lighter shells that also take the aerothermal load of a faster ascent, and come off a production line instead of a hand-layup bench. The payload shroud grown into a manufactured part.", "parts": [], "upgrades": ["PFTech-Fairing-V", "PFTech-Fairing-VI"], "grants": [], "experiments": []}, "th_advancedMLI": {"title": "Perforated Double-Aluminised Insulation", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Refine the multi-layer blanket — more and thinner double-aluminised layers, perforated to vent the trapped gas so they pack tighter without conducting — and the parasitic heat leak into a cryogenic tank or a cold instrument drops again. The insulation that lets propellant and coolant last a long mission.", "parts": [], "upgrades": ["MLI.Upgrade4", "MLI.Upgrade5", "RFTech-MLI-UpgradeBalloon"], "grants": [], "experiments": []}, "gnc_longLifeRCS": {"title": "Long-Life Reaction-Control Thrusters", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Build the reaction-control thruster to fire tens of thousands of times without eroding its throat or coking its injector — the durability a space station holds attitude with for decades, and a reusable stage relights on descent after descent. The RCS that stops being a consumable.", "parts": [], "upgrades": ["RFTech-rcs-tltech7"], "grants": [], "experiments": []}, "elec_secondaryBatteries": {"title": "Sealed Rechargeable Battery Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Seal a rechargeable cell so it cycles through orbital night after orbital night without venting or dying — nickel-cadmium, then nickel-hydrogen — and a spacecraft can finally store the power its arrays make in daylight. The other half of every solar power system.", "parts": [], "upgrades": ["RFTech-Battery-III"], "grants": [], "experiments": []}, "elec_thinSeparatorCells": {"title": "Thin-Separator Cell Stacks", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Thin the separators and press the plates closer until the case is mostly active material and hardly any structure — the same chemistry, a third less mass again, and a discharge rate that will run a lander's pumps flat out. Where the battery stops being a passenger.", "parts": [], "upgrades": ["RFTech-Battery-IV"], "grants": [], "experiments": []}, "cmp_compositeFairingShells": {"title": "Composite Fairing Shells", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Carry the resin-and-fibre layup learned for a reentry heatshield over to a payload shroud instead — a fairing that sheds the last of the aluminium stringer's dead weight, built from the same composite technique that already keeps a capsule cool on the way down.", "parts": [{"name": "ROC-CSTNoseCone", "mod": "ROCapsules", "title": "CST-100 Nose Cone"}], "upgrades": ["PFTech-Fairing-III"], "grants": [], "experiments": []}, "met_isogridShells":
