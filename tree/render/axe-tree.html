<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

into directed thrust. With that, plus fins to fly straight, a crude pressure-fed or solid motor lofts an instrument package above the Karman line. The difference between a firework and a rocket.", "parts": [{"name": "ROE-Aerobee", "mod": "ROEngines", "title": "Aerobee"}, {"name": "ROE-ORM65", "mod": "ROEngines", "title": "ORM-65"}, {"name": "ROE-VeroniqueAK", "mod": "ROEngines", "title": "Véronique"}, {"name": "ROMeteoSustainer", "mod": "Squad", "title": "U-1250"}, {"name": "TinyTim", "mod": "RealismOverhaul", "title": "Tiny Tim Booster"}], "upgrades": []}, "fd_turbopumpLiquid": {"title": "Turbopump-Fed Liquid Propulsion (A-4)", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A turbine-driven pump feeds propellant by the tonne, unshackling chamber pressure from tank pressure. The A-4/V-2's Model 39 puts out 400 kN — five times any sounding motor and regeneratively cooled. The single most advanced starting rocket, and the leap from sounding rocket to launch vehicle.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}], "upgrades": []}, "pc_solidGrain": {"title": "Cast Composite Solid Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser and powdered aluminium bound in a rubbery binder, cast and cured into a large structural grain. Cheap, dense, storable — you light it once and it does not stop. The strap-on that boosts everything else.", "parts": [{"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Star13", "mod": "ROEngines", "title": "STAR 13"}], "upgrades": []}, "pc_kerosene": {"title": "Hydrotreated Narrow-Cut Kerosene (RP-1)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every high-thrust kerolox engine burns. The cheap, forgiving road to orbit.", "parts": [{"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}], "upgrades": []}, "fd_gasGenerator": {"title": "Gas-Generator (Open) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Burn a little propellant in a side chamber to spin the turbopump, then dump the turbine exhaust overboard. Simple, proven, slightly wasteful — the pump-fed workhorse cycle that puts real mass in orbit. The R-7, Atlas and Thor engines that reach it.", "parts": [{"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}], "upgrades": []}, "cryo_earlyHydrolox": {"title": "Early Hydrogen/Oxygen Upper Stages", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "No doctrine says you must burn kerosene first. Commit early to hydrogen — vacuum-jacketed tanks, insulation, boil-off you fight every hour on the pad — and you buy the highest specific impulse chemistry there is, years ahead of history. It simply costs more program to get there.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": []}, "str_stageSeparation": {"title": "Staging \u0026 Ullage Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Explosive bolts cut a spent stage away on a millisecond's command; small motors settle the propellant so the next stage lights clean. Multi-stage flight — the only way to the orbital velocities chemistry can't reach in one go — begins here.", "parts": [{"name": "ROE-BabySergeantX3Dec", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster Decoupler"}, {"name": "ROE-CastorDecoupler", "mod": "ROEngines", "title": "Castor I \u0026 II Radial Decoupler"}], "upgrades": []}, "gnc_rateGyros": {"title": "Rate-Gyro Attitude Guidance", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Spinning-mass gyroscopes sense the vehicle's turn rates and drive the fins and gimbals to hold a programmed pitch. The first machine that flies itself uphill instead of tumbling.", "parts": [], "upgrades": []}, "tel_pcmTelemetry": {"title": "PCM/FM Telemetry Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it a failure tells you nothing about why — and an orbit you cannot hear is an orbit you cannot prove.", "parts": [], "upgrades": []}, "mic_vacuumTubes": {"title": "Vacuum-Tube Sequencers \u0026 Sensors", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Hot-cathode tubes and simple transducers turn a satellite's state into numbers and its timeline into relay clicks — the minimum brain a spacecraft needs to be more than ballast.", "parts": [], "upgrades": []}, "met_weldedSteel": {"title": "Welded Steel Pressure Vessels", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Roll, weld and proof-test mild-steel cylinders and spheres that hold pressure without bursting — the first flight tank, and the sealed shell of the first satellite.", "parts": [], "upgrades": []}, "elec_silverZinc": {"title": "Silver-Zinc Primary Batteries", "discipline": "Electrical Power", "color": "#ffd166", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "High energy density for a single mission's hours — the battery that powered the first satellites and the shortest crewed flights.", "parts": [], "upgrades": []}, "elec_siliconPV": {"title": "Silicon Photovoltaics", "discipline": "Electrical Power", "color": "#ffd166", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Doped silicon turns sunlight into watts indefinitely — the breakthrough that freed satellites from their batteries. Vanguard 1 flew the first cells.", "parts": [{"name": "RO-rangerSolarPanel", "mod": "RealismOverhaul", "title": "Ranger Solar Panel"}, {"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}], "upgrades": []}, "elec_bodyMountedArrays": {"title": "Body-Mounted \u0026 Deployable Arrays", "discipline": "Electrical Power", "color": "#ffd166", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Tile a spacecraft's skin or fold out fixed panels for hundreds of watts — the workhorse power source of the satellite age.", "parts": [{"name": "ROS-BlanketSolarPanel", "mod": "ROSolar", "title": "Blanket Solar Panel"}, {"name": "ROS-FoldingSolarPanel", "mod": "ROSolar", "title": "Folding Solar Panel"}, {"name": "ROS-HingedSolarPanel", "mod": "ROSolar", "title": "Hinged Solar Panel"}], "upgrades": []}, "mic_transistor": {"title": "Discrete Transistors", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Solid-state switching shrinks avionics from a rack to a box and stops burning out filaments.", "parts": [], "upgrades": []}, "mic_integratedCircuit": {"title": "Integrated Circuits", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Many transistors on one chip — the leap that made a real flight computer light enough to fly.", "parts": [], "upgrades": []}, "mic_radHardening": {"title": "Radiation-Hardened Electronics", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Shield and design against single-event upsets so electronics survive the belts and deep space without latching up — the difference between a probe that reaches Jupiter and one that reboots there.", "parts": [], "upgrades": []}, "tel_helicalDirectional": {"title": "Helical Directional Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Axial-mode helices give circularly-polarized gain that tolerates a tumbling spacecraft — range and data rate, at the cost of having to point.", "parts": [], "upgrades": []}, "tel_cassegrainHGA": {"title": "Cassegrain Parabolic High-Gain Reflector", "discipline": "Telecommunications", "color": "#4361ee", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A subreflector folds the feed back through the dish vertex, shortening the assembly and closing the link from lunar and planetary distance.", "parts": [], "upgrades": []}, "tel_dsnRanging": {"title": "Coherent Two-Way Doppler \u0026 Ranging", "discipline": "Telecommunications", "color": "#4361ee", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Phase-coherent ground dishes pull a few bits per second out of interplanetary noise and, from the round-trip Doppler, fix the spacecraft's state vector to meters.", "parts": [], "upgrades": []}, "tel_xBandDownlink": {"title": "X-Band Deep-Space Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Move the downlink up to X-band: a shorter wavelength focuses into a tighter beam from the same dish, multiplying data rate across interplanetary distance. Voyager's science return rode this jump from S-band — the link that makes the outer planets legible.", "parts": [], "upgrades": []}, "gnc_reactionControl": {"title": "Reaction Control \u0026 Attitude Hold", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Small thrusters in opposed pairs to point and hold a vehicle in vacuum — the first three-axis control in space.", "parts": [], "upgrades": []}, "gnc_inertialNav": {"title": "Gimballed Inertial Navigation", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A gyro-stabilised platform integrates acceleration into position — knowing where you are with no outside reference.", "parts": [], "upgrades": []}, "gnc_digitalGuidance": {"title": "Digital Closed-Loop Guidance", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Compute the trajectory in real time and steer to it — guidance that adapts to dispersions instead of following a fixed program. Needs inertial navigation and an integrated-circuit computer at once.", "parts": [], "upgrades": []}, "gnc_opticalNav": {"title": "Optical \u0026 Star-Field Navigation", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Fix attitude and position against catalogued stars and landmarks — autonomy independent of the radio link, and the only way to aim a camera precisely a light-hour from home.", "parts": [], "upgrades": []}, "opt_filmCameras": {"title": "Film-Return Cameras", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Expose film in flight and scan-and-transmit it — the first detailed eyes on other worlds, from Luna 3's look at the far side of the Moon.", "parts": [], "upgrades": []}, "opt_tvImaging": {"title": "Vidicon TV Imaging", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Scan an image off a photoconductive tube and send it down as video — live pictures from a probe, no film to recover.", "parts": [], "upgrades": []}, "opt_precisionOptics": {"title": "Precision Optical Fabrication", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Grind, polish and figure mirrors and lenses to fractions of a wavelength — the craft beneath every telescope, spectrometer and star tracker.", "parts": [], "upgrades": []}, "opt_spectrometry": {"title": "Imaging Spectrometers", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Split light into its spectrum at every pixel to read composition from orbit — chemistry at a distance.", "parts": [], "upgrades": []}, "th_passiveRadiators": {"title": "Passive Radiative Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Reject waste heat to space with coatings, louvers and surface geometry alone — the baseline thermal balance of every spacecraft.", "parts": [], "upgrades": []}, "nuc_rtg": {"title": "Radioisotope Thermoelectric Generators", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A plutonium pellet's decay heat across a thermocouple gives steady watts for decades, anywhere, sunlight or not — the power of the outer planets, where the sun is a bright star.", "parts": [{"name": "RO-SNAP-19-RTG", "mod": "VenStockRevamp", "title": "SNAP-19 Series RTG"}, {"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}, {"name": "RO-SNAP-9-RTG", "mod": "VenStockRevamp", "title": "SNAP-9 Series RTG"}], "upgrades": []}, "nuc_rtgAdvanced": {"title": "GPHS Multi-Mission RTGs", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Modular general-purpose heat-source blocks make a rugged, standardised RTG — the quiet, reliable heartbeat of flagship deep-space probes from Voyager to Cassini.", "parts": [{"name": "RO-MMRTG", "mod": "Squad", "title": "Multi-Mission RTG"}], "upgrades": []}, "str_deployableBooms": {"title": "Stored-Strain Deployable Booms", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Stow a long boom for launch and extend it on orbit for magnetometers, arrays and antennas held clear of the bus — the spindly limbs of every science probe.", "parts": [], "upgrades": []}, "int_firstOrbit": {"title": "First Orbital Capability", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Staging, guidance, telemetry and a probe brain converge — and whatever engine you chose to build now has somewhere to go. You can place your own satellite in orbit. The first artificial moon. (The iconic historical satellites are blueprints in the probe subtree — build your own, or chase theirs.)", "parts": [], "upgrades": []}, "hire_JPL": {"title": "Charter a Deep-Space Probe Lab (JPL)", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 0, "cost": 0, "anyToUnlock": false, "flavor": "Stand up a jet-propulsion laboratory — a home for the integrated robotic spacecraft that no single discipline builds. Vanguard, Mariner, Voyager: their blueprints are chartered here, but each flies only once you have independently mastered the scattered technologies it needs. (US-probe pack only.)", "parts": [{"name": "eos_aqua", "mod": "RN_US_Probes", "title": "Aqua"}, {"name": "eos_aura", "mod": "RN_US_Probes", "title": "Aura"}, {"name": "eos_tdrs", "mod": "RN_US_Probes", "title": "Tracking and Data Relay Satellite H-N"}, {"name": "eos_terra", "mod": "RN_US_Probes", "title": "Terra"}, {"name": "explorer_6", "mod": "RN_US_Probes", "title": "Explorer 6"}, {"name": "galileo_aprobe", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe"}, {"name": "galileo_hs_bot", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Bottom"}, {"name": op Boosters"}, {"name": "pioneer_0_1_2", "mod": "RN_US_Probes", "title": "Pioneer 0/1/2"}, {"name": "pioneer_10_11", "mod": "RN_US_Probes", "title": "Pioneer 10/11 Probe"}, {"name": "pioneer_3_4", "mod": "RN_US_Probes", "title": "Pioneer 3/4"}, {"name": "pioneer_5", "mod": "RN_US_Probes", "title": "Pioneer 5"}, {"name": "pioneer_6_7_8_9", "mod": "RN_US_Probes", "title": "Pioneer 6/7/8/9"}, {"name": "rn_cassini", "mod": "RN_US_Probes", "title": "Cassini Spacecraft"}, {"name": "rn_galileo_scanner", "mod": "RN_US_Probes", "title": "Galileo Orbital Scanner"}, {"name": "rn_heliosa_b", "mod": "RN_US_Probes", "title": "Helios-1/2"}, {"name": "rn_huygen_hs_bottom", "mod": "RN_US_Probes", "title": "Huygens Heatshield Bottom"}, {"name": "rn_huygen_hs_chute", "mod": "RN_US_Probes", "title": "Huygens Heatshield Parachute"}, {"name": "rn_huygen_hs_top", "mod": "RN_US_Probes", "title": "Huygens Heatshield Top"}, {"name": "rn_huygens", "mod": "RN_US_Probes", "title": "Huygens Lander"}, {"name": "rn_huygens_chute", "mod": "RN_US_Probes", "title": "Huygens Lander Parachute"}, {"name": "rn_juno_spacecraft", "mod": "RN_US_Probes", "title": "Juno"}, {"name": "rn_ladee", "mod": "RN_US_Probes", "title": "Lunar Atmosphere Dust and Environment Explorer"}, {"name": "rn_ladee_scanner", "mod": "RN_US_Probes", "title": "Ladee/LRO Orbital Scanner"}, {"name": "rn_lcross_mb", "mod": "RN_US_Probes", "title": "LCROSS"}, {"name": "rn_lro", "mod": "RN_US_Probes", "title": "Lunar Reconnaissance Orbiter"}, {"name": "rn_magellan_scanner", "mod": "RN_US_Probes", "title": "Magellan Orbital Scanner"}, {"name": "rn_mariner10", "mod": "RN_US_Probes", "title": "Mariner 10"}, {"name": "rn_mariner1_2", "mod": "RN_US_Probes", "title": "Mariner 1/2"}, {"name": "rn_mariner3-4", "mod": "RN_US_Probes", "title": "Mariner 3/4"}, {"name": "rn_mariner5", "mod": "RN_US_Probes", "title": "Mariner 5"}, {"name": "rn_mariner6-7", "mod": "RN_US_Probes", "title": "Mariner 6/7"}, {"name": "rn_mariner8-9", "mod": "RN_US_Probes", const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
