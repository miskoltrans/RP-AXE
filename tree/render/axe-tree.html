iring - 2"}, {"name": "ROC-OrionCover3", "mod": "ROCapsules", "title": "Orion ESM Fairing - 3"}, {"name": "ROC-OrionLAS", "mod": "ROCapsules", "title": "Orion LAS and BPC"}, {"name": "ROE-SuperDraco", "mod": "ROEngines", "title": "SuperDraco"}, {"name": "ROE-SuperDracoDouble", "mod": "ROEngines", "title": "Twin SuperDraco"}], "upgrades": ["RFUpgrade_R-42DM", "RFUpgrade_R-42DM-NTO"], "grants": [], "experiments": []}, "ep_electricPumpFeed": {"title": "Electric-Pump-Fed Kerolox", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Spin the propellant pumps with a battery and a brushless motor instead of a gas generator or a preburner turbine — no exhaust-driven turbine at all. A little less thrust-to-weight bought back with radical simplicity and a bill of materials any workshop can assemble.", "parts": [{"name": "ROE-Rutherford", "mod": "ROEngines", "title": "Rutherford"}, {"name": "ROE-RutherfordVac", "mod": "ROEngines", "title": "Rutherford Vacuum"}], "upgrades": [], "grants": [], "experiments": []}, "ep_nextGenGriddedIon": {"title": "Next-Generation Gridded Ion Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "NSTAR's direct successor — the same electrostatic-grid acceleration, refined for higher throughput and, in its most extreme sibling, a second acceleration stage for even higher exhaust velocity.", "parts": [{"name": "RO-ID500", "mod": "NearFuturePropulsion", "title": "ID-500 Gridded Ion Thruster"}, {"name": "ionXenon-0625", "mod": "NearFuturePropulsion", "title": "NEXT Gridded Ion Thruster"}, {"name": "ionXenon-0625-2", "mod": "NearFuturePropulsion", "title": "HiPEP Gridded Ion Thruster"}, {"name": "ionXenon-0625-3", "mod": "NearFuturePropulsion", "title": "DS4G Gridded Ion Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_nasaHighPowerHall": {"title": "NASA High-Power Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Purpose-built for deep-space station-keeping on a crewed outpost, not just trimming a satellite's orbit — the next mark past the 457M, and in its nested-channel sibling, the highest-power Hall thruster ever built.", "parts": [{"name": "ionArgon-0625", "mod": "NearFuturePropulsion", "title": "HERMeS Hall Effect Thruster"}, {"name": "ionArgon-0625-2", "mod": "NearFuturePropulsion", "title": "P5 5kW Hall Effect Thruster"}, {"name": "ionArgon-0625-3", "mod": "NearFuturePropulsion", "title": "X3 Hall-Effect Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_magnetoplasmadynamic": {"title": "Magnetoplasmadynamic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Skip both the Hall channel and the ion grid — drive a plasma arc straight through an electromagnetic pinch and let the field itself do the accelerating. High power density, real hardware, and a genuinely different mechanism from anything else this tree calls electric propulsion.", "parts": [{"name": "mpdt-125", "mod": "NearFuturePropulsion", "title": "SX3 MPD Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_variableSpecificImpulsePlasma": {"title": "Variable-Specific-Impulse Plasma Rocket", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "RF-heat a plasma instead of arcing through it, then steer it out through a magnetic nozzle — and unlike every other electric thruster in this tree, trade thrust for Isp continuously, in flight, instead of picking one number at build time.", "parts": [{"name": "vasimr-0625", "mod": "NearFuturePropulsion", "title": "VX-200SS VASIMR"}, {"name": "vasimr-125", "mod": "NearFuturePropulsion", "title": "VF-200 VASIMR"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_bimodalNTR": {"title": "Bimodal Nuclear Thermal + Power", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "The same reactor that heats propellant for thrust keeps running between burns as a power source — real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry.", "parts": [{"name": "ROE-BNTR", "mod": "ROEngines", "title": "Bimodal NTR"}], "upgrades": ["RFTech-nuclear-tltech6", "RFUpgrade_LPNTR-3600HP"], "grants": [], "experiments": []}, "nuc_fissionFragmentRocket": {"title": "Fission-Fragment Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Let the fission fragments themselves be the exhaust — no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach.", "parts": [{"name": "RO-fftdustyplasmaffre", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Fission Fragment Rocket Engine"}, {"name": "fft-ffre-plasma-1", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Afterburning Fission Fragment Rocket Engine"}], "upgrades": ["RFTech-nuclear-tltech7"], "grants": [], "experiments": []}, "nuc_magneticFusionPulsePropulsion": {"title": "Magnetically-Confined Fusion Pulse Drive", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate — Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion.", "parts": [{"name": "RO-fft20mMMO", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Drive"}, {"name": "fft-fission-zpinch-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Drive"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_nuclearSaltWaterRocket": {"title": "Nuclear Salt Water Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Dissolve fissile salts in water and let the mixture go critical continuously as it streams through the chamber — the reactor doesn't heat the propellant, the reactor IS the propellant. The wildest, most engineering-fiction concept in the curated set.", "parts": [{"name": "fft-nswr-2", "mod": "FarFutureTechnologies", "title": "20 m Nuclear Salt Water Rocket"}], "upgrades": [], "grants": [], "experiments": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  // experiments are Kerbalism Configure setups, not parts — invisible in R&D, so name them here
  const xs=d.experiments||[];
  if(xs.length){h+=`<div class="sec">Experiments (${xs.length})</div><ul class="parts">`;
    for(const x of xs){const m=[x.sci?x.sci+' sci':'',x.group?'Configure: '+x.group:''].filter(Boolean).join(' · ');
      h+=`<li><div class="pt">⚗ ${esc(x.name)}</div><div class="pn">${esc(x.id||'')}${m?' · '+esc(m):''}</div></li>`;}
    h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
