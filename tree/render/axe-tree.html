<!DOCTYPE html>

<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

<script>
const DATA={"start": {"title": "Start", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 0, "cost": 0, "anyToUnlock": false, "flavor": "1950. Kerbalkind is united; the universe is blind without us.", "parts": [], "upgrades": []}, "soundingRocketry": {"title": "Spin-Stabilized Sounding Rockets", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Fin-and-spin powder rockets loft the first instrument packages above the Karman line. (Rocket start; the X-plane root lives in Aerodynamics, off-slice.)", "parts": [{"name": "PioneerVernier", "mod": "ROEngines", "title": "Pioneer Adjustment Motor"}], "upgrades": []}, "pc_ethanolLox": {"title": "Ethanol/LOX Film-Cooled Combustion", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry.", "parts": [], "upgrades": []}, "pc_keroseneHydrotreating": {"title": "Hydrotreated Narrow-Cut Kerosene (RP-1)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. Homes the simplest early kerolox; the harder kerolox engines mature in Fluid Dynamics and Metallurgy.", "parts": [{"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}], "upgrades": []}, "pc_apcpGrain": {"title": "Aluminized AP/HTPB Composite Grain", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidizer and aluminum powder bound in hydroxyl-terminated polybutadiene, cast and cured into a structural grain. The propellant chemistry, not the casing, is the headline here.", "parts": [{"name": "MassiveBooster", "mod": "Squad", "title": "RSRMV"}], "upgrades": []}, "pc_hypergolicChemistry": {"title": "Self-Igniting Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Fuels that detonate on contact with their oxidizer — no igniter, indefinite restarts, storable for years. The entire difficulty is chemistry and corrosion: handling hydrazines and nitric oxidizers that attack everything. The chemistry of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-AJ10-137", "mod": "ROEngines", "title": "AJ10-137 (Service Propulsion System)"}], "upgrades": []}, "pc_cryoLiquefaction": {"title": "Claude-Cycle H2/O2 Liquefaction", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Industrial Claude-cycle plants liquefy hydrogen and oxygen by the ton. You can now MAKE deep cryogens; STORING and flying them is Cryogenics' problem next door (a convergence).", "parts": [], "upgrades": []}, "pc_storableOxidizers": {"title": "Passivated MON/NTO Storable Oxidizers", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Mixed oxides of nitrogen and passivated dinitrogen tetroxide: denser, higher-performing, marginally less murderous storables for mature service propulsion.", "parts": [{"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": []}, "met_earlyAlloys": {"title": "Aluminum Isogrid \u0026 Maraging-Steel Cases", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Chemically-milled isogrid aluminum for light pressure vessels; ultra-high-strength maraging steel for solid-motor cases and pump housings. The structural backbone everything else bolts to.", "parts": [], "upgrades": []}, "met_oxRichSuperalloys": {"title": "Oxidizer-Rich Preburner Superalloys", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "For decades the West held that an oxygen-rich preburner would simply burn through any turbine. Soviet metallurgy disproved it: chrome-nickel alloys with burn-passivated surfaces survive hot, oxygen-rich gas, unlocking the most efficient kerolox engines ever flown. THE engine that metallurgy unlocks.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}], "upgrades": []}, "fd_turbopumps": {"title": "Inducer-Stabilized Cryogenic Turbopumps", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Move propellant by the ton per second without cavitating the pump. An axial inducer ahead of the centrifugal impeller suppresses cavitation at low inlet pressure — the enabling piece of every high-thrust engine.", "parts": [], "upgrades": []}, "fd_combustionStability": {"title": "Baffled-Injector Combustion-Instability Suppression", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Tangential acoustic modes can couple to combustion and tear a large chamber apart in milliseconds. Injector baffles and tuned cavities damp them. Taming this — not the fuel — is why the F-1 took years and why it lives in Fluid Dynamics.", "parts": [{"name": "ROE-F1", "mod": "ROEngines", "title": "F-1"}, {"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_F-1-1.52M", "RFUpgrade_F-1A"]}, "th_regenCooling": {"title": "Regenerative Forced-Convection Wall Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before burning it, carrying away heat flux that would melt any uncooled metal. The thermodynamics that lets a chamber run hotter than its own melting point.", "parts": [], "upgrades": []}, "cryo_loxHandling": {"title": "Subcooled LOX Densification", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Hold oxygen below its boiling point: vacuum-jacketed lines, careful materials, and the operational discipline to load minutes before launch. Subcooling buys density — more propellant in the same tank.", "parts": [], "upgrades": []}, "cryo_lh2Insulation": {"title": "Multilayer Vacuum Insulation for LH2", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Hydrogen boils at -253 C and diffuses through metal lattices. Dozens of radiation-shield layers under vacuum make hydrolox — the highest specific impulse chemistry there is — actually flyable. The J-2 lives here, fed by Chemistry's cryogen supply.", "parts": [{"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": []}, "cryo_stagedHydrolox": {"title": "Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Burn every gram twice: a fuel-rich preburner drives the turbopumps, then the exhaust is fully combusted in the chamber. The RS-25 needs both deep-cryo hydrogen handling AND reusable hot-section superalloys — a convergence of Cryogenics and Metallurgy.", "parts": [{"name": "ROE-RS25", "mod": "ROEngines", "title": "RS-25 (SSME)"}], "upgrades": []}, "cryo_zbo": {"title": "Reverse-Brayton Zero-Boiloff Cryocooling", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A closed reverse-Brayton cryocooler actively pumps heat out of the tank, driving boiloff to zero — if you can spare the kilowatts. Multi-year outer-planet cryo stages stop bleeding propellant.", "parts": [], "upgrades": []}, "tel_pcmTelemetry": {"title": "PCM/FM Telemetry Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it, a failure tells you nothing about why.", "parts": [], "upgrades": []}, "tel_helicalDirectional": {"title": "Helical Directional Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Axial-mode helices give circularly-polarized gain that tolerates a tumbling spacecraft — range and data rate at the cost of having to point.", "parts": [{"name": "HighGainAntenna5_v2", "mod": "Squad", "title": "HG-5 Retractable Parabolic Antenna"}], "upgrades": []}, "tel_cassegrainHGA": {"title": "Cassegrain Parabolic High-Gain Reflector", "discipline": "Telecommunications", "color": "#4361ee", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A subreflector folds the feed back through the dish vertex, shortening the assembly and closing the link from lunar distance. Apollo talked home through one.", "parts": [{"name": "HighGainAntenna", "mod": "Squad", "title": "1.25m Retractable Parabolic Antenna"}, {"name": "ROC-ApolloHGABDB", "mod": "ROCapsules", "title": "Apollo High Gain Antenna (HGA)"}], "upgrades": []}, "tel_dsnRanging": {"title": "Coherent Two-Way Doppler \u0026 Ranging", "discipline": "Telecommunications", "color": "#4361ee", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Phase-coherent ground dishes pull a few bits per second out of interplanetary noise and, from the round-trip Doppler, fix the spacecraft's state vector to meters.", "parts": [], "upgrades": []}, "tel_phasedArray": {"title": "Electronically-Steered Phased Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Steer the beam by element phasing, no moving parts. Higher rates, graceful degradation, the backbone of a relay constellation.", "parts": [], "upgrades": []}, "ext_powerGrid": {"title": "Kilowatt-Class Regulated Power Bus", "discipline": "Electrical Power", "color": "#ffd166", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "(off-slice stub) Electrical Power. Regulated high-voltage buses for active cryocooling and electric propulsion.", "parts": [], "upgrades": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
