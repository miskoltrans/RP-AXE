cations", "color": "#3f7bf5", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Phase a whole field of ground dishes together and they act as one impossible aperture — a 70-metre giant and a cluster of 34-metre beam-waveguide antennas combined to hear a probe going quiet at the edge of the Solar System. When Voyager reached Neptune, it took the whole array to keep the pictures coming.", "parts": [], "upgrades": ["commsTL8"], "grants": ["RP0Level9TrackingStation"], "experiments": []}, "tel_kaBandDownlink": {"title": "Ka-Band High-Rate Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Climb the band again, from X to Ka — near four times the frequency once more, the beam tightening to a needle and the data rate leaping with it. The band a modern flagship saves for its high-rate science: the step from an X-band trickle to a torrent, on a carrier so narrow the dish must be aimed to a hair, packed by shaped suppressed-carrier modulation that pushes the link toward its theoretical limit.", "parts": [], "upgrades": ["commsTL9"], "grants": ["RP0Level10TrackingStation"], "experiments": []}, "tel_opticalDownlink": {"title": "Optical Deep-Space Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Leave radio behind and modulate a laser: an optical carrier tens of thousands of times higher in frequency than X-band, packing orders of magnitude more data onto a beam so tight it must be pointed to the arc-second across light-minutes of empty space. The downlink of the present frontier — flown from lunar orbit, and now from the asteroid belt.", "parts": [], "upgrades": ["commsTL10"], "grants": ["RP0Level11TrackingStation"], "experiments": []}, "tel_deepSpaceProbeAntennas": {"title": "Deep-Space Probe Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "A parabolic dish or omni cut to one bus family's own link budget — Pioneer's spin-scan dish, Voyager's high-gain reflector, the 4MV's own array and dish, GPS's simple omni. The named-hardware shelf, one entry per flagship mission.", "parts": [{"name": "ca_ant_gps", "mod": "CoatlAerospace", "title": "CA-GPS Omnidirectional Antenna"}, {"name": "ca_vor_comm", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus Antenna Array"}, {"name": "ca_vor_dish", "mod": "CoatlAerospace", "title": "4MV-1 Spacecraft Bus Parabolic Antenna"}, {"name": "dish_L", "mod": "CoatlAerospace", "title": "Voyager 1 \u0026 2 Parabolic Antenna"}, {"name": "dish_quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10 \u0026 11 Parabolic Antenna"}], "upgrades": [], "grants": [], "experiments": []}, "tel_largeApertureReflectors": {"title": "Large-Aperture Reflector Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The same parabolic-reflector mechanism, scaled past what any single mission needs — giant, huge and large dish reflectors off the shelf for whatever downlink budget the mission calls for.", "parts": [{"name": "nfex-antenna-reflector-giant-1", "mod": "NearFutureExploration", "title": "RFL-2000 Dish Reflector Array"}, {"name": "nfex-antenna-reflector-huge-1", "mod": "NearFutureExploration", "title": "RFL-100 Giant Dish Reflector"}, {"name": "nfex-antenna-reflector-large-1", "mod": "NearFutureExploration", "title": "RFL-50 Large Dish Reflector"}], "upgrades": [], "grants": [], "experiments": []}, "mic_gasChromatographMassSpec": {"title": "Gas Chromatograph-Mass Spectrometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Separate a gas sample by how fast each component moves through a column, then weigh what comes out in the mass spectrometer behind it — two instruments in series reading a single sample far more precisely than either alone.", "parts": [{"name": "SXTsciencenosecone", "mod": "SXT", "title": "GC-MS + Antenna"}, {"name": "sensorAtmosphere", "mod": "Squad", "title": "MS04 - Gas Chromatograph-Mass Spectrometer (GC/MS)"}], "upgrades": [], "grants": [], "experiments": [{"name": "Mass Spectrometer 4", "id": "RP0massSpec4", "sci": 30, "group": "Experiments"}]}, "opt_digitalImaging": {"title": "Solid-State Digital Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Replace the vidicon's scanned electron beam with a solid-state sensor read out electronically, line by line — the same instinct that took reconnaissance from film to television, one generation further. Higher resolution than any vidicon, and nothing left to wear out or burn in.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-DigitalCamera", "mod": "RP-1", "title": "PH05 - Ultra Resolution Digital Imaging Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Advanced Visible Imaging Device", "id": "RP0visibleImaging4", "sci": 6, "group": "Experiments"}]}, "fd_reusableOMSEngine": {"title": "Reusable Orbital-Maneuvering Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Take the pressure-fed multi-restart engine that once had to fire once, perfectly, on the way to the Moon, and shrink it into a routine orbital-maneuvering thruster — sized for a dozen burns a mission instead of one, flown on the same shape for decades after. The Shuttle's OMS, and the same lineage still flying on Orion.", "parts": [{"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_toroidalAerospikeNozzle": {"title": "Toroidal Aerospike Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Bend the bell into an open ring around a truncated plug and let the atmosphere itself complete the nozzle — an annular chamber that keeps its thrust efficient from the pad to vacuum without ever changing shape. Ground-tested for a shortened Saturn upper stage that was never built.", "parts": [{"name": "ROE-J2T", "mod": "ROEngines", "title": "J-2T"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_toroidalAerospikeNozzleII": {"title": "Uprated Toroidal Aerospike Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The same annular aerospike, pushed to a longer burn and higher chamber pressure — the J-2T's own final study mark before the program quietly ended.", "parts": [], "upgrades": ["RFUpgrade_J-2T-250K"], "grants": [], "experiments": []}, "pc_fluorineOxidizerChemistry": {"title": "Fluorine Oxidizer Chemistry", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Trade nitrogen tetroxide for liquid fluorine and gain the highest specific impulse any storable propellant will ever deliver — at the cost of an oxidiser that ignites concrete and dissolves glass. Fired on a test stand exactly as many times as good sense allowed, then never again.", "parts": [{"name": "ROE-RD301", "mod": "ROEngines", "title": "RD-301"}], "upgrades": [], "grants": [], "experiments": []}, "life_modularHabitat": {"title": "Modular Station Habitat", "discipline": "Life Support", "color": "#f0508a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The station stops being a converted rocket stage and becomes a purpose-built module you launch, dock and inhabit. A rigid pressurised core with dedicated habitation and science modules — the Mir/ISS way of building a station out of standardised, connectable rooms.", "parts": [{"name": "STXCANIOT", "mod": "SXT", "title": "PPD-H Crew Cabin"}, {"name": "sspx-core-1875-1", "mod": "StationPartsExpansionRedux", "title": "3.38m Station Core"}, {"name": "sspx-habitation-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Habitation Module Long"}, {"name": "sspx-habitation-375-2", "mod": "StationPartsExpansionRedux", "title": "6.75m Habitation Module (Small)"}, {"name": "sspx-science-1875-1", "mod": "StationPartsExpansionRedux", "title": "3.38m Science Module"}], "upgrades": [], "grants": [], "experiments": []}, "life_largeScaleHabitat": {"title": "Large-Diameter Habitat Modules", "discipline": "Life Support", "color": "#f0508a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The same rigid pressurised module family, in the largest diameter anyone builds — a 9-metre-class hull, room enough for a real neighbourhood instead of a corridor of rooms.", "parts": [{"name": "sspx-dome-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Dome"}, {"name": "sspx-dome-habitation-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Habitation Dome"}], "upgrades": [], "grants": [], "experiments": []}, "life_artificialGravityCentrifuge": {"title": "Artificial-Gravity Centrifuge Habitat", "discipline": "Life Support", "color": "#f0508a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Spin a section of the station and simulated weight comes back — the one countermeasure to long-duration weightlessness that doesn't need a treadmill, a drug, or a trip home. Never flown at station scale, drawn more than once.", "parts": [{"name": "sspx-expandable-centrifuge-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Expandable Centrifuge (43m Diameter)"}, {"name": "sspx-expandable-centrifuge-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Extendable Centrifuge (43m Diameter)"}], "upgrades": [], "grants": [], "experiments": []}, "life_pressurizedCrewTubes": {"title": "Pressurised Crew Tubes", "discipline": "Life Support", "color": "#f0508a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Pressurised passageways that let a crew move between modules without an EVA — straight, angled and extendable crew tubes that turn a cluster of docked modules into one shirtsleeve interior.", "parts": [{"name": "sspx-extendable-tube-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Extendable Crew Tube"}, {"name": "sspx-tube-1875-angled-1", "mod": "StationPartsExpansionRedux", "title": "3.38m Pressurized Crew Tube (Angled)"}, {"name": "sspx-tube-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Pressurized Crew Tube (Long)"}, {"name": "sspx-tube-25-2", "mod": "StationPartsExpansionRedux", "title": "4.5m Pressurized Crew Tube (Medium)"}, {"name": "sspx-tube-25-3", "mod": "StationPartsExpansionRedux", "title": "4.5m Pressurized Crew Tube (Short)"}, {"name": "sspx-tube-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Pressurized Crew Tube (Long)"}, {"name": "sspx-tube-375-2", "mod": "StationPartsExpansionRedux", "title": "6.75m Pressurized Crew Tube (Medium)"}, {"name": "sspx-tube-375-3", "mod": "StationPartsExpansionRedux", "title": "6.75m Pressurized Crew Tube (Short)"}], "upgrades": [], "grants": [], "experiments": []}, "life_stationLogistics": {"title": "Station Logistics Modules", "discipline": "Life Support", "color": "#f0508a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Keeping a station supplied: pressurised stores, cargo containers and radial logistics modules for the water, air, food and spares that a permanent crew consumes faster than any single launch can carry.", "parts": [{"name": "sspx-cargo-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Storage Module"}, {"name": "sspx-cargo-25-2", "mod": "StationPartsExpansionRedux", "title": "4.5m Storage Module (Short)"}, {"name": "sspx-cargo-container-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Storage Module (Long)"}, {"name": "sspx-cargo-container-25-2", "mod": "StationPartsExpansionRedux", "title": "4.5m Storage Module (Medium)"}, {"name": "sspx-cargo-container-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Storage Module (Long)"}, {"name": "sspx-cargo-container-375-2", "mod": "StationPartsExpansionRedux", "title": "6.225m Storage Module (Medium)"}, {"name": "sspx-cargo-container-375-3", "mod": "StationPartsExpansionRedux", "title": "6.75m Storage Module (Short)"}, {"name": "sspx-cargo-container-radial-huge-1", "mod": "StationPartsExpansionRedux", "title": "Large Radial Cargo Container (Long)"}, {"name": "sspx-cargo-container-radial-huge-2", "mod": "StationPartsExpansionRedux", "title": "Large Radial Cargo Container (Short)"}, {"name": "sspx-cargo-container-radial-medium-1", "mod": "StationPartsExpansionRedux", "title": "Twin Radial Cargo Container (Long)"}, {"name": "sspx-cargo-container-radial-medium-2", "mod": "StationPartsExpansionRedux", "title": "Twin Radial Cargo Container (Medium)"}, {"name": "sspx-cargo-container-radial-medium-3", "mod": "StationPartsExpansionRedux", "title": "Twin Radial Cargo Container (Short)"}, {"name": "sspx-cargo-container-radial-small-1", "mod": "StationPartsExpansionRedux", "title": "Radial Cargo Container (Long)"}, {"name": "sspx-cargo-container-radial-small-2", "mod": "StationPartsExpansionRedux", "title": "Radial Cargo Container (Medium)"}, {"name": "sspx-cargo-container-radial-small-3", "mod": "StationPartsExpansionRedux", "title": "Radial Cargo Container (Small)"}, {"name": "sspx-logistics-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Logistics Module (Long)"}, {"name": "sspx-logistics-5-2", "mod": "StationPartsExpansionRedux", "title": "9m Logistics Module (Short)"}], "upgrades": [], "grants": [], "experiments": []}, "life_externalStowage": {"title": "External Stowage Platforms", "discipline": "Life Support", "color": "#f0508a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Not everything needs to be kept warm and pressurised. External stowage pallets bolt spares, experiments and replacement units to the outside of the station, exposed to vacuum and reachable by arm or spacewalk.", "parts": [{"name": "sspx-lab-pallet-1", "mod": "StationPartsExpansionRedux", "title": "External Stowage Platform (3.6m x 3.6m)"}, {"name": "sspx-lab-pallet-2", "mod": "StationPartsExpansionRedux", "title": "External Stowage Platform (1.8m x 1.8m)"}], "upgrades": [], "grants": [], "experiments": []}, "life_bioregenerativeECLSS": {"title": "Bioregenerative Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Close the loop with living things: a greenhouse that grows food and scrubs carbon dioxide back into oxygen, turning the open-loop consumables chain toward a self-sustaining one. The first bioregenerative step for missions too long to resupply.", "parts": [{"name": "sspx-cupola-greenhouse-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Greenhouse Dome"}, {"name": "sspx-greenhouse-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Greenhouse Module"}], "upgrades": ["AXE-US2-ChemPlant-Slots"], "grants": [], "experiments": [{"name": "ADVASC", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "Closed-Loop Lunar Agriculture Demonstration", "id": "RP0closedLoopAg", "sci": 100, "group": "Lunar Surface Crew Science"}, {"name": "ORZS-3", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "PWM-4", "id": "", "sci": null, "group": "Laboratory Experiments"}]}, "life_largeGreenhouseDome": {"title": "Large-Scale Greenhouse Dome", "discipline": "Life Support", "color": "#f0508a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Scale the greenhouse from a growth-trial rack to a walkable dome — real crop area instead of a proof of concept, the difference between supplementing a diet and actually growing a meaningful share of it.", "parts": [{"name": "sspx-dome-greenhouse-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Greenhouse Dome"}], "upgrades": [], "grants": [], "experiments": []}, "life_observationCupola": {"title": "Observation Cupola", "discipline": "Life Support", "color": "#f0508a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "A windowed dome that gives the crew a direct, wide-angle eye on the vehicle and the world below — the cupola from which an arm operator berths an incoming module, or a crew simply watches the Earth turn. A telescope dome shares the pressure-vessel design.", "parts": [{"name": "cupola", "mod": "Squad", "title": "Cupola Observatory Module"}, {"name": "sspx-cupola-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Cupola"}, {"name": "sspx-cupola-1875-1", "mod": "StationPartsExpansionRedux", "title": "3.38m Observation Module"}, {"name": "sspx-cupola-375-1", "mod": "StationPartsExpansionRedux", "title": "6.75m Cupola"}, {"name": "sspx-cupola-telescope-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Telescope Dome"}, {"name": "sspx-observation-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Cupola (Large)"}], "upgrades": [], "grants": [], "experiments": []}, "life_largeObservationDome": {"title": "Large-Scale Observation Dome", "discipline": "Life Support", "color": "#f0508a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The same windowed pressure vessel, big enough to hold more than a couple of crew at once — a shared viewing deck rather than a one-person porthole.", "parts": [{"name": "sspx-dome-cupola-5-1", "mod": "StationPartsExpansionRedux", "title": "9m Observation Dome"}], "upgrades": [], "grants": [], "experiments": []}, "life_stationAirlock": {"title": "Station Service Airlock", "discipline": "Life Support", "color": "#f0508a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "A dedicated way out. A service airlock lets the crew step into vacuum and back without depressurising the whole station — the front door for every spacewalk, assembly task and external repair.", "parts": [{"name": "sspx-airlock-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Service Airlock w/ Extendable NASA Docking System"}], "upgrades": [], "grants": function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}

    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';

    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  // experiments are Kerbalism Configure setups, not parts — invisible in R&D, so name them here
  const xs=d.experiments||[];
  if(xs.length){h+=`<div class="sec">Experiments (${xs.length})</div><ul class="parts">`;
    for(const x of xs){const m=[x.sci?x.sci+' sci':'',x.group?'Configure: '+x.group:''].filter(Boolean).join(' · ');
      h+=`<li><div class="pt">⚗ ${esc(x.name)}</div><div class="pn">${esc(x.id||'')}${m?' · '+esc(m):''}</div></li>`;}
    h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
