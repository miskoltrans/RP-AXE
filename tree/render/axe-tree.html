mpression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": [], "experiments": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": [], "experiments": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearLargeSpaceplane", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear (Spaceplane)"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}, {"name": "GearMediumSpaceplane", "mod": "Squad", "title": "LY-60 Large Landing Gear (Spaceplane)"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_heatSinkTPS": {"title": "Heat-Sink Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Survive the fireball by out-massing it. A machined beryllium block soaks the whole entry heat pulse into its own thermal mass and carries it back down still glowing — no chemistry, no char, just metal and patience. Crude and heavy, but the first thing that brings a payload home intact.", "parts": [{"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": [], "experiments": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour instead of hoarding it. Less than half the weight of a metal heat sink, and the one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}], "upgrades": ["MercuryHS"], "grants": [], "experiments": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Halve the shield and fly it at an angle. The same ablator laid up thinner and denser takes the same peak heat over the longer, shallower entry you fly when you steer a capsule to a landing site instead of dropping it wherever the ballistics put it. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS"], "grants": [], "experiments": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": ": [{"name": "BASM-4", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "CATS", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "ISSAC", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "Mystery Goo Observation", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "Qucopartex-22", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "SWAB-5", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "Vsplesk", "id": "", "sci": null, "group": "Laboratory Experiments"}]}, "int_launchEscape": {"title": "Tractor Escape Rocket", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused.", "parts": [{"name": "ROC-MercuryLESBDB", "mod": "ROCapsules", "title": "Mercury Launch Escape System"}, {"name": "RO_mk1_LES", "mod": "Squad", "title": "Launch Escape System (Mercury)"}], "upgrades": [], "grants": [], "experiments": []}, "int_mercuryCapsule": {"title": "Blunt-Body Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "RP0HumanRatedFlag", "mod": "Squad", "title": "Human Rated Flag"}], "upgrades": [], "grants": [], "experi ", "mod": "ROCapsules", "title": "Apollo Command Module Drogue Parachute Pack"}, {"name": "ROC-ApolloParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Main Parachute Pack"}, {"name": "ROC-BigGeminiParachute", "mod": "ROCapsules", "title": "Big G Landing Parachute System"}, {"name": "ROC-BigGeminiParachuteDrogue", "mod": "ROCapsules", "title": "Big G Drogue Parachute"}, {"name": "ROC-CSTParachute", "mod": "ROCapsules", "title": "CST-100 Parachute Pack"}, {"name": "ROC-D2Parachute", "mod": "ROCapsules", "title": "D-2 Parachute"}, {"name": "ROC-GeminiParachuteBDB", "mod": "ROCapsules", "title": "Gemini Landing Parachute System"}, {"name": "ROC-GeminiParachuteDrogueBDB", "mod": "ROCapsules", "title": "Gemini Drogue Parachute"}, {"name": "ROC-MercuryParachuteBDB", "mod": "ROCapsules", "title": "Mercury M-ASD Main Parachute"}, {"name": "ROC-OrionParachute", "mod": "ROCapsules", "title": "Orion Main Parachute"}, {"name": "ROC-VostokParachute", "mod": "ROCapsules", "title": "Vostok/Voskhod Parachute"}, {"name": "aquarius_drogue_parachute_s0_1", "mod": "Tantares", "title": "LK-700 Capsule Drogue Parachute"}, {"name": "aquarius_parachute_s0p5_1", "mod": "Tantares", "title": "LK-700 Capsule Parachute"}], "upgrades": [], "grants": [], "experiments": []}, "int_crewedRetroPack": {"title": "Crewed Retro-Deorbit Pack", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A cluster of solid retro-rockets carried behind a crewed capsule and fired against the flight path to drop it out of orbit on time and on target — Mercury's retropack, Gemini's retrograde section, the Voskhod and Gemini-B modules with their own reentry attitude control. The deliberate deorbit burn a returning crew's life turns on, thrown away with its adapter once the one job is done.", "parts": [{"name": "ROC-GeminiBEquipmentSection", "mod": "ROCapsules", "title": "Gemini B Adapter Module"}, {"name": "ROC-GeminiBRetrogradeSection", "mod": "ROCapsules", "title": "Gemini B Retro Module"}, {"name": "ROC-GeminiRetrogradeSectionBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section"}, {"name": "ROC-MercuryRetropackBDB", "mod": "ROCapsules", "title": "Mercury Retropack"}, {"name": "ROC-ReentryControlSystemBDB", "mod": "ROCapsules", "title": "Gemini Re-entry Control System"}, {"name": "ROC-RetrogradeDecouplerBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section Decoupler"}, {"name": "ROC-VoskhodRetroDecoupler", "mod": "ROCapsules", "title": "Voskhod Retro Decoupler"}], "upgrades": [], "grants": [], "experiments": []}, "opt_orbitalMapping": {"title": "Synoptic Orbital Scanning", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Sweep a body strip by strip as the orbit carries the scanner across it, assembling a complete map from thousands of passes — terrain, altimetry and anomaly built from coverage no single frame could give. The first instrument that maps a world instead of photographing a scene. The seed of the mapping lane that fills out among the planets.", "parts": [{"name": "SCANsat_Tracker", "mod": "SCANsat", "title": "SCAN MapTraq®"}, {"name": "SurveyScanner", "mod": "Squad", "title": "M700 Survey Scanner"}], "upgrades": [], "grants": [], "experiments": [{"name": "Synoptic Terrain Photography", "id": "RP0TerrainPhotography", "sci": 90, "group": "Crew Science"}, {"name": "Synoptic Weather Photography", "id": "RP0WeatherPhotography", "sci": 90, "group": "Crew Science"}]}, "fd_clusteredThrustGrowth": {"title": "Clustered-Chamber Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Squeeze more thrust from the same four-chamber cluster without touching the chemistry — the storable engines already flying, simply pushed harder.", "parts": [], "upgrades": ["RFUpgrade_Larch-4", "RFUpgrade_X-405H-3", "RFUpgrade_YF-20B", "RFUpgrade_YF-20C", "RFUpgrade_YF-22E", "RFUpgrade_YF-25K"], "grants": [], "experiments": []}, "fd_blendedStorableFuel": {"title": "Blended Storable Fuel", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Cut the UDMH with hydrazine and the same engine burns denser — real thrust for free, Isp along for the ride either way. Viking's own uprate, not a new engine.", "parts": [], "upgrades": ["RFUpgrade_Viking-4B", "RFUpgrade_Viking-4C", "RFUpgrade_Viking-5B"], "grants": [], "experiments": []}, "fd_ammoniaCombustionRefinement": {"title": "Stabilized Ammonia Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Retune the X-15's ammonia-lox chamber for a cleaner burn at higher pressure, wringing a real jump in specific impulse from the same volatile propellant. The rocket-plane's engine, refined rather than replaced.", "parts": [], "upgrades": ["RFUpgrade_XLR99-RM-3"], "grants": [], "experiments": []}, "fd_titanStorableConversion": {"title": "Storable-Propellant Booster Conversion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Trade kerosene for a hypergolic that ignites on contact and sits fuelled in a silo for years — some engines keep the old chemistry and simply grow, others convert outright. A missile built to launch now, not after a fuelling countdown.", "parts": [], "upgrades": ["RFUpgrade_LR87-AJ-5", "RFUpgrade_LR87-AJ-7", "RFUpgrade_LR87-AJ-9", "RFUpgrade_LR91-AJ-5", "RFUpgrade_LR91-AJ-7", "RFUpgrade_LR91-AJ-9"], "grants": [], "experiments": []}, "pc_hdaOxidiser": {"title": "High-Density Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Push more nitrogen dioxide into the nitric acid than it comfortably holds. The oxidiser gets denser, so the same tank carries more of it, and the inhibitor that stops it dissolving the tank has to work harder for it. A better propellant bought entirely in materials-compatibility problems.", "parts": [], "upgrades": ["RFUpgrade_Model8096-HDA"], "grants": [], "experiments": []}, "pc_mmh": {"title": "Monomethylhydrazine Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One methyl group away from the hydrazine that came before it, and worth the detour: it stays liquid over a far wider band, resists shock decomposition, and does not freeze in a spacecraft's plumbing on the cold side of a long coast. The fuel that made storable engines something you could still trust after two years in orbit.", "parts": [], "upgrades": ["RFUpgrade_Model8096L"], "grants": [], "experiments": []}, "pc_mon": {"title": "Nitric-Oxide-Doped Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Dissolve nitric oxide back into the dinitrogen tetroxide until the mixture stops freezing at temperatures a spacecraft will actually see. A few percent of a gas nobody wants, and the oxidiser survives the shadow side of the orbit without a heater on every line.", "parts": [], "upgrades": ["RFUpgrade_LEROS-2b", "RFUpgrade_Model8096B", "RFUpgrade_R-4D-15DM"], "grants": [], "experiments": []}, "fd_longLifeStorableUpper": {"title": "Long-Life Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The last iteration of a stage that has flown for forty years: the same pressure-fed storable engine, qualified now for coast times measured in days and restart counts nobody would have promised in the first decade. Nothing about it is new; everything about it is proven.", "parts": [], "upgrades": ["RFUpgrade_AestusMod", "RFUpgrade_Agena-2000"], "grants": [], "experiments": []}, "pc_juno_ClF3": {"title": "Chlorine-Trifluoride Oxidiser", "discipline": "Propellant Chemistry", "color":  walk past you.", "parts": [{"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_E-1-500k", "RFUpgrade_F-1-1.52M", "RFUpgrade_LR87-AJ-11-Kero", "RFUpgrade_LR91-AJ-11-Kero", "RFUpgrade_RS-27", "RFUpgrade_Viking-5C"], "grants": [], "experiments": []}, "fd_matureKeroloxClusterUprating": {"title": "Mature Kerolox Cluster Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Refine the whole family of clustered gas-generator kerolox boosters mark by mark — more thrust, longer service life, no change to the chemistry. The same diminishing-return story as F-1's own trap, one tier over, for its smaller siblings.", "parts": [], "upgrades": ["RFUpgrade_H-1-200K", "RFUpgrade_H-1-205K"], "grants": [], "experiments": []}, "cryo_extendedBurnExpander": {"title": "Extended-Burn Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Qualify the expander for the long haul: a chamber and turbine that survive nine minutes of firing instead of five, and a nozzle re-cut for the vacuum it will actually spend that time in. The upper stage stops being a kick motor and becomes something you can coast on, restart, and trust with the whole mission.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3A"], "grants": [], "experiments": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed — trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_AJ10-133-LH", "RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": [], "experiments": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster — a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-J2X", "mod": "ROEngines", "title": "J-2X"}, {"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2-230K", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_RL10A-3-3B"], "grants": [], "experiments": []}, "cryo_refinedExpander": {"title": "Refined Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Wring more specific impulse out of the closed expander cycle — hotter, tighter plumbing on the efficient small upper stage.", "parts": [], "upgrades": ["RFUpgrade_LE-5A", "RFUpgrade_RL10A-3-3", "RFUpgrade_RL10A-4-1N", "RFUpgrade_RL10A-4N", "RFUpgrade_RL10B-2"], "grants": [], "experiments": []}, "pc_throttledClosedCycle": {"title": "Derated Closed-Cycle Sustainer", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Take the booster's closed-cycle engine and deliberately run it below what it can do. Chamber pressure comes down, the turbine stops living on the edge, and the engine that was a reliability problem at full throttle becomes one you can stack thirty of and still expect to reach orbit.", "parts": [], "upgrades": ["RFUpgrade_NK-21"], "grants": [], "experiments": []}, "pc_refinedMixtureClosedCycle": {"title": "Trimmed Closed-Cycle Mixture Ratio", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Re-trim the oxidiser-to-fuel ratio and the preburner split until the cycle gives up another twelve seconds without touching the hardware — the cheapest specific impulse in rocketry, and the hardest to find, because everything upstream of the injector has to be measured before it can be moved.", "parts": [], "upgrades": ["RFUpgrade_NK-39"], "grants": [], "experiments": []}, "pc_restartableClosedCycle": {"title": "Restartable Oxidiser-Rich Closed Cycle", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Relight a staged-combustion engine in vacuum, which means restarting an oxidiser-rich preburner that will happily burn its own turbine if the start sequence slips. Two ignitions instead of one, and the upper stage can finally choose when to fall.", "parts": [], "upgrades": ["RFUpgrade_NK-31"], "grants": [], "experiments": []}, "pc_closedCycleUpper": {"title": "Closed-Cycle Upper-Stage Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Shrink the oxidiser-rich preburner until it fits an upper stage, where the gain is not thrust but the specific impulse you carry all the way to escape. A small closed-cycle engine is harder per kilonewton than a big one — the turbine still has to survive its own exhaust, and now there is no mass budget to armour it with.", "parts": [], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M"], "grants": [], "experiments": []}, "pc_rg1": {"title": "High-Density Kerosene Cut", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Distil the kerosene to a narrower, denser, more thermally stable cut than anything an aircraft would burn — more mass of fuel in the same tank, and it stops coking the regenerative passages when the chamber runs hot. The fuel stops being a commodity and becomes part of the engine's design.", "parts": [], "upgrades": ["RFUpgrade_NK-9-1972", "RFUpgrade_RD-58"], "grants": [], "experiments": []}, "pc_rg1Uprating": {"title": "Oxidiser-Rich Preburner Uprating", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Drive the preburner harder and re-trim the mixture until the closed cycle gives up another seven seconds — the last easy specific impulse in a design that is already recycling everything it burns.", "parts": [], "upgrades": ["RFUpgrade_RD-58M"], "grants": [], "experiments": []}, "pc_extendedNozzleUpper": {"title": "Extended-Nozzle Upper Stage", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Hang a far larger bell on an upper-stage engine that will never see air: sea-level performance collapses and nobody cares, because every second of it is spent in vacuum. The nozzle stops being a compromise between two regimes and is cut for the only one that matters.", "parts": [], "upgrades": ["RFUpgrade_RD-58M-CCN"], "grants": [], "experiments": []}, "pc_syntin": {"title": "Strained-Ring Synthetic Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Synthesise the fuel instead of refining it: pack the energy into strained hydrocarbon rings that give it back when they break. Denser and hotter than any kerosene cut, absurdly expensive, and flown anyway when a few seconds of specific impulse were worth more than the money.", "parts": [], "upgrades": ["RFUpgrade_17D12", "RFUpgrade_RD-107-11D512P", "RFUpgrade_RD-108-11D511P"], "grants": [], "experiments": []}, "pc_n1ClosedCycle": {"title": "Subcooled-Propellant Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale — the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did.", "parts": [{"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}, {"name": "ROE-NK43", "mod": "ROEngines", "title": "NK-15V/43"}, {"name": "SXTNK21BlockV", "mod": "SXT", "title": "N1 Block V"}], "upgrades": ["RFUpgrade_NK-19"], "grants": [], "experiments": []}, "pc_protonStagedCombustion": {"title": "Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying.", "parts": [{"name": "ROE-RD0210", "mod": "ROEngines", "title": "RD-0208/0210"}, {"name": "ROE-RD254", "mod": "ROEngines", "title": "RD-254"}, {"name": "ROE-RD275", "mod": "ROEngines", "title": "RD-253/RD-275"}], "upgrades": [], "grants": [], "experiments": []}, "pc_refinedStorableORSC": {"title": "Refined Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Squeeze the storable staged-combustion boosters a little further — Mk-II chambers, higher flow, the same dependable poison.", "parts": [], "upgrades": ["RFUpgrade_RD-0203U", "RFUpgrade_RD-0210", "RFUpgrade_RD-0212", "RFUpgrade_RD-0213", "RFUpgrade_RD-0214", "RFUpgrade_RD-253-Mk2", "RFUpgrade_RD-254-11D44-Mk2"], "grants": [], "experiments": []}, "nuc_nuclearThermalRocket": {"title": "Solid-Core Nuclear Thermal Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Heat liquid hydrogen in a fission reactor and blow it out a nozzle — twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here.", "parts": [{"name": "KIWIA24", "mod": "Squad", "title": "Kiwi A3 Atomic Rocket Motor"}, {"name": "KIWIB48", "mod": "Squad", "title": "Kiwi B4E Atomic Rocket Motor"}], "upgrades": ["RFTech-nuclear-tltech1"], "grants": [], "experiments": []}, "nuc_nuclearRamjet": {"title": "Reactor-Heated Ramjet", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest — an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose.", "parts": [{"name": "RO-A136", "mod": "Squad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"], "experiments": []}, "shd_interplanetaryAvionics": {"title": "Deep-Space Bus — Interplanetary", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Harden the long-duration cruise stack itself, not just its chassis — shielded electronics for a coast that spends months, not hours, deep in interplanetary radiation.", "parts": [], "upgrades": [], "grants": ["Deep-Space-interplanetaryProbes"], "experiments": []}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": [], "experiments": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good.", "parts": [{"name": "RO-SaturnI-IU", "mod": "ReStockPlus", "title": "Saturn I Instrument Unit [3.9 m]"}], "upgrades": [], "grants": ["Science-Core-improvedAvionics"], "experiments": []}, "shd_digitalGuidanceComputer": {"title": "Deep-Space Bus — Digital", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The first digital guidance computer, rebuilt around radiation-hardened logic — a machine that keeps computing fresh corrections after a dose that would upset an unshielded chip.", "parts": [], "upgrades": [], "grants": ["Deep-Space-improvedAvionics"], "experiments": []}, "comp_realTimeFlightComputer": {"title": "Priority-Interrupt Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one.", "parts": [{"name": "restock-drone-core-375-1", "mod": "ReStockPlus", "title": "Saturn IB/V Instrument Unit [6.6 m]"}], "upgrades": [], "grants": ["Science-Core-matureAvionics"], "experiments": []}, "shd_realTimeFlightComputer": {"title": "Deep-Space Bus — Real-Time", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The priority-interrupt flight computer, shielded to keep juggling guidance, navigation and engine control after a dose that would otherwise upset its scheduler.", "parts": [], "upgrades": [], "grants": ["Deep-Space-matureAvionics"], "experiments": []}, "comp_networkedAvionics": {"title": "Multi-Vehicle Avionics Integration", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together.", "parts": [], "upgrades": ["HDD-Upgrade-1969", "RFTech-ComSat-III", "RFTech-NavSat-III"], "grants": ["Science-Core-largeScaleAvionics"], "experiments": []}, "shd_networkedAvionics": {"title": "Deep-Space Bus — Networked", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Multi-vehicle avionics integration, hardened for a station or relay constellation that spends its whole service life outside Earth's protective magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-largeScaleAvionics"], "experiments": []}, "comp_multiplyRedundantFlightComputer": {"title": "Multiply-Redundant General-Purpose Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Four identical general-purpose computers vote on every result, and a fifth arbitrates a tie — fly-by-wire trusted with a crew's life because no single failure, or even a single disagreement, can bring it down. The Shuttle's own avionics generation.", "parts": [], "upgrades": ["HDD-Upgrade-1975"], "grants": ["Science-Core-advancedAvionics"], "experiments": []}, "shd_multiplyRedundantFlightComputer": {"title": "Deep-Space Bus — Redundant", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Quadruple-redundant fly-by-wire, shielded to keep out-voting a radiation-flipped bit the same way it out-votes any other single failure — trusted with a crew on a mission that never comes home to Earth's shelter.", "parts": [], "upgrades": [], "grants": ["Deep-Space-advancedAvionics"], "experiments": []}, "comp_distributedAvionicsBus": {"title": "Distributed Avionics Data Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Stop wiring every sensor and actuator straight to the computer and put them all on one shared data bus instead — a single twisted pair carrying every subsystem's traffic, addressed and time-sliced instead of home-run cabled. The wiring-harness weight a modular station can no longer afford to carry.", "parts": [], "upgrades": [], "grants": ["Science-Core-nextGenAvionics"], "experiments": []}, "shd_distributedAvionicsBus": {"title": "Deep-Space Bus — Distributed", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "The shared data bus, radiation-hardened end to end — every sensor and actuator on the line survives the same dose the flight computer does, for an outer-system mission with no wiring-harness weight to spare.", "parts": [], "upgrades": [], "grants": ["Deep-Space-nextGenAvionics"], "experiments": []}, "comp_digitalEngineControl": {"title": "Full-Authority Digital Engine Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Put a computer between the throttle and the engine and let it, not a hydromechanical governor, decide what the valves do. It trims mixture ratio in closed loop against measured chamber pressure, holds the engine at a margin a mechanical linkage could never be trusted near, and shuts it down cleanly on a sensor trend instead of a failure. The same step that turned a carburettor into an engine management unit, applied to something with a turbopump.", "parts": [], "upgrades": ["RFUpgrade_HG-3A-SL", "RFUpgrade_RS-68B"], "grants": [], "experiments": []}, "comp_softwareDefinedFlightControl": {"title": "Software-Defined Flight Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Move the control laws out of hardwired logic and into software that can be patched after launch — a flight computer whose behaviour is a file to update, not a board to re-etch, for a vehicle meant to keep flying for years.", "parts": [], "upgrades": ["HDD-Upgrade-1990"], "grants": ["Science-Core-longTermAvionics"], "experiments": []}, "shd_softwareDefinedFlightControl": {"title": "Deep-Space Bus — Software-Defined", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Software-patchable flight control, shielded for a vehicle meant to keep flying for years deep in the outer system, where a board re-etch is never an option.", "parts": [], "upgrades": [], "grants": ["Deep-Space-longTermAvionics"], "experiments": []}, "comp_interoperableAvionicsStandard": {"title": "Interoperable Avionics Standard", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Agree on a common data-bus protocol and command format across national space programmes, so a module built on one continent can dock, hand off power and share telemetry with one built on another without a custom adapter for every pairing.", "parts": [], "upgrades": ["HDD-Upgrade-1998"], "grants": ["Science-Core-internationalAvionics"], "experiments": []}, "shd_interoperableAvionicsStandard": {"title": "Deep-Space Bus — Interoperable", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "The common data-bus standard, hardened alike across every national programme's hardware — an international deep-space handoff that survives the same radiation on either end.", "parts": [], "upgrades": [], "grants": ["Deep-Space-internationalAvionics"], "experiments": []}, "comp_commercialOffTheShelfAvionics": {"title": "Commercial Off-The-Shelf Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Skip the custom-built, radiation-hardened rack and fly triple-redundant commercial processors instead — orders of magnitude more computing power for a fraction of the cost and years off the schedule, the same bet the whole modern commercial launch industry made.", "parts": [], "upgrades": ["HDD-Upgrade-2010", "HDD-Upgrade-2020"], "grants": ["Science-Core-modernAvionics"], "experiments": []}, "shd_commercialOffTheShelfAvionics": {"title": "Deep-Space Bus — Commercial", "discipline": "Computing", "color": "#d13bc4", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Take the same commercial processors and wrap them in the hardening they skipped — cheap compute, radiation-rated, for a deep-space mission that can't afford a custom rack but also can't afford a bit-flipped autopilot.", "parts": [], "upgrades": [], "grants": ["Deep-Space-modernAvionics"], "experiments": []}, "av_highBypassTurbofan": {"title": "High-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Wrap the core in a huge ducted fan and let most of the air bypass the burner entirely — the quiet, thrifty engine that made long-haul jets economical, trading raw exhaust speed for fuel it never has to carry.", "parts": [{"name": "JetEngine", "mod": "Squad", "title": "TF/CF34 High-Bypass Turbofan"}, {"name": "SXTMiniJet", "mod": "SXT", "title": "Williams/Rolls-Royce FJ44-2A turbofan"}, {"name": "turboFanSize2", "mod": "Squad", "title": "CF6 High-Bypass Turbofan"}], "upgrades": [], "grants": [], "experiments": []}, "av_lowBypassTurbofan": {"title": "Low-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "A modest bypass fan bolted to a fighter's afterburning core — some of the turbofan's thrift without giving up the supersonic dash. The engine of the teen-series fighters.", "parts": [{"name": "RO-D30F6", "mod": "Squad", "title": "D-30 Low-Bypass Turbofan"}, {"name": "aje_f404", "mod": "Squad", "title": "F404 Low-Bypass Turbofan"}, {"name": "turboJet", "mod": "Squad", "title": "F100 Low-Bypass Turbofan"}], "upgrades": [], "grants": [], "experiments": []}, "av_advancedJetEngines": {"title": "Turbine-Temperature Uprating", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 324, "anyToUnlock": true, "flavor": "The mature marks of the bypass turbofans in the hangar — hotter turbines, tighter tolerances, a few percent more thrust and a few percent less fuel, engine by engine.", "parts": [], "upgrades": ["RFUpgrade_CF6-50A", "RFUpgrade_CF6-80A", "RFUpgrade_F100-PW-220", "RFUpgrade_J57-P-420", "RFUpgrade_J79-GE-11", "RFUpgrade_TF34-GE-400A"], "grants": [], "experiments": []}, "av_advancedFighterTurbojets": {"title": "Variable-Stator Fighter Turbojet Uprating", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "The mature marks of the variable-stator fighter turbojets — J79, J85 and their Chinese WP derivatives, refined engine by engine for a few more percent of thrust.", "parts": [], "upgrades": ["RFUpgrade_J79-MTU-J1K", "RFUpgrade_J85-GE- ": "#83c341", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Skip the reactor and the nozzle entirely — drop small fission charges out the back and ride the shockwave off an ablative plate, one controlled detonation at a time. Absurd, filthy, and on paper the only chemistry-free way to put a truly heavy ship anywhere in the solar system fast. Project Orion never flew; here, it can.", "parts": [{"name": "RO-fft20mMMOtank", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Pulse Unit Magazine"}, {"name": "RO-fftorion12", "mod": "FarFutureTechnologies", "title": "12 Meter Orion Drive"}, {"name": "RO-fftorion8", "mod": "FarFutureTechnologies", "title": "8 Meter Orion Drive"}, {"name": "fft-fission-orion-5-1", "mod": "FarFutureTechnologies", "title": "10 Meter Orion Drive"}, {"name": "fft-fueltank-pulseunits-5-1", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Small)"}, {"name": "fft-fueltank-pulseunits-5-2", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Medium)"}, {"name": "fft-fueltank-pulseunits-5-3", "mod": "FarFutureTechnologies", "title": "Orion Pulse Unit Magazine (Large)"}, {"name": "fft-fueltank-targets-5-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Pulse Unit Magazine"}], "upgrades": [], "grants": [], "experiments": []}, "ep_hallEffectThruster": {"title": "Hall-Effect Ion Acceleration", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Trap electrons in a magnetic field to ionise a noble gas, then let an electric field fling the ions out far faster than any flame — thrust measured in millinewtons, specific impulse measured in the thousands of seconds. Too weak to launch anything, and exactly what a satellite needs to hold its station for a decade on a tank of xenon.", "parts": [{"name": "RO-SPT50", "mod": "NearFuturePropulsion", "title": "SPT-50 Hall Effect Thruster"}, {"name": "RO-SPT60", "mod": "NearFutu Med", "mod": "Squad", "title": "EATCS Retractable Radiator (Medium)"}, {"name": "foldingRadSmall", "mod": "Squad", "title": "EATCS Retractable Radiator (Small)"}, {"name": "radPanelEdge", "mod": "Squad", "title": "EATCS Radiator Panel (Fin)"}, {"name": "radPanelLg", "mod": "Squad", "title": "EATCS Radiator Panel (Long)"}, {"name": "radPanelSm", "mod": "Squad", "title": "EATCS Radiator Panel (Short)"}], "upgrades": [], "grants": [], "experiments": []}, "met_aluminiumCopperBalloonTank": {"title": "Aluminium-Copper Balloon Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Swap the pressure-stabilised tank's stainless skin for an aluminium-copper alloy and the same trick — a wall so thin it needs its own pressure to stand — sheds a third of its weight again. The material the Shuttle's own External Tank flies on.", "parts": [], "upgrades": ["RFTech-SM-IV", "RFTech-Tank-Balloon-SteelAlCu", "RFTech-Tank-Iso-AlCu"], "grants": [], "experiments": []}, "met_aluminiumLithiumTankage": {"title": "Aluminium-Lithium Alloy Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Alloy the tank wall with lithium and it comes out several percent lighter and stiffer at the same strength — the dry-mass saving that goes straight into payload. The alloy the Shuttle's Super-Lightweight Tank and a generation of launchers after it are built from.", "parts": [], "upgrades": ["RFTech-Tank-Balloon-SteelAlLi", "RFTech-Tank-Iso-AlLi", "RFTech-Tank-Sep-AlLi", "RFTech-Tank-Wet-Wing2"], "grants": [], "experiments": []}, "met_stirWeldedTankage": {"title": "Friction-Stir-Welded Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Join the tank barrel with a spinning shoulder that stirs the metal together below its melting point instead of melting it — a weld with none of the porosity or heat-warp of an arc, strong enough to trust an integral tank wall to. The process behind the friction-stir-welded barrels of the modern launch fleet.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Comp", "RFTech-Tank-Sep-Stir"], "grants": [], "experiments": []}, "met_stainlessSteelTankage": {"title": "Stir-Welded Stainless-Steel Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Go back to steel — but a cryo-tough stainless that keeps its strength through re-entry heat and down to liquid-oxygen cold, cheap enough to build a reusable tank-and-hull as one piece. The counter-intuitive material choice behind a fully-reusable heavy launcher.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Magic", "RFTech-Tank-Sep-Starship"], "grants": [], "experiments": []}, "cmp_compositeNozzleExtension": {"title": "Carbon-Carbon Nozzle Extension", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Weave carbon fibre in a carbon matrix and it gets stronger as it gets hotter, right up past the point where any alloy has gone soft. Bolt a skirt of it below the metal chamber and the nozzle grows without the mass a cooled metal extension would have cost — expansion ratio for free, paid for in a two-year layup and cure.", "parts": [], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RS-68K"], "grants": [], "experiments": []}, "cmp_advancedCompositeFairings": {"title": "High-Temperature Composite Fairings", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Cure the fairing from higher-temperature resins and out-of-autoclave layups — lighter shells that also take the aerothermal load of a faster ascent, and come off a production line instead of a hand-layup bench. The payload shroud grown into a manufactured part.", "parts": [], "upgrades": ["PFTech-Fairing-V", "PFTech-Fairing-VI"], "grants": [], "experiments": []}, "th_advancedMLI": {"title": "Perforated Double-Aluminised Insulation", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Refine the multi-layer blanket — more and thinner double-aluminised layers, perforated to vent the trapped gas so they pack tighter without conducting — and the parasitic heat leak into a cryogenic tank or a cold instrument drops again. The insulation that lets propellant and coolant last a long mission.", "parts": [], "upgrades": ["MLI.Upgrade4", "MLI.Upgrade5", "RFTech-MLI-UpgradeBalloon"], "grants": [], "experiments": []}, "gnc_longLifeRCS": {"title": "Long-Life Reaction-Control Thrusters", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Build the reaction-control thruster to fire tens of thousands of times without eroding its throat or coking its injector — the durability a space station holds attitude with for decades, and a reusable stage relights on descent after descent. The RCS that stops being a consumable.", "parts": [], "upgrades": ["RFTech-rcs-tltech7"], "grants": [], "experiments": []}, "elec_secondaryBatteries": {"title": "Sealed Rechargeable Battery Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Seal a rechargeable cell so it cycles through orbital night after orbital night without venting or dying — nickel-cadmium, then nickel-hydrogen — and a spacecraft can finally store the power its arrays make in daylight. The other half of every solar power system.", "parts": [], "upgrades": ["RFTech-Battery-III"], "grants": [], "experiments": []}, "elec_thinSeparatorCells": {"title": "Thin-Separator Cell Stacks", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Thin the separators and press the plates closer until the case is mostly active material and hardly any structure — the same chemistry, a thir
