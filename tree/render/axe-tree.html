ROCapsules", "title": "Big G Nose Fairing"}, {"name": "ROC-BigGeminiSM", "mod": "ROCapsules", "title": "Big G Service Module"}], "upgrades": [], "grants": []}, "int_shuttleOrbiter": {"title": "Reusable Winged Orbiter", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Put the wing, the heatshield, the flight deck and a cargo bay big enough to carry a whole satellite all on one airframe that lands on a runway and flies again — the Shuttle orbiter, the vehicle this whole era is named for. Winged reentry, a spaceplane flight deck and large-fuselage airframe structure, each already proven separately, converge here for the first time into one reusable machine.", "parts": [{"name": "mk3CargoBayL", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-100"}, {"name": "mk3CargoBayM", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-50"}, {"name": "mk3CargoBayS", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-25"}, {"name": "mk3CargoRamp", "mod": "Squad", "title": "Mk3 Cargo Ramp"}, {"name": "mk3Cockpit_Shuttle", "mod": "Squad", "title": "Mk3 Cockpit"}, {"name": "mk3CrewCabin", "mod": "Squad", "title": "Mk3 Passenger Module"}], "upgrades": [], "grants": []}, "cryo_deployableNozzleExpander": {"title": "Deployable-Nozzle Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The expander cycle's payoff arrives: a radiatively-cooled nozzle that unfolds after staging trades stowed length for the highest vacuum Isp of any engine that flies. The RL-10B-2's carbon-carbon skirt reaches 465 seconds; the RD-0146 is the Russian closed-expander answer. The long RL-10 chain, idle since its last refinement, leaps a full fleet-generation here.", "parts": [{"name": "ROE-RD0146", "mod": "ROEngines", "title": "RD-0146"}, {"name": "ROE-RL10A4N", "mod": "ROEngines", "title": "RL-10A-4N Series (46\" Extendable Nozzle)"}, {"name": "ROE-RL10B2", "mod": "ROEngines", "title": "RL-10B/C Series (84.1\" Extendable Nozzle)"}], "upgrades": ["RFUpgrade_CECE-Base", "RFUpgrade_RL10C-1", "RFUpgrade_RL10C-1-1", "RFUpgrade_RL10C-1A", "RFUpgrade_RL10C-3", "RFUpgrade_RL10E-1", "RFUpgrade_RL10E-3EL", "RFUpgrade_RL10E-3ELL"], "grants": []}, "cryo_operationalHydroloxUpper": {"title": "Operational Restartable Hydrolox Upper", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The gas-generator hydrolox upper grows up. Where the J-2 fired once, the LE-5 coasts and reignites ten times across a mission — the workhorse restartable upper of an operational launcher. Its own expander-bleed descendants split off to the expander lane.", "parts": [{"name": "ROE-LE5", "mod": "ROEngines", "title": "LE-5"}], "upgrades": ["RFUpgrade_HM-7B++", "RFUpgrade_RL10A-4"], "grants": []}, "cryo_operationalHydroloxUpperII": {"title": "Further-Matured Restartable Hydrolox Upper", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The LE-5 keeps maturing mark by mark — more restarts, a little more thrust, the same workhorse upper stage refined rather than replaced.", "parts": [], "upgrades": ["RFUpgrade_AJ10-154", "RFUpgrade_LE-5B", "RFUpgrade_LE-5B-2", "RFUpgrade_LE-5B-3", "RFUpgrade_RL10A-4-1-2", "RFUpgrade_YF-75E"], "grants": []}, "cryo_boosterGasGenHydrolox": {"title": "Booster-Class Gas-Generator Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Having proven the reusable staged-combustion engine is buildable, the world's launch fleet turns around and walks away from it. The RS-68 — the most powerful hydrogen engine ever flown — is deliberately a gas-generator with an ablative nozzle, trading Isp for a price tag; Vulcain and the YF-77 make the same bargain for Ariane and Long March. The anti-SSME: simplicity at booster scale.", "parts": [{"name": "ROE-RS68", "mod": "ROEngines", "title": "RS-68"}, {"name": "YF77_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-77"}, {"name": "YF77_Engine-double-withShell", "mod": "KerwisChineseAerospacePack", "title": "YF-77 with CZ-5 Boattail"}, {"name": "cryoengine-vesuvius-1", "mod": "CryoEngines", "title": "Vulcain 2"}, {"name": "rmm_rainier", "mod": "RocketMotorMenagerie", "title": "Space Transportation Main Engine (STME)"}], "upgrades": ["RFUpgrade_M-1U"], "grants": []}, "cryo_operationalFRSC": {"title": "Operational Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The hardest cycle in rocketry stops being one nation's secret. Fuel-rich staged-combustion hydrolox — the SSME's cycle — is rebuilt by two more programs: the RD-0120 lifts Energia, the LE-7 lifts the H-II. What took a superpower to master becomes something three space programs can pour.", "parts": [{"name": "ROE-LE7", "mod": "ROEngines", "title": "LE-7"}, {"name": "ROE-RD0120", "mod": "ROEngines", "title": "RD-0120"}, {"name": "rmm_ishtar", "mod": "RocketMotorMenagerie", "title": "RS-25-50X (SSME-50X)"}], "upgrades": [], "grants": []}, "cryo_seaLevelHydroloxNozzle": {"title": "Sea-Level Hydrolox Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Re-cut a vacuum-optimised hydrolox bell short enough to run at sea level without the exhaust tearing itself off the wall. You give up vacuum specific impulse to get an engine that can light on the pad — the price of a hydrogen first stage rather than a hydrogen upper.", "parts": [], "upgrades": ["RFUpgrade_HG-3B-SL", "RFUpgrade_HG-3B-SL-2", "RFUpgrade_M-1SL"], "grants": []}, "cryo_reusableTurbopumpUprating": {"title": "Reusable Turbopump Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "The second pass over an engine already qualified to fly again: new turbopump rotors, a wider surge margin, and inspection intervals long enough that the overhaul between flights stops being a rebuild. Thrust follows, but the real gain is how many times you can do it.", "parts": [], "upgrades": ["RFUpgrade_HG-3B-2", "RFUpgrade_LE-7A-2", "RFUpgrade_RD-0122", "RFUpgrade_RD-57A-1", "RFUpgrade_RS-25C"], "grants": []}, "cryo_reusableChamberPressureCeiling": {"title": "Reusable Chamber-Pressure Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "The last few percent, bought by running the chamber at a pressure the first version of this engine would not have survived. Everything downstream — throat, cooling channels, turbine inlet — is already at its limit, so each further kilonewton costs more than the one before it.", "parts": [], "upgrades": ["RFUpgrade_RS-25D-E"], "grants": []}, "cryo_boosterHydroloxCeiling": {"title": "Booster Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Eight meganewtons from a single hydrogen chamber firing at sea level — the largest liquid engine anyone ever drew, sized for a vehicle that would have made Saturn V look modest. The turbopump alone outpowers most launch vehicles; every part of it is at a limit somebody had to argue was reachable.", "parts": [], "upgrades": ["RFUpgrade_M-1U-SL"], "grants": []}, "cryo_reusableEngineUprating": {"title": "Reusable-Engine Production Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Every reusable and staged-combustion hydrolox engine now in service settles into its production marks — the SSME Block-I and Block-II, the RD-0120M, the LE-7A, the maturing HG-3 and deep-throttle chains — the unglamorous decade of squeezing margin out of engines already flying.", "parts": [{"name": "rmm_arsia", "mod": "RocketMotorMenagerie", "title": "RS-25-650 (SSME-650)"}], "upgrades": ["RFUpgrade_HG-3B", "RFUpgrade_LE-7A", "RFUpgrade_LR129-P-3", "RFUpgrade_LRBE-BlockII", "RFUpgrade_RD-0120M", "RFUpgrade_RD-57M", "RFUpgrade_RL10A-4-2N", "RFUpgrade_RS-25A", "RFUpgrade_RS-25D-50X", "RFUpgrade_SSBE-BlockII"], "grants": []}, "cryo_tripropellant": {"title": "Tripropellant Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "One engine, two fuels, switched in flight. At liftoff it burns dense kerosene for thrust off the pad; at altitude it crosses over to hydrogen for Isp — a single powerplant doing the job of a two-propellant staircase. The RD-701 was meant to lift the MAKS spaceplane; making it work needs both the staged-combustion hydrolox cycle and oxidiser-rich kerolox at once.", "parts": [{"name": "nflv-engine-rd701-1", "mod": "NearFutureLaunchVehicles", "title": "RD-701"}, {"name": "nflv-engine-rd704-1", "mod": "NearFutureLaunchVehicles", "title": "RD-704"}, {"name": "rmm_dugong", "mod": "RocketMotorMenagerie", "title": "SSBE"}], "upgrades": [], "grants": []}, "cryo_methaloxStagedCombustion": {"title": "Methalox Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Methane splits the difference: colder than kerosene, denser than hydrogen, clean-burning and one day makeable on Mars. The LRBE is the tree's first methalox engine — a staged-combustion booster on a fuel nobody flew yet, the seed of a lane that a later era will grow into.", "parts": [{"name": "ROE-BE4", "mod": "ROEngines", "title": "BE-4"}, {"name": "rmm_arenysaurus", "mod": "RocketMotorMenagerie", "title": "LRBE"}], "upgrades": [], "grants": []}, "pc_multiChamberORSC": {"title": "High-Thrust Multi-Chamber ORSC", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Oxidiser-rich staged combustion hits its ceiling. The RD-170 — four chambers off one turbopump, 7900 kilonewtons — is the most powerful liquid-propellant engine ever built, the monster that lifts Energia and Zenit. Where the N1's engines never flew and Zenit's was only an upper, this is the chemistry's operational record.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "YF100_Engine-double-withShell2", "mod": "KerwisChineseAerospacePack", "title": "YF-100 with CZ-5 Boattail"}, {"name": "YF100_Engine_S", "mod": "KerwisChineseAerospacePack", "title": "YF-100"}], "upgrades": [], "grants": []}, "pc_modularORSC": {"title": "Modular Oxidiser-Rich Kerolox", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The record engine gets cut into pieces you can sell. Halve the RD-170's four chambers and you have the RD-180 for Atlas; quarter it and you have the single-chamber Angara engine. Same core hardware, packaged into a modular family for the export and commercial market.", "parts": [{"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-RD191", "mod": "ROEngines", "title": "RD-191"}], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RD-120K", "RFUpgrade_RD-171", "RFUpgrade_RD-171M", "RFUpgrade_RD-172-173", "RFUpgrade_RD-191", "RFUpgrade_YF-100K"], "grants": []}, "pc_modularORSCII": {"title": "Modular Kerolox Re-Sizing", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Cut the same modular RD-170 hardware into two more shapes — a lighter single-chamber mark for a smaller booster, and an export version re-plumbed for someone else's pad.", "parts": [], "upgrades": ["RFUpgrade_AJ26-59", "RFUpgrade_RD-181", "RFUpgrade_RD-193"], "grants": []}, "pc_operationalStorableORSC": {"title": "Operational Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The storable staged-combustion engines of Proton and its kin reach their final operational marks — the RD-275 first stage, the Kosberg upper stages — the last refinements of a hypergolic booster line that has been flying since the sixties.", "parts": [], "upgrades": ["RFUpgrade_RD-0210-Mk3", "RFUpgrade_RD-0212-Mk3", "RFUpgrade_RD-0213-Mk3", "RFUpgrade_RD-253-Mk4", "RFUpgrade_RD-254-11D44-Mk3", "RFUpgrade_RD-254-11D44-Mk4", "RFUpgrade_RD-275", "RFUpgrade_RD-277-14D16"], "grants": []}, "fd_multiRestartStorableUpper": {"title": "Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Coast, reignite, coast again — dozens of times, across days. The Fregat and Briz upper stages and their kin are storable propulsion modules built for the choreography of an interplanetary or multi-orbit mission, restarting on demand where the single-shot Agena and early AJ10 could not. The Transtar rates five hundred ignitions.", "parts": [{"name": "ROE-AJ10-transtar", "mod": "ROEngines", "title": "AJ23 Transtar"}, {"name": "ROE-AJ10AdvLong", "mod": "ROEngines", "title": "AJ10 Series (Advanced Long Nozzle)"}, {"name": "ROE-S592", "mod": "ROEngines", "title": "S5.92"}, {"name": "ROE-S598M", "mod": "ROEngines", "title": "S5.98M"}, {"name": "restock-engine-125-pug", "mod": "ReStockPlus", "title": "Aestus"}], "upgrades": ["RFUpgrade_AJ10-118F"], "grants": []}, "fd_multiRestartStorableUpperII": {"title": "Further-Refined Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Aestus keeps pace with the rest of the multi-restart storable family — a modified chamber, then a second-generation successor, the same choreography refined one mark further.", "parts": [], "upgrades": ["RFUpgrade_AJ10-156", "RFUpgrade_Aestus-II", "RFUpgrade_AestusMod", "RFUpgrade_Model8096A"], "grants": []}, "fd_keroloxClusterCeiling": {"title": "Kerolox Cluster Thrust Ceiling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Keep pushing the same gas-generator chamber past where its designers stopped. Injector face, throat erosion and the gas generator's own turbine all start arguing at once, and each further ten percent costs a qualification programme of its own.", "parts": [], "upgrades": ["RFUpgrade_E-1-575k", "RFUpgrade_H-1-250K", "RFUpgrade_H-2-250K"], "grants": []}, "fd_keroloxClusterApex": {"title": "Kerolox Cluster Apex", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The last version anyone built of an engine that had been uprated for twenty years. Nothing here is elegant — it is a mature design run as hard as its metallurgy allows, kept in production because the vehicle around it was already qualified.", "parts": [], "upgrades": ["RFUpgrade_E-1-Upgrade2", "RFUpgrade_H-2-300K"], "grants": []}, "fd_terminalGasGenKerolox": {"title": "Terminal Gas-Generator Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The gas-generator kerolox engines that built the space age take their final bow. The last production marks of Delta's RS-27, Atlas's RS-56 and Titan's LR87/LR91 — a lineage of open-cycle workhorses being uprated one last time as staged combustion walks past them.", "parts": [], "upgrades": ["RFUpgrade_E-1A_KS", "RFUpgrade_LR101-NA-15", "RFUpgrade_LR87-AJ-11A", "RFUpgrade_LR91-AJ-11A", "RFUpgrade_Model8096C", "RFUpgrade_RS-27A", "RFUpgrade_RS-56-OBA", "RFUpgrade_RS-56-OSA"], "grants": []}, "fd_advancedGasGenKerolox": {"title": "Advanced Gas-Generator Kerolox Booster", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "America's answer to the imported RD-180 that never got built. The STBE was a big, simple gas-generator kerolox booster engine drawn for the next launcher — the domestic alternative to buying Russian staged combustion, shelved when the RD-180 won on price.", "parts": [{"name": "cryoengine-allosaur-1", "mod": "CryoEngines", "title": "STBE-3"}, {"name": "nflv-engine-stbe-kero-1", "mod": "NearFutureLaunchVehicles", "title": "STBE (Pratt \u0026 Whitney)"}, {"name": "rmm_turiasaurus", "mod": "RocketMotorMenagerie", "title": "STBE (Pratt \u0026 Whitney)"}], "upgrades": [], "grants": []}, "pc_filamentWoundSolid": {"title": "Filament-Wound Composite-Case Solids", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Wind the motor case out of graphite and epoxy instead of forging it from steel, and the dead weight falls away. The filament-wound composite case — on the giant SRMU, the standalone Castor 120, the Titan solids — is the material leap past the heavy segmented steel of the Shuttle booster, more impulse for less structure.", "parts": [{"name": "ROE-1208sepMotor", "mod": "ROEngines", "title": "UA1208 Nosecone \u0026 Separation Motor"}, {"name": "ROE-Castor120", "mod": "ROEngines", "title": "Castor 120"}, {"name": "ROE-Castor30", "mod": "ROEngines", "title": "Castor 30A"}, {"name": "ROE-Castor30XL", "mod": "ROEngines", "title": "Castor 30XL"}, {"name": "ROE-SRMU", "mod": "ROEngines", "title": "SRMU"}, {"name": "ROE-UA1208", "mod": "ROEngines", "title": "UA1208"}], "upgrades": ["RFTech-solids-tltech4", "RFTech-solids-tltech6", "RFTech-solids-tltech7", "RFUpgrade_FWC-SRM", "RFUpgrade_RSRM-1986"], "grants": []}, "pc_gemStrapOnCatalog": {"title": "Graphite-Epoxy Strap-On Catalog", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The commercial strap-on aisle. Bolt on as many graphite-epoxy motors as the payload needs — the Delta GEM family in three lengths, the Atlas AJ-60 — a fixed catalogue of composite boosters sized to order off the composite-case breakthrough.", "parts": [{"name": "ROE-AJ60", "mod": "ROEngines", "title": "AJ-60A"}, {"name": "ROE-GEM40", "mod": "ROEngines", "title": "GEM 40"}, {"name": "ROE-GEM46", "mod": "ROEngines", "title": "GEM 46"}, {"name": "ROE-GEM60", "mod": "ROEngines", "title": "GEM 60"}, {"name": "ROE-GEM63", "mod": "ROEngines", "title": "GEM 63"}], "upgrades": [], "grants": []}, "ep_operationalHall": {"title": "Operational Hall-Effect Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "The Hall thruster leaves the laboratory. The SPT-100 and its bigger siblings become flight-qualified hardware, first for stationkeeping and then as primary propulsion — a few grams-force of thrust at sixteen hundred seconds of Isp, the electric workhorse of the coming decades.", "parts": [{"name": "RO-PPS1350", "mod": "NearFuturePropulsion", "title": "PPS-1350 Hall Effect Thruster"}, {"name": "RO-SPT100", "mod": "NearFuturePropulsion", "title": "SPT-100 Hall Effect Thruster"}, {"name": "RO-SPT140", "mod": "NearFuturePropulsion", "title": "SPT-140 Hall Effect Thruster"}], "upgrades": ["RFUpgrade_457M-V1-K", "RFUpgrade_SPT-50M", "RFUpgrade_SPT-70M", "RFUpgrade_SPT-70MK"], "grants": []}, "ep_highPowerHall": {"title": "High-Power Nested Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Scale the Hall thruster into the tens of kilowatts. The 457M's nested channels swallow seventy-two kilowatts and push the Isp past two thousand seconds — the class of electric engine that could one day move cargo rather than just trim an orbit.", "parts": [{"name": "RO-457M", "mod": "NearFuturePropulsion", "title": "457M 72kW Hall Effect Thruster"}], "upgrades": ["RFUpgrade_PITV-Hydrazine-40", "RFUpgrade_SPT-100B", "RFUpgrade_SPT-100D", "RFUpgrade_SPT-100M", "RFUpgrade_SPT-140D"], "grants": []}, "ep_griddedIon": {"title": "Gridded Ion Electrostatic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "A different way to throw ions: accelerate them through charged grids instead of a magnetic field, and the exhaust speed climbs higher still. NSTAR flew on Deep Space 1 — the first time an ion engine, not a chemical rocket, was the main drive of a probe to another world.", "parts": [{"name": "ionEngine", "mod": "Squad", "title": "NSTAR Gridded Ion Thruster"}], "upgrades": [], "grants": []}, "ep_pulsedInductive": {"title": "Pulsed Inductive Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "No electrodes to erode — a pulsed magnetic field ionises and flings a puff of ammonia, and repeats thousands of times a second. The PIT reaches seven thousand seconds of Isp, an experimental high-power concept for the kind of cruise no chemical stage could sustain.", "parts": [{"name": "RO-nupit", "mod": "NearFuturePropulsion", "title": "NuPIT Pulsed Inductive Thruster"}, {"name": "pit-0625", "mod": "NearFuturePropulsion", "title": "FARAD Pulsed Inductive Thruster"}, {"name": "pit-125", "mod": "NearFuturePropulsion", "title": "PIT Mk Va Pulsed Inductive Thruster"}], "upgrades": [], "grants": []}, "ep_pulsedInductiveII": {"title": "Higher-Energy Pulsed Inductive Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "The same electrodeless pulse scaled up — more energy per pulse, a heavier propellant puff, chasing higher thrust from the same repetitively-pulsed magnetic field.", "parts": [], "upgrades": ["RFUpgrade_NuPIT-7000", "RFUpgrade_PITV-Ammonia-1200", "RFUpgrade_PITV-Hydrazine-1200"], "grants": []}, "nuc_flightDesignNTR": {"title": "Flight-Design Solid-Core NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The nuclear rocket stops being a ground-test article and becomes a flight design. The Soviet RD-0410 was actually built and fired; NERVA II is the largest solid-core engine ever drawn. The end of the solid-core line — reactors meant, at last, to leave the ground.", "parts": [{"name": "RD0410MID", "mod": "Squad", "title": "RD-0410"}, {"name": "ROE-NERVAII", "mod": "ROEngines", "title": "NERVA II"}, {"name": "restock-engine-cherenkov", "mod": "ReStockPlus", "title": "RD-0410"}], "upgrades": [], "grants": []}, "nuc_particleBedNTR": {"title": "Particle-Bed NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Pack the reactor fuel as loose particles instead of solid rods and the coolant can pull heat out far faster — more power in less core. The particle-bed NTR of the Timberwind program is a denser, hotter path to the same nuclear thrust.", "parts": [{"name": "ROE-SNTPPFE100", "mod": "ROEngines", "title": "SNTP-PFE100 Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_advancedCoreNTR": {"title": "Advanced-Core NTR Concepts", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Let the fuel melt, or turn to gas, and the temperature ceiling — and the Isp — rises with it. The liquid-core NTR reaches fourteen hundred seconds; the low-pressure gas-core start pushes further. Engineering fiction for now, and the doorway to the gas-core lane a later era will open.", "parts": [{"name": "RO-KA-LRCNTR", "mod": "KerbalAtomics", "title": "Lewis Research Center LNTR"}, {"name": "ntr-gc-25-1", "mod": "KerbalAtomics", "title": "Low-Pressure NTR"}], "upgrades": ["RFUpgrade_PrincetonLNTR-WCH", "RFUpgrade_SNTPPFE100-Hydrogen"], "grants": []}, "av_vtolVectoredTurbofan": {"title": "Vectored-Thrust VTOL Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Point the thrust down and a fighter takes off with no runway. The R-79's swivelling nozzle lifts the Yak-141 vertically then rotates aft for supersonic flight, the lift jets handling the hover t takes both ends at once: an onboard transponder that transmits on the new band, and a DSN dish upgraded to hear it. Voyager flew its whole grand tour home on X-band.", "parts": [], "upgrades": ["commsTL5"], "grants": ["RP0Level6TrackingStation"]}, "tel_kaBandDownlink": {"title": "Ka-Band High-Rate Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Climb the band again, from X to Ka — near four times the frequency once more, the beam tightening to a needle and the data rate leaping with it. The band a modern flagship saves for its high-rate science: the step from an X-band trickle to a torrent, on a carrier so narrow the dish must be aimed to a hair.", "parts": [], "upgrades": ["commsTL6"], "grants": ["RP0Level7TrackingStation"]}, "tel_concatenatedCoding": {"title": "Concatenated Channel Coding", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Stop reaching for a bigger dish and start encoding smarter: wrap a Reed-Solomon block code around a convolutional inner code and the receiver rebuilds bits it would once have lost in the hiss — coding gain worth more than doubling the antenna. The same hardware suddenly carries several times the data, for the price of arithmetic. Voyager came home this way.", "parts": [], "upgrades": ["commsTL7"], "grants": ["RP0Level8TrackingStation"]}, "tel_antennaArraying": {"title": "Ground-Station Antenna Arraying", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Phase a whole field of ground dishes together and they act as one impossible aperture — a 70-metre giant and a cluster of 34-metre beam-waveguide antennas combined to hear a probe going quiet at the edge of the Solar System. When Voyager reached Neptune, it took the whole array to keep the pictures coming.", "parts": [], "upgrades": ["commsTL8"], "grants": ["RP0Level9TrackingStation"]}, "tel_bandwidthEfficientModulation": {"title": "Bandwidth-Efficient Modulation", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Spectrum is finite and crowded, so pack more bits into every hertz of it — shaped, suppressed-carrier schemes and modern low-density coding that push the link toward its theoretical limit instead of simply shouting louder. The efficient radio a whole fleet of spacecraft can share without drowning one another out.", "parts": [], "upgrades": ["commsTL9"], "grants": ["RP0Level10TrackingStation"]}, "tel_opticalDownlink": {"title": "Optical Deep-Space Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "Leave radio behind and modulate a laser: an optical carrier tens of thousands of times higher in frequency than X-band, packing orders of magnitude more data onto a beam so tight it must be pointed to the arc-second across light-minutes of empty space. The downlink of the present frontier — flown from lunar orbit, and now from the asteroid belt.", "parts": [], "upgrades": ["commsTL10"], "grants": ["RP0Level11TrackingStation"]}, "tel_deepSpaceProbeAntennas": {"title": "Deep-Space Probe Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "A parabolic dish or omni cut to one bus family's own link budget — Pioneer's spin-scan dish, Voyager's high-gain reflector, the 4MV's own array and dish, GPS's simple omni. The named-hardware shelf, one entry per flagship mission.", "parts": [{"name": "ca_ant_gps", "mod": "CoatlAerospace", "title": "CA-GPS Omnidirectional Antenna"}, {"name": "ca_vor_comm", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus Antenna Array"}, {"name": "ca_vor_dish", "mod": "CoatlAerospace", "title": "4MV-1 Spacecraft Bus Parabolic Antenna"}, {"name": "dish_L", "mod": "CoatlAerospace", "title": "Voyager 1 \u0026 2 Parabolic Antenna"}, {"name": "dish_quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10 \u0026 11 Parabolic Antenna"}], "upgrades": [], "grants": []}, "tel_largeApertureReflectors": {"title": "Large-Aperture Reflector Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "The same parabolic-reflector mechanism, scaled past what any single mission needs — giant, huge and large dish reflectors off the shelf for whatever downlink budget the mission calls for.", "parts": [{"name": "nfex-antenna-reflector-giant-1", "mod": "NearFutureExploration", "title": "RFL-2000 Dish Reflector Array"}, {"name": "nfex-antenna-reflector-huge-1", "mod": "NearFutureExploration", "title": "RFL-100 Giant Dish Reflector"}, {"name": "nfex-antenna-reflector-large-1", "mod": "NearFutureExploration", "title": "RFL-50 Large Dish Reflector"}], "upgrades": [], "grants": []}, "mic_gasChromatographMassSpec": {"title": "Gas Chromatograph-Mass Spectrometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Separate a gas sample by how fast each component moves through a column, then weigh what comes out in the mass spectrometer behind it — two instruments in series reading a single sample far more precisely than either alone.", "parts": [{"name": "SXTsciencenosecone", "mod": "SXT", "title": "GC-MS + Antenna"}, {"name": "sensorAtmosphere", "mod": "Squad", "title": "MS04 - Gas Chromatograph-Mass Spectrometer (GC/MS)"}], "upgrades": [], "grants": []}, "opt_digitalImaging": {"title": "Solid-State Digital Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Replace the vidicon's scanned electron beam with a solid-state sensor read out electronically, line by line — the same instinct that took reconnaissance from film to television, one generation further. Higher resolution than any vidicon, and nothing left to wear out or burn in.", "parts": [{"name": "RO-DigitalCamera", "mod": "RP-1", "title": "PH05 - Ultra Resolution Digital Imaging Camera"}], "upgrades": [], "grants": []}, "fd_reusableOMSEngine": {"title": "Reusable Orbital-Maneuvering Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Take the pressure-fed multi-restart engine that once had to fire once, perfectly, on the way to the Moon, and shrink it into a routine orbital-maneuvering thruster — sized for a dozen burns a mission instead of one, flown on the same shape for decades after. The Shuttle's OMS, and the same lineage still flying on Orion.", "parts": [{"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": [], "grants": []}, "cryo_toroidalAerospikeNozzle": {"title": "Toroidal Aerospike Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Bend the bell into an open ring around a truncated plug and let the atmosphere itself complete the nozzle — an annular chamber that keeps its thrust efficient from the pad to vacuum without ever changing shape. Ground-tested for a shortened Saturn upper stage that was never built.", "parts": [{"name": "ROE-J2T", "mod": "ROEngines", "title": "J-2T"}], "upgrades": [], "grants": []}, "cryo_toroidalAerospikeNozzleII": {"title": "Uprated Toroidal Aerospike Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "The same annular aerospike, pushed to a longer burn and higher chamber pressure — the J-2T's own final study mark before the program quietly ended.", "parts": [], "upgrades": ["RFUpgrade_J-2T-250K"], "grants": []}, "pc_fluorineOxidizerChemistry": {"title": "Fluorine Oxidizer Chemistry", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Trade nitrogen tetroxide for liquid fluorine e, "flavor": "Skip both the Hall channel and the ion grid — drive a plasma arc straight through an electromagnetic pinch and let the field itself do the accelerating. High power density, real hardware, and a genuinely different mechanism from anything else this tree calls electric propulsion.", "parts": [{"name": "mpdt-125", "mod": "NearFuturePropulsion", "title": "SX3 MPD Thruster"}], "upgrades": [], "grants": []}, "ep_variableSpecificImpulsePlasma": {"title": "Variable-Specific-Impulse Plasma Rocket", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "RF-heat a plasma instead of arcing through it, then steer it out through a magnetic nozzle — and unlike every other electric thruster in this tree, trade thrust for Isp continuously, in flight, instead of picking one number at build time.", "parts": [{"name": "vasimr-0625", "mod": "NearFuturePropulsion", "title": "VX-200SS VASIMR"}, {"name": "vasimr-125", "mod": "NearFuturePropulsion", "title": "VF-200 VASIMR"}], "upgrades": [], "grants": []}, "ep_variableSpecificImpulsePlasmaII": {"title": "Krypton-Fuelled Variable-Isp Plasma Rocket", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "Swap the VASIMR's working gas from argon to krypton — denser propellant, a further tuned exhaust velocity, the same RF-heated plasma and magnetic nozzle.", "parts": [], "upgrades": ["RFUpgrade_VF-200-Kr", "RFUpgrade_VX-200SS-Kr"], "grants": []}, "nuc_bimodalNTR": {"title": "Bimodal Nuclear Thermal + Power", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "The same reactor that heats propellant for thrust keeps running between burns as a power source — real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry.", "parts": [{"name": "ROE-BNTR", "mod": "ROEngines", "title": "Bimodal NTR"}], "upgrades": ["RFUpgrade_LPNTR-3600HP"], "grants": []}, "nuc_fissionFragmentRocket": {"title": "Fission-Fragment Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "Let the fission fragments themselves be the exhaust — no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach.", "parts": [{"name": "RO-fftdustyplasmaffre", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Fission Fragment Rocket Engine"}, {"name": "fft-ffre-plasma-1", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Afterburning Fission Fragment Rocket Engine"}], "upgrades": [], "grants": []}, "nuc_magneticFusionPulsePropulsion": {"title": "Magnetically-Confined Fusion Pulse Drive", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 5650, "anyToUnlock": false, "flavor": "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate — Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion.", "parts": [{"name": "RO-fft20mMMO", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Drive"}, {"name": "fft-fission-zpinch-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Drive"}], "upgrades": [], "grants": []}, "nuc_nuclearSaltWaterRocket": {"title": "Nuclear Salt Water Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 5650, "anyToUnlock": false, "flavor": "Dissolve fissile salts in water and let the mixture go critical continuously as it streams through the chamber — the reactor doesn't heat the propellant, the reactor IS the propellant. The wildest, most engineering-fiction concept in the curated set.", "parts": [{"name const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
