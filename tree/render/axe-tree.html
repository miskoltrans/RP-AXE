<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

const DATA={"start": {"title": "Start", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 0, "cost": 0, "anyToUnlock": false, "flavor": "1950. Kerbalkind is united; the universe is blind without us.", "parts": [], "upgrades": []}, "soundingRocketry": {"title": "Spin-Stabilized Sounding Rockets", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Fin-and-spin powder rockets loft the first instrument packages above the Karman line. (Rocket start; the X-plane root lives in Aerodynamics, off-slice.)", "parts": [{"name": "PioneerVernier", "mod": "ROEngines", "title": "Pioneer Adjustment Motor"}], "upgrades": []}, "pc_ethanolLox": {"title": "Ethanol/LOX Film-Cooled Combustion", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry.", "parts": [], "upgrades": []}, "pc_keroseneHydrotreating": {"title": "Hydrotreated Narrow-Cut Kerosene (RP-1)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. Homes the simplest early kerolox; the harder kerolox engines mature in Fluid Dynamics and Metallurgy.", "parts": [{"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}], "upgrades": []}, "pc_apcpGrain": {"title": "Aluminized AP/HTPB Composite Grain", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidizer and aluminum powder bound in hydroxyl-terminated polybutadiene, cast and cured into a structural grain. The propellant chemistry, not the casing, is the headline here.", "parts": [{"name": "MassiveBooster", "mod": "Squad", "title": "RSRMV"}], "upgrades": []}, "pc_hypergolicChemistry": {"title": "Self-Igniting Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Fuels that detonate on contact with their oxidizer — no igniter, indefinite restarts, storable for years. The entire difficulty is chemistry and corrosion: handling hydrazines and nitric oxidizers that attack everything. The chemistry of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-AJ10-137", "mod": "ROEngines", "title": "AJ10-137 (Service Propulsion System)"}], "upgrades": []}, "pc_cryoLiquefaction": {"title": "Claude-Cycle H2/O2 Liquefaction", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Industrial Claude-cycle plants liquefy hydrogen and oxygen by the ton. You can now MAKE deep cryogens; STORING and flying them is Cryogenics' problem next door (a convergence).", "parts": [], "upgrades": []}, "pc_storableOxidizers": {"title": "Passivated MON/NTO Storable Oxidizers", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Mixed oxides of nitrogen and passivated dinitrogen tetroxide: denser, higher-performing, marginally less murderous storables for mature service propulsion.", "parts": [{"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": []}, "met_earlyAlloys": {"title": "Aluminum Isogrid \u0026 Maraging-Steel Cases", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Chemically-milled isogrid aluminum for light pressure vessels; ultra-high-strength maraging steel for solid-motor cases and pump housings. The structural backbone everything else bolts to.", "parts": [], "upgrades": []}, "met_oxRichSuperalloys": {"title": "Oxidizer-Rich Preburner Superalloys", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "For decades the West held that an oxygen-rich preburner would simply burn through any turbine. Soviet metallurgy disproved it: chrome-nickel alloys with burn-passivated surfaces survive hot, oxygen-rich gas, unlocking the most efficient kerolox engines ever flown. THE engine that metallurgy unlocks.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}], "upgrades": []}, "fd_turbopumps": {"title": "Inducer-Stabilized Cryogenic Turbopumps", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Move propellant by the ton per second without cavitating the pump. An axial inducer ahead of the centrifugal impeller suppresses cavitation at low inlet pressure — the enabling piece of every high-thrust engine.", "parts": [], "upgrades": []}, "fd_combustionStability": {"title": "Baffled-Injector Combustion-Instability Suppression", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Tangential acoustic modes can couple to combustion and tear a large chamber apart in milliseconds. Injector baffles and tuned cavities damp them. Taming this — not the fuel — is why the F-1 took years and why it lives in Fluid Dynamics.", "parts": [{"name": "ROE-F1", "mod": "ROEngines", "title": "F-1"}, {"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_F-1-1.52M", "RFUpgrade_F-1A"]}, "th_regenCooling": {"title": "Regenerative Forced-Convection Wall Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before burning it, carrying away heat flux that would melt any uncooled metal. The thermodynamics that lets a chamber run hotter than its own melting point.", "parts": [], "upgrades": []}, "cryo_loxHandling": {"title": "Subcooled LOX Densification", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Hold oxygen below its boiling point: vacuum-jacketed lines, careful materials, and the operational discipline to load minutes before launch. Subcooling buys density — more propellant in the same tank.", "parts": [], "upgrades": []}, "cryo_lh2Insulation": {"title": "Multilayer Vacuum Insulation for LH2", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Hydrogen boils at -253 C and diffuses through metal lattices. Dozens of radiation-shield layers under vacuum make hydrolox — the highest specific impulse chemistry there is — actually flyable. The J-2 lives here, fed by Chemistry's cryogen supply.", "parts": [{"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": []}, "cryo_stagedHydrolox": {"title": "Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Burn every gram twice: a fuel-rich preburner drives the turbopumps, then the exhaust is fully combusted in the chamber. The RS-25 needs both deep-cryo hydrogen handling AND reusable hot-section superalloys — a convergence of Cryogenics and Metallurgy.", "parts": [{"name": "ROE-RS25", "mod": "ROEngines", "title": "RS-25 (SSME)"}], "upgrades": []}, "cryo_zbo": {"title": "Reverse-Brayton Zero-Boiloff Cryocooling", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A closed reverse-Brayton cryocooler actively pumps heat out of the tank, driving boiloff to zero — if you can spare the kilowatts. Multi-year outer-planet cryo stages stop bleeding propellant.", "parts": [], "upgrades": []}, "tel_pcmTelemetry": {"title": "PCM/FM Telemetry Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it, a failure tells you nothing about why.", "parts": [], "upgrades": []}, "tel_helicalDirectional": {"title": "Helical Directional Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Axial-mode helices give circularly-polarized gain that tolerates a tumbling spacecraft — range and data rate at the cost of having to point.", "parts": [{"name": "HighGainAntenna5_v2", "mod": "Squad", "title": "HG-5 Retractable Parabolic Antenna"}], "upgrades": []}, "tel_cassegrainHGA": {"title": "Cassegrain Parabolic High-Gain Reflector", "discipline": "Telecommunications", "color": "#4361ee", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A subreflector folds the feed back through the dish vertex, shortening the assembly and closing the link from lunar distance. Apollo talked home through one.", "parts": [{"name": "HighGainAntenna", "mod": "Squad", "title": "1.25m Retractable Parabolic Antenna"}, {"name": "ROC-ApolloHGABDB", "mod": "ROCapsules", "title": "Apollo High Gain Antenna (HGA)"}], "upgrades": []}, "tel_dsnRanging": {"title": "Coherent Two-Way Doppler \u0026 Ranging", "discipline": "Telecommunications", "color": "#4361ee", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Phase-coherent ground dishes pull a few bits per second out of interplanetary noise and, from the round-trip Doppler, fix the spacecraft's state vector to meters.", "parts": [], "upgrades": []}, "tel_phasedArray": {"title": "Electronically-Steered Phased Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Steer the beam by element phasing, no moving parts. Higher rates, graceful degradation, the backbone of a relay constellation.", "parts": [], "upgrades": []}, "ext_powerGrid": {"title": "Kilowatt-Class Regulated Power Bus", "discipline": "Electrical Power", "color": "#ffd166", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "High-voltage regulated distribution that turns raw array watts into the kilowatts cryocoolers and electric thrusters actually demand. The grid that gates heavy payloads.", "parts": [], "upgrades": []}, "met_weldedSteel": {"title": "Welded Steel Pressure Vessels", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Roll, weld and proof-test mild-steel cylinders that hold pressure without bursting. The first tank that flies.", "parts": [], "upgrades": []}, "met_chemMilling": {"title": "Chemical Milling \u0026 Isogrid", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Etch away everything that isn't load path, leaving a triangular-rib isogrid skin — stiffness at a fraction of the mass.", "parts": [], "upgrades": []}, "met_vacuumInductionMelting": {"title": "Vacuum Induction Melting", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Melt under vacuum to strip dissolved gases and inclusions, casting the clean nickel-base superalloys that hot sections demand.", "parts": [], "upgrades": []}, "met_titaniumForming": {"title": "Superplastic Titanium Forming", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Heat titanium until it flows like taffy and form one-piece, diffusion-bonded structures — strong, light, corrosion-proof.", "parts": [], "upgrades": []}, "met_vacuumArcRemelting": {"titl  "parts": [], "upgrades": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Nitrocellulose gelled with nitroglycerine burns hotter and cleaner than powder — the smokeless propellant of early missiles.", "parts": [], "upgrades": []}, "pc_hydrogenPeroxide": {"title": "High-Test Peroxide (HTP)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Concentrated peroxide decomposes over a silver catalyst into hot steam and oxygen — monopropellant gas generators and soft-start oxidiser.", "parts": [], "upgrades": []}, "pc_castableComposite": {"title": "Castable AP/Al Composite Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Cast and cure a meganewton-class grain directly into a segmented case — the chemistry of the largest boosters ever flown.", "parts": [{"name": "RO-RSRM", "mod": "Squad", "title": "RSRM"}], "upgrades": []}, "pc_greenMonoprop": {"title": "Green Monopropellants", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Ionic-liquid blends (LMP-103S, AF-M315E) match hydrazine's performance without the lethal toxicity — safer satellite propulsion.", "parts": [], "upgrades": []}, "pc_gelledPropellant": {"title": "Gelled Hypergolic Propellants", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Thicken storables to a gel that won't slosh or leak yet still flows when throttled — restartable, safer high-density propulsion.", "parts": [], "upgrades": []}, "pc_methalox": {"title": "Methane Liquefaction \u0026 Methalox", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Liquid methane: clean-burning, coke-free, ering", "discipline": "Resource Engineering", "color": "#b08968", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Concentrate and sinter raw regolith into feedstock and bricks — the first step from dirt toward parts and shielding.", "parts": [], "upgrades": []}, "res_metalExtraction": {"title": "In-Situ Metal Extraction", "discipline": "Resource Engineering", "color": "#b08968", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Molten-regolith electrolysis pulls iron, aluminium and oxygen out of the dirt itself — structural metal without a launch.", "parts": [{"name": "kerbalism-ISRU", "mod": "KerbalismConfig", "title": "ISRU"}], "upgrades": []}, "res_propellantDepot": {"title": "Orbital Propellant Depots", "discipline": "Resource Engineering", "color": "#b08968", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Aggregate, store and transfer cryogens on orbit so missions launch dry and tank up — the logistics keystone of deep space.", "parts": [], "upgrades": []}, "res_atmosphericMining": {"title": "Atmospheric \u0026 Gas-Giant Mining", "discipline": "Resource Engineering", "color": "#b08968", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Scoop and separate gases from a planet's air on the fly — hydrogen and helium harvested without ever landing.", "parts": [], "upgrades": []}, "res_closedLoopFab": {"title": "Closed-Loop In-Situ Fabrication", "discipline": "Resource Engineering", "color": "#b08968", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Mine, refine, print and assemble entirely off-world, recycling scrap — a foothold that builds the next foothold.", "parts": [], "upgrades": []}, "res_heliumMining": {"title": "Helium-3 Extraction", "discipline": "Resource Engineering", "color": "#b08968", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Separate the rare fusion isotope from regolith or gas-giant atmosphere — the propellant of an ambitious, far-future endgame.", "parts": [], "upgrades": []}, "fd_pressureFed": {"title": "Pressure-Fed Feed Systems", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Push propellant with tank pressure alone — no pump, no turbine. Simple, restartable, and limited to low chamber pressure.", "parts": [], "upgrades": []}, "fd_gasGenerator": {"title": "Gas-Generator (Open) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Burn a little propellant in a side chamber to spin the turbopump, then dump the turbine exhaust overboard. Simple, proven, slightly wasteful.", "parts": [], "upgrades": []}, "fd_expanderCycle": {"title": "Expander Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, thrust-limited by heat pickup.", "parts": [], "upgrades": []}, "fd_tapOffCycle": {"title": "Combustion Tap-Off Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Bleed hot gas straight from the main chamber to spin the turbine — one combustion zone, no separate gas generator.", "parts": [], "upgrades": []}, "fd_stagedCombustion": {"title": "Staged-Combustion (Closed) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Burn the turbine drive gas, then route it into the main chamber to burn again — nothing wasted, chamber pressure soars, plumbing turns brutal.", "parts": [], "upgrades": []}, "fd_aerospike": {"title": "Altitude-Compensating Aerospike Nozzles", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Let the exhaust's outer edge follow ambient pressure so one engine stays efficient from sea level to vacuum.", "parts": [], "upgrades": []}, "fd_deepThrottle": {"title": "Deep-Throttle \u0026 Reliable Restart", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Hold stable combustion from full thrust down to a fraction of it, and relight on demand — the prerequisite for propulsive landing.", "parts": [], "upgrades": []}, "fd_fullFlowStaged": {"title": "Full-Flow Staged Combustion", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Two preburners, oxidiser-rich and fuel-rich, drive separate turbopumps and feed only warm gas to the seals. The highest-pressure, most reusable cycle there is.", "parts": [], "upgrades": []}, "fd_dualBell": {"title": "Dual-Bell \u0026 Extendible Nozzles", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A two-mode bell or a deployable extension recovers altitude performance without an aerospike's cooling headache.", "parts": [], "upgrades": []}, "fd_rotatingDetonation": {"title": "Rotating Detonation Engines", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Replace steady deflagration with a detonation wave chasing itself around an annulus — a theoretical efficiency jump, a practical nightmare to cool.", "parts": [], "upgrades": []}, "th_filmCooling": {"title": "Film \u0026 Curtain Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Run a fuel-rich boundary layer along the chamber wall as a sacrificial cool film — the crude cooling that made the first big engines survivable.", "parts": [], "upgrades": []}, "th_ablativeCooling": {"title": "Ablative Chamber Liners", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Let a silica-phenolic liner char and erode away, carrying heat with it — cheap, disposable, and good for one burn.", "parts": [], "upgrades": []}, "th_passiveRadiators": {"title": "Passive Radiative Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Reject waste heat to space with coatings, louvers and surface geometry alone — the baseline thermal balance of every spacecraft.", "parts": [{"name": "ca_louver_m", "mod": "CoatlAerospace", "title": "CA-TCL8 Thermal Control Louver"}], "upgrades": []}, "th_heatPipes": {"title": "Heat-Pipe Thermal Transport", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Move heat passively across a vehicle on a capillary evaporation-condensation loop — no pump, no power, no moving parts.", "parts": [], "upgrades": []}, "th_pumpedLoop": {"title": "Pumped Fluid-Loop Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Circulate coolant to gather waste heat from across a large vehicle and dump it at the radiators — the thermal circulatory system of a station.", "parts": [], "upgrades": []}, "th_deployableRadiators": {"title": "Deployable Heat Rejection", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Fold large radiating area for launch, deploy it on orbit — the only way to reject the tens of kilowatts a reactor or big array produces.", "parts": [], "upgrades": []}, "th_cryocooler": {"title": "Mechanical Cryocoolers", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Actively pump heat down to cryogenic temperatures for detectors and zero-boiloff tanks — refrigeration where passive cooling can't reach.", "parts": [], "upgrades": []}, "th_dropletRadiator": {"title": "Liquid-Droplet Radiators", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Spray a sheet of hot droplets through space and recollect them cooled — megawatts of heat rejection at a fraction of panel mass.", "parts": [], "upgrades": []}, "cryo_basicCryoStorage": {"title": "Vacuum-Jacketed Cryo Storage", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A double-walled, vacuum-jacketed dewar that keeps a cryogen liquid for hours — the first step from a chemistry-lab curiosity to a propellant.", "parts": [], "upgrades": []}, "cryo_subcooling": {"title": "Propellant Sub-cooling Operations", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Chill below the boiling point on the pad for density and margin — the operational craft of flying colder than equilibrium.", "parts": [], "upgrades": []}, "cryo_orbitalTransfer": {"title": "Zero-g Cryo Propellant Transfer", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Settle, gauge and pump cryogens between tanks in free fall without vapour locking — the hard fluid mechanics behind depots and refuelling.", "parts": [], "upgrades": []}, "cryo_longDuration": {"title": "Long-Duration Cryo Storage", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Combine insulation, vapour cooling and active refrigeration to hold cryogens for years — the enabler of outer-planet cryo stages.", "parts": [], "upgrades": []}, "cryo_slush": {"title": "Slush-Hydrogen Handling", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A solid-liquid hydrogen slurry packs more mass and absorbs more heat before it boils — the densest practical hydrogen there is.", "parts": [], "upgrades": []}, "elec_silverZinc": {"title": "Silver-Zinc Primary Batteries", "discipline": "Electrical Power", "color": "#ffd166", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "High energy density for a single mission's hours — the battery that powered the first satellites and short crewed flights.", "parts": [], "upgrades": []}, "elec_fuelCell": {"title": "Alkaline Fuel Cells", "discipline": "Electrical Power", "color": "#ffd166", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "React hydrogen and oxygen to make electricity and drinkable water — days of power for crewed flight, no sunlight required.", "parts": [{"name": "FuelCell", "mod": "Squad", "title": "Fuel Cell"}], "upgrades": []}, "elec_siliconPV": {"title": "Silicon Photovoltaics", "discipline": "Electrical Power", "color": "#ffd166", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Doped silicon turns sunlight into watts indefinitely — the breakthrough that freed satellites from their batteries.", "parts": [{"name": "1x3SPanels", "mod": "VenStockRevamp", "title": "OX-2L 1x3 Photovoltaic Panels"}], "upgrades": []}, "elec_bodyMountedArrays": {"title": "Body-Mounted \u0026 Deployable Arrays", "discipline": "Electrical Power", "color": "#ffd166", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Tile a spacecraft's skin or fold out fixed panels for hundreds of watts — the workhorse power source of the satellite age.", "parts": [], "upgrades": []}, "elec_trackingArrays": {"title": "Solar Array Gimballing", "discipline": "Electrical Power", "color": "#ffd166", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Gimbal the arrays to face the sun continuously, multiplying usable power — and adding the first always-moving mechanism to fail.", "parts": [], "upgrades": []}, "elec_lithiumIon": {"title": "Lithium-Ion Secondary Cells", "discipline": "Electrical Power", "color": "#ffd166", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Rechargeable high-density cells that survive thousands of eclipse cycles — the modern storage behind every station and rover night.", "parts": [], "upgrades": []}, "elec_tripleJunction": {"title": "Triple-Junction GaAs Cells", "discipline": "Electrical Power", "color": "#ffd166", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Stack three bandgaps to catch more of the spectrum — nearly twice silicon's efficiency for power-hungry deep-space craft.", "parts": [], "upgrades": []}, "elec_concentratorPV": {"title": "Concentrator Photovoltaics", "discipline": "Electrical Power", "color": "#ffd166", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Focus sunlight onto small high-efficiency cells with mirrors or lenses — more watts per kilogram far from the sun.", "parts": [], "upgrades": []}, "elec_regenFuelCell": {"title": "Regenerative Fuel Cells", "discipline": "Electrical Power", "color": "#ffd166", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Run the fuel cell backwards on solar power to re-split the water — closed-loop energy storage for long lunar nights.", "parts": [], "upgrades": []}, "elec_flexibleArrays": {"title": "Flexible Roll-Out Solar Arrays", "discipline": "Electrical Power", "color": "#ffd166", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Unroll a thin-film blanket for tens of kilowatts at a fraction of rigid-panel mass — the power wings of large modern stations.", "parts": [], "upgrades": []}, "nuc_rtg": {"title": "Radioisotope Thermoelectric Generators", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A plutonium pellet's decay heat across a thermocouple gives steady watts for decades, anywhere, sunlight or not — the power of the outer planets.", "parts": [{"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}], "upgrades": []}, "nuc_rtgAdvanced": {"title": "GPHS Multi-Mission RTGs", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Modular general-purpose heat-source blocks make a rugged, standardised RTG — the quiet, reliable heartbeat of flagship deep-space probes.", "parts": [{"name": "RO-MMRTG", "mod": "Squad", "tit const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});

const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
