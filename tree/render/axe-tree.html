iroda Experiment Platform"}, {"name": "aquila_lab_s1p5_2", "mod": "Tantares", "title": "Priroda Laboratory"}, {"name": "ro_priroda_crew_s1p5_2", "mod": "Tantares", "title": "Priroda Crew Compartment 3"}], "upgrades": [], "grants": [], "experiments": [{"name": "BeaverCube", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "ECOSTRESS", "id": "", "sci": null, "group": "Laboratory Experiments"}, {"name": "GEDI", "id": "", "sci": null, "group": "Laboratory Experiments"}]}, "str_externalTrussStructure": {"title": "External Truss Structure", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Bolt an unpressurised scaffold onto the station instead of cramming everything inside a hull — a lattice to hang solar arrays, radiators and berthing ports from, structure that never needs to hold air. The adjustable mounting frames and radial berthing points that let a station grow module by module instead of launching whole.", "parts": [{"name": "sspx-adjusting-base-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Adjustable Base Frame"}, {"name": "sspx-adjusting-base-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Adjustable Base Frame"}, {"name": "sspx-adjusting-base-cradle-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Adjustable Base Cradle"}, {"name": "sspx-adjusting-base-cradle-25-1", "mod": "StationPartsExpansionRedux", "title": "4.5m Adjustable Base Cradle"}, {"name": "sspx-attach-125-1", "mod": "StationPartsExpansionRedux", "title": "2.25m Pressurized Radial Attachment Point"}, {"name": "sspx-attach-1875-1", "mod": "StationPartsExpansionRedux", "title": "3.38m Pressurized Radial Attachment Point"}, {"name": "truss-hex-01", "mod": "NearFutureConstruction", "title": "Hexa-Girder Modular Truss L1"}, {"name": "truss-hex-02", "mod": "NearFutureConstruction", "title": "Hexa-Girder Modular Truss M1"}, {"name": "truss-hex-03", "mod": "NearFutureConstruction", "title": "Hexa-Girder Modular Truss S1"}, {"name": "truss-hex-adapter-01", "mod": "NearFutureConstruction", "title": "Hexa-Girder Truss Adapter"}], "upgrades": [], "grants": [], "experiments": []}, "str_soforaTruss": {"title": "EVA-Assembled External Truss", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "A lattice tower built piece by piece by a spacewalking crew instead of arriving pre-built on a single launch — the first truss put together by hand in orbit, proving a station's own structure could grow past whatever fit under one payload fairing.", "parts": [{"name": "rana_mount_srf_1", "mod": "Tantares", "title": "Sofora / Rapana Girder Mount"}, {"name": "rana_truss_srf_1", "mod": "Tantares", "title": "Sofora / Rapana Girder A"}, {"name": "rana_truss_srf_2", "mod": "Tantares", "title": "Sofora / Rapana Girder B"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_stationBerthing": {"title": "Station Berthing Adapters", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "A new generation of station-joining hardware built for a permanent outpost instead of a single rendezvous — a dedicated berthing adapter for mating two different national programmes' hardware, androgynous ports that don't care which side is active, and the instruments riding along on the join itself.", "parts": [{"name": "ROC-ApolloAPAS75BDB", "mod": "ROCapsules", "title": "APAS-75 Androgynous Docking Port"}, {"name": "ROC-ApolloASTPAdapterBDB", "mod": "ROCapsules", "title": "Apollo-Soyuz Test Project Docking Module"}, {"name": "ROC-ApolloASTPUVXBDB", "mod": "ROCapsules", "title": "Apollo-Soyuz Test Project UV Absorbtion Experiment"}, {"name": "ROC-ApolloASTPVHFBDB", "mod": "ROCapsules", "title": "Apollo-Soyuz Test Project VHF-FM Antenna"}, {"name": "ROC-BigGeminiMOLPort", "mod": "ROCapsules", "title": "MOL Docking Mechanism"}, {"name": "mk2DockingPort", "mod": "Squad", "title": "Mk2 Clamp-O-Tron"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_largeReactionWheels": {"title": "Gimballed Momentum Exchange", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Stop changing the flywheel's speed and start tilting it instead. A rotor held at constant spin, swung on a gimbal, trades a small motion of the gimbal for a large torque on the spacecraft — the same momentum-exchange trick, but geared.", "parts": [{"name": "ca_rw_large", "mod": "CoatlAerospace", "title": "RW-4A Radial Reaction Wheel Assembly"}, {"name": "restock-reactionwheel-radial-1", "mod": "ReStockPlus", "title": "Radial Reaction Wheel (Large)"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_kilowattCMG": {"title": "Kilowatt-Class Momentum Exchange", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Feed the gimbal a kilowatt and it will hold a laboratory. At this scale the gyro stops being an instrument and becomes a consumer — the array that powers it is as much of the design as the rotor itself.", "parts": [{"name": "advSasModule", "mod": "Squad", "title": "Advanced Inline Stabilizer"}, {"name": "asasmodule1-2", "mod": "Squad", "title": "Advanced Reaction Wheel Module, Large"}], "upgrades": [], "grants": [], "experiments": []}, "rob_grappleEndEffector": {"title": "Robotic Grapple End-Effector", "discipline": "Robotics", "color": "#d98c2b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Close a powered claw around a grapple fixture instead of threading a docking port together by eye — the business end of a robotic arm, built to catch and hold a vehicle that never has to fly all the way in.", "parts": [{"name": "GrapplingDevice", "mod": "Squad", "title": "Advanced Grabbing Unit"}], "upgrades": [], "grants": [], "experiments": []}, "int_apolloBlockIII": {"title": "Extended-Duration Apollo Block III+", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Stretch the same Apollo stack for a mission measured in months instead of weeks — a bigger service module, a mission module bolted on for the extra volume a Skylab-length stay demands, and a high-gain antenna that can still find Earth from wherever the longer mission sends it. The same capsule, built to not come home so soon.", "parts": [{"name": "ROC-ApolloCMBDBBlockIII", "mod": "ROCapsules", "title": "Apollo Block III+ Command Module (CM)"}, {"name": "ROC-ApolloHGABlockIII", "mod": "ROCapsules", "title": "Apollo Block III High Gain Antenna"}, {"name": "ROC-ApolloMissionModule", "mod": "ROCapsules", "title": "Apollo Block III+ Mission Module"}, {"name": "ROC-ApolloSMBlockIII", "mod": "ROCapsules", "title": "Apollo Block III+ Service Module"}], "upgrades": [], "grants": [], "experiments": []}, "int_apolloBlockIV": {"title": "Station-Ferry Pressurised Can", "discipline": "Systems Integration", "color": "#ededed", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Fly the ferry with a bigger can. A larger lifter means the stack no longer has to fit the volume it carries into the space a lunar module used to occupy — a three-times-roomier pressurised module rides up in that slot instead, berthing through a full-size androgynous port, with the extra service-module propellant to push the added mass around.", "parts": [{"name": "ROC-ApolloMissionModule4", "mod": "ROCapsules", "title": "Apollo Block IV Mission Module"}, {"name": "ROC-ApolloSMDBDBlockIV", "mod": "ROCapsules", "title": "Apollo Block IV Service Module"}], "upgrades": [], "grants": [], "experiments": []}, "int_bigGeminiLogistics": {"title": "Enlarged Station-Logistics Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Scale the maneuvering capsule up from two seats to nine, or trade the crew for cargo entirely — Gemini's own OAMS-powered airframe, stretched into a ferry built to keep a station supplied rather than chase a target in orbit. Where Apollo forked toward the Moon, this is Gemini's other road: never flown, but the shape every later space-station taxi and cargo hauler still borrows from.", "parts": [{"name": "ROC-BigGeminiCabinBDB", "mod": "ROCapsules", "title": "Big G Crew Module"}, {"name": "ROC-BigGeminiDecoupler", "mod": "ROCapsules", "title": "Big G Service Module Decoupler"}, {"name": "ROC-BigGeminiDockingAdapter", "mod": "ROCapsules", "title": "Big G Docking Adapter"}, {"name": "ROC-BigGeminiNose", "mod": "ROCapsules", "title": "Big G Nose Fairing"}, {"name": "ROC-BigGeminiSM", "mod": "ROCapsules", "title": "Big G Service Module"}], "upgrades": [], "grants": [], "experiments": []}, "int_shuttleOrbiter": {"title": "Reusable Winged Orbiter", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Put the wing, the heatshield, the flight deck and a cargo bay big enough to carry a whole satellite all on one airframe that lands on a runway and flies again — the Shuttle orbiter, the vehicle this whole era is named for. Winged reentry, a spaceplane flight deck and large-fuselage airframe structure, each already proven separately, converge here for the first time into one reusable machine.", "parts": [{"name": "mk3CargoBayL", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-100"}, {"name": "mk3CargoBayM", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-50"}, {"name": "mk3CargoBayS", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-25"}, {"name": "mk3CargoRamp", "mod": "Squad", "title": "Mk3 Cargo Ramp"}, {"name": "mk3Cockpit_Shuttle", "mod": "Squad", "title": "Mk3 Cockpit"}, {"name": "mk3CrewCabin", "mod": "Squad", "title": "Mk3 Passenger Module"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_deployableNozzleExpander": {"title": "Deployable-Nozzle Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The expander cycle's payoff arrives: a radiatively-cooled nozzle that unfolds after staging trades stowed length for the highest vacuum Isp of any engine that flies. The RL-10B-2's carbon-carbon skirt reaches 465 seconds; the RD-0146 is the Russian closed-expander answer. The long RL-10 chain, idle since its last refinement, leaps a full fleet-generation here.", "parts": [{"name": "ROE-RD0146", "mod": "ROEngines", "title": "RD-0146"}, {"name": "ROE-RL10A4N", "mod": "ROEngines", "title": "RL-10A-4N Series (46\" Extendable Nozzle)"}, {"name": "ROE-RL10B2", "mod": "ROEngines", "title": "RL-10B/C Series (84.1\" Extendable Nozzle)"}], "upgrades": ["RFUpgrade_RL10C-1"], "grants": [], "experiments": []}, "cryo_deepThrottleExpander": {"title": "Deep-Throttling Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Throttle a hydrogen expander to a tenth of its rated thrust and keep the turbine spinning on heat the chamber is barely making any more. Fifty starts instead of twenty, and a descent stage that can hover and pick its landing site rather than committing to one burn.", "parts": [], "upgrades": ["RFUpgrade_CECE-Base"], "grants": [], "experiments": []}, "cryo_extendedBellExpander": {"title": "Extended-Bell Expander Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Grow the fixed bell as far as the fairing will take it. Sea-level performance falls away — irrelevant for a stage that never lights in air — and four more seconds of vacuum impulse come back for nothing but stowed length.", "parts": [], "upgrades": ["RFUpgrade_RL10C-1A"], "grants": [], "experiments": []}, "cryo_highExpansionNozzle": {"title": "High-Expansion Vacuum Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Past a certain area ratio the exhaust is colder than the metal and the nozzle stops being a pressure vessel at all. Sea-level Isp collapses to a number nobody quotes; in vacuum it is the best chemical engine anyone has built.", "parts": [], "upgrades": ["RFUpgrade_RL10C-3"], "grants": [], "experiments": []}, "cryo_extendibleNozzleDeployment": {"title": "Extendible Nozzle Deployment", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Stow the skirt around the chamber and slide it down on jackscrews once the stage is clear. The engine finally stops trading expansion ratio against the length of the vehicle — and gains a mechanism that must not jam, in vacuum, after a cold coast, exactly once.", "parts": [], "upgrades": ["RFUpgrade_RL10E-1"], "grants": [], "experiments": []}, "cryo_longLifeRestartExpander": {"title": "Long-Life Restart Expander", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Two hundred and sixty starts. The igniter, the valves and the turbine bearings stop being qualified for a mission and start being qualified for a career — a stage that can loiter for months, phase, deorbit its own debris, and light again because nothing about lighting is scarce any more.", "parts": [], "upgrades": ["RFUpgrade_RL10E-3EL"], "grants": [], "experiments": []}, "cryo_extremeRestartExpander": {"title": "Unlimited-Restart Expander", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Five hundred ignitions is not a bigger number than two hundred and sixty; it is the point where you stop counting them and start treating the engine as something you simply use. Orbital tugs, distributed launch, a stage whose limit is propellant and nothing else.", "parts": [], "upgrades": ["RFUpgrade_RL10E-3ELL"], "grants": [], "experiments": []}, "cryo_operationalHydroloxUpper": {"title": "Operational Restartable Hydrolox Upper", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The gas-generator hydrolox upper grows up. Where the J-2 fired once, the LE-5 coasts and reignites ten times across a mission — the workhorse restartable upper of an operational launcher. Its own expander-bleed descendants split off to the expander lane.", "parts": [{"name": "ROE-LE5", "mod": "ROEngines", "title": "LE-5"}], "upgrades": ["RFUpgrade_HM-7B+", "RFUpgrade_KVD-1", "RFUpgrade_LR87-LH2-VacuumUpgrade", "RFUpgrade_RL10A-4"], "grants": [], "experiments": []}, "cryo_operationalHydroloxUpperII": {"title": "Further-Matured Restartable Hydrolox Upper", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The LE-5 keeps maturing mark by mark — more restarts, a little more thrust, the same workhorse upper stage refined rather than replaced.", "parts": [], "upgrades": ["RFUpgrade_AJ10-154", "RFUpgrade_HM-7B++", "RFUpgrade_LE-5B", "RFUpgrade_LE-5B-2", "RFUpgrade_RL10A-4-1-2", "RFUpgrade_RL10C-2", "RFUpgrade_YF-75E"], "grants": [], "experiments": []}, "cryo_boosterGasGenHydrolox": {"title": "Booster-Class Gas-Generator Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Having proven the reusable staged-combustion engine is buildable, the world's launch fleet turns around and walks away from it. The RS-68 — the most powerful hydrogen engine ever flown — is deliberately a gas-generator with an ablative nozzle, trading Isp for a price tag; Vulcain and the YF-77 make the same bargain for Ariane and Long March. The anti-SSME: simplicity at booster scale.", "parts": [{"name": "ROE-RS68", "mod": "ROEngines", "title": "RS-68"}, {"name": "YF77_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-77"}, {"name": "YF77_Engine-double-withShell", "mod": "KerwisChineseAerospacePack", "title": "YF-77 with CZ-5 Boattail"}, {"name": "cryoengine-vesuvius-1", "mod": "CryoEngines", "title": "Vulcain 2"}, {"name": "rmm_rainier", "mod": "RocketMotorMenagerie", "title": "Space Transportation Main Engine (STME)"}], "upgrades": ["RFUpgrade_M-1U"], "grants": [], "experiments": []}, "cryo_operationalFRSC": {"title": "Operational Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The hardest cycle in rocketry stops being one nation's secret. Fuel-rich staged-combustion hydrolox — the SSME's cycle — is rebuilt by two more programs: the RD-0120 lifts Energia, the LE-7 lifts the H-II. What took a superpower to master becomes something three space programs can pour.", "parts": [{"name": "ROE-LE7", "mod": "ROEngines", "title": "LE-7"}, {"name": "ROE-RD0120", "mod": "ROEngines", "title": "RD-0120"}, {"name": "rmm_ishtar", "mod": "RocketMotorMenagerie", "title": "RS-25-50X (SSME-50X)"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_seaLevelHydroloxNozzle": {"title": "Sea-Level Hydrolox Nozzle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Re-cut a vacuum-optimised hydrolox bell short enough to run at sea level without the exhaust tearing itself off the wall. You give up vacuum specific impulse to get an engine that can light on the pad — the price of a hydrogen first stage rather than a hydrogen upper.", "parts": [], "upgrades": ["RFUpgrade_HG-3-SL", "RFUpgrade_M-1SL"], "grants": [], "experiments": []}, "cryo_reusableTurbopumpUprating": {"title": "Reusable Turbopump Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "The second pass over an engine already qualified to fly again: new turbopump rotors, a wider surge margin, and inspection intervals long enough that the overhaul between flights stops being a rebuild. Thrust follows, but the real gain is how many times you can do it.", "parts": [], "upgrades": ["RFUpgrade_HG-3B-2", "RFUpgrade_LE-7A-2", "RFUpgrade_RD-0122", "RFUpgrade_RD-57A-1", "RFUpgrade_RL10C-1-1", "RFUpgrade_RS-25C"], "grants": [], "experiments": []}, "cryo_reusableChamberPressureCeiling": {"title": "Reusable Chamber-Pressure Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "The last few percent, bought by running the chamber at a pressure the first version of this engine would not have survived. Everything downstream — throat, cooling channels, turbine inlet — is already at its limit, so each further kilonewton costs more than the one before it.", "parts": [], "upgrades": ["RFUpgrade_RS-25D-E"], "grants": [], "experiments": []}, "cryo_boosterHydroloxCeiling": {"title": "Booster Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Eight meganewtons from a single hydrogen chamber firing at sea level — the largest liquid engine anyone ever drew, sized for a vehicle that would have made Saturn V look modest. The turbopump alone outpowers most launch vehicles; every part of it is at a limit somebody had to argue was reachable.", "parts": [], "upgrades": ["RFUpgrade_HG-3B-SL", "RFUpgrade_HG-3B-SL-2", "RFUpgrade_M-1U-SL", "RFUpgrade_RS-800"], "grants": [], "experiments": []}, "cryo_reusableEngineUprating": {"title": "Reusable-Engine Production Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Every reusable and staged-combustion hydrolox engine now in service settles into its production marks — the SSME Block-I and Block-II, the RD-0120M, the LE-7A, the maturing HG-3 and deep-throttle chains — the unglamorous decade of squeezing margin out of engines already flying.", "parts": [{"name": "rmm_arsia", "mod": "RocketMotorMenagerie", "title": "RS-25-650 (SSME-650)"}], "upgrades": ["RFUpgrade_HG-3B", "RFUpgrade_LE-5B-3", "RFUpgrade_LE-7A", "RFUpgrade_LR129-P-3", "RFUpgrade_LRBE-BlockII", "RFUpgrade_RD-0120M", "RFUpgrade_RD-57M", "RFUpgrade_RL10A-4-2N", "RFUpgrade_RL10C-2-1", "RFUpgrade_RS-25A", "RFUpgrade_RS-25D-50X", "RFUpgrade_SSBE-BlockII"], "grants": [], "experiments": []}, "cryo_tripropellant": {"title": "Tripropellant Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "One engine, two fuels, switched in flight. At liftoff it burns dense kerosene for thrust off the pad; at altitude it crosses over to hydrogen for Isp — a single powerplant doing the job of a two-propellant staircase. The RD-701 was meant to lift the MAKS spaceplane; making it work needs both the staged-combustion hydrolox cycle and oxidiser-rich kerolox at once.", "parts": [{"name": "nflv-engine-rd701-1", "mod": "NearFutureLaunchVehicles", "title": "RD-701"}, {"name": "nflv-engine-rd704-1", "mod": "NearFutureLaunchVehicles", "title": "RD-704"}, {"name": "rmm_dugong", "mod": "RocketMotorMenagerie", "title": "SSBE"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_methaloxStagedCombustion": {"title": "Methalox Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Methane splits the difference: colder than kerosene, denser than hydrogen, clean-burning and one day makeable on Mars. The LRBE is the tree's first methalox engine — a staged-combustion booster on a fuel nobody flew yet, the seed of a lane that a later era will grow into.", "parts": [{"name": "ROE-BE4", "mod": "ROEngines", "title": "BE-4"}, {"name": "rmm_arenysaurus", "mod": "RocketMotorMenagerie", "title": "LRBE"}], "upgrades": ["RFUpgrade_STBE-3"], "grants": [], "experiments": []}, "pc_multiChamberORSC": {"title": "High-Thrust Multi-Chamber ORSC", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Oxidiser-rich staged combustion hits its ceiling. The RD-170 — four chambers off one turbopump, 7900 kilonewtons — is the most powerful liquid-propellant engine ever built, the monster that lifts Energia and Zenit. Where the N1's engines never flew and Zenit's was only an upper, this is the chemistry's operational record.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "YF100_Engine-double-withShell2", "mod": "KerwisChineseAerospacePack", "title": "YF-100 with CZ-5 Boattail"}, {"name": "YF100_Engine_S", "mod": "KerwisChineseAerospacePack", "title": "YF-100"}], "upgrades": [], "grants": [], "experiments": []}, "pc_modularORSC": {"title": "Modular Oxidiser-Rich Kerolox", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The record engine gets cut into pieces you can sell. Halve the RD-170's four chambers and you have the RD-180 for Atlas; quarter it and you have the single-chamber Angara engine. Same core hardware, packaged into a modular family for the export and commercial market.", "parts": [{"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-RD191", "mod": "ROEngines", "title": "RD-191"}], "upgrades": ["RFUpgrade_AJ26-62", "RFUpgrade_RD-116-8D420K", "RFUpgrade_RD-120K", "RFUpgrade_RD-171", "RFUpgrade_RD-171M", "RFUpgrade_RD-191", "RFUpgrade_YF-100K"], "grants": [], "experiments": []}, "pc_modularORSCII": {"title": "Modular Kerolox Re-Sizing", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Cut the same modular RD-170 hardware into two more shapes — a lighter single-chamber mark for a smaller booster, and an export version re-plumbed for someone else's pad.", "parts": [], "upgrades": ["RFUpgrade_AJ26-59", "RFUpgrade_RD-172-173", "RFUpgrade_RD-181", "RFUpgrade_RD-193", "RFUpgrade_RD-58S"], "grants": [], "experiments": []}, "pc_operationalStorableORSC": {"title": "Operational Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The storable staged-combustion engines of Proton and its kin reach their final operational marks — the RD-275M first stage, the Kosberg upper stages — the last refinements of a hypergolic booster line that has been flying since the sixties.", "parts": [], "upgrades": ["RFUpgrade_RD-0210-Mk3", "RFUpgrade_RD-0212-Mk3", "RFUpgrade_RD-0213-Mk3", "RFUpgrade_RD-254-11D44-Mk3", "RFUpgrade_RD-254-11D44-Mk4", "RFUpgrade_RD-275M", "RFUpgrade_RD-277-14D16"], "grants": [], "experiments": []}, "fd_multiRestartStorableUpper": {"title": "Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Coast, reignite, coast again — dozens of times, across days. The Fregat and Briz upper stages and their kin are storable propulsion modules built for the choreography of an interplanetary or multi-orbit mission, restarting on demand where the single-shot Agena and early AJ10 could not. The Transtar rates five hundred ignitions.", "parts": [{"name": "ROE-AJ10-transtar", "mod": "ROEngines", "title": "AJ23 Transtar"}, {"name": "ROE-AJ10AdvLong", "mod": "ROEngines", "title": "AJ10 Series (Advanced Long Nozzle)"}, {"name": "ROE-S592", "mod": "ROEngines", "title": "S5.92"}, {"name": "ROE-S598M", "mod": "ROEngines", "title": "S5.98M"}, {"name": "restock-engine-125-pug", "mod": "ReStockPlus", "title": "Aestus"}], "upgrades": ["RFUpgrade_AJ10-118F", "RFUpgrade_TR-201"], "grants": [], "experiments": []}, "fd_multiRestartStorableUpperII": {"title": "Further-Refined Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Aestus keeps pace with the rest of the multi-restart storable family — a modified chamber, then a second-generation successor, the same choreography refined one mark further.", "parts": [], "upgrades": ["RFUpgrade_AJ10-156", "RFUpgrade_Aestus-II", "RFUpgrade_Model8096A"], "grants": [], "experiments": []}, "fd_keroloxClusterCeiling": {"title": "Kerolox Cluster Thrust Ceiling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Keep pushing the same gas-generator chamber past where its designers stopped. Injector face, throat erosion and the gas generator's own turbine all start arguing at once, and each further ten percent costs a qualification programme of its own.", "parts": [], "upgrades": ["RFUpgrade_E-1-575k", "RFUpgrade_F-1A", "RFUpgrade_H-1-250K", "RFUpgrade_H-2-250K"], "grants": [], "experiments": []}, "fd_keroloxClusterApex": {"title": "Kerolox Cluster Apex", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The last version anyone built of an engine that had been uprated for twenty years. Nothing here is elegant — it is a mature design run as hard as its metallurgy allows, kept in production because the vehicle around it was already qualified.", "parts": [], "upgrades": ["RFUpgrade_E-1-Upgrade2", "RFUpgrade_H-2-300K", "RFUpgrade_Merlin1D+"], "grants": [], "experiments": []}, "fd_terminalGasGenKerolox": {"title": "Terminal Gas-Generator Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The gas-generator kerolox engines that built the space age take their final bow. The last production marks of Delta's RS-27, Atlas's RS-56 and Titan's LR87/LR91 — a lineage of open-cycle workhorses being uprated one last time as staged combustion walks past them.", "parts": [], "upgrades": ["RFUpgrade_E-1A_KS", "RFUpgrade_LR101-NA-15", "RFUpgrade_LR87-AJ-11A", "RFUpgrade_LR91-AJ-11A", "RFUpgrade_Model8096C", "RFUpgrade_RS-27A", "RFUpgrade_RS-56-OBA", "RFUpgrade_RS-56-OSA", "RFUpgrade_Viking-6"], "grants": [], "experiments": []}, "fd_advancedGasGenKerolox": {"title": "Advanced Gas-Generator Kerolox Booster", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "America's answer to the imported RD-180 that never got built. The STBE was a big, simple gas-generator kerolox booster engine drawn for the next launcher — the domestic alternative to buying Russian staged combustion, shelved when the RD-180 won on price.", "parts": [{"name": "cryoengine-allosaur-1", "mod": "CryoEngines", "title": "STBE-3"}, {"name": "nflv-engine-stbe-kero-1", "mod": "NearFutureLaunchVehicles", "title": "STBE (Pratt \u0026 Whitney)"}, {"name": "rmm_turiasaurus", "mod": "RocketMotorMenagerie", "title": "STBE (Pratt \u0026 Whitney)"}], "upgrades": [], "grants": [], "experiments": []}, "pc_filamentWoundSolid": {"title": "Filament-Wound Composite-Case Solids", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Wind the motor case out of graphite and epoxy instead of forging it from steel, and the dead weight falls away. The filament-wound composite case — on the giant SRMU, the standalone Castor 120, the Titan solids — is the material leap past the heavy segmented steel of the Shuttle booster, more impulse for less structure.", "parts": [{"name": "ROE-1208sepMotor", "mod": "ROEngines", "title": "UA1208 Nosecone \u0026 Separation Motor"}, {"name": "ROE-Castor120", "mod": "ROEngines", "title": "Castor 120"}, {"name": "ROE-Castor30", "mod": "ROEngines", "title": "Castor 30A"}, {"name": "ROE-Castor30XL", "mod": "ROEngines", "title": "Castor 30XL"}, {"name": "ROE-SRMU", "mod": "ROEngines", "title": "SRMU"}, {"name": "ROE-UA1208", "mod": "ROEngines", "title": "UA1208"}], "upgrades": ["RFTech-solids-tltech6", "RFUpgrade_FWC-SRM", "RFUpgrade_RSRM-1986"], "grants": [], "experiments": []}, "pc_gemStrapOnCatalog": {"title": "Graphite-Epoxy Strap-On Catalog", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The commercial strap-on aisle. Bolt on as many graphite-epoxy motors as the payload needs — the Delta GEM family in three lengths, the Atlas AJ-60 — a fixed catalogue of composite boosters sized to order off the composite-case breakthrough.", "parts": [{"name": "ROE-AJ60", "mod": "ROEngines", "title": "AJ-60A"}, {"name": "ROE-GEM40", "mod": "ROEngines", "title": "GEM 40"}, {"name": "ROE-GEM46", "mod": "ROEngines", "title": "GEM 46"}, {"name": "ROE-GEM60", "mod": "ROEngines", "title": "GEM 60"}, {"name": "ROE-GEM63", "mod": "ROEngines", "title": "GEM 63"}], "upgrades": [], "grants": [], "experiments": []}, "ep_operationalHall": {"title": "Operational Hall-Effect Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The Hall thruster leaves the laboratory. The SPT-100 and its bigger siblings become flight-qualified hardware, first for stationkeeping and then as primary propulsion — a few grams-force of thrust at sixteen hundred seconds of Isp, the electric workhorse of the coming decades.", "parts": [{"name": "RO-PPS1350", "mod": "NearFuturePropulsion", "title": "PPS-1350 Hall Effect Thruster"}, {"name": "RO-SPT100", "mod": "NearFuturePropulsion", "title": "SPT-100 Hall Effect Thruster"}, {"name": "RO-SPT140", "mod": "NearFuturePropulsion", "title": "SPT-140 Hall Effect Thruster"}], "upgrades": ["RFUpgrade_SPT-50M", "RFUpgrade_SPT-70M"], "grants": [], "experiments": []}, "ep_highPowerHall": {"title": "High-Power Nested Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Scale the Hall thruster into the tens of kilowatts. The 457M's nested channels swallow seventy-two kilowatts and push the Isp past two thousand seconds — the class of electric engine that could one day move cargo rather than just trim an orbit.", "parts": [{"name": "RO-457M", "mod": "NearFuturePropulsion", "title": "457M 72kW Hall Effect Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_griddedIon": {"title": "Gridded Ion Electrostatic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "A different way to throw ions: accelerate them through charged grids instead of a magnetic field, and the exhaust speed climbs higher still. NSTAR flew on Deep Space 1 — the first time an ion engine, not a chemical rocket, was the main drive of a probe to another world.", "parts": [{"name": "ionEngine", "mod": "Squad", "title": "NSTAR Gridded Ion Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_pulsedInductive": {"title": "Pulsed Inductive Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "No electrodes to erode — a pulsed magnetic field ionises and flings a puff of ammonia, and repeats thousands of times a second. The PIT reaches seven thousand seconds of Isp, an experimental high-power concept for the kind of cruise no chemical stage could sustain.", "parts": [{"name": "RO-nupit", "mod": "NearFuturePropulsion", "title": "NuPIT Pulsed Inductive Thruster"}, {"name": "pit-0625", "mod": "NearFuturePropulsion", "title": "FARAD Pulsed Inductive Thruster"}, {"name": "pit-125", "mod": "NearFuturePropulsion", "title": "PIT Mk Va Pulsed Inductive Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_kryptonFeed": {"title": "Krypton Propellant Feed", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Xenon is the better propellant and always will be — heavier, easier to ionise, kinder to the grids. It is also scarce enough that a large constellation would corner the world supply. Krypton is a tenth the price, costs you thrust and erodes the channel faster, and it is what you fly when you need to build a thousand of them.", "parts": [], "upgrades": ["RFUpgrade_SPT-70MK"], "grants": [], "experiments": []}, "ep_kilowattPPU": {"title": "Kilowatt-Class Power Processing", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "A thruster is only as good as the box behind it. Take the discharge supply past a kilowatt — regulated, radiation-tolerant, and able to shed its own switching losses — and the electric drive stops being a stationkeeping trim and starts being propulsion a satellite is designed around.", "parts": [], "upgrades": ["RFUpgrade_SPT-100B", "RFUpgrade_SPT-100D", "RFUpgrade_SPT-100M", "RFUpgrade_SPT-140D"], "grants": [], "experiments": []}, "ep_multiKilowattPPU": {"title": "Multi-Kilowatt Discharge Supply", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Ten kilowatts through a single discharge supply, and the waste heat of running it becomes the design problem rather than the electronics. This is the class that moves a real spacecraft under its own electric power instead of merely holding it in station.", "parts": [], "upgrades": ["RFUpgrade_AEPS"], "grants": [], "experiments": []}, "ep_fiftyKilowattPPU": {"title": "Fifty-Kilowatt Power Conditioning", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Past twenty kilowatts the power chain stops resembling spacecraft electronics and starts resembling a substation: high-voltage switching, deliberate thermal paths, and an array whose area is now the vehicle's defining feature. Every experimental thruster of the era waits on this box.", "parts": [], "upgrades": ["RFUpgrade_457M-V2", "RFUpgrade_DS4G-25-hi", "RFUpgrade_DS4G-25-mid", "RFUpgrade_DS4G-50-hi", "RFUpgrade_DS4G-50-low", "RFUpgrade_PITV-Hydrazine-40"], "grants": [], "experiments": []}, "ep_hundredKilowattPPU": {"title": "Hundred-Kilowatt Power Conditioning", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "A hundred kilowatts is where solar-electric propulsion stops being a probe technology. The array is measured in hundreds of square metres, the radiators rival it in area, and the conditioning stage is a larger engineering problem than the thruster it feeds.", "parts": [], "upgrades": ["RFUpgrade_NuPIT-7000", "RFUpgrade_X3-HV"], "grants": [], "experiments": []}, "ep_megawattPPU": {"title": "Megawatt Power Conditioning", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "At a megawatt the sun is no longer a plausible source and the question becomes what else you are willing to carry. The conditioning stage that survives this much power is the gate on every high-thrust electric concept ever drawn — the pulsed inductive machines that would push tonnes rather than kilogrammes.", "parts": [], "upgrades": ["RFUpgrade_PITV-Ammonia-1200", "RFUpgrade_PITV-Hydrazine-1200"], "grants": [], "experiments": []}, "ep_kryptonHighPower": {"title": "High-Voltage Krypton Discharge", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Krypton ionises harder than xenon and wants more volts to do it, which is tolerable on a stationkeeping thruster and punishing on anything drawing a fifth of a megawatt. Run the cheap propellant at that scale — through a nested Hall channel or a magnetic nozzle alike — and the constellation that was unaffordable in xenon becomes buildable.", "parts": [], "upgrades": ["RFUpgrade_457M-V1-K", "RFUpgrade_VF-200-Kr", "RFUpgrade_VX-200SS-Kr", "RFUpgrade_X3-HV-K"], "grants": [], "experiments": []}, "nuc_ammoniaWorkingFluid": {"title": "Ammonia Reactor Working Fluid", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Feed the reactor ammonia instead of hydrogen. Specific impulse halves — the exhaust is heavy now — but thrust doubles and the propellant stops needing a cryogenic tank that boils off on the way to anywhere. A nuclear engine you can leave parked for a year.", "parts": [], "upgrades": ["RFUpgrade_BNTR-Ammonia", "RFUpgrade_NERVA-I-Ammonia", "RFUpgrade_PEWEE100-Ammonia", "RFUpgrade_RD-0410MID-Ammonia", "RFUpgrade_SNTPPFE100-Ammonia"], "grants": [], "experiments": []}, "nuc_methaneWorkingFluid": {"title": "Methane Reactor Working Fluid", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Methane splits in the core and leaves carbon behind on everything it touches, which is why nobody flew it — but it is denser than hydrogen, milder than ammonia, and sits in a tank the same equipment already handles. Forty seconds better than ammonia for a reactor you will have to inspect afterwards.", "parts": [], "upgrades": ["RFUpgrade_NERVA-I-Methane", "RFUpgrade_PEWEE100-Methane", "RFUpgrade_RD-0410MID-Methane"], "grants": [], "experiments": []}, "nuc_blendedWorkingFluid": {"title": "Blended Reactor Working Fluid", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Mix the ammonia with methane and you get most of methane's exhaust velocity without all of its carbon, or most of ammonia's manners without its weight. Neither propellant alone was the right answer, so the answer stopped being one propellant.", "parts": [], "upgrades": ["RFUpgrade_BNTR-Methane", "RFUpgrade_RD-0410MID-MethaneSpec", "RFUpgrade_SNTPPFE100-Methane"], "grants": [], "experiments": []}, "nuc_flightDesignNTR": {"title": "Flight-Design Solid-Core NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The nuclear rocket stops being a ground-test article and becomes a flight design. The Soviet RD-0410 was actually built and fired; NERVA II is the largest solid-core engine ever drawn. The end of the solid-core line — reactors meant, at last, to leave the ground.", "parts": [{"name": "RD0410MID", "mod": "Squad", "title": "RD-0410"}, {"name": "ROE-NERVAII", "mod": "ROEngines", "title": "NERVA II"}, {"name": "restock-engine-cherenkov", "mod": "ReStockPlus", "title": "RD-0410"}], "upgrades": ["RFTech-nuclear-tltech4"], "grants": [], "experiments": []}, "nuc_particleBedNTR": {"title": "Particle-Bed NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Pack the reactor fuel as loose particles instead of solid rods and the coolant can pull heat out far faster — more power in less core. The particle-bed NTR of the Timberwind program is a denser, hotter path to the same nuclear thrust.", "parts": [{"name": "ROE-SNTPPFE100", "mod": "ROEngines", "title": "SNTP-PFE100 Atomic Rocket Motor"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_advancedCoreNTR": {"title": "Advanced-Core NTR Concepts", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Let the fuel melt, or turn to gas, and the temperature ceiling — and the Isp — rises with it. The liquid-core NTR reaches fourteen hundred seconds; the low-pressure gas-core start pushes further. Engineering fiction for now, and the doorway to the gas-core lane a later era will open.", "parts": [{"name": "RO-KA-LRCNTR", "mod": "KerbalAtomics", "title": "Lewis Research Center LNTR"}, {"name": "ntr-gc-25-1", "mod": "KerbalAtomics", "title": "Low-Pressure NTR"}], "upgrades": ["RFTech-nuclear-tltech5", "RFUpgrade_PrincetonLNTR-WCH", "RFUpgrade_SNTPPFE100-Hydrogen"], "grants": [], "experiments": []}, "av_vtolVectoredTurbofan": {"title": "Vectored-Thrust VTOL Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Point the thrust down and a fighter takes off with no runway. The R-79's swivelling nozzle lifts the Yak-141 vertically then rotates aft for supersonic flight, the lift jets handling the hover — vectored thrust as a whole new way to leave the ground.", "parts": [{"name": "RO-SXT-R79", "mod": "SXT", "title": "R-79 Turbofan"}, {"name": "RO-nfa-RD41", "mod": "NearFutureAeronautics", "title": "2x RD-41 Turbojet"}], "upgrades": [], "grants": [], "experiments": []}, "av_fourthGenFighterTurbofan": {"title": "Fourth-Generation Fighter Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The fourth-generation fighter engine: high bypass for a combat turbofan, high pressure ratio, high turbine temperature. The F135 that powers the F-35 is the most powerful fighter engine ever built; the WS-10 is its Chinese contemporary. The long tail of teen-series and Flanker engine marks matures here.", "parts": [{"name": "RO-WS10", "mod": "Squad", "title": "WS-10 Low-Bypass Turbofan"}, {"name": "SXTVTOLturboFan", "mod": "SXT", "title": "F135 Low-Bypass Turbofan"}], "upgrades": ["RFUpgrade_AL-31FM", "RFUpgrade_CF34-3B", "RFUpgrade_F100-PW-229", "RFUpgrade_F100-PW-229PYBBN", "RFUpgrade_F404-GE-402", "RFUpgrade_J58-P-4A", "RFUpgrade_J58-P-4B", "RFUpgrade_R-79M-300", "RFUpgrade_RM12", "RFUpgrade_WP-13A-II", "RFUpgrade_WP-13F"], "grants": [], "experiments": []}, "av_fifthGenFighterTurbofan": {"title": "Fifth-Generation Fighter Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Single-crystal blades, a full-authority digital controller and a core hot enough that the metal is running above its own melting point behind a film of cooling air. Supercruise without afterburner, and a service life measured against the airframe's rather than the season's.", "parts": [], "upgrades": ["RFUpgrade_AL-41F-1S", "RFUpgrade_F100-PW-229EEP", "RFUpgrade_WP-13FI"], "grants": [], "experiments": []}, "av_combinedCycleSSTO": {"title": "Combined-Cycle Air-Breathing Rocket", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "One engine, two regimes: breathe air like a turbojet up through the atmosphere, then seal the intakes and burn stored oxidiser like a rocket the rest of the way to orbit — the single-stage-to-orbit dream in one nacelle, real turbojet and real rocket hardware, never quite proven at full scale.", "parts": [{"name": "RAPIER", "mod": "Squad", "title": "CR-7 R.A.P.I.E.R."}], "upgrades": ["RFUpgrade_WS-10B-III"], "grants": [], "experiments": []}, "gnc_deepSpaceApogeeEngine": {"title": "Deep-Space Bipropellant Apogee Engine", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "The little bipropellant engine that inserts a probe into orbit around another planet. The LEROS-1b — flight-proven on NEAR, MESSENGER and Juno — and the R-42 are the mature descendants of the R-4D thruster, built to sit cold through years of cruise and then fire once, exactly right, at the far end.", "parts": [{"name": "ROE-LEROS1B", "mod": "ROEngines", "title": "LEROS-1b (635N)"}, {"name": "ROE-LEROS4", "mod": "ROEngines", "title": "LEROS-4 (1100N)"}, {"name": "ROE-R42", "mod": "ROEngines", "title": "R-42"}, {"name": "ca_mer_ft", "mod": "CoatlAerospace", "title": "Cassini Propulsion Module"}], "upgrades": ["RFUpgrade_R-4D-15"], "grants": [], "experiments": []}, "cmp_venusEntryAeroshell": {"title": "High-Pressure Atmospheric Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Face an atmosphere ninety times denser than Earth's and hot enough to melt lead at the surface — the Venera aeroshell's heatshield and twin parachutes, built for a descent that ends in a furnace no matter how gently you land in it.", "parts": [{"name": "ca_draco_hs", "mod": "CoatlAerospace", "title": "Huygens Heat Shield"}, {"name": "ca_fom_drogue", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Drogue Parachute)"}, {"name": "ca_fom_heatS", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Heat Shield)"}, {"name": "ca_fom_parachute", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Main Parachute)"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_extremeAtmosphericEntry": {"title": "Extreme Atmospheric-Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Hit a gas giant's atmosphere at tens of kilometres a second and shed more heat in two minutes than a lunar return sheds in the whole reentry — the most extreme ablator ever asked to survive, carried on a probe built to transmit for as long as it can before it's cooked.", "parts": [{"name": "galileo_hs_bot", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Bottom"}, {"name": "galileo_hs_mid", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Middle"}, {"name": "galileo_hs_top", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Top"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_extremeEntryParachutes": {"title": "Extreme-Entry Recovery Parachutes", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "A parachute stack timed to deploy only once the heatshield has done its worst work and the shockwave has finally fallen behind — Galileo's own descent sequence, the last mechanical step between the hottest entry in the tree and a working probe.", "parts": [{"name": "ca_draco_drogue", "mod": "CoatlAerospace", "title": "Huygens Drogue Parachute"}, {"name": "ca_draco_parachute", "mod": "CoatlAerospace", "title": "Huygens Main Parachute"}, {"name": "galileo_probe_hs_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Heatshield Parachute"}, {"name": "galileo_probe_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Parachute"}], "upgrades": [], "grants": [], "experiments": []}, "res_regolithExtraction": {"title": "Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Bore into loose surface material with a motorised bit and bring up what you find — the first step of living off a world instead of just visiting it. Needs nothing more than the same motor already turning a rover's wheels, aimed down instead of forward.", "parts": [{"name": "groundAnchor", "mod": "Squad", "title": "Stamp-O-Tron Ground Anchor"}, {"name": "kerbalism-drill", "mod": "Squad", "title": "Regolith Harvester"}], "upgrades": [], "grants": [], "experiments": []}, "res_oreStorageTankage": {"title": "Ore Storage Tankage", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Somewhere to put what the drill brings up — bulk hopper tankage sized for raw, unprocessed ore rather than a refined propellant.", "parts": [{"name": "proceduralTankOre", "mod": "ProceduralParts", "title": "Tank - Ore [Procedural]"}], "upgrades": [], "grants": [], "experiments": []}, "res_largeRegolithExtraction": {"title": "Large-Scale Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The same drill, scaled up for a real mining rate instead of a proof of concept — the difference between sampling a world and living off it.", "parts": [{"name": "kerbalism-large-drill", "mod": "Squad", "title": "Large Regolith Harvester"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_sovietProbeBusFamily": {"title": "Soviet Interplanetary Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One bus architecture, flown as both an orbiter and a lander carrier — the 4MV core that became Venera, Zond and Mars probes across a decade, with its own tankage and reentry-module release built in from the start.", "parts": [{"name": "ca_fom_lander", "mod": "CoatlAerospace", "title": "Venera Lander Bus"}, {"name": "ca_vor_core", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus"}, {"name": "ca_vor_mptank", "mod": "CoatlAerospace", "title": "CAE-MT12 Propellant Tank (Pressurized)"}, {"name": "ca_vor_sep1", "mod": "CoatlAerospace", "title": "Venera Reentry Module Decoupler"}, {"name": "ca_vor_tank", "mod": "CoatlAerospace", "title": "4MV-1/2 Spacecraft Bus Propellant Tank"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_usProbeBusFamily": {"title": "US Deep-Space Probe Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The generic 3-axis deep-space probe bus catalog — the spin-stabilised and fully-3-axis-stabilised cores, the attitude-control hardware and the ultraviolet-explorer bus that ride the same shelf. The flagship craft built on them (Pioneer, Voyager) arrive through the charter.", "parts": [{"name": "ca_aacs", "mod": "CoatlAerospace", "title": "CA-AACS Advanced Attitude Control System"}, {"name": "ca_explorer", "mod": "CoatlAerospace", "title": "IUE Spacecraft Bus"}, {"name": "quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10/11 Core"}, {"name": "torekka", "mod": "CoatlAerospace", "title": "Voyager Core"}], "upgrades": [], "grants": [], "experiments": []}, "elec_stationClassSolarArrays": {"title": "Station-Class Solar Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The same fold-out array, sized for a station's appetite instead of a probe's — more cells on a bigger paddle, nothing new about how it works.", "parts": [{"name": "ROC-ApolloSolarBlockV", "mod": "ROCapsules", "title": "Apollo Block V Solar Array"}, {"name": "ROC-OrionSolar", "mod": "ROCapsules", "title": "Orion Solar Panels"}, {"name": "largeSolarPanelEarly", "mod": "Squad", "title": "XT3 Solar Panel Array Mk1"}, {"name": "solarPanels1", "mod": "Squad", "title": "XT2 Solar Panel Array Mk2"}, {"name": "solarPanels3", "mod": "Squad", "title": "XT1 Solar Panel Array Mk2"}], "upgrades": [], "grants": [], "experiments": []}, "elec_probeBusSolarWings": {"title": "Probe-Bus Solar Wings", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "A deployable wing cut to the exact power budget of one bus family — the IUE, Venera and 4MV arrays, each sized for its own mission rather than pulled off a generic shelf.", "parts": [{"name": "SXTsolarPanelLarge", "mod": "SXT", "title": "OX-VL Photovoltaic Array"}, {"name": "SXTsolarPanelhex", "mod": "SXT", "title": "OX-HEX Photovoltaic Panels"}], "upgrades": [], "grants": [], "experiments": []}, "elec_busArrayCatalog": {"title": "Prefabricated Spacecraft-Bus Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Wings cut for one spacecraft and never re-cut — the IUE, Venera and 4MV arrays as their own programmes built them. Off the shelf and off the pace: none of them will ever match a panel you size yourself.", "parts": [{"name": "ca_explorer_solar", "mod": "CoatlAerospace", "title": "IUE Solar Array Wing (SAW)"}, {"name": "ca_fom_sp", "mod": "CoatlAerospace", "title": "Venera Lander Bus Solar Array"}, {"name": "ca_vor_sp", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus SAW \u0026 TCS (Standard)"}, {"name": "ca_vor_sp2", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus SAW \u0026 TCS (Small)"}], "upgrades": [], "grants": [], "experiments": []}, "elec_matureSolarArrays": {"title": "Mature Solar Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The generic array's last uprate in this era — more efficient cells, the same fold-out paddle, still the default choice for anything that doesn't need a dedicated mission-sized wing.", "parts": [{"name": "largeSolarPanel", "mod": "Squad", "title": "XT4 Solar Panel Array Mk1"}], "upgrades": [], "grants": [], "experiments": []}, "elec_deployableBlanketArray": {"title": "Roll-Out Blanket Solar Array", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Replace the rigid folding paddle with a flexible photovoltaic blanket that unrolls off a spool like a tape measure — a fraction of the stowed volume and mass of a hinged panel of the same area, at three mission scales.", "parts": [{"name": "nfs-panel-deploying-blanket-arm-1", "mod": "NearFutureSolar", "title": "OKEB-150R 'Halo' Circular Blanket Photovoltaic Array"}, {"name": "nfs-panel-deploying-blanket-dsg-1", "mod": "NearFutureSolar", "title": "OKEB-100 'Gateway' Blanket Photovoltaic Array"}, {"name": "nfs-panel-deploying-blanket-starship-1", "mod": "NearFutureSolar", "title": "OKEB-25R 'Starship' Blanket Photovoltaic Array"}], "upgrades": [], "grants": [], "experiments": []}, "elec_concentratingPhotovoltaic": {"title": "Concentrating Photovoltaic Array", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Focus sunlight onto a small strip of the most efficient (and most expensive) cells with lenses instead of covering the whole panel in them — the same power from far less exotic photovoltaic material.", "parts": [{"name": "nfs-panel-deploying-concentrator-1x4-juno-1", "mod": "NearFutureSolar", "title": "K12-K 1x4 Concentrating Photovoltaic Panels"}], "upgrades": [], "grants": [], "experiments": []}, "elec_advancedRigidArray": {"title": "Large Rigid Photovoltaic Array", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "No new mechanism, just scale: the same hinged rigid panel the whole tree has used since the first fold-out paddle, built one size class larger than anything before it.", "parts": [{"name": "nfs-panel-deploying-advanced-2x20-hub-1", "mod": "NearFutureSolar", "title": "K55-A 'Megalador' Advanced Solar Array"}], "upgrades": [], "grants": [], "experiments": []}, "elec_curvedExpandingArray": {"title": "Curved Expanding Solar Array", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Stow the array wrapped into a tight curve instead of folded flat, and let it spring open into its working shape — a third distinct way to pack more panel into less volume.", "parts": [{"name": "nfs-panel-deploying-curved-375-1", "mod": "NearFutureSolar", "title": "NIV-75-R Expanding Curved Solar Array"}], "upgrades": [], "grants": [], "experiments": []}, "elec_nOnPCell": {"title": "N-on-P Radiation-Tolerant Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Build the junction the other way up — diffuse phosphorus into a boron-doped wafer instead of the reverse — and the cell stops dying in the belts. The first satellites came home with their output halved after a few months in the trapped radiation; the same silicon, inverted, holds its power for a season and gives back more of the blue end of the spectrum besides.", "parts": [], "upgrades": ["solarTL3"], "grants": [], "experiments": []}, "elec_dopedCoverglass": {"title": "Cerium-Doped Cover Glass", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "The cell was never the fragile part — the glass over it was. Ultraviolet darkens an ordinary cover slip until the array is looking at the sun through smoked quartz. Dope the glass with cerium and it stops browning, and a panel that used to fade inside a month holds its output for a third of a year.", "parts": [], "upgrades": ["solarTL4"], "grants": [], "experiments": []}, "elec_backSurfaceField": {"title": "Back-Surface-Field Silicon Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Diffuse a heavily doped layer across the back of the cell so carriers that reach it are turned around instead of lost, and texture the front face so light that would have glanced off is trapped inside instead. The same silicon, worked properly, gives half again what it did — and a thinner wafer will now do the work of a thick one.", "parts": [], "upgrades": ["solarTL6"], "grants": [], "experiments": []}, "elec_thinSiliconCell": {"title": "Thin-Substrate Silicon Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Grind the wafer down to a fraction of its old thickness and put a mirror behind it, so the light that would have passed straight through gets a second pass on the way out. Silicon is very nearly finished as a space cell here — but an array that once weighed six kilogrammes to the square metre now weighs three and a half.", "parts": [], "upgrades": ["solarTL7"], "grants": [], "experiments": []}, "elec_galliumArsenideCell": {"title": "Gallium-Arsenide Heterojunction Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Silicon has run out of room — fifteen percent of the sunlight landing on it is all a crystal of it will ever give back. Grow the junction from gallium arsenide instead and the cell absorbs harder, keeps its output in the heat that wilts a silicon panel, and shrugs off the radiation that ages an array into uselessness.", "parts": [], "upgrades": ["solarTL8"], "grants": [], "experiments": []}, "elec_tripleJunctionCell": {"title": "Triple-Junction III-V Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Stack three junctions of different bandgaps in one cell, each harvesting the part of the spectrum the one above it let through — indium gallium phosphide takes the blue, gallium arsenide the visible, germanium the infrared that silicon only ever wasted as heat.", "parts": [], "upgrades": ["solarTL9"], "grants": [], "experiments": []}, "elec_metamorphicMultijunction": {"title": "Inverted Metamorphic Multijunction Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Grow the junctions upside down on a wafer, then peel the finished cell away and discard the wafer it was built on. What is left is a few microns of semiconductor with no substrate to carry — the most efficient cell ever flown, and light enough that the array's mass stops being the reason it is small.", "parts": [], "upgrades": ["solarTL10"], "grants": [], "experiments": []}, "elec_multiHundredWattRTG": {"title": "Multi-Hundred-Watt RTG", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Stack enough plutonium-238 to clear several hundred watts instead of a bare trickle — the generator class that powered Voyager past every planet it flew and is still transmitting today.", "parts": [{"name": "USRTGWedge", "mod": "UniversalStorage2", "title": "Universal Storage: Multi-hundred Watt RTG"}, {"name": "ca_rtg3900", "mod": "CoatlAerospace", "title": "Voyager MHW-RTG"}, {"name": "rtg", "mod": "Squad", "title": "Multi-Hundred Watt RTG"}], "upgrades": [], "grants": [], "experiments": []}, "elec_gphsRTGGeneration": {"title": "GPHS-RTG Generation", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Standardise the RTG into modular General-Purpose Heat Source bricks, stack as many as the mission needs, and the same design flies Galileo, Ulysses, Cassini and every deep-space mission after them for the next forty years.", "parts": [{"name": "RO-MMRTG", "mod": "Squad", "title": "Multi-Mission RTG"}, {"name": "SXTDepolyRTGI", "mod": "SXT", "title": "GPHS-RTG"}, {"name": "SXTDepolyRTGII", "mod": "SXT", "title": "GPHS-RTG [Shielded]"}, {"name": "USRTGWedgeMM", "mod": "UniversalStorage2", "title": "Universal Storage: Multi-Mission RTG"}, {"name": "ca_mer_rtg", "mod": "CoatlAerospace", "title": "GPHS-RTG"}, {"name": "nfe-rtg-asrg-1", "mod": "NearFutureElectrical", "title": "NASA \u0026 DOE Advanced Sterling RG"}, {"name": "nfe-rtg-gphs-1", "mod": "NearFutureElectrical", "title": "GPHS-RTG"}, {"name": "nfe-rtg-mmrtg-1", "mod": "NearFutureElectrical", "title": "Multi-Mission RTG"}], "upgrades": [], "grants": [], "experiments": []}, "tel_xBandDownlink": {"title": "X-Band Deep-Space Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Move the deep-space link up from S-band to X-band — roughly four times the frequency, and with it the beam narrows and the data rate climbs, wringing a usable stream out of a signal smeared across the outer Solar System. It takes both ends at once: an onboard transponder that transmits on the new band, and a DSN dish upgraded to hear it. Voyager flew its whole grand tour home on X-band.", "parts": [], "upgrades": ["commsTL5"], "grants": ["RP0Level6TrackingStation"], "experiments": []}, "tel_kaBandDownlink": {"title": "Ka-Band High-Rate Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Climb the band again, from X to Ka — near four times the frequency once more, the beam tightening to a needle and the data rate leaping with it. The band a modern flagship saves for its high-rate science: the step from an X-band trickle to a torrent, on a carrier so narrow the dish must be aimed to a hair.", "parts": [], "upgrades": ["commsTL6"], "grants": ["RP0Level7TrackingStation"], "experiments": []}, "tel_concatenatedCoding": {"title": "Concatenated Channel Coding", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Stop reaching for a bigger dish and start encoding smarter: wrap a Reed-Solomon block code around a convolutional inner code and the receiver rebuilds bits it would once have lost in the hiss — coding gain worth more than doubling the antenna. The same hardware suddenly carries several times the data, for the price of arithmetic. Voyager came home this way.", "parts": [], "upgrades": ["commsTL7"], "grants": ["RP0Level8TrackingStation"], "experiments": []}, "tel_antennaArraying": {"title": "Ground-Station Antenna Arraying", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Phase a whole field of ground dishes together and they act as one impossible aperture — a 70-metre giant and a cluster of 34-metre beam-waveguide antennas combined to hear a probe going quiet at the edge of the Solar System. When Voyager reached Neptune, it took the whole array to keep the pictures coming.", "parts": [], "upgrades": ["commsTL8"], "grants": ["RP0Level9TrackingStation"], "experiments": []}, "tel_bandwidthEfficientModulation": {"title": "Bandwidth-Efficient Modulation", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Spectrum is finite and crowded, so pack more bits into every hertz of it — shaped, suppressed-carrier schemes and modern low-density coding that push the link toward its theoretical limit instead of simply shouting louder. The efficient radio a whole fleet of spacecraft can share without drowning one another out.", "parts": [], "upgrades": ["commsTL9"], "grants": ["RP0Level10TrackingStation"], "experiments": []}, "tel_opticalDownlink": {"title": "Optical Deep-Space Downlink", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "Leave radio behind and modulate a laser: an optical carrier tens of thousands of times higher in frequency than X-band, packing orders of magnitude more data onto a beam so tight it must be pointed to the arc-second across light-minutes of empty space. The downlink of the present frontier — flown from lunar orbit, and now from the asteroid belt.", "parts": [], "upgrades": ["commsTL10"], "grants": ["RP0Level11TrackingStation"], "experiments": []}, "tel_deepSpaceProbeAntennas": {"title": "Deep-Space Probe Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "A parabolic dish or omni cut to one bus family's own link budget — Pioneer's spin-scan dish, Voyager's high-gain reflector, the 4MV's own array and dish, GPS's simple omni. The named-hardware shelf, one entry per flagship mission.", "parts": [{"name": "ca_ant_gps", "mod": "CoatlAerospace", "title": "CA-GPS Omnidirectional Antenna"}, {"name": "ca_vor_comm", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus Antenna Array"}, {"name": "ca_vor_dish", "mod": "CoatlAerospace", "title": "4MV-1 Spacecraft Bus Parabolic Antenna"}, {"name": "dish_L", "mod": "CoatlAerospace", "title": "Voyager 1 \u0026 2 Parabolic Antenna"}, {"name": "dish_quetzal", "mod": "CoatlAerospace", "title": "Pioneer 10 \u0026 11 Parabolic Antenna"}], "upgrades": [], "grants": [], "experiments": []}, "tel_largeApertureReflectors": {"title": "Large-Aperture Reflector Antennas", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "The same parabolic-reflector mechanism, scaled past what any single mission needs — giant, huge and large dish reflectors off the shelf for whatever downlink budget the mission calls for.", "parts": [{"name": "nfex-antenna-reflector-giant-1", "mod": "NearFutureExploration", "title": "RFL-2000 Dish Reflector Array"}, {"name": "nfex-antenna-reflector-huge-1", "mod": "NearFutureExploration", "title": "RFL-100 Giant Dish Reflector"}, {"name": "nfex-antenna-reflector-large-1", "mod": "NearFutureExploration", "title": "RFL-50 Large Dish Reflector"}], "upgrades": [], "grants": [], "experiments": []}, "mic_gasChromatographMassSpec": {"title": "Gas Chromatograph-Mass Spectrometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Separate a gas sample by how fast each component moves through a column, then weigh what comes out in the mass spectrometer behind it — two instruments in series reading a single sample far more precisely than either alone.", "parts": [{"name": "SXTsciencenosecone", "mod": "SXT", "title": "GC-MS + Antenna"}, {"name": "sensorAtmosphere", "mod": "Squad", "title": "MS04 - Gas Chromatograph-Mass Spectrometer (GC/MS)"}], "upgrades": [], "grants": [], "experiments": [{"name": "Mass Spectrometer 4", "id": "RP0massSpec4", "sci": 30, "group": "Experiments"}]}, "opt_digitalImaging": {"title": "Solid-State Digital Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Replace the vidicon's scanned electron beam with a solid-state sensor read out electronically, line by line — the same instinct that took reconnaissance from film to television, one generation further. Higher resolution than any vidicon, and nothing left to wear out or burn in.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-DigitalCamera", "mod": "RP-1", "title": "PH05 - Ultra Resolution Digital Imaging Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Advanced Visible Imaging Device", "id": "RP0visibleImaging4", "sci": 6, "group": "Experiments"}]}, "fd_reusableOMSEngine": {"title": "Reusable Orbital-Maneuvering Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Take the pressure-fed multi-restart engine that once had to fire once, perfectly, on the way to the Moon, and shrink it into a routine orbital-maneuvering thruster — sized for a dozen burns a mission instead of one, flown on the same shape for decades after. The Shuttle's OMS, and the same lineage still flying on Orion.", "parts": [{"name": "ROE-AJ10-190", "mod"
