<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

11_als", "mod": "RN_Soviet_Probes", "title": "Luna 11 ALS"}, {"name": "luna13_als", "mod": "RN_Soviet_Probes", "title": "Luna 13 ALS"}, {"name": "luna9_airbag_cvr", "mod": "RN_Soviet_Probes", "title": "Luna 9/13 Airbag Cover"}, {"name": "luna9_als", "mod": "RN_Soviet_Probes", "title": "Luna 9 ALS"}, {"name": "luna_als", "mod": "RN_Soviet_Probes", "title": "Luna 10 ALS"}, {"name": "luna_astro", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 Astro"}, {"name": "luna_ktdu", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 KTDU"}, {"name": "luna_radio", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 Radio"}, {"name": "luna_vernier", "mod": "RN_Soviet_Probes", "title": "Luna Vernier"}], "upgrades": [], "grants": [], "experiments": []}, "okb_modernComsats": {"title": "Modern Soviet \u0026 Russian Comsats", "discipline": "Systems Integration", "color": "#ededed", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "The operational communications constellation: Strela and its Gonets successors — the low-orbit store-and-forward bus that kept a continent's messages moving into the modern era.", "parts": [{"name": "rn_strela3_gonets", "mod": "RN_Soviet_Probes", "title": "Strela-3/Gonets-D1 Satellite Bus"}], "upgrades": [], "grants": [], "experiments": []}, "pc_storables": {"title": "Nitric-Acid Storable Propellants", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "An oxidiser you can keep in the tank for months — fuming nitric acid — that ignites on contact with its fuel, so the engine needs no igniter and no turbopump. The chemistry of the first cheap storable rockets: the sounding motors that clear the Karman line and return the first data from the edge of space.", "parts": [{"name": "ROE-Aerobee", "mod": "ROEngines", "title": "Aerobee"}, {"name": "ROE-VeroniqueAK", "mod": "ROEngines", "title": "Véronique"}, {"name": "ROMeteoSustainer", "mod": "Squad", "title": "U-1250"}], "upgrades": [], "grants": [], "experiments": []}, "fd_turbopumpFeed": {"title": "Turbopump Feed", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 3, "anyToUnlock": true, "flavor": "Drive the propellants with a turbine-spun pump instead of tank pressure — the tank stops being a heavy pressure vessel and the chamber can run far harder than any sounding motor reaches. The step from a powder dart to the turbopump-fed V-2: a large liquid rocket at last.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}], "upgrades": [], "grants": [], "experiments": []}, "fd_singleChamber": {"title": "Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A single small chamber held stable by careful injector design — the first purpose-built kerosene-oxygen boosters a satellite could ride: Vanguard's X-405, and the Atlas sustainer that runs on to orbit after the boosters drop away.", "parts": [{"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}, {"name": "ROE-X405H", "mod": "ROEngines", "title": "X-405H"}], "upgrades": ["RFUpgrade_5D60", "RFUpgrade_A-7"], "grants": [], "experiments": []}, "fd_largeChamber": {"title": "Combustion-Instability Damping", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Scale a single combustion chamber to a meganewton and its own acoustics threaten to tear it apart — injector design and damping hold the burn stable at a size the small chambers never faced. The hard way the West reached orbit: one big stable chamber, where the Soviets clustered many small ones. Atlas, Thor, Blue Streak.", "parts": [{"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-RZ", "mod": "ROEngines", "title": "RZ.1/RZ.2"}], "upgrades": ["RFUpgrade_RD-103"], "grants": [], "experiments": []}, "fd_orbitalSoviet": {"title": "Parallel Engine Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Twenty combustion chambers across four strap-on boosters and a core, all lit on the pad and synchronised — the R-7 that carried Sputnik to orbit. Brute multiplicity where the West built single chambers. Unflyable without vernier steering, which its engines carry built-in.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}], "upgrades": [], "grants": [], "experiments": []}, "fd_orbitalMultiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Scale the clustered-chamber approach to a meganewton — a bank of chambers on a common turbopump delivering booster thrust without ever risking one large unstable chamber. The storable orbital boosters (RD-211, YF-2) that lofted payloads on propellant you could keep in the tank for years.", "parts": [{"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": [], "grants": [], "experiments": []}, "fd_matureOrbital": {"title": "High-Expansion Vacuum Nozzles", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A nozzle bell too large to fire at sea level — the flow would rip away from the walls — but in vacuum it extracts every last metre-per-second from the exhaust. The dedicated upper-stage engines that let the R-7 reach past low orbit toward the Moon: high specific impulse where there is no air to fight.", "parts": [{"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": [], "grants": [], "experiments": []}, "fd_verniers": {"title": "Auxiliary-Chamber Thrust Vectoring", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Steer and roll a large rocket in powered flight with small gimballed auxiliary chambers — full three-axis control, roll especially, before a single main engine can be trusted to gimbal for it. The R-7's verniers are integral to its engines, so you cannot fly the cluster without this; Atlas and Jupiter bolt theirs on.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen: vacuum-jacketed tanks, multilayer insulation and enormous pumps for a low-density fuel, all for the highest specific impulse chemistry there is. It costs a whole node of program time up front just to commit — and this is that commitment.", "parts": [], "upgrades": [], "grants": [], "experiments": []}, "cryo_hydroloxPrototype": {"title": "Hydrogen-Oxygen Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game.", "parts": [{"name": "ROE-RZ20", "mod": "ROEngines", "title": "RZ.20"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": [], "grants": [], "experiments": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Nitrocellulose plasticised with nitroglycerin and extruded into a grain that carries its own oxygen — the older solid chemistry: simple, dense, storable, lit once and done. The JATO boosters and the first Nike stages.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-R103", "mod": "ROEngines", "title": "R-103 Booster"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}, {"name": "sepMotorLarge", "mod": "Squad", "title": "Radial Separation Motor (Large)"}, {"name": "sepMotorSmall", "mod": "Squad", "title": "Radial Separation Motor (Small)"}], "upgrades": [], "grants": [], "experiments": []}, "pc_doubleBaseBooster": {"title": "Double-Base Booster Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Cast a double-base grain large enough to boost a stack off the pad — case-bonded to the motor wall so it burns from the core out without cracking. The Nike booster and the heavy JATO units, where double-base is pushed to its size limit before composite takes over.", "parts": [{"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", "mod": "ROEngines", "title": "Alcyone 1 BE-3"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}], "upgrades": [], "grants": [], "experiments": []}, "pc_compositeSolid": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery polysulfide matrix, cast to shape around an integral nozzle — higher energy than double-base and castable to any size. The Baby Sergeant cluster that spun Explorer 1 to orbit.", "parts": [{"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-BabySergeantX11", "mod": "ROEngines", "title": "Baby Sergeant 11x Cluster"}, {"name": "ROE-BabySergeantX3", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster"}, {"name": "ROE-GCRC", "mod": "ROEngines", "title": "GCRC 33KS-2800"}], "upgrades": [], "grants": [], "experiments": []}, "pc_hypergolics": {"title": "Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, storable for years, restartable after a cold coast. The propellant of upper stages and spacecraft engines that must light every time.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-RD200", "mod": "ROEngines", "title": "RD-200"}, {"name": "ROE-S2253", "mod": "ROEngines", "title": "S2.253/S3.42/S5.2"}], "upgrades": ["RFUpgrade_Model39cI", "RFUpgrade_NitrousOxide", "RFUpgrade_XASR-1", "RFUpgrade_XASR-2", "RFUpgrade_XLR81-BA-5"], "grants": [], "experiments": []}, "pc_ethanol90": {"title": "High-Concentration Alcohol Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "The V-2 burned alcohol cut with a quarter water, because the water was what kept the chamber from burning through. Take the water out and the flame runs hotter and harder — but only once the chamber can survive it. Ninety percent is where the Soviets stopped, and it is worth a third more thrust than the engine they copied.", "parts": [], "upgrades": ["RFUpgrade_RD-101"], "grants": [], "experiments": []}, "pc_rp1": {"title": "Narrow-Cut Refined Kerosene", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Stop burning alcohol and burn kerosene — but not the kerosene an aeroplane gets. Distil a narrow cut, strip the sulphur, cap the aromatics, and specify it so tightly that it stops laying down carbon in the cooling passages on a long burn. The fuel becomes a component with a part number.", "parts": [], "upgrades": ["RFUpgrade_LR43-NA-3", "RFUpgrade_LR89-NA-3"], "grants": [], "experiments": []}, "pc_hydyne": {"title": "Amine-Blend Booster Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Blend an unsymmetrical hydrazine into diethylenetriamine and you get a fuel that outruns alcohol in the same tanks and the same engine — worth sixteen seconds of specific impulse for nothing but a change of what you pour in. It corrodes, it poisons, and the crews hated it; the first American satellite went up on it anyway.", "parts": [], "upgrades": ["RFUpgrade_A-6H"], "grants": [], "experiments": []}, "pc_udmhBoosterFuel": {"title": "Neat Hydrazine-Derivative Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": true, "flavor": "Drop the diluent and feed the booster unsymmetrical dimethylhydrazine straight. It buys nearly twenty seconds over kerosene in the same chamber and costs you a fuel that burns on contact with almost anything, eats seals, and will kill a pad crew that gets careless with a coupling.", "parts": [], "upgrades": ["RFUpgrade_S-3FH"], "grants": [], "experiments": []}, "pc_htp": {"title": "High-Test Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Concentrated hydrogen peroxide decomposed across a silver catalyst into a hot oxidising gas — a storable oxidiser that needs no cryogenics and lights a kerosene engine cleanly. Britain's Gamma sustainers ran on it.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}], "upgrades": ["RFUpgrade_HTP"], "grants": [], "experiments": []}, "pc_stentor": {"title": "Deep-Throttling Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A two-chamber peroxide engine whose small cruise chamber throttles deeply while a fixed chamber boosts — variable thrust from a storable propellant, built for a missile that had to coast and correct. (Britain's Stentor.)", "parts": [{"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}], "upgrades": [], "grants": [], "experiments": []}, "met_stainlessSteel": {"title": "Austenitic Stainless Steel", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Chromium-nickel steel that keeps its strength while hot and holds a higher chamber pressure without a thicker, heavier wall — the metallurgy that turned the V-2's chamber into the Redstone's. Push the pressure, take the thrust.", "parts": [], "upgrades": ["RFUpgrade_A-6", "RFUpgrade_AJ10-27", "RFUpgrade_Model39c", "RFUpgrade_RD-102", "RFUpgrade_RDA-1-150", "RFUpgrade_U-1700", "RFUpgrade_Veronique61", "RFUpgrade_XLR11-RM-5"], "grants": [], "experiments": []}, "fd_injectors": {"title": "Impinging-Jet Injectors", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Aim paired fuel and oxidiser jets to collide and atomise on contact, across a flat plate drilled for even mixing over the whole injector face — more complete combustion, a little more specific impulse from the same propellants. Get it right and a small pressure-fed chamber burns clean enough to fly: the four-chamber engine of a rocket aeroplane, and the combustion craft the turbopump-fed boosters are built on.", "parts": [], "upgrades": ["RFUpgrade_A-9", "RFUpgrade_VeroniqueAGI"], "grants": [], "experiments": []}, "met_nimonic": {"title": "Nimonic Turbine Alloys", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Nickel-chromium superalloy that keeps its strength at red heat — a turbopump turbine that spins hotter and harder feeds a higher chamber pressure, and the very same alloy is what lets a jet turbine run at all. The metallurgy where rockets and jets cross over.", "parts": [], "upgrades": ["RFUpgrade_Avon114R", "RFUpgrade_CJ805-3B", "RFUpgrade_J35-A-17", "RFUpgrade_J47-GE-25A", "RFUpgrade_J48-P-8", "RFUpgrade_J57-P-21", "RFUpgrade_J57-P-43WA", "RFUpgrade_J57-P-7A", "RFUpgrade_JT3C-6", "RFUpgrade_RD-107-11D512", "RFUpgrade_RD-107-8D728", "RFUpgrade_RD-107-8D74-1958", "RFUpgrade_RD-107-8D74-1959", "RFUpgrade_RD-107-8D74K", "RFUpgrade_RD-107-8D74PS", "RFUpgrade_RD-107-8D76", "RFUpgrade_RD-108-8D75-1958", "RFUpgrade_RD-108-8D75-1959", "RFUpgrade_RD-108-8D75K", "RFUpgrade_RD-108-8D75PS", "RFUpgrade_RD-212-8D41", "RFUpgrade_S3.42T", "RFUpgrade_Sapphire203", "RFUpgrade_WP-6"], "grants": [], "experiments": []}, "met_weldedTank": {"title": "Fusion-Welded Pressure Vessels", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Roll, fusion-weld and proof-test a thin metal cylinder that holds its propellant under pressure without bursting — the first tank that flies, and the steel the first engine chambers are cut from. Heavy, but honest.", "parts": [{"name": "ROT-AtlasTank-Separate", "mod": "ROTanks", "title": "Atlas Modular Tank (Conventional Structure)"}, {"name": "ROT-BoosterTank-Separate", "mod": "ROTanks", "title": "Modular Booster Tank (Conventional Structure)"}, {"name": "ROT-GenericTank-Separate", "mod": "ROTanks", "title": "Modular Tank (Conventional Structure)"}, {"name": "ROT-KatnissTank-Separate", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Conventional Structure)"}, {"name": "ROT-LanderTank-Separate", "mod": "ROTanks", "title": "Modular Landing Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-Radial-Separate", "mod": "ROTanks", "title": "Another Modular Radial Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-Separate", "mod": "ROTanks", "title": "Another Modular Tank (Conventional Structure)"}, {"name": "ROT-Nose-Separate", "mod": "ROTanks", "title": "Modular Nose Tank (Conventional Structure)"}, {"name": "ROT-RadialTank-Separate", "mod": "ROTanks", "title": "Radial Tank (Conventional Structure)"}, {"name": "ROT-SphericalTank-Separate", "mod": "ROTanks", "title": "Spherical Tank (Conventional Structure)"}, {"name": "ROT-ToroidalTank-Separate", "mod": "ROTanks", "title": "Modular Toroidal Tank (Conventional Structure)"}, {"name": "ReleaseValve", "mod": "Squad", "title": "FTE-1 Drain Valve"}, {"name": "ca_tank_mp_s", "mod": "CoatlAerospace", "title": "CA-MT10 Propellant Tank (Pressurized)"}], "upgrades": ["RFTech-Tank-Sep-Al"], "grants": [], "experiments": []}, "met_stringerTankage": {"title": "Stringer-Stiffened Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Run longitudinal stringers down the inside of the skin and let them carry the loads the skin alone was buckling under. The wall gets thinner than the tank it replaces and still holds the same column upright.", "parts": [], "upgrades": ["RFTech-Tank-Sep-Al2"], "grants": [], "experiments": []}, "met_aluminiumCopperTankage": {"title": "Aluminium-Copper Alloy Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Alloy the aluminium with copper and it age-hardens: the same tank wall carries more load for less metal, and the duralumin family that made aircraft possible finally makes a lighter rocket too.", "parts": [], "upgrades": ["RFTech-Tank-Sep-AlCu"], "grants": [], "experiments": []}, "met_isogrid": {"title": "Machined Isogrid Stiffening", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Machine a triangular-rib isogrid into thick plate — cutting metal away everywhere the load path doesn't run, leaving only the ribs that carry it. The same stiffness at a fraction of the mass; the light conventional tankage that flies most orbital rockets.", "parts": [{"name": "RO-RFTank-Integral", "mod": "ProceduralParts", "title": "Procedural Tank (Isogrid Structure)"}, {"name": "ROT-AtlasTank-Integral", "mod": "ROTanks", "title": "Atlas Modular Tank (Isogrid Structure)"}, {"name": "ROT-BoosterTank-Integral", "mod": "ROTanks", "title": "Modular Booster Tank (Isogrid Structure)"}, {"name": "ROT-GenericTank-Integral", "mod": "ROTanks", "title": "Modular Tank (Isogrid Structure)"}, {"name": "ROT-KatnissTank-Integral", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Isogrid Structure)"}, {"name": "ROT-LanderTank-Integral", "mod": "ROTanks", "title": "Modular Landing Tank (Isogrid Structure)"}, {"name": "ROT-MiscTank-Integral", "mod": "ROTanks", "title": "Another Modular Tank (Isogrid Structure)"}, {"name": "ROT-MiscTank-Radial-Integral", "mod": "ROTanks", "title": "Another Modular Radial Tank (Isogrid Structure)"}, {"name": "ROT-Nose-Integral", "mod": "ROTanks", "title": "Modular Nose Tank (Isogrid Structure)"}, {"name": "ROT-RadialTank-Integral", "mod": "ROTanks", "title": "Radial Tank (Isogrid Structure)"}, {"name": "ROT-SphericalTank-Integral", "mod": "ROTanks", "title": "Spherical Tank (Isogrid Structure)"}, {"name": "ROT-ToroidalTank-Integral", "mod": "ROTanks", "title": "Modular Toroidal Tank (Isogrid Structure)"}], "upgrades": [], "grants": [], "experiments": []}, "str_balloonTank": {"title": "Pressure-Stabilized Monocoque", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Make the stainless wall so thin it only holds its shape under internal pressure — the Atlas 'steel balloon' reached orbit weighing almost nothing empty, and would crumple if you ever let it depressurise. As much an orbital enabler as any engine.", "parts": [{"name": "RO-RFTank-BalloonNew", "mod": "ProceduralParts", "title": "Procedural Tank (Balloon)"}, {"name": "ROT-AtlasTank-Balloon", "mod": "ROTanks", "title": "Atlas Modular Tank (Balloon)"}, {"name": "ROT-BalloonTank-New", "mod": "ROTanks", "title": "Modular Tank (Balloon)"}, {"name": "ROT-KatnissTank-Balloon", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Balloon)"}, {"name": "ROT-MiscTank-Balloon", "mod": "ROTanks", "title": "Another Modular Tank (Balloon)"}], "upgrades": [], "grants": [], "experiments": []}, "str_staging": {"title": "Pyrotechnic Frangible Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Frangible joints and shaped charges cut a spent stage away on a millisecond's command; small motors settle the propellant for the next light. The only way to the velocities chemistry can't reach in one burn.", "parts": [{"name": "ROE-120XDecoupler", "mod": "ROEngines", "title": "UA120X Radial Decoupler"}, {"name": "ROT-RingDecoupler", "mod": "ROTanks", "title": "Ring Decoupler"}, {"name": "proceduralStackDecoupler", "mod": "ProceduralParts", "title": "Decoupler [Procedural]"}, {"name": "radialDecoupler", "mod": "Squad", "title": "TT-38K Radial Decoupler"}, {"name": "sargas_decoupler_s1p5_1", "mod": "Tantares", "title": "TKS VA Capsule Decoupler"}], "upgrades": [], "grants": [], "experiments": []}, "aero_fairings": {"title": "Jettisonable Payload Fairings", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Shroud the payload through the dense lower atmosphere, then split and jettison it cleanly once the air thins — aerodynamic protection that must vanish on command.", "parts": [{"name": "KzInterstageAdapter2", "mod": "ProceduralFairings", "title": "IB - Procedural Interstage Fairing Adapter"}, {"name": "KzResizableFairingBase", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base"}, {"name": "KzResizableFairingBaseRing", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base Ring"}], "upgrades": [], "grants": [], "experiments": []}, "tel_telemetry": {"title": "Pulse-Interval Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Encode a reading as the gap between radio pulses and beam it down on a fixed carrier — the beep-beep that proved a satellite was alive and returned its first data. The whole point of orbit, if you can't hear it.", "parts": [{"name": "SXTAntenna", "mod": "SXT", "title": "Sputnik PS-1 Antenna"}, {"name": "SurfAntenna", "mod": "Squad", "title": "Communotron 16-S"}, {"name": "longAntenna", "mod": "Squad", "title": "Communotron 16"}, {"name": "nfex-antenna-rover-2", "mod": "NearFutureExploration", "title": "AX-5 Aerial Micro-Antenna"}], "upgrades": [], "grants": [], "experiments": []}, "tel_onboardRecording": {"title": "Endless-Loop Tape Recording", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "A loop of magnetic tape that writes while the craft is alone and plays it all back on command when a station rises over the horizon — the difference between a satellite that reports what happens overhead and one that reports its whole orbit.", "parts": [], "upgrades": ["HDD-Upgrade-Early"], "grants": [], "experiments": []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Seal the electronics in a pressurised sphere with a circulating gas and a polished radiating skin, holding them at room temperature through the swing from sunlight to shadow. Sputnik was mostly this: a bus that keeps its instruments alive.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}], "upgrades": ["MLI.Upgrade1"], "grants": [], "experiments": []}, "elec_semiconductorDiode": {"title": "Semiconductor Diodes", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "A sliver of doped crystal that passes current one way only — grown up from the cat's-whisker radio detector into a rugged solid-state device. It lights an indicator on almost no power, and it is the seed of everything solid-state: rectifiers, transistors, the integrated circuit still to come. Microelectronics grows from here.", "parts": [{"name": "ROC-ApolloDockingLightBDB", "mod": "ROCapsules", "title": "Apollo Docking Spotlight"}, {"name": "ROC-ApolloEVALightBDB", "mod": "ROCapsules", "title": "Apollo EVA Spotlight"}, {"name": "SmallPointLight", "mod": "VenStockRevamp", "title": "MK 4 Point Light"}, {"name": "SmallSpotLight", "mod": "VenStockRevamp", "title": "MK 3 Mini Spotlight"}, {"name": "SmallStripLight", "mod": "VenStockRevamp", "title": "MK 5 Strip Light"}, {"name": "domeLight1", "mod": "Squad", "title": "Domelight Mk1"}, {"name": "groundLight1", "mod": "Squad", "title": "Work Lamp (Small)"}, {"name": "groundLight2", "mod": "Squad", "title": "Work Lamp (Stand)"}, {"name": "navLight1", "mod": "Squad", "title": "Navigation Light Mk1"}, {"name": "spotLight1", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight1_v2", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight2_v2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight3", "mod": "Squad", "title": "Spotlight Mk1"}, {"name": "stripLight1", "mod": "Squad", "title": "Lightstrip Mk1"}], "upgrades": ["HDD-Upgrade-Basic"], "grants": [], "experiments": []}, "elec_transistor": {"title": "Transistor Amplification", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Replace the fragile, power-hungry vacuum tube with a sliver of doped germanium that amplifies and switches a signal cold, on almost nothing — the active device the diode could never be. Microelectronics proper begins here: every transistorised instrument, guidance platform and television camera that follows is built on this one breakthrough.", "parts": [], "upgrades": ["HDD-Upgrade-1961"], "grants": [], "experiments": []}, "elec_silverZinc": {"title": "Silver-Zinc Primary Batteries", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Pair a silver oxide cathode against a zinc anode and the cell gives up more energy for its mass than anything else that will fit in a payload — ruinously expensive, flat in a matter of days, and entirely good enough for a satellite whose whole job is to transmit until it stops. Sputnik was three of these and a radio.", "parts": [], "upgrades": ["RFTech-Battery-II"], "grants": [], "experiments": []}, "elec_siliconPV": {"title": "Diffused-Junction Photovoltaics", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Diffuse a shallow junction into a silicon wafer so sunlight knocks a current across it — grams of cells that trickle-charge a battery indefinitely, outliving every chemical primary. Vanguard 1 is still up there, still lit.", "parts": [{"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}, {"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}, {"name": "RO_EarlyTinySolarPanel", "mod": "Squad", "title": "ST1 Tiny Solar Panel"}], "upgrades": [], "grants": [], "experiments": []}, "rob_rotorActuation": {"title": "Electric Rotor Actuation", "discipline": "Robotics", "color": "#d98c2b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A brushless electric motor married to a solid-state controller that holds it at any commanded speed or angle — the first actuator a machine can move on its own. Nothing in an unmanned launcher spins one yet, but every arm, rover wheel, tracking mount and deployable to come turns on this.", "parts": [{"name": "rotor_01", "mod": "SquadExpansion", "title": "EM-16 Light Duty Rotor"}, {"name": "rotor_01s", "mod": "SquadExpansion", "title": "EM-16S Light Duty Rotor"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_rcs": {"title": "Cold-Gas Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Bleed compressed nitrogen through opposed nozzles to nudge a craft's attitude — no combustion, nothing to go wrong, just enough impulse to point. The simplest way to hold an orientation in vacuum.", "parts": [{"name": "RO-2kN-Thruster", "mod": "Squad", "title": "2.2/3.6kN Thruster"}, {"name": "ROE-Agena_EquipmentRack", "mod": "ROEngines", "title": "Agena Equipment Rack"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": ["RFTech-rcs-tltech1"], "grants": [], "experiments": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "A small drogue bites the thin high air to hold a falling body straight and slow it enough that a main canopy can open without tearing — the difference between a returned payload and a crater.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": [], "grants": [], "experiments": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture.", "parts": [{"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-SampleReturnCommand", "mod": "RP-1", "title": "Sample Return Command Module (DEPRECATED)"}, {"name": "science_module", "mod": "Squad", "title": "PH01 - Early Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_fineGrainEmulsion": {"title": "Fine-Grain Emulsion", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Smaller silver-halide crystals record finer detail on the same frame, through the same lens — resolution bought in the darkroom rather than the optical shop. The penalty is speed: a slower emulsion needs a longer exposure, and a satellite does not hold still.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_vidicon": {"title": "Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Scan a photoconductive target with an electron beam and read the image off as a video signal — lower resolution than film, but it comes down the radio link the instant you take it. No capsule to recover.", "parts": [{"name": "RO-EarlyTVCamera", "mod": "RP-1", "title": "VI01 - Early Television Camera"}, {"name": "aerocam", "mod": "HullCameraVDS", "title": "Aerocam"}, {"name": "aerocam180", "mod": "HullCameraVDS", "title": "Aerocam 180"}, {"name": "hc_booster", "mod": "HullCameraVDS", "title": "BoosterCam"}, {"name": "hc_kazzelblad", "mod": "HullCameraVDS", "title": "BoosterCam"}, {"name": "hc_launchcam", "mod": "HullCameraVDS", "title": "KSC Launchpad Camera"}, {"name": "hc_navcam", "mod": "HullCameraVDS", "title": "NavCam"}, {"name": "hc_nightvision", "mod": "HullCameraVDS", "title": "Nightvisioncam"}, {"name": "hc_scicam", "mod": "HullCameraVDS", "title": "ScienceCam"}, {"name": "hc_wideangle", "mod": "HullCameraVDS", "title": "Wide Angle Cam"}, {"name": "kerbpro", "mod": "HullCameraVDS", "title": "KerbPro"}, {"name": "mumech_hullcam", "mod": "HullCameraVDS", "title": "Basic Hull Camera Deluxe"}], "upgrades": [], "grants": [], "experiments": [{"name": "Early TV Camera", "id": "RP0visibleImaging1", "sci": 1, "group": "Experiments"}]}, "nuc_geiger": {"title": "Geiger-Müller Ionization Counting", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "A wire at high voltage in a gas tube: a single charged particle triggers an avalanche you can read as a click. The instrument that found the radiation belts on the first American satellite.", "parts": [{"name": "RO-GeigerMuller", "mod": "RP-1", "title": "CR01 - Geiger-Muller Counter"}, {"name": "RO-Micrometeorite", "mod": "RP-1", "title": "MM01 - Micrometeorite Detector"}], "upgrades": [], "grants": [], "experiments": [{"name": "Micrometeorite Detector", "id": "micrometeoriteDetect", "sci": 7, "group": "Experiments"}, {"name": "Radiation Detector 1", "id": "RP0cosmicRay1", "sci": 10, "group": "Experiments"}]}, "mic_massSpec": {"title": "Magnetic-Sector Mass Spectrometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Ionise a gas sample and bend the ions through a magnetic field — heavier species curve less, sorting the upper atmosphere into a spectrum of masses. What the air is actually made of, up there. Earth's upper air is stirred until it is the same everywhere, so orbit returns one answer for the planet; the Moon's whisper-thin exosphere is not mixed at all, and a spectrometer left on the ground finds a different mixture at every site.", "parts": [{"name": "RO-IonMassSpectrometer", "mod": "RP-1", "title": "MS01 - Ion Mass Spectrometer"}, {"name": "USFluidSpectroWedge", "mod": "UniversalStorage2", "title": "Mass Spectrometer Unit"}], "upgrades": [], "grants": [], "experiments": [{"name": "Mass Spectrometer 1", "id": "RP0massSpec1", "sci": 8, "group": "Experiments"}]}, "mic_magnetometer": {"title": "Fluxgate Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Drive a soft-ferrite core in and out of saturation and read how the ambient field skews the cycle — a solid-state compass sensitive enough to map the planet's field from orbit, on a boom to escape the craft's own iron. Earth's dipole is one smooth field that reads the same from any orbit you fly. The Moon has no dipole at all — only patches of crustal magnetism frozen in four billion years ago, and telling them apart means a station left standing on the ground.", "parts": [{"name": "RO-EarlyMagnet", "mod": "RP-1", "title": "MG01 - Early Magnetometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Magnetometer 1", "id": "RP0magScan1", "sci": 6, "group": "Experiments"}]}, "bio_cultures": {"title": "Space-Exposed Biology", "discipline": "Life Support", "color": "#f0508a", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Fly gels, spores and living cultures sealed in a capsule, then recover them to see what vacuum, cold and raw radiation did — the first read on whether anything alive survives above the atmosphere. The seed of every later life-sciences payload.", "parts": [{"name": "BioCapsule", "mod": "SXT", "title": "Advanced Biological Capsule"}, {"name": "GooExperiment", "mod": "Squad", "title": "Biological Sample Capsule"}, {"name": "SXTProbeGooo", "mod": "SXT", "title": "Biological Sample Capsule"}, {"name": "USGooBayWedge", "mod": "UniversalStorage2", "title": "Biological Sample Capsule"}], "upgrades": [], "grants": [], "experiments": []}, "mic_atmoSounding": {"title": "Upper-Atmosphere Sounding", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Fly the thermometer and the barometer up a sounding rocket and read them where balloons can't reach — the first instruments to tell us what the air is doing at the edge of space. The measurement is turn one; carrying it above the atmosphere is the breakthrough.", "parts": [], "upgrades": [], "grants": [], "experiments": []}, "aero_subsonicWing": {"title": "Subsonic Aerodynamics", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Beyond the bare procedural wing you begin with, the craft of subsonic aerodynamics: the control surfaces and all-moving tail that make it a controllable platform, and the pitot and radial intakes that feed an engine cleanly. The root the rest of aerodynamics grows from.", "parts": [{"name": "CircularIntake", "mod": "Squad", "title": "Pitot Intake"}, {"name": "IntakeRadialLong", "mod": "Squad", "t lock": false, "flavor": "No wheels, no retraction — just a shock-absorbing strut that swings out once and takes the full load of touching down somewhere with no runway at all.", "parts": [{"name": "ROC-LEMDescentBDB", "mod": "ROCapsules", "title": "Apollo LM Descent Stage"}, {"name": "ROC-LEMLegsBDB", "mod": "ROCapsules", "title": "Apollo LM Legs"}, {"name": "ROC-LEMTruckPlatformBDB", "mod": "ROCapsules", "title": "AES LM Truck Payload Platform"}, {"name": "landingLeg1", "mod": "Squad", "title": "LT-1 Landing Struts"}, {"name": "landingLeg1-2", "mod": "Squad", "title": "LT-2 Landing Strut"}, {"name": "vela_landing_leg_srf_1", "mod": "Tantares", "title": "LK-700 Landing Leg"}, {"name": "vela_landing_leg_srf_2", "mod": "Tantares", "title": "LK-700 Landing Leg"}], "upgrades": [], "grants": [], "experiments": []}, "str_adjustableGear": {"title": "Adjustable Heavy Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Load-rated landing gear with adjustable ride height and stance, sized from a light trainer to a heavy jet — the sophisticated oleo strut for aircraft too big or too fast for the basic legs it grows past. A separate research, off the stock undercarriage.", "parts": [{"name": "KF-ALG-Large", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Large)"}, {"name": "KF-ALG-Large-Spaceplane", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Large) (Spaceplane)"}, {"name": "KF-ALG-Medium", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Medium)"}, {"name": "KF-ALG-Medium-Spaceplane", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Medium) (Spaceplane)"}, {"name": "KF-ALG-Small", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Small)"}, {"name": "KF-ALG-Small-Spaceplane", "mod": "KerbalFoundries", "title": "Adjustable Landing Gear (Small) (Spaceplane)"}, {"name": "KF-ALG-SmallSide", "mod": "KerbalFoundries", "title": "Adjusta "}, {"name": "RO-JT3C", "mod": "Squad", "title": "J57 Turbojet (No Afterburner)"}], "upgrades": [], "grants": [], "experiments": []}, "aero_supersonicWing": {"title": "Swept-Wing Planform", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Rake the wing back so the flow across it stays subsonic while the aircraft goes supersonic, delaying the shock stall — with a shock-cone intake that decelerates the air before it reaches the compressor. What makes level supersonic flight possible at all.", "parts": [{"name": "RO-B9ProcAMWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing, All-Moving (Supersonic)"}, {"name": "RO-B9ProcCS-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Control Surface (Supersonic)"}, {"name": "RO-B9ProcWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Supersonic)"}, {"name": "RO-shockConeIntake125", "mod": "Squad", "title": "1.25m Shock Cone Intake"}, {"name": "RO-shockConeIntakeBomarc", "mod": "Squad", "title": "0.70m Shock Cone Intake"}, {"name": "RO-shockConeIntakeMig", "mod": "Squad", "title": "0.86m Shock Cone Intake"}, {"name": "SXTRadialAirIntakeShockCone", "mod": "SXT", "title": "XF-104 Radial Shock Cone Intake"}, {"name": "airbrake1", "mod": "Squad", "title": "A.I.R.B.R.A.K.E.S"}, {"name": "shockConeIntake", "mod": "Squad", "title": "Shock Cone Intake"}], "upgrades": [], "grants": [], "experiments": []}, "av_afterburner": {"title": "Afterburning Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Dump raw fuel into the hot exhaust behind the turbine and light it — a burst of thrust that shoves a fighter through the transonic drag rise, at a ruinous fuel cost. Reheat: the supersonic dash.", "parts": [{"name": "RO-AL7F", "mod": "Squad", "title": "AL-7 Turbojet"}, {"name": "RO-J48", "mod": "Squad", "title": "J48/Tay Turbojet"}, {"name": "RO-RD9B", "mod": "Squad", "title": "RD-9 Turbojet"}, {"name": "RO-Sapphire203", "mod": "Squad", "title": "Sapphire Turbojet"}, {"name": "aje_avon", "mod": "Squad", "title": "Avon Turbojet"}, {"name": "aje_j57", "mod": "Squad", "title": "J57 Turbojet"}], "upgrades": ["RFUpgrade_J47-GE-27"], "grants": [], "experiments": [{"name": "Mach 2 flight", "id": "RP0SupersonicLow2", "sci": 14, "group": "Crew Science"}, {"name": "Supersonic flight", "id": "RP0SupersonicLow1", "sci": 9, "group": "Crew Science"}]}, "av_variableStator": {"title": "Variable-Stator Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Pivot the compressor's stator vanes to keep the airflow attached across a huge speed range — the engine that holds Mach 2 without stalling its own compressor. The Starfighter's powerplant.", "parts": [{"name": "RO-J85GE5", "mod": "Squad", "title": "J85 Turbojet"}, {"name": "aje_j75", "mod": "Squad", "title": "J75 Turbojet"}, {"name": "aje_j79", "mod": "Squad", "title": "J79 Turbojet"}, {"name": "turboFanEngine", "mod": "Squad", "title": "J58 Turbojet"}], "upgrades": [], "grants": [], "experiments": []}, "av_ramjet": {"title": "Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Above Mach 2 the forward speed alone rams and compresses the air — no compressor, no turbine, just an inlet, a flame and a nozzle. Useless from a standstill, unbeatable once you are already fast. Missiles and interceptors.", "parts": [{"name": "RO-Nord1500", "mod": "Squad", "title": "Nord 1500/Atar Combined Cycle Ramjet"}, {"name": "RO-RJ43", "mod": "Squad", "title": "RJ43 Ramjet"}, {"name": "RO-RJ47", "mod": "Squad", "title": "RJ47 Ramjet"}, {"name": "RO-RJ55", "mod": "Squad", "title": "RJ55/J67 Combined Cycle Ramjet"}, {"name": "RO-RJ59", "mod": "Squad", "title": "RJ59 Ramjet"}, {"name": "aje_ramjet", "mod": "Squad", "title": "CR2 Ramjet"}], "upgrades": [], "grants": [], "experiments": [{"name": "High altitude flight", "id": "RP0SupersonicHigh1", "sci": 25, "group": "Crew Science"}, {"name": "Hypersonic flight", "id": "RP0SupersonicHigh2", "sci": 20, "group": "Crew Science"}]}, "fd_throttleableRocketplane": {"title": "Throttle-Valve Aircraft Rocket", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A throttle valve on an aircraft rocket at last — the Curtiss-Wright XLR25 could be modulated continuously in flight instead of stepped chamber by chamber, the first US rocket a pilot flew on the stick. The X-2's engine: the bridge from the X-1's fixed chambers to the X-15's man-rated throttle.", "parts": [{"name": "ROE-XLR25", "mod": "ROEngines", "title": "XLR25"}], "upgrades": ["RFUpgrade_RDA-1-300", "RFUpgrade_XLR35-RM-1"], "grants": [], "experiments": []}, "fd_throttlingRocket": {"title": "Throttleable Restartable Rocket", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A rocket a pilot can throttle deeply and relight in flight, burning ammonia and oxygen with control enough to fly the edge of space and come back. The X-15's XLR99: the first man-rated throttleable engine, and the doorway to hypersonics.", "parts": [{"name": "ROE-XLR99", "mod": "ROEngines", "title": "XLR99"}], "upgrades": [], "grants": [], "experiments": []}, "aero_hotStructure": {"title": "Hot-Structure Airframe", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Build the airframe itself to run hot — an Inconel-X skin that carries flight loads while glowing, shrugging off the friction heat that would soften aluminium, so drop tanks and an ablative overspray can push the same aircraft past Mach 6. The X-15A-2: the fastest a piloted aeroplane has ever flown.", "parts": [], "upgrades": [], "grants": [], "experiments": []}, "str_structuralH
