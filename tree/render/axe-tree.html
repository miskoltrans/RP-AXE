", "parts": [{"name": "RO-ImprovedFilmCamera", "mod": "RP-1", "title": "PH03 - Improved Film Camera"}], "upgrades": [], "grants": []}, "opt_largeApertureOptics": {"title": "Large-Aperture Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Resolution is set by the diameter of the glass, so the camera stops being a payload and becomes the spacecraft — a mirror the length of the bus, folded to fit a fairing and held in focus while the structure warms and cools. Grain and lens motion are no longer the limit; diffraction is.", "parts": [{"name": "RO-HighResFilmCamera", "mod": "RP-1", "title": "PH04 - High Resolution Film Camera"}], "upgrades": [], "grants": []}, "opt_tvRecon": {"title": "Television Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Higher-resolution vidicon cameras that scan the reconnaissance image down a radio link the moment it is taken — no capsule to recover, the picture on the ground in minutes. The electronic eye catching up to the spy film.", "parts": [{"name": "RO-BasicTVCamera", "mod": "RP-1", "title": "VI02 - Basic TV Camera"}], "upgrades": [], "grants": []}, "opt_remoteSensing": {"title": "Infrared Remote Sensing", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Scan the planet in wavelengths the eye cannot see: an infrared radiometer maps cloud-top temperature, an ultraviolet spectrometer reads the high atmosphere. The first weather and earth-resource sensing from orbit.", "parts": [{"name": "RO-IRRadiometer", "mod": "RP-1", "title": "IR01 - Infrared Radiometer"}], "upgrades": [], "grants": []}, "opt_irRadiometry": {"title": "High-Resolution Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A finer detector and a tighter scan resolve the infrared scene into detail the first radiometer blurred — the warm and cold of a coastline or a storm system mapped sharply, still in a single band but now worth the downlink.", "parts": [{"name": "RO-HRIRRadiometer", "mod": "RP-1", "title": "IR02 - High-Resolution Infrared Radiometer"}, {"name": "dmUS2GoreSat", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "opt_twoChannelIR": {"title": "Two-Channel Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's.", "parts": [{"name": "RO-TwoChannelIR", "mod": "RP-1", "title": "IR03 - Two-Channel Infrared Radiometer"}], "upgrades": [], "grants": []}, "opt_uvSpectrometry": {"title": "Ultraviolet Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it.", "parts": [{"name": "RO-NIMS", "mod": "RP-1", "title": "IS03 - Near Infrared Mapping Spectrometer (NIMS) and Ultraviolet Spectrometer (UVS)"}, {"name": "RO-UVSpectrometer", "mod": "RP-1", "title": "IS02 - Ultraviolet Spectrometer"}], "upgrades": [], "grants": []}, "opt_refinedTV": {"title": "Refined Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-ImprovedTVCamera", "mod": "RP-1", "title": "VI03 - Improved TV Camera"}], "upgrades": [], "grants": []}, "mic_boomMagnetometry": {"title": "Boom-Deployed Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there.", "parts": [{"name": "dmUS2MagBoom", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "opt_precisionOptics": {"title": "Precision Orbital Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "A long-focal-length telescope trained on the surface from orbit, resolving detail a wide-angle camera smears into a blur — the optical reconnaissance that reads a runway, not just a coastline. Glass figured to the edge of the aperture and held rock-steady on a stabilised platform, for at this focal length the smallest jitter is a smear.", "parts": [{"name": "dmUS2Scope", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "elec_deployableArrays": {"title": "Deployable Photovoltaic Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch.", "parts": [{"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}], "upgrades": ["solarTL1"], "grants": []}, "gnc_basicAvionics": {"title": "Miniaturised Inertial Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised.", "parts": [], "upgrades": ["HDD-Upgrade-1961", "HDD-Upgrade-1964", "HDD-Upgrade-Basic", "RFTech-ComSat-II", "RFTech-NavSat-II", "RP-1-PayloadTech-Axial"], "grants": ["Science-Core-basicAvionics"]}, "shd_basicAvionics": {"title": "Radiation-Shielded Avionics — Basic", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Wrap the same guidance stack in radiation shielding and a hardened chassis so it can outlast a passage through the Van Allen belts and beyond — heavier and pricier than the bare avionics it protects, but no longer confined to Earth's magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-basicAvionics"]}, "tel_dopplerRanging": {"title": "Coherent Doppler Ranging", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon.", "parts": [], "upgrades": ["commsTL1"], "grants": ["RP0Level2TrackingStation"]}, "tel_pcmTelemetry": {"title": "Pulse-Code Modulation Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": ["commsTL2"], "grants": ["RP0Level3TrackingStation"]}, "str_equipmentBays": {"title": "Enclosed Equipment Bays", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose.", "parts": [{"name": "ROC-GeminiEquipmentSectionBDB", "mod": "ROCapsules", "title": "Gemini Equipment Section"}, {"name": "ROC-LEMMESABDB", "mod": "ROCapsules", "title": "Apollo LM Material Experiment Stowage Assembly"}, {"name": "RO_ServiceBay_300", "mod": "Squad", "title": "Service Bay [3m]"}, {"name": "ServiceBay_250_v2", "mod": "Squad", "title": "Service Bay [4m]"}, {"name": "USRadialTanks", "mod": "UniversalStorage2", "title": "Universal Storage: Radial Tank"}, {"name": "restock-nosecone-1875-1", "mod": "ReStockPlus", "title": "Protective Rocket Nose Mk18"}], "upgrades": ["RFTech-SM-II"], "grants": []}, "pc_akOxidiser": {"title": "Inhibited Nitric-Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Red fuming nitric acid dissolves the tank it is stored in; add a fraction of a percent of hydrofluoric acid and it lays down a fluoride film that stops the attack instead. The oxidiser that was only ever a laboratory problem becomes something a missile can sit fuelled with for years.", "parts": [], "upgrades": ["RFUpgrade_AJ10-118D", "RFUpgrade_RD-217-8D515", "RFUpgrade_XLR81-BA-7", "RFUpgrade_YF-1A"], "grants": []}, "pc_ntoHypergolics": {"title": "Dinitrogen-Tetroxide Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it.", "parts": [], "upgrades": ["RFUpgrade_RD-214-8D59", "RFUpgrade_RD-214U-8D59U", "RFUpgrade_RD-250-8D518", "RFUpgrade_RD-250PM", "RFUpgrade_RD-252-8D724", "RFUpgrade_RD-855", "RFUpgrade_RD-856", "RFUpgrade_S5.2", "RFUpgrade_YF-1B", "RFUpgrade_YF-3A"], "grants": []}, "pc_htpSustainer": {"title": "Multi-Chamber Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}], "upgrades": [], "grants": []}, "pc_larchPeroxide": {"title": "Refined Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off.", "parts": [], "upgrades": ["RFUpgrade_Gamma-301", "RFUpgrade_Larch-2", "RFUpgrade_Larch-4", "RFUpgrade_Larch-8"], "grants": []}, "pc_fluorine": {"title": "Liquid-Fluorine Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": ["RFUpgrade_XLR81-LF2-SPS"], "grants": []}, "pc_scoutSolids": {"title": "Staged Solid Boost", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it.", "parts": [{"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}], "upgrades": ["RFUpgrade_Castor-1-SL", "RFUpgrade_Castor-1-Vac"], "grants": []}, "pc_strapOnSolids": {"title": "Strap-On Thrust Augmentation", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta.", "parts": [{"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Castor1_Inline", "mod": "ROEngines", "title": "Castor 1"}], "upgrades": [], "grants": []}, "pc_retroKick": {"title": "Vacuum-Start Solid Impulse", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail.", "parts": [{"name": "ROC-GeminiRetroMECBDB", "mod": "ROCapsules", "title": "Gemini Retro Rocket (Star-13E)"}, {"name": "ROC-MercuryPosigradeBDB", "mod": "ROCapsules", "title": "Mercury Posigrade Kick Motor"}, {"name": "ROC-MercuryRetroBDB", "mod": "ROCapsules", "title": "Mercury Retro (TE-M-316)"}, {"name": "ROC-VoskhodRetroBooster", "mod": "ROCapsules", "title": "Voskhod Retro Package"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-Agena_Spinrocket", "mod": "ROEngines", "title": "Agena 1KS30HA Spin Rocket"}], "upgrades": [], "grants": []}, "fd_regenCooling": {"title": "Regenerative Chamber Cooling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware.", "parts": [], "upgrades": ["RFUpgrade_LR105-NA-3", "RFUpgrade_LR79-NA-9", "RFUpgrade_LR87-AJ-3", "RFUpgrade_LR89-NA-5", "RFUpgrade_LR89-NA-6", "RFUpgrade_LR91-AJ-3", "RFUpgrade_RD-108-8D77", "RFUpgrade_RZ.2-Mk3", "RFUpgrade_S-3D", "RFUpgrade_Viking-4", "RFUpgrade_Viking-5", "RFUpgrade_XLR11-RM-13-8K"], "grants": []}, "fd_vacuumExpansion": {"title": "Extended Vacuum Expansion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}], "upgrades": ["RFUpgrade_LR101-NA-11", "RFUpgrade_LR105-NA-5", "RFUpgrade_LR105-NA-6", "RFUpgrade_LR89-NA-7.1", "RFUpgrade_LR89-NA-7.2", "RFUpgrade_RD-0106", "RFUpgrade_RD-0109", "RFUpgrade_RD-119-8D710", "RFUpgrade_RD-225-8D721", "RFUpgrade_RL10A-3-1", "RFUpgrade_RL10A-3-3B", "RFUpgrade_X-405H", "RFUpgrade_X-405H-2", "RFUpgrade_XLR11-RM-13-10K", "RFUpgrade_XLR81-BA-11", "RFUpgrade_YF-22B", "RFUpgrade_YF-23B"], "grants": []}, "fd_restartableUpper": {"title": "Restartable Vacuum Ignition", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come.", "parts": [{"name": "LargeOMS", "mod": "VenStockRevamp", "title": "Astris"}, {"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": ["RFUpgrade_AJ10-101A", "RFUpgrade_AJ10-118", "RFUpgrade_AJ10-42"], "grants": []}, "fd_spacecraftPropulsion": {"title": "Restartable Deep-Throttling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-C1", "mod": "ROEngines", "title": "C-1"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": ["RFUpgrade_AJ10-142", "RFUpgrade_XLR81-BA-1", "RFUpgrade_XLR81-BA-3"], "grants": []}, "fd_storableSustainer": {"title": "Storable Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute.", "parts": [{"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF3_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-3 (no gimbal)"}, {"name": "YF3_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-3 with Boattail"}], "upgrades": ["RFUpgrade_U-2000"], "grants": []}, "fd_titanTandem": {"title": "Altitude-Start Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design.", "parts": [{"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}], "upgrades": [], "grants": []}, "fd_longMarchStorable": {"title": "Storable Chamber Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice.", "parts": [{"name": "YF20_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20"}, {"name": "YF21_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-21"}, {"name": "YF22_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-22"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}, {"name": "YF25K_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20 with Boattail (no gimbal)"}], "upgrades": [], "grants": []}, "fd_longMarchBoattail": {"title": "Integrated Booster Boattail", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Wrap the clustered first stage in its aerodynamic boattail and it stops being a bare cluster of chambers and becomes a complete, flight-configured stage — the CZ-2, CZ-2C and CZ-2D as they actually stacked. Same four storable chambers as the clustered first stage it branches from; procedural structure builds the same fairing for nothing, so this is off-the-shelf convenience, not a new engine.", "parts": [{"name": "YF21_with_shell_CZ-2", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2 Boattail"}, {"name": "YF21_with_shell_CZ-2C", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2C Boattail"}, {"name": "YF21_with_shell_CZ-2D", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2D Boattail"}], "upgrades": [], "grants": []}, "int_dongFangHong1": {"title": "China's First Satellite", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A third nation reaches orbit on its own hardware — a small sphere broadcasting a patriotic melody instead of a beeping tone, riding the same clustered-storable first stage into space.", "parts": [{"name": "DFH-1", "mod": "KerwisChineseAerospacePack", "title": "DongFangHong-1 Satelite"}], "upgrades": [], "grants": []}, "fd_sovietStorable": {"title": "Storable Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}], "upgrades": [], "grants": []}, "fd_saturnKerolox": {"title": "High-Pressure Kerolox Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-H1C", "mod": "ROEngines", "title": "H-1C Series"}, {"name": "ROE-H1D", "mod": "ROEngines", "title": "H-1D Series"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RS27", "mod": "ROEngines", "title": "H-1/RS-27"}], "upgrades": [], "grants": []}, "met_cooledTurbine": {"title": "Air-Cooled Turbine Blades", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust.", "parts": [], "upgrades": ["RFUpgrade_AL-7F-1", "RFUpgrade_Atar09K-50", "RFUpgrade_Atar101E-3", "RFUpgrade_Avon200R", "RFUpgrade_J57-P-20A", "RFUpgrade_J75-P-19", "RFUpgrade_J79-GE-5C", "RFUpgrade_J85-GE-5", "RFUpgrade_R-15BD-300", "RFUpgrade_RB162-4D", "RFUpgrade_RD-9AF2-300", "RFUpgrade_RD-9BF-811", "RFUpgrade_WP-6A", "RFUpgrade_WP-6A-III", "RFUpgrade_WP-7"], "grants": []}, "av_turboprop": {"title": "Geared Turboprop", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Gear the axial turbine down to swing a large propeller instead of blasting a jet — trading top speed for the fuel economy and heavy-lift pull a jet cannot match down low. The Tu-95's monstrous contra-rotating NK-12 and the workhorse PT6: turbine power delivered through a propeller.", "parts": [{"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "SXTPWPT6", "mod": "SXT", "title": "PT6A Turboprop"}], "upgrades": [], "grants": []}, "av_hydrogenJet": {"title": "Hydrogen-Fuelled Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Feed the jet liquid hydrogen instead of kerosene — a fuel so energetic it promises altitude and range no kerosene burner can reach, at the price of a vacuum-jacketed fuel system feeding a red-hot engine. The Model 304 of the CL-400 Suntan spyplane: a gamble that flew on the coldest fuel there is, then stayed on the bench.", "parts": [{"name": "RO-model304", "mod": "Squad", "title": "Model 304 Turbojet"}], "upgrades": [], "grants": []}, "av_highTempTurbojet": {"title": "High-Temperature Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "With a cooled turbine able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage.", "parts": [{"name": "RO-R11F", "mod": "Squad", "title": "R-11 Turbojet"}, {"name": "aje_atar", "mod": "Squad", "title": "Atar 09 Turbojet"}, {"name": "miniJetEngine", "mod": "Squad", "title": "J85 Turbojet (No Afterburner)"}], "upgrades": ["RFUpgrade_J79-GE-11", "RFUpgrade_J79-GE-2A", "RFUpgrade_J79-MTU-J1K"], "grants": []}, "av_ramjetAdvanced": {"title": "Refined Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearLargeSpaceplane", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear (Spaceplane)"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}, {"name": "GearMediumSpaceplane", "mod": "Squad", "title": "LY-60 Large Landing Gear (Spaceplane)"}], "upgrades": [], "grants": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour and holding the structure behind it cool. The one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}, {"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A denser char layer and a slower burn-through rate let the same shield shrug off a hotter, faster reentry — the material getting better, not the shape changing. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS", "MercuryHS"], "grants": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", "title": "Life Support Config Engine"}, {"name": "kerbalism-lifesupportmodule", "mod": "KerbalismConfig", "title": "External ECLSS Module"}], "upgrades": [], "grants": []}, "life_crewedExperimentBay": {"title": "Crew-Tended Experiment Locker", "discipline": "Life Support", "color": "#f0508a", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "A modular science bay built into the cabin wall, serviced by hand instead of run by a timer — the same slot-in experiment rig whichever crewed vehicle happens to carry it, so long as someone is aboard to work it.", "parts": [{"name": "USMatBayWedge", "mod": "UniversalStorage2", "title": "Crewed Experiment Bay"}], "upgrades": ["RFTech-AddLifeSupport"], "grants": []}, "gnc_spacecraftRCS": {"title": "Storable-Propellant Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Trade the cold-gas puffers for small liquid thrusters on a storable propellant — peroxide, or hypergolics that light on contact — for many times the impulse in the same mass. The reaction control a manoeuvring spacecraft needs to point, hold and turn through a whole mission.", "parts": [{"name": "ROE-generic-full", "mod": "ROEngines", "title": "1.1/1.78kN Thruster"}, {"name": "ROE-generic-half", "mod": "ROEngines", "title": "550/890N Thruster"}, {"name": "ROE-generic-quarter", "mod": "ROEngines", "title": "275/445N Thruster"}, {"name": "ca_jib", "mod": "CoatlAerospace", "title": "Generic 0.5 kN Thruster"}, {"name": "microEngine", "mod": "Squad", "title": "1.1/1.78kN Thruster"}, {"name": "vernierEngine", "mod": "Squad", "title": "Attitude Jet, Conformal (275/445 N class)"}], "upgrades": ["RFTech-rcs-tltech1"], "grants": []}, "life_pressurisedCabin": {"title": "Sealed Cabin Pressurisation", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "Seal a cabin tight enough to hold near sea-level pressure while the air outside thins to nothing, feeding it breathing gas and bleeding off the heat of hypersonic flight — the pilot rides to the edge of space in something close to shirtsleeves. The X-15's sealed cabin and the pressurised fuselage behind it.", "parts": [{"name": "MK1Cargobay", "mod": "VenStockRevamp", "title": "1.25m Cargo Bay"}, {"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "SXTSmallFuselage", "mod": "SXT", "title": "0.625m Fuselage (Pressurized)"}], "upgrades": [], "grants": []}, "int_launchEscape": {"title": "Tractor Escape Rocket", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused.", "parts": [{"name": "ROC-MercuryLESBDB", "mod": "ROCapsules", "title": "Mercury Launch Escape System"}, {"name": "RO_mk1_LES", "mod": "Squad", "title": "Launch Escape System (Mercury)"}], "upgrades": [], "grants": []}, "int_mercuryCapsule": {"title": "Blunt-Body Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "RP0HumanRatedFlag", "mod": "Squad", "title": "Human Rated Flag"}], "upgrades": [], "grants": []}, "int_vostokCapsule": {"title": "Spherical Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A perfect sphere, its mass offset so it finds its own heat-shielded attitude with no active control — crude, heavy, utterly reliable. Vostok brought the first human back from orbit, the cosmonaut ejecting to land under his own parachute while the ball thumped down nearby.", "parts": [{"name": "ROC-VostokCapsule", "mod": "ROCapsules", "title": "Vostok Descent Module"}, {"name": "mk1pod_v2", "mod": "Squad", "title": "Mk1 Pod (2m)"}], "upgrades": [], "grants": []}, "int_zenitRecon": {"title": "Film-Return Reconnaissance Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Strip the cosmonaut out of the sphere and fill it with cameras — the same descent capsule flown unmanned, exposing long rolls of film over the target and dropping them home to be recovered. Vostok and Zenit are one airframe: one carries a man, the other carries the eyes.", "parts": [{"name": "ROC-ZenitCapsule", "mod": "ROCapsules", "title": "Zenit Descent Module (Improved Film Camera)"}], "upgrades": [], "grants": []}, "edl_crewedRecovery": {"title": "Crewed Descent Recovery", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Bring a crewed capsule down soft enough to survive: a heavy main canopy that will not tear at the loads a manned mass demands, a drogue to hold it straight and slow it first, and airbags or crushable legs to soften the final thump. The last minutes of every flight, where recovery is the whole point.", "parts": [{"name": "ROC-ApolloDrogueParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Drogue Parachute Pack"}, {"name": "ROC-ApolloParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Main Parachute Pack"}, {"name": "ROC-BigGeminiParachute", "mod": "ROCapsules", "title": "Big G Landing Parachute System"}, {"name": "ROC-BigGeminiParachuteDrogue", "mod": "ROCapsules", "title": "Big G Drogue Parachute"}, {"name": "ROC-CSTParachute", "mod": "ROCapsules", "title": "CST-100 Parachute Pack"}, {"name": "ROC-D2Parachute", "mod": "ROCapsules", "title": "D-2 Parachute"}, {"name": "ROC-GeminiParachuteBDB", "mod": "ROCapsules", "title": "Gemini Landing Parachute System"}, {"name": "ROC-GeminiParachuteDrogueBDB", "mod": "ROCapsules", "title": "Gemini Drogue Parachute"}, {"name": "ROC-MercuryParachuteBDB", "mod": "ROCapsules", "title": "Mercury M-ASD Main Parachute"}, {"name": "ROC-OrionParachute", "mod": "ROCapsules", "title": "Orion Main Parachute"}, {"name": "ROC-VostokParachute", "mod": "ROCapsules", "title": "Vostok/Voskhod Parachute"}, {"name": "aquarius_drogue_parachute_s0_1", "mod": "Tantares", "title": "LK-700 Capsule Drogue Parachute"}, {"name": "aquarius_parachute_s0p5_1", "mod": "Tantares", "title": "LK-700 Capsule Parachute"}], "upgrades": [], "grants": []}, "int_crewedRetroPack": {"title": "Crewed Retro-Deorbit Pack", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "A cluster of solid retro-rockets carried behind a crewed capsule and fired against the flight path to drop it out of orbit on time and on target — Mercury's retropack, Gemini's retrograde section, the Voskhod and Gemini-B modules with their own reentry attitude control. The deliberate deorbit burn a returning crew's life turns on, thrown away with its adapter once the one job is done.", "parts": [{"name": "ROC-GeminiBEquipmentSection", "mod": "ROCapsules", "title": "Gemini B Adapter Module"}, {"name": "ROC-GeminiBRetrogradeSection", "mod": "ROCapsules", "title": "Gemini B Retro Module"}, {"name": "ROC-GeminiRetrogradeSectionBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section"}, {"name": "ROC-MercuryRetropackBDB", "mod": "ROCapsules", "title": "Mercury Retropack"}, {"name": "ROC-ReentryControlSystemBDB", "mod": "ROCapsules", "title": "Gemini Re-entry Control System"}, {"name": "ROC-RetrogradeDecouplerBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section Decoupler"}, {"name": "ROC-VoskhodRetroDecoupler", "mod": "ROCapsules", "title": "Voskhod Retro Decoupler"}], "upgrades": [], "grants": []}, "opt_orbitalMapping": {"title": "Synoptic Orbital Scanning", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Sweep a body strip by strip as the orbit carries the scanner across it, assembling a complete map from thousands of passes — terrain, altimetry and anomaly built from coverage no single frame could give. The first instrument that maps a world instead of photographing a scene. The seed of the mapping lane that fills out among the planets.", "parts": [{"name": "SCANsat_Tracker", "mod": "SCANsat", "title": "SCAN MapTraq®"}, {"name": "SurveyScanner", "mod": "Squad", "title": "M700 Survey Scanner"}], "upgrades": [], "grants": []}, "fd_clusteredThrustGrowth": {"title": "Clustered-Chamber Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Squeeze more thrust from the same four-chamber cluster without touching the chemistry — the storable engines already flying, simply pushed harder.", "parts": [], "upgrades": ["RFUpgrade_X-405H-3", "RFUpgrade_YF-20B", "RFUpgrade_YF-20C", "RFUpgrade_YF-22E", "RFUpgrade_YF-25K"], "grants": []}, "fd_blendedStorableFuel": {"title": "Blended Storable Fuel", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Cut the UDMH with hydrazine and the same engine burns denser — real thrust for free, Isp along for the ride either way. Viking's own uprate, not a new engine.", "parts": [], "upgrades": ["RFUpgrade_Viking-4B", "RFUpgrade_Viking-4C", "RFUpgrade_Viking-5B", "RFUpgrade_Viking-5C", "RFUpgrade_Viking-6"], "grants": []}, "fd_ammoniaCombustionRefinement": {"title": "Stabilized Ammonia Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Retune the X-15's ammonia-lox chamber for a cleaner burn at higher pressure, wringing a real jump in specific impulse from the same volatile propellant. The rocket-plane's engine, refined rather than replaced.", "parts": [], "upgrades": ["RFUpgrade_XLR99-RM-3", "RFUpgrade_XLR99-RM-5"], "grants": []}, "fd_titanStorableConversion": {"title": "Storable-Propellant Booster Conversion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Trade kerosene for a hypergolic that ignites on contact and sits fuelled in a silo for years — some engines keep the old chemistry and simply grow, others convert outright. A missile built to launch now, not after a fuelling countdown.", "parts": [], "upgrades": ["RFUpgrade_LR87-AJ-5", "RFUpgrade_LR87-AJ-7", "RFUpgrade_LR87-AJ-9", "RFUpgrade_LR91-AJ-5", "RFUpgrade_LR91-AJ-7", "RFUpgrade_LR91-AJ-9"], "grants": []}, "pc_hdaOxidiser": {"title": "High-Density Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Push more nitrogen dioxide into the nitric acid than it comfortably holds. The oxidiser gets denser, so the same tank carries more of it, and the inhibitor that stops it dissolving the tank has to work harder for it. A better propellant bought entirely in materials-compatibility problems.", "parts": [], "upgrades": ["RFUpgrade_Model8096-HDA"], "grants": []}, "pc_mmh": {"title": "Monomethylhydrazine Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "One methyl group away from the hydrazine that came before it, and worth the detour: it stays liquid over a far wider band, resists shock decomposition, and does not freeze in a spacecraft's plumbing on the cold side of a long coast. The fuel that made storable engines something you could still trust after two years in orbit.", "parts": [], "upgrades": ["RFUpgrade_Model8096L"], "grants": []}, "pc_mon": {"title": "Nitric-Oxide-Doped Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Dissolve nitric oxide back into the dinitrogen tetroxide until the mixture stops freezing at temperatures a spacecraft will actually see. A few percent of a gas nobody wants, and the oxidiser survives the shadow side of the orbit without a heater on every line.", "parts": [], "upgrades": ["RFUpgrade_Model8096B"], "grants": []}, "fd_longLifeStorableUpper": {"title": "Long-Life Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The last iteration of a stage that has flown for forty years: the same pressure-fed storable engine, qualified now for coast times measured in days and restart counts nobody would have promised in the first decade. Nothing about it is new; everything about it is proven.", "parts": [], "upgrades": ["RFUpgrade_Agena-2000"], "grants": []}, "pc_juno_ClF3": {"title": "Chlorine-Trifluoride Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Burn hydrazine in chlorine trifluoride, a storable oxidiser so aggressive it ignites on contact with almost anything — glass, sand, the operators. A sliver more Isp for a propellant few would trust near a launch pad.", "parts": [], "upgrades": ["RFUpgrade_Juno45k-BII", "RFUpgrade_Juno6k-BII"], "grants": []}, "pc_pioneerVernierTrim": {"title": "Solid Vernier Trim Motor", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "A small solid motor that nudges a spinning spacecraft's trajectory without ever touching the main stage — a trim burn with no throttle and no restart, just a single precise kick. The adjustment motor riding along on Pioneer's booster.", "parts": [{"name": "PioneerVernier", "mod": "ROEngines", "title": "Pioneer Adjustment Motor"}], "upgrades": ["RFUpgrade_JPL-532A"], "grants": []}, "fd_gasGeneratorCeiling": {"title": "Gas-Generator Thrust Ceiling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Push the simple gas-generator cycle as far as it goes — bigger turbopumps, higher flow, more thrust from the same open-cycle plumbing. The last uprate before the cycle itself runs out of room to grow.", "parts": [{"name": "ROE-F1", "mod": "ROEngines", "title": "F-1"}], "upgrades": ["RFUpgrade_E-1-468k", "RFUpgrade_E-1-Upgrade", "RFUpgrade_H-1-188K", "RFUpgrade_LR105-NA-7.1", "RFUpgrade_LR105-NA-7.2", "RFUpgrade_LR79-NA-13", "RFUpgrade_LR87-AJ-11", "RFUpgrade_LR91-AJ-11", "RFUpgrade_RD-111-8D716A", "RFUpgrade_X-405H-4"], "grants": []}, "pc_orscDebut": {"title": "Oxidiser-Rich Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Burn the turbine's exhaust back into the main chamber instead of dumping it overboard — every drop of propellant makes thrust, not waste heat. The first staged-combustion engine in the fleet, and a real jump in specific impulse for it.", "parts": [{"name": "ROE-NK9", "mod": "ROEngines", "title": "NK-9"}, {"name": "ROE-NK9V", "mod": "ROEngines", "title": "NK-9V/21/19/39/31"}, {"name": "ROE-RD58", "mod": "ROEngines", "title": "S1.5400/RD-58 Series"}], "upgrades": [], "grants": []}, "int_geminiCapsule": {"title": "Powered Orbital Maneuvering", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Give the capsule its own thrusters and it stops merely falling around the Earth — it can change its orbit, chase a target, hold a heading. Gemini: not a bigger Mercury, a spacecraft that flies itself.", "parts": [{"name": "ROAdvCapsule", "mod": "RealismOverhaul", "title": "Advanced Command Pod"}, {"name": "ROC-GeminiCMBDB", "mod": "ROCapsules", "title": "Gemini Cabin"}, {"name": "ROC-GeminiOAMSBDB", "mod": "ROCapsules", "title": "Gemini Orbit Attitude and Maneuvering System (SE-7-100)"}, {"name": "ROC-GeminiOAMSRCSBDB", "mod": "ROCapsules", "title": "Gemini Orbit Attitude and Maneuvering System (SE-7-100) (RCS)"}], "upgrades": ["RFTech-Battery-III", "RFTech-SM-III", "RFTech-Tank-Sep-AlCu"], "grants": []}, "int_voskhodCabin": {"title": "Inflatable-Airlock Descent Module", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Bolt an inflatable fabric tunnel to the hatch and a cosmonaut can leave the capsule entirely — the first door opened in vacuum. Voskhod, stripped down to fit three, then opened up to let one of them out.", "parts": [{"name": "ROC-VoskhodAirlock", "mod": "ROCapsules", "title": "Voskhod Airlock"}, {"name": "ROC-VoskhodCapsule", "mod": "ROCapsules", "title": "Voskhod Descent Module"}, {"name": "evaCylinder", "mod": "Squad", "title": "EVA Fuel Cylinders"}, {"name": "evaJetpack", "mod": "Squad", "title": "EVA Jetpack"}], "upgrades": [], "grants": []}, "str_evaAccessLadder": {"title": "Fixed Rung Ladder", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "A cosmonaut can finally leave the capsule — now give them a way back to the hatch. Bolted rungs up the hull, sized to whatever the vehicle stands, from a short reach to a full multi-stage climb.", "parts": [{"name": "LGLadderUtility", "mod": "VenStockRevamp", "title": "MK III Mobility Enhancer"}, {"name": "LongLadder", "mod": "VenStockRevamp", "title": "Pegasus III Mobility Enhancer"}, {"name": "MedLadder", "mod": "VenStockRevamp", "title": "Pegasus II Mobility Enhancer"}, {"name": "MedLadderUtility", "mod": "VenStockRevamp", "title": "MK II Mobility Enhancer"}, {"name": "SMLadderUtility", "mod": "VenStockRevamp", "title": "MK I Mobility Enhancer"}, {"name": "ladder1", "mod": "Squad", "title": "Pegasus I Mobility Enhancer"}], "upgrades": [], "grants": []}, "str_deployableAccessLadder": {"title": "Deployable Telescoping Ladder", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "A ladder that stows flush against the hull for the ride down and telescopes out only once boots are on the ground — no permanent drag or snag risk, real travel savings on a vehicle that can't spare the mass to carry a fixed one.", "parts": [{"name": "telescopicLadder", "mod": "Squad", "title": "Kelus Mobility Enhancer"}, {"name": "telescopicLadderBay", "mod": "Squad", "title": "Kelus-LV Bay Mobility Enhancer"}], "upgrades": [], "grants": []}, "gnc_rendezvousDocking": {"title": "Orbital Rendezvous and Docking", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 450, "anyToUnlock": true, "flavor": "Close the last few metres by eye and thruster, then latch two spacecraft nose to nose in orbit — the manoeuvre every later mission depends on. Any maneuverable crewed vehicle can get you here; it isn't tied to one program's specific propulsion choice.", "parts": [{"name": "RO-ApolloDockingPort", "mod": "Squad", "title": "Apollo Docking System"}, {"name": "ROC-AgenaFairing", "mod": "ROCapsules", "title": "Agena Target Vehicle Nose Cone"}, {"name": "ROC-AgenaPort", "mod": "ROCapsules", "title": "Gemini Agena Target Vehicle Docking Port"}, {"name": "ROC-ApolloDrogueDockPortBDB", "mod": "ROCapsules", "title": "Apollo Docking Mechanism Drogue"}, {"name": "ROC-ApolloProbeDockPortBDB", "mod": "ROCapsules", "title": "Apollo Docking Mechanism Probe"}, {"name": "ROC-D2DockDrogue", "mod": "ROCapsules", "title": "D-2 Docking Drogue"}, {"name": "ROC-D2DockProbe", "mod": "ROCapsules", "title": "D-2 Docking Probe"}, {"name": "ROC-DynaDockingArms", "mod": "ROCapsules", "title": "DynaSoar Docking Arms"}, {"name": "ROC-DynaDockingSystem", "mod": "ROCapsules", "title": "DynaSoar Docking Rod"}, {"name": "ROC-GeminiNoseconeBDB", "mod": "ROCapsules", "title": "Gemini Nose Docking Mechanism"}, {"name": "dockingPort3", "mod": "Squad", "title": "Docking Port (propellant only)"}], "upgrades": [], "grants": []}, "gnc_inflatableDockingAirlock": {"title": "Inflatable Docking Airlock", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Fold Voskhod's inflatable fabric tunnel into a compact module that latches onto a docking port instead of a single hatch — one lightweight ring that gives a crew both a way to meet another spacecraft and a way outside it, without the mass of two separate systems.", "parts": [{"name": "restock-airlock-1", "mod": "ReStockPlus", "title": "AL-1 'Lychee' Inflatable Docking Airlock"}], "upgrades": [], "grants": []}, "gnc_smallRcsCatalog": {"title": "Small-Class RCS Catalog", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "The same storable-propellant reaction control, in fixed off-the-shelf block sizes instead of a sized-to-fit procedural unit — the first size class off the shelf, before spacecraft grew heavy enough to need more.", "parts": [{"name": "45DegreeRCS", "mod": "VenStockRevamp", "title": "RCS Quad, 45deg (275/445 N class)"}, {"name": "RCSBlock_275", "mod": "Squad", "title": "RCS Block [ 275/445 N Class]"}, {"name": "RO_RCSBlock_restock_275", "mod": "ReStockPlus", "title": "Angled RCS Block [ 275/445 N Class]"}, {"name": "SXTRCSRack", "mod": "SXT", "title": "Attitude Jet 3x (1.24/2 kN class)"}, {"name": "ca_RM02", "mod": "CoatlAerospace", "title": "CAE-RM02 RCS Thruster Block"}, {"name": "linearRcs", "mod": "Squad", "title": "Attitude Jet [550/890 N class]"}, {"name": "nflv-rcs-aero-heavy-1", "mod": "NearFutureLaunchVehicles", "title": "Aerodynamic RCS 4-Way [275/445 N Class]"}, {"name": "nflv-rcs-aero-heavy-2", "mod": "NearFutureLaunchVehicles", "title": "Aerodynamic RCS 4-Way [275/445 N Class]"}, {"name": "restock-rcs-block-dual-1", "mod": "ReStockPlus", "title": "RCS Dual [275/445 N Class]"}, {"name": "restock-rcs-block-quad-angled-1", "mod": "ReStockPlus", "title": "RCS Quad Angled [275/445 N Class]"}, {"name": "restock-rcs-block-quint-1", "mod": "ReStockPlus", "title": "RCS 5-Way [275/445 N Class]"}, {"name": "restock-rcs-block-triple-angled-1", "mod": "ReStockPlus", "title": "RCS Triple Angled [275/445 N Class]"}], "upgrades": [], "grants": []}, "gnc_fixedRcsCatalog": {"title": "Fixed Reaction-Control Block Catalog", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "The same catalog, scaled up — bigger blocks for spacecraft that outgrew the first size class. The procedural thruster stays the default; this is the shelf of named hardware for whoever wants the specific part.", "parts": [{"name": "HeavyRcs", "mod": "VenStockRevamp", "title": "RCS Quad (550/890 N class)"}, {"name": "RCSBlock_1100", "mod": "Squad", "title": "RCS Block [1100/1780 N Class]"}, {"name": "RCSBlock_2200", "mod": "Squad", "title": "RCS Block [2200/3560 N Class]"}, {"name": "RCSBlock_413", "mod": "Squad", "title": "RCS Block [ 413/668 N Class]"}, {"name": "RCSBlock_550", "mod": "Squad", "title": "RCS Block [ 550/890 N Class]"}, {"name": "RCSBlock_825", "mod": "Squad", "title": "RCS Block [ 825/1335 N Class]"}, {"name": "ROC-ApolloRCS", "mod": "ROCapsules", "title": "Apollo Service Module RCS Block"}, {"name": "ROC-D2RCS", "mod": "ROCapsules", "title": "D-2 Service Module RCS block"}, {"name": "ROC-LEMTruckRCS3BDB", "mod": "ROCapsules", "title": "AES LM Truck 3x RCS Cluster"}, {"name": "ROC-LEMTruckRCS4BDB", "mod": "ROCapsules", "title": "AES LM Truck 4x RCS Cluster"}, {"name": "ROC-MercuryRCS2BDB", "mod": "ROCapsules", "title": "Mercury Landing and Control Module"}, {"name": "RO_RCSBlock_restock_1100", "mod": "ReStockPlus", "title": "Angled RCS Block [1100/1780 N Class]"}, {"name": "RO_RCSBlock_restock_2200", "mod": "ReStockPlus", "title": "Angled RCS Block [2200/3560 N Class]"}, {"name": "R 1000, "anyToUnlock": false, "flavor": "Take the booster's closed-cycle engine and deliberately run it below what it can do. Chamber pressure comes down, the turbine stops living on the edge, and the engine that was a reliability problem at full throttle becomes one you can stack thirty of and still expect to reach orbit.", "parts": [], "upgrades": ["RFUpgrade_NK-21"], "grants": []}, "pc_refinedMixtureClosedCycle": {"title": "Trimmed Closed-Cycle Mixture Ratio", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Re-trim the oxidiser-to-fuel ratio and the preburner split until the cycle gives up another twelve seconds without touching the hardware — the cheapest specific impulse in rocketry, and the hardest to find, because everything upstream of the injector has to be measured before it can be moved.", "parts": [], "upgrades": ["RFUpgrade_NK-39"], "grants": []}, "pc_restartableClosedCycle": {"title": "Restartable Oxidiser-Rich Closed Cycle", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Relight a staged-combustion engine in vacuum, which means restarting an oxidiser-rich preburner that will happily burn its own turbine if the start sequence slips. Two ignitions instead of one, and the upper stage can finally choose when to fall.", "parts": [], "upgrades": ["RFUpgrade_NK-31"], "grants": []}, "pc_closedCycleUpper": {"title": "Closed-Cycle Upper-Stage Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Shrink the oxidiser-rich preburner until it fits an upper stage, where the gain is not thrust but the specific impulse you carry all the way to escape. A small closed-cycle engine is harder per kilonewton than a big one — the turbine still has to survive its own exhaust, and now there is no mass budget to armour it with.", "parts": [], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M"], "grants": []}, "pc_rg1": {"title": "High-Density Kerosene Cut", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Distil the kerosene to a narrower, denser, more thermally stable cut than anything an aircraft would burn — more mass of fuel in the same tank, and it stops coking the regenerative passages when the chamber runs hot. The fuel stops being a commodity and becomes part of the engine's design.", "parts": [], "upgrades": ["RFUpgrade_RD-58"], "grants": []}, "pc_rg1Uprating": {"title": "Oxidiser-Rich Preburner Uprating", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Drive the preburner harder and re-trim the mixture until the closed cycle gives up another seven seconds — the last easy specific impulse in a design that is already recycling everything it burns.", "parts": [], "upgrades": ["RFUpgrade_RD-58M"], "grants": []}, "pc_extendedNozzleUpper": {"title": "Extended-Nozzle Upper Stage", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Hang a far larger bell on an upper-stage engine that will never see air: sea-level performance collapses and nobody cares, because every second of it is spent in vacuum. The nozzle stops being a compromise between two regimes and is cut for the only one that matters.", "parts": [], "upgrades": ["RFUpgrade_RD-58M-CCN"], "grants": []}, "pc_syntin": {"title": "Strained-Ring Synthetic Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Synthesise the fuel instead of refining it: pack the energy into strained hydrocarbon rings that give it back when they break. Denser and hotter than any kerosene cut, absurdly expensive, and flown anyway when a few seconds of specific impulse were worth more than the money.", "parts": [], "upgrades": ["RFUpgrade_17D12", "RFUpgrade_RD-107-11D512P", "RFUpgrade_RD-108-11D511P", "RFUpgrade_RD-58S"], "grants": []}, "pc_n1ClosedCycle": {"title": "Subcooled-Propellant Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale — the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did.", "parts": [{"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}, {"name": "ROE-NK43", "mod": "ROEngines", "title": "NK-15V/43"}, {"name": "SXTNK21BlockV", "mod": "SXT", "title": "N1 Block V"}], "upgrades": ["RFUpgrade_NK-19"], "grants": []}, "pc_protonStagedCombustion": {"title": "Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying.", "parts": [{"name": "ROE-RD0210", "mod": "ROEngines", "title": "RD-0208/0210"}, {"name": "ROE-RD254", "mod": "ROEngines", "title": "RD-254"}, {"name": "ROE-RD275", "mod": "ROEngines", "title": "RD-253/RD-275"}], "upgrades": [], "grants": []}, "pc_refinedStorableORSC": {"title": "Refined Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Squeeze the storable staged-combustion boosters a little further — Mk-II chambers, higher flow, the same dependable poison.", "parts": [], "upgrades": ["RFUpgrade_RD-0203U", "RFUpgrade_RD-0210", "RFUpgrade_RD-0212", "RFUpgrade_RD-0213", "RFUpgrade_RD-0214", "RFUpgrade_RD-253-Mk2", "RFUpgrade_RD-254-11D44-Mk2", "RFUpgrade_RD-275M", "RFUpgrade_RD-277M-14D16M"], "grants": []}, "nuc_nuclearThermalRocket": {"title": "Solid-Core Nuclear Thermal Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Heat liquid hydrogen in a fission reactor and blow it out a nozzle — twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here.", "parts": [{"name": "KIWIA24", "mod": "Squad", "title": "Kiwi A3 Atomic Rocket Motor"}, {"name": "KIWIB48", "mod": "Squad", "title": "Kiwi B4E Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_nuclearRamjet": {"title": "Reactor-Heated Ramjet", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest — an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose.", "parts": [{"name": "RO-A136", "mod": "Squad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"]}, "shd_interplanetaryAvionics": {"title": "Radiation-Shielded Avionics — Interplanetary", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Harden the long-duration cruise stack itself, not just its chassis — shielded electronics for a coast that spends months, not hours, deep in interplanetary radiation.", "parts": [], "upgrades": [], "grants": ["Deep-Space-interplanetaryProbes"]}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good.", "parts": [{"name": "RO-SaturnI-IU", "mod": "ReStockPlus", "title": "Saturn I Instrument Unit [3.9 m]"}], "upgrades": [], "grants": ["Science-Core-improvedAvionics"]}, "shd_digitalGuidanceComputer": {"title": "Radiation-Shielded Avionics — Digital", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "The first digital guidance computer, rebuilt around radiation-hardened logic — a machine that keeps computing fresh corrections after a dose that would upset an unshielded chip.", "parts": [], "upgrades": [], "grants": ["Deep-Space-improvedAvionics"]}, "comp_realTimeFlightComputer": {"title": "Priority-Interrupt Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one.", "parts": [{"name": "restock-drone-core-375-1", "mod": "ReStockPlus", "title": "Saturn IB/V Instrument Unit [6.6 m]"}], "upgrades": [], "grants": ["Science-Core-matureAvionics"]}, "shd_realTimeFlightComputer": {"title": "Radiation-Shielded Avionics — Real-Time", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "The priority-interrupt flight computer, shielded to keep juggling guidance, navigation and engine control after a dose that would otherwise upset its scheduler.", "parts": [], "upgrades": [], "grants": ["Deep-Space-matureAvionics"]}, "comp_networkedAvionics": {"title": "Multi-Vehicle Avionics Integration", "discipline": "Computing", "color": "#d13bc4", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together.", "parts": [], "upgrades": ["HDD-Upgrade-1969", "RFTech-ComSat-III", "RFTech-NavSat-III"], "grants": ["Science-Core-largeScaleAvionics"]}, "shd_networkedAvionics": {"title": "Radiation-Shielded Avionics — Networked", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Multi-vehicle avionics integration, hardened for a station or relay constellation that spends its whole service life outside Earth's protective magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-largeScaleAvionics"]}, "comp_multiplyRedundantFlightComputer": {"title": "Multiply-Redundant General-Purpose Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Four identical general-purpose computers vote on every result, and a fifth arbitrates a tie — fly-by-wire trusted with a crew's life because no single failure, or even a single disagreement, can bring it down. The Shuttle's own avionics generation.", "parts": [], "upgrades": ["HDD-Upgrade-1975"], "grants": ["Science-Core-advancedAvionics"]}, "shd_multiplyRedundantFlightComputer": {"title": "Radiation-Shielded Avionics — Redundant", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Quadruple-redundant fly-by-wire, shielded to keep out-voting a radiation-flipped bit the same way it out-votes any other single failure — trusted with a crew on a mission that never comes home to Earth's shelter.", "parts": [], "upgrades": [], "grants": ["Deep-Space-advancedAvionics"]}, "comp_distributedAvionicsBus": {"title": "Distributed Avionics Data Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Stop wiring every sensor and actuator straight to the computer and put them all on one shared data bus instead — a single twisted pair carrying every subsystem's traffic, addressed and time-sliced instead of home-run cabled. The wiring-harness weight a modular station can no longer afford to carry.", "parts": [], "upgrades": [], "grants": ["Science-Core-nextGenAvionics"]}, "shd_distributedAvionicsBus": {"title": "Radiation-Shielded Avionics — Distributed Bus", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "The shared data bus, radiation-hardened end to end — every sensor and actuator on the line survives the same dose the flight computer does, for an outer-system mission with no wiring-harness weight to spare.", "parts": [], "upgrades": [], "grants": ["Deep-Space-nextGenAvionics"]}, "comp_softwareDefinedFlightControl": {"title": "Software-Defined Flight Control", "discipline": "Computing", "color": "#d13bc4", "tier": 13, "cost": 2650, "anyToUnlock": false, "flavor": "Move the control laws out of hardwired logic and into software that can be patched after launch — a flight computer whose behaviour is a file to update, not a board to re-etch, for a vehicle meant to keep flying for years.", "parts": [], "upgrades": ["HDD-Upgrade-1990"], "grants": ["Science-Core-longTermAvionics"]}, "shd_softwareDefinedFlightControl": {"title": "Radiation-Shielded Avionics — Software-Defined", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "Software-patchable flight control, shielded for a vehicle meant to keep flying for years deep in the outer system, where a board re-etch is never an option.", "parts": [], "upgrades": [], "grants": ["Deep-Space-longTermAvionics"]}, "comp_interoperableAvionicsStandard": {"title": "Interoperable Avionics Standard", "discipline": "Computing", "color": "#d13bc4", "tier": 14, "cost": 3500, "anyToUnlock": false, "flavor": "Agree on a common data-bus protocol and command format across national space programmes, so a module built on one continent can dock, hand off power and share telemetry with one built on another without a custom adapter for every pairing.", "parts": [], "upgrades": ["HDD-Upgrade-1998"], "grants": ["Science-Core-internationalAvionics"]}, "shd_interoperableAvionicsStandard": {"title": "Radiation-Shielded Avionics — Interoperable", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "The common data-bus standard, hardened alike across every national programme's hardware — an international deep-space handoff that survives the same radiation on either end.", "parts": [], "upgrades": [], "grants": ["Deep-Space-internationalAvionics"]}, "comp_commercialOffTheShelfAvionics": {"title": "Commercial Off-The-Shelf Flight Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "Skip the custom-built, radiation-hardened rack and fly triple-redundant commercial processors instead — orders of magnitude more computing power for a fraction of the cost and years off the schedule, the same bet the whole modern commercial launch industry made.", "parts": [], "upgrades": ["HDD-Upgrade-2010", "HDD-Upgrade-2020"], "grants": ["Science-Core-modernAvionics"]}, "shd_commercialOffTheShelfAvionics": {"title": "Radiation-Shielded Avionics — Commercial", "discipline": "Computing", "color": "#d13bc4", "tier": 16, "cost": 5650, "anyToUnlock": false, "flavor": "Take the same commercial processors and wrap them in the hardening they skipped — cheap compute, radiation-rated, for a deep-space mission that can't afford a custom rack but also can't afford a bit-flipped autopilot.", "parts": [], "upgrades": [], "grants": ["Deep-Space-modernAvionics"]}, "av_highBypassTurbofan": {"title": "High-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "Wrap the core in a huge ducted fan and let most of the air bypass the burner entirely — the quiet, thrifty engine that made long-haul jets economical, trading raw exhaust speed for fuel it never has to carry.", "parts": [{"name": "JetEngine", "mod": "Squad", "title": "TF/CF34 High-Bypass Turbofan"}, {"name": "SXTMiniJet", "mod": "SXT", "title": "Williams/Rolls-Royce FJ44-2A turbofan"}, {"name": "turboFanSize2", "mod": "Squad", "title": "CF6 High-Bypass Turbofan"}], "upgrades": [], "grants": []}, "av_lowBypassTurbofan": {"title": "Low-Bypass Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "A modest bypass fan bolted to a fighter's afterburning core — some of the turbofan's thrift without giving up the supersonic dash. The engine of the teen-series fighters.", "parts": [{"name": "RO-D30F6", "mod": "Squad", "title": "D-30 Low-Bypass Turbofan"} ech-Tank-Sep-Stir"], "grants": []}, "met_stainlessSteelTankage": {"title": "Stir-Welded Stainless-Steel Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 15, "cost": 4500, "anyToUnlock": false, "flavor": "Go back to steel — but a cryo-tough stainless that keeps its strength through re-entry heat and down to liquid-oxygen cold, cheap enough to build a reusable tank-and-hull as one piece. The counter-intuitive material choice behind a fully-reusable heavy launcher.", "parts": [], "upgrades": ["RFTech-Tank-Iso-Magic", "RFTech-Tank-Sep-Starship"], "grants": []}, "cmp_advancedCompositeFairings": {"title": "High-Temperature Composite Fairings", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "Cure the fairing from higher-temperature resins and out-of-autoclave layups — lighter shells that also take the aerothermal load of a faster ascent, and come off a production line instead of a hand-layup bench. The payload shroud grown into a manufactured part.", "parts": [], "upgrades": ["PFTech-Fairing-V", "PFTech-Fairing-VI"], "grants": []}, "th_advancedMLI": {"title": "Perforated Double-Aluminised Insulation", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Refine the multi-layer blanket — more and thinner double-aluminised layers, perforated to vent the trapped gas so they pack tighter without conducting — and the parasitic heat leak into a cryogenic tank or a cold instrument drops again. The insulation that lets propellant and coolant last a long mission.", "parts": [], "upgrades": ["MLI.Upgrade4", "MLI.Upgrade5", "RFTech-MLI-UpgradeBalloon"], "grants": []}, "gnc_longLifeRCS": {"title": "Long-Life Reaction-Control Thrusters", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Build the reaction-control thruster to fire tens of thousands of times without eroding its t
