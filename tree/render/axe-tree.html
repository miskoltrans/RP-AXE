<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

le": "Polyot"}, {"name": "polyot_side_engine", "mod": "RN_Soviet_Probes", "title": "Polyot Side Engine"}, {"name": "rn_protonn4_1", "mod": "RN_Soviet_Probes", "title": "Proton 1-3 N-4 Satellite"}, {"name": "rn_protonn6_4", "mod": "RN_Soviet_Probes", "title": "Proton 4 N-6 Satellite"}, {"name": "rn_strela3_gonets", "mod": "RN_Soviet_Probes", "title": "Strela-3/Gonets-D1 Satellite Bus"}, {"name": "rn_venera1", "mod": "RN_Soviet_Probes", "title": "Venera 1/Mars 1M"}, {"name": "sputnik1", "mod": "RN_Soviet_Probes", "title": "Sputnik 1"}, {"name": "sputnik2", "mod": "RN_Soviet_Probes", "title": "Sputnik 2"}, {"name": "sputnik3", "mod": "RN_Soviet_Probes", "title": "Sputnik 3 \"Object D\""}], "upgrades": []}, "th_regenCooling": {"title": "Regenerative Wall Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Route the fuel through the chamber wall before burning it, carrying away a heat flux that would melt any uncooled metal — the chamber runs hotter than its own melting point. The turbopump-fed V-2, a real engine at last, a large step up from a dumb sounding motor.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}], "upgrades": []}, "fd_multiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Combustion instability tears a single large chamber apart in milliseconds. The Soviet answer was to not build one: four smaller chambers per engine, each below the acoustic threshold, fed by a common turbopump. The R-7 that launched Sputnik.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}, {"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "ROE-S155", "mod": "ROEngines", "title": "S-155"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": []}, "fd_baffledInjector": {"title": "Baffled-Injector Stabilization", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "The Western answer to the same instability: keep the single big chamber, but break up the spinning tangential modes with injector-face baffles and tuned cavities. Harder to get right, but it scales — the path that ends at the F-1.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}, {"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}], "upgrades": []}, "fd_verniers": {"title": "Vernier Trim Engines", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Small, gimballed trim chambers that steer and roll the stack while the main engines just push — the R-7's vernier motors, the fine hand on a heavy rocket.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}], "upgrades": []}, "pc_hypergolics": {"title": "Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, indefinite restarts, storable for years. Pure chemistry: a simple ablative engine that needs neither cooling jacket nor ignition system. The propulsion of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-RD200", "mod": "ROEngines", "title": "RD-200"}], "upgrades": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen — vacuum-jacketed tanks, multilayer insulation, boil-off you fight every hour on the pad — for the highest specific impulse chemistry there is, years ahead of history. It just costs more program to get there.", "parts": [], "upgrades": []}, "fd_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, thrust-limited by heat pickup. The RL-10, and the highest specific impulse a chemical engine reaches.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": []}, "fd_orbitalThrust": {"title": "Orbital-Class Thrust", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Enough thrust, stable enough, to burn all the way to orbital velocity — reached by whichever engine you chose to perfect: Soviet multi-chamber, Western baffled injector, or a hydrolox upper stage. The rocket equation doesn't care how you got here.", "parts": [], "upgrades": []}, "pc_solidGrains": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery binder, cast and cured into a structural grain with an integral nozzle — cheap, dense, storable. You light it once and it does not stop.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-BabySergeantX11", "mod": "ROEngines", "title": "Baby Sergeant 11x Cluster"}, {"name": "ROE-BabySergeantX3", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster"}, {"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-GCRC", "mod": "ROEngines", "title": "GCRC 33KS-2800"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}, {"name": "ROE-Star13", "mod": "ROEngines", "title": "STAR 13"}], "upgrades": []}, "met_weldedTank": {"title": "Fusion-Welded Pressure Vessels", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Roll, fusion-weld and proof-test a cylinder that holds pressure without bursting — the first tank that flies. Heavy, but honest.", "parts": [{"name": "ROT-BoosterTank-Separate", "mod": "ROTanks", "title": "Modular Booster Tank (Conventional Structure)"}, {"name": "ROT-GenericTank-Separate", "mod": "ROTanks", "title": "Modular Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-ServiceModule", "mod": "ROTanks", "title": "Another Modular Tank (Service Module)"}, {"name": "ROT-Nose-ServiceModule", "mod": "ROTanks", "title": "Modular Nose Tank (Service Module)"}, {"name": "ROT-ServiceModule", "mod": "ROTanks", "title": "Modular Tank (Service Module)"}], "upgrades": []}, "met_isogrid": {"title": "Isogrid Chemical Milling", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Etch away everything that isn't load-path, leaving a triangular-rib isogrid skin — the same stiffness at a fraction of the mass.", "parts": [{"name": "RO-RFTank-Integral", "mod": "ProceduralParts", "title": "Procedural Tank (Isogrid Structure)"}, {"name": "ROT-AtlasTank-Integral", "mod": "ROTanks", "title": "Atlas Modular Tank (Isogrid Structure)"}, {"name": "ROT-BoosterTank-Integral", "mod": "ROTanks", "title": "Modular Booster Tank (Isogrid Structure)"}, {"name": "ROT-GenericTank-Integral", "mod": "ROTanks", "title": "Modular Tank (Isogrid Structure)"}, {"name": "ROT-SphericalTank-Integral", "mod": "ROTanks", "title": "Spherical Tank (Isogrid Structure)"}, {"name": "ROT-ToroidalTank-Integral", "mod": "ROTanks", "title": "Modular Toroidal Tank (Isogrid Structure)"}], "upgrades": []}, "str_balloonTank": {"title": "Pressure-Stabilized Monocoque", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Make the wall so thin it only holds shape under pressure — the Atlas 'steel balloon' reached orbit weighing almost nothing empty, and would crumple if you ever let it depressurise. As much an orbital enabler as any engine.", "parts": [{"name": "RO-RFTank-BalloonNew", "mod": "ProceduralParts", "title": "Procedural Tank (Balloon)"}, {"name": "ROT-AtlasTank-Balloon", "mod": "ROTanks", "title": "Atlas Modular Tank (Balloon)"}, {"name": "ROT-BalloonTank-New", "mod": "ROTanks", "title": "Modular Tank (Balloon)"}], "upgrades": []}, "str_staging": {"title": "Pyrotechnic Frangible Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Frangible joints and shaped charges cut a spent stage away on a millisecond's command; small motors settle the propellant for the next light. The only way to the velocities chemistry can't reach in one go.", "parts": [{"name": "Decoupler_1", "mod": "Squad", "title": "TD-12 Decoupler"}, {"name": "Decoupler_2", "mod": "Squad", "title": "TD-25 Decoupler"}, {"name": "KzThrustPlate", "mod": "ProceduralFairings", "title": "Thrust Plate [Procedural]"}, {"name": "ROE-CastorDecoupler", "mod": "ROEngines", "title": "Castor I \u0026 II Radial Decoupler"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "proceduralStackDecoupler", "mod": "ProceduralParts", "title": "Decoupler [Procedural]"}, {"name": "radialDecoupler", "mod": "Squad", "title": "TT-38K Radial Decoupler"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}], "upgrades": []}, "gnc_pitchProgram": {"title": "Open-Loop Pitch Programming", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A timed, pre-computed pitch schedule flown open-loop off a gyro reference — the first machine that flies itself uphill on a fixed program, no feedback, no corrections.", "parts": [], "upgrades": []}, "gnc_rcs": {"title": "Cold-Gas Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Bleed stored gas through opposed thruster pairs to point and hold a vehicle in vacuum — the first three-axis control where there is no air to push against.", "parts": [{"name": "InlineRCS", "mod": "VenStockRevamp", "title": "Inline RCS block (138/223 N class)"}, {"name": "RCSBlock_138", "mod": "Squad", "title": "RCS Block [ 138/223 N Class]"}, {"name": "RCSBlock_28", "mod": "Squad", "title": "RCS Block [  28/45 N Class]"}, {"name": "RCSBlock_69", "mod": "Squad", "title": "RCS Block [  69/111 N Class]"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": []}, "str_booms": {"title": "Stored-Strain Deployable Booms", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Stow a coilable tubular mast under strain for launch and let it spring out on orbit — and hold a magnetometer far enough from the bus to read a field the spacecraft's own metal would otherwise drown.", "parts": [{"name": "RO-EarlyMagnet", "mod": "RP-1", "title": "MG01 - Early Magnetometer"}], "upgrades": []}, "aero_fairings": {"title": "Jettisonable Payload Fairings", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Shroud the payload through the dense lower atmosphere, then split and jettison it cleanly once the air thins — aerodynamic protection that must vanish on command.", "parts": [{"name": "KzInterstageAdapter2", "mod": "ProceduralFairings", "title": "IB - Procedural Interstage Fairing Adapter"}, {"name": "KzProcFairingSide1", "mod": "ProceduralFairings", "title": "Procedural Fairing"}, {"name": "KzResizableFairingBase", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base"}, {"name": "KzResizableFairingBaseRing", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base Ring"}, {"name": "RSBRibbedBase", "mod": "ProceduralFairings", "title": "FB - Procedural Ribbed Payload Adapter"}, {"name": "SSTUBase", "mod": "ProceduralFairings", "title": "FB - Procedural Hollow Truss Payload Adapter"}], "upgrades": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Stage a small drogue to stabilise and slow a falling body, then a main canopy to bring it down intact — the oldest way home from space, and the prerequisite for anything you want back.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": []}, "th_radiativeControl": {"title": "Passive Radiative Control", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Reject waste heat to space with coatings, finishes and bimetallic louvers that open and close with temperature — the baseline thermal balance of every spacecraft, before you can afford anything active.", "parts": [{"name": "ca_louver_m", "mod": "CoatlAerospace", "title": "CA-TCL8 Thermal Control Louver"}, {"name": "ca_louver_s", "mod": "CoatlAerospace", "title": "CA-TCL4 Thermal Control Louver"}, {"name": "ca_louver_s2", "mod": "CoatlAerospace", "title": "CA-TCL4-B Thermal Control Louver"}], "upgrades": []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A sealed, pressurised, fan-stirred vessel that keeps electronics alive through the orbital hot-cold cycle and runs its own timeline unattended. Sputnik was little more than this — and that sealed sphere WAS the engineering.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}], "upgrades": []}, "elec_siliconPV": {"title": "Diffused-Junction Photovoltaics", "discipline": "Electrical Power", "color": "#ffd166", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Diffuse a shallow p-n junction into silicon and sunlight drives a current across it indefinitely — the breakthrough that freed satellites from their batteries. Vanguard 1 flew the first cells. The obvious power for anywhere the sun reaches.", "parts": [{"name": "RO-rangerSolarPanel", "mod": "RealismOverhaul", "title": "Ranger Solar Panel"}, {"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}, {"name": "RO_EarlyTinySolarPanel", "mod": "Squad", "title": "ST1 Tiny Solar Panel"}], "upgrades": []}, "nuc_rtg": {"title": "Radioisotope Thermoelectrics", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A decaying isotope's heat across a thermocouple gives steady watts for decades, anywhere, sunlight or not. Absurd to fly to a sunlit orbit when solar is cheaper and lighter — but the only power there is for the Moon's 14-day night and the outer dark.", "parts": [{"name": "RO-MMRTG", "mod": "Squad", "title": "Multi-Mission RTG"}, {"name": "RO-SNAP-19-RTG", "mod": "VenStockRevamp", "title": "SNAP-19 Series RTG"}, {"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}, {"name": "RO-SNAP-9-RTG", "mod": "VenStockRevamp", "title": "SNAP-9 Series RTG"}], "upgrades": []}, "tel_telemetry": {"title": "Pulse-Interval Telemetry", "discipline": "Telecommunications", "color": "#4361ee", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Encode temperature and pressure in the spacing between radio pulses and key it to the ground — Sputnik's beacon turned a satellite's state into something you could hear from another continent.", "parts": [{"name": "SXTAntenna", "mod": "SXT", "title": "Sputnik PS-1 Antenna"}, {"name": "SurfAntenna", "mod": "Squad", "title": "Communotron 16-S"}], "upgrades": []}, "nuc_geiger": {"title": "Geiger-Müller Ionization Counting", "discipline": "Nuclear Engineering", "color": "#90be6d", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A gas-discharge tube that clicks once per ionising particle — cheap, rugged, and the first satellites' sharpest sense. Explorer 1 carried one and found the Van Allen belts. (Its early tier is a science-pacing dial.)", "parts": [{"name": "RO-GeigerMuller", "mod": "RP-1", "title": "CR01 - Geiger-Muller Counter"}, {"name": "RP0probeVanguardXray", "mod": "Squad", "title": "20in X-Ray Detector (DEPRECATED)"}], "upgrades": []}, "met_exposurePanels": {"title": "Materials Exposure Panels", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Heavy sealed boxes that expose a material, a microbe colony or an impact grid to launch, vacuum and radiation and bring it home — science that rides in a structural can, not a delicate instrument. (Mystery Goo lives here in Metallurgy.)", "parts": [{"name": "BioCapsule", "mod": "SXT", "title": "Advanced Biological Capsule"}, {"name": "GooExperiment", "mod": "Squad", "title": "Biological Sample Capsule"}, {"name": "RO-Micrometeorite", "mod": "RP-1", "title": "MM01 - Micrometeorite Detector"}, {"name": "SXTProbeGooo", "mod": "SXT", "title": "Biological Sample Capsule"}, {"name": "USGooBayWedge", "mod": "UniversalStorage2", "title": "Biological Sample Capsule"}], "upgrades": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Expose film in flight and scan-and-transmit or physically return it — the highest resolution there is, if you can get it home. Luna 3's look at the far side of the Moon.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}, {"name": "science_module", "mod": "Squad", "title": "PH01 - Early Film Camera"}], "upgrades": []}, "opt_vidicon": {"title": "Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#3a0ca3", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Scan an image off a photoconductive vidicon tube and send it down as live video — no film to recover, but coarser than film. The other way to see: film returns the detail, the vidicon returns the immediacy.", "parts": [{"name": "RO-EarlyTVCamera", "mod": "RP-1", "title": "VI01 - Early Television Camera"}], "upgrades": []}, "mic_massSpec": {"title": "Magnetic-Sector Mass Spectrometry", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Bend a beam of ions through a magnetic sector to sort them by mass — read the composition of an upper atmosphere or ionosphere in situ, chemistry sampled where the spacecraft flies.", "parts": [{"name": "RO-IonMassSpectrometer", "mod": "RP-1", "title": "MS01 - Ion Mass Spectrometer"}, {"name": "USFluidSpectroWedge", "mod": "UniversalStorage2", "title": "Mass Spectrometer Unit"}], "upgrades": []}, "int_orbitalInsertion": {"title": "Orbital Insertion", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Orbital-class thrust, a tank light enough to close the rocket equation, staging, and a pitch program converge. Build your own satellite from the bus, power and antenna beside it. Beep. Beep. Beep.", "parts": [], "upgrades": []}, "int_applicationsSat": {"title": "Applications Satellite Bus", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The turn from 'science probe' to 'useful satellite' — a standard bus for communications and navigation payloads. It flies contracts, and a fleet in orbit is a steady science and revenue farm.", "parts": [{"name": "RP-1-CommunicationSat", "mod": "RP-1", "title": "Communication Contract Satellite Bus"}, {"name": "RP-1-NavigationSat", "mod": "RP-1", "title": "Navigation Contract Satellite Bus"}], "upgrades": []}, "xplaneStart": {"title": "Three-Axis Aerodynamic Control", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A cambered wing makes lift; the real breakthrough was making it OBEY — roll, pitch and yaw commanded together. Hang a piston and a propeller on it and you have controlled, powered flight.", "parts": [{"name": "CircularIntake", "mod": "Squad", "title": "Pitot Intake"}, {"name": "GearFixed", "mod": "Squad", "title": "LY-01 Fixed Landing Gear"}, {"name": "GearFree", "mod": "Squad", "title": "LY-05 Steerable Landing Gear"}, {"name": "RO-B9ProcCS-Early", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Control Surface (Early)"}, {"name": "RO-B9ProcWing-Early", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Early)"}, {"name": "RO-OldFighterCockpit", "mod": "RealismOverhaul", "title": "P-40 Cockpit"}, {"name": "RO-X1Cockpit", "mod": "RealismOverhaul", "title": "X-1 Cockpit"}, {"name": "SXTJ213", "mod": "SXT", "title": "Junkers Jumo 213E"}, {"name": "SXTKO211Dprop", "mod": "SXT", "title": "Junkers Jumo 211F"}, {"name": "SXTMerlin46Prop", "mod": "SXT", "title": "Rolls-Royce Merlin 46"}, {"name": "SXTMerlin66prop", "mod": "SXT", "title": "Rolls-Royce Merlin 66"}, {"name": "SXTPWR2800", "mod": "SXT", "title": "Pratt \u0026 Whitney R-2800-63W Double Wasp"}, {"name": "SXTR280018WProp", "mod": "SXT", "title": "Pratt \u0026 Whitney R-2800-18W Double Wasp"}, {"name": "SXTR280021Prop", "mod": "SXT", "title": "Pratt \u0026 Whitney R-2800-21 Double Wasp"}, {"name": "SXTTinyprop", "mod": "SXT", "title": "IO-550-B Piston Engine"}, {"name": "SXT_Jumo213A", "mod": "SXT", "title": "Junkers Jumo 213A"}, {"name": "noseCone", "mod": "Squad", "title": "Aerodynamic Nose Cone"}], "upgrades": []}, "met_turbineAlloys": {"title": "Nimonic Turbine Alloys", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "The turbojet's cycle was understood in the 1930s; what gated it was a turbine blade that wouldn't creep in an 800-plus-degree stream. Nimonic — a nickel-chromium superalloy grown for exactly this — made a durable blade. The jet is unlocked by METALLURGY, not aerodynamics.", "parts": [{"name": "RO-DerwentV", "mod": "SXT", "title": "Derwent Turbojet"}, {"name": "RO-J35", "mod": "SXT", "title": "J35 Turbojet"}, {"name": "RO-VK1", "mod": "SXT", "title": "VK-1 Turbojet"}], "upgrades": []}, "aero_areaRule": {"title": "Transonic Area-Ruling", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Smooth the total cross-sectional area through Mach 1 — the coke-bottle waist that lets an airframe punch through the sound barrier instead of shaking apart against it.", "parts": [{"name": "RO-J47", "mod": "SXT", "title": "J47 Turbojet"}, {"name": "RO-J48", "mod": "Squad", "title": "J48/Tay Turbojet"}, {"name": "RO-JT3C", "mod": "Squad", "title": "J57 Turbojet (No Afterburner)"}, {"name": "RO-RD9B", "mod": "Squad", "title": "RD-9 Turbojet"}, {"name": "RO-Sapphire203", "mod": "Squad", "title": "Sapphire Turbojet"}, {"name": "aje_avon", "mod": "Squad", "title": "Avon Turbojet"}, {"name": "aje_j57", "mod": "Squad", "title": "J57 Turbojet"}], "upgrades": []}, "aero_shockInlets": {"title": "Oblique-Shock Inlets", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Decelerate intake air through a controlled train of oblique shocks so the compressor keeps breathing past Mach 2 — sustained supersonic cruise, not just a dash.", "parts": [{"name": "RO-B9ProcWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Supersonic)"}, {"name": "RO-shockConeIntake125", "mod": "Squad", "title": "1.25m Shock Cone Intake"}, {"name": "RO-shockConeIntakeBomarc", "mod": "Squad", "title": "0.70m Shock Cone Intake"}, {"name": "RO-shockConeIntakeMig", "mod": "Squad", "title": "0.86m Shock Cone Intake"}, {"name": "shockConeIntake", "mod": "Squad", "title": "Shock Cone Intake"}], "upgrades": []}, "aero_afterburner": {"title": "Afterburning Turbojets", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Inject and burn fuel in the exhaust downstream of the turbine for a burst of extra thrust — the Mach-2 interceptor's dash and climb.", "parts": [{"name": "RO-AL7F", "mod": "Squad", "title": "AL-7 Turbojet"}, {"name": "RO-Atar101D", "mod": "SXT", "title": "Atar 101 Turbojet"}, {"name": "aje_j75", "mod": "Squad", "title": "J75 Turbojet"}, {"name": "aje_j79", "mod": "Squad", "title": "J79 Turbojet"}], "upgrades": []}, "aero_ramjet": {"title": "Ram Compression", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Above Mach 2 the inlet does all the compressing and you can discard the turbine entirely — a ramjet, or a turbo-ramjet that hands off between the two.", "parts": [{"name": "RO-Nord1500", "mod": "Squad", "title": "Nord 1500/Atar Combined Cycle Ramjet"}, {"name": "RO-RJ43", "mod": "Squad", "title": "RJ43 Ramjet"}, {"name": "RO-RJ47", "mod": "Squad", "title": "RJ47 Ramjet"}, {"name": "RO-RJ55", "mod": "Squad", "title": "RJ55/J67 Combined Cycle Ramjet"}], "upgrades": []}, "aero_rocketplane": {"title": "Rocket-Boosted Airframes", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Hang a throttleable rocket engine in a clean airframe, drop it from altitude and ride a ballistic arc to the edge of the atmosphere. The X-1 broke the sound barrier; the X-15 touched space and came home on a runway. Where the aircraft and rocket lines first meet.", "parts": [{"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "ROE-XLR10", "mod": "ROEngines", "title": "XLR10"}, {"name": "ROE-XLR11", "mod": "ROEngines", "title": "XLR11"}, {"name": "ROE-XLR25", "mod": "ROEngines", "title": "XLR25"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}], "upgrades": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
