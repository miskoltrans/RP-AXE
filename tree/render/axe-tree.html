<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

const DATA={"start": {"title": "Start", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 0, "cost": 0, "anyToUnlock": false, "flavor": "1950. Kerbalkind is united; the universe is blind without us.", "parts": [], "upgrades": []}, "soundingRocketry": {"title": "Spin-Stabilized Sounding Rockets", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Fin-and-spin powder rockets loft the first instrument packages above the Karman line. (Rocket start; the X-plane root lives in Aerodynamics, off-slice.)", "parts": [{"name": "PioneerVernier", "mod": "ROEngines", "title": "Pioneer Adjustment Motor"}], "upgrades": []}, "pc_ethanolLox": {"title": "Ethanol/LOX Film-Cooled Combustion", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry.", "parts": [], "upgrades": []}, "pc_keroseneHydrotreating": {"title": "Hydrotreated Narrow-Cut Kerosene (RP-1)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. Homes the simplest early kerolox; the harder kerolox engines mature in Fluid Dynamics and Metallurgy.", "parts": [{"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}], "upgrades": []}, "pc_apcpGrain": {"title": "Aluminized AP/HTPB Composite Grain", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidizer and aluminum powder bound in hydroxyl-terminated polybutadiene, cast and cured into a structural grain. The propellant chemistry, not the casing, is the headline here.", "parts": [{"name": "MassiveBooster", "mod": "Squad", "title": "RSRMV"}], "upgrades": []}, "pc_hypergolicChemistry": {"title": "Self-Igniting Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Fuels that detonate on contact with their oxidizer — no igniter, indefinite restarts, storable for years. The entire difficulty is chemistry and corrosion: handling hydrazines and nitric oxidizers that attack everything. The chemistry of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-AJ10-137", "mod": "ROEngines", "title": "AJ10-137 (Service Propulsion System)"}], "upgrades": []}, "pc_cryoLiquefaction": {"title": "Claude-Cycle H2/O2 Liquefaction", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Industrial Claude-cycle plants liquefy hydrogen and oxygen by the ton. You can now MAKE deep cryogens; STORING and flying them is Cryogenics' problem next door (a convergence).", "parts": [], "upgrades": []}, "pc_storableOxidizers": {"title": "Passivated MON/NTO Storable Oxidizers", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Mixed oxides of nitrogen and passivated dinitrogen tetroxide: denser, higher-performing, marginally less murderous storables for mature service propulsion.", "parts": [{"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10-190", "mod": "ROEngines", "title": "AJ10-190"}], "upgrades": []}, "met_earlyAlloys": {"title": "Aluminum Isogrid \u0026 Maraging-Steel Cases", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Chemically-milled isogrid aluminum for light pressure vessels; ultra-high-strength maraging steel for solid-motor cases and pump housings. The structural backbone everything else bolts to.", "parts": [], "upgrades": []}, "met_oxRichSuperalloys": {"title": "Oxidizer-Rich Preburner Superalloys", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "For decades the West held that an oxygen-rich preburner would simply burn through any turbine. Soviet metallurgy disproved it: chrome-nickel alloys with burn-passivated surfaces survive hot, oxygen-rich gas, unlocking the most efficient kerolox engines ever flown. THE engine that metallurgy unlocks.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}], "upgrades": []}, "fd_turbopumps": {"title": "Inducer-Stabilized Cryogenic Turbopumps", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Move propellant by the ton per second without cavitating the pump. An axial inducer ahead of the centrifugal impeller suppresses cavitation at low inlet pressure — the enabling piece of every high-thrust engine.", "parts": [], "upgrades": []}, "fd_combustionStability": {"title": "Baffled-Injector Combustion-Instability Suppression", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Tangential acoustic modes can couple to combustion and tear a large chamber apart in milliseconds. Injector baffles and tuned cavities damp them. Taming this — not the fuel — is why the F-1 took years and why it lives in Fluid Dynamics.", "parts": [{"name": "ROE-F1", "mod": "ROEngines", "title": "F-1"}, {"name": "ROE-F1B", "mod": "ROEngines", "title": "F-1B"}], "upgrades": ["RFUpgrade_F-1-1.52M", "RFUpgrade_F-1A"]}, "th_regenCooling": {"title": "Regenerative Forced-Convection Wall Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before burning it, carrying away heat flux that would melt any uncooled metal. The thermodynamics that lets a chamber run hotter than its own melting point.", "parts": [], "upgrades": []}, "cryo_loxHandling": {"title": "Subcooled LOX Densification", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Hold oxygen below its boiling point: vacuum-jacketed lines, careful materials, and the operational discipline to load minutes before launch. Subcooling buys density — more propellant in the same tank.", "parts": [], "upgrades": []}, "cryo_lh2Insulation": {"title": "Multilayer Vacuum Insulation for LH2", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Hydrogen boils at -253 C and diffuses through metal lattices. Dozens of radiation-shield layers under vacuum make hydrolox — the highest specific impulse chemistry there is — actually flyable. The J-2 lives here, fed by Chemistry's cryogen supply.", "parts": [{"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": []}, "cryo_stagedHydrolox": {"title": "Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Burn every gram twice: a fuel-rich preburner drives the turbopumps, then the exhaust is fully combusted in the chamber. The RS-25 needs both deep-cryo hydrogen handling AND reusable hot-section superalloys — a convergence of Cryogenics and Metallurgy.", "parts": [{"name": "ROE-RS25", "mod": "ROEngines", "title": "RS-25 (SSME)"}], "upgrades": []}, "cryo_zbo": {"title": "Reverse-Brayton Zero-Boiloff Cryocooling", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A closed reverse-Brayton cryocooler actively pumps heat out of the tank, driving boiloff to zero — if you can spare the kilowatts. Multi-year outer-planet cryo stages stop bleeding propellant.", "parts": [], "upgrades": []}, "tel_pcmTelemetry": {"title": "PCM/FM Telemetry Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it, a failure tells you nothing about why.", "parts": [], "upgrades": []}, "tel_helicalDirectional": {"title": "Helical Directional Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Axial-mode helices give circularly-polarized gain that tolerates a tumbling spacecraft — range and data rate at the cost of having to point.", "parts": [{"name": "HighGainAntenna5_v2", "mod": "Squad", "title": "HG-5 Retractable Parabolic Antenna"}], "upgrades": []}, "tel_cassegrainHGA": {"title": "Cassegrain Parabolic High-Gain Reflector", "discipline": "Telecommunications", "color": "#4361ee", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A subreflector folds the feed back through the dish vertex, shortening the assembly and closing the link from lunar distance. Apollo talked home through one.", "parts": [{"name": "HighGainAntenna", "mod": "Squad", "title": "1.25m Retractable Parabolic Antenna"}, {"name": "ROC-ApolloHGABDB", "mod": "ROCapsules", "title": "Apollo High Gain Antenna (HGA)"}], "upgrades": []}, "tel_dsnRanging": {"title": "Coherent Two-Way Doppler \u0026 Ranging", "discipline": "Telecommunications", "color": "#4361ee", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Phase-coherent ground dishes pull a few bits per second out of interplanetary noise and, from the round-trip Doppler, fix the spacecraft's state vector to meters.", "parts": [], "upgrades": []}, "tel_phasedArray": {"title": "Electronically-Steered Phased Arrays", "discipline": "Telecommunications", "color": "#4361ee", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Steer the beam by element phasing, no moving parts. Higher rates, graceful degradation, the backbone of a relay constellation.", "parts": [], "upgrades": []}, "ext_powerGrid": {"title": "Kilowatt-Class Regulated Power Bus", "discipline": "Electrical Power", "color": "#ffd166", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "High-voltage regulated distribution that turns raw array watts into the kilowatts cryocoolers and electric thrusters actually demand. The grid that gates heavy payloads.", "parts": [], "upgrades": []}, "met_weldedSteel": {"title": "Welded Steel Pressure Vessels", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Roll, weld and proof-test mild-steel cylinders that hold pressure without bursting. The first tank that flies.", "parts": [], "upgrades": []}, "met_chemMilling": {"title": "Chemical Milling \u0026 Isogrid", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Etch away everything that isn't load path, leaving a triangular-rib isogrid skin — stiffness at a fraction of the mass.", "parts": [], "upgrades": []}, "met_vacuumInductionMelting": {"title": "Vacuum Induction Melting", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Melt under vacuum to strip dissolved gases and inclusions, casting the clean nickel-base superalloys that hot sections demand.", "parts": [], "upgrades": []}, "met_titaniumForming": {"title": "Superplastic Titanium Forming", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Heat titanium until it flows like taffy and form one-piece, diffusion-bonded structures — strong, light, corrosion-proof.", "parts": [], "upgrades": []}, "met_vacuumArcRemelting": {"title": "Vacuum Arc Remelting", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "A consumable-electrode second melt homogenises the ingot grain by grain — the pedigree steel of turbine discs and gun-pressure cases.", "parts": [], "upgrades": []}, "met_powderMetallurgyHIP": {"title": "Powder Metallurgy \u0026 Hot Isostatic Pressing", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Consolidate atomised powder under heat and pressure into near-net shapes with no casting porosity — complex parts, full density.", "parts": [], "upgrades": []}, "met_singleCrystalTurbine": {"title": "Single-Crystal Turbine Castings", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Grow a turbine blade as one crystal with no grain boundaries to creep — it runs hotter and lasts longer than any equiaxed casting.", "parts": [], "upgrades": []}, "met_refractoryMetals": {"title": "Refractory Metal Hot Sections", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Niobium, tantalum and tungsten alloys that stay strong red-hot — radiation-cooled nozzles and nuclear-thermal cores.", "parts": [], "upgrades": []}, "met_additiveManufacturing": {"title": "Laser Powder-Bed Additive Manufacturing", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Print a regen-cooled chamber as a single part with internal channels no machine could cut. Geometry becomes free; the alloy becomes the limit.", "parts": [], "upgrades": []}, "met_amorphousAlloys": {"title": "Bulk Metallic Glasses", "discipline": "Metallurgy", "color": "#8d99ae", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Quench fast enough that the metal never crystallises — glassy alloys with spring-like elasticity and extreme strength-to-weight.", "parts": [], "upgrades": []}, "cmp_glassFiber": {"title": "Glass-Fiber Laminates", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Glass cloth in cured resin: light, transparent to radio, and the gateway to every structural composite that follows.", "parts": [], "upgrades": []}, "cmp_ablativeTPS": {"title": "Ablative Heatshields", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A phenolic char layer that burns away on purpose, carrying reentry heat with it. The only thing between a capsule and a meteor's fate.", "parts": [{"name": "ROC-ApolloHSBDB", "mod": "ROCapsules", "title": "Apollo Command Module Heatshield"}], "upgrades": []}, "cmp_filamentWinding": {"title": "Filament-Wound Cases", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Wind continuous fiber under tension around a mandrel for pressure vessels and solid-motor cases far lighter than steel.", "parts": [], "upgrades": []}, "cmp_carbonCarbon": {"title": "Carbon-Carbon Hot Structures", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Carbon fiber in a carbon matrix that gets STRONGER as it heats — reusable wing leading edges and throat inserts.", "parts": [], "upgrades": []}, "cmp_carbonFiberComposite": {"title": "Carbon-Fiber Airframes", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Tailored carbon-epoxy laminates lay stiffness exactly along the load paths — the modern lightweight airframe and interstage.", "parts": [], "upgrades": []}, "cmp_pica": {"title": "PICA / AVCOAT Reentry Ablators", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Ultralight phenolic-impregnated carbon ablators survive lunar- and Mars-return entry velocities at a fraction of the mass.", "parts": [], "upgrades": []}, "cmp_copv": {"title": "Composite Overwrapped Pressure Vessels", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A thin metal liner overwrapped in carbon fiber holds helium at hundreds of bar for a tiny mass — the modern pressurant bottle.", "parts": [], "upgrades": []}, "cmp_ceramicTiles": {"title": "Reusable Ceramic Tile TPS", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Silica tiles so insulating you can hold one glowing at the edges — the Shuttle's reusable skin, fragile but flyable again.", "parts": [], "upgrades": []}, "cmp_ceramicMatrixComposite": {"title": "Ceramic-Matrix Composites", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Ceramic fibers in a ceramic matrix add toughness to refractory ceramics — uncooled nozzle extensions and turbine shrouds.", "parts": [], "upgrades": []}, "cmp_metalMatrixComposite": {"title": "Metal-Matrix Composites", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Silicon-carbide whiskers in an aluminum or titanium matrix: stiffer, more dimensionally stable struts and booms.", "parts": [], "upgrades": []}, "cmp_transpirationTPS": {"title": "Transpiration-Cooled TPS", "discipline": "Composite Materials", "color": "#a3b18a", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Sweat coolant through a porous skin to hold a fully reusable surface below its limit through repeated high-energy entries.", "parts": [], "upgrades": []}, "pc_blackPowder": {"title": "Pressed Black-Powder Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Charcoal, sulfur and saltpetre pressed into a grain — the oldest rocket propellant, and where solids begin.", "parts": [], "upgrades": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Nitrocellulose gelled with nitroglycerine burns hotter and cleaner than powder — the smokeless propellant of early missiles.", "parts": [], "upgrades": []}, "pc_hydrogenPeroxide": {"title": "High-Test Peroxide (HTP)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Concentrated peroxide decomposes over a silver catalyst into hot steam and oxygen — monopropellant gas generators and soft-start oxidiser.", "parts": [], "upgrades": []}, "pc_castableComposite": {"title": "Castable AP/Al Composite Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Cast and cure a meganewton-class grain directly into a segmented case — the chemistry of the largest boosters ever flown.", "parts": [{"name": "RO-RSRM", "mod": "Squad", "title": "RSRM"}], "upgrades": []}, "pc_greenMonoprop": {"title": "Green Monopropellants", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Ionic-liquid blends (LMP-103S, AF-M315E) match hydrazine's performance without the lethal toxicity — safer satellite propulsion.", "parts": [], "upgrades": []}, "pc_gelledPropellant": {"title": "Gelled Hypergolic Propellants", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Thicken storables to a gel that won't slosh or leak yet still flows when throttled — restartable, safer high-density propulsion.", "parts": [], "upgrades": []}, "pc_methalox": {"title": "Methane Liquefaction \u0026 Methalox", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Liquid methane: clean-burning, coke-free, dense enough for deep throttling and — crucially — makeable from CO2 on Mars.", "parts": [], "upgrades": []}, "pc_subcooledDensified": {"title": "Densified Sub-cooled Propellants", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Chill propellant below its boiling point and pack more mass in the same tank — the last few percent of performance, at operational cost.", "parts": [], "upgrades": []}, "res_electrolysis": {"title": "Water Electrolysis", "discipline": "Resource Engineering", "color": "#b08968", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Split water into hydrogen and oxygen with electricity — life-support oxygen now, in-situ propellant later.", "parts": [], "upgrades": []}, "res_regolithExcavation": {"title": "Regolith Excavation \u0026 Augering", "discipline": "Resource Engineering", "color": "#b08968", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Dig and convey abrasive regolith in vacuum and low gravity — the unglamorous front end of every off-world supply chain.", "parts": [{"name": "kerbalism-drill", "mod": "Squad", "title": "Regolith Harvester"}], "upgrades": []}, "res_cryoLiquefactionISRU": {"title": "In-Situ Cryogenic Liquefaction", "discipline": "Resource Engineering", "color": "#b08968", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Liquefy and store electrolysis products as flight cryogens on the surface — close the loop from water to propellant.", "parts": [], "upgrades": []}, "res_sabatier": {"title": "Sabatier Methane Synthesis", "discipline": "Resource Engineering", "color": "#b08968", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "React CO2 with hydrogen over a catalyst to make methane and water — the reaction that fuels the trip home from Mars.", "parts": [{"name": "kerbalism-chemicalplant", "mod": "KerbalismConfig", "title": "Chemical Plant"}], "upgrades": []}, "res_oreBeneficiation": {"title": "Ore Beneficiation \u0026 Sintering", "discipline": "Resource Engineering", "color": "#b08968", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Concentrate and sinter raw regolith into feedstock and bricks — the first step from dirt toward parts and shielding.", "parts": [], "upgrades": []}, "res_metalExtraction": {"title": "In-Situ Metal Extraction", "discipline": "Resource Engineering", "color": "#b08968", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Molten-regolith electrolysis pulls iron, aluminium and oxygen out of the dirt itself — structural metal without a launch.", "parts": [{"name": "kerbalism-ISRU", "mod": "KerbalismConfig", "title": "ISRU"}], "upgrades": []}, "res_propellantDepot": {"title": "Orbital Propellant Depots", "discipline": "Resource Engineering", "color": "#b08968", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Aggregate, store and transfer cryogens on orbit so missions launch dry and tank up — the logistics keystone of deep space.", "parts": [], "upgrades": []}, "res_atmosphericMining": {"title": "Atmospheric \u0026 Gas-Giant Mining", "discipline": "Resource Engineering", "color": "#b08968", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Scoop and separate gases from a planet's air on the fly — hydrogen and helium harvested without ever landing.", "parts": [], "upgrades": []}, "res_closedLoopFab": {"title": "Closed-Loop In-Situ Fabrication", "discipline": "Resource Engineering", "color": "#b08968", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Mine, refine, print and assemble entirely off-world, recycling scrap — a foothold that builds the next foothold.", "parts": [], "upgrades": []}, "res_heliumMining": {"title": "Helium-3 Extraction", "discipline": "Resource Engineering", "color": "#b08968", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Separate the rare fusion isotope from regolith or gas-giant atmosphere — the propellant of an ambitious, far-future endgame.", "parts": [], "upgrades": []}, "fd_pressureFed": {"title": "Pressure-Fed Feed Systems", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Push propellant with tank pressure alone — no pump, no turbine. Simple, restartable, and limited to low chamber pressure.", "parts": [], "upgrades": []}, "fd_gasGenerator": {"title": "Gas-Generator (Open) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Burn a little propellant in a side chamber to spin the turbopump, then dump the turbine exhaust overboard. Simple, proven, slightly wasteful.", "parts": [], "upgrades": []}, "fd_expanderCycle": {"title": "Expander Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, thrust-limited by heat pickup.", "parts": [], "upgrades": []}, "fd_tapOffCycle": {"title": "Combustion Tap-Off Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Bleed hot gas straight from the main chamber to spin the turbine — one combustion zone, no separate gas generator.", "parts": [], "upgrades": []}, "fd_stagedCombustion": {"title": "Staged-Combustion (Closed) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Burn the turbine drive gas, then route it into the main chamber to burn again — nothing wasted, chamber pressure soars, plumbing turns brutal.", "parts": [], "upgrades": []}, "fd_aerospike": {"title": "Altitude-Compensating Aerospike Nozzles", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Let the exhaust's outer edge follow ambient pressure so one engine stays efficient from sea level to vacuum.", "parts": [], "upgrades": []}, "fd_deepThrottle": {"title": "Deep-Throttle \u0026 Reliable Restart", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Hold stable combustion from full thrust down to a fraction of it, and relight on demand — the prerequisite for propulsive landing.", "parts": [], "upgrades": []}, "fd_fullFlowStaged": {"title": "Full-Flow Staged Combustion", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Two preburners, oxidiser-rich and fuel-rich, drive separate turbopumps and feed only warm gas to the seals. The highest-pressure, most reusable cycle there is.", "parts": [], "upgrades": []}, "fd_dualBell": {"title": "Dual-Bell \u0026 Extendible Nozzles", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A two-mode bell or a deployable extension recovers altitude performance without an aerospike's cooling headache.", "parts": [], "upgrades": []}, "fd_rotatingDetonation": {"title": "Rotating Detonation Engines", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Replace steady deflagration with a detonation wave chasing itself around an annulus — a theoretical efficiency jump, a practical nightmare to cool.", "parts": [], "upgrades": []}, "th_filmCooling": {"title": "Film \u0026 Curtain Cooling", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Run a fuel-rich boundary layer along the chamber wall as a sacrificial cool film — the crude cooling that made the first big engines survivable.", "parts": [], "upgrades": []}, "th_ablativeCooling": {"title": "Ablative Chamber Liners", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Let a silica-phenolic liner char and erode away, carrying heat with it — cheap, disposable, and good for one burn.", "parts": [], "upgra const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
