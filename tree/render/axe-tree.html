<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

 — the same stiffness at a fraction of the mass.", "parts": [{"name": "RO-RFTank-Integral", "mod": "ProceduralParts", "title": "Procedural Tank (Isogrid Structure)"}, {"name": "ROT-AtlasTank-Integral", "mod": "ROTanks", "title": "Atlas Modular Tank (Isogrid Structure)"}, {"name": "ROT-BoosterTank-Integral", "mod": "ROTanks", "title": "Modular Booster Tank (Isogrid Structure)"}, {"name": "ROT-GenericTank-Integral", "mod": "ROTanks", "title": "Modular Tank (Isogrid Structure)"}, {"name": "ROT-SphericalTank-Integral", "mod": "ROTanks", "title": "Spherical Tank (Isogrid Structure)"}, {"name": "ROT-ToroidalTank-Integral", "mod": "ROTanks", "title": "Modular Toroidal Tank (Isogrid Structure)"}], "upgrades": []}, "str_balloonTank": {"title": "Pressure-Stabilized Monocoque", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Make the wall so thin it only holds shape under pressure — the Atlas 'steel balloon' reached orbit weighing almost nothing empty, and would crumple if you ever let it depressurise. As much an orbital enabler as any engine.", "parts": [{"name": "RO-RFTank-BalloonNew", "mod": "ProceduralParts", "title": "Procedural Tank (Balloon)"}, {"name": "ROT-AtlasTank-Balloon", "mod": "ROTanks", "title": "Atlas Modular Tank (Balloon)"}, {"name": "ROT-BalloonTank-New", "mod": "ROTanks", "title": "Modular Tank (Balloon)"}], "upgrades": []}, "str_staging": {"title": "Pyrotechnic Frangible Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Frangible joints and shaped charges cut a spent stage away on a millisecond's command; small motors settle the propellant for the next light. The only way to the velocities chemistry can't reach in one go.", "parts": [{"name": "Decoupler_1", "mod": "Squad", "title": "TD-12 Decoupler"}, {"name": "Decoupler_2", "mod": "Squad", "title": "TD-25 Decoupler"}, {"name": "KzThrustPlate", "mod": "ProceduralFairings", "title": "Thrust Plate [Procedural]"}, {"name": "ROE-CastorDecoupler", "mod": "ROEngines", "title": "Castor I \u0026 II Radial Decoupler"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "proceduralStackDecoupler", "mod": "ProceduralParts", "title": "Decoupler [Procedural]"}, {"name": "radialDecoupler", "mod": "Squad", "title": "TT-38K Radial Decoupler"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}], "upgrades": []}, "gnc_pitchProgram": {"title": "Open-Loop Pitch Programming", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A timed, pre-computed pitch schedule flown open-loop off a gyro reference — the first machine that flies itself uphill on a fixed program, no feedback, no corrections.", "parts": [], "upgrades": []}, "gnc_rcs": {"title": "Cold-Gas Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Bleed stored gas through opposed thruster pairs to point and hold a vehicle in vacuum — the first three-axis control where there is no air to push against.", "parts": [{"name": "InlineRCS", "mod": "VenStockRevamp", "title": "Inline RCS block (138/223 N class)"}, {"name": "RCSBlock_138", "mod": "Squad", "title": "RCS Block [ 138/223 N Class]"}, {"name": "RCSBlock_28", "mod": "Squad", "title": "RCS Block [  28/45 N Class]"}, {"name": "RCSBlock_69", "mod": "Squad", "title": "RCS Block [  69/111 N Class]"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": []}, "str_booms": {"title": "Stored-Strain Deployable Booms", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Stow a coilable tubular mast under strain for launch and let it spring out on orbit — and hold a magnetometer far enough from the bus to read a field the spacecraft's own metal would otherwise drown.", "parts": [{"name": "RO-EarlyMagnet", "mod": "RP-1", "title": "MG01 - Early Magnetometer"}], "upgrades": []}, "aero_fairings": {"title": "Jettisonable Payload Fairings", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Shroud the payload through the dense lower atmosphere, then split and jettison it cleanly once the air thins — aerodynamic protection that must vanish on command.", "parts": [{"name": "KzInterstageAdapter2", "mod": "ProceduralFairings", "title": "IB - Procedural Interstage Fairing Adapter"}, {"name": "KzProcFairingSide1", "mod": "ProceduralFairings", "title": "Procedural Fairing"}, {"name": "KzResizableFairingBase", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base"}, {"name": "KzResizableFairingBaseRing", "mod": "ProceduralFairings", "title": "FB - Procedural Fairing Base Ring"}, {"name": "RSBRibbedBase", "mod": "ProceduralFairings", "title": "FB - Procedural Ribbed Payload Adapter"}, {"name": "SSTUBase", "mod": "ProceduralFairings", "title": "FB - Procedural Hollow Truss Payload Adapter"}], "upgrades": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Stage a small drogue to stabilise and slow a falling body, then a main canopy to bring it down intact — the oldest way home from space, and the prerequisite for anything you want back.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": []}, "th_radiativeControl": {"title": "Passive Radiative Control", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Reject waste heat to space with coatings, finishes and bimetallic louvers that open and close with temperature — the baseline thermal balance of every spacecraft, before you can afford anything active.", "parts": [{"name": "ca_louver_m", "mod": "CoatlAerospace", "title": "CA-TCL8 Thermal Control Louver"}, {"name": "ca_louver_s", "mod": "CoatlAerospace", "title": "CA-TCL4 Thermal Control Louver"}, {"name": "ca_louver_s2", "mod": "CoatlAerospace", "title": "CA-TCL4-B Thermal Control Louver"}], "upgrades": []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4a261", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A sealed, pressurised, fan-stirred vessel that keeps electronics alive through the orbital hot-cold cycle and runs its own timeline unattended. Sputnik was little more than this — and that sealed sphere WAS the engineering.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}], "upgrades": []}, "elec_siliconPV": {"title": "Diffused-Junction Photovoltaics", "discipline": "Electrical Power", "color": "#ffd166", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Diffuse a shallow p-n junction into silicon and sunlight drives a current across it indefinitely — the breakthrough that freed satellites from their batteries. Vanguard 1 flew the first cells.", "parts": [{"name": "RO-rangerSolarPanel", "mod": "RealismOverhaul", "title ouched space and came home on a runway. Where the aircraft and rocket lines first meet.", "parts": [{"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "ROE-XLR10", "mod": "ROEngines", "title": "XLR10"}, {"name": "ROE-XLR11", "mod": "ROEngines", "title": "XLR11"}, {"name": "ROE-XLR25", "mod": "ROEngines", "title": "XLR25"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}], "upgrades": []}, "int_orbitalInsertion": {"title": "Orbital Insertion", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "A stable high-thrust engine, a tank light enough to close the rocket equation, staging, and a pitch program converge. Build your own satellite from the bus, power and antenna beside it. Beep. Beep. Beep.", "parts": [], "upgrades": []}, "int_applicationsSat": {"title": "Applications Satellite Bus", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The turn from 'science probe' to 'useful satellite' — a standard bus for communications and navigation payloads. It flies contracts, and a fleet in orbit is a steady science and revenue farm.", "parts": [{"name": "RP-1-CommunicationSat", "mod": "RP-1", "title": "Communication Contract Satellite Bus"}, {"name": "RP-1-NavigationSat", "mod": "RP-1", "title": "Navigation Contract Satellite Bus"}], "upgrades": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
