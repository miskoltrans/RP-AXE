<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

fd_turbopumpFeed": {"title": "Turbopump Feed", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Drive the propellants with a turbine-spun pump instead of tank pressure: the tank no longer has to be a heavy pressure vessel, and the chamber can run far harder than any pressure-fed sounding motor reaches. This is the real step from a powder dart to the turbopump-fed V-2 — a large liquid rocket at last. (Its chamber was film-cooled; regenerative cooling you already fly on the ORM-65.)", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": []}, "fd_multiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Combustion instability tears a single large chamber apart in milliseconds. The Soviet answer was to not build one: four smaller chambers per engine, each below the acoustic threshold, fed by a common turbopump. The R-7 that launched Sputnik.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}, {"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "ROE-S155", "mod": "ROEngines", "title": "S-155"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": []}, "fd_baffledInjector": {"title": "Single Large-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Don't split the chamber — scale a single large one and tame its combustion by hand. At this size careful injector design holds; the truly enormous chambers (the F-1) would later need injector-face baffles and tuned cavities to survive. Harder than many small chambers, but it scales, and it isn't a Western monopoly: the LR89/LR79/LR87/LR91 boosters (Atlas, Thor, Titan), Britain's licensed RZ, Vanguard's X-405 family — and the Soviets' own RD-111 (Desna), fast-fuelled with supercooled kerolox to match a storable rival's readiness, solving the identical problem without clustering.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}, {"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RZ", "mod": "ROEngines", "title": "RZ.1/RZ.2"}, {"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}, {"name": "ROE-X405H", "mod": "ROEngines", "title": "X-405H"}], "upgrades": []}, "fd_verniers": {"title": "Vernier Trim Chambers", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Small, gimballed trim chambers that steer and roll the stack while the main engines just push — the Atlas and Jupiter vernier motors, co-developed with the big engines they trim. The fine hand on a heavy rocket.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-RD0110Vernier", "mod": "ROEngines", "title": "RD-0110 Vernier (DEPRECATED)"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}], "upgrades": []}, "pc_hypergolics": {"title": "Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, indefinite restarts, storable for years. Pure chemistry: a simple ablative engine that needs neither cooling jacket nor ignition system. The propulsion of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}, {"name": "ROE-RD200", "mod": "ROEngines", "title": "RD-200"}], "upgrades": []}, "pc_fluorineOxidizer": {"title": "Liquid Fluorine Oxidizer Chemistry", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "The most reactive element there is, chilled to a liquid and burned with hydrazine for storable-propellant performance nothing else touches — tested on stands, never flown operationally, because everything downstream of the tank tends to ignite or dissolve on contact. NOMAD's engine, a real dead end kept in the tree for the story it tells.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen — vacuum-jacketed tanks, multilayer insulation, boil-off you fight every hour on the pad — for the highest specific impulse chemistry there is, years ahead of history. It just costs more program to get there.", "parts": [], "upgrades": []}, "fd_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, thrust-limited by heat pickup. The RL-10, and the highest specific impulse a chemical engine reaches.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": []}, "fd_orbitalThrust": {"title": "Orbital-Class Thrust", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Enough thrust, stable enough, to burn all the way to orbital velocity — reached by whichever engine you chose to perfect: Soviet multi-chamber, Western baffled injector, or a hydrolox upper stage. The rocket equation doesn't care how you got here.", "parts": [], "upgrades": []}, "pc_solidGrains": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery binder, cast and cured into a structural grain with an integral nozzle — cheap, dense, storable. You light it once and it does not stop.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-BabySergeantX11", "mod": "ROEngines", "title": "Baby Sergeant 11x Cluster"}, {"name": "ROE-BabySergeantX3", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster"}, {"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-GCRC", "mod": "ROEngines", "title": "GCRC 33KS-2800"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}, {"name": "ROE-Star13", "mod": "ROEngines", "title": "STAR 13"}], "upgrades": []}, "met_weldedTank": {"title": "Fusion-Welded Pressure Vessels", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Roll, fusion-weld and proof-test a cylinder that holds pressure without bursting — the first tank that flies. Heavy, but honest.", "parts": [{"name": "RO-RFTank-SM", "mod": "ProceduralParts", "title": "Procedural Tank (Service Module)"}, {"name": "ROT-AtlasTank-Separate", "mod": "ROTanks", "title": "Atlas Modular Tank (Conventional Structure)"}, {"name": "ROT-BoosterTank-Separate", "mod": "ROTanks", "title": "Modular Booster Tank (Conventional Structure)"}, {"name": "ROT-GenericTank-Separate", "mod": "ROTanks", "title": "Modular Tank (Conventional Structure)"}, {"name": "ROT-KatnissTank-Separate", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Conventional Structure)"}, {"name": "ROT-LanderTank-SM", "mod": "ROTanks", "title": "Modular Landing Tank (Service Module)"}, {"name": "ROT-LanderTank-Separate", "mod": "ROTanks", "title": "Modular Landing Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-Radial-Separate", "mod": "ROTanks", "title": "Another Modular Radial Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-Separate", "mod": "ROTanks", "title": "Another Modular Tank (Conventional Structure)"}, {"name": "ROT-MiscTank-Service  "cost": 20, "anyToUnlock": false, "flavor": "Diffuse a shallow p-n junction into silicon and sunlight drives a current across it indefinitely — the breakthrough that freed satellites from their batteries. Vanguard 1 flew the first cells. The obvious power for anywhere the sun reaches.", "parts": [{"name": "RO-rangerSolarPanel", "mod": "RealismOverhaul", "title": "Ranger Solar Panel"}, {"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}, {"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}, {"name": "RO_EarlyTinySolarPanel", "mod": "Squad", "title": "ST1 Tiny Solar Panel"}], "upgrades": []}, "nuc_rtg": {"title": "Radioisotope Thermoelectrics", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "A decaying isotope's heat across a thermocouple gives steady watts for decades, anywhere, sunlight or not. Absurd to fly to a sunlit orbit when solar is cheaper and lighter — but the only power there is for the Moon's 14-day night and the outer dark.", "parts": [{"name": "RO-MMRTG", "mod": "Squad", "title": "Multi-Mission RTG"}, {"name": "RO-SNAP-19-RTG", "mod": "VenStockRevamp", "title": "SNAP-19 Series RTG"}, {"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}, {"name": "RO-SNAP-9-RTG", "mod": "VenStockRevamp", "title": "SNAP-9 Series RTG"}], "upgrades": []}, "tel_telemetry": {"title": "Pulse-Interval Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Encode temperature and pressure in the spacing between radio pulses and key it to the ground — Sputnik's beacon turned a satellite's state into something you could hear from another continent.", "parts": [{"name": "SXTAntenna", "mod": "SXT", "title": "Sputnik PS-1 Antenna"}, {"name": "SurfAntenna", "mod": "Squad", "title": "Communotron 16-S"}, {"name": "longAntenna", "mod": "Squad", "title": "Communotron 16"}, {"name": "nfex-antenna-rover-2", "mod": "NearFutureExploration", "title": "AX-5 Aerial Micro-Antenna"}], "upgrades": []}, "nuc_geiger": {"title": "Geiger-Müller Ionization Counting", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A gas-discharge tube that clicks once per ionising particle — cheap, rugged, and the first satellites' sharpest sense. Explorer 1 carried one and found the Van Allen belts. (Its early tier is a science-pacing dial.)", "parts": [{"name": "RO-GeigerMuller", "mod": "RP-1", "title": "CR01 - Geiger-Muller Counter"}, {"name": "RP0probeVanguardXray", "mod": "Squad", "title": "20in X-Ray Detector (DEPRECATED)"}], "upgrades": []}, "met_exposurePanels": {"title": "Materials Exposure Panels", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Heavy sealed boxes that expose a material, a microbe colony or an impact grid to launch, vacuum and radiation and bring it home — science that rides in a structural can, not a delicate instrument. (Mystery Goo lives here in Metallurgy.)", "parts": [{"name": "BioCapsule", "mod": "SXT", "title": "Advanced Biological Capsule"}, {"name": "GooExperiment", "mod": "Squad", "title": "Biological Sample Capsule"}, {"name": "RO-Micrometeorite", "mod": "RP-1", "title": "MM01 - Micrometeorite Detector"}, {"name": "SXTProbeGooo", "mod": "SXT", "title": "Biological Sample Capsule"}, {"name": "USGooBayWedge", "mod": "UniversalStorage2", "title": "Biological Sample Capsule"}], "upgrades": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Expose film in flight and scan-and-transmit or physically return it — the highest resolution there is, if you can get it home. Luna 3's look at the far side of the Moon.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title":  "XF-104 Radial Shock Cone Intake"}, {"name": "aje_avon", "mod": "Squad", "title": "Avon Turbojet"}, {"name": "aje_j57", "mod": "Squad", "title": "J57 Turbojet"}], "upgrades": []}, "aero_shockInlets": {"title": "Oblique-Shock Inlets", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Decelerate intake air through a controlled train of oblique shocks so the compressor keeps breathing past Mach 2 — sustained supersonic cruise, not just a dash.", "parts": [{"name": "RO-B9ProcWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Supersonic)"}, {"name": "RO-shockConeIntake125", "mod": "Squad", "title": "1.25m Shock Cone Intake"}, {"name": "RO-shockConeIntakeBomarc", "mod": "Squad", "title": "0.70m Shock Cone Intake"}, {"name": "RO-shockConeIntakeMig", "mod": "Squad", "title": "0.86m Shock Cone Intake"}, {"name": "shockConeIntake", "mod": "Squad", "title": "Shock Cone Intake"}], "upgrades": []}, "aero_afterburner": {"title": "Afterburning Turbojets", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Inject and burn fuel in the exhaust downstream of the turbine for a burst of extra thrust — reheat for the transonic dash and climb, flown years before any sustained-Mach-2 inlet existed.", "parts": [{"name": "RO-AL7F", "mod": "Squad", "title": "AL-7 Turbojet"}, {"name": "RO-Atar101D", "mod": "SXT", "title": "Atar 101 Turbojet"}, {"name": "aje_j75", "mod": "Squad", "title": "J75 Turbojet"}, {"name": "aje_j79", "mod": "Squad", "title": "J79 Turbojet"}], "upgrades": []}, "aero_ramjet": {"title": "Ram Compression", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Above Mach 2 the inlet does all the compressing and you can discard the turbine entirely — a ramjet, or a turbo-ramjet that hands off between the two.", "parts": [{"name": "RO-Nord1500", "mod": "Squad", "title": "Nord oUnlock": false, "flavor": "Proved uncrewed first: a spinning film-return capsule with a phenolic char heatshield, snagged out of the air off a coastline, years before it ever carried a person. First use of the Composite Materials lane.", "parts": [{"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}, {"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-SampleReturnCommand", "mod": "RP-1", "title": "Sample Return Command Module (DEPRECATED)"}], "upgrades": []}, "int_crewedCapsule": {"title": "Crewed Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The irreducible list to fly a person to orbit and bring them home alive: an orbit-capable booster, attitude control to keep the heatshield forward, the heatshield itself, a way to decelerate, and air to breathe. Nothing else is physics — everything else is a practical-path nicety, kept off the gate.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "ROC-MercuryNoseCapBDB", "mod": "ROCapsules", "title": "Mercury M-DCAM Nose Unit"}, {"name": "ROC-VostokCapsule", "mod": "ROCapsules", "title": "Vostok Descent Module"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROC-ZenitCapsule", "mod": "ROCapsules", "title": "Zenit Descent Module (Improved Film Camera)"}, {"name": "RP0HumanRatedFlag", "mod": "Squad", "title": "Human Rated Flag"}, {"name": "mk1pod_v2", "mod": "Squad", "title": "Mk1 Pod (2m)"}], "upgrades": []}, "str_launchEscape": {"title": "Powered Abort Escape", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "A solid tractor motor that yanks the capsule ble hypergolics.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}, {"name": "ROE-S2253", "mod": "ROEngines", "title": "S2.253/S3.42/S5.2"}], "upgrades": []}, "fd_restartableHypergolics": {"title": "Restart-in-Vacuum Hypergolic Ignition", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Reignite in vacuum on command, not just once at launch — the Agena upper stage, the platform that became Corona's bus and Gemini's docking target, and the small satellite-attitude engines the same restart trick spawned at a smaller scale.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-Agena_EquipmentRack", "mod": "ROEngines", "title": "Agena Equipment Rack"}], "upgrades": []}, "pc_storableBoosters": {"title": "Storable-Propellant Orbital-Class Boosters", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Corrosive, toxic storables scaled from a small hypergolic trim engine up to full first-stage thrust — the Yangel-bureau approach of repurposing an ICBM's always-ready propellants for a space launcher.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}, {"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF20_Engi y Retro (TE-M-316)"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": []}, "tel_helicalDirectional": {"title": "Helical Directional Arrays", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Axial-mode helix gives circularly-polarized gain that tolerates a tumbling spacecraft.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": []}, "aero_turboshaftProp": {"title": "Free-Turbine Propeller Drive", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "A power turbine geared down to spin a propeller instead of shoving exhaust out the back — the NK-12, still the most powerful turboprop ever built, driving the Tu-95's contra-rotating props at near-supersonic tip speed.", "parts": [{"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "SXTPWPT6", "mod": "SXT", "title": "PT6A Turboprop"}], "upgrades": []}};

  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
