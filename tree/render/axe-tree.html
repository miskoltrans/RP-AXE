<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

hed to its size limit before composite takes over.", "parts": [{"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", "mod": "ROEngines", "title": "Alcyone 1 BE-3"}, {"name": "ROE-NikeM5E1", "mod": "ROEngines", "title": "Nike M5E1"}], "upgrades": [], "grants": [], "experiments": []}, "pc_compositeSolid": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery polysulfide matrix, cast to shape around an integral nozzle — higher energy than double-base and castable to any size. The Baby Sergeant cluster that spun Explorer 1 to orbit.", "parts": [{"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "ROE-BabySergeantX11", "mod": "ROEngines", "title": "Baby Sergeant 11x Cluster"}, {"name": "ROE-BabySergeantX3", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster"}, {"name": "ROE-GCRC", "mod": "ROEngines", "title": "GCRC 33KS-2800"}], "upgrades": [], "grants": [], "experiments": []}, "pc_hypergolics": {"title": "Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, storable for years, restartable after a cold coast. The propellant of upper stages and spacecraft engines that must light every time.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-RD200", "mod": "ROEngines", "title": "RD-200"}, {"name": "ROE-S2253", "mod": "ROEngines", "title": "S2.253/S3.42/S5.2"}], "upgrades": ["RFUpgrade_Model39cI", "RFUpgrade_NitrousOxide", "RFUpgrade_XASR-1", "RFUpgrade_XASR-2", "RFUpgrade_XLR81-BA-5"], "grants": [], "experiments": []}, "pc_ethanol90": {"title": "High-Concentration Alcohol Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "The V-2 burned alcohol cut with a quarter water, because the water was what kept the chamber from burning through. Take the water out and the flame runs hotter and harder — but only once the chamber can survive it. Ninety percent is where the Soviets stopped, and it is worth a third more thrust than the engine they copied.", "parts": [], "upgrades": ["RFUpgrade_RD-101"], "grants": [], "experiments": []}, "pc_rp1": {"title": "Narrow-Cut Refined Kerosene", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Stop burning alcohol and burn kerosene — but not the kerosene an aeroplane gets. Distil a narrow cut, strip the sulphur, cap the aromatics, and specify it so tightly that it stops laying down carbon in the cooling passages on a long burn. The fuel becomes a component with a part number.", "parts": [], "upgrades": ["RFUpgrade_LR43-NA-3", "RFUpgrade_LR89-NA-3"], "grants": [], "experiments": []}, "pc_hydyne": {"title": "Amine-Blend Booster Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Blend an unsymmetrical hydrazine into diethylenetriamine and you get a fuel that outruns alcohol in the same tanks and the same engine — worth sixteen seconds of specific impulse for nothing but a change of what you pour in. It corrodes, it poisons, and the crews hated it; the first American satellite went up on it anyway.", "parts": [], "upgrades": ["RFUpgrade_A-6H"], "grants": [], "experiments": []}, "pc_udmhBoosterFuel": {"title": "Neat Hydrazine-Derivative Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": true, "flavor": "Drop the diluent and feed the booster unsymmetrical dimethylhydrazine straight. It buys nearly twenty seconds over kerosene in the same chamber and costs you a fuel that burns on contact with almost anything, eats seals, and will kill a pad crew that gets careless with a coupling.", "parts": [], "upgrades": ["RFUpgrade_S-3FH"], "grants": [], "experiments": []}, "pc_htp": {"title": "High-Test Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Concentrated hydrogen peroxide decomposed across a silver catalyst into a hot oxidising gas — a storable oxidiser that needs no cryogenics and lights a kerosene engine cleanly. Britain's Gamma sustainers ran on it.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}], "upgrades": ["RFUpgrade_HTP"], "grants": [], "experiments": []}, "pc_stentor": {"title": "Deep-Throttling Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A two-chamber peroxide engine whose small cruise chamber throttles deeply while a fixed chamber boosts — variable thrust from a storable propellant, built for a missile that had to coast and correct. (Britain's Stentor.)", "parts": [{"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}], "upgrades": [], "grants": [], "experiments": []}, "met_stainlessSteel": {"title": "Austenitic Stainless Steel", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Chromium-nickel steel that keeps its strength while hot and holds a higher chamber pressure without a thicker, heavier wall — the metallurgy that turned the V-2's chamber into the Redstone's. Push the pressure, take the thrust.", "parts": [], "upgrades": ["RFUpgrade_A-6", "RFUpgrade_AJ10-27", "RFUpgrade_Model39c", "RFUpgrade_RD-102", "RFUpgrade_RDA-1-150", "RFUpgrade_U-1700", "RFUpgrade_Veronique61", "RFUpgrade_XLR11-RM-5"], "grants": [], "experiments": []}, "fd_injectors": {"title": "Impinging-Jet Injectors", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Aim paired fuel and oxidiser jets to collide and atomise on contact, across a flat plate drilled for even mixing over the whole injector face — more complete combustion, a little more specific impulse from the same propellants. Get it right and a small pressure-fed chamber burns clean enough to fly: the four-chamber engine of a rocket aeroplane, and the combustion craft the turbopump-fed boosters are built on.", "parts": [], "upgrades": ["RFUpgrade_A-9", "RFUpgrade_VeroniqueAGI"], "grants": [], "experiments": []}, "met_nimonic": {"title": "Nimonic Turbine Alloys", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Nickel-chromium superalloy that keeps its strength at red heat — a turbopump turbine that spins hotter and harder feeds a higher chamber pressure, and the very same alloy is what lets a jet turbine run at all. The metallurgy where rockets and jets cross over.", "parts": [], "upgrades": ["RFUpgrade_Avon114R", "RFUpgrade_CJ805-3B", "RFUpgrade_J35-A-17", "RFUpgrade_J47-GE-25A", "RFUpgrade_J48-P-8", "RFUpgrade_J57-P-21", "RFUpgrade_J57-P-43WA", "RFUpgrade_J57-P-7A", "RFUpgrade_JT3C-6", "RFUpgrade_RD-107-11D512", "RFUpgrade_RD-107-8D728", "RFUpgrade_RD-107-8D74-1958", "RFUpgrade_RD-107-8D74-1959", "RFUpgrade_RD-107-8D74K", "RFUpgrade_RD-107-8D74PS", "RFUpgrade_RD-107-8D76", "RFUpgrade_RD-108-8D75-1958", "RFUpgrade_RD-108-8D75-1959", "RFUpgrade_RD-108-8D75K", "RFUpgrade_RD-108-8D75PS", "RFUpgrade_RD-212-8D41", "RFUpgrade_S3.42T", "RFUpgrade_Sapphire203", "RFUpgrade_WP-6"], "grants": [], "experiments": []}, "met_weldedTank": {"title": "Fusion-Welded Pressure Vessels", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Roll, fusion-weld and proof-test a thin metal cylinder that holds its propellant under pressure without bursting — the first tank that flies, and the steel the first engine chambers are cut from. Heavy, but honest.", " r Alloy Tankage", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Alloy the aluminium with copper and it age-hardens: the same tank wall carries more load for less metal, and the duralumin family that made aircraft possible finally makes a lighter rocket too.", "parts": [], "upgrades": ["RFTech-Tank-Sep-AlCu"], "grants": [], "experiments": []}, "met_isogrid": {"title": "Machined Isogrid Stiffening", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Machine a triangular-rib isogrid into thick plate — cutting metal away everywhere the load path doesn't run, leaving only the ribs that carry it. The same stiffness at a fraction of the mass; the light conventional tankage that flies most orbital rockets.", "parts": [{"name": "RO-RFTank-Integral", "mod": "ProceduralParts", "title": "Procedural Tank (Isogrid Structure)"}, {"name": "ROT-AtlasTank-Integral", "mod": "ROTanks", "title": "Atlas Modular Tank (Isogrid Structure)"}, {"name": "ROT-BoosterTank-Integral", "mod": "ROTanks", "title": "Modular Booster Tank (Isogrid Structure)"}, {"name": "ROT-GenericTank-Integral", "mod": "ROTanks", "title": "Modular Tank (Isogrid Structure)"}, {"name": "ROT-KatnissTank-Integral", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Isogrid Structure)"}, {"name": "ROT-LanderTank-Integral", "mod": "ROTanks", "title": "Modular Landing Tank (Isogrid Structure)"}, {"name": "ROT-MiscTank-Integral", "mod": "ROTanks", "title": "Another Modular Tank (Isogrid Structure)"}, {"name": "ROT-MiscTank-Radial-Integral", "mod": "ROTanks", "title": "Another Modular Radial Tank (Isogrid Structure)"}, {"name": "ROT-Nose-Integral", "mod": "ROTanks", "title": "Modular Nose Tank (Isogrid Structure)"}, {"name": "ROT-RadialTank-Integral", "mod": "ROTanks", "title": "Radial Tank (Isogrid Structure)"}, {"name": "ROT-SphericalTank-Integral", "mod": "ROTanks", "title": "Spherical Tank (Isogrid Structure)"}, {"name": "ROT-ToroidalTank-Integral", "mod": "ROTanks", "title": "Modular Toroidal Tank (Isogrid Structure)"}], "upgrades": [], "grants": [], "experiments": []}, "str_balloonTank": {"title": "Pressure-Stabilized Monocoque", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Make the stainless wall so thin it only holds its shape under internal pressure — the Atlas 'steel balloon' reached orbit weighing almost nothing empty, and would crumple if you ever let it depressurise. As much an orbital enabler as any engine.", "parts": [{"name": "RO-RFTank-BalloonNew", "mod": "ProceduralParts", "title": "Procedural Tank (Balloon)"}, {"name": "ROT-AtlasTank-Balloon", "mod": "ROTanks", "title": "Atlas Modular Tank (Balloon)"}, {"name": "ROT-BalloonTank-New", "mod": "ROTanks", "title": "Modular Tank (Balloon)"}, {"name": "ROT-KatnissTank-Balloon", "mod": "ROTanks", "title": "Katniss Parts Pack Tank (Balloon)"}, {"name": "ROT-MiscTank-Balloon", "mod": "ROTanks", "title": "Another Modular Tank (Balloon)"}], "upgrades": [], "grants": [], "experiments": []}, "str_staging": {"title": "Pyrotechnic Frangible Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Frangible joints and shaped charges cut a spent stage away on a millisecond's command; small motors settle the propellant for the next light. The only way to the velocities chemistry can't reach in one burn.", "parts": [{"name": "ROE-120XDecoupler", "mod": "ROEngines", "title": "UA120X Radial Decoupler"}, {"name": "ROT-RingDecoupler", "mod": "ROTanks", "title": "Ring Decoupler"}, {"name": "proceduralStackDecoupler", "mod": "ProceduralParts", "title": "Decoupler [Procedural]"}, {"name": "radialDecoupler", "mod": "Squad", "title": "TT-38K Radial Decoupler"}, {"name": "sargas_decoupler_s1p5_1", "mod": "Tantares", "title": "TKS VA Capsule Decoupler"}], "upgrades": [], "grants": [], "  []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Seal the electronics in a pressurised sphere with a circulating gas and a polished radiating skin, holding them at room temperature through the swing from sunlight to shadow. Sputnik was mostly this: a bus that keeps its instruments alive.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}], "upgrades": ["MLI.Upgrade1"], "grants": [], "experiments": []}, "elec_semiconductorDiode": {"title": "Semiconductor Diodes", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "A sliver of doped crystal that passes current one way only — grown up from the cat's-whisker radio detector into a rugged solid-state device. It lights an indicator on almost no power, and it is the seed of everything solid-state: rectifiers, transistors, the integrated circuit still to come. Microelectronics grows from here.", "parts": [{"name": "ROC-ApolloDockingLightBDB", "mod": "ROCapsules", "title": "Apollo Docking Spotlight"}, {"name": "ROC-ApolloEVALightBDB", "mod": "ROCapsules", "title": "Apollo EVA Spotlight"}, {"name": "SmallPointLight", "mod": "VenStockRevamp", "title": "MK 4 Point Light"}, {"name": "SmallSpotLight", "mod": "VenStockRevamp", "title": "MK 3 Mini Spotlight"}, {"name": "SmallStripLight", "mod": "VenStockRevamp", "title": "MK 5 Strip Light"}, {"name": "domeLight1", "mod": "Squad", "title": "Domelight Mk1"}, {"name": "groundLight1", "mod": "Squad", "title": "Work Lamp (Small)"}, {"name": "groundLight2", "mod": "Squad", "title": "Work Lamp (Stand)"}, {"name": "navLight1", "mod": "Squad", "title": "Navigation Light Mk1"}, {"name": "spotLight1", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight1_v2", "mod": "Squad", "title": "Illuminator Mk1"}, {"name": "spotLight2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight2_v2", "mod": "Squad", "title": "Illuminator Mk2"}, {"name": "spotLight3", "mod": "Squad", "title": "Spotlight Mk1"}, {"name": "stripLight1", "mod": "Squad", "title": "Lightstrip Mk1"}], "upgrades": ["HDD-Upgrade-Basic"], "grants": [], "experiments": []}, "elec_transistor": {"title": "Transistor Amplification", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Replace the fragile, power-hungry vacuum tube with a sliver of doped germanium that amplifies and switches a signal cold, on almost nothing — the active device the diode could never be. Microelectronics proper begins here: every transistorised instrument, guidance platform and television camera that follows is built on this one breakthrough.", "parts": [], "upgrades": ["HDD-Upgrade-1961"], "grants": [], "experiments": []}, "elec_silverZinc": {"title": "Silver-Zinc Primary Batteries", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Pair a silver oxide cathode against a zinc anode and the cell gives up more energy for its mass than anything else that will fit in a payload — ruinously expensive, flat in a matter of days, and entirely good enough for a satellite whose whole job is to transmit until it stops. Sputnik was three of these and a radio.", "parts": [], "upgrades": ["RFTech-Battery-II"], "grants": [], "experiments": []}, "elec_siliconPV": {"title": "Diffused-Junction Photovoltaics", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "Diffuse a shallow junction into a silicon wafer so sunlight knocks a current across it — grams of cells that trickle-charge a battery indefinitely, outliving every chemical primary. Vanguard 1 is still up there, still lit.", "parts": [{"name": "ROS-StaticSolarPanel", "mod": "ROSolar", "title": "Static Solar Panel"}, {"name": "RO_EarlyMediumSolarPanel", "mod": "Squad", "title": "ST1 Medium Solar Panel"}, {"name": "RO_EarlyTinySolarPanel", "mod": "Squad", "title": "ST1 Tiny Solar Panel"}], "upgrades": [], "grants": [], "experiments": []}, "rob_rotorActuation": {"title": "Electric Rotor Actuation", "discipline": "Robotics", "color": "#d98c2b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A brushless electric motor married to a solid-state controller that holds it at any commanded speed or angle — the first actuator a machine can move on its own. Nothing in an unmanned launcher spins one yet, but every arm, rover wheel, tracking mount and deployable to come turns on this.", "parts": [{"name": "rotor_01", "mod": "SquadExpansion", "title": "EM-16 Light Duty Rotor"}, {"name": "rotor_01s", "mod": "SquadExpansion", "title": "EM-16S Light Duty Rotor"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_rcs": {"title": "Cold-Gas Reaction Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Bleed compressed nitrogen through opposed nozzles to nudge a craft's attitude — no combustion, nothing to go wrong, just enough impulse to point. The simplest way to hold an orientation in vacuum.", "parts": [{"name": "RO-2kN-Thruster", "mod": "Squad", "title": "2.2/3.6kN Thruster"}, {"name": "ROE-Agena_EquipmentRack", "mod": "ROEngines", "title": "Agena Equipment Rack"}, {"name": "ROE-ModularRCS", "mod": "ROEngines", "title": "Modular RCS"}], "upgrades": ["RFTech-rcs-tltech1"], "grants": [], "experiments": []}, "aero_recovery": {"title": "Drogue-Stabilized Deceleration", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "A small drogue bites the thin high air to hold a falling body straight and slow it enough that a main canopy can open without tearing — the difference between a returned payload and a crater.", "parts": [{"name": "RC_cone", "mod": "RealChute", "title": "Parachute - Cone"}, {"name": "RC_cone_double", "mod": "RealChute", "title": "Parachute - Cone (Double)"}, {"name": "RC_radial", "mod": "RealChute", "title": "Parachute [Radial]"}, {"name": "RC_stack", "mod": "RealChute", "title": "Parachute - Stack (Double)"}, {"name": "evaChute", "mod": "Squad", "title": "Personal Parachute"}, {"name": "parachuteDrogue", "mod": "Squad", "title": "Mk25 Parachute"}, {"name": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": [], "grants": [], "experiments": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture.", "parts": [{"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-SampleReturnCommand", "mod": "RP-1", "title": "Sample Return Command Module (DEPRECATED)"}, {"name": "science_module", "mod": "Squad", "title": "PH01 - Early Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_fineGrainEmulsion": {"title": "Fine-Grain Emulsion", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 2, "cost": 3, "anyToUnlock": false, "flavor": "Smaller silver-halide crystals record finer detail on the same frame, through the same lens — resolution bought in the darkroom rather than the optical shop. The penalty is speed: a slower emulsion needs a longer exposure, and a satellite does not hold still.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_vidicon": {"title": "Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Scan a photoconductive target with an electron beam and read the image off as a video signal — lower resolution than film, but it comes down the radio link the instant you take it. No capsule to recover.", "parts": [{"name": "RO-EarlyTVCamera", "mod": "RP-1", "title": "VI01 - Early Television Camera"}, {"name": "aerocam", "mod": "HullCameraVDS", "title": "Aerocam"}, {"name": "aerocam180", "mod": "HullCameraVDS", "title": "Aerocam 180"}, {"name": "hc_booster", "mod": "HullCameraVDS", "title": "BoosterCam"}, {"name": "hc_kazzelblad", "mod": "HullCameraVDS", "title": "BoosterCam"}, {"name": "hc_launchcam", "mod": "HullCameraVDS", "title": "KSC Launchpad Camera"}, {"name": "hc_navcam", "mod": "HullCameraVDS", "title": "NavCam"}, {"name": "hc_nightvision", "mod": "HullCameraVDS", "title": "Nightvisioncam"}, {"name": "hc_scicam", "mod": "HullCameraVDS", "title": "ScienceCam"}, {"name": "hc_wideangle", "mod": "HullCameraVDS", "title": "Wide Angle Cam"}, {"name": "kerbpro", "mod": "HullCameraVDS", "title": "KerbPro"}, {"name": "mumech_hullcam", "mod": "HullCameraVDS", "title": "Basic Hull Camera Deluxe"}], "upgrades": [], "grants": [], "experiments": [{"name": "Early TV Camera", "id": "RP0visibleImaging1", "sci": 1, "group": "Experiments"}]}, "nuc_geiger": {"title": "Geiger-Müller Ionization Counting", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "A wire at high voltage in a gas tube: a single charged particle triggers an avalanche you can read as a click. The instrument that found the radiation belts on the first American satellite.", "parts": [{"name": "RO-GeigerMuller", "mod": "RP-1", "title": "CR01 - Geiger-Muller Counter"}, {"name": "RO-Micrometeorite", "mod": "RP-1"  "upgrades": [], "grants": [], "experiments": [{"name": "Cherenkov Detector 1", "id": "RP0Cherenkov", "sci": 20, "group": "Experiments"}, {"name": "Radiation Detector 2", "id": "RP0cosmicRay2", "sci": 30, "group": "Experiments"}]}, "nuc_gammaRaySpectrometry": {"title": "Gamma-Ray Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Cosmic rays knock the nuclei of a planet's surface into excited states, and they fall back emitting gamma rays at energies unique to each element. Count those photons from orbit and sort them by energy and the ground below resolves into potassium, thorium, uranium, iron and titanium — the first instrument that says what another world is made of, not what it looks like. Luna 10 did it in 1966, before anything had landed.", "parts": [{"name": "AXE-GammaRaySpectrometer", "mod": "RP-AXE", "title": "GR01 - Gamma-Ray Spectrometer"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_xrayFluorescence": {"title": "X-Ray Fluorescence Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "The Sun's X-rays strike the surface and it fluoresces back, and in that returning light sit the elements gamma rays read poorly — magnesium, aluminium, silicon, the rock-forming majority. The catch is that you are reading an echo, so the instrument must also look at the Sun to know what was shouted. Apollo's service module carried both, staring down and up at once.", "parts": [{"name": "AXE-XRayFluorescence", "mod": "RP-AXE", "title": "XR01 - X-Ray Fluorescence Spectrometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Solar X-Ray Detection", "id": "RP0solarXRayDetection", "sci": 150, "group": "Crew Science"}]}, "nuc_neutronSpectrometry": {"title": "Neutron Spectrometry", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Cosmic rays spall neutrons out of the ground, and hydrogen — alone among nuclei in weighing exactly what a neutron does — robs them of their energy on the way out. So you count what does NOT come back. Suppressed neutrons mean buried hydrogen, buried hydrogen means water ice, and the map that falls out tells you which permanently shadowed crater is worth landing in.", "parts": [{"name": "AXE-NeutronSpectrometer", "mod": "RP-AXE", "title": "NS01 - Neutron Spectrometer"}], "upgrades": [], "grants": [], "experiments": []}, "opt_recon": {"title": "Film Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A rotating lens sweeps the ground across a curved film gate, laying a horizon-to-horizon strip onto one frame — the whole swath at reconnaissance scale, in a camera small enough to orbit. The high-resolution photography that was the real reason the first satellites flew, and it gets there before the television does.", "parts": [{"name": "RO-ImprovedFilmCamera", "mod": "RP-1", "title": "PH03 - Improved Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_largeApertureOptics": {"title": "Large-Aperture Optics", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Resolution is set by the diameter of the glass, so the camera stops being a payload and becomes the spacecraft — a mirror the length of the bus, folded to fit a fairing and held in focus while the structure warms and cools. Grain and lens motion are no longer the limit; diffraction is.", "parts": [{"name": "RO-HighResFilmCamera", "mod": "RP-1", "title": "PH04 - High Resolution Film Camera"}], "upgrades": [], "grants": [], "experiments": []}, "opt_tvRecon": {"title": "Television Reconnaissance", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Higher-resolution vidicon cameras that scan the reconnaissance image down a radio link the moment it is taken — no capsule to recover, the picture on the ground in minutes. The electronic eye catching up to the spy film.", "parts": [{"name": "RO-BasicTVCamera", "mod": "RP-1", "title": "VI02 - Basic TV Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Basic TV Camera", "id": "RP0visibleImaging2", "sci": 2, "group": "Experiments"}]}, "opt_remoteSensing": {"title": "Infrared Remote Sensing", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Scan the planet in wavelengths the eye cannot see: an infrared radiometer maps cloud-top temperature, an ultraviolet spectrometer reads the high atmosphere. The first weather and earth-resource sensing from orbit.", "parts": [{"name": "RO-IRRadiometer", "mod": "RP-1", "title": "IR01 - Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer", "id": "RP0infraredRad1", "sci": 2, "group": "Experiments"}]}, "opt_irRadiometry": {"title": "High-Resolution Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A finer detector and a tighter scan resolve the infrared scene into detail the first radiometer blurred — the warm and cold of a coastline or a storm system mapped sharply, still in a single band but now worth the downlink.", "parts": [{"name": "RO-HRIRRadiometer", "mod": "RP-1", "title": "IR02 - High-Resolution Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer 2", "id": "RP0infraredRad2", "sci": 3, "group": "Experiments"}]}, "opt_twoChannelIR": {"title": "Two-Channel Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's.", "parts": [{"name": "RO-TwoChannelIR", "mod": "RP-1", "title": "IR03 - Two-Channel Infrared Radiometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Radiometer 3", "id": "RP0infraredRad3", "sci": 4, "group": "Experiments"}]}, "opt_uvSpectrometry": {"title": "Ultraviolet Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it.", "parts": [{"name": "RO-UVSpectrometer", "mod": "RP-1", "title": "IS02 - Ultraviolet Spectrometer"}], "upgrades": [], "grants": [], "experiments": [{"name": "Infrared Spectrometer 2", "id": "RP0imageSpec2", "sci": 3, "group": "Experiments"}]}, "opt_refinedTV": {"title": "Refined Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up.", "parts": [{"name": "RO-AdvancedImager", "mod": "RP-1", "title": "VI04 - Advanced Visible Imaging Device"}, {"name": "RO-ImprovedTVCamera", "mod": "RP-1", "title": "VI03 - Improved TV Camera"}], "upgrades": [], "grants": [], "experiments": [{"name": "Advanced Visible Imaging Device", "id": "RP0visibleImaging4", "sci": 6, "group": "Experiments"}, {"name": "Improved TV Camera", "id": "RP0visibleImaging3", "sci": 3, "group": "Experiments"}]}, "mic_boomMagnetometry": {"title": "Boom-Deployed Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there. The boom buys sensitivity, not new ground: Earth still answers with one number, and the crustal patchwork worth resolving is still sitting on the lunar surface.", "parts": [{"name": "RO-HeliumMagnet", "mod": "RP-1", "title": "MG02 - Helium Magnetometer Boom"}], "upgrades": [], "grants": [], "experiments": []}, "elec_deployableArrays": {"title": "Deployable Photovoltaic Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch.", "parts": [{"name": "1x3SPanels", "mod": "VenStockRevamp", "title": "OX-2L 1x3 Photovoltaic Panels"}, {"name": "solarPanels2", "mod": "Squad", "title": "XT2 Solar Panel Array Mk1"}, {"name": "solarPanels4", "mod": "Squad", "title": "XT1 Solar Panel Array Mk1"}, {"name": "solarPanels5", "mod": "Squad", "title": "ST1 Solar Panel"}], "upgrades": [], "grants": [], "experiments": []}, "gnc_basicAvionics": {"title": "Miniaturised Inertial Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised.", "parts": [], "upgrades": ["RFTech-ComSat-II", "RFTech-NavSat-II", "RP-1-PayloadTech-Axial"], "grants": ["Science-Core-basicAvionics"], "experiments": []}, "shd_basicAvionics": {"title": "Radiation-Shielded Avionics — Basic", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Wrap the same guidance stack in radiation shielding and a hardened chassis so it can outlast a passage through the Van Allen belts and beyond — heavier and pricier than the bare avionics it protects, but no longer confined to Earth's magnetosphere.", "parts": [], "upgrades": [], "grants": ["Deep-Space-basicAvionics"], "experiments": []}, "tel_minitrackInterferometry": {"title": "Phase-Comparison Satellite Tracking", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 3, "cost": 11, "anyToUnlock": false, "flavor": "A fence of ground aerials reading the same carrier tone and comparing its phase between them, fixing where the spacecraft crossed to a fraction of its own beamwidth. Fly enough passes and the orbit itself becomes the instrument: it refuses to close, and what it refuses by is the shape of the mass underneath.", "parts": [], "upgrades": [], "grants": [], "experiments": [{"name": "Orbital Perturbation", "id": "RP0orbitalPurturbation1", "sci": 200, "group": "Experiments"}]}, "tel_dopplerRanging": {"title": "Coherent Doppler Ranging", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon.", "parts": [], "upgrades": ["commsTL1"], "grants": ["RP0Level2TrackingStation"], "experiments": []}, "tel_pcmTelemetry": {"title": "Pulse-Code Modulation Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight.", "parts": [{"name": "antenna_cone_toggle", "mod": "CoatlAerospace", "title": "CA-A02 Helical Omnidirectional Antenna"}], "upgrades": ["commsTL2"], "grants": ["RP0Level3TrackingStation"], "experiments": [{"name": "Lunar Surface Television Broadcast", "id": "RP0LunarLandingTelevisionBroadcast", "sci": 80, "group": "Crew Science"}, {"name": "Space Television Broadcast", "id": "RP0TelevisionBroadcast", "sci": 80, "group": "Crew Science"}]}, "str_equipmentBays": {"title": "Enclosed Equipment Bays", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose.", "parts": [{"name": "ROC-GeminiEquipmentSectionBDB", "mod": "ROCapsules", "title": "Gemini Equipment Section"}, {"name": "ROC-LEMMESABDB", "mod": "ROCapsules", "title": "Apollo LM Material Experiment Stowage Assembly"}, {"name": "RO_ServiceBay_300", "mod": "Squad", "title": "Service Bay [3m]"}, {"name": "ServiceBay_250_v2", "mod": "Squad", "title": "Service Bay [4m]"}, {"name": "USRadialTanks", "mod": "UniversalStorage2", "title": "Universal Storage: Radial Tank"}, {"name": "restock-nosecone-1875-1", "mod": "ReStockPlus", "title": "Protective Rocket Nose Mk18"}], "upgrades": ["RFTech-SM-II"], "grants": [], "experiments": []}, "pc_akOxidiser": {"title": "Inhibited Nitric-Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Red fuming nitric acid dissolves the tank it is stored in; add a fraction of a percent of hydrofluoric acid and it lays down a fluoride film that stops the attack instead. The oxidiser that was only ever a laboratory problem becomes something a missile can sit fuelled with for years.", "parts": [], "upgrades": ["RFUpgrade_AJ10-118D", "RFUpgrade_RD-213-8D13", "RFUpgrade_RD-217-8D515", "RFUpgrade_XLR81-BA-7", "RFUpgrade_YF-1A"], "grants": [], "experiments": []}, "pc_ntoHypergolics": {"title": "Dinitrogen-Tetroxide Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it.", "parts": [], "upgrades": ["RFUpgrade_R-40A-NTO", "RFUpgrade_RD-214-8D59", "RFUpgrade_RD-214U-8D59U", "RFUpgrade_RD-250-8D518", "RFUpgrade_RD-250PM", "RFUpgrade_RD-252-8D724", "RFUpgrade_RD-855", "RFUpgrade_RD-856", "RFUpgrade_S5.2", "RFUpgrade_YF-1B", "RFUpgrade_YF-3A"], "grants": [], "experiments": []}, "pc_htpSustainer": {"title": "Multi-Chamber Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}], "upgrades": [], "grants": [], "experiments": []}, "pc_larchPeroxide": {"title": "Refined Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off.", "parts": [], "upgrades": ["RFUpgrade_Gamma-301", "RFUpgrade_Larch-2", "RFUpgrade_Larch-8"], "grants": [], "experiments": []}, "pc_fluorine": {"title": "Liquid-Fluorine Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": ["RFUpgrade_XLR81-LF2-SPS"], "grants": [], "experiments": []}, "pc_scoutSolids": {"title": "Staged Solid Boost", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it.", "parts": [{"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Altair", "mod": "ROEngines", "title": "Altair X-248"}, {"name": "ROE-Antares1", "mod": "ROEngines", "title": "Antares I X-254"}, {"name": "ROE-Antares1_Inline", "mod": "ROEngines", "title": "Antares I X-254"}], "upgrades": ["RFUpgrade_Castor-1-SL"], "grants": [], "experiments": []}, "pc_strapOnSolids": {"title": "Strap-On Thrust Augmentation", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta.", "parts": [{"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Castor1_Inline", "mod": "ROEngines", "title": "Castor 1"}], "upgrades": [], "grants": [], "experiments": []}, "pc_retroKick": {"title": "Vacuum-Start Solid Impulse", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail.", "parts": [{"name": "ROC-GeminiRetroMECBDB", "mod": "ROCapsules", "title": "Gemini Retro Rocket (Star-13E)"}, {"name": "ROC-MercuryPosigradeBDB", "mod": "ROCapsules", "title": "Mercury Posigrade Kick Motor"}, {"name": "ROC-MercuryRetroBDB", "mod": "ROCapsules", "title": "Mercury Retro (TE-M-316)"}, {"name": "ROC-VoskhodRetroBooster", "mod": "ROCapsules", "title": "Voskhod Retro Package"}, {"name": "ROE-Agena_Retro_TypeIII", "mod": "ROEngines", "title": "Agena Retrorocket Type III"}, {"name": "ROE-Agena_Spinrocket", "mod": "ROEngines", "title": "Agena 1KS30HA Spin Rocket"}], "upgrades": ["RFUpgrade_Castor-1-Vac"], "grants": [], "experiments": []}, "fd_regenCooling": {"title": "Regenerative Chamber Cooling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware.", "parts": [], "upgrades": ["RFUpgrade_LR105-NA-3", "RFUpgrade_LR79-NA-9", "RFUpgrade_LR87-AJ-3", "RFUpgrade_LR89-NA-5", "RFUpgrade_LR89-NA-6", "RFUpgrade_LR91-AJ-3", "RFUpgrade_RD-108-8D77", "RFUpgrade_RZ.2-Mk3", "RFUpgrade_S-3D", "RFUpgrade_Viking-4", "RFUpgrade_Viking-5", "RFUpgrade_XLR11-RM-13-8K"], "grants": [], "experiments": []}, "fd_vacuumExpansion": {"title": "Extended Vacuum Expansion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}], "upgrades": ["RFUpgrade_LR101-NA-11", "RFUpgrade_LR105-NA-5", "RFUpgrade_LR105-NA-6", "RFUpgrade_LR89-NA-7.1", "RFUpgrade_LR89-NA-7.2", "RFUpgrade_RD-0106", "RFUpgrade_RD-0109", "RFUpgrade_RD-119-8D710", "RFUpgrade_RD-225-8D721", "RFUpgrade_RL10A-3-1", "RFUpgrade_X-405H", "RFUpgrade_X-405H-2", "RFUpgrade_XLR11-RM-13-10K", "RFUpgrade_XLR81-BA-11", "RFUpgrade_YF-22B", "RFUpgrade_YF-23B"], "grants": [], "experiments": []}, "fd_restartableUpper": {"title": "Vacuum Turbopump Restart", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come.", "parts": [{"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": ["RFUpgrade_AJ10-101A", "RFUpgrade_AJ10-118", "RFUpgrade_AJ10-42"], "grants": [], "experiments": []}, "fd_blowdownRestart": {"title": "Blowdown Vacuum Restart", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "No pump to restart, so nothing to spin back up: hold the tanks under gas pressure and the engine relights as often as the valves will cycle. It buys the manoeuvring stage cheaply, and pays for it in tank walls heavy enough to hold that pressure all the way up.", "parts": [{"name": "LargeOMS", "mod": "VenStockRevamp", "title": "Astris"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}], "upgrades": [], "grants": [], "experiments": []}, "fd_spacecraftPropulsion": {"title": "Restartable Deep-Throttling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-C1", "mod": "ROEngines", "title": "C-1"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-RangerRetro", "mod": "ROEngines", "title": "MC-4-610"}], "upgrades": ["RFUpgrade_AJ10-142", "RFUpgrade_XLR81-BA-1"], "grants": [], "experiments": []}, "fd_storableSustainer": {"title": "Storable Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute.", "parts": [{"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Viking4", "mod": "ROEngines", "title": "Viking (4/4B)"}, {"name": "ROE-Viking5", "mod": "ROEngines", "title": "Viking (5/6)"}, {"name": "YF3_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-3 (no gimbal)"}, {"name": "YF3_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-3 with Boattail"}], "upgrades": ["RFUpgrade_U-2000", "RFUpgrade_XLR81-BA-3"], "grants": [], "experiments": []}, "fd_titanTandem": {"title": "Altitude-Start Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design.", "parts": [{"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}], "upgrades": [], "grants": [], "experiments": []}, "fd_longMarchStorable": {"title": "Storable Chamber Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice.", "parts": [{"name": "YF20_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20"}, {"name": "YF21_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-21"}, {"name": "YF22_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-22"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}, {"name": "YF25K_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-20 with Boattail (no gimbal)"}], "upgrades": [], "grants": [], "experiments": []}, "fd_longMarchBoattail": {"title": "Integrated Booster Boattail", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Wrap the clustered first stage in its aerodynamic boattail and it stops being a bare cluster of chambers and becomes a complete, flight-configured stage — the CZ-2, CZ-2C and CZ-2D as they actually stacked. Same four storable chambers as the clustered first stage it branches from; procedural structure builds the same fairing for nothing, so this is off-the-shelf convenience, not a new engine.", "parts": [{"name": "YF21_with_shell_CZ-2", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2 Boattail"}, {"name": "YF21_with_shell_CZ-2C", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2C Boattail"}, {"name": "YF21_with_shell_CZ-2D", "mod": "KerwisChineseAerospacePack", "title": "YF-21 with CZ-2D Boattail"}], "upgrades": [], "grants": [], "experiments": []}, "int_dongFangHong1": {"title": "China's First Satellite", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A third nation reaches orbit on its own hardware — a small sphere broadcasting a patriotic melody instead of a beeping tone, riding the same clustered-storable first stage into space.", "parts": [{"name": "DFH-1", "mod": "KerwisChineseAerospacePack", "title": "DongFangHong-1 Satelite"}], "upgrades": [], "grants": [], "experiments": []}, "fd_sovietStorable": {"title": "Storable Tandem Staging", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}], "upgrades": [], "grants": [], "experiments": []}, "fd_saturnKerolox": {"title": "High-Pressure Kerolox Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 115, "anyToUnlock": true, "flavor": "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-H1C", "mod": "ROEngines", "title": "H-1C Series"}, {"name": "ROE-H1D", "mod": "ROEngines", "title": "H-1D Series"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RS27", "mod": "ROEngines", "title": "H-1/RS-27"}], "upgrades": [], "grants": [], "experiments": []}, "met_cooledTurbine": {"title": "Air-Cooled Turbine Blades", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust.", "parts": [], "upgrades": ["RFUpgrade_AL-7F-1", "RFUpgrade_Atar09K-50", "RFUpgrade_Atar101E-3", "RFUpgrade_Avon200R", "RFUpgrade_J57-P-20A", "RFUpgrade_J75-P-19", "RFUpgrade_J79-GE-5C", "RFUpgrade_J85-GE-5", "RFUpgrade_R-15BD-300", "RFUpgrade_RB162-4D", "RFUpgrade_RD-9AF2-300", "RFUpgrade_RD-9BF-811", "RFUpgrade_WP-6A", "RFUpgrade_WP-6A-III", "RFUpgrade_WP-7"], "grants": [], "experiments": []}, "av_turboprop": {"title": "Geared Turboprop", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Gear the axial turbine down to swing a large propeller instead of blasting a jet — trading top speed for the fuel economy and heavy-lift pull a jet cannot match down low. The Tu-95's monstrous contra-rotating NK-12 and the workhorse PT6: turbine power delivered through a propeller.", "parts": [{"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "SXTPWPT6", "mod": "SXT", "title": "PT6A Turboprop"}], "upgrades": [], "grants": [], "experiments": []}, "av_hydrogenJet": {"title": "Hydrogen-Fuelled Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Feed the jet liquid hydrogen instead of kerosene — a fuel so energetic it promises altitude and range no kerosene burner can reach, at the price of a vacuum-jacketed fuel system feeding a red-hot engine. The Model 304 of the CL-400 Suntan spyplane: a gamble that flew on the coldest fuel there is, then stayed on the bench.", "parts": [{"name": "RO-model304", "mod": "Squad", "title": "Model 304 Turbojet"}], "upgrades": [], "grants": [], "experiments": []}, "av_highTempTurbojet": {"title": "High-Temperature Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "With a cooled turbine able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage.", "parts": [{"name": "RO-R11F", "mod": "Squad", "title": "R-11 Turbojet"}, {"name": "aje_atar", "mod": "Squad", "title": "Atar 09 Turbojet"}, {"name": "miniJetEngine", "mod": "Squad", "title": "J85 Turbojet (No Afterburner)"}], "upgrades": ["RFUpgrade_J79-GE-2A"], "grants": [], "experiments": []}, "av_ramjetAdvanced": {"title": "Refined Ramjet Compression", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion.", "parts": [{"name": "RO-RD012", "mod": "Squad", "title": "RD-012 Ramjet"}], "upgrades": ["RFUpgrade_MA20S-4", "RFUpgrade_RJ43-MA-11", "RFUpgrade_RJ43-MA-5"], "grants": [], "experiments": []}, "aero_variableIntake": {"title": "Variable-Geometry Intake", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable.", "parts": [{"name": "ramAirIntake", "mod": "Squad", "title": "Adjustable Ramp Intake"}], "upgrades": [], "grants": [], "experiments": []}, "str_heavyGear": {"title": "Large Aircraft Undercarriage", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating.", "parts": [{"name": "GearLarge", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear"}, {"name": "GearLargeSpaceplane", "mod": "Squad", "title": "LY-99 Extra Large Landing Gear (Spaceplane)"}, {"name": "GearMedium", "mod": "Squad", "title": "LY-60 Large Landing Gear"}, {"name": "GearMediumSpaceplane", "mod": "Squad", "title": "LY-60 Large Landing Gear (Spaceplane)"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_heatSinkTPS": {"title": "Heat-Sink Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "Survive the fireball by out-massing it. A machined beryllium block soaks the whole entry heat pulse into its own thermal mass and carries it back down still glowing — no chemistry, no char, just metal and patience. Crude and heavy, but the first thing that brings a payload home intact.", "parts": [{"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}], "upgrades": ["Heatsink"], "grants": [], "experiments": []}, "cmp_ablativeTPS": {"title": "Ablative Reentry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour instead of hoarding it. Less than half the weight of a metal heat sink, and the one thing between a returning capsule and cremation.", "parts": [{"name": "ROC-MercuryHS", "mod": "ROCapsules", "title": "Mercury Heatshield"}], "upgrades": ["MercuryHS"], "grants": [], "experiments": []}, "cmp_ablativeRefinement": {"title": "Advanced Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Halve the shield and fly it at an angle. The same ablator laid up thinner and denser takes the same peak heat over the longer, shallower entry you fly when you steer a capsule to a landing site instead of dropping it wherever the ballistics put it. Mercury's ablator becomes Gemini's.", "parts": [{"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}], "upgrades": ["GeminiHS"], "grants": [], "experiments": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", "title": "Life Support Config Engine"}, {"name": "kerbalism-lifesupportmodule", "mod": "KerbalismConfig", "title": "External ECLSS Module"}], "upgrades": [], "gr ts"}]}, "int_launchEscape": {"title": "Tractor Escape Rocket", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 58, "anyToUnlock": false, "flavor": "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused.", "parts": [{"name": "ROC-MercuryLESBDB", "mod": "ROCapsules", "title": "Mercury Launch Escape System"}, {"name": "RO_mk1_LES", "mod": "Squad", "title": "Launch Escape System (Mercury)"}], "upgrades": [], "grants": [], "experiments": []}, "int_mercuryCapsule": {"title": "Blunt-Body Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "RP0HumanRatedFlag", "mod": "Squad", "title": "Human Rated Flag"}], "upgrades": [], "grants": [], "experiments": [{"name": "Earth Photography", "id": "RP0EarthPhotography", "sci": 40, "group": "Crew Science"}, {"name": "Liquids in Microgravity", "id": "RP0LiquidsMicrogravity", "sci": 8, "group": "Crew Science"}, {"name": "Visual Tracking", "id": "RP0VisualTracking", "sci": 32, "group": "Crew Science"}]}, "int_vostokCapsule": {"title": "Spherical Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A perfect sphere, its mass offset so it finds its own heat-shielded attitude with no active control — crude, heavy, utterly reliable. Vostok brought the first human back from orbit, the cosmonaut ejecting to land under his own parachute while the ball thumped down nearby.", "parts": [{"name": "ROC-VostokCapsule", "mod": "ROCapsules", "title": "Vostok Descent Module"}, {"name": "mk1pod_v2", "mod": "Squad", "title": "Mk1 Pod (2m)"}], "upgrades": [], "grants": [], "experiments": []}, "int_zenitRecon": {"title": "Film-Return Reconnaissance Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Strip the cosmonaut out of the sphere and fill it with cameras — the same descent capsule flown unmanned, exposing long rolls of film over the target and dropping them home to be recovered. Vostok and Zenit are one airframe: one carries a man, the other carries the eyes.", "parts": [{"name": "ROC-ZenitCapsule", "mod": "ROCapsules", "title": "Zenit Descent Module (Improved Film Camera)"}], "upgrades": [], "grants": [], "experiments": []}, "edl_crewedRecovery": {"title": "Crewed Descent Recovery", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Bring a crewed capsule down soft enough to survive: a heavy main canopy that will not tear at the loads a manned mass demands, a drogue to hold it straight and slow it first, and airbags or crushable legs to soften the final thump. The last minutes of every flight, where recovery is the whole point.", "parts": [{"name": "ROC-ApolloDrogueParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Drogue Parachute Pack"}, {"name": "ROC-ApolloParachuteBDB", "mod": "ROCapsules", "title": "Apollo Command Module Main Parachute Pack"}, {"name": "ROC-BigGeminiParachute", "mod": "ROCapsules", "title": "Big G Landing Parachute System"}, {"name": "ROC-BigGeminiParachuteDrogue", "mod": "ROCapsules", "title": "Big G Drogue Parachute"}, {"name": "ROC-CSTParachute", "mod": "ROCapsules", "title": "CST-100 Parachute Pack"}, {"name": "ROC-D2Parachute", "mod": "ROCapsules", "title": "D-2 Parachute"}, {"name": "ROC-GeminiParachuteBDB", "mod": "ROCapsules", "title": "Gemini Landing Parachute System"}, {"name": "ROC-GeminiParachuteDrogueBDB", "mod": "ROCapsules", "title": "Gemini Drogue Parachute"}, {"name": "ROC-MercuryParachuteBDB", "mod": "ROCapsules", "title": "Mercury M-ASD Main Parachute"}, {"name": "ROC-OrionParachute", "mod": "ROCapsules", "title": "Orion Main Parachute"}, {"name": "ROC-VostokParachute", "mod": "ROCapsules", "title": "Vostok/Voskhod Parachute"}, {"name": "aquarius_drogue_parachute_s0_1", "mod": "Tantares", "title": "LK-700 Capsule Drogue Parachute"}, {"name": "aquarius_parachute_s0p5_1", "mod": "Tantares", "title": "LK-700 Capsule Parachute"}], "upgrades": [], "grants": [], "experiments": []}, "int_crewedRetroPack": {"title": "Crewed Retro-Deorbit Pack", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "A cluster of solid retro-rockets carried behind a crewed capsule and fired against the flight path to drop it out of orbit on time and on target — Mercury's retropack, Gemini's retrograde section, the Voskhod and Gemini-B modules with their own reentry attitude control. The deliberate deorbit burn a returning crew's life turns on, thrown away with its adapter once the one job is done.", "parts": [{"name": "ROC-GeminiBEquipmentSection", "mod": "ROCapsules", "title": "Gemini B Adapter Module"}, {"name": "ROC-GeminiBRetrogradeSection", "mod": "ROCapsules", "title": "Gemini B Retro Module"}, {"name": "ROC-GeminiRetrogradeSectionBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section"}, {"name": "ROC-MercuryRetropackBDB", "mod": "ROCapsules", "title": "Mercury Retropack"}, {"name": "ROC-ReentryControlSystemBDB", "mod": "ROCapsules", "title": "Gemini Re-entry Control System"}, {"name": "ROC-RetrogradeDecouplerBDB", "mod": "ROCapsules", "title": "Gemini Retrograde Section Decoupler"}, {"name": "ROC-VoskhodRetroDecoupler", "mod": "ROCapsules", "title": "Voskhod Retro Decoupler"}], "upgrades": [], "grants": [], "experiments": []}, "opt_orbitalMapping": {"title": "Synoptic Orbital Scanning", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 115, "anyToUnlock": false, "flavor": "Sweep a body strip by strip as the orbit carries the scanner across it, assembling a complete map from thousands of passes — terrain, altimetry and anomaly built from coverage no single frame could give. The first instrument that maps a world instead of photographing a scene. The seed of the mapping lane that fills out among the planets.", "parts": [{"name": "SCANsat_Tracker", "mod": "SCANsat", "title": "SCAN MapTraq®"}, {"name": "SurveyScanner", "mod": "Squad", "title": "M700 Survey Scanner"}], "upgrades": [], "grants": [], "experiments": [{"name": "Synoptic Terrain Photography", "id": "RP0TerrainPhotography", "sci": 90, "group": "Crew Science"}, {"name": "Synoptic Weather Photography", "id": "RP0WeatherPhotography", "sci": 90, "group": "Crew Science"}]}, "fd_clusteredThrustGrowth": {"title": "Clustered-Chamber Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Squeeze more thrust from the same four-chamber cluster without touching the chemistry — the storable engines already flying, simply pushed harder.", "parts": [], "upgrades": ["RFUpgrade_Larch-4", "RFUpgrade_X-405H-3", "RFUpgrade_YF-20B", "RFUpgrade_YF-20C", "RFUpgrade_YF-22E", "RFUpgrade_YF-25K"], "grants": [], "experiments": []}, "fd_blendedStorableFuel": {"title": "Blended Storable Fuel", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Cut the UDMH with hydrazine and the same engine burns denser — real thrust for free, Isp along for the ride either way. Viking's own uprate, not a new engine.", "parts": [], "upgrades": ["RFUpgrade_Viking-4B", "RFUpgrade_Viking-4C", "RFUpgrade_Viking-5B"], "grants": [], "experiments": []}, "fd_ammoniaCombustionRefinement": {"title": "Stabilized Ammonia Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Retune the X-15's ammonia-lox chamber for a cleaner burn at higher pressure, wringing a real jump in specific impulse from the same volatile propellant. The rocket-plane's engine, refined rather than replaced.", "parts": [], "upgrades": ["RFUpgrade_XLR99-RM-3"], "grants": [], "experiments": []}, "fd_titanStorableConversion": {"title": "Storable-Propellant Booster Conversion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Trade kerosene for a hypergolic that ignites on contact and sits fuelled in a silo for years — some engines keep the old chemistry and simply grow, others convert outright. A missile built to launch now, not after a fuelling countdown.", "parts": [], "upgrades": ["RFUpgrade_LR87-AJ-5", "RFUpgrade_LR87-AJ-7", "RFUpgrade_LR87-AJ-9", "RFUpgrade_LR91-AJ-5", "RFUpgrade_LR91-AJ-7", "RFUpgrade_LR91-AJ-9"], "grants": [], "experiments": []}, "pc_hdaOxidiser": {"title": "High-Density Acid Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Push more nitrogen dioxide into the nitric acid than it comfortably holds. The oxidiser gets denser, so the same tank carries more of it, and the inhibitor that stops it dissolving the tank has to work harder for it. A better propellant bought entirely in materials-compatibility problems.", "parts": [], "upgrades": ["RFUpgrade_Model8096-HDA"], "grants": [], "experiments": []}, "pc_mmh": {"title": "Monomethylhydrazine Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "One methyl group away from the hydrazine that came before it, and worth the detour: it stays liquid over a far wider band, resists shock decomposition, and does not freeze in a spacecraft's plumbing on the cold side of a long coast. The fuel that made storable engines something you could still trust after two years in orbit.", "parts": [], "upgrades": ["RFUpgrade_Model8096L"], "grants": [], "experiments": []}, "pc_mon": {"title": "Nitric-Oxide-Doped Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 720, "anyToUnlock": false, "flavor": "Dissolve nitric oxide back into the dinitrogen tetroxide until the mixture stops freezing at temperatures a spacecraft will actually see. A few percent of a gas nobody wants, and the oxidiser survives the shadow side of the orbit without a heater on every line.", "parts": [], "upgrades": ["RFUpgrade_LEROS-2b", "RFUpgrade_Model8096B", "RFUpgrade_R-4D-15DM"], "grants": [], "experiments": []}, "fd_longLifeStorableUpper": {"title": "Long-Life Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "The last iteration of a stage that has flown for forty years: the same pressure-fed storable engine, qualified now for coast times measured in days and restart counts nobody would have promised in the first decade. Nothing about it is new; everything about it is proven.", "parts": [], "upgrades": ["RFUpgrade_AestusMod", "RFUpgrade_Agena-2000"], "grants": [], "experiments": []}, "pc_juno_ClF3": {"title": "Chlorine-Trifluoride Oxidiser", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 7, "cost": 216, "anyToUnlock": false, "flavor": "Burn hydrazine in chlorine trifluoride, a storable oxidiser so aggressive it ignites on contact with almost anything — glass, sand, the operators. A sliver more Isp for a propellant few would trust near a launch pad.", "parts": [], "upgrades": ["RFUpgrade_Juno45k-BII", "RFUpgrade_Juno6k-BII"], "grants": [], "experiments": []}, "pc_pioneerVernierTrim": {"title": "Solid Vernier Trim Motor", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 4, "cost": 29, "anyToUnlock": false, "flavor": "A small solid motor that nudges a spinning spacecraft's trajectory without ever touching the main stage — a trim burn with no throttle and no restart, just a single precise kick. The adjustment motor riding along on Pioneer's booster.", "parts": [{"name": "PioneerVernier", "mod": "ROEngines", "title": "Pioneer Adjustment Motor"}], "upgrades": ["RFUpgrade_JPL-532A"], "grants": [], "experiments": []}, "fd_gasGeneratorCeiling": {"title": "Gas-Generator Thrust Ceiling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Push the simple gas-generator cycle as far as it goes — bigger turbopumps, higher flow, more thrust from the same open-cycle plumbing. The last uprate before the cycle itself runs out of room to grow.", "parts": [{"name": "ROE-F1", "mod": "ROEngines", "title": "F-1"}], "upgrades": ["RFUpgrade_E-1-468k", "RFUpgrade_E-1-Upgrade", "RFUpgrade_H-1-188K", "RFUpgrade_LR105-NA-7.1", "RFUpgrade_LR105-NA-7.2", "RFUpgrade_LR79-NA-13", "RFUpgrade_LR87-AJ-11", "RFUpgrade_LR91-AJ-11", "RFUpgrade_RD-111-8D716A", "RFUpgrade_X-405H-4", "RFUpgrade_XLR99-RM-5"], "grants": [], "experiments": []}, "pc_orscDebut": {"title": "Oxidiser-Rich Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Burn the turbine's exhaust back into the main chamber instead of dumping it overboard — every drop of propellant makes thrust, not waste heat. The first staged-combustion engine in the fleet, and a real jump in specific impulse for it.", "parts": [{"name": "ROE-NK9", "mod": "ROEngines", "title": "NK-9"}, {"name": "ROE-NK9V", "mod": "ROEngines", "title": "NK-9V/21/19/39/31"}, {"name": "ROE-RD58", "mod": "ROEngines", "title": "S1.5400/RD-58 Series"}], "upgrades": [], "grants": [], "experiments": []}, "int_geminiCapsule": {"title": "Powered Orbit rn Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Qualify the expander for the long haul: a chamber and turbine that survive nine minutes of firing instead of five, and a nozzle re-cut for the vacuum it will actually spend that time in. The upper stage stops being a kick motor and becomes something you can coast on, restart, and trust with the whole mission.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3A"], "grants": [], "experiments": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 324, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed — trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_AJ10-133-LH", "RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": [], "experiments": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 504, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster — a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-J2X", "mod": "ROEngines", "title": "J-2X"}, {"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2
