<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

fd_turbopumpFeed": {"title": "Turbopump Feed", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Drive the propellants with a turbine-spun pump instead of tank pressure: the tank no longer has to be a heavy pressure vessel, and the chamber can run far harder than any pressure-fed sounding motor reaches. This is the real step from a powder dart to the turbopump-fed V-2 — a large liquid rocket at last. (Its chamber was film-cooled; regenerative cooling you already fly on the ORM-65.)", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": []}, "fd_multiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Combustion instability tears a single large chamber apart in milliseconds. The Soviet answer was to not build one: four smaller chambers per engine, each below the acoustic threshold, fed by a common turbopump. The R-7 that launched Sputnik — and the R-9's RD-111, the same four-chamber layout in one engine.", "parts": [{"name": "ROE-E1", "mod": "ROEngines", "title": "E-1"}, {"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}, {"name": "ROE-RD111", "mod": "ROEngines", "title": "RD-111"}, {"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "ROE-S155", "mod": "ROEngines", "title": "S-155"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": []}, "fd_baffledInjector": {"title": "Single Large-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Don't split the chamber — scale a single large one and tame its combustion by hand. At this size careful injector design holds; the truly enormous chambers (the F-1) would later need injector-face baffles and tuned cavities to survive. Harder than many small chambers, but it scales, and it isn't a Western monopoly: the LR89/LR79/LR87/LR91 boosters (Atlas, Thor, Titan), Britain's licensed RZ, Vanguard's X-405 family.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}, {"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR87", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR87_11", "mod": "ROEngines", "title": "LR87 Booster (Shielded)"}, {"name": "ROE-LR87_Single", "mod": "ROEngines", "title": "LR87"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-LR91", "mod": "ROEngines", "title": "LR91"}, {"name": "ROE-LR91-4V", "mod": "ROEngines", "title": "LR91 (4 Vernier)"}, {"name": "ROE-RZ", "mod": "ROEngines", "title": "RZ.1/RZ.2"}, {"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}, {"name": "ROE-X405H", "mod": "ROEngines", "title": "X-405H"}], "upgrades": []}, "fd_verniers": {"title": "Vernier Trim Chambers", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Small, gimballed trim chambers that steer and roll the stack while the main engines just push — the Atlas and Jupiter vernier motors, co-developed with the big engines they trim. The fine hand on a heavy rocket.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}, {"name": "YF23_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-23"}], "upgrades": []}, "pc_hypergolics": {"title": "Amine-Nitrate Hypergolics", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, indefinite restarts, storable for years. Pure chemistry: a simple ablative engine that needs neither cooling jacket nor ignition system. The propulsion of upper stages and spacecraft.", "parts": [{"name": "ROE-AJ10Early", "mod": "ROEngines", "title": "AJ10 Series (Early)"}, {"name": "ROE-AJ10Mid", "mod": "ROEngines", "title": "AJ10 Series (Mid)"}, {"name": "ROE-Juno45K", "mod": "ROEngines", "title": "Juno IVB JPL 45K Engine"}, {"name": "ROE-Juno6K", "mod": "ROEngines", "title": "Juno IV 6k Engine"}, {"name": "ROE-RD200", "mod": "ROEngines", "title": "RD-200"}], "upgrades": []}, "pc_fluorineOxidizer": {"title": "Liquid Fluorine Oxidizer Chemistry", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "The most reactive element there is, chilled to a liquid and burned with hydrazine for storable-propellant performance nothing else touches — tested on stands, never flown operationally, because everything downstream of the tank tends to ignite or dissolve on contact. NOMAD's engine, a real dead end kept in the tree for the story it tells.", "parts": [{"name": "ROE-G1", "mod": "ROEngines", "title": "G-1"}], "upgrades": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen — vacuum-jacketed tanks, multilayer insulation, boil-off you fight every hour on the pad — for the highest specific impulse chemistry there is, years ahead of history. It just costs more program to get there.", "parts": [], "upgrades": []}, "fd_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, thrust-limited by heat pickup. The RL-10, and the highest specific impulse a chemical engine reaches.", "parts": [{"name": "ROE-LR87_LH2", "mod": "ROEngines", "title": "AJ23-65"}, {"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}, {"name": "ROE-RZ20", "mod": "ROEngines", "title": "RZ.20"}], "upgrades": []}, "fd_orbitalThrust": {"title": "Orbital-Class Thrust", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "Enough thrust, stable enough, to burn all the way to orbital velocity — reached by whichever engine you chose to perfect: Soviet multi-chamber, Western baffled injector, or a hydrolox upper stage. The rocket equation doesn't care how you got here.", "parts": [], "upgrades": []}, "pc_solidGrains": {"title": "Ammonium-Perchlorate Composite Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser bound in a rubbery binder, cast and cured into a structural grain with an integral nozzle — cheap, dense, storable. You light it once and it does not stop.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", "mod": "ROEngines", "title": "Alcyone 1 BE-3"}, {"name": "ROE-Algol1", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol1_Inline", "mod": "ROEngines", "title": "Algol IB"}, {"name": "ROE-Algol2", "mod": "ROEngines", ly could not be allowed to fail.", "parts": [{"name": "RO-KTDU5A", "mod": "Squad", "title": "KTDU-5A"}, {"name": "ROE-AJ10-137", "mod": "ROEngines", "title": "AJ10-137 (Service Propulsion System)"}, {"name": "ROE-AJ10Adv", "mod": "ROEngines", "title": "AJ10 Series (Advanced Short Nozzle)"}, {"name": "ROE-KTDU35", "mod": "ROEngines", "title": "KTDU-35"}, {"name": "ROE-S523", "mod": "ROEngines", "title": "S5.23"}], "upgrades": []}, "fd_deepThrottle": {"title": "Deep-Throttle Terminal Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Hold stable combustion from full thrust down to a tenth of it and back, closed-loop, against a falling vehicle and a rising surface — the throttleable engine that flies a controlled hover to a soft touchdown. Surveyor's vernier trio, feeling for the Moon in the last hundred metres.", "parts": [{"name": "ROE-TD339", "mod": "ROEngines", "title": "TD-339"}], "upgrades": []}, "fd_propellantSettling": {"title": "Zero-G Propellant Settling", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "In freefall the propellant floats off the outlet and an engine restart swallows gas and dies. Fire a small settling motor to nudge the stack forward and the liquid falls back onto the pumps — the unglamorous trick that turns a single burn into a parking orbit, a coast, and a second light toward another world.", "parts": [{"name": "ROE-TX280", "mod": "ROEngines", "title": "S-IV TX-280 Ullage Motor"}], "upgrades": []}, "str_segmentedSolids": {"title": "Segmented Solid-Motor Cases", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Cast a solid grain too large to ship in one piece, then bolt the segments together with joints that must seal a thousand-tonne pressure with no path to the outside. The case, not the chemistry, is the breakthrough — the Titan III strap-ons and the monstrous AJ-260, the largest solid motor ever fired.", "parts": [{"name": "ROE-AJ260SLA", "mod": "ROEngines", "title": "AJ-260 SL Radial Solid Rocket Booster"}, {"name": "ROE-AJ260SLF", "mod": "ROEngines", "title": "AJ-260 SL"}, {"name": "ROE-SR19", "mod": "ROEngines", "title": "SR19"}, {"name": "ROE-SR73", "mod": "ROEngines", "title": "SR73"}, {"name": "ROE-UA1204", "mod": "ROEngines", "title": "UA1204"}, {"name": "ROE-UA1205", "mod": "ROEngines", "title": "UA1205"}], "upgrades": []}, "elec_fuelCell": {"title": "Alkaline Fuel Cells", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "React hydrogen and oxygen across a potassium-hydroxide electrolyte and draw kilowatts straight from the reaction, with drinkable water as the only exhaust — power for a crewed craft that needs more than batteries and cannot wait on the sun. Gemini and Apollo ran on them.", "parts": [{"name": "FuelCell", "mod": "Squad", "title": "Fuel Cell"}, {"name": "FuelCellArray", "mod": "Squad", "title": "Fuel Cell Array"}, {"name": "USFuelCellMedium", "mod": "UniversalStorage2", "title": "Universal Storage: 1500W Fuel Cell"}, {"name": "USFuelCellSmal", "mod": "UniversalStorage2", "title": "Universal Storage: 1000W Fuel Cell"}, {"name": "kerbalism-fuelcell", "mod": "KerbalismConfig", "title": "External Fuel Cell"}], "upgrades": []}, "elec_deployableArray": {"title": "Deployable Articulated Solar Arrays", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Fold the cells flat for launch, spring them out on orbit and hinge them to face the sun as the craft turns — hundreds of watts from a wing that stows in a fairing. The step from a satellite skinned in cells to a probe that spreads its arrays and cruises to another planet.", "parts": [{"name": "1x3SPanels", "mod": "VenStockRevamp", "title": "OX-2L 1x3 Photovoltaic Panels"}, {"name": "ROS-FoldingSolarPanel", "mod": rvo M-06"}, {"name": "rotoServo_02", "mod": "SquadExpansion", "title": "Rotation Servo F-12"}, {"name": "rotoServo_03", "mod": "SquadExpansion", "title": "Rotation Servo M-12"}, {"name": "rotoServo_04", "mod": "SquadExpansion", "title": "Rotation Servo M-25"}, {"name": "rotor_02", "mod": "SquadExpansion", "title": "EM-32 Standard Rotor"}, {"name": "rotor_02s", "mod": "SquadExpansion", "title": "EM-32S Standard Rotor"}, {"name": "rotor_03", "mod": "SquadExpansion", "title": "EM-64 Heavy Rotor"}, {"name": "rotor_03s", "mod": "SquadExpansion", "title": "EM-64S Heavy Rotor"}], "upgrades": []}, "rob_roverWheels": {"title": "Powered Rover Wheels", "discipline": "Robotics", "color": "#d98c2b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Independently driven wheels with their own motors and suspension, carrying a machine across a surface no one has driven on — traction, steering and survival on regolith. The lineage of every rover from Lunokhod onward.", "parts": [{"name": "KF-WheelSmall", "mod": "KerbalFoundries", "title": "KF Small Rover Wheel"}, {"name": "KF-WheelTiny", "mod": "KerbalFoundries", "title": "KF  Tiny Rover Wheel"}, {"name": "roverWheel1", "mod": "Squad", "title": "RoveMax Model M1"}, {"name": "roverWheel2", "mod": "Squad", "title": "RoveMax Model S2"}], "upgrades": []}, "rob_surfaceSampler": {"title": "Robotic Surface Sampling", "discipline": "Robotics", "color": "#d98c2b", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Reach out a jointed arm, scrape, scoop or press the surface, and read back what a world is made of and how it bears a load — the first hands on another body. Surveyor's scoop dug the trench that proved the Moon would hold a lander's weight.", "parts": [{"name": "RO-SurfaceSampleScoop", "mod": "RP-1", "title": "Soil Mechanics Surface Sampler"}], "upgrades": []}, "cmp_ablativeHeatshield": {"title": "Ablative Reentry Heatshields", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Line the windward face with a char-forming resin that carries heat away by burning itself off, slowly and on purpose — the shield that survives an entry too hot for any passive coating. The Apollo AVCOAT that brought a crew home from the Moon at eleven kilometres a second.", "parts": [{"name": "ROC-ApolloHSBDB", "mod": "ROCapsules", "title": "Apollo Command Module Heatshield"}, {"name": "ROC-GeminiHSBDB", "mod": "ROCapsules", "title": "Gemini Heatshield"}, {"name": "ROC-GeminiHSLunarBDB", "mod": "ROCapsules", "title": "Gemini Lunar Heatshield"}], "upgrades": []}, "opt_irRadiometry": {"title": "Infrared Radiometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Measure the heat a surface or atmosphere radiates rather than the light it reflects, and read temperature from across space — the sense that works on the night side and sees through the visible haze. Mariner 2 swept its radiometers across Venus and found a surface far too hot for oceans.", "parts": [{"name": "RO-HRIRRadiometer", "mod": "RP-1", "title": "IR02 - High-Resolution Infrared Radiometer"}, {"name": "RO-IRRadiometer", "mod": "RP-1", "title": "IR01 - Infrared Radiometer"}], "upgrades": []}, "opt_spectrometry": {"title": "Infrared Interferometer Spectrometry", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 6, "cost": 2000, "anyToUnlock": false, "flavor": "Split the incoming light into its full spectrum and read the absorption lines of the gases and minerals that imprinted it — composition itself, measured from orbit. The interferometer-spectrometer that identifies what a world is made of without ever touching it.", "parts": [{"name": "RO-IRIS", "mod": "RP-1", "title": "IS01 - Infrared Interferometer Spectrometer (IRIS)"}], "upgrades": []}, "int_deepSpaceProbe": {"title": "Interplanetary Cruise Bus", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A spacecraft that closes the link across the void and keeps itself powered and pointed for the months it takes to reach another planet — the emissary bus every flyby and orbiter is built on. Everything else it carries is payload; these two are what make it interplanetary. (The US/Soviet probe packs fly their named craft from the charter labs on top of this.)", "parts": [{"name": "ca_argo-mk2", "mod": "CoatlAerospace", "title": "Mariner Mars \u0026 Venus Spacecraft Bus"}], "upgrades": []}, "int_roboticLander": {"title": "Robotic Soft-Lander", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 2300, "anyToUnlock": true, "flavor": "Arrive at a surface slow enough to survive it — either fly a controlled hover down on a throttled engine and settle onto legs, or brake hard and let a crushable shell or airbag take the blow. Two roads to the same first footprint: Surveyor rode its verniers down, Luna 9 bounced. (The named landers fly from the charter labs; this is the capability they need.)", "parts": [{"name": "ca_landv_core", "mod": "CoatlAerospace", "title": "Surveyor Lander Core"}, {"name": "ca_landv_orbiter_core", "mod": "CoatlAerospace", "title": "Surveyor Orbiter Core"}], "upgrades": []}, "xplaneStart": {"title": "Three-Axis Aerodynamic Control", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "A cambered wing makes lift; the real breakthrough was making it OBEY — roll, pitch and yaw commanded together. Hang a piston and a propeller on it and you have controlled, powered flight.", "parts": [{"name": "625mBonny", "mod": "SXT", "title": "Bonanza Cabin"}, {"name": "CanardController", "mod": "Squad", "title": "Standard Canard"}, {"name": "CircularIntake", "mod": "Squad", "title": "Pitot Intake"}, {"name": "GearFixed", "mod": "Squad", "title": "LY-01 Fixed Landing Gear"}, {"name": "GearFree", "mod": "Squad", "title": "LY-05 Steerable Landing Gear"}, {"name": "GearS Squad", "title": "RD-9 Turbojet"}, {"name": "RO-Sapphire203", "mod": "Squad", "title": "Sapphire Turbojet"}, {"name": "SXTRadialAirIntakeShockCone", "mod": "SXT", "title": "XF-104 Radial Shock Cone Intake"}, {"name": "aje_avon", "mod": "Squad", "title": "Avon Turbojet"}, {"name": "aje_j57", "mod": "Squad", "title": "J57 Turbojet"}], "upgrades": []}, "aero_shockInlets": {"title": "Oblique-Shock Inlets", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Decelerate intake air through a controlled train of oblique shocks so the compressor keeps breathing past Mach 2 — sustained supersonic cruise, not just a dash.", "parts": [{"name": "RO-B9ProcWing-Supersonic", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Supersonic)"}, {"name": "RO-shockConeIntake125", "mod": "Squad", "title": "1.25m Shock Cone Intake"}, {"name": "RO-shockConeIntakeBomarc", "mod": "Squad", "title": "0.70m Shock Cone Intake"}, {"name": "RO-shockConeIntakeMig", "mod": "Squad", "title": "0.86m Shock Cone Intake"}, {"name": "shockConeIntake", "mod": "Squad", "title": "Shock Cone Intake"}], "upgrades": []}, "aero_afterburner": {"title": "Afterburning Turbojets", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 4, "cost": 900, "anyToUnlock": false, "flavor": "Inject and burn fuel in the exhaust downstream of the turbine for a burst of extra thrust — reheat for the transonic dash and climb, flown years before any sustained-Mach-2 inlet existed.", "parts": [{"name": "RO-AL7F", "mod": "Squad", "title": "AL-7 Turbojet"}, {"name": "RO-Atar101D", "mod": "SXT", "title": "Atar 101 Turbojet"}, {"name": "aje_j75", "mod": "Squad", "title": "J75 Turbojet"}, {"name": "aje_j79", "mod": "Squad", "title": "J79 Turbojet"}], "upgrades": []}, "aero_ramjet": {"title": "Ram Compression", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "Above Mach 2 the inlet does all the compressing and you can discard the turbine entirely — a ramjet, or a turbo-ramjet that hands off between the two.", "parts": [{"name": "RO-Nord1500", "mod": "Squad", "title": "Nord 1500/Atar Combined Cycle Ramjet"}, {"name": "RO-RJ43", "mod": "Squad", "title": "RJ43 Ramjet"}, {"name": "RO-RJ47", "mod": "Squad", "title": "RJ47 Ramjet"}, {"name": "RO-RJ55", "mod": "Squad", "title": "RJ55/J67 Combined Cycle Ramjet"}], "upgrades": []}, "aero_rocketplane": {"title": "Rocket-Boosted Airframes", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Hang a throttleable rocket engine in a clean airframe, drop it from altitude and ride a ballistic arc to the edge of the atmosphere. The X-1 broke the sound barrier; the X-15 touched space and came home on a runway. Where the aircraft and rocket lines first meet.", "parts": [{"name": "MK1Cargobay", "mod": "VenStockRevamp", "title": "1.25m Cargo Bay"}, {"name": "Mark1Cockpit", "mod": "Squad", "title": "X-15 Cockpit"}, {"name": "Mark2Cockpit", "mod": "Squad", "title": "X-15 Inline Cockpit"}, {"name": "ROE-XLR10", "mod": "ROEngines", "title": "XLR10"}, {"name": "ROE-XLR11", "mod": "ROEngines", "title": "XLR11"}, {"name": "ROE-XLR25", "mod": "ROEngines", "title": "XLR25"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}, {"name": "SXTSmallFuselage", "mod": "SXT", "title": "0.625m Fuselage (Pressurized)"}, {"name": "vernierEngine", "mod": "Squad", "title": "Attitude Jet, Conformal (275/445 N class)"}], "upgrades": []}, "life_openLoopECLSS": {"title": "Open-Loop Life Support", "discipline": "Life Support", "color": "#f0508a", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Bleed stored oxygen, scrub CO2 with lithium hydroxide, pack water and food for the mission's exact duration — the minimum a human needs to survive a sealed can for a day. First use of the Life Support lane.", "parts": [{"name": "RO-LifeSupport-DummyEngine", "mod": "Squad", "title": "Life Support Config Engine"}], "upgrades": []}, "cmp_ablativeTPS": {"title": "Ballistic Ablative Reentry", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Proved uncrewed first: a spinning film-return capsule with a phenolic char heatshield, snagged out of the air off a coastline, years before it ever carried a person. First use of the Composite Materials lane.", "parts": [{"name": "ROH-AdjustableHS", "mod": "ROHeatshields", "title": "Adjustable Heatshield"}, {"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-SampleReturnCommand", "mod": "RP-1", "title": "Sample Return Command Module (DEPRECATED)"}], "upgrades": []}, "int_crewedCapsule": {"title": "Crewed Reentry Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 1500, "anyToUnlock": false, "flavor": "The irreducible list to fly a person to orbit and bring them home alive: an orbit-capable booster, attitude control to keep the heatshield forward, the heatshield itself, a way to decelerate, and air to breathe. Nothing else is physics — everything else is a practical-path nicety, kept off the gate.", "parts": [{"name": "ROC-MercuryAirbrakeBDB", "mod": "ROCapsules", "title": "Mercury M-ASF Destabilizing Flap"}, {"name": "ROC-MercuryCMBDB", "mod": "ROCapsules", "title": "Mercury Capsule"}, {"name": "ROC-MercuryNoseCapBDB", "mod": "ROCapsules", "title": "Mercury M-DCAM Nose Unit"}, {"name": "ROC-VostokCapsule", "mod": "ROCapsules", "title": "Vostok Descent Module"}, {"name": "ROC-VostokService", "mod": "ROCapsules", "title": "Vostok/Voskhod/Zenit Service Module"}, {"name": "ROC-ZenitCapsule", "mod": "ROCapsules", "title": "Zenit Descent Module (Improved Film Camera)"}, {"name": "RP0HumanRatedFlag", "mod": "Squad", "title": "Human Rated Flag"}, {"name": "landerCabinSmall", "mod": "Squad", "title": "Mk1 Lander Can"}, {"name": "mk1pod_v2", "mod": "Squad", "title": "Mk1 Pod (2m) ritish rocketry's signature chemistry (Black Knight, Blue Streak's Gamma engines), and a genuinely different oxidiser path from kerolox or storable hypergolics.", "parts": [{"name": "ROE-Gamma2", "mod": "ROEngines", "title": "Gamma 2"}, {"name": "ROE-Gamma8", "mod": "ROEngines", "title": "Gamma 8"}, {"name": "ROE-S2253", "mod": "ROEngines", "title": "S2.253/S3.42/S5.2"}], "upgrades": []}, "fd_restartableHypergolics": {"title": "Restart-in-Vacuum Hypergolic Ignition", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Reignite in vacuum on command, not just once at launch — the Agena upper stage, the platform that became Corona's bus and Gemini's docking target, and the small satellite-attitude engines the same restart trick spawned at a smaller scale.", "parts": [{"name": "RO-KDU414", "mod": "Squad", "title": "S5.19"}, {"name": "ROE-Agena", "mod": "ROEngines", "title": "XLR81 (Agena) Vacuum Engine"}, {"name": "ROE-AgenaSPS", "mod": "ROEngines", "title": "Agena-D Secondary Propulsion System"}, {"name": "ROE-Agena_EquipmentRack", "mod": "ROEngines", "title": "Agena Equipment Rack"}], "upgrades": []}, "pc_storableBoosters": {"title": "Storable-Propellant Orbital-Class Boosters", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Corrosive, toxic storables scaled from a small hypergolic trim engine up to full first-stage thrust — the Yangel-bureau approach of repurposing an ICBM's always-ready propellants for a space launcher.", "parts": [{"name": "ROE-RD215", "mod": "ROEngines", "title": "RD-216 (2x RD-215)"}, {"name": "ROE-RD215_Single", "mod": "ROEngines", "title": "RD-215"}, {"name": "ROE-RD219", "mod": "ROEngines", "title": "RD-219"}, {"name": "ROE-RD855", "mod": "ROEngines", "title": "RD-851/855"}, {"name": "ROE-RD856", "mod": "ROEngines", "title": "RD-852/856"}, {"name": "ROE-Viking2", "mod": "ROEngines", "title": "Viking 2"}, {"name": "ROE-Vi const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
