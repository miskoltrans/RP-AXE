pollo stack for a mission measured in months instead of weeks - a bigger service module, a mission module bolted on for the extra volume a Skylab-length stay demands, and a high-gain antenna that can still find Earth from wherever the longer mission sends it. The same capsule, built to not come home so soon.", "parts": [{"name": "ROC-ApolloCMBDBBlockIII", "mod": "ROCapsules", "title": "Apollo Block III+ Command Module (CM)"}, {"name": "ROC-ApolloHGABlockIII", "mod": "ROCapsules", "title": "Apollo Block III High Gain Antenna"}, {"name": "ROC-ApolloMissionModule", "mod": "ROCapsules", "title": "Apollo Block III+ Mission Module"}, {"name": "ROC-ApolloMissionModule4", "mod": "ROCapsules", "title": "Apollo Block IV Mission Module"}, {"name": "ROC-ApolloSMBlockIII", "mod": "ROCapsules", "title": "Apollo Block III+ Service Module"}, {"name": "ROC-ApolloSMDBDBlockIV", "mod": "ROCapsules", "title": "Apollo Block IV Service Module"}], "upgrades": [], "grants": []}, "int_bigGeminiLogistics": {"title": "Enlarged Station-Logistics Capsule", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Scale the maneuvering capsule up from two seats to nine, or trade the crew for cargo entirely - Gemini's own OAMS-powered airframe, stretched into a ferry built to keep a station supplied rather than chase a target in orbit. Where Apollo forked toward the Moon, this is Gemini's other road: never flown, but the shape every later space-station taxi and cargo hauler still borrows from.", "parts": [{"name": "ROC-BigGeminiCabinBDB", "mod": "ROCapsules", "title": "Big G Crew Module"}, {"name": "ROC-BigGeminiDecoupler", "mod": "ROCapsules", "title": "Big G Service Module Decoupler"}, {"name": "ROC-BigGeminiDockingAdapter", "mod": "ROCapsules", "title": "Big G Docking Adapter"}, {"name": "ROC-BigGeminiNose", "mod": "ROCapsules", "title": "Big G Nose Fairing"}, {"name": "ROC-BigGeminiSM", "mod": "ROCapsules", "title": "Big G Service Module"}], "upgrades": [], "grants": []}, "int_shuttleOrbiter": {"title": "Reusable Winged Orbiter", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Put the wing, the heatshield, the flight deck and a cargo bay big enough to carry a whole satellite all on one airframe that lands on a runway and flies again - the Shuttle orbiter, the vehicle this whole era is named for. Winged reentry, a spaceplane flight deck and large-fuselage airframe structure, each already proven separately, converge here for the first time into one reusable machine.", "parts": [{"name": "mk3CargoBayL", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-100"}, {"name": "mk3CargoBayM", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-50"}, {"name": "mk3CargoBayS", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-25"}, {"name": "mk3CargoRamp", "mod": "Squad", "title": "Mk3 Cargo Ramp"}, {"name": "mk3Cockpit_Shuttle", "mod": "Squad", "title": "Mk3 Cockpit"}, {"name": "mk3CrewCabin", "mod": "Squad", "title": "Mk3 Passenger Module"}], "upgrades": [], "grants": []}, "cryo_deployableNozzleExpander": {"title": "Deployable-Nozzle Expander Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The expander cycle's payoff arrives: a radiatively-cooled nozzle that unfolds after staging trades stowed length for the highest vacuum Isp of any engine that flies. The RL-10B-2's carbon-carbon skirt reaches 465 seconds; the RD-0146 is the Russian closed-expander answer. The long RL-10 chain, idle since its last refinement, leaps a full fleet-generation here.", "parts": [{"name": "ROE-RD0146", "mod": "ROEngines", "title": "RD-0146"}, {"name": "ROE-RL10A4N", "mod": "ROEngines", "title": "RL-10A-4N Series (46\" Extendable Nozzle)"}, {"name": "ROE-RL10B2", "mod": "ROEngines", "title": "RL-10B/C Series (84.1\" Extendable Nozzle)"}], "upgrades": ["RFUpgrade_CECE-Base", "RFUpgrade_CECE-High", "RFUpgrade_CECE-Methane", "RFUpgrade_RD-0146D", "RFUpgrade_RL10C-1", "RFUpgrade_RL10C-1-1", "RFUpgrade_RL10C-1A", "RFUpgrade_RL10C-2", "RFUpgrade_RL10C-2-1"], "grants": []}, "cryo_operationalHydroloxUpper": {"title": "Operational Restartable Hydrolox Upper", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The gas-generator hydrolox upper grows up. Where the J-2 fired once, the LE-5 coasts and reignites ten times across a mission - the workhorse restartable upper of an operational launcher. Its own expander-bleed descendants split off to the expander lane.", "parts": [{"name": "ROE-LE5", "mod": "ROEngines", "title": "LE-5"}], "upgrades": ["RFUpgrade_LE-5B-2", "RFUpgrade_LE-5B-3"], "grants": []}, "cryo_boosterGasGenHydrolox": {"title": "Booster-Class Gas-Generator Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Having proven the reusable staged-combustion engine is buildable, the world's launch fleet turns around and walks away from it. The RS-68 - the most powerful hydrogen engine ever flown - is deliberately a gas-generator with an ablative nozzle, trading Isp for a price tag; Vulcain and the YF-77 make the same bargain for Ariane and Long March. The anti-SSME: simplicity at booster scale.", "parts": [{"name": "ROE-RS68", "mod": "ROEngines", "title": "RS-68"}, {"name": "YF77_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-77"}, {"name": "YF77_Engine-double-withShell", "mod": "KerwisChineseAerospacePack", "title": "YF-77 with CZ-5 Boattail"}, {"name": "cryoengine-vesuvius-1", "mod": "CryoEngines", "title": "Vulcain 2"}, {"name": "rmm_rainier", "mod": "RocketMotorMenagerie", "title": "Space Transportation Main Engine (STME)"}], "upgrades": ["RFUpgrade_RS-68A", "RFUpgrade_RS-68B", "RFUpgrade_RS-68K", "RFUpgrade_RS-800"], "grants": []}, "cryo_operationalFRSC": {"title": "Operational Fuel-Rich Staged-Combustion Hydrolox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The hardest cycle in rocketry stops being one nation's secret. Fuel-rich staged-combustion hydrolox - the SSME's cycle - is rebuilt by two more programs: the RD-0120 lifts Energia, the LE-7 lifts the H-II. What took a superpower to master becomes something three space programs can pour.", "parts": [{"name": "ROE-LE7", "mod": "ROEngines", "title": "LE-7"}, {"name": "ROE-RD0120", "mod": "ROEngines", "title": "RD-0120"}, {"name": "rmm_ishtar", "mod": "RocketMotorMenagerie", "title": "RS-25-50X (SSME-50X)"}], "upgrades": [], "grants": []}, "cryo_reusableEngineUprating": {"title": "Reusable-Engine Production Uprating", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Every reusable and staged-combustion hydrolox engine now in service settles into its production marks - the SSME Block-I and Block-II, the RD-0120M, the LE-7A, the maturing HG-3 and deep-throttle chains - the unglamorous decade of squeezing margin out of engines already flying.", "parts": [{"name": "rmm_arsia", "mod": "RocketMotorMenagerie", "title": "RS-25-650 (SSME-650)"}], "upgrades": ["RFUpgrade_HG-3B", "RFUpgrade_HG-3B-2", "RFUpgrade_HG-3B-SL", "RFUpgrade_HG-3B-SL-2", "RFUpgrade_LE-7A", "RFUpgrade_LE-7A-2", "RFUpgrade_LR129-P-3", "RFUpgrade_LRBE-BlockII", "RFUpgrade_RD-0120M", "RFUpgrade_RD-0122", "RFUpgrade_RD-57A-1", "RFUpgrade_RD-57M", "RFUpgrade_RS-25A", "RFUpgrade_RS-25C", "RFUpgrade_RS-25D-50X", "RFUpgrade_RS-25D-E", "RFUpgrade_SSBE-BlockII"], "grants": []}, "cryo_tripropellant": {"title": "Tripropellant Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "One engine, two fuels, switched in flight. At liftoff it burns dense kerosene for thrust off the pad; at altitude it crosses over to hydrogen for Isp - a single powerplant doing the job of a two-propellant staircase. The RD-701 was meant to lift the MAKS spaceplane; making it work needs both the staged-combustion hydrolox cycle and oxidiser-rich kerolox at once.", "parts": [{"name": "nflv-engine-rd701-1", "mod": "NearFutureLaunchVehicles", "title": "RD-701"}, {"name": "nflv-engine-rd704-1", "mod": "NearFutureLaunchVehicles", "title": "RD-704"}, {"name": "rmm_dugong", "mod": "RocketMotorMenagerie", "title": "SSBE"}], "upgrades": [], "grants": []}, "cryo_methaloxStagedCombustion": {"title": "Methalox Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Methane splits the difference: colder than kerosene, denser than hydrogen, clean-burning and one day makeable on Mars. The LRBE is the tree's first methalox engine - a staged-combustion booster on a fuel nobody flew yet, the seed of a lane that a later era will grow into.", "parts": [{"name": "ROE-BE4", "mod": "ROEngines", "title": "BE-4"}, {"name": "rmm_arenysaurus", "mod": "RocketMotorMenagerie", "title": "LRBE"}], "upgrades": [], "grants": []}, "pc_multiChamberORSC": {"title": "High-Thrust Multi-Chamber ORSC", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Oxidiser-rich staged combustion hits its ceiling. The RD-170 - four chambers off one turbopump, 7900 kilonewtons - is the most powerful liquid-propellant engine ever built, the monster that lifts Energia and Zenit. Where the N1's engines never flew and Zenit's was only an upper, this is the chemistry's operational record.", "parts": [{"name": "ROE-RD170", "mod": "ROEngines", "title": "RD-170"}, {"name": "YF100_Engine-double-withShell2", "mod": "KerwisChineseAerospacePack", "title": "YF-100 with CZ-5 Boattail"}, {"name": "YF100_Engine_S", "mod": "KerwisChineseAerospacePack", "title": "YF-100"}], "upgrades": ["RFUpgrade_RD-171M", "RFUpgrade_YF-100K"], "grants": []}, "pc_modularORSC": {"title": "Modular Oxidiser-Rich Kerolox", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The record engine gets cut into pieces you can sell. Halve the RD-170's four chambers and you have the RD-180 for Atlas; quarter it and you have the single-chamber Angara engine. Same core hardware, packaged into a modular family for the export and commercial market.", "parts": [{"name": "ROE-RD180", "mod": "ROEngines", "title": "RD-180"}, {"name": "ROE-RD191", "mod": "ROEngines", "title": "RD-191"}], "upgrades": ["RFUpgrade_RD-120F", "RFUpgrade_RD-120K", "RFUpgrade_RD-171", "RFUpgrade_RD-172-173", "RFUpgrade_RD-181", "RFUpgrade_RD-191", "RFUpgrade_RD-193"], "grants": []}, "pc_operationalStorableORSC": {"title": "Operational Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The storable staged-combustion engines of Proton and its kin reach their final operational marks - the RD-275 first stage, the Kosberg upper stages - the last refinements of a hypergolic booster line that has been flying since the sixties.", "parts": [], "upgrades": ["RFUpgrade_RD-0210-Mk3", "RFUpgrade_RD-0212-Mk3", "RFUpgrade_RD-0213-Mk3", "RFUpgrade_RD-253-Mk4", "RFUpgrade_RD-254-11D44-Mk4", "RFUpgrade_RD-275", "RFUpgrade_RD-277-14D16"], "grants": []}, "fd_multiRestartStorableUpper": {"title": "Multi-Restart Storable Upper Stage", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Coast, reignite, coast again - dozens of times, across days. The Fregat and Briz upper stages and their kin are storable propulsion modules built for the choreography of an interplanetary or multi-orbit mission, restarting on demand where the single-shot Agena and early AJ10 could not. The Transtar rates five hundred ignitions.", "parts": [{"name": "ROE-AJ10-transtar", "mod": "ROEngines", "title": "AJ23 Transtar"}, {"name": "ROE-AJ10AdvLong", "mod": "ROEngines", "title": "AJ10 Series (Advanced Long Nozzle)"}, {"name": "ROE-S592", "mod": "ROEngines", "title": "S5.92"}, {"name": "ROE-S598M", "mod": "ROEngines", "title": "S5.98M"}, {"name": "restock-engine-125-pug", "mod": "ReStockPlus", "title": "Aestus"}], "upgrades": ["RFUpgrade_Aestus-II", "RFUpgrade_AestusMod"], "grants": []}, "fd_terminalGasGenKerolox": {"title": "Terminal Gas-Generator Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The gas-generator kerolox engines that built the space age take their final bow. The last production marks of Delta's RS-27, Atlas's RS-56 and Titan's LR87/LR91 - a lineage of open-cycle workhorses being uprated one last time as staged combustion walks past them.", "parts": [], "upgrades": ["RFUpgrade_LR101-NA-15", "RFUpgrade_LR87-AJ-11A", "RFUpgrade_LR87-AJ-11A-Kero", "RFUpgrade_LR91-AJ-11A", "RFUpgrade_LR91-AJ-11A-Kero", "RFUpgrade_Model8096C", "RFUpgrade_RD-58S", "RFUpgrade_RS-27A", "RFUpgrade_RS-56-OBA", "RFUpgrade_RS-56-OSA"], "grants": []}, "fd_advancedGasGenKerolox": {"title": "Advanced Gas-Generator Kerolox Booster", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "America's answer to the imported RD-180 that never got built. The STBE was a big, simple gas-generator kerolox booster engine drawn for the next launcher - the domestic alternative to buying Russian staged combustion, shelved when the RD-180 won on price.", "parts": [{"name": "cryoengine-allosaur-1", "mod": "CryoEngines", "title": "STBE-3"}, {"name": "nflv-engine-stbe-kero-1", "mod": "NearFutureLaunchVehicles", "title": "STBE (Pratt \u0026 Whitney)"}, {"name": "rmm_turiasaurus", "mod": "RocketMotorMenagerie", "title": "STBE (Pratt \u0026 Whitney)"}], "upgrades": [], "grants": []}, "pc_filamentWoundSolid": {"title": "Filament-Wound Composite-Case Solids", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Wind the motor case out of graphite and epoxy instead of forging it from steel, and the dead weight falls away. The filament-wound composite case - on the giant SRMU, the standalone Castor 120, the Titan solids - is the material leap past the heavy segmented steel of the Shuttle booster, more impulse for less structure.", "parts": [{"name": "ROE-1208sepMotor", "mod": "ROEngines", "title": "UA1208 Nosecone \u0026 Separation Motor"}, {"name": "ROE-Castor120", "mod": "ROEngines", "title": "Castor 120"}, {"name": "ROE-Castor30", "mod": "ROEngines", "title": "Castor 30A"}, {"name": "ROE-Castor30XL", "mod": "ROEngines", "title": "Castor 30XL"}, {"name": "ROE-SRMU", "mod": "ROEngines", "title": "SRMU"}, {"name": "ROE-UA1208", "mod": "ROEngines", "title": "UA1208"}], "upgrades": ["RFTech-solids-tltech6", "RFTech-solids-tltech7", "RFUpgrade_FWC-SRM", "RFUpgrade_RSRM-1986"], "grants": []}, "pc_gemStrapOnCatalog": {"title": "Graphite-Epoxy Strap-On Catalog", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The commercial strap-on aisle. Bolt on as many graphite-epoxy motors as the payload needs - the Delta GEM family in three lengths, the Atlas AJ-60 - a fixed catalogue of composite boosters sized to order off the composite-case breakthrough.", "parts": [{"name": "ROE-AJ60", "mod": "ROEngines", "title": "AJ-60A"}, {"name": "ROE-GEM40", "mod": "ROEngines", "title": "GEM 40"}, {"name": "ROE-GEM46", "mod": "ROEngines", "title": "GEM 46"}, {"name": "ROE-GEM60", "mod": "ROEngines", "title": "GEM 60"}, {"name": "ROE-GEM63", "mod": "ROEngines", "title": "GEM 63"}], "upgrades": [], "grants": []}, "ep_operationalHall": {"title": "Operational Hall-Effect Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The Hall thruster leaves the laboratory. The SPT-100 and its bigger siblings become flight-qualified hardware, first for stationkeeping and then as primary propulsion - a few grams-force of thrust at sixteen hundred seconds of Isp, the electric workhorse of the coming decades.", "parts": [{"name": "RO-PPS1350", "mod": "NearFuturePropulsion", "title": "PPS-1350 Hall Effect Thruster"}, {"name": "RO-SPT100", "mod": "NearFuturePropulsion", "title": "SPT-100 Hall Effect Thruster"}, {"name": "RO-SPT140", "mod": "NearFuturePropulsion", "title": "SPT-140 Hall Effect Thruster"}], "upgrades": ["RFUpgrade_457M-V1-K", "RFUpgrade_SPT-100D", "RFUpgrade_SPT-100M", "RFUpgrade_SPT-140D", "RFUpgrade_SPT-50M"], "grants": []}, "ep_highPowerHall": {"title": "High-Power Nested Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Scale the Hall thruster into the tens of kilowatts. The 457M's nested channels swallow seventy-two kilowatts and push the Isp past two thousand seconds - the class of electric engine that could one day move cargo rather than just trim an orbit.", "parts": [{"name": "RO-457M", "mod": "NearFuturePropulsion", "title": "457M 72kW Hall Effect Thruster"}], "upgrades": ["RFUpgrade_457M-V2", "RFUpgrade_PITV-Hydrazine-40", "RFUpgrade_SPT-100B"], "grants": []}, "ep_griddedIon": {"title": "Gridded Ion Electrostatic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "A different way to throw ions: accelerate them through charged grids instead of a magnetic field, and the exhaust speed climbs higher still. NSTAR flew on Deep Space 1 - the first time an ion engine, not a chemical rocket, was the main drive of a probe to another world.", "parts": [{"name": "ionEngine", "mod": "Squad", "title": "NSTAR Gridded Ion Thruster"}], "upgrades": [], "grants": []}, "ep_pulsedInductive": {"title": "Pulsed Inductive Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "No electrodes to erode - a pulsed magnetic field ionises and flings a puff of ammonia, and repeats thousands of times a second. The PIT reaches seven thousand seconds of Isp, an experimental high-power concept for the kind of cruise no chemical stage could sustain.", "parts": [{"name": "RO-nupit", "mod": "NearFuturePropulsion", "title": "NuPIT Pulsed Inductive Thruster"}, {"name": "pit-0625", "mod": "NearFuturePropulsion", "title": "FARAD Pulsed Inductive Thruster"}, {"name": "pit-125", "mod": "NearFuturePropulsion", "title": "PIT Mk Va Pulsed Inductive Thruster"}], "upgrades": ["RFUpgrade_NuPIT-7000", "RFUpgrade_PITV-Ammonia-1200", "RFUpgrade_PITV-Hydrazine-1200"], "grants": []}, "nuc_flightDesignNTR": {"title": "Flight-Design Solid-Core NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "The nuclear rocket stops being a ground-test article and becomes a flight design. The Soviet RD-0410 was actually built and fired; NERVA II is the largest solid-core engine ever drawn. The end of the solid-core line - reactors meant, at last, to leave the ground.", "parts": [{"name": "RD0410MID", "mod": "Squad", "title": "RD-0410"}, {"name": "ROE-NERVAII", "mod": "ROEngines", "title": "NERVA II"}, {"name": "restock-engine-cherenkov", "mod": "ReStockPlus", "title": "RD-0410"}], "upgrades": [], "grants": []}, "nuc_particleBedNTR": {"title": "Particle-Bed NTR", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Pack the reactor fuel as loose particles instead of solid rods and the coolant can pull heat out far faster - more power in less core. The particle-bed NTR of the Timberwind program is a denser, hotter path to the same nuclear thrust.", "parts": [{"name": "ROE-SNTPPFE100", "mod": "ROEngines", "title": "SNTP-PFE100 Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_advancedCoreNTR": {"title": "Advanced-Core NTR Concepts", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Let the fuel melt, or turn to gas, and the temperature ceiling - and the Isp - rises with it. The liquid-core NTR reaches fourteen hundred seconds; the low-pressure gas-core start pushes further. Engineering fiction for now, and the doorway to the gas-core lane a later era will open.", "parts": [{"name": "RO-KA-LRCNTR", "mod": "KerbalAtomics", "title": "Lewis Research Center LNTR"}, {"name": "ntr-gc-25-1", "mod": "KerbalAtomics", "title": "Low-Pressure NTR"}], "upgrades": ["RFUpgrade_PrincetonLNTR-WCH"], "grants": []}, "av_vtolVectoredTurbofan": {"title": "Vectored-Thrust VTOL Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Point the thrust down and a fighter takes off with no runway. The R-79's swivelling nozzle lifts the Yak-141 vertically then rotates aft for supersonic flight, the lift jets handling the hover - vectored thrust as a whole new way to leave the ground.", "parts": [{"name": "RO-SXT-R79", "mod": "SXT", "title": "R-79 Turbofan"}, {"name": "RO-nfa-RD41", "mod": "NearFutureAeronautics", "title": "2x RD-41 Turbojet"}], "upgrades": [], "grants": []}, "av_fourthGenFighterTurbofan": {"title": "Fourth-Generation Fighter Turbofan", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "The fourth-generation fighter engine: high bypass for a combat turbofan, high pressure ratio, high turbine temperature. The F135 that powers the F-35 is the most powerful fighter engine ever built; the WS-10 is its Chinese contemporary. The long tail of teen-series and Flanker engine marks matures here.", "parts": [{"name": "RO-WS10", "mod": "Squad", "title": "WS-10 Low-Bypass Turbofan"}, {"name": "SXTVTOLturboFan", "mod": "SXT", "title": "F135 Low-Bypass Turbofan"}], "upgrades": ["RFUpgrade_AL-31FM", "RFUpgrade_AL-41F-1S", "RFUpgrade_CF34-3B", "RFUpgrade_F100-PW-229", "RFUpgrade_F100-PW-229PYBBN", "RFUpgrade_F404-GE-402", "RFUpgrade_J58-P-4A", "RFUpgrade_J58-P-4B", "RFUpgrade_R-79M-300", "RFUpgrade_R-79V-300", "RFUpgrade_RM12", "RFUpgrade_WP-13A-II", "RFUpgrade_WP-13F", "RFUpgrade_WP-13FI"], "grants": []}, "gnc_deepSpaceApogeeEngine": {"title": "Deep-Space Bipropellant Apogee Engine", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "The little bipropellant engine that inserts a probe into orbit around another planet. The LEROS-1b - flight-proven on NEAR, MESSENGER and Juno - and the R-42 are the mature descendants of the R-4D thruster, built to sit cold through years of cruise and then fire once, exactly right, at the far end.", "parts": [{"name": "ROE-LEROS1B", "mod": "ROEngines", "title": "LEROS-1b (635N)"}, {"name": "ROE-LEROS4", "mod": "ROEngines", "title": "LEROS-4 (1100N)"}, {"name": "ROE-R42", "mod": "ROEngines", "title": "R-42"}, {"name": "ca_mer_ft", "mod": "CoatlAerospace", "title": "Cassini Propulsion Module"}], "upgrades": [], "grants": []}, "cmp_venusEntryAeroshell": {"title": "High-Pressure Atmospheric Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Face an atmosphere ninety times denser than Earth's and hot enough to melt lead at the surface - the Venera aeroshell's heatshield and twin parachutes, built for a descent that ends in a furnace no matter how gently you land in it.", "parts": [{"name": "ca_draco_hs", "mod": "CoatlAerospace", "title": "Huygens Heat Shield"}, {"name": "ca_fom_drogue", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Drogue Parachute)"}, {"name": "ca_fom_heatS", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Heat Shield)"}, {"name": "ca_fom_parachute", "mod": "CoatlAerospace", "title": "Venera Lander Aeroshell (Main Parachute)"}], "upgrades": [], "grants": []}, "cmp_extremeAtmosphericEntry": {"title": "Extreme Atmospheric-Entry Shielding", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Hit a gas giant's atmosphere at tens of kilometres a second and shed more heat in two minutes than a lunar return sheds in the whole reentry - the most extreme ablator ever asked to survive, carried on a probe built to transmit for as long as it can before it's cooked.", "parts": [{"name": "galileo_hs_bot", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Bottom"}, {"name": "galileo_hs_mid", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Middle"}, {"name": "galileo_hs_top", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe Heatshield Top"}], "upgrades": [], "grants": []}, "cmp_extremeEntryParachutes": {"title": "Extreme-Entry Recovery Parachutes", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "A parachute stack timed to deploy only once the heatshield has done its worst work and the shockwave has finally fallen behind - Galileo's own descent sequence, the last mechanical step between the hottest entry in the tree and a working probe.", "parts": [{"name": "ca_draco_drogue", "mod": "CoatlAerospace", "title": "Huygens Drogue Parachute"}, {"name": "ca_draco_parachute", "mod": "CoatlAerospace", "title": "Huygens Main Parachute"}, {"name": "galileo_probe_hs_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Heatshield Parachute"}, {"name": "galileo_probe_parachute", "mod": "RN_US_Probes", "title": "Galileo Probe Parachute"}], "upgrades": [], "grants": []}, "res_regolithExtraction": {"title": "Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Bore into loose surface material with a motorised bit and bring up what you find - the first step of living off a world instead of just visiting it. Needs nothing more than the same motor already turning a rover's wheels, aimed down instead of forward.", "parts": [{"name": "kerbalism-drill", "mod": "Squad", "title": "Regolith Harvester"}], "upgrades": [], "grants": []}, "res_largeRegolithExtraction": {"title": "Large-Scale Regolith Extraction", "discipline": "Resource Engineering", "color": "#b0763a", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "The same drill, scaled up for a real mining rate instead of a proof of concept - the difference between sampling a world and living off it.", "parts": [{"name": "kerbalism-large-drill", "mod": "Squad", "title": "Large Regolith Harvester"}], "upgrades": [], "grants": []}, "gnc_sovietProbeBusFamily": {"title": "Soviet Interplanetary Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One bus architecture, flown as both an orbiter and a lander carrier - the 4MV core that became Venera, Zond and Mars probes across a decade, with its own tankage and reentry-module release built in from the start.", "parts": [{"name": "ca_fom_lander", "mod": "CoatlAerospace", "title": "Venera Lander Bus"}, {"name": "ca_vor_core", "mod": "CoatlAerospace", "title": "4MV Spacecraft Bus"}, {"name": "ca_vor_mptank", "mod": "CoatlAerospace", "title": "CAE-MT12 Propellant Tank (Pressurized)"}, {"name": "ca_vor_sep1", "mod": "CoatlAerospace", "title": "Venera Reentry Module Decoupler"}, {"name": "ca_vor_tank", "mod": "CoatlAerospace", "title": "4MV-1/2 Spacecraft Bus Propellant Tank"}], "upgrades": [], "grants": []}, "gnc_usProbeBusFamily": {"title": "US Deep-Space Probe Bus Family", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "The generic 3-axis deep-space probe bus catalog — the spin-stabilised and fully-3-axis-stabilised cores, the attitude-control hardware and the ultraviolet-explorer bus that ride the same shelf. The flagship craft built on them (Pioneer, Voyager) arrive through the charter.", "parts": [ ission-5-2", "mod": "FarFutureTechnologies", "title": "20 m Fissiles Tank (Short)"}, {"name": "fft-fueltank-fission-radial-1", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-radial-2", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Medium)"}, {"name": "fft-fueltank-fission-radial-3", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Short)"}], "upgrades": [], "grants": []}, "cryo_combustionTapOff": {"title": "Combustion Tap-Off Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Skip the separate gas-generator combustor entirely - bleed hot gas straight off the main chamber wall to spin the turbopump, then dump it overboard. Simpler than a gas generator, cheaper than staged combustion: the operational middle path Blue Origin bet New Shepard and New Glenn's upper stage on.", "parts": [{"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": [], "grants": []}, "cryo_highThrustExpander": {"title": "Higher-Thrust Closed Expander", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Scale the closed expander cycle past the RL-10's own ceiling - two parallel American and European programs converge on the same bigger turbopump, the same clean cycle, roughly triple the thrust.", "parts": [{"name": "ROE-MB35", "mod": "ROEngines", "title": "MB-35"}, {"name": "ROE-MB60", "mod": "ROEngines", "title": "MB-60"}, {"name": "cryoengine-pavonis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}, {"name": "cryoengine-tharsis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}], "upgrades": ["RFUpgrade_Vinci-180"], "grants": []}, "cryo_smallScaleMethalox": {"title": "Small-Scale Methalox Upper Stage", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "A simpler, plainer methalox debut at small scale - no staged-combustion preburner, just a clean upper-stage engine sized for a commercial small-satellite launcher. The unglamorous sibling to the booster-scale methalox story unfolding one node over.", "parts": [{"name": "cryoengine-buzzard-1", "mod": "CryoEngines", "title": "M10"}], "upgrades": [], "grants": []}, "cryo_expanderBoosterScale": {"title": "Expander-Bleed Cycle at Booster Scale", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Vent a little of the cooling-jacket gas overboard instead of routing every drop through the turbopump, and the expander cycle's thrust ceiling - always capped by a small upper-stage engine's own heat-exchange area - breaks wide open. The expander cycle finally reaches core-stage scale.", "parts": [{"name": "cryoengine-fuji-1", "mod": "CryoEngines", "title": "LE-9"}], "upgrades": [], "grants": []}, "cryo_fullFlowMethalox": {"title": "Full-Flow Staged-Combustion Methalox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Burn both turbopump drive-gas streams through combustion at once - a fuel-rich preburner AND an oxidiser-rich preburner, nothing vented overboard at all. The thermodynamic endpoint of the staged-combustion idea, and the only cycle that ever reached it in metal.", "parts": [{"name": "ROE-Raptor", "mod": "ROEngines", "title": "Raptor (Surface Variant)"}, {"name": "ROE-RaptorVac", "mod": "ROEngines", "title": "Raptor-Vacuum"}], "upgrades": [], "grants": []}, "fd_reusableGasGenKerolox": {"title": "Reusable Gas-Generator Kerolox", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "After a whole tree of gas-generator kerolox engines chasing diminishing returns while staged combustion walked past, one company bets the other way: keep the simple open cycle, keep it deliberately unglamorous, and win on cost and reusability instead of chasing one more second of Isp.", "parts": [{"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}, {"name": "ROE-Merlin1C", "mod": "ROEngines", "title": "Merlin 1C"}, {"name": "ROE-Merlin1CV", "mod": "ROEngines", "title": "Merlin 1C Vacuum"}], "upgrades": ["RFUpgrade_Merlin1C", "RFUpgrade_Merlin1CVac"], "grants": []}, "fd_densifiedPropellantKerolox": {"title": "Densified-Propellant Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Chill both propellants below their normal boiling points before loading, and more mass packs into the same tanks and the same engine - the real refinement behind a two-thirds thrust jump on the same basic cycle, no new chemistry required.", "parts": [{"name": "ROE-Merlin1D", "mod": "ROEngines", "title": "Merlin 1D"}, {"name": "ROE-Merlin1DV", "mod": "ROEngines", "title": "Merlin 1D Vacuum"}], "upgrades": ["RFUpgrade_Merlin1D", "RFUpgrade_Merlin1D+", "RFUpgrade_Merlin1D++", "RFUpgrade_Merlin1DVac", "RFUpgrade_Merlin1DVac+"], "grants": []}, "pc_americanORSCKerolox": {"title": "American ORSC Kerolox Studies", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Two separately-funded American answers to the imported RD-180 - oxidiser-rich staged combustion on kerosene, drawn to compete on the same contract the Russians won on price. Real hardware, real test stands, and no flight between them.", "parts": [{"name": "nflv-engine-ar1-1", "mod": "NearFutureLaunchVehicles", "title": "AR-1"}, {"name": "nflv-engine-ar1c-1", "mod": "NearFutureLaunchVehicles", "title": "AR-1"}, {"name": "nflv-engine-rs84-1", "mod": "NearFutureLaunchVehicles", "title": "RS-84"}], "upgrades": [], "grants": []}, "pc_fiveSegmentSolidScaleUp": {"title": "Five-Segment Solid Booster Scale-Up", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 11, "cost": 900, "anyToUnlock": false, "flavor": "Add one more segment to the Shuttle's own composite-case booster and it becomes the largest solid rocket motor ever flown - the same casting and winding technique, scaled up one more time for a heavier successor vehicle.", "parts": [{"name": "MassiveBooster", "mod": "Squad", "title": "RSRMV"}], "upgrades": [], "grants": []}, "gnc_deepThrottlingAbortLandingEngine": {"title": "Deep-Throttling Pressure-Fed Abort/Landing Engine", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "A launch-abort engine that can also fly a controlled, propulsive touchdown - pressure-fed hypergolics deep-throttled and restarted enough times to trust a crew's life to it twice in one mission, once going up wrong and once coming down right.", "parts": [{"name": "ROC-CSTRS88", "mod": "ROCapsules", "title": "CST-100 Launch Abort Engines (LAE)"}, {"name": "ROC-OrionCover1", "mod": "ROCapsules", "title": "Orion SM Fairing - 1"}, {"name": "ROC-OrionCover2", "mod": "ROCapsules", "title": "Orion SM Fairing - 2"}, {"name": "ROC-OrionCover3", "mod": "ROCapsules", "title": "Orion ESM Fairing - 3"}, {"name": "ROC-OrionLAS", "mod": "ROCapsules", "title": "Orion LAS and BPC"}, {"name": "ROE-SuperDraco", "mod": "ROEngines", "title": "SuperDraco"}, {"name": "ROE-SuperDracoDouble", "mod": "ROEngines", "title": "Twin SuperDraco"}], "upgrades": [], "grants": []}, "ep_electricPumpFeed": {"title": "Electric-Pump-Fed Kerolox", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 0, "anyToUnlock": false, "flavor": "Spin the propellant pumps with a battery and a brushless motor instead of a gas generator or a preburner turbine - no exhaust-driven turbine at all. A little less thrust-to-weight bought back with radical simplicity and a bill of materials any workshop can assemble.", "parts": [{"name": "ROE-Rutherford", "mod": "ROEngines", "title": "Rutherford"}, {"name": "ROE-RutherfordVac", "mod": "ROEngines", "title": "Rutherford Vacuum"}], "upgrades": [], "grants": []}, "ep_nextGenGriddedIon": {"title": "Next-Generation Gridded Ion Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "NSTAR's direct successor - the same electrostatic-grid acceleration, refined for higher throughput and, in its most extreme sibling, a second acceleration stage for even higher exhaust velocity.", "parts": [{"name": "RO-ID500", "mod": "NearFuturePropulsion", "title": "ID-500 Gridded Ion Thruster"}, {"name": "ionXenon-0625", "mod": "NearFuturePropulsion", "title": "NEXT Gridded Ion Thruster"}, {"name": "ionXenon-0625-2", "mod": "NearFuturePropulsion", "title": "HiPEP Gridded Ion Thruster"}, {"name": "ionXenon-0625-3", "mod": "NearFuturePropulsion", "title": "DS4G Gridded Ion Thruster"}], "upgrades": ["RFUpgrade_DS4G-25-hi", "RFUpgrade_DS4G-25-mid", "RFUpgrade_DS4G-50-hi", "RFUpgrade_DS4G-50-low"], "grants": []}, "ep_nasaHighPowerHall": {"title": "NASA High-Power Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Purpose-built for deep-space station-keeping on a crewed outpost, not just trimming a satellite's orbit - the next mark past the 457M, and in its nested-channel sibling, the highest-power Hall thruster ever built.", "parts": [{"name": "ionArgon-0625", "mod": "NearFuturePropulsion", "title": "HERMeS Hall Effect Thruster"}, {"name": "ionArgon-0625-2", "mod": "NearFuturePropulsion", "title": "P5 5kW Hall Effect Thruster"}, {"name": "ionArgon-0625-3", "mod": "NearFuturePropulsion", "title": "X3 Hall-Effect Thruster"}], "upgrades": [], "grants": []}, "ep_magnetoplasmadynamic": {"title": "Magnetoplasmadynamic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 0, "anyToUnlock": false, "flavor": "Skip both the Hall channel and the ion grid - drive a plasma arc straight through an electromagnetic pinch and let the field itself do the accelerating. High power density, real hardware, and a genuinely different mechanism from anything else this tree calls electric propulsion.", "parts": [{"name": "mpdt-125", "mod": "NearFuturePropulsion", "title": "SX3 MPD Thruster"}], "upgrades": [], "grants": []}, "ep_variableSpecificImpulsePlasma": {"title": "Variable-Specific-Impulse Plasma Rocket", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 14, "cost": 0, "anyToUnlock": false, "flavor": "RF-heat a plasma instead of arcing through it, then steer it out through a magnetic nozzle - and unlike every other electric thruster in this tree, trade thrust for Isp continuously, in flight, instead of picking one number at build time.", "parts": [{"name": "vasimr-0625", "mod": "NearFuturePropulsion", "title": "VX-200SS VASIMR"}, {"name": "vasimr-125", "mod": "NearFuturePropulsion", "title": "VF-200 VASIMR"}], "upgrades": ["RFUpgrade_VF-200-Kr", "RFUpgrade_VX-200SS-Kr"], "grants": []}, "nuc_bimodalNTR": {"title": "Bimodal Nuclear Thermal + Power", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 14, "cost": 0, "anyToUnlock": false, "flavor": "The same reactor that heats propellant for thrust keeps running between burns as a power source - real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry.", "parts": [{"name": "ROE-BNTR", "mod": "ROEngines", "title": "Bimodal NTR"}], "upgrades": [], "grants": []}, "nuc_fissionFragmentRocket": {"title": "Fission-Fragment Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 15, "cost": 0, "anyToUnlock": false, "flavor": "Let the fission fragments themselves be the exhaust - no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach.", "parts": [{"name": "RO-fftdustyplasmaffre", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Fission Fragment Rocket Engine"}, {"name": "fft-ffre-plasma-1", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Afterburning Fission Fragment Rocket Engine"}], "upgrades": [], "grants": []}, "nuc_magneticFusionPulsePropulsion": {"title": "Magnetically-Confined Fusion Pulse Drive", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 0, "anyToUnlock": false, "flavor": "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate - Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion.", "parts": [{"name": "RO-fft20mMMO", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Drive"}, {"name": "fft-fission-zpinch-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Drive"}], "upgrades": [], "grants": []}, "nuc_nuclearSaltWaterRocket": {"title": "Nuclear Salt Water Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 0, "anyToUnlock": false, "flavor": "Dissolve fissile salts in water and let the mixture go critical continuously as it streams through the chamber - the reactor doesn't heat the propellant, the reactor IS the propellant. The wildest, most engineering-fiction concept in the curated set.", "parts": [{"name": "fft-nswr-2", "mod": "FarFutureTechnologies", "title": "20 m Nuclear Salt Water Rocket"}], "upgrades": [], "grants": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
