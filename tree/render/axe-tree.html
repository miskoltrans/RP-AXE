<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

<script>
const DATA={"start": {"title": "United Kerbalkind", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 0, "cost": 0, "anyToUnlock": false, "flavor": "1950. Kerbalkind is united under one world government; they understand that the universe is blind without us. No missiles to repurpose, no doctrine to obey — only the choice of how to begin.", "parts": [], "upgrades": []}, "rocketryStart": {"title": "Sounding-Rocket Program", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "The rocketry beginning, kept deliberately bare: a procedural airframe, a simple solid motor, and an instrument package to loft above the Karman line. Everything else — how you push, how you steer, how you talk home — you will choose.", "parts": [{"name": "RO-RFTank-Separate", "mod": "ProceduralParts", "title": "Procedural Tank (Conventional Structure)"}, {"name": "ROE-BabySergeant", "mod": "ROEngines", "title": "Baby Sergeant (5.4KS-1975)"}, {"name": "proceduralAvionics", "mod": "ProceduralParts", "title": "Avionics [Procedural]"}], "upgrades": []}, "xplaneStart": {"title": "Experimental Aircraft Program", "discipline": "Aerodynamics", "color": "#48cae4", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "The aeroplane beginning: a cockpit, wings, undercarriage, and both an air-breathing jet and a propeller. The runway route to the edge of space — the rocketplane and, one day, the spaceplane.", "parts": [{"name": "B9_Aero_Wing_Procedural_TypeA", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Wing (Spaceplane)"}, {"name": "B9_Aero_Wing_Procedural_TypeB", "mod": "B9_Aerospace_ProceduralWings", "title": "B9 Procedural Control Surface (Spaceplane)"}, {"name": "GearFixed", "mod": "Squad", "title": "LY-01 Fixed Landing Gear"}, {"name": "RO-J35", "mod": "SXT", "title": "J35 Turbojet"}, {"name": "RO-OldFighterCockpit", "mod": "RealismOverhaul", "title": "P-40 Cockpit"}, {"name": "RO-X1Cockpit", "mod": "RealismOverhaul", "title": "X-1 Cockpit"}, {"name": "SXTNK12M", "mod": "SXT", "title": "NK-12 Turboprop"}, {"name": "proceduralNoseCone", "mod": "ProceduralParts", "title": "Nose Cone [Procedural]"}, {"name": "proceduralStructural", "mod": "ProceduralParts", "title": "Structure [Procedural]"}], "upgrades": []}, "pc_solidGrain": {"title": "Cast Composite Solid Grains", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Ammonium-perchlorate oxidiser and powdered aluminium bound in a rubbery binder, cast and cured into a structural grain. Cheap, dense, storable — you light it once and it does not stop. The cheapest way up, and the strap-on that boosts everything else.", "parts": [{"name": "ROE-Aerobee", "mod": "ROEngines", "title": "Aerobee"}, {"name": "ROE-Castor1", "mod": "ROEngines", "title": "Castor 1"}, {"name": "ROE-Star13", "mod": "ROEngines", "title": "STAR 13"}], "upgrades": []}, "pc_ethanolLox": {"title": "Ethanol/LOX Film-Cooled Combustion", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry, and the gateway to kerosene.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}], "upgrades": []}, "pc_kerosene": {"title": "Hydrotreated Narrow-Cut Kerosene (RP-1)", "discipline": "Propellant Chemistry", "color": "#e07a5f", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. The cheap, forgiving road to orbit.", "parts": [{"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}], "upgrades": []}, "fd_gasGenerator": {"title": "Gas-Generator (Open) Cycle", "discipline": "Fluid Dynamics", "color": "#ee9b00", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Burn a little propellant in a side chamber to spin the turbopump, then dump the turbine exhaust overboard. Simple, proven, slightly wasteful — the pump-fed workhorse that puts real mass in orbit.", "parts": [], "upgrades": []}, "cryo_earlyHydrolox": {"title": "Early Hydrogen/Oxygen Upper Stages", "discipline": "Cryogenics", "color": "#4cc9f0", "tier": 3, "cost": 400, "anyToUnlock": true, "flavor": "No doctrine says you must burn kerosene first. Commit early to hydrogen — vacuum-jacketed tanks, insulation, boil-off you fight every hour on the pad — and you buy the highest specific impulse chemistry there is, years ahead of history. It simply costs more program to get there.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": []}, "str_stageSeparation": {"title": "Staging \u0026 Ullage Separation", "discipline": "Structures \u0026 Mechanisms", "color": "#adb5bd", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Explosive bolts cut a spent stage away on a millisecond's command; small motors settle the propellant so the next stage lights clean. Multi-stage flight — the only way to the orbital velocities chemistry can't reach in one go — begins here.", "parts": [{"name": "ROE-BabySergeantX3Dec", "mod": "ROEngines", "title": "Baby Sergeant 3x Cluster Decoupler"}, {"name": "ROE-CastorDecoupler", "mod": "ROEngines", "title": "Castor I \u0026 II Radial Decoupler"}], "upgrades": []}, "gnc_earlyGuidance": {"title": "Rate-Gyro Attitude Guidance", "discipline": "Guidance \u0026 Control", "color": "#7209b7", "tier": 2, "cost": 90, "anyToUnlock": false, "flavor": "Spinning-mass gyroscopes sense the vehicle's turn rates and drive the fins and gimbals to hold a programmed pitch. The first machine that flies itself uphill instead of tumbling.", "parts": [], "upgrades": []}, "tel_pcmTelemetry": {"title": "PCM/FM Telemetry Downlink", "discipline": "Telecommunications", "color": "#4361ee", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it a failure tells you nothing about why — and an orbit you cannot hear is an orbit you cannot prove.", "parts": [], "upgrades": []}, "mic_probeAvionics": {"title": "Vacuum-Tube Sequencers \u0026 Sensors", "discipline": "Microelectronics", "color": "#cdb4db", "tier": 1, "cost": 20, "anyToUnlock": false, "flavor": "Hot-cathode tubes and simple transducers turn a satellite's state into numbers and its timeline into relay clicks — the minimum brain a spacecraft needs to be more than ballast.", "parts": [], "upgrades": []}, "int_firstOrbit": {"title": "First Orbital Capability", "discipline": "Systems Integration", "color": "#e8e8e8", "tier": 3, "cost": 400, "anyToUnlock": false, "flavor": "Staging, guidance, telemetry and a probe brain converge — and whatever engine you chose to build now has somewhere to go. The first artificial moon. Beep. Beep. Beep.", "parts": [{"name": "explorer_6", "mod": "RN_US_Probes", "title": "Explorer 6"}, {"name": "sputnik1", "mod": "RN_Soviet_Probes", "title": "Sputnik 1"}, {"name": "sputnik2", "mod": "RN_Soviet_Probes", "title": "Sputnik 2"}, {"name": "vanguard-1", "mod": "RN_US_Probes", "title": "Vanguard 1"}], "upgrades": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
