<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RP-AXE tech tree</title>
<style>
  :root{--bg:#1a1a1a;--panel:#222;--ink:#eee;--mut:#9aa;--line:#333}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{display:flex;font-family:Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
  #canvas{flex:1;overflow:auto;position:relative}
  #canvas svg{display:block}
  g.node{cursor:pointer} g.node text{pointer-events:none;user-select:none}
  g.node rect,g.node polygon{transition:stroke .1s;stroke:#0000;stroke-width:0}
  g.node:hover rect,g.node:hover polygon{stroke:#ffffffcc;stroke-width:2}
  g.node.sel rect,g.node.sel polygon{stroke:#fff;stroke-width:3}
  g.node:focus{outline:none} g.node:focus rect,g.node:focus polygon{stroke:#ffd166;stroke-width:3}
  #bar{position:fixed;top:8px;left:8px;display:flex;gap:6px;align-items:center;
       background:#000a;padding:5px 8px;border-radius:6px;font-size:12px}
  #bar input{background:#111;border:1px solid #444;color:#eee;border-radius:4px;padding:3px 6px;width:150px}
  #bar button{background:#333;border:1px solid #555;color:#eee;border-radius:4px;padding:2px 8px;cursor:pointer}
  #bar button:hover{background:#444}
  #panel{width:360px;min-width:360px;background:var(--panel);border-left:1px solid var(--line);
         overflow:auto;padding:16px}
  #panel .hint{color:var(--mut);margin-top:40px;text-align:center;font-style:italic}
  .ttl{font-size:19px;font-weight:600;line-height:1.2}
  .meta{color:var(--mut);font-size:13px;margin:6px 0 12px;display:flex;align-items:center;gap:6px}
  .dot{width:11px;height:11px;border-radius:50%;display:inline-block}
  .flav{font-style:italic;color:#cdd;font-size:13px;line-height:1.45;
        border-left:3px solid var(--line);padding-left:10px;margin-bottom:14px}
  .sec{text-transform:uppercase;letter-spacing:.06em;font-size:11px;color:var(--mut);
       border-bottom:1px solid var(--line);padding-bottom:4px;margin:16px 0 8px}
  ul.parts{list-style:none;margin:0;padding:0}
  ul.parts li{padding:6px 0;border-bottom:1px solid #2a2a2a}
  .pt{font-size:14px}
  .pn{font-size:12px;color:var(--mut);font-family:Consolas,monospace}
  .mod{color:#7aa2c4}
  .empty{color:#777;font-style:italic;padding:6px 0}
  #sub{position:fixed;bottom:8px;left:8px;color:var(--mut);font-size:11px;background:#000a;padding:3px 8px;border-radius:5px}
</style></head><body>

 Precursors", "discipline": "Systems Integration", "color": "#ededed", "tier": 8, "cost": 450, "anyToUnlock": false, "flavor": "Map Mars from orbit and cross the asteroid belt for the first time: Mariner 9 becomes the first spacecraft to orbit another planet, Mariner 10 slingshots past Venus to Mercury, and the Pioneers strike out for Jupiter.", "parts": [{"name": "pioneer_10_11", "mod": "RN_US_Probes", "title": "Pioneer 10/11 Probe"}, {"name": "rn_mariner10", "mod": "RN_US_Probes", "title": "Mariner 10"}, {"name": "rn_mariner8-9", "mod": "RN_US_Probes", "title": "Mariner 8/9"}], "upgrades": [], "grants": []}, "jpl_grandTour": {"title": "The Grand Tour", "discipline": "Systems Integration", "color": "#ededed", "tier": 9, "cost": 700, "anyToUnlock": false, "flavor": "The once-in-176-years alignment of the outer planets, taken at a run. Voyager threads Jupiter, Saturn, Uranus and Neptune on a single launch; Helios dives closer to the Sun than anything before it.", "parts": [{"name": "rn_heliosa_b", "mod": "RN_US_Probes", "title": "Helios-1/2"}, {"name": "rn_sphinx_t3e", "mod": "RN_US_Probes", "title": "Sphinx"}, {"name": "rn_voyager", "mod": "RN_US_Probes", "title": "Voyager 1/2 Probe"}], "upgrades": [], "grants": []}, "jpl_shuttleFlagships": {"title": "Shuttle-Era Flagships", "discipline": "Systems Integration", "color": "#ededed", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "The Shuttle lifts the big orbiters and the Inertial Upper Stage kicks them out of Earth orbit: Galileo to Jupiter with an atmospheric probe, Magellan to map Venus by radar, all relayed home through the TDRS network.", "parts": [{"name": "galileo_aprobe", "mod": "RN_US_Probes", "title": "Galileo Atmospheric Probe"}, {"name": "galileo_mb", "mod": "RN_US_Probes", "title": "Galileo Spacecraft"}, {"name": "gdish_actual", "mod": "RN_US_Probes", "title": "Galileo Dish \"Actual\""}, {"name": "gdish_intended", "mod": "RN_US_Probes", "title": "Galileo Dish \"Intended\""}, {"name": "magellan", "mod": "RN_US_Probes", "title": "Magellan"}, {"name": "rn_galileo_scanner", "mod": "RN_US_Probes", "title": "Galileo Orbital Scanner"}, {"name": "rn_magellan_scanner", "mod": "RN_US_Probes", "title": "Magellan Orbital Scanner"}, {"name": "rn_tdrs_ag", "mod": "RN_US_Probes", "title": "Tracking and Data Relay Satellite A-G"}], "upgrades": [], "grants": []}, "jpl_discoveryEra": {"title": "Discovery \u0026 Cassini-Huygens Era", "discipline": "Systems Integration", "color": "#ededed", "tier": 11, "cost": 1450, "anyToUnlock": false, "flavor": "Faster-better-cheaper meets the last of the flagships. NEAR orbits an asteroid, Stardust flies through a comet's tail, Deep Space 1 proves ion propulsion — and Cassini carries Huygens down to land on Titan.", "parts": [{"name": "eos_terra", "mod": "RN_US_Probes", "title": "Terra"}, {"name": "neo_ds1", "mod": "RN_US_Probes", "title": "Deep Space 1"}, {"name": "neo_near", "mod": "RN_US_Probes", "title": "NEAR - Shoemaker"}, {"name": "neo_stardust", "mod": "RN_US_Probes", "title": "Stardust"}, {"name": "neo_stardust_collector", "mod": "RN_US_Probes", "title": "Stardust Return Capsule"}, {"name": "neo_stardust_para", "mod": "RN_US_Probes", "title": "Stardust Return Capsule Parachute"}, {"name": "neo_ulysses", "mod": "RN_US_Probes", "title": "Ulysses"}, {"name": "rn_cassini", "mod": "RN_US_Probes", "title": "Cassini Spacecraft"}, {"name": "rn_huygen_hs_bottom", "mod": "RN_US_Probes", "title": "Huygens Heatshield Bottom"}, {"name": "rn_huygen_hs_chute", "mod": "RN_US_Probes", "title": "Huygens Heatshield Parachute"}, {"name": "rn_huygen_hs_top", "mod": "RN_US_Probes", "title": "Huygens Heatshield Top"}, {"name": "rn_huygens", "mod": "RN_US_Probes", "title": "Huygens Lander"}, {"name": "rn_huygens_chute", "mod": "RN_US_Probes", "title": "Huygens Lander Parachute"}, {"name": "rn_mars_observer", "mod": "RN_US_Probes", "title": "Mars Observer"}], "upgrades": [], "grants": []}, "jpl_modernRobotic": {"title": "Modern Robotic Explorers", "discipline": "Systems Integration", "color": "#ededed", "tier": 12, "cost": 2000, "anyToUnlock": false, "flavor": "The current fleet. New Horizons runs to Pluto, Dawn orbits two asteroids on ion drive, Juno threads Jupiter's radiation, MESSENGER settles at Mercury, and a line of Earth observers watches the home planet through the modern relay network.", "parts": [{"name": "eos_aqua", "mod": "RN_US_Probes", "title": "Aqua"}, {"name": "eos_aura", "mod": "RN_US_Probes", "title": "Aura"}, {"name": "eos_tdrs", "mod": "RN_US_Probes", "title": "Tracking and Data Relay Satellite H-N"}, {"name": "neo_dawn", "mod": "RN_US_Probes", "title": "Dawn"}, {"name": "neo_deepimpact", "mod": "RN_US_Probes", "title": "Deep Impact"}, {"name": "neo_deepimpact_impactor", "mod": "RN_US_Probes", "title": "Deep Impact Impactor"}, {"name": "rn_juno_spacecraft", "mod": "RN_US_Probes", "title": "Juno"}, {"name": "rn_ladee", "mod": "RN_US_Probes", "title": "Lunar Atmosphere Dust and Environment Explorer"}, {"name": "rn_ladee_scanner", "mod": "RN_US_Probes", "title": "Ladee/LRO Orbital Scanner"}, {"name": "rn_lcross_mb", "mod": "RN_US_Probes", "title": "LCROSS"}, {"name": "rn_lro", "mod": "RN_US_Probes", "title": "Lunar Reconnaissance Orbiter"}, {"name": "rn_messenger", "mod": "RN_US_Probes", "title": "MESSENGER"}, {"name": "rn_new_horizons", "mod": "RN_US_Probes", "title": "New Horizons"}], "upgrades": [], "grants": []}, "okb_firstSputniks": {"title": "First Soviet Satellites", "discipline": "Systems Integration", "color": "#ededed", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Sputnik — the beeping sphere that opened the space age — then the heavy Sputnik 2 and 3 that carried first a dog and then a laboratory into orbit while the West was still counting its failures.", "parts": [{"name": "sputnik1", "mod": "RN_Soviet_Probes", "title": "Sputnik 1"}, {"name": "sputnik2", "mod": "RN_Soviet_Probes", "title": "Sputnik 2"}, {"name": "sputnik3", "mod": "RN_Soviet_Probes", "title": "Sputnik 3 \"Object D\""}], "upgrades": [], "grants": []}, "okb_firstLuna": {"title": "First Lunar Probes", "discipline": "Systems Integration", "color": "#ededed", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "The first machines to leave Earth's pull for another world: Luna reaches escape velocity, strikes the Moon, and photographs its hidden far side for the first time in history.", "parts": [{"name": "luna2", "mod": "RN_Soviet_Probes", "title": "Luna E-1A"}, {"name": "luna3", "mod": "RN_Soviet_Probes", "title": "Luna 3"}], "upgrades": [], "grants": []}, "okb_earlyPlanetaryComsats": {"title": "Early Planetary Probes \u0026 Comsats", "discipline": "Systems Integration", "color": "#ededed", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Reach for the planets and wire the country together: Venera strikes out for Venus, Polyot manoeuvres in orbit, Molniya opens the high-latitude comms net and the first Proton payloads fly.", "parts": [{"name": "molniya1", "mod": "RN_Soviet_Probes", "title": "Molniya-1"}, {"name": "polyot", "mod": "RN_Soviet_Probes", "title": "Polyot"}, {"name": "polyot_side_engine", "mod": "RN_Soviet_Probes", "title": "Polyot Side Engine"}, {"name": "rn_protonn4_1", "mod": "RN_Soviet_Probes", "title": "Proton 1-3 N-4 Satellite"}, {"name": "rn_protonn6_4", "mod": "RN_Soviet_Probes", "title": "Proton 4 N-6 Satellite"}, {"name": "rn_venera1", "mod": "RN_Soviet_Probes", "title": "Venera 1/Mars 1M"}], "upgrades": [], "grants": []}, "okb_lunaLanders": {"title": "Luna Soft-Landers \u0026 Orbiters", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 300, "anyToUnlock": false, "flavor": "The first soft landing on another world and the first lunar orbiters: the Luna 9-13 family throttles down onto the regolith on an airbag-cushioned capsule, and circles the Moon returning data from orbit.", "parts": [{"name": "l11_astro", "mod": "RN_Soviet_Probes", "title": "Luna 11 Astro"}, {"name": "l11_radio", "mod": "RN_Soviet_Probes", "title": "Luna 11 Radio"}, {"name": "luna11_als", "mod": "RN_Soviet_Probes", "title": "Luna 11 ALS"}, {"name": "luna13_als", "mod": "RN_Soviet_Probes", "title": "Luna 13 ALS"}, {"name": "luna9_airbag_cvr", "mod": "RN_Soviet_Probes", "title": "Luna 9/13 Airbag Cover"}, {"name": "luna9_als", "mod": "RN_Soviet_Probes", "title": "Luna 9 ALS"}, {"name": "luna_als", "mod": "RN_Soviet_Probes", "title": "Luna 10 ALS"}, {"name": "luna_astro", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 Astro"}, {"name": "luna_ktdu", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 KTDU"}, {"name": "luna_radio", "mod": "RN_Soviet_Probes", "title": "Luna 9/10/13 Radio"}, {"name": "luna_vernier", "mod": "RN_Soviet_Probes", "title": "Luna Vernier"}], "upgrades": [], "grants": []}, "okb_modernComsats": {"title": "Modern Soviet \u0026 Russian Comsats", "discipline": "Systems Integration", "color": "#ededed", "tier": 10, "cost": 1000, "anyToUnlock": false, "flavor": "The operational communications constellation: Strela and its Gonets successors — the low-orbit store-and-forward bus that kept a continent's messages moving into the modern era.", "parts": [{"name": "rn_strela3_gonets", "mod": "RN_Soviet_Probes", "title": "Strela-3/Gonets-D1 Satellite Bus"}], "upgrades": [], "grants": []}, "pc_storables": {"title": "Nitric-Acid Storable Propellants", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "An oxidiser you can keep in the tank for months — fuming nitric acid — that ignites on contact with its fuel, so the engine needs no igniter and no turbopump. The chemistry of the first cheap storable rockets: the sounding motors that clear the Karman line and return the first data from the edge of space.", "parts": [{"name": "ROE-Aerobee", "mod": "ROEngines", "title": "Aerobee"}, {"name": "ROE-VeroniqueAK", "mod": "ROEngines", "title": "Véronique"}, {"name": "ROMeteoSustainer", "mod": "Squad", "title": "U-1250"}], "upgrades": [], "grants": []}, "fd_turbopumpFeed": {"title": "Turbopump Feed", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 2, "cost": 4, "anyToUnlock": true, "flavor": "Drive the propellants with a turbine-spun pump instead of tank pressure — the tank stops being a heavy pressure vessel and the chamber can run far harder than any sounding motor reaches. The step from a powder dart to the turbopump-fed V-2: a large liquid rocket at last.", "parts": [{"name": "ROE-A4", "mod": "ROEngines", "title": "Model 39"}, {"name": "ROE-A7", "mod": "ROEngines", "title": "NAA-75-110 A-Series"}, {"name": "ROE-RD100", "mod": "ROEngines", "title": "RD-100"}, {"name": "ROE-XLR41", "mod": "ROEngines", "title": "XLR41"}], "upgrades": [], "grants": []}, "fd_singleChamber": {"title": "Single-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "A single small chamber held stable by careful injector design — the first purpose-built kerosene-oxygen boosters a satellite could ride: Vanguard's X-405, and the Atlas sustainer that runs on to orbit after the boosters drop away.", "parts": [{"name": "ROE-LR105_2", "mod": "ROEngines", "title": "LR105"}, {"name": "ROE-X405", "mod": "ROEngines", "title": "X-405 (XLR50-GE-2)"}, {"name": "ROE-X405H", "mod": "ROEngines", "title": "X-405H"}], "upgrades": ["RFUpgrade_5D60", "RFUpgrade_A-7"], "grants": []}, "fd_largeChamber": {"title": "Combustion-Instability Damping", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Scale a single combustion chamber to a meganewton and its own acoustics threaten to tear it apart — injector design and damping hold the burn stable at a size the small chambers never faced. The hard way the West reached orbit: one big stable chamber, where the Soviets clustered many small ones. Atlas, Thor, Blue Streak.", "parts": [{"name": "ROE-LR79", "mod": "ROEngines", "title": "LR79"}, {"name": "ROE-LR89_2", "mod": "ROEngines", "title": "LR43/LR89"}, {"name": "ROE-RZ", "mod": "ROEngines", "title": "RZ.1/RZ.2"}], "upgrades": ["RFUpgrade_RD-103"], "grants": []}, "fd_orbitalSoviet": {"title": "Parallel Engine Clustering", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Twenty combustion chambers across four strap-on boosters and a core, all lit on the pad and synchronised — the R-7 that carried Sputnik to orbit. Brute multiplicity where the West built single chambers. Unflyable without vernier steering, which its engines carry built-in.", "parts": [{"name": "ROE-RD107", "mod": "ROEngines", "title": "RD-107/117"}, {"name": "ROE-RD108", "mod": "ROEngines", "title": "RD-108/118"}], "upgrades": [], "grants": []}, "fd_orbitalMultiChamber": {"title": "Multi-Chamber Combustion", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Scale the clustered-chamber approach to a meganewton — a bank of chambers on a common turbopump delivering booster thrust without ever risking one large unstable chamber. The storable orbital boosters (RD-211, YF-2) that lofted payloads on propellant you could keep in the tank for years.", "parts": [{"name": "ROE-RD211", "mod": "ROEngines", "title": "RD-211"}, {"name": "YF2_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-2 (no gimbal)"}, {"name": "YF2_with_shell", "mod": "KerwisChineseAerospacePack", "title": "YF-2 with Boattail"}], "upgrades": [], "grants": []}, "fd_matureOrbital": {"title": "High-Expansion Vacuum Nozzles", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 5, "cost": 80, "anyToUnlock": false, "flavor": "A nozzle bell too large to fire at sea level — the flow would rip away from the walls — but in vacuum it extracts every last metre-per-second from the exhaust. The dedicated upper-stage engines that let the R-7 reach past low orbit toward the Moon: high specific impulse where there is no air to fight.", "parts": [{"name": "ROE-RD0105", "mod": "ROEngines", "title": "RD-0105/0109"}, {"name": "ROE-RD0110", "mod": "ROEngines", "title": "RD-0107/0110"}, {"name": "ROE-RD109", "mod": "ROEngines", "title": "RD-109/119"}], "upgrades": [], "grants": []}, "fd_verniers": {"title": "Auxiliary-Chamber Thrust Vectoring", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "Steer and roll a large rocket in powered flight with small gimballed auxiliary chambers — full three-axis control, roll especially, before a single main engine can be trusted to gimbal for it. The R-7's verniers are integral to its engines, so you cannot fly the cluster without this; Atlas and Jupiter bolt theirs on.", "parts": [{"name": "ROE-JupiterVernier", "mod": "ROEngines", "title": "S-3D Vernier Exhaust"}, {"name": "ROE-LR101Inline_2", "mod": "ROEngines", "title": "LR101"}, {"name": "ROE-LR101_2", "mod": "ROEngines", "title": "LR101"}], "upgrades": [], "grants": []}, "cryo_hydrogen": {"title": "Cryogenic Hydrogen Handling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "No doctrine says burn kerosene first. Bet early on hydrogen: vacuum-jacketed tanks, multilayer insulation and enormous pumps for a low-density fuel, all for the highest specific impulse chemistry there is. It costs a whole node of program time up front just to commit — and this is that commitment.", "parts": [], "upgrades": [], "grants": []}, "cryo_hydroloxPrototype": {"title": "Hydrogen-Oxygen Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game.", "parts": [{"name": "ROE-RZ20", "mod": "ROEngines", "title": "RZ.20"}], "upgrades": [], "grants": []}, "cryo_expanderCycle": {"title": "Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene.", "parts": [{"name": "ROE-RL10Fixed", "mod": "ROEngines", "title": "RL-10 Series (Non-Extendable Nozzle)"}], "upgrades": [], "grants": []}, "pc_doubleBaseSolid": {"title": "Double-Base Solid Propellant", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Nitrocellulose plasticised with nitroglycerin and extruded into a grain that carries its own oxygen — the older solid chemistry: simple, dense, storable, lit once and done. The JATO boosters and the first Nike stages.", "parts": [{"name": "ROE-18KS7800", "mod": "ROEngines", "title": "Aerojet 1.8KS-7800"}, {"name": "ROE-R103", "mod": "ROEngines", "title": "R-103 Booster"}, {"name": "SnubOtron", "mod": "VenStockRevamp", "title": "Separation Motor (Small)"}, {"name": "sepMotor1", "mod": "Squad", "title": "Radial Separation Motor (Medium)"}, {"name": "sepMotorLarge", "mod": "Squad", "title": "Radial Separation Motor (Large)"}, {"name": "sepMotorSmall", "mod": "Squad", "title": "Radial Separation Motor (Small)"}], "upgrades": [], "grants": []}, "pc_doubleBaseBooster": {"title": "Double-Base Booster Grains", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "Cast a double-base grain large enough to boost a stack off the pad — case-bonded to the motor wall so it burns from the core out without cracking. The Nike booster and the heavy JATO units, where double-base is pushed to its size limit before composite takes over.", "parts": [{"name": "ROE-25KS18000", "mod": "ROEngines", "title": "Aerojet 2.5KS-18000"}, {"name": "ROE-Alcyone1", er and harder — but only once the chamber can survive it. Ninety percent is where the Soviets stopped, and it is worth a third more thrust than the engine they copied.", "parts": [], "upgrades": ["RFUpgrade_RD-101"], "grants": []}, "pc_rp1": {"title": "Narrow-Cut Refined Kerosene", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "Stop burning alcohol and burn kerosene — but not the kerosene an aeroplane gets. Distil a narrow cut, strip the sulphur, cap the aromatics, and specify it so tightly that it stops laying down carbon in the cooling passages on a long burn. The fuel becomes a component with a part number.", "parts": [], "upgrades": ["RFUpgrade_LR43-NA-3", "RFUpgrade_LR89-NA-3"], "grants": []}, "pc_hydyne": {"title": "Amine-Blend Booster Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "Blend an unsymmetrical hydrazine into diethylenetriamine and you get a fuel that outruns alcohol in the same tanks and the same engine — worth sixteen seconds of specific impulse for nothing but a change of what you pour in. It corrodes, it poisons, and the crews hated it; the first American satellite went up on it anyway.", "parts": [], "upgrades": ["RFUpgrade_A-6H"], "grants": []}, "pc_udmhBoosterFuel": {"title": "Neat Hydrazine-Derivative Fuel", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 6, "cost": 160, "anyToUnlock": false, "flavor": "Drop the diluent and feed the booster unsymmetrical dimethylhydrazine straight. It buys nearly twenty seconds over kerosene in the same chamber and costs you a fuel that burns on contact with almost anything, eats seals, and will kill a pad crew that gets careless with a coupling.", "parts": [], "upgrades": ["RFUpgrade_S-3FH"], "grants": []}, "pc_htp": {"title": "High-Test Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "Concentrated hydrogen peroxide decomposed across a silver catalyst into a hot oxidising gas — a storable oxidiser that needs no cryogenics and lights a kerosene engine cleanly. Britain's Gamma sustainers ran on it.", "parts": [{"name": "ROE-Gamma301", "mod": "ROEngines", "title": "Gamma-201/301"}], "upgrades": ["RFUpgrade_HTP"], "grants": []}, "pc_stentor": {"title": "Deep-Throttling Peroxide Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "A two-chamber peroxide engine whose small cruise chamber throttles deeply while a fixed chamber boosts — variable thrust from a storable propellant, built for a missile that had to coast and correct. (Britain's Stentor.)", "parts": [{"name": "ROE-Stentor", "mod": "ROEngines", "title": "Stentor Booster"}], "upgrades": [], "grants": []}, "met_stainlessSteel": {"title": "Austenitic Stainless Steel", "discipline": "Metallurgy", "color": "#8dadcc", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "Chromium-nickel steel that keeps its strength while hot and holds a higher chamber pressure without a thicker, heavier wall — the metallurgy that turned the V-2's chamber into the Redstone's. Push the pressure, take the thrust.", "parts": [], "upgrades": ["RFUpgrade_A-6", "RFUpgrade_AJ10-27", "RFUpgrade_Model39c", "RFUpgrade_RD-102", "RFUpgrade_RDA-1-150", "RFUpgrade_U-1700", "RFUpgrade_Veronique61", "RFUpgrade_XLR11-RM-5"], "grants": []}, "fd_injectors": {"title": "Impinging-Jet Injectors", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Aim paired fuel and oxidiser jets to collide and atomise on contact, across a flat plate drilled for even mixing over the whole injector face — more complete combustion, a little more specific impulse from the same propellants. Get it right and a small pressure-fed chamber burns clean enough to fly: the four-chamber engine of a rocket aeroplane, and  [{"name": "SXTAntenna", "mod": "SXT", "title": "Sputnik PS-1 Antenna"}, {"name": "SurfAntenna", "mod": "Squad", "title": "Communotron 16-S"}, {"name": "longAntenna", "mod": "Squad", "title": "Communotron 16"}, {"name": "nfex-antenna-rover-2", "mod": "NearFutureExploration", "title": "AX-5 Aerial Micro-Antenna"}], "upgrades": [], "grants": []}, "th_hermeticBus": {"title": "Hermetic Thermal-Control Bus", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 3, "cost": 15, "anyToUnlock": false, "flavor": "Seal the electronics in a pressurised sphere with a circulating gas and a polished radiating skin, holding them at room temperature through the swing from sunlight to shadow. Sputnik was mostly this: a bus that keeps its instruments alive.", "parts": [{"name": "ROT-ProbeCore", "mod": "ROTanks", "title": "Procedural Probe Core"}, {"name": "SXTSputnik", "mod": "SXT", "title": "Sputnik PS-1"}, {"name": "probeCoreSphere_v2", "mod": "Squad", "title": "Sputnik PS-1"}], "upgrades": ["MLI.Upgrade1"], "grants": []}, "elec_semiconductorDiode": {"title": "Semiconductor Diodes", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "A sliver of doped crystal that passes current one way only — grown up from the cat's-whisker radio detector into a rugged solid-state device. It lights an indicator on almost no power, and it is the seed of everything solid-state: rectifiers, transistors, the integrated circuit still to come. Microelectronics grows from here.", "parts": [{"name": "ROC-ApolloDockingLightBDB", "mod": "ROCapsules", "title": "Apollo Docking Spotlight"}, {"name": "ROC-ApolloEVALightBDB", "mod": "ROCapsules", "title": "Apollo EVA Spotlight"}, {"name": "SmallPointLight", "mod": "VenStockRevamp", "title": "MK 4 Point Light"}, {"name": "SmallSpotLight", "mod": "VenStockRevamp", "title": "MK 3 Mini Spotlight"}, {"name": "SmallStripLight", "mod": "VenStockRevamp", "title": "MK 5 Strip Light"}, {"name": "domeLight1", "m ": "parachuteLarge", "mod": "Squad", "title": "Mk16-XL Parachute"}, {"name": "parachuteRadial", "mod": "Squad", "title": "Mk2-R Radial-Mount Parachute"}, {"name": "parachuteSingle", "mod": "Squad", "title": "Mk16 Parachute"}], "upgrades": [], "grants": []}, "opt_filmReturn": {"title": "Film-Return Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture.", "parts": [{"name": "RP0-SampleReturnCapsule", "mod": "RP-1", "title": "Science Sample Return Capsule (DEPRECATED)"}, {"name": "RP0-SampleReturnCommand", "mod": "RP-1", "title": "Sample Return Command Module (DEPRECATED)"}, {"name": "science_module", "mod": "Squad", "title": "PH01 - Early Film Camera"}], "upgrades": [], "grants": []}, "opt_fineGrainEmulsion": {"title": "Fine-Grain Emulsion", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 2, "cost": 4, "anyToUnlock": false, "flavor": "Smaller silver-halide crystals record finer detail on the same frame, through the same lens — resolution bought in the darkroom rather than the optical shop. The penalty is speed: a slower emulsion needs a longer exposure, and a satellite does not hold still.", "parts": [{"name": "RO-BasicFilmCamera", "mod": "RP-1", "title": "PH02 - Basic Film Camera"}], "upgrades": [], "grants": []}, "opt_vidicon": {"title": "Vidicon Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Scan a photoconductive target with an electron beam and read the image off as a video signal — lower resolution than film, but it comes down the radio link the instant you take it. No capsule to recover.", "parts": [{"name": "RO-EarlyTVCamera", "mod": "RP-1", "title": "VI01 - Early Television Camera"}, {"nam , "grants": []}, "mic_magnetometer": {"title": "Fluxgate Magnetometry", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 4, "cost": 40, "anyToUnlock": false, "flavor": "Drive a soft-ferrite core in and out of saturation and read how the ambient field skews the cycle — a solid-state compass sensitive enough to map the planet's field from orbit, on a boom to escape the craft's own iron.", "parts": [{"name": "RO-EarlyMagnet", "mod": "RP-1", "title": "MG01 - Early Magnetometer"}], "upgrades": [], "grants": []}, "bio_cultures": {"title": "Space-Exposed Biology", "discipline": "Life Support", "color": "#f0508a", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Fly gels, spores and living cultures sealed in a capsule, then recover them to see what vacuum, cold and raw radiation did — the first read on whether anything alive survives above the atmosphere. The seed of every later life-sciences payload.", "parts": [{"name": "BioCapsule", "mod": "SXT", "title": "Advanced Biological Capsule"}, {"name": "GooExperiment", "mod": "Squad", "title": "Biological Sample Capsule"}, {"name": "SXTProbeGooo", "mod": "SXT", "title": "Biological Sample Capsule"}, {"name": "USGooBayWedge", "mod": "UniversalStorage2", "title": "Biological Sample Capsule"}], "upgrades": [], "grants": []}, "mic_atmoSounding": {"title": "Upper-Atmosphere Sounding", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "A wedge of thermometers, barometers and sample cells flown up a sounding rocket to log temperature, pressure and density where balloons can't reach — the first instruments to tell us what the air is doing at the edge of space.", "parts": [{"name": "USThermoBaroWedge", "mod": "UniversalStorage2", "title": "Atmospheric Science Unit"}], "upgrades": [], "grants": []}, "aero_subsonicWing": {"title": "Subsonic Aerodynamics", "discipline": "Aerodynamics", "color": "#5aa0e2", "tier": 1, "cost": 1, "anyToUnlock": false, "flavor": "Beyo
