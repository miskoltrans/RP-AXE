ecraft grew heavy enough to need more.", "parts": [{"name": "45DegreeRCS", "mod": "VenStockRevamp", "title": "RCS Quad, 45deg (275/445 N class)"}, {"name": "RCSBlock_275", "mod": "Squad", "title": "RCS Block [ 275/445 N Class]"}, {"name": "RO_RCSBlock_restock_275", "mod": "ReStockPlus", "title": "Angled RCS Block [ 275/445 N Class]"}, {"name": "SXTRCSRack", "mod": "SXT", "title": "Attitude Jet 3x (1.24/2 kN class)"}, {"name": "ca_RM02", "mod": "CoatlAerospace", "title": "CAE-RM02 RCS Thruster Block"}, {"name": "linearRcs", "mod": "Squad", "title": "Attitude Jet [550/890 N class]"}, {"name": "nflv-rcs-aero-heavy-1", "mod": "NearFutureLaunchVehicles", "title": "Aerodynamic RCS 4-Way [275/445 N Class]"}, {"name": "nflv-rcs-aero-heavy-2", "mod": "NearFutureLaunchVehicles", "title": "Aerodynamic RCS 4-Way [275/445 N Class]"}, {"name": "restock-rcs-block-dual-1", "mod": "ReStockPlus", "title": "RCS Dual [275/445 N Class]"}, {"name": "restock-rcs-block-quad-angled-1", "mod": "ReStockPlus", "title": "RCS Quad Angled [275/445 N Class]"}, {"name": "restock-rcs-block-quint-1", "mod": "ReStockPlus", "title": "RCS 5-Way [275/445 N Class]"}, {"name": "restock-rcs-block-triple-angled-1", "mod": "ReStockPlus", "title": "RCS Triple Angled [275/445 N Class]"}], "upgrades": [], "grants": []}, "gnc_fixedRcsCatalog": {"title": "Fixed Reaction-Control Block Catalog", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "The same catalog, scaled up — bigger blocks for spacecraft that outgrew the first size class. The procedural thruster stays the default; this is the shelf of named hardware for whoever wants the specific part.", "parts": [{"name": "HeavyRcs", "mod": "VenStockRevamp", "title": "RCS Quad (550/890 N class)"}, {"name": "RCSBlock_1100", "mod": "Squad", "title": "RCS Block [1100/1780 N Class]"}, {"name": "RCSBlock_2200", "mod": "Squad", "title": "RCS Block [2200/3560 N Class]"}, {"name": "RCSBlock_413", "mod": "Squad", "title": "RCS Block [ 413/668 N Class]"}, {"name": "RCSBlock_550", "mod": "Squad", "title": "RCS Block [ 550/890 N Class]"}, {"name": "RCSBlock_825", "mod": "Squad", "title": "RCS Block [ 825/1335 N Class]"}, {"name": "ROC-ApolloRCS", "mod": "ROCapsules", "title": "Apollo Service Module RCS Block"}, {"name": "ROC-D2RCS", "mod": "ROCapsules", "title": "D-2 Service Module RCS block"}, {"name": "ROC-LEMTruckRCS3BDB", "mod": "ROCapsules", "title": "AES LM Truck 3x RCS Cluster"}, {"name": "ROC-LEMTruckRCS4BDB", "mod": "ROCapsules", "title": "AES LM Truck 4x RCS Cluster"}, {"name": "ROC-MercuryRCS2BDB", "mod": "ROCapsules", "title": "Mercury Landing and Control Module"}, {"name": "RO_RCSBlock_restock_1100", "mod": "ReStockPlus", "title": "Angled RCS Block [1100/1780 N Class]"}, {"name": "RO_RCSBlock_restock_2200", "mod": "ReStockPlus", "title": "Angled RCS Block [2200/3560 N Class]"}, {"name": "RO_RCSBlock_restock_413", "mod": "ReStockPlus", "title": "Angled RCS Block [ 413/668 N Class]"}, {"name": "RO_RCSBlock_restock_550", "mod": "ReStockPlus", "title": "Angled RCS Block [ 550/890 N Class]"}, {"name": "RO_RCSBlock_restock_825", "mod": "ReStockPlus", "title": "Angled RCS Block [ 825/1335 N Class]"}], "upgrades": [], "grants": []}, "fd_continuousThrottleDescent": {"title": "Continuous-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Fly the last stretch of a landing on gimbaled, throttleable liquid thrusters that can be told to slow down instead of just shutting off. The generic hardware behind any soft landing — the historical Surveyor-branded version of this same engine ships separately, through the charter.", "parts": [{"name": "ROE-MR80TDE", "mod": "ROEngines", "title": "MR-80 (TDE)"}, {"name": "ROE-TD339", "mod": "ROEngines", "title": "TD-339"}], "upgrades": [], "grants": []}, "cmp_airbagTouchdown": {"title": "Airbag-Cushioned Touchdown", "discipline": "Composite Materials", "color" ts": [{"name": "RO-MIMS", "mod": "RP-1", "title": "MS02 - Magnetic Ion-Mass Spectrometer (MIMS)"}, {"name": "RO-QuadropoleMassSpectrometer", "mod": "RP-1", "title": "MS03 - Quadropole Mass Spectrometer"}], "upgrades": [], "grants": []}, "opt_multiSpectralImaging": {"title": "Multi-Spectral Imaging", "discipline": "Optics \u0026 Photonics", "color": "#7c8cff", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Capture several wavelength bands of the same scene at once instead of one — a surface picked apart by what it reflects in each band, not just what it looks like.", "parts": [{"name": "dmUS2ImagingPlatform", "mod": "", "title": ""}], "upgrades": [], "grants": []}, "rob_heavyRotorActuation": {"title": "Heavy-Duty Rotor Actuation", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "The same brushless motor and controller, built to carry real load instead of just proving the concept — a rotor that can turn a solar array or an antenna mount, not just a test rig.", "parts": [{"name": "rotor_02", "mod": "SquadExpansion", "title": "EM-32 Standard Rotor"}, {"name": "rotor_02s", "mod": "SquadExpansion", "title": "EM-32S Standard Rotor"}, {"name": "rotor_03", "mod": "SquadExpansion", "title": "EM-64 Heavy Rotor"}, {"name": "rotor_03s", "mod": "SquadExpansion", "title": "EM-64S Heavy Rotor"}], "upgrades": [], "grants": []}, "rob_hingeActuation": {"title": "Hinged Joint Actuation", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Limit the same servo to a fixed arc instead of a full turn — a joint that folds and locks rather than spins, the shape a deployable panel or an arm elbow actually needs.", "parts": [{"name": "hinge_01", "mod": "SquadExpansion", "title": "G-11 Hinge"}, {"name": "hinge_01_s", "mod": "SquadExpansion", "title": "G-00 Hinge"}, {"name": "hinge_03", "mod": "SquadExpansion", "title": "G-12L Alligator Hinge"}, {"name": "hinge_03_s", "mod": "SquadExpansion", "title": "G-01L Alligator Hinge"}, {"name": "hinge_04", "mod": "SquadExpansion", "title": "G-32W Hinge"}], "upgrades": [], "grants": []}, "rob_linearActuation": {"title": "Linear Servo Extension", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Turn the same rotary motor into a push instead of a spin — a telescoping actuator that extends a boom or a leg exactly as far as commanded, then holds it there.", "parts": [{"name": "piston_01", "mod": "SquadExpansion", "title": "3P6 Hydraulic Cylinder"}, {"name": "piston_02", "mod": "SquadExpansion", "title": "1P2 Hydraulic Cylinder"}, {"name": "piston_03", "mod": "SquadExpansion", "title": "3PT Telescoping Hydraulic Cylinder"}, {"name": "piston_04", "mod": "SquadExpansion", "title": "1P4 Telescoping Hydraulic Cylinder"}], "upgrades": [], "grants": []}, "rob_precisionRotationServo": {"title": "Precision Rotation Servo", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Close the loop on the same motor with real position and speed feedback — commanded to an exact angle and held there, not just spun and hoped for.", "parts": [{"name": "rotoServo_00", "mod": "SquadExpansion", "title": "Rotation Servo M-06"}, {"name": "rotoServo_02", "mod": "SquadExpansion", "title": "Rotation Servo F-12"}, {"name": "rotoServo_03", "mod": "SquadExpansion", "title": "Rotation Servo M-12"}, {"name": "rotoServo_04", "mod": "SquadExpansion", "title": "Rotation Servo M-25"}], "upgrades": [], "grants": []}, "rob_sequencedControl": {"title": "Programmable Actuator Sequencing", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "One controller that steps every hinge, piston and rotor through an ordered sequence on command — deployment stops being one actuator at a time and becomes a single scripted motion.", "parts": [{"name": "controller1000", "mod": "SquadExpansion", "title": "KAL-1000 Controller"}], "upgrades": [], "grants": []}, "rob_surfaceMobility": {"title": "Wheel-Hub Motor Drive", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Put the same motor in a wheel hub and drive instead of just standing there — a lander that can cross the ground it touched down on, not just sit and look at it.", "parts": [{"name": "KF-WheelSmall", "mod": "KerbalFoundries", "title": "KF Small Rover Wheel"}, {"name": "KF-WheelTiny", "mod": "KerbalFoundries", "title": "KF  Tiny Rover Wheel"}, {"name": "roverBody_v2", "mod": "Squad", "title": "Probodobodyne RoveMate"}, {"name": "roverWheel1", "mod": "Squad", "title": "RoveMax Model M1"}, {"name": "roverWheel2", "mod": "Squad", "title": "RoveMax Model S2"}], "upgrades": [], "grants": []}, "rob_heavyWheelDrive": {"title": "Heavy-Class Wheel Drive", "discipline": "Robotics", "color": "#d98c2b", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "The same wheel-hub motor, scaled up for a heavier chassis — plus a passive skid to steady a long rover without spending another drive on it.", "parts": [{"name": "KF-Skid", "mod": "KerbalFoundries", "title": "KF Skid"}, {"name": "KF-WheelLarge", "mod": "KerbalFoundries", "title": "KF Large Wheel"}, {"name": "KF-WheelMedium", "mod": "KerbalFoundries", "title": "KF Medium Wheel"}, {"name": "KF-WheelTruck-Dual", "mod": "KerbalFoundries", "title": "KF Truck Wheel - Dual"}, {"name": "KF-WheelTruck-Single", "mod": "KerbalFoundries", "title": "KF Truck Wheel - Single"}], "upgrades": [], "grants": []}, "rob_trackDrive": {"title": "Continuous-Track Drive", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Wrap the same motor in a loop of tread instead of a wheel — more contact area for soft ground, at the cost of more rolling resistance and moving parts.", "parts": [{"name": "KF-TrackMedium", "mod": "KerbalFoundries", "title": "KF Medium track"}, {"name": "KF-TrackSimple", "mod": "KerbalFoundries", "title": "KF Simple Track"}, {"name": "KF-TrackSmall", "mod": "KerbalFoundries", "title": "KF Small track"}, {"name": "KF-TrackSurface", "mod": "KerbalFoundries", "title": "KF Surface track"}, {"name": "KF-TrackTiny", "mod": "KerbalFoundries", "title": "KF RBI Tiny Track"}], "upgrades": [], "grants": []}, "rob_heavyTrackDrive": {"title": "Heavy-Class Track Drive", "discipline": "Robotics", "color": "#d98c2b", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "The same tread mechanism, built for a bigger and heavier vehicle — including a track meant to dig into and displace the ground rather than just roll over it.", "parts": [{"name": "KF-TrackInverting", "mod": "KerbalFoundries", "title": "KF-RBI Inverting Track"}, {"name": "KF-TrackLong", "mod": "KerbalFoundries", "title": "KF Long Track"}, {"name": "KF-TrackMole", "mod": "KerbalFoundries", "title": "KF-RBI Mole Track"}], "upgrades": [], "grants": []}, "rob_screwDrive": {"title": "Archimedes Screw Propulsion", "discipline": "Robotics", "color": "#d98c2b", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Wind a helical fin around a rotating drum and it corkscrews forward through mud, snow or water alike, where a wheel or a track would just dig in and stop.", "parts": [{"name": "KF-ScrewDrive", "mod": "KerbalFoundries", "title": "KF Screw Drive"}], "upgrades": [], "grants": []}, "str_fuelCrossfeed": {"title": "Inter-Tank Fuel Crossfeed", "discipline": "Structures \u0026 Mechanisms", "color": "#bfb08d", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Pipe propellant across a strut between two tanks still bolted together — drain the strap-on boosters first and keep the core stage topped off, so when the boosters finally drop away the core is still full. Asparagus staging: three half-empty cores flying like one that never emptied at all.", "parts": [{"name": "fuelLine", "mod": "Squad", "title": "FTX-2 External Fuel Duct"}], "upgrades": [], "grants": []}, "tel_realAntennaTelemetry": {"title": "Modeled Antenna Telemetry", "discipline": "Telecommunications", "color": "#3f7bf5", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A comms antenna simulated as a real system — gain, pattern and tracking modelled, not just a data-rate number — the same telemetry hardware whichever crewed vehicle happens to carry it.", "parts": [{"name": "ROC-DynaAntenna", "mod": "ROCapsules", "title": "DynaSoar Telemetry Antenna"}, {"name": "ROC-GeminiAntenna", "mod": "ROCapsules", "title": "Gemini Antenna"}, {"name": "ROC-GeminiAntennaBDB", "mod": "ROCapsules", "title": "Gemini UHF Whip Antenna"}], "upgrades": [], "grants": []}, "cmp_lunarReturnAblator": {"title": "Lunar-Return Ablator Rating", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Rate the same ablator for a translunar-return entry instead of a low-orbit one — the ladder's next real step is speed, not shape, and it doesn't care which airframe it's bolted to.", "parts": [{"name": "ROC-ApolloForwardHSBDB", "mod": "ROCapsules", "title": "Apollo Command Module Forward Heat Shield"}, {"name": "ROC-ApolloHSBDB", "mod": "ROCapsules", "title": "Apollo Command Module Heatshield"}, {"name": "ROC-GeminiHSLunarBDB", "mod": "ROCapsules", "title": "Gemini Lunar Heatshield"}], "upgrades": ["EarlyLunarHS"], "grants": []}, "cmp_lunarLandingAblator": {"title": "Refined Ablator Formulation", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Push the same ablator formulation a margin further — the heat load of an actual landing-and-return mission rather than a single translunar pass, still bolted to whichever airframe happens to need it.", "parts": [], "upgrades": ["LunarHS"], "grants": []}, "nuc_isotopePower": {"title": "Radioisotope Thermoelectric Power", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Stack thermocouples across a radioactive pellet and draw current straight from the heat of its own decay — power with no sun angle and no moving part, fuelled with whatever isotope happens to be on hand. Polonium-210 proves the generator works; it does not prove it lasts — the source itself is mostly spent within a season.", "parts": [{"name": "RO-SNAP-3-RTGPo210", "mod": "VenStockRevamp", "title": "SNAP-3A Series RTG (Po210)"}], "upgrades": [], "grants": []}, "nuc_isotopePowerII": {"title": "Long-Lived Isotope Power", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Swap in plutonium-238 for the same generator and the output barely sags in a decade instead of collapsing in a season — the fuel choice that turns a demonstration into a power source you can fly past the orbit of Mars and still hear from.", "parts": [{"name": "RO-SNAP-19-RTG", "mod": "VenStockRevamp", "title": "SNAP-19 Series RTG"}, {"name": "RO-SNAP-9-RTG", "mod": "VenStockRevamp", "title": "SNAP-9 Series RTG"}, {"name": "ROC-LEMFoldingSNAP27BDB", "mod": "ROCapsules", "title": "SNAP-27 Series RTG"}, {"name": "ROC-LEMRackSNAP9BDB", "mod": "ROCapsules", "title": "Quad SNAP-9 Series RTG"}, {"name": "ca_rtg2000", "mod": "CoatlAerospace", "title": "Pioneer SNAP-19 RTG"}, {"name": "nfe-rtg-snap27-1", "mod": "NearFutureElectrical", "title": "SNAP-27 Series RTG"}, {"name": "rtgMini", "mod": "VenStockRevamp", "title": "SNAP-3B Series RTG (Pu238)"}], "upgrades": [], "grants": []}, "av_mach2Turbojet": {"title": "Sustained-Cruise Afterburning Turbojet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Push the afterburning and variable-stator tricks together into one engine built for sustained Mach 2 cruise, not just a burst through the transonic wall — Concorde's Olympus, the MiG-21's R-13, the MiG-25's R-15.", "parts": [{"name": "RO-Olympus593", "mod": "Squad", "title": "Olympus 593 Turbojet"}, {"name": "RO-R13", "mod": "Squad", "title": "R-13 Turbojet"}, {"name": "RO-R15BD", "mod": "Squad", "title": "R-15 Turbojet"}, {"name": "RO-R25F", "mod": "Squad", "title": "R-25 Turbojet"}, {"name": "nfa-turbofan-25-2", "mod": "NearFutureAeronautics", "title": "Olympus 593 Turbojet"}, {"name": "nfa-turbojet-25-1", "mod": "NearFutureAeronautics", "title": "GE4 Turbojet"}], "upgrades": [], "grants": []}, "av_dedicatedLiftJet": {"title": "Dedicated Lift Jet", "discipline": "Air-Breathing Propulsion", "color": "#6cc4b0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "A turbojet built to point straight down and do nothing but hold a hover — no forward thrust to speak of, the whole engine is the vertical-lift half of a VTOL aircraft.", "parts": [{"name": "nfa-vtol-0625-1", "mod": "NearFutureAeronautics", "title": "RB.162 Turbojet"}, {"name": "nfa-vtol-125-1", "mod": "NearFutureAeronautics", "title": "2x RB.162 Turbojet"}], "upgrades": [], "grants": []}, "gnc_reactionWheelAttitude": {"title": "Reaction-Wheel Attitude Control", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Spin a flywheel up or down and the whole spacecraft turns the other way — attitude held and changed with no propellant spent at all, as long as a star tracker keeps telling it which way it's actually pointed.", "parts": [{"name": "SXTAlouetteI", "mod": "SXT", "title": "Alouette Core"}, {"name": "ca_rw_medium", "mod": "CoatlAerospace", "title": "RW-2A Radial Reaction Wheel Assembly"}, {"name": "ca_rw_small", "mod": "CoatlAerospace", "title": "RW4 Radial Reaction Wheel"}, {"name": "ca_rw_xsmall", "mod": "CoatlAerospace", "title": "RW1 Radial Reaction Wheel"}, {"name": "ca_startrack", "mod": "CoatlAerospace", "title": "CA-ACS 'StarTrack' Attitude Control System"}, {"name": "sasModule", "mod": "Squad", "title": "Small Inline Reaction Wheel"}], "upgrades": [], "grants": []}, "th_activeLouvers": {"title": "Active Thermal Louvers", "discipline": "Thermodynamics", "color": "#f4813a", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Blades that open to radiate heat away and close to hold it in, driven by the bus temperature itself — the hermetic sphere's fixed skin becomes a thermostat instead of a single fixed compromise.", "parts": [{"name": "ca_louver_s", "mod": "CoatlAerospace", "title": "CA-TCL4 Thermal Control Louver"}, {"name": "ca_louver_s2", "mod": "CoatlAerospace", "title": "CA-TCL4-B Thermal Control Louver"}], "upgrades": [], "grants": []}, "int_compactCrewPod": {"title": "Minimal Life-Support Cabin", "discipline": "Systems Integration", "color": "#ededed", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "The smallest sealed cabin that still keeps a single Kerbal alive and working — no service module, no full capsule program, just a can with a hatch and an experiment slot built in.", "parts": [{"name": "ROC-LEMAscentBDB", "mod": "ROCapsules", "title": "Apollo LM Ascent Stage"}, {"name": "landerCabinMedium", "mod": "Squad", "title": "Mk1 Lander Can Advanced"}, {"name": "landerCabinSmall", "mod": "Squad", "title": "Mk1 Lander Can"}], "upgrades": [], "grants": []}, "fd_deepThrottleLanding": {"title": "Deep-Throttle Descent", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once - or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people.", "parts": [{"name": "RO-KTDU417", "mod": "Squad", "title": "KTDU-417"}, {"name": "ROC-LEMLMAEBDB", "mod": "ROCapsules", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROC-LEMLMDEBDB", "mod": "ROCapsules", "title": "Lunar Module Descent Engine (LMDE)"}, {"name": "ROE-LMAE", "mod": "ROEngines", "title": "Lunar Module Ascent Engine (LMAE)"}, {"name": "ROE-LMDE", "mod": "ROEngines", "title": "Lunar Module Descent Engine (LMDE)"}], "upgrades": [], "grants": []}, "fd_lunarSurfaceMobility": {"title": "Powered Hop Transit", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 10, "cost": 1300, "anyToUnlock": false, "flavor": "Once you are down, get around - a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints.", "parts": [{"name": "ROC-LEMRover", "mod": "ROCapsules", "title": "Apollo Lunar Roving Vehicle (LRV)"}, {"name": "ROC-LFVBDB", "mod": "ROCapsules", "title": "Lunar Flying Vehicle"}], "upgrades": ["RFUpgrade_LMDE-J"], "grants": []}, "fd_gasGeneratorApex": {"title": "Diminishing-Return Thrust Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "One more percent of thrust from a cycle with nothing left to give. The mightiest engine ever built is also the end of its line - spend a whole tier here and you have bought a rounding error while staged combustion and hydrolox walk past you.", "parts": [], "upgrades": ["RFUpgrade_F-1-1.52M", "RFUpgrade_F-1A"], "grants": []}, "fd_matureKeroloxClusterUprating": {"title": "Mature Kerolox Cluster Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Refine the whole family of clustered gas-generator kerolox boosters mark by mark - more thrust, longer service life, no change to the chemistry. The same diminishing-return story as F-1's own trap, one tier over, for its smaller siblings.", "parts": [], "upgrades": ["RFUpgrade_E-1-575k", "RFUpgrade_E-1-Upgrade2", "RFUpgrade_E-1A_KS", "RFUpgrade_H-1-205K", "RFUpgrade_H-1-250K", "RFUpgrade_H-2-300K", "RFUpgrade_RS-27"], "grants": []}, "cryo_gasGeneratorHydrolox": {"title": "Gas-Generator Hydrolox Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed - trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be.", "parts": [{"name": "ROC-D2AJ10-133", "mod": "ROCapsules", "title": "AJ10-133-LH"}, {"name": "ROE-HM7", "mod": "ROEngines", "title": "HM-7"}, {"name": "ROE-J2", "mod": "ROEngines", "title": "J-2"}, {"name": "YF75D_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}, {"name": "YF75_Engine", "mod": "KerwisChineseAerospacePack", "title": "YF-75"}], "upgrades": ["RFUpgrade_LR87-LH2-SustainerUpgrade", "RFUpgrade_LR87-LH2-Vacuum", "RFUpgrade_LR87-LH2-VacuumUpgrade", "RFUpgrade_RZ20-Mk2"], "grants": []}, "cryo_largeHydrolox": {"title": "Hydrolox Thrust Ceiling", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Scale the gas-generator hydrolox engine until it rivals a kerolox booster - a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line.", "parts": [{"name": "ROE-M1", "mod": "ROEngines", "title": "M-1"}], "upgrades": ["RFUpgrade_J-2-225K", "RFUpgrade_J-2-230K"], "grants": []}, "cryo_refinedExpander": {"title": "Refined Expander-Cycle Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Wring more specific impulse out of the closed expander cycle - hotter, tighter plumbing on the efficient small upper stage.", "parts": [], "upgrades": ["RFUpgrade_RL10A-3-3", "RFUpgrade_RL10A-3-3A", "RFUpgrade_RL10A-3-7", "RFUpgrade_RL10A-3-9"], "grants": []}, "pc_n1ClosedCycle": {"title": "Subcooled-Propellant Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale - the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did.", "parts": [{"name": "ROE-NK33", "mod": "ROEngines", "title": "NK-15/33"}, {"name": "ROE-NK43", "mod": "ROEngines", "title": "NK-15V/43"}, {"name": "SXTNK21BlockV", "mod": "SXT", "title": "N1 Block V"}], "upgrades": ["RFUpgrade_11D33", "RFUpgrade_11D33M", "RFUpgrade_NK-19", "RFUpgrade_NK-21", "RFUpgrade_RD-58"], "grants": []}, "pc_protonStagedCombustion": {"title": "Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 8, "cost": 2100, "anyToUnlock": false, "flavor": "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying.", "parts": [{"name": "ROE-RD0210", "mod": "ROEngines", "title": "RD-0208/0210"}, {"name": "ROE-RD254", "mod": "ROEngines", "title": "RD-254"}, {"name": "ROE-RD275", "mod": "ROEngines", "title": "RD-253/RD-275"}], "upgrades": [], "grants": []}, "pc_refinedStorableORSC": {"title": "Refined Storable Staged Combustion", "discipline": "Propellant Chemistry", "color": "#e5533b", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Squeeze the storable staged-combustion boosters a little further - Mk-II chambers, higher flow, the same dependable poison.", "parts": [], "upgrades": ["RFUpgrade_RD-0203U", "RFUpgrade_RD-0210", "RFUpgrade_RD-0212", "RFUpgrade_RD-0213", "RFUpgrade_RD-0214", "RFUpgrade_RD-253-Mk2", "RFUpgrade_RD-254-11D44-Mk2"], "grants": []}, "nuc_nuclearThermalRocket": {"title": "Solid-Core Nuclear Thermal Propulsion", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Heat liquid hydrogen in a fission reactor and blow it out a nozzle - twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here.", "parts": [{"name": "KIWIA24", "mod": "Squad", "title": "Kiwi A3 Atomic Rocket Motor"}, {"name": "KIWIB48", "mod": "Squad", "title": "Kiwi B4E Atomic Rocket Motor"}], "upgrades": [], "grants": []}, "nuc_nuclearRamjet": {"title": "Reactor-Heated Ramjet", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 9, "cost": 1700, "anyToUnlock": false, "flavor": "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest - an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose.", "parts": [{"name": "RO-A136", "mod": "Squad", "title": "A-136 Nuclear Turbo-Ramjet"}], "upgrades": [], "grants": []}, "gnc_interplanetaryAvionics": {"title": "Long-Duration Cruise Guidance", "discipline": "Guidance \u0026 Control", "color": "#8a5cd6", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet.", "parts": [], "upgrades": [], "grants": ["Science-Core-interplanetaryProbes"]}, "elec_integratedCircuit": {"title": "Monolithic Integrated Circuits", "discipline": "Microelectronics", "color": "#c2a0e0", "tier": 7, "cost": 2300, "anyToUnlock": false, "flavor": "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires.", "parts": [], "upgrades": [], "grants": []}, "comp_digitalGuidanceComputer": {"title": "Digital Guidance Computer", "discipline": "Computing", "color": "#d13bc4", "tier": 8, "cost": 2 ck and large-fuselage airframe structure, each already proven separately, converge here for the first time into one reusable machine.", "parts": [{"name": "mk3CargoBayL", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-100"}, {"name": "mk3CargoBayM", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-50"}, {"name": "mk3CargoBayS", "mod": "Squad", "title": "Mk3 Cargo Bay CRG-25"}, {"name": "mk3CargoRamp", "mod": "Squad", "title": "Mk3 Cargo Ramp"}, {"name": "mk3Cockpit_Shuttle", "mod": "Squad", "title": "Mk3 Cockpit"}, {"name": "mk3CrewCabin", "mod": "Squad", "title": "Mk3 Passenger Module"}], "upgrades": [], "grants": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
