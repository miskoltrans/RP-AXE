ss cockpits and their own service modules, flown by contractors rather than a single national programme.", "parts": [{"name": "ROC-CSTCM", "mod": "ROCapsules", "title": "CST-100 Command Module"}, {"name": "ROC-CSTSM", "mod": "ROCapsules", "title": "CST-100 Service Module"}, {"name": "ROC-OrionCM", "mod": "ROCapsules", "title": "Orion Command Module"}], "upgrades": [], "grants": [], "experiments": []}, "cmp_inflatableDecelerator": {"title": "Inflatable Aerodynamic Decelerator", "discipline": "Composite Materials", "color": "#9caf6a", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Slow down with an umbrella instead of a wall. An inflatable heat shield deploys a wide, soft aeroshell that decelerates a heavy payload high in a thin atmosphere — the HIAD, the way to land tonnes on Mars where a rigid shield can't be built big enough.", "parts": [{"name": "ROH-AdjustableHIAD", "mod": "ROHeatshields", "title": "Adjustable HIAD"}], "upgrades": ["Inflatable"], "grants": [], "experiments": []}, "nuc_modernFissionReactor": {"title": "Compact Fission Power Reactor", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 11, "cost": 1044, "anyToUnlock": false, "flavor": "Compact fission power for the surface and deep space, sized to the mission — a few to a few hundred kilowatts from a reactor that fits on a lander. Kilopower, SAFE-400 and their kin: the power source a crewed base or a nuclear-electric tug runs on, past what any array or isotope pellet delivers.", "parts": [{"name": "RO-reactor-RAPIDL", "mod": "NearFutureElectrical", "title": "RAPID-L Nuclear Reactor"}, {"name": "RO-reactor-SAFE400", "mod": "NearFutureElectrical", "title": "NASA SAFE-400 Nuclear Reactor"}, {"name": "RO-reactor-kilopower", "mod": "NearFutureElectrical", "title": "NASA Kilopower 10kWe Reactor"}, {"name": "RO-reactor-prometheus", "mod": "NearFutureElectrical", "title": "Prometheus 200 KWe Nuclear Reactor"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_fissilePropellantMagazine": {"title": "Fissile Propellant Magazine", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Storing the fuel for a nuclear engine — fissile-material magazines that feed a fission-fragment or gas-core drive, the tankage an advanced nuclear stage carries its reactor charge in.", "parts": [{"name": "fft-fueltank-fission-25-1", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-25-2", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Medium)"}, {"name": "fft-fueltank-fission-25-3", "mod": "FarFutureTechnologies", "title": "10 m Fissiles Tank (Short)"}, {"name": "fft-fueltank-fission-5-1", "mod": "FarFutureTechnologies", "title": "20 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-5-2", "mod": "FarFutureTechnologies", "title": "20 m Fissiles Tank (Short)"}, {"name": "fft-fueltank-fission-radial-1", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Long)"}, {"name": "fft-fueltank-fission-radial-2", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Medium)"}, {"name": "fft-fueltank-fission-radial-3", "mod": "FarFutureTechnologies", "title": "3.2 m Fissiles Tank (Short)"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_fuelReprocessing": {"title": "Nuclear Fuel Reprocessing", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "A power reactor fills with fission products as it runs, and its enriched-uranium charge burns down — left alone it has a fixed lifespan. Fuel drums top the charge back up, and a reprocessor pulls the still-fissile material out of spent fuel to load again — the difference between a plant a crew has to replace and one they keep running on station for years.", "parts": [{"name": "nuclear-recycler-25", "mod": "NearFutureElectrical", "title": "Whirlijig Nuclear Reprocessor"}, {"name": "nuclearfuel-0625", "mod": "NearFutureElectrical", "title": "MF-0 Nuclear Fuel Drum"}, {"name": "nuclearfuel-125", "mod": "NearFutureElectrical", "title": "MF-1 Nuclear Fuel Drum"}, {"name": "nuclearfuel-25", "mod": "NearFutureElectrical", "title": "MF-2 Nuclear Fuel Drum"}], "upgrades": [], "grants": [], "experiments": []}, "cryo_combustionTapOff": {"title": "Combustion Tap-Off Cycle", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Skip the separate gas-generator combustor entirely — bleed hot gas straight off the main chamber wall to spin the turbopump, then dump it overboard. Simpler than a gas generator, cheaper than staged combustion: the operational middle path Blue Origin bet New Shepard and New Glenn's upper stage on.", "parts": [{"name": "ROE-BE3", "mod": "ROEngines", "title": "BE-3PM"}], "upgrades": ["RFUpgrade_RS-68A"], "grants": [], "experiments": []}, "cryo_highThrustExpander": {"title": "Higher-Thrust Closed Expander", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Scale the closed expander cycle past the RL-10's own ceiling — two parallel American and European programs converge on the same bigger turbopump, the same clean cycle, roughly triple the thrust.", "parts": [{"name": "ROE-MB35", "mod": "ROEngines", "title": "MB-35"}, {"name": "ROE-MB60", "mod": "ROEngines", "title": "MB-60"}, {"name": "cryoengine-pavonis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}, {"name": "cryoengine-tharsis-1", "mod": "CryoEngines", "title": "RL60/Vinci"}], "upgrades": ["RFUpgrade_CECE-High", "RFUpgrade_RD-0146D", "RFUpgrade_RL10A-3-9"], "grants": [], "experiments": []}, "cryo_smallScaleMethalox": {"title": "Small-Scale Methalox Upper Stage", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "A simpler, plainer methalox debut at small scale — no staged-combustion preburner, just a clean upper-stage engine sized for a commercial small-satellite launcher. The unglamorous sibling to the booster-scale methalox story unfolding one node over.", "parts": [{"name": "cryoengine-buzzard-1", "mod": "CryoEngines", "title": "M10"}], "upgrades": ["RFUpgrade_CECE-Methane", "RFUpgrade_CH4+O2"], "grants": [], "experiments": []}, "cryo_fullFlowMethaloxII": {"title": "Matured Full-Flow Staged Combustion", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "The third pass at a cycle where both propellants run through their own preburners and nothing is thrown away. Parts count falls, the plumbing that made the first version a nightmare is machined out of the casting, and thrust climbs twenty percent because the engine finally stops being the reason to hold the schedule.", "parts": [], "upgrades": ["RFUpgrade_Raptor-3", "RFUpgrade_Raptor-3V"], "grants": [], "experiments": []}, "cryo_expanderBoosterScale": {"title": "Expander-Bleed Cycle at Booster Scale", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Vent a little of the cooling-jacket gas overboard instead of routing every drop through the turbopump, and the expander cycle's thrust ceiling — always capped by a small upper-stage engine's own heat-exchange area — breaks wide open. The expander cycle finally reaches core-stage scale.", "parts": [{"name": "cryoengine-fuji-1", "mod": "CryoEngines", "title": "LE-9"}], "upgrades": ["RFUpgrade_RL10A-5", "RFUpgrade_Vinci-180"], "grants": [], "experiments": []}, "cryo_fullFlowMethalox": {"title": "Full-Flow Staged-Combustion Methalox", "discipline": "Cryogenics", "color": "#37c6e8", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Burn both turbopump drive-gas streams through combustion at once — a fuel-rich preburner AND an oxidiser-rich preburner, nothing vented overboard at all. The thermodynamic endpoint of the staged-combustion idea, and the only cycle that ever reached it in metal.", "parts": [{"name": "ROE-Raptor", "mod": "ROEngines", "title": "Raptor (Surface Variant)"}, {"name": "ROE-RaptorVac", "mod": "ROEngines", "title": "Raptor-Vacuum"}, {"name": "cryoengine-eagle-1", "mod": "CryoEngines", "title": "Raptor-Vacuum"}], "upgrades": [], "grants": [], "experiments": []}, "fd_reusableGasGenKerolox": {"title": "Reusable Gas-Generator Kerolox", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "After a whole tree of gas-generator kerolox engines chasing diminishing returns while staged combustion walked past, one company bets the other way: keep the simple open cycle, keep it deliberately unglamorous, and win on cost and reusability instead of chasing one more second of Isp.", "parts": [{"name": "ROE-Merlin1A", "mod": "ROEngines", "title": "Merlin 1A"}, {"name": "ROE-Merlin1C", "mod": "ROEngines", "title": "Merlin 1C"}, {"name": "ROE-Merlin1CV", "mod": "ROEngines", "title": "Merlin 1C Vacuum"}], "upgrades": ["RFUpgrade_Merlin1C", "RFUpgrade_Merlin1CVac", "RFUpgrade_RP-1+O2", "RFUpgrade_Syntin+O2"], "grants": [], "experiments": []}, "fd_densifiedPropellantKerolox": {"title": "Densified-Propellant Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "#23b9a0", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Chill both propellants below their normal boiling points before loading, and more mass packs into the same tanks and the same engine — the real refinement behind a two-thirds thrust jump on the same basic cycle, no new chemistry required.", "parts": [{"name": "ROE-Merlin1D", "mod": "ROEngines", "title": "Merlin 1D"}, {"name": "ROE-Merlin1DV", "mod": "ROEngines", "title": "Merlin 1D Vacuum"}], "upgrades": ["RFUpgrade_LR87-AJ-11A-Kero", "RFUpgrade_LR91-AJ-11A-Kero", "RFUpgrade_Merlin1D", "RFUpgrade_Merlin1DVac"], "grants": [], "experiments": []}, "fd_densifiedPropellantKeroloxII": {"title": "Further-Densified Kerolox Uprating", "discipline": "Fluid Dynamics", "color": "  pressure-fed hypergolics deep-throttled and restarted enough times to trust a crew's life to it twice in one mission, once going up wrong and once coming down right.", "parts": [{"name": "ROC-CSTRS88", "mod": "ROCapsules", "title": "CST-100 Launch Abort Engines (LAE)"}, {"name": "ROC-OrionCover1", "mod": "ROCapsules", "title": "Orion SM Fairing - 1"}, {"name": "ROC-OrionCover2", "mod": "ROCapsules", "title": "Orion SM Fairing - 2"}, {"name": "ROC-OrionCover3", "mod": "ROCapsules", "title": "Orion ESM Fairing - 3"}, {"name": "ROC-OrionLAS", "mod": "ROCapsules", "title": "Orion LAS and BPC"}, {"name": "ROE-SuperDraco", "mod": "ROEngines", "title": "SuperDraco"}, {"name": "ROE-SuperDracoDouble", "mod": "ROEngines", "title": "Twin SuperDraco"}], "upgrades": ["RFUpgrade_R-42DM", "RFUpgrade_R-42DM-NTO"], "grants": [], "experiments": []}, "ep_electricPumpFeed": {"title": "Electric-Pump-Fed Kerolox", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 12, "cost": 1440, "anyToUnlock": false, "flavor": "Spin the propellant pumps with a battery and a brushless motor instead of a gas generator or a preburner turbine — no exhaust-driven turbine at all. A little less thrust-to-weight bought back with radical simplicity and a bill of materials any workshop can assemble.", "parts": [{"name": "ROE-Rutherford", "mod": "ROEngines", "title": "Rutherford"}, {"name": "ROE-RutherfordVac", "mod": "ROEngines", "title": "Rutherford Vacuum"}], "upgrades": [], "grants": [], "experiments": []}, "ep_nextGenGriddedIon": {"title": "Next-Generation Gridded Ion Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "NSTAR's direct successor — the same electrostatic-grid acceleration, refined for higher throughput and, in its most extreme sibling, a second acceleration stage for even higher exhaust velocity.", "parts": [{"name": "RO-ID500", "mod": "NearFuturePropulsion", "title": "ID-500 Gridded Ion Thruster"}, {"name": "ionXenon-0625", "mod": "NearFuturePropulsion", "title": "NEXT Gridded Ion Thruster"}, {"name": "ionXenon-0625-2", "mod": "NearFuturePropulsion", "title": "HiPEP Gridded Ion Thruster"}, {"name": "ionXenon-0625-3", "mod": "NearFuturePropulsion", "title": "DS4G Gridded Ion Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_nasaHighPowerHall": {"title": "NASA High-Power Hall Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Purpose-built for deep-space station-keeping on a crewed outpost, not just trimming a satellite's orbit — the next mark past the 457M, and in its nested-channel sibling, the highest-power Hall thruster ever built.", "parts": [{"name": "ionArgon-0625", "mod": "NearFuturePropulsion", "title": "HERMeS Hall Effect Thruster"}, {"name": "ionArgon-0625-2", "mod": "NearFuturePropulsion", "title": "P5 5kW Hall Effect Thruster"}, {"name": "ionArgon-0625-3", "mod": "NearFuturePropulsion", "title": "X3 Hall-Effect Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_magnetoplasmadynamic": {"title": "Magnetoplasmadynamic Thruster", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 13, "cost": 1908, "anyToUnlock": false, "flavor": "Skip both the Hall channel and the ion grid — drive a plasma arc straight through an electromagnetic pinch and let the field itself do the accelerating. High power density, real hardware, and a genuinely different mechanism from anything else this tree calls electric propulsion.", "parts": [{"name": "mpdt-125", "mod": "NearFuturePropulsion", "title": "SX3 MPD Thruster"}], "upgrades": [], "grants": [], "experiments": []}, "ep_variableSpecificImpulsePlasma": {"title": "Variable-Specific-Impulse Plasma Rocket", "discipline": "Electrical Power", "color": "#ffd23f", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "RF-heat a plasma instead of arcing through it, then steer it out through a magnetic nozzle — and unlike every other electric thruster in this tree, trade thrust for Isp continuously, in flight, instead of picking one number at build time.", "parts": [{"name": "vasimr-0625", "mod": "NearFuturePropulsion", "title": "VX-200SS VASIMR"}, {"name": "vasimr-125", "mod": "NearFuturePropulsion", "title": "VF-200 VASIMR"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_bimodalNTR": {"title": "Bimodal Nuclear Thermal + Power", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 14, "cost": 2088, "anyToUnlock": false, "flavor": "The same reactor that heats propellant for thrust keeps running between burns as a power source — real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry.", "parts": [{"name": "ROE-BNTR", "mod": "ROEngines", "title": "Bimodal NTR"}], "upgrades": ["RFTech-nuclear-tltech6", "RFUpgrade_LPNTR-3600HP"], "grants": [], "experiments": []}, "nuc_fissionFragmentRocket": {"title": "Fission-Fragment Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 15, "cost": 2304, "anyToUnlock": false, "flavor": "Let the fission fragments themselves be the exhaust — no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach.", "parts": [{"name": "RO-fftdustyplasmaffre", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Fission Fragment Rocket Engine"}, {"name": "fft-ffre-plasma-1", "mod": "FarFutureTechnologies", "title": "Dusty Plasma Afterburning Fission Fragment Rocket Engine"}], "upgrades": ["RFTech-nuclear-tltech7"], "grants": [], "experiments": []}, "nuc_magneticFusionPulsePropulsion": {"title": "Magnetically-Confined Fusion Pulse Drive", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate — Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion.", "parts": [{"name": "RO-fft20mMMO", "mod": "FarFutureTechnologies", "title": "20 m \"Mini-Mag\" Orion Drive"}, {"name": "fft-fission-zpinch-1", "mod": "FarFutureTechnologies", "title": "10 m \"Mini-Mag\" Orion Drive"}], "upgrades": [], "grants": [], "experiments": []}, "nuc_nuclearSaltWaterRocket": {"title": "Nuclear Salt Water Rocket", "discipline": "Nuclear Engineering", "color": "#83c341", "tier": 16, "cost": 2520, "anyToUnlock": false, "flavor": "Dissolve fissile salts in water and let the mixture go critical continuously as it streams through the chamber — the reactor doesn't heat the propellant, the reactor IS the propellant. The wildest, most engineering-fiction concept in the curated set.", "parts": [{"name": "fft-nswr-2", "mod": "FarFutureTechnologies", "title": "20 m Nuclear Salt Water Rocket"}], "upgrades": ["RFTech-nuclear-tltech8"], "grants": [], "experiments": []}};
const panel=document.getElementById('panel');
const nodeG={};let cur=null;
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function select(id,scroll){
  if(cur)cur.classList.remove('sel');
  const g=nodeG[id];if(g){g.classList.add('sel');cur=g;if(scroll)g.scrollIntoView({block:'center',inline:'center'});}
  const d=DATA[id];if(!d){return;}
  let h=`<div class="ttl">${esc(d.title)}</div>`;
  h+=`<div class="meta"><span class="dot" style="background:${d.color}"></span>${esc(d.discipline)} · T${d.tier} · ${d.cost}◈${d.anyToUnlock?' · any-parent':''}</div>`;
  if(d.flavor)h+=`<div class="flav">${esc(d.flavor)}</div>`;
  h+=`<div class="sec">Parts (${d.parts.length})</div>`;
  if(d.parts.length){h+='<ul class="parts">';
    for(const p of d.parts)h+=`<li><div class="pt">${esc(p.title||p.name)}</div><div class="pn">${esc(p.name)}${p.mod?' · <span class="mod">'+esc(p.mod)+'</span>':''}</div></li>`;
    h+='</ul>';}
  else h+='<div class="empty">— no parts assigned —</div>';
  if(d.upgrades.length){h+=`<div class="sec">Upgrades (${d.upgrades.length})</div><ul class="parts">`;
    for(const u of d.upgrades)h+=`<li><div class="pn">${esc(u)}</div></li>`;h+='</ul>';}
  // experiments are Kerbalism Configure setups, not parts — invisible in R&D, so name them here
  const xs=d.experiments||[];
  if(xs.length){h+=`<div class="sec">Experiments (${xs.length})</div><ul class="parts">`;
    for(const x of xs){const m=[x.sci?x.sci+' sci':'',x.group?'Configure: '+x.group:''].filter(Boolean).join(' · ');
      h+=`<li><div class="pt">⚗ ${esc(x.name)}</div><div class="pn">${esc(x.id||'')}${m?' · '+esc(m):''}</div></li>`;}
    h+='</ul>';}
  panel.innerHTML=h;
}
document.querySelectorAll('#canvas g.node').forEach(g=>{
  const id=g.getAttribute('data-id');if(!id)return;nodeG[id]=g;
  g.addEventListener('click',()=>select(id,false));
  g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(id,false);}});
});
// search: first node whose id/title or any part name/title matches
document.getElementById('q').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();if(!q)return;
  for(const id in DATA){const d=DATA[id];
    if(id.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||
       d.parts.some(p=>p.name.toLowerCase().includes(q)||(p.title||'').toLowerCase().includes(q))){
      select(id,true);break;}}
});
// zoom (scale svg width/height; viewBox keeps it crisp, scroll container handles pan)
const svg=document.querySelector('#canvas svg');
const bw=parseFloat(svg.getAttribute('width')),bh=parseFloat(svg.getAttribute('height'));let z=1;
function zoom(nz){z=Math.max(.2,Math.min(4,nz));svg.setAttribute('width',bw*z);svg.setAttribute('height',bh*z);document.getElementById('zl').textContent=Math.round(z*100)+'%';}
document.getElementById('zi').onclick=()=>zoom(z*1.2);
document.getElementById('zo').onclick=()=>zoom(z/1.2);
</script></body></html>
