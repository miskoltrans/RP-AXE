# RP-AXE tech tree — SOURCE OF TRUTH (compiled by tools/build_tree.py).
# ================= v3 — REBUILT FRESH FROM THE BAND-1 ENGINE SPINE (2026-07-02) =================
# New tiering doctrine (see memory rp-axe-milestone-tiers):
#   - TIER = technological GENERATION (cross-discipline band); worked out PER MILESTONE.
#   - MILESTONES are the TIER you reach, NOT a node — the do-nothing int_* convergence gates are SACKED
#     ("integration is the vehicle you BUILD").
#   - <=6 parts/node, one clear KING; upgrades don't count to the cap and are the tier-FILLERS.
#   - start only leads to T1. Multi-tier jumps get flagged for user review.
# References (NOT compiled): v1 full P1 tree = library.yaml ; v2 79-node spine = parked/nodes-v2-spine.yaml.
#
# THIS SLICE (band 1, to first orbit): the kerolox booster spine (T1 sounding -> T5 uprated orbital) + the
# hydrolox ahistorical gamble. Parallel lines (solids, storables, verniers), engine UPGRADE wiring, and the
# structures/avionics/science lanes come in the next increments.

meta:
  scalar: 1.0
  auto_placement: false
  tier_cost: { 0: 0, 1: 20, 2: 90, 3: 400, 4: 900, 5: 1500, 6: 2000, 7: 2300, 8: 2100, 9: 1700, 10: 1300 }

nodes:
  # ================================= ROOTS =================================
  - id: start
    title: "Start"
    discipline: SystemsIntegration
    tier: 0
    parents: []
    flavor: "1950. You begin with the de Laval nozzle, a procedural airframe, avionics, the first instruments and a handful of sounding motors — enough to fly above the Karman line turn one. Rocketry is the default; whether to fly aeroplanes at all is yours to choose."
    parts: [proceduralNoseCone, proceduralStructural, RO-RFTank-Separate, proceduralAvionics, sensorBarometer, sensorThermometer, ROE-ORM65, TinyTim, ROSmallSpinMotor]
  - id: parking
    title: "Unsorted Parts (Parking)"
    discipline: SystemsIntegration
    tier: 0
    cost: 999
    parents: []
    flavor: "Everything unplaced or purely cosmetic — a dev holding pen, off the main tree."
  - id: hire_JPL
    title: "Charter a Deep-Space Probe Lab (JPL)"
    discipline: SystemsIntegration
    tier: 0
    parents: []
    hide_empty: true
    flavor: "Stand up a jet-propulsion lab — the home of integrated US robotic spacecraft. (US-probe pack only.)"
  - id: hire_OKB
    title: "Charter a Design Bureau (OKB)"
    discipline: SystemsIntegration
    tier: 0
    parents: []
    hide_empty: true
    flavor: "Establish an experimental design bureau — the home of integrated Soviet deep-space craft. (Soviet-probe pack only.)"

  # ===================== BAND 1 * KEROLOX BOOSTER SPINE (T1 -> T5) =====================
  # sounding -> turbopump(V-2) -> first boosters (Western || Soviet fork) -> orbital -> uprated orbital.
  - id: fd_sounding
    title: "Pressure-Fed Sounding Rockets"
    discipline: FluidDynamics
    tier: 1
    parents: [start]
    flavor: "A pressure-fed chamber and a de Laval nozzle scaled from a dart to a rocket that reaches the edge of space and returns data — no turbopump yet, just tank pressure and nerve. The sounding rocket that clears the Karman line."
    parts: [ROE-VeroniqueAK, ROE-Aerobee, ROE-R103, ROMeteoSustainer]
  - id: fd_turbopumpFeed
    title: "Turbopump Feed"
    discipline: FluidDynamics
    tier: 2
    parents: [fd_sounding]
    flavor: "Drive the propellants with a turbine-spun pump instead of tank pressure — the tank stops being a heavy pressure vessel and the chamber can run far harder than any sounding motor reaches. The step from a powder dart to the turbopump-fed V-2: a large liquid rocket at last."
    parts: [ROE-A4, ROE-A7, ROE-RD100]
  # --- the combustion fork: two answers to a stable large chamber ---
  - id: fd_singleChamber
    title: "Single-Chamber Boosters"
    discipline: FluidDynamics
    tier: 3
    parents: [fd_turbopumpFeed]
    flavor: "Scale one chamber and tame its combustion by hand — careful injector design still holds at this size. The first purpose-built boosters: Vanguard's X-405, Britain's Gamma, the small single chambers a satellite could ride. (Early LR-89/LR-105 base configs to be curated in.)"
    parts: [ROE-X405, ROE-Gamma301, ROE-Stentor, ROE-X405H]
  - id: fd_multiChamber
    title: "Multi-Chamber Boosters"
    discipline: FluidDynamics
    tier: 3
    parents: [fd_turbopumpFeed]
    flavor: "Don't fight instability in one big chamber — cluster several small ones, each below the acoustic threshold, on a common turbopump. The Soviet answer, and the layout that would grow into the R-7."
    parts: [ROE-S155, YF2_Engine, YF2_with_shell]
  # --- orbital-class thrust: the generation that reaches orbit ---
  - id: fd_orbitalWest
    title: "Orbital-Class Single Chambers"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_singleChamber]
    flavor: "A meganewton of stable thrust in one chamber, gimballed and trusted with a payload — the Atlas and Thor boosters that put the first Western satellites up."
    parts: [ROE-LR89_2, ROE-LR79, ROE-LR105_2, ROE-RZ]
  - id: fd_orbitalSoviet
    title: "R-7 Engine Cluster"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_multiChamber]
    flavor: "Twenty combustion chambers across four strap-on boosters and a core, all lit on the pad and synchronised — the R-7 that carried Sputnik to orbit. Brute multiplicity where the West built single chambers."
    parts: [ROE-RD107, ROE-RD108, ROE-RD211]
  - id: fd_matureOrbital
    title: "Uprated Orbital Rocketry"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_orbitalWest, fd_orbitalSoviet]
    anyToUnlock: true
    flavor: "The orbital boosters uprated and paired with an efficient upper stage — margin enough to place a real payload, not just a beeping sphere. Whichever booster you perfected, the last of the climb is a high-Isp kick stage. This is where orbit stops being a stunt. (Booster NA-x / 8D74-x upgrade configs live here.)"
    parts: [ROE-RD0110, ROE-RD109, ROE-RD0105, ROE-S2253]

  # ===================== BAND 1 * HYDROLOX — the ahistorical gamble =====================
  # commit early (T1) / worse first (T2 prototype) / overtakes mid-band (T4 RL-10). Isp never nerfed;
  # the cost is thrust + handling + program time up front.
  - id: cryo_hydrogen
    title: "Cryogenic Hydrogen Handling"
    discipline: Cryogenics
    tier: 1
    parents: [start]
    flavor: "No doctrine says burn kerosene first. Bet early on hydrogen — vacuum-jacketed tanks, multilayer insulation, the low-density fuel that demands enormous pumps — for the highest specific impulse chemistry there is. It just costs more program to get there."
  - id: fd_hydroloxPrototype
    title: "Prototype Hydrolox Combustion"
    discipline: FluidDynamics
    tier: 2
    parents: [cryo_hydrogen]
    flavor: "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game."
    parts: [ROE-RZ20]
  - id: fd_expanderCycle
    title: "Expander-Cycle Hydrolox"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_hydroloxPrototype]
    flavor: "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene."
    parts: [ROE-RL10Fixed]
