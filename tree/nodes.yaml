    # reason, unlike str_fixedLanderLegs' similarly large jump next to it. Deliberate: asparagus staging is
    # powerful enough (every strap-on drains before dropping, instead of dropping half-full) to be worth a
    # late gameplay gate on its own, not just a T2 utility part — a gating tax, not a lineage claim.

