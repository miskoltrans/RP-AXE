  # ================================================================================================
  # ============ BAND 3 * CREWED LUNAR LANDING + MOON-ROCKET PROPULSION (engines, 2026-07) ==========
  # ==== T8 = operational Moon rocket (Saturn gas-gen; Proton storable ORSC); T9 = high-perf apex ===
  # ==== (N1 kerolox ORSC, M-1, NTR) + the lander.  Authored from crewed-lunar-landing-partlist.tsv =
  # ================================================================================================

  # ---- Lane 1: crewed lunar landing (the headline) ----
  - id: fd_deepThrottleLanding
    title: "Deep-Throttle Descent"
    discipline: FluidDynamics
    tier: 9
    parents: [fd_continuousThrottleDescent, fd_pressureFedRestart]
    flavor: "Throttle a crewed descent engine ten-to-one for a controlled touchdown, and trust a pressure-fed ascent engine to light once - or the crew stays. Surveyor learned to throttle a descent; the Service Module learned to relight on faith; here the two meet and land people."
    parts: [ROE-LMDE, ROC-LEMLMDEBDB, ROE-LMAE, ROC-LEMLMAEBDB, RO-KTDU417]
    # King LMDE (10:1 deep-throttle descent). LMAE = the one-shot pressure-fed ascent; KTDU-417 = the
    # Soviet LK lander, homed by ROLE not chemistry (turbopump UDMH/NTO). Crossover, both parents load-
    # bearing. LMDE's own upgrade (LMDE-J) barred here by doctrine-4 -> fd_lunarSurfaceMobility.
  - id: fd_lunarSurfaceMobility
    title: "Powered Hop Transit"
    discipline: FluidDynamics
    tier: 10
    parents: [fd_deepThrottleLanding]
    flavor: "Once you are down, get around - a throttleable open-cockpit rocket to hop the surface, and the uprated descent engine of the longer, heavier missions that follow the first footprints."
    parts: [ROC-LFVBDB, ROC-LEMRover]
    upgrades: [RFUpgrade_LMDE-J]
    # Thin now (LFV + the doctrine-4-displaced LMDE-J uprate); grows into the extended-surface-ops home
    # (LRV rover / MESA) when non-engine parts are curated.
    # RENAMED (2026-07, docs/BAND3-TREE-REVIEW-FINDINGS.md #medium): "Mobility" named the outcome; the
    # real mechanism (per its own flavor) is thrust-vectored hopping, not driving — a hand-flown hover
    # rocket, not a rover.

  # ---- Lane 2: F-1 uprate trap ----
  - id: fd_gasGeneratorApex
    title: "Diminishing-Return Thrust Uprating"
    discipline: FluidDynamics
    tier: 9
    parents: [fd_gasGeneratorCeiling]
    flavor: "One more percent of thrust from a cycle with nothing left to give. The mightiest engine ever built is also the end of its line - spend a whole tier here and you have bought a rounding error while staged combustion and hydrolox walk past you."
    upgrades: [RFUpgrade_F-1-1.52M]
    # Deliberate opportunity-cost TRAP (user call): dead-end parentage, marginal F-1 uprate, sitting at
    # the same tier as the lander and NTR.

  # ---- Lane 3: hydrolox uppers ----
  - id: cryo_gasGeneratorHydrolox
    title: "Gas-Generator Hydrolox Combustion"
    discipline: Cryogenics
    tier: 8
    parents: [cryo_expanderCycle, fd_saturnKerolox]
    flavor: "Drive a hydrogen turbopump with a gas generator instead of the expander's own bleed - trade the closed cycle's elegance for the raw thrust to push a Moon rocket's upper stages. The high-thrust hydrolox engine the expander could never be."
    parts: [ROE-J2, ROE-HM7, YF75_Engine, YF75D_Engine, ROC-D2AJ10-133]
    upgrades: [RFUpgrade_LR87-LH2-Vacuum, RFUpgrade_LR87-LH2-SustainerUpgrade, RFUpgrade_LR87-LH2-VacuumUpgrade, RFUpgrade_RZ20-Mk2]
    # King J-2 (Saturn upper). Crossover: hydrogen handling + gas-generator turbopumps. LR87-LH2 & RZ.20
    # upgrades ride here legally (bases live in fd_vacuumExpansion / cryo_hydroloxPrototype).
  - id: cryo_largeHydrolox
    title: "Hydrolox Thrust Ceiling"
    discipline: Cryogenics
    tier: 9
    parents: [cryo_gasGeneratorHydrolox]
    flavor: "Scale the gas-generator hydrolox engine until it rivals a kerolox booster - a hydrogen engine of five thousand kilonewtons. The hydrolox twin of the F-1 ceiling: colossal, thirsty, never flown, and the end of its own line."
    parts: [ROE-M1]
    upgrades: [RFUpgrade_J-2-225K, RFUpgrade_J-2-230K]
    # J-2 uprates land here (doctrine-4: J-2 base is one tier down in cryo_gasGeneratorHydrolox).
  - id: cryo_refinedExpander
    title: "Refined Expander-Cycle Combustion"
    discipline: Cryogenics
    tier: 7
    parents: [cryo_expanderCycle]
    flavor: "Wring more specific impulse out of the closed expander cycle - hotter, tighter plumbing on the efficient small upper stage."
    upgrades: [RFUpgrade_RL10A-3-3, RFUpgrade_RL10A-3-7]
    # Thin stub (RL-10 base sits in cryo_expanderCycle; its refinements can't live with it). Fills out as
    # the long RL-10 chain arrives in later batches.

  # ---- Lane 4: kerolox ORSC (N1) ----
  - id: pc_n1ClosedCycle
    title: "Subcooled-Propellant Staged Combustion"
    discipline: PropellantChemistry
    tier: 9
    parents: [pc_orscDebut]
    flavor: "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale - the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did."
    parts: [ROE-NK33, ROE-NK43, SXTNK21BlockV]
    upgrades: [RFUpgrade_NK-19, RFUpgrade_NK-21, RFUpgrade_11D33, RFUpgrade_11D33M, RFUpgrade_RD-58]
