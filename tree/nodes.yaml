    # left as-is (pre-existing, not touched)" below) — this node no longer holds any Mach-2 content.
    flavor: "The mature marks of the bypass turbofans in the hangar — hotter turbines, tighter tolerances, a few percent more thrust and a few percent less fuel, engine by engine."
    upgrades: [RFUpgrade_CF6-50A, RFUpgrade_F100-PW-220, RFUpgrade_TF34-GE-400A, RFUpgrade_J57-P-420, RFUpgrade_J79-GE-11, RFUpgrade_CF6-80A]
    # Doctrine-4 collector for late-mark bypass-turbofan refinements (bases in av_highBypassTurbofan/
    # av_lowBypassTurbofan).
    # REVISED (2026-07, shuttle/station batch): this node hit 13 upgrades (10.4 weighted, already over
