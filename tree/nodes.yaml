  # BAND 4 * MODULAR-STATIONS-ROVERS ERA - operational launch-fleet engines (RP-1 x=-1507..-1167)
  # 1986/1992/1998 columns. Frontier was T11 (RS-25/NERVA-I); this batch lands T10-T13.
  # Design record: manifest/modular-stations-rovers-engine-kings.md. Doctrine-4 strict: every mark
  # homes off its own base's node (drove the RL-10 / SPT-100 / F135 / LEROS / RD-170 mark routing).
