# RP-AXE tech tree — SOURCE OF TRUTH (compiled by tools/build_tree.py).
# ================= v3 — REBUILT FRESH FROM THE BAND-1 ENGINE SPINE (2026-07-02) =================
# New tiering doctrine (see memory rp-axe-milestone-tiers):
#   - TIER = technological GENERATION (cross-discipline band); worked out PER MILESTONE.
#   - MILESTONES are the TIER you reach, NOT a node — the do-nothing int_* convergence gates are SACKED
#     ("integration is the vehicle you BUILD").
#   - <=6 parts/node, one clear KING; upgrades don't count to the cap and are the tier-FILLERS.
#   - start only leads to T1. Multi-tier jumps get flagged for user review.
# References (NOT compiled): v1 full P1 tree = library.yaml ; v2 79-node spine = parked/nodes-v2-spine.yaml.
#
# THIS SLICE (band 1, to first orbit): the kerolox booster spine (T1 sounding -> T5 uprated orbital) + the
# hydrolox ahistorical gamble. Parallel lines (solids, storables, verniers), engine UPGRADE wiring, and the
# structures/avionics/science lanes come in the next increments.

meta:
  scalar: 1.0
  auto_placement: false
  tier_cost: { 0: 0, 1: 20, 2: 90, 3: 400, 4: 900, 5: 1500, 6: 2000, 7: 2300, 8: 2100, 9: 1700, 10: 1300 }

nodes:
  # ================================= ROOTS =================================
  - id: start
    title: "Start"
    discipline: SystemsIntegration
    tier: 0
    parents: []
    flavor: "1950. You begin with the de Laval nozzle, a procedural airframe, avionics, the first instruments and a handful of sounding motors — enough to fly above the Karman line turn one. Rocketry is the default; whether to fly aeroplanes at all is yours to choose."
    parts: [proceduralNoseCone, proceduralStructural, RO-B9ProcWing-Early, RO-RFTank-Separate, proceduralAvionics, sensorBarometer, sensorThermometer, ROE-ORM65, TinyTim, ROSmallSpinMotor, groundAnchor]
  - id: parking
    title: "Unsorted Parts (Parking)"
    discipline: SystemsIntegration
    tier: 0
    cost: 999
    parents: []
    flavor: "Everything unplaced or purely cosmetic — a dev holding pen, off the main tree."
    parts: [YF21_with_shell_CZ-2, YF21_with_shell_CZ-2C, YF21_with_shell_CZ-2D, ROE-Agena_EquipmentRack, RP0HumanRatedFlag]
  - id: hire_JPL
    title: "Charter a Deep-Space Probe Lab (JPL)"
    discipline: SystemsIntegration
    tier: 1
    cost: 300
    parents: []
    flavor: "Stand up a jet-propulsion lab — the home of integrated US robotic spacecraft. Charter the programme; the spacecraft arrive by era."
  - id: hire_OKB
    title: "Charter a Design Bureau (OKB)"
    discipline: SystemsIntegration
    tier: 1
    cost: 300
    parents: []
    flavor: "Establish an experimental design bureau — the home of integrated Soviet deep-space craft. Charter the programme; the spacecraft arrive by era."

  # ===================== BAND 2 * CHARTER PACKS (era-tiered off the JPL/OKB entries) =====================
  # Fixes the mission-feasibility leapfrog: integrated appsats no longer unlock at T1 before their instrument
  # lanes. Entries (hire_JPL/OKB, T1) charter the programme; packs arrive by era — first sats when orbit is
  # reachable (~T4), application sats (~T5) alongside opt_tvRecon/opt_remoteSensing.
  - id: charter_usEarly
    title: "First-Generation Satellites"
    discipline: SystemsIntegration
    tier: 4
    parents: [hire_JPL]
    flavor: "Vanguard, the early Pioneers and the Explorers — the first American satellites, flown to prove a nation could reach orbit and read back the space it found there."
    parts: [vanguard-1, pioneer_0_1_2, pioneer_3_4, explorer_6, vanguard-2, vanguard-3]
  - id: charter_usApp
    title: "Application Satellites"
    discipline: SystemsIntegration
    tier: 5
    parents: [charter_usEarly]
    flavor: "Satellites that earn their launch: Tiros watching the weather, Transit fixing a ship's position, GRAB listening for enemy radar. The first American spacecraft flown for a service, not a first."
    parts: [tiros-1, transit2a, grab-1, pioneer_5]
  - id: charter_sovietEarly
    title: "First Soviet Satellites"
    discipline: SystemsIntegration
    tier: 4
    parents: [hire_OKB]
    flavor: "Sputnik 2 and 3 — the heavy early Soviet satellites that carried first a dog and then a laboratory into orbit while the West was still counting its failures."
    parts: [sputnik2, sputnik3]

  # ===================== BAND 1 * KEROLOX BOOSTER SPINE (T1 -> T5) =====================
  # sounding -> turbopump(V-2) -> first boosters (Western || Soviet fork) -> orbital -> uprated orbital.
  - id: pc_storables
    title: "Nitric-Acid Storable Propellants"
    discipline: PropellantChemistry
    tier: 1
    parents: [start]
    flavor: "An oxidiser you can keep in the tank for months — fuming nitric acid — that ignites on contact with its fuel, so the engine needs no igniter and no turbopump. The chemistry of the first cheap storable rockets: the sounding motors that clear the Karman line and return the first data from the edge of space."
    parts: [ROE-VeroniqueAK, ROE-Aerobee, ROMeteoSustainer]
  - id: fd_turbopumpFeed
    title: "Turbopump Feed"
    discipline: FluidDynamics
    tier: 2
    parents: [pc_storables, fd_injectors]
    anyToUnlock: true
    flavor: "Drive the propellants with a turbine-spun pump instead of tank pressure — the tank stops being a heavy pressure vessel and the chamber can run far harder than any sounding motor reaches. The step from a powder dart to the turbopump-fed V-2: a large liquid rocket at last."
    parts: [ROE-A4, ROE-A7, ROE-RD100, ROE-XLR41]
  # --- the combustion fork: two answers to a stable large chamber ---
  - id: fd_singleChamber
    title: "Single-Chamber Combustion"
    discipline: FluidDynamics
    tier: 3
    parents: [fd_turbopumpFeed]
    flavor: "A single small chamber held stable by careful injector design — the first purpose-built kerosene-oxygen boosters a satellite could ride: Vanguard's X-405, and the Atlas sustainer that runs on to orbit after the boosters drop away."
    parts: [ROE-X405, ROE-X405H, ROE-LR105_2]
  # (Multi-chamber has NO small tier: S-155 turned out single-chamber + an aircraft engine, moved to the
  #  aviation rocketplane cluster. The multi-chamber breakthrough debuts at ORBITAL scale —
  #  fd_orbitalSoviet (R-7 kerolox) and fd_orbitalMultiChamber (storable). S-155 parked for aviation.)
  # --- US/Western orbital boosters: taming combustion in a ~1 MN single chamber (capability peer of the R-7) ---
  - id: fd_largeChamber
    title: "Combustion-Instability Damping"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_singleChamber]
    flavor: "Scale a single combustion chamber to a meganewton and its own acoustics threaten to tear it apart — injector design and damping hold the burn stable at a size the small chambers never faced. The hard way the West reached orbit: one big stable chamber, where the Soviets clustered many small ones. Atlas, Thor, Blue Streak."
    parts: [ROE-LR89_2, ROE-LR79, ROE-RZ]
  - id: fd_orbitalSoviet
    title: "Parallel Engine Clustering"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_verniers]
    flavor: "Twenty combustion chambers across four strap-on boosters and a core, all lit on the pad and synchronised — the R-7 that carried Sputnik to orbit. Brute multiplicity where the West built single chambers. Unflyable without vernier steering, which its engines carry built-in."
    parts: [ROE-RD107, ROE-RD108]
  # --- orbital-class multi-chamber (storable boosters) — YF-2 1214 kN, RD-211 749 kN cluster tight ---
  - id: fd_orbitalMultiChamber
    title: "Multi-Chamber Combustion"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_verniers]
    flavor: "Scale the clustered-chamber approach to a meganewton — a bank of chambers on a common turbopump delivering booster thrust without ever risking one large unstable chamber. The storable orbital boosters (RD-211, YF-2) that lofted payloads on propellant you could keep in the tank for years."
    parts: [YF2_Engine, YF2_with_shell, ROE-RD211]
  - id: fd_matureOrbital
    title: "High-Expansion Vacuum Nozzles"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_orbitalSoviet]
    flavor: "A nozzle bell too large to fire at sea level — the flow would rip away from the walls — but in vacuum it extracts every last metre-per-second from the exhaust. The dedicated upper-stage engines that let the R-7 reach past low orbit toward the Moon: high specific impulse where there is no air to fight."
    parts: [ROE-RD0105, ROE-RD0110, ROE-RD109]
  # --- vernier trim chambers (ride the boosters they steer) ---
  - id: fd_verniers
    title: "Auxiliary-Chamber Thrust Vectoring"
    discipline: FluidDynamics
    tier: 3
    parents: [fd_turbopumpFeed]
    flavor: "Steer and roll a large rocket in powered flight with small gimballed auxiliary chambers — full three-axis control, roll especially, before a single main engine can be trusted to gimbal for it. The R-7's verniers are integral to its engines, so you cannot fly the cluster without this; Atlas and Jupiter bolt theirs on."
    parts: [ROE-LR101_2, ROE-LR101Inline_2, ROE-JupiterVernier]

  # ===================== BAND 1 * HYDROLOX — the ahistorical gamble =====================
  # commit early (T1) / worse first (T2 prototype) / overtakes mid-band (T4 RL-10). Isp never nerfed;
  # the cost is thrust + handling + program time up front.
  - id: cryo_hydrogen
    title: "Cryogenic Hydrogen Handling"
    discipline: Cryogenics
    tier: 1
    parents: [start]
    flavor: "No doctrine says burn kerosene first. Bet early on hydrogen: vacuum-jacketed tanks, multilayer insulation and enormous pumps for a low-density fuel, all for the highest specific impulse chemistry there is. It costs a whole node of program time up front just to commit - and this is that commitment."
  - id: cryo_hydroloxPrototype
    title: "Hydrogen-Oxygen Combustion"
    discipline: Cryogenics
    tier: 2
    parents: [cryo_hydrogen]
    flavor: "The first hydrolox engine that runs at all — low thrust, finicky, expensive, its great specific impulse not yet worth the trouble. Kerolox still wins the early climb; this is the down payment on a better long game."
    parts: [ROE-RZ20]
  - id: cryo_expanderCycle
    title: "Expander-Cycle Combustion"
    discipline: Cryogenics
    tier: 4
    parents: [cryo_hydroloxPrototype]
    flavor: "Let the fuel boil in the cooling jacket and use that gas to drive the pumps — no preburner, beautifully clean, the highest specific impulse a chemical engine reaches. The RL-10: the tier where hydrogen finally overtakes kerosene."
    parts: [ROE-RL10Fixed]

  # ===================== BAND 1 * PROPELLANT CHEMISTRY (storable + solid lines) =====================
  # Engines home by their CHEMISTRY when the propellant IS their signature (solid grains, a storable upper).
  # Hardware-defined engines (RD-211 = multi-chamber) home in FluidDynamics and DRAW the config from here.
  # Base nodes sit T1-T2; each engine's UPGRADE configs stretch the line forward to ~T5 (wiring pending the
  # higher tiers). Isp ladder (balance): solids 200-240 < storables/HTP/hypergolic 220-272 < kerolox 290-320.
  - id: pc_doubleBaseSolid
    title: "Double-Base Solid Propellant"
    discipline: PropellantChemistry
    tier: 1
    parents: [start]
    flavor: "Nitrocellulose plasticised with nitroglycerin and extruded into a grain that carries its own oxygen — the older solid chemistry: simple, dense, storable, lit once and done. The JATO boosters and the first Nike stages."
    parts: [ROE-18KS7800, ROE-R103, sepMotor1, SnubOtron, sepMotorLarge, sepMotorSmall]
  - id: pc_doubleBaseBooster
    title: "Double-Base Booster Grains"
    discipline: PropellantChemistry
    tier: 2
    parents: [pc_doubleBaseSolid]
    flavor: "Cast a double-base grain large enough to boost a stack off the pad — case-bonded to the motor wall so it burns from the core out without cracking. The Nike booster and the heavy JATO units, where double-base is pushed to its size limit before composite takes over."
    parts: [ROE-NikeM5E1, ROE-25KS18000, ROE-Alcyone1]
    # ROE-Alcyone1 researched (2026-07): propellant code NGNC = nitroglycerin/nitrocellulose, i.e. classic
    # double-base chemistry, NOT the composite PBAA/PBAN family the Mark II solids batch uses. Direct-add
    # here (no doctrine-4 conflict) rather than force it into pc_scoutMarkII where it doesn't belong.
  - id: pc_compositeSolid
    title: "Ammonium-Perchlorate Composite Grains"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_doubleBaseBooster]
    flavor: "Ammonium-perchlorate oxidiser bound in a rubbery polysulfide matrix, cast to shape around an integral nozzle — higher energy than double-base and castable to any size. The Baby Sergeant cluster that spun Explorer 1 to orbit."
    # HUB ACCEPTED (2026-07, docs/BAND3-TREE-REVIEW-FINDINGS.md #5): 6 real dependents after band 3
    # (pc_scoutSolids, pc_strapOnSolids, pc_retroKick, pc_pioneerVernierTrim, pc_allSolidStaging,
    # pc_segmentedCasting) — over the >3 flag threshold, but the same foundational-chemistry-root shape
    # as the already-accepted elec_transistor/aero_subsonicWing hubs. Each dependent is a genuinely
    # distinct lineage drawing on the same AP-composite breakthrough, not padding. Accepted as-is.
    parts: [ROE-BabySergeant, ROE-BabySergeantX3, ROE-BabySergeantX11, ROE-GCRC]
  - id: pc_hypergolics
    title: "Amine-Nitrate Hypergolics"
    discipline: PropellantChemistry
    tier: 2
    parents: [pc_storables]
    flavor: "An amine fuel and a nitric-acid oxidiser that ignite on contact — no igniter, storable for years, restartable after a cold coast. The propellant of upper stages and spacecraft engines that must light every time."
    parts: [ROE-AJ10Early, ROE-RD200, ROE-S2253]
    upgrades: [RFUpgrade_NitrousOxide]
  - id: pc_htp
    title: "High-Test Peroxide Combustion"
    discipline: PropellantChemistry
    tier: 2
    parents: [pc_storables]
    flavor: "Concentrated hydrogen peroxide decomposed across a silver catalyst into a hot oxidising gas — a storable oxidiser that needs no cryogenics and lights a kerosene engine cleanly. Britain's Gamma sustainers ran on it."
    parts: [ROE-Gamma301]
    upgrades: [RFUpgrade_HTP]
  - id: pc_stentor
    title: "Deep-Throttling Peroxide Combustion"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_htp]
    flavor: "A two-chamber peroxide engine whose small cruise chamber throttles deeply while a fixed chamber boosts — variable thrust from a storable propellant, built for a missile that had to coast and correct. (Britain's Stentor.)"
    parts: [ROE-Stentor]

  # ============ BAND 1 * UPGRADE ENABLERS (prototype: uprates home NON-LINEARLY at what enabled them) ============
  # A thrust-uprate homes at the ALLOY that let the engine run harder (Metallurgy); an Isp gain at the INJECTOR.
  # Enablers are their OWN discipline track (NOT parented to the engines) and may sit BEFORE the base engines;
  # the config needs (enabler AND base engine), so it effectively unlocks when you get the base model.
  - id: met_stainlessSteel
    title: "Austenitic Stainless Steel"
    discipline: Metallurgy
    tier: 2
    parents: [met_weldedTank]
    flavor: "Chromium-nickel steel that keeps its strength while hot and holds a higher chamber pressure without a thicker, heavier wall — the metallurgy that turned the V-2's chamber into the Redstone's. Push the pressure, take the thrust."
    upgrades: [RFUpgrade_Model39c, RFUpgrade_5D60, RFUpgrade_RD-101, RFUpgrade_RD-102, RFUpgrade_RD-103, RFUpgrade_RD-103M, RFUpgrade_Veronique61, RFUpgrade_A-6, RFUpgrade_A-6H, RFUpgrade_XASR-1, RFUpgrade_XASR-2, RFUpgrade_RDA-1-150, RFUpgrade_RDA-1-300, RFUpgrade_U-1700, RFUpgrade_U-2000, RFUpgrade_A-7, RFUpgrade_AJ10-27, RFUpgrade_XLR11-RM-5, RFUpgrade_XLR11-RM-13-8K, RFUpgrade_XLR35-RM-1]
  - id: fd_injectors
    title: "Impinging-Jet Injectors"
    discipline: FluidDynamics
    tier: 1
    parents: [start]
    flavor: "Aim paired fuel and oxidiser jets to collide and atomise on contact, across a flat plate drilled for even mixing over the whole injector face — more complete combustion, a little more specific impulse from the same propellants. Get it right and a small pressure-fed chamber burns clean enough to fly: the four-chamber engine of a rocket aeroplane, and the combustion craft the turbopump-fed boosters are built on."
    upgrades: [RFUpgrade_VeroniqueAGI, RFUpgrade_A-9, RFUpgrade_Model39cI]
  - id: met_nimonic
    title: "Nimonic Turbine Alloys"
    discipline: Metallurgy
    tier: 3
    parents: [met_stainlessSteel]
    flavor: "Nickel-chromium superalloy that keeps its strength at red heat — a turbopump turbine that spins hotter and harder feeds a higher chamber pressure, and the very same alloy is what lets a jet turbine run at all. The metallurgy where rockets and jets cross over."
    upgrades: [RFUpgrade_LR43-NA-3, RFUpgrade_S3.42T, RFUpgrade_RD-212-8D41, RFUpgrade_RD-213-8D13, RFUpgrade_J35-A-17, RFUpgrade_J47-GE-25A, RFUpgrade_J47-GE-27, RFUpgrade_J48-P-8, RFUpgrade_J57-P-21, RFUpgrade_J57-P-43WA, RFUpgrade_J57-P-7A, RFUpgrade_JT3C-6, RFUpgrade_Avon114R, RFUpgrade_RD-9BF-811, RFUpgrade_Sapphire203, RFUpgrade_RD-107-8D74PS, RFUpgrade_RD-108-8D75PS]

  # ===================== BAND 1 * STRUCTURES & TANK MATERIALS =====================
  # Mass-fraction line: welded steel (T1) -> stainless (T2) -> isogrid ‖ balloon light tanks. The Metallurgy
  # materials lane (welded -> stainless -> Nimonic) feeds both tanks (Structures) and engines (FluidDynamics).
  - id: met_weldedTank
    title: "Fusion-Welded Pressure Vessels"
    discipline: Metallurgy
    tier: 1
    parents: [start]
    flavor: "Roll, fusion-weld and proof-test a thin metal cylinder that holds its propellant under pressure without bursting — the first tank that flies, and the steel the first engine chambers are cut from. Heavy, but honest."
    parts: [ROT-GenericTank-Separate, ROT-BoosterTank-Separate, ROT-RadialTank-Separate, ROT-AtlasTank-Separate, ROT-KatnissTank-Separate, ROT-LanderTank-Separate, ROT-MiscTank-Radial-Separate, ROT-MiscTank-Separate, ROT-Nose-Separate, ROT-SphericalTank-Separate, ROT-ToroidalTank-Separate, ca_tank_mp_s, ReleaseValve]
  - id: met_isogrid
    title: "Machined Isogrid Stiffening"
    discipline: Metallurgy
    tier: 2
    parents: [met_weldedTank]
    flavor: "Machine a triangular-rib isogrid into thick plate — cutting metal away everywhere the load path doesn't run, leaving only the ribs that carry it. The same stiffness at a fraction of the mass; the light conventional tankage that flies most orbital rockets."
    parts: [ROT-GenericTank-Integral, ROT-AtlasTank-Integral, ROT-BoosterTank-Integral, RO-RFTank-Integral, ROT-KatnissTank-Integral, ROT-LanderTank-Integral, ROT-MiscTank-Integral, ROT-MiscTank-Radial-Integral, ROT-Nose-Integral, ROT-RadialTank-Integral, ROT-SphericalTank-Integral, ROT-ToroidalTank-Integral]
  - id: str_balloonTank
    title: "Pressure-Stabilized Monocoque"
    discipline: StructuresMechanisms
    tier: 3
    parents: [met_stainlessSteel]
    flavor: "Make the stainless wall so thin it only holds its shape under internal pressure — the Atlas 'steel balloon' reached orbit weighing almost nothing empty, and would crumple if you ever let it depressurise. As much an orbital enabler as any engine."
    parts: [ROT-AtlasTank-Balloon, ROT-BalloonTank-New, RO-RFTank-BalloonNew, ROT-KatnissTank-Balloon, ROT-MiscTank-Balloon]
  - id: str_staging
    title: "Pyrotechnic Frangible Separation"
    discipline: StructuresMechanisms
    tier: 2
    parents: [str_structuralHardware]
    flavor: "Frangible joints and shaped charges cut a spent stage away on a millisecond's command; small motors settle the propellant for the next light. The only way to the velocities chemistry can't reach in one burn."
    parts: [proceduralStackDecoupler, radialDecoupler, ROT-RingDecoupler, ROE-120XDecoupler]
    # ROE-120XDecoupler added (2026-07): pure structure (disc=structure, no engine module), pairs with
    # pc_segmentedCasting's UA120X booster family by NAME but belongs in the structural decoupler catalog,
    # not the propellant-chemistry node — same lesson as the parachute/landing-leg mistakes this session.
  - id: aero_fairings
    title: "Jettisonable Payload Fairings"
    discipline: Aerodynamics
    tier: 3
    parents: [aero_boattail]
    flavor: "Shroud the payload through the dense lower atmosphere, then split and jettison it cleanly once the air thins — aerodynamic protection that must vanish on command."
    parts: [KzResizableFairingBase, KzResizableFairingBaseRing, KzProcFairingSide1, KzInterstageAdapter2, KzProcFairingSide1_TU]

  # ===================== BAND 1 * SPACECRAFT SYSTEMS & SCIENCE =====================
  # First-satellite systems + science payloads (science is NOT utility — finest curation). Most are early
  # parallel breakthroughs off start (T1); the integrated Sputnik bus and the film->vidicon step sit at T2.
  - id: tel_telemetry
    title: "Pulse-Interval Telemetry"
    discipline: Telecommunications
    tier: 1
    parents: [start]
    flavor: "Encode a reading as the gap between radio pulses and beam it down on a fixed carrier — the beep-beep that proved a satellite was alive and returned its first data. The whole point of orbit, if you can't hear it."
    parts: [SXTAntenna, SurfAntenna, longAntenna, nfex-antenna-rover-2]
  - id: th_hermeticBus
    title: "Hermetic Thermal-Control Bus"
    discipline: Thermodynamics
    tier: 3
    parents: [met_isogrid]
    flavor: "Seal the electronics in a pressurised sphere with a circulating gas and a polished radiating skin, holding them at room temperature through the swing from sunlight to shadow. Sputnik was mostly this: a bus that keeps its instruments alive."
    # HUB ACCEPTED (2026-07, docs/BAND3-TREE-REVIEW-FINDINGS.md #6): 4 dependents (tel_appSatellites,
    # cmp_ablativeTPS, opt_twoChannelIR, th_activeLouvers) — matches the already-accepted
    # str_structuralHardware precedent exactly (4). Each is a clearly distinct downstream need. Accepted.
    parts: [SXTSputnik, probeCoreSphere_v2, sputnik1, ROT-ProbeCore]
    upgrades: [MLI.Upgrade1]
    # MLI.Upgrade1 added (2026-07): multi-layer-insulation wrapping-density tier, confirmed KEEP-capability
    # — a passive thermal-blanketing improvement, fits this node's own passive hermetic-sealing mechanism
    # (as opposed to th_activeLouvers' active heat rejection).
  - id: elec_semiconductorDiode
    title: "Semiconductor Diodes"
    discipline: ElectricalPower
    tier: 2
    parents: [tel_telemetry]
    flavor: "A sliver of doped crystal that passes current one way only — grown up from the cat's-whisker radio detector into a rugged solid-state device. It lights an indicator on almost no power, and it is the seed of everything solid-state: rectifiers, transistors, the integrated circuit still to come. Microelectronics grows from here."
    parts: [SmallPointLight, SmallSpotLight, SmallStripLight, domeLight1, groundLight1, groundLight2, navLight1, spotLight1, spotLight1_v2, spotLight2, spotLight2_v2, spotLight3, stripLight1]
  - id: elec_transistor
    title: "Transistor Amplification"
    discipline: Microelectronics
    tier: 3
    parents: [elec_semiconductorDiode]
    flavor: "Replace the fragile, power-hungry vacuum tube with a sliver of doped germanium that amplifies and switches a signal cold, on almost nothing — the active device the diode could never be. Microelectronics proper begins here: every transistorised instrument, guidance platform and television camera that follows is built on this one breakthrough."
  - id: elec_siliconPV
    title: "Diffused-Junction Photovoltaics"
    discipline: ElectricalPower
    tier: 3
    parents: [elec_semiconductorDiode]
    flavor: "Diffuse a shallow junction into a silicon wafer so sunlight knocks a current across it — grams of cells that trickle-charge a battery indefinitely, outliving every chemical primary. Vanguard 1 is still up there, still lit."
    parts: [ROS-StaticSolarPanel, RO_EarlyTinySolarPanel]
  - id: rob_rotorActuation
    title: "Electric Rotor Actuation"
    discipline: Robotics
    tier: 4
    parents: [elec_transistor]
    flavor: "A brushless electric motor married to a solid-state controller that holds it at any commanded speed or angle — the first actuator a machine can move on its own. Nothing in an unmanned launcher spins one yet, but every arm, rover wheel, tracking mount and deployable to come turns on this."
    parts: [rotor_01, rotor_01s]
  - id: gnc_rcs
    title: "Cold-Gas Reaction Control"
    discipline: GuidanceControl
    tier: 2
    parents: [gnc_postWarAvionics]
    flavor: "Bleed compressed nitrogen through opposed nozzles to nudge a craft's attitude — no combustion, nothing to go wrong, just enough impulse to point. The simplest way to hold an orientation in vacuum."
    parts: [ROE-ModularRCS, RO-2kN-Thruster]
    # RO-2kN-Thruster added (2026-07): Nitrogen cold-gas thruster, exact same mechanism as this node's own
    # part. RP-1 itself gates it at "Starting Parts" (even earlier than this node's own T2) — close enough
    # and the mechanism match is what matters; not worth re-opening the T0/T1 band-1 fence for one thruster.
  - id: aero_recovery
    title: "Drogue-Stabilized Deceleration"
    discipline: Aerodynamics
    tier: 2
    parents: [aero_subsonicWing]
    flavor: "A small drogue bites the thin high air to hold a falling body straight and slow it enough that a main canopy can open without tearing — the difference between a returned payload and a crater."
    parts: [parachuteSingle, parachuteDrogue, parachuteLarge, parachuteRadial, RC_cone, RC_cone_double, RC_radial, RC_stack, evaChute]
  - id: opt_filmReturn
    title: "Film-Return Imaging"
    discipline: OpticsPhotonics
    tier: 1
    parents: [start]
    flavor: "Expose photographic film to the scene and bring the physical emulsion home — the highest resolution there is, at the price of recovering the capsule. Reconnaissance before anyone could downlink a picture."
    parts: [science_module, RO-BasicFilmCamera]
  - id: opt_vidicon
    title: "Vidicon Imaging"
    discipline: OpticsPhotonics
    tier: 4
    parents: [opt_recon, elec_transistor]
    flavor: "Scan a photoconductive target with an electron beam and read the image off as a video signal — lower resolution than film, but it comes down the radio link the instant you take it. No capsule to recover."
    parts: [RO-EarlyTVCamera, aerocam, aerocam180, hc_booster, hc_kazzelblad, hc_launchcam, hc_navcam, hc_nightvision, hc_scicam, hc_wideangle, mumech_hullcam]
  - id: nuc_geiger
    title: "Geiger-Müller Ionization Counting"
    discipline: NuclearEngineering
    tier: 1
    parents: [start]
    flavor: "A wire at high voltage in a gas tube: a single charged particle triggers an avalanche you can read as a click. The instrument that found the radiation belts on the first American satellite."
    parts: [RO-GeigerMuller, RO-Micrometeorite]
  - id: mic_massSpec
    title: "Magnetic-Sector Mass Spectrometry"
    discipline: Microelectronics
    tier: 4
    parents: [mic_atmoSounding, elec_transistor]
    flavor: "Ionise a gas sample and bend the ions through a magnetic field — heavier species curve less, sorting the upper atmosphere into a spectrum of masses. What the air is actually made of, up there."
    parts: [RO-IonMassSpectrometer, USFluidSpectroWedge]
  - id: mic_magnetometer
    title: "Fluxgate Magnetometry"
    discipline: Microelectronics
    tier: 4
    parents: [mic_atmoSounding, elec_transistor]
    flavor: "Drive a soft-ferrite core in and out of saturation and read how the ambient field skews the cycle — a solid-state compass sensitive enough to map the planet's field from orbit, on a boom to escape the craft's own iron."
    parts: [RO-EarlyMagnet]
  - id: bio_cultures
    title: "Space-Exposed Biology"
    discipline: LifeSupport
    tier: 1
    parents: [start]
    flavor: "Fly gels, spores and living cultures sealed in a capsule, then recover them to see what vacuum, cold and raw radiation did — the first read on whether anything alive survives above the atmosphere. The seed of every later life-sciences payload."
    parts: [GooExperiment, BioCapsule, USGooBayWedge, SXTProbeGooo]
  - id: mic_atmoSounding
    title: "Upper-Atmosphere Sounding"
    discipline: Microelectronics
    tier: 1
    parents: [start]
    flavor: "A wedge of thermometers, barometers and sample cells flown up a sounding rocket to log temperature, pressure and density where balloons can't reach — the first instruments to tell us what the air is doing at the edge of space."
    parts: [USThermoBaroWedge]

  # ===================== BAND 1 ‖ AVIATION / SUPERSONIC (parallel milestone) =====================
  # Air-breathing propulsion is its OWN lane; supersonic engines DEPEND on Aerodynamics breakthroughs
  # (swept wing + shock-cone intake). Rocketplane rockets stay in FluidDynamics (they're rockets).
  # MULTI-TIER edges flagged for review: aero_subsonicWing->aero_supersonicWing (T1->T3).
  #   (X-1 -> X-15 leap now bridged by fd_throttleableRocketplane / the X-2's XLR25 at T3.)
  - id: aero_subsonicWing
    title: "Subsonic Aerodynamics"
    discipline: Aerodynamics
    tier: 1
    parents: [start]
    flavor: "Beyond the bare procedural wing you begin with, the craft of subsonic aerodynamics: the control surfaces and all-moving tail that make it a controllable platform, and the pitot and radial intakes that feed an engine cleanly. The root the rest of aerodynamics grows from."
    parts: [RO-B9ProcCS-Early, RO-B9ProcAMWing-Early, CircularIntake, LRadialAirIntake, RO-IntakeRadialLongPitot, SXTInlineAirIntake, airScoop, miniIntake]
  - id: str_landingGear
    title: "Oleo-Strut Undercarriage"
    discipline: StructuresMechanisms
    tier: 2
    parents: [str_structuralHardware]
    flavor: "Shock-strut legs that swing out to land and fold away in flight — the wheels a runway launch and recovery need, from a fixed skid on a light trainer up to a steerable retractable leg."
    parts: [GearFixed, SmallGearBay, GearSmall, GearFree, GearSmallSpaceplane, SmallGearBaySpaceplane, ROC-DynaSkidFront, ROC-DynaSkidRear]
  - id: str_fixedLanderLegs
    title: "Fixed Landing Struts"
    discipline: StructuresMechanisms
    tier: 7
    parents: [str_landingGear]
    flavor: "No wheels, no retraction — just a shock-absorbing strut that swings out once and takes the full load of touching down somewhere with no runway at all."
    parts: [landingLeg1, landingLeg1-2]
    # NEW (2026-07 fix, user call — "make them a simple one off node"): split out of
    # fd_continuousThrottleDescent, where it had been bundled with a throttleable engine just because
    # Surveyor happened to use both — a structural touchdown strut isn't a propellant/combustion
    # breakthrough. Parented off the existing wheeled/retractable strut lineage (same shock-absorbing-leg
    # family, fixed instead of retractable) rather than off anything propulsion-related.
  - id: str_adjustableGear
    title: "Adjustable Heavy Undercarriage"
    discipline: StructuresMechanisms
    tier: 3
    parents: [str_landingGear]
    flavor: "Load-rated landing gear with adjustable ride height and stance, sized from a light trainer to a heavy jet — the sophisticated oleo strut for aircraft too big or too fast for the basic legs it grows past. A separate research, off the stock undercarriage."
    parts: [KF-ALG-Small, KF-ALG-Medium, KF-ALG-Large, KF-ALG-SmallSide, KF-ALG-Small-Spaceplane, KF-ALG-Medium-Spaceplane, KF-ALG-Large-Spaceplane, KF-ALG-SmallSide-Spaceplane]
  - id: av_centrifugalJet
    title: "Centrifugal-Flow Turbojet"
    discipline: AirBreathing
    tier: 2
    parents: [prop_recipEngine]
    flavor: "A single centrifugal impeller flings air outward into the combustor — robust, simple, and the first jet to fly a fighter, though its fat frontal area caps the speed. Continuous thrust with no propeller."
    parts: [RO-DerwentV, RO-VK1]
  - id: fd_rocketplaneRocket
    title: "Chamber-Staged Aircraft Rocket"
    discipline: FluidDynamics
    tier: 2
    parents: [fd_injectors]
    flavor: "Four small ethanol-oxygen chambers lit one at a time to step the thrust up and down — no throttle valve, but control enough to push a piloted aeroplane past the sound barrier and glide it home. The X-1's engine."
    parts: [ROE-XLR11, ROE-XLR10, ROE-S155]
  - id: av_axialJet
    title: "Axial-Flow Turbojet"
    discipline: AirBreathing
    tier: 3
    parents: [av_centrifugalJet]
    flavor: "Stack many stages of bladed rotor and stator so the air is squeezed along the axis instead of flung sideways — a slim engine that swallows far more air and scales to real thrust. The architecture every later jet keeps."
    parts: [RO-J47, RO-J35, RO-Atar101D, RO-JT3C]
  - id: aero_supersonicWing
    title: "Swept-Wing Planform"
    discipline: Aerodynamics
    tier: 3
    parents: [aero_subsonicWing]
    flavor: "Rake the wing back so the flow across it stays subsonic while the aircraft goes supersonic, delaying the shock stall — with a shock-cone intake that decelerates the air before it reaches the compressor. What makes level supersonic flight possible at all."
    parts: [RO-B9ProcWing-Supersonic, RO-B9ProcCS-Supersonic, RO-B9ProcAMWing-Supersonic, SXTRadialAirIntakeShockCone, RO-shockConeIntake125, RO-shockConeIntakeBomarc, RO-shockConeIntakeMig, shockConeIntake, airbrake1]
  - id: av_afterburner
    title: "Afterburning Turbojet"
    discipline: AirBreathing
    tier: 4
    parents: [av_axialJet, aero_supersonicWing]
    flavor: "Dump raw fuel into the hot exhaust behind the turbine and light it — a burst of thrust that shoves a fighter through the transonic drag rise, at a ruinous fuel cost. Reheat: the supersonic dash."
    parts: [aje_j57, aje_avon, RO-Sapphire203, RO-RD9B, RO-J48, RO-AL7F]
  - id: av_variableStator
    title: "Variable-Stator Turbojet"
    discipline: AirBreathing
    tier: 4
    parents: [av_axialJet, aero_supersonicWing]
    flavor: "Pivot the compressor's stator vanes to keep the airflow attached across a huge speed range — the engine that holds Mach 2 without stalling its own compressor. The Starfighter's powerplant."
    # HUB ACCEPTED (2026-07, docs/BAND3-TREE-REVIEW-FINDINGS.md #6): 4 dependents after band 3
    # (av_afterburner-family successors + av_mach2Turbojet, av_highBypassTurbofan). The real
    # tech-transfer story holds — variable-stator compressor control genuinely underlies both Mach-2
    # fighter engines and large turbofans' stall margin. Accepted.
    parts: [aje_j79, aje_j75, turboFanEngine, RO-J85GE5]
  - id: av_ramjet
    title: "Ramjet Compression"
    discipline: AirBreathing
    tier: 5
    parents: [av_variableStator]
    flavor: "Above Mach 2 the forward speed alone rams and compresses the air — no compressor, no turbine, just an inlet, a flame and a nozzle. Useless from a standstill, unbeatable once you are already fast. Missiles and interceptors."
    parts: [RO-RJ43, RO-RJ47, RO-RJ55, RO-RJ59, RO-Nord1500, aje_ramjet]
    # aje_ramjet (CR2) added 2026-07 (band-3 lunar batch): generic ramjet, same ram-compression mechanism.
  - id: fd_throttleableRocketplane
    title: "Throttle-Valve Aircraft Rocket"
    discipline: FluidDynamics
    tier: 3
    parents: [fd_rocketplaneRocket]
    flavor: "A throttle valve on an aircraft rocket at last — the Curtiss-Wright XLR25 could be modulated continuously in flight instead of stepped chamber by chamber, the first US rocket a pilot flew on the stick. The X-2's engine: the bridge from the X-1's fixed chambers to the X-15's man-rated throttle."
    parts: [ROE-XLR25]
  - id: fd_throttlingRocket
    title: "Throttleable Restartable Rocket"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_throttleableRocketplane]
    flavor: "A rocket a pilot can throttle deeply and relight in flight, burning ammonia and oxygen with control enough to fly the edge of space and come back. The X-15's XLR99: the first man-rated throttleable engine, and the doorway to hypersonics."
    parts: [ROE-XLR99]

  # ===================== BAND 1 * UTILITY CATCH-ALL (exempt from the <=6 rule) =====================
  # The passive structure everyone needs and no one researches for. Station-scale modular truss + MLP +
  # rocket landing legs + cockpits + cosmetics intentionally PARK (band-2 or the user's live review queue).
  - id: str_structuralHardware
    title: "Riveted Airframe Structure"
    discipline: StructuresMechanisms
    tier: 1
    parents: [start]
    flavor: "Rivet and weld sheet, extrusion and tube into a load-bearing frame — the everyday structural craft of 1950: struts, I-beams, panels, mounts and nose cones, the skeleton every vehicle hangs on. The root the rest of structures grows from."
    parts: [structuralIBeam1, structuralIBeam2, structuralIBeam3, structuralPanel1, structuralPanel2, Angledpanel, structuralPylon, structuralMiniNode, smallHardpoint, strutCube, strutCube3way, strutCube90, strutCubeLarge, strutCubeMedium, strutCubeSmall, strutOcto, microIbeam, stackPoint1, truss-micro-01, truss-micro-02, trussPiece1x, trussPiece3x, KzThrustPlate, strutCubeMountingPlate, ROT-Mount]
    # strutConnector (EAS-4) split OUT to str_rigidBracing (2026-07-06, user call) — the manual strut is the
    # part that switches on autostrut in career (KSP gates the autostrut PAW toggle on strutConnector being
    # unlocked), so it earns its own node rather than riding along in the passive-structure catch-all.

  - id: str_rigidBracing
    title: "Rigid Airframe Bracing"
    discipline: StructuresMechanisms
    tier: 2
    parents: [str_structuralHardware]
    flavor: "Tie two points of a flexing structure together with a diagonal strut and the whole assembly stops working against itself — the cure for the strap-on booster that whips and the stack that wobbles under its own thrust. The same principle drawn as an invisible rigid link is the autostrut, stiffening any joint on the vehicle with no part to place — which is why unlocking the humble EAS-4 is what switches autostrut on."
    parts: [strutConnector]

  # ===================== BAND 1 * AVIONICS (capability tiers — grants:, no physical part) =====================
  # RP-1's Science-Core avionics ladder as ONE track (user). Each node grants the avionics tier; names are my
  # best read of the era's guidance breakthrough — correct freely.
  - id: gnc_postWarAvionics
    title: "Gyroscopic Autopilot"
    discipline: GuidanceControl
    tier: 1
    parents: [start]
    flavor: "Spinning-mass gyroscopes sense a vehicle's drift and an analog computer swings the controls to correct it — the first machine that flies a rocket straight with no hand on the stick. Crude and heavy, but it holds a heading."
    grants: [Science-Core-postWarAvionics]
  - id: gnc_avionicsPrototypes
    title: "Analog Inertial Guidance"
    discipline: GuidanceControl
    tier: 2
    parents: [gnc_postWarAvionics]
    flavor: "Pair the gyros with accelerometers on a stabilized platform and integrate the motion in analog circuitry — the craft knows where it is and where it is going with no word from the ground. Guidance you can trust to a warhead or an orbit."
    grants: [Science-Core-avionicsPrototypes]
  - id: gnc_earlyAvionics
    title: "Stable-Platform Guidance"
    discipline: GuidanceControl
    tier: 4
    parents: [gnc_avionicsPrototypes, elec_transistor]
    flavor: "A gimballed, gyro-held platform that stays fixed in space while the vehicle rotates around it, read by transistorized electronics light enough to fly — the guidance package that steers a satellite launcher through its whole ascent."
    grants: [Science-Core-earlyAvionics]
    upgrades: [HDD-Upgrade-Early, RP-1-PayloadTech-EarlyAvionics]

  # ============ BAND 1 * STANDARDIZED RCS (optional DEAD-END; procedural ModularRCS stays the default) ============
