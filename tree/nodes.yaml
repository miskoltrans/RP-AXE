  - id: opt_largeApertureOptics
    title: "Large-Aperture Optics"
    discipline: OpticsPhotonics
    tier: 4
    parents: [opt_recon]
    flavor: "Resolution is set by the diameter of the glass, so the camera stops being a payload and becomes the spacecraft — a mirror the length of the bus, folded to fit a fairing and held in focus while the structure warms and cools. Grain and lens motion are no longer the limit; diffraction is."
    parts: [RO-HighResFilmCamera]
  - id: opt_tvRecon
    title: "Television Reconnaissance"
    discipline: OpticsPhotonics
    tier: 5
    parents: [opt_vidicon]
    flavor: "Higher-resolution vidicon cameras that scan the reconnaissance image down a radio link the moment it is taken — no capsule to recover, the picture on the ground in minutes. The electronic eye catching up to the spy film."
    parts: [RO-BasicTVCamera]
  - id: opt_remoteSensing
    title: "Infrared Remote Sensing"
    discipline: OpticsPhotonics
    tier: 5
    parents: [opt_vidicon]
    flavor: "Scan the planet in wavelengths the eye cannot see: an infrared radiometer maps cloud-top temperature, an ultraviolet spectrometer reads the high atmosphere. The first weather and earth-resource sensing from orbit."
    # HUB ACCEPTED (2026-07, band-3 review #6): grew to 6 real dependents across
    # bands 2-3 (opt_irRadiometry, opt_twoChannelIR, opt_uvSpectrometry, opt_orbitalMapping,
    # opt_infraredInterferometry, opt_multiSpectralImaging) with no accept ever recorded — the one hub in
    # this review that most deserved a documented decision rather than silent growth. Each dependent is a
    # genuinely distinct sensing modality, the same foundational-root shape as the already-accepted
    # elec_transistor hub. Accepted as-is.
    parts: [RO-IRRadiometer]

  # ===================== BAND 2 * SCIENCE INSTRUMENT GATES (numbered-family progressions) =====================
  # Split the bunched T5 remote-sensing/TV nodes so each numbered instrument gates the next: IR01 (T5) ->
  # IR02/03 (T6), VI02 (T5) -> VI03 (T6), IS02 gets its own strand (seeds the IS spectrometer family).
  # Bulk stays T1-T4; these top-tier refinements use T6. Band 3 continues each family (IR04, IS01/03/04,
  # MS02-04, VI04/05, PH05, WS01-03, MG02/03) as further gates.
  - id: opt_irRadiometry
    title: "High-Resolution Radiometry"
    discipline: OpticsPhotonics
    tier: 6
    parents: [opt_remoteSensing]
    flavor: "A finer detector and a tighter scan resolve the infrared scene into detail the first radiometer blurred — the warm and cold of a coastline or a storm system mapped sharply, still in a single band but now worth the downlink."
    parts: [RO-HRIRRadiometer, dmUS2GoreSat]
    # dmUS2GoreSat added (2026-07): the US2 wedge IR radiometer, same mechanism as this node's own
    # instrument — direct-add, no doctrine-4 conflict. Config pulled from RP-1 per band-2's own note.
  - id: opt_twoChannelIR
    title: "Two-Channel Radiometry"
    discipline: OpticsPhotonics
    tier: 6
    parents: [opt_remoteSensing, th_hermeticBus]
    flavor: "Read the infrared in two bands at once and difference them — a warm channel against an atmospheric window — and the ratio gives the true surface temperature, not merely its brightness. The harder instrument (IR03 above IR02): the two detectors must be held at a stable temperature, or the radiometer reads its own warmth instead of the world's."
    parts: [RO-TwoChannelIR]
  - id: opt_uvSpectrometry
    title: "Ultraviolet Spectrometry"
    discipline: OpticsPhotonics
    tier: 6
    parents: [opt_remoteSensing]
    flavor: "Disperse the ultraviolet an atmosphere emits and absorbs into a spectrum — the fingerprints of ozone, hydrogen and the rest of the high air, in wavelengths the eye and the film both miss entirely. The first instrument to read the atmosphere's chemistry from above it."
    parts: [RO-UVSpectrometer, RO-NIMS]
    # RO-NIMS added (2026-07, power+science pass): IS03, the next rung of the same Infrared/UV-Spectrometer
    # series as RO-UVSpectrometer (IS02) already here - a combined NIR+UV instrument, traced by series code.
  - id: opt_refinedTV
    title: "Refined Vidicon Imaging"
    discipline: OpticsPhotonics
    tier: 6
    parents: [opt_tvRecon]
    flavor: "A finer vidicon target and a denser scan resolve detail the early television camera smeared away — reconnaissance and weather imagery sharp enough to be worth the bandwidth to send it down. The electronic eye growing up."
    parts: [RO-ImprovedTVCamera, RO-AdvancedImager]
    # RO-AdvancedImager added (2026-07, power+science pass): VI04, the next rung of the same
    # Visible-Imaging series as RO-ImprovedTVCamera (VI03) already here - traced by series code.
  # US2 wedges (config from RP-1): magnetometer boom gates above MG01; the "Orbital Telescope" is a
  # long-focal-length SURFACE imager (scopeScan/Terrain, hirise tag) -> recon/optics lane, not astronomy.
  - id: mic_boomMagnetometry
    title: "Boom-Deployed Magnetometry"
    discipline: Microelectronics
    tier: 5
    parents: [mic_magnetometer, rob_rotorActuation]
    flavor: "Swing the magnetometer out on a long boom, far from the spacecraft's own motors and wiring, so it reads the planet's field instead of the craft's — a boom that has to unfold and lock rigid on command. The measurement that only works once the sensor is metres from everything electric, and something can put it there."
    parts: [dmUS2MagBoom]
  - id: opt_precisionOptics
    title: "Precision Orbital Optics"
    discipline: OpticsPhotonics
    tier: 5
    parents: [opt_recon, gnc_earlyAvionics]
    flavor: "A long-focal-length telescope trained on the surface from orbit, resolving detail a wide-angle camera smears into a blur — the optical reconnaissance that reads a runway, not just a coastline. Glass figured to the edge of the aperture and held rock-steady on a stabilised platform, for at this focal length the smallest jitter is a smear."
    parts: [dmUS2Scope]

  # ===================== BAND 2 * SUPPORT (power / avionics / comms-DSN / structures) =====================
  # Grants + ride-alongs closing out the spacecraft-systems side of the era. Progression respected:
  # DSN L2 (T5) -> L3 (T6); solar TL0 (band-1) -> TL1; avionics early (T4) -> basic (T5). Tech-level
  # PFTech-Fairing-II + RFTech-Battery-II deferred (no clean band-2 home; fairing/battery ladders).
  - id: elec_deployableArrays
    title: "Deployable Photovoltaic Arrays"
    discipline: ElectricalPower
    tier: 5
    parents: [elec_arCoatings]
    flavor: "Fold banks of silicon cells onto paddles that swing out once the satellite is clear of its shroud — far more collecting area than the body could ever carry, and the power to run a real payload through the sunlit half of every orbit. The array that outgrows the trickle-charge patch."
    parts: [RO_EarlyMediumSolarPanel]
    # solarTL1 moved OUT 2026-07-28 to elec_arCoatings (cell-lane pass): this node's breakthrough is the
    # fold-out paddle, and TL1 is a thinner cell. Structure keeps the hardware, the cell lane keeps the cell.
  - id: gnc_basicAvionics
    title: "Miniaturised Inertial Guidance"
    discipline: GuidanceControl
    tier: 5
    parents: [gnc_earlyAvionics]
    flavor: "Shrink the whole gyro-and-accelerometer platform onto transistorised boards light enough that a probe, not just a launcher, can carry its own guidance — and keep pointing through a mission measured in weeks. Inertial reference, miniaturised."
    grants: [Science-Core-basicAvionics]
    upgrades: [HDD-Upgrade-Basic, HDD-Upgrade-1961, HDD-Upgrade-1964, RFTech-ComSat-II, RFTech-NavSat-II, RP-1-PayloadTech-Axial]
    # +5 upgrades (2026-07): confirmed KEEP-capability, not REFERENCE — same avionics-capability ladder
    # this node already carries (HDD-Upgrade-Basic), just the next rungs. Were wrongly bucketed with the
    # genuinely-blocked REFERENCE-avionics items just because they share the same RP-1 techRequired bucket.
  - id: shd_basicAvionics
    title: "Radiation-Shielded Avionics — Basic"
    discipline: GuidanceControl
    tier: 6
    parents: [gnc_basicAvionics]
    flavor: "Wrap the same guidance stack in radiation shielding and a hardened chassis so it can outlast a passage through the Van Allen belts and beyond — heavier and pricier than the bare avionics it protects, but no longer confined to Earth's magnetosphere."
    grants: [Deep-Space-basicAvionics]
    # V2 avionics redesign (2026-07-08): AXE's own Shielded axis (docs/AVIONICS_SPEC.md), mirroring RP-1's
    # Deep-Space ladder one-for-one. Serial chain (each rung needs the previous Shielded rung + the paired
    # Guided/Computing tier). Placeholder flavor/title — dedicated content-authoring pass still pending.
  - id: tel_dopplerRanging
    title: "Coherent Doppler Ranging"
    discipline: Telecommunications
    tier: 5
    parents: [tel_telemetry]
    flavor: "Lock a ground receiver to the exact frequency of a spacecraft's carrier and read the Doppler shift as it climbs away — velocity to a fraction of a metre per second, and range from the round-trip time of a coded tone. The two-way link that tracks a probe out past the Moon."
    grants: [RP0Level2TrackingStation]
    upgrades: [commsTL1]
  - id: tel_pcmTelemetry
    title: "Pulse-Code Modulation Telemetry"
    discipline: Telecommunications
    tier: 6
    parents: [tel_dopplerRanging]
    flavor: "Sample each reading, digitise it, and interleave the bits into one clocked stream — telemetry that arrives exact instead of drifting, and packs a dozen instruments down a single carrier, picked up on a helical antenna that does not care how the craft is tumbling. Pulse-code modulation: the beginning of digital spaceflight."
    parts: [antenna_cone_toggle]
    grants: [RP0Level3TrackingStation]
    upgrades: [commsTL2]
  - id: str_equipmentBays
    title: "Enclosed Equipment Bays"
    discipline: StructuresMechanisms
    tier: 5
    parents: [str_serviceModuleTank]
    flavor: "A sealed structural bay behind the payload that shelters avionics, batteries and radios from launch acoustics and the vacuum beyond — the enclosed volume a working spacecraft is built around, from a service bay to a universal-storage rack, capped by a jettisonable nose."
    parts: [RO_ServiceBay_300, ServiceBay_250_v2, USRadialTanks, restock-nosecone-1875-1, ROC-LEMMESABDB, ROC-GeminiEquipmentSectionBDB]
    upgrades: [RFTech-SM-II]

  # ================================================================================================
  # ===================== BAND 2 * ENGINE SPINE (T4 -> T6) =========================================
  # The 1958-61 propulsion cohort (see band-2 design). Two transitions drive it: storable
  # hypergolics (UDMH + NTO) scaled to booster size, and kerolox uprating toward Saturn-I. ENABLER
  # nodes hold the ~50 uprate configs (upgrades ARE parts - home them, never defer); HARDWARE nodes
  # hold the base chambers, gated by lineage + their enabler. Homed by PROPELLANT, not the disc tag.
  # ---- PropellantChemistry: chemistry enablers + solids ----
  - id: pc_akOxidiser
    title: "Inhibited Nitric-Acid Oxidiser"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_storables, pc_hypergolics]
    flavor: "Red fuming nitric acid dissolves the tank it is stored in; add a fraction of a percent of hydrofluoric acid and it lays down a fluoride film that stops the attack instead. The oxidiser that was only ever a laboratory problem becomes something a missile can sit fuelled with for years."
    upgrades: [RFUpgrade_XLR81-BA-7, RFUpgrade_RD-217-8D515, RFUpgrade_YF-1A, RFUpgrade_AJ10-118D, RFUpgrade_RD-213-8D13]
    # LADDER PASS (2026-07-27): pulled out of pc_ntoHypergolics, whose subject is dinitrogen tetroxide.
    # None of these burn NTO -- they are IRFNA-III and AK27, i.e. inhibited nitric acid, a different
    # oxidiser with a different problem. The NTO configs (RD-250 family, YF-1B) stayed behind.
  - id: pc_ntoHypergolics
    title: "Dinitrogen-Tetroxide Oxidiser"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_hypergolics]
    flavor: "Swap the fuming-nitric oxidiser for dinitrogen tetroxide — denser, hotter-burning, storable in the same tank — paired with unsymmetrical dimethylhydrazine that ignites the instant the two meet. The combination that scales the storable rocket from a spacecraft thruster up to a full orbital booster; every hypergolic launcher for decades runs on it."
    # HUB RE-ACCEPTED (2026-07, band-3 review #4): grown to 7 real dependents
    # (pc_fluorine, fd_longMarchStorable, fd_sovietStorable, fd_titanStorableConversion,
    # fd_pressureFedRestart, pc_storableVernierFamily, pc_storableRcsPropellants) — band-3 design's
    # last recorded count was 5, "recommend accepting as flavor... your call to override." Every
    # dependent is still a genuinely distinct vehicle/chemistry lineage drawing on the same foundational
    # breakthrough; re-confirmed and accepted at the current count rather than left stale.
    upgrades: [RFUpgrade_YF-1B, RFUpgrade_YF-3A, RFUpgrade_RD-214-8D59, RFUpgrade_RD-214U-8D59U, RFUpgrade_S5.2, RFUpgrade_RD-250-8D518, RFUpgrade_RD-252-8D724, RFUpgrade_RD-855, RFUpgrade_RD-856, RFUpgrade_RD-250PM, RFUpgrade_R-40A-NTO]
  - id: pc_htpSustainer
    title: "Multi-Chamber Peroxide Combustion"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_stentor]
    flavor: "Bank many small peroxide-kerosene chambers into one sustainer, decomposing high-test peroxide over a silver catalyst for a clean, throttle-friendly burn with no cryogen. Britain's Gamma engines — eight chambers under the Black Arrow — carry a satellite to orbit on propellant that waits in the tank."
    parts: [ROE-Gamma2, ROE-Gamma8]
  - id: pc_larchPeroxide
    title: "Refined Peroxide Combustion"
    discipline: PropellantChemistry
    tier: 6
    parents: [pc_htpSustainer]
    flavor: "Push the peroxide sustainer harder — a hotter catalyst pack and a higher chamber pressure wring more thrust and a dozen seconds of specific impulse from the same hydrogen peroxide. The Larch uprates that turned the Gamma engines into an orbital launcher's powerplant, a decade after the chemistry was written off."
    upgrades: [RFUpgrade_Gamma-301, RFUpgrade_Larch-2, RFUpgrade_Larch-8]
  - id: pc_fluorine
    title: "Liquid-Fluorine Oxidiser"
    discipline: PropellantChemistry
    tier: 6
    parents: [pc_ntoHypergolics]
    flavor: "Burn hydrazine in liquid fluorine, the most aggressive oxidiser there is — a specific impulse no storable can touch, bought with a propellant that corrodes its own plumbing and poisons everything it escapes into. A high-energy gamble the Soviets ran on the bench and few dared fly."
    parts: [ROE-G1]
    upgrades: [RFUpgrade_XLR81-LF2-SPS]
    # XLR81-LF2-SPS (2026-07, band-3 lunar batch): a liquid-fluorine Agena variant - the exotic-oxidiser
    # gamble gains another member. Base ROE-Agena lives in fd_restartableUpper, so no doctrine-4 conflict.
  - id: pc_scoutSolids
    title: "Staged Solid Boost"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_compositeSolid]
    flavor: "Cast a composite grain into a full upper stage and fire it in vacuum — a stack of solid motors, each lighting as the last burns out, that reaches orbit with no liquid engine at all. Scout's Algol, Antares and Altair: the all-solid launcher, cheap and ready, needing no pad crew to fuel it."
    parts: [ROE-Algol1, ROE-Algol1_Inline, ROE-Altair, ROE-Antares1, ROE-Antares1_Inline]
    upgrades: [RFUpgrade_Castor-1-SL]
  - id: pc_strapOnSolids
    title: "Strap-On Thrust Augmentation"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_compositeSolid]
    flavor: "Strap solid motors around a liquid core and light them on the ground for a burst of extra liftoff thrust, then drop the burnt-out cases and fly on — augmentation you bolt on when the payload grows, with no change to the engine beneath. The Castor that turns a Thor into a Delta."
    parts: [ROE-Castor1, ROE-Castor1_Inline]
  - id: pc_retroKick
    title: "Vacuum-Start Solid Impulse"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_compositeSolid]
    flavor: "A small solid motor precise and reliable enough to fire once in vacuum after a long cold coast: the retro burn that drops a capsule out of orbit exactly where it must come down, the posigrade that shoves it clear of the spent stage, the spin-up that steadies it. Nothing comes home from orbit — film, sample or pilot — without a retrofire that does not fail."
    parts: [ROC-MercuryRetroBDB, ROC-MercuryPosigradeBDB, ROE-Agena_Retro_TypeIII, ROE-Agena_Spinrocket, ROC-GeminiRetroMECBDB, ROC-VoskhodRetroBooster]
    upgrades: [RFUpgrade_Castor-1-Vac]
    # ROE-TX280 moved OUT to the new fd_propellantUllage (2026-07 fix) — it's a genuinely distinct purpose
    # (settling propellant before ignition) from retro/posigrade/spin, which this node already covers, and
    # the user wants ullage represented as its own mechanism, not folded into this grab-bag.
    # ROC-VoskhodRetroBooster moved IN from edl_crewedRecovery — a real engine mis-filed in the parachute
    # node; belongs here with the other actual retro-rocket motors.
  # ---- FluidDynamics: physics enablers ----
  - id: fd_regenCooling
    title: "Regenerative Chamber Cooling"
    discipline: FluidDynamics
    tier: 4
    parents: [met_nimonic]
    flavor: "Route the fuel through milled channels in the chamber wall before it burns, carrying the heat back into the cycle instead of letting it melt the throat — so the same engine holds a higher chamber pressure without burning through. The quiet enabler behind every thrust uprate of the era: Atlas, Thor and Blue Streak all grow harder on the same hardware."
    upgrades: [RFUpgrade_LR105-NA-3, RFUpgrade_LR89-NA-5, RFUpgrade_LR79-NA-9, RFUpgrade_S-3D, RFUpgrade_RZ.2-Mk3, RFUpgrade_RD-108-8D77, RFUpgrade_Viking-4, RFUpgrade_Viking-5, RFUpgrade_LR87-AJ-3, RFUpgrade_LR91-AJ-3, RFUpgrade_XLR11-RM-13-8K, RFUpgrade_LR89-NA-6]
  - id: fd_vacuumExpansion
    title: "Extended Vacuum Expansion"
    discipline: FluidDynamics
    tier: 6
    parents: [fd_matureOrbital]
    flavor: "Extend the nozzle bell far past what any sea-level engine could survive, tuned so the exhaust expands to near-vacuum pressure and wrings out the last dozen seconds of specific impulse. The refinement that lets an upper stage do more on the same propellant — the RD-119 alone gains nearly thirty seconds over its predecessor."
    upgrades: [RFUpgrade_RD-0109, RFUpgrade_RD-0106, RFUpgrade_RD-119-8D710, RFUpgrade_X-405H, RFUpgrade_X-405H-2, RFUpgrade_RL10A-3-1, RFUpgrade_XLR81-BA-11, RFUpgrade_YF-22B, RFUpgrade_YF-23B, RFUpgrade_RD-225-8D721, RFUpgrade_LR101-NA-11, RFUpgrade_LR105-NA-6, RFUpgrade_XLR11-RM-13-10K, RFUpgrade_LR89-NA-7.1, RFUpgrade_LR89-NA-7.2, RFUpgrade_LR105-NA-5]
    # NA-7.x + X-405H-4 marks added 2026-07 (tail): next Atlas LR105/LR89 + Vanguard marks, continuing NA-6.
    parts: [ROE-LR87_LH2]
    # Part-count-pass finds (2026-07): 6 more upgrades in this same "combustion/injector refinement, no
    # chemistry change" character (Atlas vernier/sustainer, Thor sustainer, Thor's fuel-swap experiment,
    # X-1's rocket-plane refinement) that were in the original census but dropped during the doctrine-4
    # restructuring — never actually authored anywhere. Same fix for ROE-LR87_LH2 (AJ23-65): a large
    # (667 kN) new hydrolox engine that never got a base-part home; same vacuum-optimized mechanism as
    # RL10A-3-1, just bigger.
  - id: fd_restartableUpper
    title: "Restartable Vacuum Ignition"
    discipline: FluidDynamics
    tier: 4
    parents: [pc_hypergolics]
    flavor: "A storable-hypergolic upper that coasts dark through a long parking orbit and relights on command — the engine that stops being a single burn and becomes a manoeuvring stage. Agena's XLR81 shuts down and restarts in space: the key to circularising, changing plane, and the rendezvous still to come."
    parts: [ROE-Agena, ROE-AJ10Mid, ROE-Juno45K, ROE-Juno6K, ROE-AJ10Adv, RO-KTDU5A, ROE-KTDU35, ROE-S523, LargeOMS]
    upgrades: [RFUpgrade_AJ10-42, RFUpgrade_AJ10-101A, RFUpgrade_AJ10-118]
    # 4 more base parts added (2026-07, part-count-pass find), all the same restartable-storable-vernier
    # mechanism this node already covers: ROE-AJ10Adv (another AJ10-family vernier), RO-KTDU5A/ROE-KTDU35
    # (the Soviet KTDU family — "correction-braking propulsion," the direct Eastern-bloc counterpart to
    # Agena's restart capability; added here rather than a separate "Soviet" node per the standing
    # ahistorical rule — mechanism, not nation, decides placement), ROE-S523 (similar small storable
    # engine, lower confidence on exact identity but same class).
  - id: fd_spacecraftPropulsion
    title: "Restartable Deep-Throttling"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_restartableUpper]
    flavor: "Shrink the restartable engine to a spacecraft's own propulsion: a small, deeply-throttleable, many-times-restartable motor for the midcourse nudge and the retro burn a probe or capsule steers itself home with. Agena's secondary fires twenty times; a lunar probe lives or dies on one clean correction."
    parts: [ROE-AgenaSPS, RO-KDU414, ROE-RangerRetro, ROE-C1, ROC-VostokService]
    upgrades: [RFUpgrade_XLR81-BA-1, RFUpgrade_AJ10-142]
    # 2026-07 (tail): C-1 (small Aerozine50 maneuvering thruster) joins the small-spacecraft-engine family;
    # Model8096-HDA = an uprated Agena secondary-propulsion (SPS) mark.
  # ---- FluidDynamics: hardware chambers (gated by lineage [+ enabler]) ----
  - id: fd_storableSustainer
    title: "Storable Single-Chamber Combustion"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_singleChamber]
    flavor: "A single-chamber sustainer on the new storable hypergolics — all the convenience of a propellant that waits in the tank, now at the thrust a first stage needs. Vanguard's Viking and China's YF-3 lift off on oxidiser that never has to be loaded at the last minute."
    parts: [ROE-Viking2, ROE-Viking4, ROE-Viking5, YF3_Engine, YF3_with_shell]
    upgrades: [RFUpgrade_U-2000, RFUpgrade_XLR81-BA-3]
  - id: fd_titanTandem
    title: "Altitude-Start Tandem Staging"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_largeChamber]
    flavor: "Design the two stages as one propulsion system: a twin-chamber booster handing off to a dedicated second-stage engine built to ignite at altitude, in the thin air its bell is shaped for. Titan's LR87 and LR91 — the first purpose-built tandem, where the upper engine is no afterthought but half the design."
    parts: [ROE-LR87, ROE-LR87_11, ROE-LR87_Single, ROE-LR91, ROE-LR91-4V]
  - id: fd_longMarchStorable
    title: "Storable Chamber Clustering"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_orbitalMultiChamber, pc_ntoHypergolics]
    flavor: "Bolt four storable chambers to a common frame and fire them as one — three thousand kilonewtons of hypergolic thrust off the pad with no cryogenic plumbing to chill down or top off. The clustered first stage that lets a storable rocket match a kerolox booster for liftoff, ready to go at a moment's notice."
    parts: [YF20_Engine, YF21_Engine, YF22_Engine, YF23_Engine, YF25K_Engine]
  - id: fd_longMarchBoattail
    title: "Integrated Booster Boattail"
    discipline: FluidDynamics
    tier: 6
    parents: [fd_longMarchStorable]
    flavor: "Wrap the clustered first stage in its aerodynamic boattail and it stops being a bare cluster of chambers and becomes a complete, flight-configured stage — the CZ-2, CZ-2C and CZ-2D as they actually stacked. Same four storable chambers as the clustered first stage it branches from; procedural structure builds the same fairing for nothing, so this is off-the-shelf convenience, not a new engine."
    parts: [YF21_with_shell_CZ-2, YF21_with_shell_CZ-2C, YF21_with_shell_CZ-2D]
    # 2026-07 (parking cleanup): fixed-catalog opt-in dead-end off fd_longMarchStorable, same pattern as the
    # RCS catalogs. These 3 are the YF-21 cluster (identical 3358 kN hypergolic engine, shared YF-20B/25K/20C
    # upgrade configs already unlocked via the base YF21_Engine in the parent) wearing the CZ-2/2C/2D boattail
    # aeroshell. Cosmetic/aero shells, not a breakthrough, so they don't belong in the king node (and would
    # push it to 8 parts over the 6-cap); the +1 tier is the standard "dig one deeper for the fixed catalog" tax.
  - id: int_dongFangHong1
    title: "China's First Satellite"
    discipline: SystemsIntegration
    tier: 6
    parents: [fd_longMarchStorable]
    flavor: "A third nation reaches orbit on its own hardware — a small sphere broadcasting a patriotic melody instead of a beeping tone, riding the same clustered-storable first stage into space."
    parts: [DFH-1]
    # 2026-07 backlog sweep: DongFangHong-1 (1970) - decided KEEP for historical-firsts education
    # (docs/PARTLIST.md), but Kerwis isn't in the RN_US/RN_Soviet probe auto-router and this is the mod's
    # only satellite (not an ongoing charter-worthy program) - a standalone node tied to the real hardware
    # it actually flew on, rather than inventing a third charter house for one part.
  - id: fd_sovietStorable
    title: "Storable Tandem Staging"
    discipline: FluidDynamics
    tier: 5
    parents: [fd_orbitalMultiChamber, pc_ntoHypergolics]
    flavor: "The storable answer as a tandem missile stack: a paired-chamber first stage and a vacuum second stage, all on dimethylhydrazine and nitric-acid oxidiser, sat fuelled in a silo for years. The R-14 and R-16 engines — propulsion built to wait, then go."
    parts: [ROE-RD215, ROE-RD215_Single, ROE-RD219, ROE-RD855, ROE-RD856]
    # upgrades: [] — emptied by retarget_upgrades
  - id: fd_saturnKerolox
    title: "High-Pressure Kerolox Combustion"
    discipline: FluidDynamics
    tier: 6
    parents: [fd_largeChamber, fd_orbitalSoviet]
    anyToUnlock: true
    # FALSE-FORK FIX (2026-07-28, docs/TREE.md §10): was an ALL-parents convergence over
    # [fd_largeChamber, fd_orbitalSoviet, fd_regenCooling], which forced the player to buy BOTH combustion
    # schools the tree's own flavour narrates as alternatives ("the hard way the West reached orbit ... where
    # the Soviets clustered many small ones" vs "brute multiplicity where the West built single chambers").
    # Now multi-entry: either school reaches the mature booster. Opportunity cost is real — skipping Western
    # forfeits fd_titanTandem (T5), skipping Soviet forfeits fd_matureOrbital (T5) + fd_engineMaturation (T6).
    # fd_regenCooling DROPPED as a parent, deliberately: anyToUnlock is per-NODE, not per-parent, so
    # "regen AND (West OR Soviet)" is inexpressible, and re-parenting regen upstream of both is blocked (it is
    # T4 off met_nimonic T3, no spare tier). By T6 regen cooling is settled ~1955 tech every path has met —
    # lineage != gating (§7). It keeps 12 uprate configs spanning BOTH schools (LR-89/LR-79/RZ/LR-105 Western,
    # RD-108-8D77 Soviet) + two T8 staged-combustion children, so it stays wanted rather than tolled.
    flavor: "Uprate the kerosene-oxygen booster and build it to be mass-produced — a rugged, high-thrust engine you cluster eight at a time under a heavy first stage. The H-1 that becomes the Saturn I's power, and the RD-111 pushing kerolox to its pre-staged-combustion ceiling: the last and largest of the simple gas-generator boosters."
    parts: [ROE-RS27, ROE-H1C, ROE-H1D, ROE-RD111, ROE-E1]
    # ROE-E1 added (2026-07, part-count-pass find): a large gas-generator kerolox test engine, same
    # generation/class as H-1/RD-111. Its own upgrade (RFUpgrade_E-1-468k) was already placed in
    # fd_gasGeneratorCeiling — the base part itself was never homed. Must go HERE, not there (doctrine #4).

  # ================================================================================================
  # ===================== BAND 2 * AVIATION TAIL (T4 -> T6) ========================================
  # Extends the band-1 AirBreathing/Aerodynamics lanes. Most of the jet family is already placed
  # (av_afterburner/variableStator/ramjet); band 2 = the ~15 jet uprates (on a cooled-turbine enabler,
  # off their base nodes) + the genuinely-new engines (turboprop, Mach-2 fighter turbojets, hydrogen
  # jet, advanced ramjet) + a variable intake + the heavy-gear continuation.
  - id: met_cooledTurbine
    title: "Air-Cooled Turbine Blades"
    discipline: Metallurgy
    tier: 4
    parents: [met_nimonic]
    flavor: "Drill fine passages through each turbine blade and bleed compressor air through them, filming the metal in cool gas so the turbine can face a far hotter gas stream than it could survive bare. The step past a better alloy — run the fire hotter and every jet behind it gains thrust."
    upgrades: [RFUpgrade_AL-7F-1, RFUpgrade_Atar101E-3, RFUpgrade_Avon200R, RFUpgrade_J57-P-20A, RFUpgrade_J75-P-19, RFUpgrade_J79-GE-5C, RFUpgrade_J85-GE-5, RFUpgrade_RD-9AF2-300, RFUpgrade_WP-7, RFUpgrade_WP-6A, RFUpgrade_PT6A-27, RFUpgrade_PT6A-28, RFUpgrade_R-15BD-300, RFUpgrade_Atar09K-50, RFUpgrade_RB162-4D, RFUpgrade_RD-9BF-811, RFUpgrade_WP-6A-III]
    # 3 more upgrades added (2026-07, part-count-pass find): in the original engine census, dropped
    # somewhere between that census and the summary table used to author this node — never actually placed.
  - id: av_turboprop
    title: "Geared Turboprop"
    discipline: AirBreathing
    tier: 4
    parents: [av_axialJet]
    flavor: "Gear the axial turbine down to swing a large propeller instead of blasting a jet — trading top speed for the fuel economy and heavy-lift pull a jet cannot match down low. The Tu-95's monstrous contra-rotating NK-12 and the workhorse PT6: turbine power delivered through a propeller."
    parts: [SXTNK12M, SXTPWPT6]
  - id: av_hydrogenJet
    title: "Hydrogen-Fuelled Turbojet"
    discipline: AirBreathing
    tier: 4
    parents: [av_axialJet, cryo_hydrogen]
    flavor: "Feed the jet liquid hydrogen instead of kerosene — a fuel so energetic it promises altitude and range no kerosene burner can reach, at the price of a vacuum-jacketed fuel system feeding a red-hot engine. The Model 304 of the CL-400 Suntan spyplane: a gamble that flew on the coldest fuel there is, then stayed on the bench."
    parts: [RO-model304]
  - id: av_highTempTurbojet
    title: "High-Temperature Turbojet"
    discipline: AirBreathing
    tier: 5
    parents: [av_variableStator, met_cooledTurbine]
    flavor: "With a cooled turbine able to take the heat, run the combustor hotter and lighter for the thrust-to-weight a supersonic fighter lives on — a compact afterburning turbojet that holds Mach 2 on internal fuel. The R-11 of the MiG-21, the Atar 09 of the Mirage."
    parts: [aje_atar, RO-R11F, miniJetEngine]
    upgrades: [RFUpgrade_J79-GE-2A]
  - id: av_ramjetAdvanced
    title: "Refined Ramjet Compression"
    discipline: AirBreathing
    tier: 6
    parents: [av_ramjet]
    flavor: "Tune the inlet and flame-holders for sustained cruise at the top of the supersonic range — the long-burning ramjet of a missile that flies for minutes, not seconds. Where the ramjet stops being a boost phase and becomes the whole propulsion."
    parts: [RO-RD012]
    upgrades: [RFUpgrade_RJ43-MA-11, RFUpgrade_RJ43-MA-5, RFUpgrade_MA20S-4]
  - id: aero_variableIntake
    title: "Variable-Geometry Intake"
    discipline: Aerodynamics
    tier: 4
    parents: [aero_supersonicWing]
    flavor: "Move a ramp or a translating cone inside the inlet to hold the shock exactly where it must sit across a wide speed range — feeding the compressor smooth subsonic air whether the aircraft is transonic or deep in the Mach-2 régime. The fixed shock cone, made adjustable."
    parts: [ramAirIntake]
  - id: str_heavyGear
    title: "Large Aircraft Undercarriage"
    discipline: StructuresMechanisms
    tier: 4
    parents: [str_adjustableGear]
    flavor: "Legs rated for the weight of a heavy jet or transport, spreading the load on a soft field and soaking up a fast, heavy touchdown. The biggest undercarriage on the shelf, where the adjustable struts run out of rating."
    parts: [GearMedium, GearLarge, GearMediumSpaceplane, GearLargeSpaceplane]

  # ================================================================================================
  # ===================== BAND 2 * CREWED SPINE (T5 subsystems -> T6 vehicles) =====================
  # The marquee "humans" goal, the era's T6 climax. Subsystems (TPS, ECLSS, RCS, cabin, escape) at T5
  # feed the parallel Mercury || Vostok vehicles at T6. The 3 sanctioned crossovers live here: each
  # capsule needs TPS x ECLSS; Zenit (uncrewed recon) needs TPS x recon-optics. Tech-level capability
  # upgrades (Heatsink, MercuryHS) DEFERRED as a tech-level pass, like band-1 solarTL/commsTL.
  # ---- Subsystems (T5) ----
  - id: cmp_ablativeTPS
    title: "Ablative Reentry Shielding"
    discipline: CompositeMaterials
    tier: 5
    parents: [th_hermeticBus]
    flavor: "Face the reentry fireball with a shield built to be destroyed: a resin-and-fibre composite that chars and boils away layer by layer, carrying the heat off with the vapour and holding the structure behind it cool. The one thing between a returning capsule and cremation."
    parts: [ROC-MercuryHS, ROH-AdjustableHS]
    upgrades: [Heatsink]
  - id: cmp_ablativeRefinement
    title: "Advanced Ablator Formulation"
    discipline: CompositeMaterials
    tier: 6
    parents: [cmp_ablativeTPS]
    flavor: "A denser char layer and a slower burn-through rate let the same shield shrug off a hotter, faster reentry — the material getting better, not the shape changing. Mercury's ablator becomes Gemini's."
    parts: [ROC-GeminiHSBDB]
    upgrades: [MercuryHS, GeminiHS]
    # NEW (2026-07 fix, user call): MercuryHS/GeminiHS + ROC-GeminiHSBDB pulled out of edl_crewedRecovery.
    # cmp_ablativeTPS already IS the TPS material ladder's real home (holds the Heatsink rung); band 2 broke
    # the ladder by continuing it inside the parachute/recovery node instead of here. Kept at T6 (MercuryHS's
    # original tier via edl_crewedRecovery) rather than bumping to 7 — this is a structural fix (right node),
    # not a balance change (right tier); GeminiHS riding along in a T6 node matches the same pattern already
    # used for edl_crewedRecovery's own Gemini/Voskhod additions.
  - id: life_openLoopECLSS
    title: "Open-Loop Life Support"
    discipline: LifeSupport
    tier: 5
    parents: [life_highAltCompartment]
    flavor: "Keep a human alive in vacuum the simple way — bottled oxygen bled into a sealed cabin, carbon dioxide scrubbed from the air with lithium hydroxide, heat and moisture carried off — all of it vented or consumed, nothing recycled. Hours of life for a first flight, no more asked."
    parts: [RO-LifeSupport-DummyEngine, kerbalism-lifesupportmodule]
    # 2026-07-07 story thread: + bio_cultures co-parent. Space-biology sample return -> crew now runs
    # those experiments by hand. Roots the life-sciences lane on bio_cultures (was an isolated T1 stub).
  - id: life_crewedExperimentBay
    title: "Crew-Tended Experiment Locker"
    discipline: LifeSupport
    tier: 7
    parents: [life_openLoopECLSS, bio_cultures]
    flavor: "A modular science bay built into the cabin wall, serviced by hand instead of run by a timer — the same slot-in experiment rig whichever crewed vehicle happens to carry it, so long as someone is aboard to work it."
    parts: [USMatBayWedge]
    # NEW (2026-07, band-3 review #1): pulled USMatBayWedge out of int_geminiCapsule,
    # where it was bundled by MISSION (Gemini) instead of by mechanism — a generic crewed science locker,
    # not OAMS propulsion. Every other UniversalStorage2 wedge already homes at its own science-mechanism
    # node (USThermoBaroWedge->mic_atmoSounding, USGooBayWedge->bio_cultures, USAccelGravWedge->
    # gnc_orbitalGravimetry); this one needed a crew-tended-science home of its own since none of those fit
    # (it's not automated, not gravimetry, not atmospheric). Parented on life_openLoopECLSS rather than a
    # specific vehicle — the real prerequisite is simply a human being aboard long enough to run it.
    # kerbalism-lifesupportmodule added (2026-07): "External ECLSS Module" — same open-loop mechanism,
    # packaged as an external add-on unit. No conflict, direct-add.
    upgrades: [RFTech-AddLifeSupport]
  - id: gnc_spacecraftRCS
    title: "Storable-Propellant Reaction Control"
    discipline: GuidanceControl
    tier: 5
    parents: [gnc_rcs]
    flavor: "Trade the cold-gas puffers for small liquid thrusters on a storable propellant — peroxide, or hypergolics that light on contact — for many times the impulse in the same mass. The reaction control a manoeuvring spacecraft needs to point, hold and turn through a whole mission."
    parts: [ROE-generic-full, ROE-generic-half, ROE-generic-quarter, ca_jib, microEngine, vernierEngine]
    upgrades: [RFTech-rcs-tltech1]
  - id: life_pressurisedCabin
    title: "Sealed Cabin Pressurisation"
    discipline: LifeSupport
    tier: 5
    parents: [life_highAltCompartment]
    flavor: "Seal a cabin tight enough to hold near sea-level pressure while the air outside thins to nothing, feeding it breathing gas and bleeding off the heat of hypersonic flight — the pilot rides to the edge of space in something close to shirtsleeves. The X-15's sealed cabin and the pressurised fuselage behind it."
    parts: [Mark1Cockpit, Mark2Cockpit, SXTSmallFuselage, MK1Cargobay]
  - id: int_launchEscape
    title: "Tractor Escape Rocket"
    discipline: SystemsIntegration
    tier: 5
    parents: [pc_strapOnSolids]
    flavor: "A solid rocket on a lattice tower above the capsule that, at the first sign of a failing booster, fires to haul the crew up and clear faster than the fireball can climb — then throws itself away once the ascent is safe. The one system on a manned rocket that exists only to go unused."
    parts: [ROC-MercuryLESBDB, RO_mk1_LES]
  # ---- Vehicles (T6, parallel) ----
  - id: int_mercuryCapsule
    title: "Blunt-Body Reentry Capsule"
    discipline: SystemsIntegration
    tier: 6
    parents: [cmp_ablativeTPS, life_openLoopECLSS]
    flavor: "A blunt cone that rides its own shockwave down, the heatshield taking the fire while the crewman lies on his back against the deceleration. Mercury: one seat, a retrofire to leave orbit, a splashdown under a single canopy. The first American in orbit."
    parts: [ROC-MercuryCMBDB, ROC-MercuryAirbrakeBDB, RP0HumanRatedFlag]
    # RP0HumanRatedFlag added (2026-07, parking cleanup): the cosmetic human-rating flag decal, listed as a
    # ride-along of this exact capsule king (ROC-MercuryCMBDB) in the original design (human-orbital design)
    # and just missed during authoring. Belongs with the first crewed capsule — it only means anything once
    # you are flying people.
