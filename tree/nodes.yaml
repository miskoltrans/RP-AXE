  # ---- Cryogenics: hydrolox goes cheap-and-simple ----
  - id: cryo_combustionTapOff
    title: "Combustion Tap-Off Cycle"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_boosterGasGenHydrolox]
    flavor: "Skip the separate gas-generator combustor entirely — bleed hot gas straight off the main chamber wall to spin the turbopump, then dump it overboard. Simpler than a gas generator, cheaper than staged combustion: the operational middle path Blue Origin bet New Shepard and New Glenn's upper stage on."
    parts: [ROE-BE3]
    upgrades: [RFUpgrade_RS-68A]  # moved down from cryo_boosterGasGenHydrolox (own base part ROE-RS68 there), doctrine-4 fix 2026-07
    # King BE-3PM. A genuinely third hydrolox cycle (neither gas-generator nor expander nor staged
    # combustion) - sibling of RS-68/Vulcain 2's "anti-SSME" simplicity-over-Isp story, one tier later.
  - id: cryo_highThrustExpander
    title: "Higher-Thrust Closed Expander"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_deployableNozzleExpander]
    flavor: "Scale the closed expander cycle past the RL-10's own ceiling — two parallel American and European programs converge on the same bigger turbopump, the same clean cycle, roughly triple the thrust."
    parts: [cryoengine-pavonis-1, cryoengine-tharsis-1, ROE-MB35, ROE-MB60]
    upgrades: [RFUpgrade_RD-0146D, RFUpgrade_CECE-High, RFUpgrade_RL10A-3-9]
    # doctrine-4 fix (2026-07): Vinci-180 (this node's OWN base parts' - cryoengine-pavonis-1/tharsis-1 -
    # same-era parallel-program sibling config, per this node's own flavor text) moved down to
    # cryo_expanderBoosterScale, its nearest later-tier sibling.
    # RD-0146D/CECE-High/RL10C-2/RL10C-2-1 moved down from cryo_deployableNozzleExpander
    # (own base parts ROE-RD0146/ROE-RL10B2 there).
    # ROE-MB35/MB60 (2026-07, band-5 gap sweep): the same closed-expander thrust class (XCOR/Aerojet
    # Rocketdyne MB-XX study family) - direct siblings of RL60/Vinci, not a separate lineage.
    # King RL60/Vinci (two thrust variants of the same real convergent-design story: Aerojet Rocketdyne's
    # RL60 and ESA's Vinci, never flown but studied in parallel).
  - id: cryo_smallScaleMethalox
    title: "Small-Scale Methalox Upper Stage"
    discipline: Cryogenics
    tier: 12
    parents: [pc_zenitKerolox]
    flavor: "A simpler, plainer methalox debut at small scale — no staged-combustion preburner, just a clean upper-stage engine sized for a commercial small-satellite launcher. The unglamorous sibling to the booster-scale methalox story unfolding one node over."
    parts: [cryoengine-buzzard-1]
    upgrades: [RFUpgrade_CH4+O2, RFUpgrade_CECE-Methane]
    # LADDER PASS (2026-07-27): methalox RCS rides the node that makes small methalox engines a thing.
    # King M10 (Rocket Lab Neutron's upper stage). Sibling to cryo_methaloxStagedCombustion, not a child -
    # a different, plainer cycle on the same new fuel.
  - id: cryo_fullFlowMethaloxII
    title: "Matured Full-Flow Staged Combustion"
    discipline: Cryogenics
    tier: 14
    parents: [cryo_fullFlowMethalox]
    flavor: "The third pass at a cycle where both propellants run through their own preburners and nothing is thrown away. Parts count falls, the plumbing that made the first version a nightmare is machined out of the casting, and thrust climbs twenty percent because the engine finally stops being the reason to hold the schedule."
    upgrades: [RFUpgrade_Raptor-3, RFUpgrade_Raptor-3V]
  - id: cryo_expanderBoosterScale
    title: "Expander-Bleed Cycle at Booster Scale"
    discipline: Cryogenics
    tier: 13
    parents: [cryo_deployableNozzleExpander]
    flavor: "Vent a little of the cooling-jacket gas overboard instead of routing every drop through the turbopump, and the expander cycle's thrust ceiling — always capped by a small upper-stage engine's own heat-exchange area — breaks wide open. The expander cycle finally reaches core-stage scale."
    parts: [cryoengine-fuji-1]
    upgrades: [RFUpgrade_Vinci-180, RFUpgrade_RL10A-5]  # moved down from cryo_highThrustExpander (own base parts cryoengine-pavonis-1/tharsis-1 there), doctrine-4 fix 2026-07
    # King LE-9 (real H3 core engine, 1471 kN - triple the thrust of any prior expander in this tree).
  - id: cryo_fullFlowMethalox
    title: "Full-Flow Staged-Combustion Methalox"
    discipline: Cryogenics
    tier: 13
    parents: [cryo_methaloxStagedCombustion]
    flavor: "Burn both turbopump drive-gas streams through combustion at once — a fuel-rich preburner AND an oxidiser-rich preburner, nothing vented overboard at all. The thermodynamic endpoint of the staged-combustion idea, and the only cycle that ever reached it in metal."
    parts: [ROE-Raptor, ROE-RaptorVac, cryoengine-eagle-1]
    # cryoengine-eagle-1 (2026-07, full-manifest re-audit, corrected a real mistake): NOT actually a
    # "duplicate to skip" as earlier claimed - ground-truthed against RP-1's own TREE-Parts.cfg, it gets
    # its own real patch, identical to ROE-RaptorVac's (TechRequired=stagedCombustion2019, cost=1608) -
    # RP-1's standard "two mods model the same real engine, both playable" pattern. A real, separately
    # curated, separately buildable part (CryoEngines' own model/take on Raptor Vacuum) that happens to
    # always unlock at the same node as its ROEngines twin - listed explicitly rather than silently omitted.
    # King Raptor/Raptor-Vacuum. No RP-1 tech gate exists for this (too recent for RP-1's own tree) -
    # ground-truthed via partTech=stagedCombustion2019, same technique as the AJ10-190 gap.

  # ---- FluidDynamics: gas-generator kerolox reborn for reusability ----
  - id: fd_reusableGasGenKerolox
    title: "Reusable Gas-Generator Kerolox"
    discipline: FluidDynamics
    tier: 12
    parents: [fd_terminalGasGenKerolox]
    flavor: "After a whole tree of gas-generator kerolox engines chasing diminishing returns while staged combustion walked past, one company bets the other way: keep the simple open cycle, keep it deliberately unglamorous, and win on cost and reusability instead of chasing one more second of Isp."
    parts: [ROE-Merlin1A, ROE-Merlin1C, ROE-Merlin1CV]
    upgrades: [RFUpgrade_Merlin1C, RFUpgrade_Merlin1CVac, RFUpgrade_RP-1+O2, RFUpgrade_Syntin+O2]
    # King Merlin 1A/1C. Merlin 1C Vacuum rides along as a nozzle variant, not a new generation.
    # LADDER PASS (2026-07-27): the LOX/hydrocarbon RCS configs land here rather than on a fuel node -
    # feeding attitude thrusters from kerolox mains is a property of a reusable kerolox VEHICLE, not of
    # the kerosene itself. RP-1+O2 and Syntin+O2 are one measured performance point (1.45 kN / Isp 1.00),
    # so they share this node as one decision under R4.
  - id: fd_densifiedPropellantKerolox
    title: "Densified-Propellant Kerolox Uprating"
    discipline: FluidDynamics
    tier: 13
    parents: [fd_reusableGasGenKerolox]
    flavor: "Chill both propellants below their normal boiling points before loading, and more mass packs into the same tanks and the same engine — the real refinement behind a two-thirds thrust jump on the same basic cycle, no new chemistry required."
    parts: [ROE-Merlin1D, ROE-Merlin1DV]
    upgrades: [RFUpgrade_Merlin1D, RFUpgrade_Merlin1DVac, RFUpgrade_LR87-AJ-11A-Kero, RFUpgrade_LR91-AJ-11A-Kero]
    # King Merlin 1D/1D Vacuum.
    # doctrine-4 fix (2026-07): Merlin1D+/Merlin1D++/Merlin1DVac+ are this node's own base parts' later
    # marks - moved down to fd_densifiedPropellantKeroloxII (new node, no existing child here).
  - id: fd_densifiedPropellantKeroloxII
    title: "Further-Densified Kerolox Uprating"
    discipline: FluidDynamics
    tier: 14
    parents: [fd_densifiedPropellantKerolox]
    flavor: "Push the densified Merlin further still — the Full Thrust and Block 5 marks that let the same basic engine carry a reusable booster home and fly it again."
    upgrades: [RFUpgrade_Merlin1D+, RFUpgrade_Merlin1DVac+]
    # doctrine-4 catch: these configs' own base parts (ROE-Merlin1D/ROE-Merlin1DV) live in fd_densifiedPropellantKerolox.

  # ---- PropellantChemistry: American ORSC studies + solid boosters ----
  - id: pc_americanORSCKerolox
    title: "American ORSC Kerolox Studies"
    discipline: PropellantChemistry
    tier: 12
    parents: [pc_multiChamberORSC]
    flavor: "Two separately-funded American answers to the imported RD-180 — oxidiser-rich staged combustion on kerosene, drawn to compete on the same contract the Russians won on price. Real hardware, real test stands, and no flight between them."
    parts: [nflv-engine-ar1-1, nflv-engine-ar1c-1, nflv-engine-rs84-1]
    upgrades: [RFUpgrade_AJ26-58, RFUpgrade_AJ26-60, RFUpgrade_NK-9-2009]
    # King AR-1 (+ the larger AR1C mark). RS-84 rides along - a separate, parallel Rocketdyne ORSC kerolox
    # study from the same era and the same "lost on price, not physics" story as RD-270/AJ-260/STBE.
  - id: pc_fiveSegmentSolidScaleUp
    title: "Five-Segment Solid Booster Scale-Up"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_filamentWoundSolid]
    flavor: "Add one more segment to the Shuttle's own composite-case booster and it becomes the largest solid rocket motor ever flown — the same casting and winding technique, scaled up one more time for a heavier successor vehicle."
    parts: [MassiveBooster]
    upgrades: [RFTech-solids-tltech5]  # 1981 solid tech-level (five-segment era) 2026-07 Group-B
    # King RSRMV (SLS). Sibling of pc_gemStrapOnCatalog off the same filament-wound composite-case parent.

  # ---- GuidanceControl: commercial-crew abort engines learn to also land ----
  - id: gnc_deepThrottlingAbortLandingEngine
    title: "Deep-Throttling Pressure-Fed Abort/Landing Engine"
    discipline: GuidanceControl
    tier: 12
    parents: [gnc_deepSpaceApogeeEngine]
    flavor: "A launch-abort engine that can also fly a controlled, propulsive touchdown — pressure-fed hypergolics deep-throttled and restarted enough times to trust a crew's life to it twice in one mission, once going up wrong and once coming down right."
    parts: [ROE-SuperDraco, ROE-SuperDracoDouble, ROC-CSTRS88, ROC-OrionLAS, ROC-OrionCover1, ROC-OrionCover2, ROC-OrionCover3]
    upgrades: [RFUpgrade_R-42DM, RFUpgrade_R-42DM-NTO]  # moved down from gnc_deepSpaceApogeeEngine (own base part ROE-R42 there), doctrine-4 fix 2026-07
    # King SuperDraco/Twin SuperDraco (Dragon 2) - real breakthrough beyond any prior abort motor. CSTRS88
    # (CST-100's own abort-only cluster) rides along as the parallel commercial-crew system without the
    # landing capability. Orion's own solid LAS + its 3 jettisoned fairing covers ride along too (same
    # commercial-capsule propulsion generation, all partTech=commercialCapsules) - the 3 covers are
    # identical repeated jettison charges, not distinct breakthroughs, counted loosely against the cap
    # the same way other pure-cosmetic ride-alongs are elsewhere in this tree.

  # ---- ElectricalPower: electric propulsion's second generation ----
  - id: ep_electricPumpFeed
    title: "Electric-Pump-Fed Kerolox"
    discipline: ElectricalPower
    tier: 12
    parents: [fd_gasGeneratorApex, ep_hallEffectThruster]
    flavor: "Spin the propellant pumps with a battery and a brushless motor instead of a gas generator or a preburner turbine — no exhaust-driven turbine at all. A little less thrust-to-weight bought back with radical simplicity and a bill of materials any workshop can assemble."
    parts: [ROE-Rutherford, ROE-RutherfordVac]
    # King Rutherford/Rutherford Vacuum (Rocket Lab Electron) - genuinely new mechanism, not a refinement of
    # anything upstream. Crossover: still burns kerolox (PropellantChemistry heritage) but the breakthrough
    # is electric, so the discipline follows the breakthrough.
  - id: ep_nextGenGriddedIon
    title: "Next-Generation Gridded Ion Thruster"
    discipline: ElectricalPower
    tier: 13
    parents: [ep_griddedIon]
    flavor: "NSTAR's direct successor — the same electrostatic-grid acceleration, refined for higher throughput and, in its most extreme sibling, a second acceleration stage for even higher exhaust velocity."
    parts: [ionXenon-0625, ionXenon-0625-2, RO-ID500, ionXenon-0625-3]
    # King NEXT (NASA's real successor to NSTAR). HiPEP (highest-Isp gridded ion here) and ID-500 ride
    # along as sibling refinements of the same electrostatic-grid family; DS4G's dual-stage configs are
    # its own further marks.
    # doctrine-4 fix (2026-07): DS4G-25-hi/DS4G-25-mid/DS4G-50-hi/DS4G-50-low are this node's own base
    # part's (ionXenon-0625-3) marks - moved off this node.
    # POWER-CLASS PASS (2026-07-28): all four DS4G marks now sit on ep_fiftyKilowattPPU — they are 32-72 kW,
    # one band, and what gates them is the conditioning stage, not another grid. The two pegs they used to
    # hang on (ep_nextGenGriddedIonII, ep_kilowattClassPPU) carried no parts and were deleted.
  - id: ep_nasaHighPowerHall
    title: "NASA High-Power Hall Thruster"
    discipline: ElectricalPower
    tier: 13
    parents: [ep_highPowerHall]
    flavor: "Purpose-built for deep-space station-keeping on a crewed outpost, not just trimming a satellite's orbit — the next mark past the 457M, and in its nested-channel sibling, the highest-power Hall thruster ever built."
    parts: [ionArgon-0625, ionArgon-0625-3, ionArgon-0625-2]
    # King HERMeS (built for NASA's Gateway/PPE). X3 (nested-channel, highest power ever built) and P5
    # (mid-power NASA test article) ride along.
    # POWER-CLASS PASS (2026-07-28): this node's configs went to the PPU lane by power — SPT-100M (1.2 kW)
    # to ep_kilowattPPU, 457M-V2 (43 kW) to ep_fiftyKilowattPPU. It had spanned 35x. Its successor peg
    # ep_nasaHighPowerHallII was deleted in the same pass (it carried no parts and spanned 182x: SPT-100D
    # 1.2 kW, AEPS 13 kW and X3-HV 219 kW on one purchase). The parts stay; the mechanism is the point.
  - id: ep_magnetoplasmadynamic
    title: "Magnetoplasmadynamic Thruster"
    discipline: ElectricalPower
    tier: 13
    parents: [ep_hallEffectThruster]
    flavor: "Skip both the Hall channel and the ion grid — drive a plasma arc straight through an electromagnetic pinch and let the field itself do the accelerating. High power density, real hardware, and a genuinely different mechanism from anything else this tree calls electric propulsion."
    parts: [mpdt-125]
    # King SX3 MPD Thruster. Own node rather than folding into Hall/gridded-ion - the mechanism is neither.
  - id: ep_variableSpecificImpulsePlasma
    title: "Variable-Specific-Impulse Plasma Rocket"
    discipline: ElectricalPower
    tier: 14
    parents: [ep_magnetoplasmadynamic]
    flavor: "RF-heat a plasma instead of arcing through it, then steer it out through a magnetic nozzle — and unlike every other electric thruster in this tree, trade thrust for Isp continuously, in flight, instead of picking one number at build time."
    parts: [vasimr-125, vasimr-0625]
    # King VF-200/VX-200SS VASIMR - a third distinct electric-propulsion mechanism, the most exotic and
    # least-flown of this batch's concepts.
    # doctrine-4 fix (2026-07): VF-200-Kr/VX-200SS-Kr are this node's own base parts' (vasimr-125/vasimr-0625)
    # same-era propellant-swap variants - moved off this node.
    # POWER-CLASS PASS (2026-07-28): they now sit on ep_kryptonHighPower with the other krypton marks at
    # this power class. Their peg ep_variableSpecificImpulsePlasmaII carried no parts and was deleted — it
    # said "krypton VASIMR", which is a FLUID statement, and fluid is now its own axis expressed in parents.
  - id: nuc_bimodalNTR
    title: "Bimodal Nuclear Thermal + Power"
    discipline: NuclearEngineering
    tier: 14
    parents: [nuc_advancedCoreNTR]
    flavor: "The same reactor that heats propellant for thrust keeps running between burns as a power source — real NASA bimodal-NTR design studies, squeezing a second job out of the mass a nuclear stage already has to carry."
    upgrades: [RFUpgrade_LPNTR-3600HP]  # moved down from nuc_advancedCoreNTR (own base part ntr-gc-25-1 there), doctrine-4 fix 2026-07
    parts: [ROE-BNTR]
  - id: nuc_fissionFragmentRocket
    title: "Fission-Fragment Rocket"
    discipline: NuclearEngineering
    tier: 15
    parents: [nuc_bimodalNTR]
    flavor: "Let the fission fragments themselves be the exhaust — no propellant to heat, no working fluid at all, just the reaction products flying straight out at a meaningful fraction of the speed of light. The highest specific impulse anything in this tree will ever reach."
    parts: [RO-fftdustyplasmaffre, fft-ffre-plasma-1]
    # King Dusty Plasma FFRE; the "Afterburning" mark (fft-ffre-plasma-1, one tech tier later) injects
    # propellant into the fragment stream to trade some of that absurd Isp for usable thrust. Fissile
    # magazine tankage (nuc_fissilePropellantMagazine, T12) already exists for this class of drive.
  - id: nuc_magneticFusionPulsePropulsion
    title: "Magnetically-Confined Fusion Pulse Drive"
    discipline: NuclearEngineering
    tier: 16
    parents: [nuc_pulsePropulsion]
    flavor: "Compress a small fusion-fuel target with a magnetic pulse and ride the shockwave off a plate — Project Orion's own pusher-plate trick, but the charge is a magnetically-confined fusion pellet instead of a fission bomb. Real theoretical NASA/MSNW study, one full generation past classic Orion."
    parts: [fft-fission-zpinch-1, RO-fft20mMMO]
    # King 10m Mini-Mag Orion (+ the 20m mark). Deliberate deep tier jump off nuc_pulsePropulsion (T10) -
    # same "idle-then-leap" precedent already accepted for the RL-10 chain.
  - id: nuc_nuclearSaltWaterRocket
    title: "Nuclear Salt Water Rocket"
    discipline: NuclearEngineering
    tier: 16
    parents: [nuc_fissionFragmentRocket]
    flavor: "Dissolve fissile salts in water and let the mixture go critical continuously as it streams through the chamber — the reactor doesn't heat the propellant, the reactor IS the propellant. The wildest, most engineering-fiction concept in the curated set."
    parts: [fft-nswr-2]
    # King NSWR. Capstone of the exotic-nuclear cluster and the tree's new tier ceiling - deliberate
    # what-if/fun curation (never built even as a ground article), per [[rp-axe-fun-over-history]].
