  # ---- Lane 1: the station habitat (headline king + size-catalog extension) ----
  - id: life_convertedStageStation
    title: "Converted-Stage Station Module"
    discipline: LifeSupport
    tier: 9
    parents: [life_stationHabitation]
    flavor: "Build the station module out of a spent launch-vehicle stage's own tooling and diameter instead of designing a bespoke pressure vessel from scratch — decks and stowage where the tankage used to be. Skylab flew fitted-out on the ground rather than converted in orbit as first planned, but the trick is the same: a station's worth of volume for the price of hardware already proven to fly."
    parts: [SXTISSHabISK30, SXTSPKTRCabin, sspx-airlock-125-1, sspx-adjusting-stairs-1]
    # sspx-adjusting-stairs-1 added (2026-07, power+science pass): station access hardware, same theme as
    # the airlock already here.
    # King Skylab (SXTISSHabISK30) - the first space station, the headline part of this whole batch.
    # SPKTR-10 (Soviet large storage module, same converted-stage-class scale) rides along; the airlock
    # rides along too (a proper station needs EVA access, not just a hatch).
  - id: life_habitatModuleCatalog
    title: "Extended Habitation Module Catalog"
    discipline: LifeSupport
    tier: 9
    parents: [life_stationHabitation]
    flavor: "The same pressurised-module family, in more sizes and roles — habitation decks and utility bays scaled to whatever the mission needs, off the same shelf the core module came from."
    parts: [sspx-habitation-125-1, sspx-habitation-1875-1, sspx-utility-125-1, sspx-utility-1875-1]
    # Procedural stays default; this is the named-hardware size/role catalog, same shape as
    # gnc_fixedRcsCatalog/pc_apogeeKickCatalog. Kept separate from life_convertedStageStation so Skylab
    # keeps its own spotlight rather than sharing a node with generic catalog parts.

