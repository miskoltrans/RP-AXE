  # ---- Cryogenics: operational hydrolox fleet ----
  - id: cryo_deployableNozzleExpander
    title: "Deployable-Nozzle Expander Cycle"
    discipline: Cryogenics
    tier: 11
    parents: [cryo_refinedExpander]
    # LADDER PASS (2026-07-27): the `catalog: true` flag tried here was CUT. Calling the RL10C/E marks
    # "one decision, eight names" was wrong — there are two real axes running through them, and reading
    # only thrust hid both. NOZZLE EXPANSION (ispSL 148 -> 116 -> 45 -> 24) and RESTART LIFE (ignitions
    # 20 -> 25 -> 50 -> 260 -> 500) are different mechanisms bought at different times, so they are two
    # lanes off this node rather than one bucket sitting on it.
    flavor: "The expander cycle's payoff arrives: a radiatively-cooled nozzle that unfolds after staging trades stowed length for the highest vacuum Isp of any engine that flies. The RL-10B-2's carbon-carbon skirt reaches 465 seconds; the RD-0146 is the Russian closed-expander answer. The long RL-10 chain, idle since its last refinement, leaps a full fleet-generation here."
    parts: [ROE-RL10B2, ROE-RL10A4N, ROE-RD0146]
    upgrades: [RFUpgrade_RL10C-1]  # RL10C-3 + RL10E family added 2026-07 (gap-fill; RL10C-1/2 siblings here). RD-0146D/CECE-High/RL10C-2/RL10C-2-1 (own base parts ROE-RD0146/ROE-RL10B2 here) moved down to cryo_highThrustExpander, doctrine-4 fix 2026-07
    # 2026-07 (band-5 sweep): the RL-10C/CECE marks route here (downstream continuation of the RL10Fixed
    # lineage, same "idle-then-leap" precedent already used for this node's own T7->T11 jump).
  - id: cryo_deepThrottleExpander
    title: "Deep-Throttling Expander Cycle"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_deployableNozzleExpander]
    flavor: "Throttle a hydrogen expander to a tenth of its rated thrust and keep the turbine spinning on heat the chamber is barely making any more. Fifty starts instead of twenty, and a descent stage that can hover and pick its landing site rather than committing to one burn."
    upgrades: [RFUpgrade_CECE-Base]
  - id: cryo_extendedBellExpander
    title: "Extended-Bell Expander Nozzle"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_deployableNozzleExpander]
    flavor: "Grow the fixed bell as far as the fairing will take it. Sea-level performance falls away — irrelevant for a stage that never lights in air — and four more seconds of vacuum impulse come back for nothing but stowed length."
    upgrades: [RFUpgrade_RL10C-1A]
  - id: cryo_highExpansionNozzle
    title: "High-Expansion Vacuum Nozzle"
    discipline: Cryogenics
    tier: 13
    parents: [cryo_extendedBellExpander]
    flavor: "Past a certain area ratio the exhaust is colder than the metal and the nozzle stops being a pressure vessel at all. Sea-level Isp collapses to a number nobody quotes; in vacuum it is the best chemical engine anyone has built."
    upgrades: [RFUpgrade_RL10C-3]
  - id: cryo_extendibleNozzleDeployment
    title: "Extendible Nozzle Deployment"
    discipline: Cryogenics
    tier: 14
    parents: [cryo_highExpansionNozzle]
    flavor: "Stow the skirt around the chamber and slide it down on jackscrews once the stage is clear. The engine finally stops trading expansion ratio against the length of the vehicle — and gains a mechanism that must not jam, in vacuum, after a cold coast, exactly once."
    upgrades: [RFUpgrade_RL10E-1]
  - id: cryo_longLifeRestartExpander
    title: "Long-Life Restart Expander"
    discipline: Cryogenics
    tier: 15
    parents: [cryo_extendibleNozzleDeployment, cryo_deepThrottleExpander]
    flavor: "Two hundred and sixty starts. The igniter, the valves and the turbine bearings stop being qualified for a mission and start being qualified for a career — a stage that can loiter for months, phase, deorbit its own debris, and light again because nothing about lighting is scarce any more."
    upgrades: [RFUpgrade_RL10E-3EL]
  - id: cryo_extremeRestartExpander
    title: "Unlimited-Restart Expander"
    discipline: Cryogenics
    tier: 16
    parents: [cryo_longLifeRestartExpander]
    flavor: "Five hundred ignitions is not a bigger number than two hundred and sixty; it is the point where you stop counting them and start treating the engine as something you simply use. Orbital tugs, distributed launch, a stage whose limit is propellant and nothing else."
    upgrades: [RFUpgrade_RL10E-3ELL]
  - id: cryo_operationalHydroloxUpper
    title: "Operational Restartable Hydrolox Upper"
    discipline: Cryogenics
    tier: 11
    parents: [cryo_gasGeneratorHydrolox]
    flavor: "The gas-generator hydrolox upper grows up. Where the J-2 fired once, the LE-5 coasts and reignites ten times across a mission — the workhorse restartable upper of an operational launcher. Its own expander-bleed descendants split off to the expander lane."
    parts: [ROE-LE5]
    upgrades: [RFUpgrade_RL10A-4, RFUpgrade_LR87-LH2-VacuumUpgrade, RFUpgrade_KVD-1, RFUpgrade_HM-7B+]
    # doctrine-4 fix (2026-07): LE-5B-2/LE-5B-3 are this node's own base part's (ROE-LE5) later marks -
    # moved down to cryo_operationalHydroloxUpperII (new node, no existing child here).
  - id: cryo_operationalHydroloxUpperII
    title: "Further-Matured Restartable Hydrolox Upper"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_operationalHydroloxUpper]
    flavor: "The LE-5 keeps maturing mark by mark — more restarts, a little more thrust, the same workhorse upper stage refined rather than replaced."
    upgrades: [RFUpgrade_LE-5B-2, RFUpgrade_RL10A-4-1-2, RFUpgrade_LE-5B, RFUpgrade_AJ10-154, RFUpgrade_YF-75E, RFUpgrade_RL10C-2, RFUpgrade_HM-7B++]
    # doctrine-4 catch: LE-5B-2/LE-5B-3's own base part (ROE-LE5) lives in cryo_operationalHydroloxUpper.
  - id: cryo_boosterGasGenHydrolox
    title: "Booster-Class Gas-Generator Hydrolox"
    discipline: Cryogenics
    tier: 11
    parents: [cryo_largeHydrolox]
    flavor: "Having proven the reusable staged-combustion engine is buildable, the world's launch fleet turns around and walks away from it. The RS-68 — the most powerful hydrogen engine ever flown — is deliberately a gas-generator with an ablative nozzle, trading Isp for a price tag; Vulcain and the YF-77 make the same bargain for Ariane and Long March. The anti-SSME: simplicity at booster scale."
    parts: [ROE-RS68, cryoengine-vesuvius-1, YF77_Engine, YF77_Engine-double-withShell, rmm_rainier]
    upgrades: [RFUpgrade_M-1U]
    # doctrine-4 fix (2026-07): RS-68A/RS-68B/RS-68K/RS-800 are this node's own base part's (ROE-RS68)
    # later marks - moved down to cryo_combustionTapOff.

  # ---- Cryogenics: the SSME cycle goes international & exotic (FRSC) ----
  - id: cryo_operationalFRSC
    title: "Operational Fuel-Rich Staged-Combustion Hydrolox"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_ssme]
    flavor: "The hardest cycle in rocketry stops being one nation's secret. Fuel-rich staged-combustion hydrolox — the SSME's cycle — is rebuilt by two more programs: the RD-0120 lifts Energia, the LE-7 lifts the H-II. What took a superpower to master becomes something three space programs can pour."
    parts: [ROE-RD0120, ROE-LE7, rmm_ishtar]
  - id: cryo_seaLevelHydroloxNozzle
    title: "Sea-Level Hydrolox Nozzle"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_ssme]
    flavor: "Re-cut a vacuum-optimised hydrolox bell short enough to run at sea level without the exhaust tearing itself off the wall. You give up vacuum specific impulse to get an engine that can light on the pad — the price of a hydrogen first stage rather than a hydrogen upper."
    upgrades: [RFUpgrade_M-1SL, RFUpgrade_HG-3-SL]
    # LADDER PASS (2026-07-27): the -SL marks are a NOZZLE fork (ispSL 285 -> 352 against the vacuum
    # bells), not a further uprating step. One class, so both ride here under R4.
  - id: cryo_reusableTurbopumpUprating
    title: "Reusable Turbopump Uprating"
    discipline: Cryogenics
    tier: 14
    parents: [cryo_reusableEngineUprating]
    flavor: "The second pass over an engine already qualified to fly again: new turbopump rotors, a wider surge margin, and inspection intervals long enough that the overhaul between flights stops being a rebuild. Thrust follows, but the real gain is how many times you can do it."
    upgrades: [RFUpgrade_HG-3B-2, RFUpgrade_LE-7A-2, RFUpgrade_RD-0122, RFUpgrade_RD-57A-1, RFUpgrade_RS-25C, RFUpgrade_RL10C-1-1]
  - id: cryo_reusableChamberPressureCeiling
    title: "Reusable Chamber-Pressure Ceiling"
    discipline: Cryogenics
    tier: 15
    parents: [cryo_reusableTurbopumpUprating]
    flavor: "The last few percent, bought by running the chamber at a pressure the first version of this engine would not have survived. Everything downstream — throat, cooling channels, turbine inlet — is already at its limit, so each further kilonewton costs more than the one before it."
    upgrades: [RFUpgrade_RS-25D-E]
  - id: cryo_boosterHydroloxCeiling
    title: "Booster Hydrolox Thrust Ceiling"
    discipline: Cryogenics
    tier: 13
    parents: [cryo_boosterGasGenHydrolox, cryo_seaLevelHydroloxNozzle]
    flavor: "Eight meganewtons from a single hydrogen chamber firing at sea level — the largest liquid engine anyone ever drew, sized for a vehicle that would have made Saturn V look modest. The turbopump alone outpowers most launch vehicles; every part of it is at a limit somebody had to argue was reachable."
    upgrades: [RFUpgrade_M-1U-SL, RFUpgrade_RS-800, RFUpgrade_HG-3B-SL, RFUpgrade_HG-3B-SL-2]
  - id: cryo_reusableEngineUprating
    title: "Reusable-Engine Production Uprating"
    discipline: Cryogenics
    tier: 13
    parents: [cryo_operationalFRSC]
    flavor: "Every reusable and staged-combustion hydrolox engine now in service settles into its production marks — the SSME Block-I and Block-II, the RD-0120M, the LE-7A, the maturing HG-3 and deep-throttle chains — the unglamorous decade of squeezing margin out of engines already flying."
    parts: [rmm_arsia]
    upgrades: [RFUpgrade_RS-25A, RFUpgrade_RS-25D-50X, RFUpgrade_RD-0120M, RFUpgrade_LE-7A, RFUpgrade_HG-3B, RFUpgrade_LR129-P-3, RFUpgrade_RD-57M, RFUpgrade_LRBE-BlockII, RFUpgrade_SSBE-BlockII, RFUpgrade_RL10A-4-2N, RFUpgrade_LE-5B-3, RFUpgrade_RL10C-2-1]
    # rmm_arsia/RS-25-650 (2026-07, band-5 gap sweep): a real uprated-SSME production-study mark - fits
    # this node's own "production marks maturing in service" theme exactly, breaks its former upgrades-only
    # shape but that was incidental, not a design rule.
  - id: cryo_tripropellant
    title: "Tripropellant Staged Combustion"
    discipline: Cryogenics
    tier: 12
    parents: [cryo_ssme, pc_zenitKerolox]
    flavor: "One engine, two fuels, switched in flight. At liftoff it burns dense kerosene for thrust off the pad; at altitude it crosses over to hydrogen for Isp — a single powerplant doing the job of a two-propellant staircase. The RD-701 was meant to lift the MAKS spaceplane; making it work needs both the staged-combustion hydrolox cycle and oxidiser-rich kerolox at once."
    parts: [nflv-engine-rd701-1, nflv-engine-rd704-1, rmm_dugong]
  - id: cryo_methaloxStagedCombustion
    title: "Methalox Staged Combustion"
    discipline: Cryogenics
    tier: 12
    parents: [pc_zenitKerolox]
    flavor: "Methane splits the difference: colder than kerosene, denser than hydrogen, clean-burning and one day makeable on Mars. The LRBE is the tree's first methalox engine — a staged-combustion booster on a fuel nobody flew yet, the seed of a lane that a later era will grow into."
    parts: [rmm_arenysaurus, ROE-BE4]
    upgrades: [RFUpgrade_STBE-3]
    # ROE-BE4 (2026-07, band-5 sweep): real oxidiser-rich staged combustion on methane (New Glenn/Vulcan) -
    # exactly the mechanism this node's title already names, joining LRBE as its second methalox-ORSC king.

  # ---- PropellantChemistry: oxidiser-rich kerolox dynasty ----
  - id: pc_multiChamberORSC
    title: "High-Thrust Multi-Chamber ORSC"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_zenitKerolox]
    flavor: "Oxidiser-rich staged combustion hits its ceiling. The RD-170 — four chambers off one turbopump, 7900 kilonewtons — is the most powerful liquid-propellant engine ever built, the monster that lifts Energia and Zenit. Where the N1's engines never flew and Zenit's was only an upper, this is the chemistry's operational record."
    parts: [ROE-RD170, YF100_Engine_S, YF100_Engine-double-withShell2]
    # upgrades: [] — emptied by retarget_upgrades
    # doctrine-4 fix (2026-07): RD-171M (own base part ROE-RD170) and YF-100K (own base parts YF100_Engine_S
    # / YF100_Engine-double-withShell2, both live here) moved down to pc_modularORSC.
  - id: pc_modularORSC
    title: "Modular Oxidiser-Rich Kerolox"
    discipline: PropellantChemistry
    tier: 12
    parents: [pc_multiChamberORSC]
    flavor: "The record engine gets cut into pieces you can sell. Halve the RD-170's four chambers and you have the RD-180 for Atlas; quarter it and you have the single-chamber Angara engine. Same core hardware, packaged into a modular family for the export and commercial market."
    parts: [ROE-RD180, ROE-RD191]
    upgrades: [RFUpgrade_RD-171, RFUpgrade_RD-120K, RFUpgrade_RD-191, RFUpgrade_YF-100K, RFUpgrade_RD-171M, RFUpgrade_RD-116-8D420K, RFUpgrade_AJ26-62]
    # doctrine-4 fix (2026-07): RD-171M/YF-100K moved down from pc_multiChamberORSC (own base parts there).
    # RD-181/RD-193 (this node's OWN base part ROE-RD191's later marks) moved further down to
    # pc_modularORSCII, since this node has no other child.
    # ROE-RD191 (2026-07, band-5 sweep): the single-chamber Angara engine this node's own flavor text
    # already narrated ("quarter it and you have the single-chamber Angara engine") - its base part was
    # simply never added. Same real RD-170-derived hardware family as RD-180.
  - id: pc_modularORSCII
    title: "Modular Kerolox Re-Sizing"
    discipline: PropellantChemistry
    tier: 13
    parents: [pc_modularORSC]
    flavor: "Cut the same modular RD-170 hardware into two more shapes — a lighter single-chamber mark for a smaller booster, and an export version re-plumbed for someone else's pad."
    upgrades: [RFUpgrade_RD-181, RFUpgrade_RD-193, RFUpgrade_AJ26-59, RFUpgrade_RD-172-173, RFUpgrade_RD-58S]
    # doctrine-4 catch: RD-181/RD-193's own base part (ROE-RD191) lives in pc_modularORSC.
  - id: pc_operationalStorableORSC
    title: "Operational Storable Staged Combustion"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_refinedStorableORSCII]
    flavor: "The storable staged-combustion engines of Proton and its kin reach their final operational marks — the RD-275 first stage, the Kosberg upper stages — the last refinements of a hypergolic booster line that has been flying since the sixties."
    upgrades: [RFUpgrade_RD-275, RFUpgrade_RD-253-Mk4, RFUpgrade_RD-254-11D44-Mk4, RFUpgrade_RD-277-14D16, RFUpgrade_RD-0210-Mk3, RFUpgrade_RD-0212-Mk3, RFUpgrade_RD-0213-Mk3, RFUpgrade_RD-254-11D44-Mk3, RFUpgrade_RD-253-Mk3]  # RD-254-11D44-Mk3 added 2026-07 (gap-fill; Mk4 sibling here)

  # ---- FluidDynamics: storable uppers + terminal gas-generator kerolox ----
  - id: fd_multiRestartStorableUpper
    title: "Multi-Restart Storable Upper Stage"
    discipline: FluidDynamics
    tier: 11
    parents: [fd_restartableUpperMaturation]
    flavor: "Coast, reignite, coast again — dozens of times, across days. The Fregat and Briz upper stages and their kin are storable propulsion modules built for the choreography of an interplanetary or multi-orbit mission, restarting on demand where the single-shot Agena and early AJ10 could not. The Transtar rates five hundred ignitions."
    parts: [ROE-S592, restock-engine-125-pug, ROE-AJ10-transtar, ROE-S598M, ROE-AJ10AdvLong]
    upgrades: [RFUpgrade_AJ10-118F, RFUpgrade_TR-201]
    # doctrine-4 fix (2026-07): Aestus-II/AestusMod are this node's own base part's (restock-engine-125-pug)
    # later marks - moved down to fd_multiRestartStorableUpperII (new node, no existing child here).
  - id: fd_multiRestartStorableUpperII
    title: "Further-Refined Multi-Restart Storable Upper Stage"
    discipline: FluidDynamics
    tier: 12
    parents: [fd_multiRestartStorableUpper]
    flavor: "Aestus keeps pace with the rest of the multi-restart storable family — a modified chamber, then a second-generation successor, the same choreography refined one mark further."
    upgrades: [RFUpgrade_Aestus-II, RFUpgrade_Model8096A, RFUpgrade_AJ10-156]
    # doctrine-4 catch: AestusMod/Aestus-II's own base part (restock-engine-125-pug) lives in fd_multiRestartStorableUpper.
  - id: fd_keroloxClusterCeiling
    title: "Kerolox Cluster Thrust Ceiling"
    discipline: FluidDynamics
    tier: 10
    parents: [fd_matureKeroloxClusterUprating]
    flavor: "Keep pushing the same gas-generator chamber past where its designers stopped. Injector face, throat erosion and the gas generator's own turbine all start arguing at once, and each further ten percent costs a qualification programme of its own."
    upgrades: [RFUpgrade_H-2-250K, RFUpgrade_H-1-250K, RFUpgrade_E-1-575k, RFUpgrade_F-1A]
  - id: fd_keroloxClusterApex
    title: "Kerolox Cluster Apex"
    discipline: FluidDynamics
    tier: 11
    parents: [fd_keroloxClusterCeiling]
    flavor: "The last version anyone built of an engine that had been uprated for twenty years. Nothing here is elegant — it is a mature design run as hard as its metallurgy allows, kept in production because the vehicle around it was already qualified."
    upgrades: [RFUpgrade_H-2-300K, RFUpgrade_E-1-Upgrade2, RFUpgrade_Merlin1D++]
  - id: fd_terminalGasGenKerolox
    title: "Terminal Gas-Generator Kerolox Uprating"
    discipline: FluidDynamics
    tier: 11
    parents: [fd_gasGeneratorApex]
    flavor: "The gas-generator kerolox engines that built the space age take their final bow. The last production marks of Delta's RS-27, Atlas's RS-56 and Titan's LR87/LR91 — a lineage of open-cycle workhorses being uprated one last time as staged combustion walks past them."
    upgrades: [RFUpgrade_RS-27A, RFUpgrade_RS-56-OBA, RFUpgrade_RS-56-OSA, RFUpgrade_LR87-AJ-11A, RFUpgrade_LR91-AJ-11A, RFUpgrade_LR101-NA-15, RFUpgrade_Model8096C, RFUpgrade_E-1A_KS, RFUpgrade_Viking-6]
  - id: fd_advancedGasGenKerolox
    title: "Advanced Gas-Generator Kerolox Booster"
    discipline: FluidDynamics
    tier: 11
    parents: [fd_gasGeneratorApex]
    flavor: "America's answer to the imported RD-180 that never got built. The STBE was a big, simple gas-generator kerolox booster engine drawn for the next launcher — the domestic alternative to buying Russian staged combustion, shelved when the RD-180 won on price."
    parts: [nflv-engine-stbe-kero-1, cryoengine-allosaur-1, rmm_turiasaurus]

  # ---- PropellantChemistry: filament-wound composite solids ----
  - id: pc_filamentWoundSolid
    title: "Filament-Wound Composite-Case Solids"
    discipline: PropellantChemistry
    tier: 10
    parents: [pc_shuttleSRB]
    flavor: "Wind the motor case out of graphite and epoxy instead of forging it from steel, and the dead weight falls away. The filament-wound composite case — on the giant SRMU, the standalone Castor 120, the Titan solids — is the material leap past the heavy segmented steel of the Shuttle booster, more impulse for less structure."
    parts: [ROE-SRMU, ROE-Castor120, ROE-UA1208, ROE-1208sepMotor, ROE-Castor30, ROE-Castor30XL]
    upgrades: [RFUpgrade_FWC-SRM, RFUpgrade_RSRM-1986, RFTech-solids-tltech4, RFTech-solids-tltech6, RFTech-solids-tltech7]  # +solids-tltech4 (1972 solid tech-level) 2026-07 Group-B
    # ROE-Castor30/30XL (2026-07, band-5 sweep): direct siblings of Castor 120 already here - same real
    # Castor-30-series commercial family (Antares stage 2), not a separate lineage. Reaches the 6-part cap.
  - id: pc_gemStrapOnCatalog
    title: "Graphite-Epoxy Strap-On Catalog"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_filamentWoundSolid]
    flavor: "The commercial strap-on aisle. Bolt on as many graphite-epoxy motors as the payload needs — the Delta GEM family in three lengths, the Atlas AJ-60 — a fixed catalogue of composite boosters sized to order off the composite-case breakthrough."
    parts: [ROE-GEM60, ROE-GEM40, ROE-GEM46, ROE-AJ60, ROE-GEM63]
    # ROE-GEM63 (2026-07, band-5 sweep): the fourth Delta/Vulcan graphite-epoxy strap-on length.

  # ---- ElectricalPower: electric propulsion comes of age ----
  - id: ep_operationalHall
    title: "Operational Hall-Effect Thruster"
    discipline: ElectricalPower
    tier: 11
    parents: [ep_higherPowerHallThruster]
    flavor: "The Hall thruster leaves the laboratory. The SPT-100 and its bigger siblings become flight-qualified hardware, first for stationkeeping and then as primary propulsion — a few grams-force of thrust at sixteen hundred seconds of Isp, the electric workhorse of the coming decades."
    parts: [RO-SPT100, RO-SPT140, RO-PPS1350]
    upgrades: [RFUpgrade_SPT-50M, RFUpgrade_SPT-70M]
    # doctrine-4 fix (2026-07): SPT-70M/SPT-70MK moved down from ep_higherPowerHallThruster (own base part's
    # later marks there); SPT-100D/SPT-100M/SPT-140D moved further down to ep_highPowerHall for the same
    # reason (this node's own base parts RO-SPT100/RO-SPT140).
    # POWER-CLASS PASS (2026-07-28): 457M-V1-K (74 kW) moved OUT to ep_kryptonHighPower. It sat here beside
    # SPT-50M at 0.2 kW — a 437x power spread on one purchase. The two that remain are both sub-kilowatt
    # station-keeping marks, which is this node's own class.
  - id: ep_highPowerHall
    title: "High-Power Nested Hall Thruster"
    discipline: ElectricalPower
    tier: 12
    parents: [ep_operationalHall]
    flavor: "Scale the Hall thruster into the tens of kilowatts. The 457M's nested channels swallow seventy-two kilowatts and push the Isp past two thousand seconds — the class of electric engine that could one day move cargo rather than just trim an orbit."
    parts: [RO-457M]
    # doctrine-4 fix (2026-07): SPT-100D/SPT-100M/SPT-140D moved down from ep_operationalHall (own base
    # parts' later marks there); 457M-V2 moved further down to ep_nasaHighPowerHall for the same reason
    # (this node's own base part RO-457M).
    # POWER-CLASS PASS (2026-07-28): all three configs moved OUT to the PPU lane — SPT-100B/SPT-140D
    # (1-4 kW) to ep_kilowattPPU, PITV-Hydrazine-40 (24 kW) to ep_fiftyKilowattPPU. This node keeps its
    # part (RO-457M) and its mechanism; what it no longer does is hand you three power classes at once.
  - id: ep_griddedIon
    title: "Gridded Ion Electrostatic Thruster"
    discipline: ElectricalPower
    tier: 12
    parents: [ep_hallEffectThruster]
    flavor: "A different way to throw ions: accelerate them through charged grids instead of a magnetic field, and the exhaust speed climbs higher still. NSTAR flew on Deep Space 1 — the first time an ion engine, not a chemical rocket, was the main drive of a probe to another world."
    parts: [ionEngine]
  - id: ep_pulsedInductive
    title: "Pulsed Inductive Thruster"
    discipline: ElectricalPower
    tier: 12
    parents: [ep_higherPowerHallThruster]
    flavor: "No electrodes to erode — a pulsed magnetic field ionises and flings a puff of ammonia, and repeats thousands of times a second. The PIT reaches seven thousand seconds of Isp, an experimental high-power concept for the kind of cruise no chemical stage could sustain."
    parts: [pit-125, pit-0625, RO-nupit]
    # pit-0625 (FARAD)/RO-nupit (NuPIT) (2026-07, band-5 sweep): both pulsed-inductive thrusters, the exact
    # mechanism this node already hosts - widened rather than a duplicate node.
    # doctrine-4 fix (2026-07): PITV-Ammonia-1200/PITV-Hydrazine-1200/NuPIT-7000 are this node's own base
    # parts' (pit-125/RO-nupit) later marks - moved down to ep_pulsedInductiveII (new node).
  - id: ep_kryptonFeed
    title: "Krypton Propellant Feed"
    discipline: ElectricalPower
    tier: 13
    parents: [ep_highPowerHall]
    flavor: "Xenon is the better propellant and always will be — heavier, easier to ionise, kinder to the grids. It is also scarce enough that a large constellation would corner the world supply. Krypton is a tenth the price, costs you thrust and erodes the channel faster, and it is what you fly when you need to build a thousand of them."
    upgrades: [RFUpgrade_SPT-70MK]
    # LADDER PASS (2026-07-27): the -K marks are a PROPELLANT fork (KryptonGas against XenonGas), not an
    # uprating step -- SPT-70MK is 120 s of Isp WORSE than the xenon mark it sat next to.
    # POWER-CLASS PASS (2026-07-28): X3-HV-K (219 kW) moved OUT to ep_kryptonHighPower — it sat here beside
    # SPT-70MK at 0.4 kW, a 612x spread and the worst in the tree. Krypton is a real fork and keeps its own
    # node; what it cannot also be is a power class. This node is now krypton at station-keeping scale, and
    # ep_kryptonHighPower carries the conjunction (krypton AND the 100 kW power chain) in its PARENTS.
  # ---- POWER-PROCESSING LADDER (the PPU lane) — added 2026-07-28 ----
  # For electric propulsion the enabling breakthrough is not the thruster, it is the POWER CHAIN: array ->
  # PPU -> radiator. A 0.2 kW SPT-50 and a 74 kW 457M are the same physics and completely different
  # engineering, and the whole difference is in what feeds them. So an EP config homes at the power class
  # it needs; the thruster is the PART, the power chain is the TECH.
  # This is the same two-axis split the solar lanes got: mechanism (how the thruster works, carries the
  # parts) crossed with power (what you can feed it, carries the configs). It replaces four nodes that
  # carried no parts at all and existed only as generation pegs to hang configs on -- ep_pulsedInductiveII,
  # ep_nasaHighPowerHallII, ep_nextGenGriddedIonII and ep_kilowattClassPPU. That last one was this idea
  # already, invented ad hoc: it was called "Kilowatt-Class Power Processing" and held 68-72 kW configs.
  # Bands are the natural clusters in the data (manifest/engine-stats.tsv thrust x Isp -> input power), each
  # roughly 3-5x wide, which is why the EP power gate's threshold is 5x.
  # WORKING FLUID stays a separate axis and is expressed in PARENTS, not by folding it in here (user call):
  # ep_kryptonFeed and ep_kryptonHighPower carry the krypton configs and gate on the matching PPU rung.
  - id: ep_kilowattPPU
    title: "Kilowatt-Class Power Processing"
    discipline: ElectricalPower
    tier: 11
    parents: [ep_higherPowerHallThruster]
    flavor: "A thruster is only as good as the box behind it. Take the discharge supply past a kilowatt — regulated, radiation-tolerant, and able to shed its own switching losses — and the electric drive stops being a stationkeeping trim and starts being propulsion a satellite is designed around."
    upgrades: [RFUpgrade_SPT-100B, RFUpgrade_SPT-100D, RFUpgrade_SPT-100M, RFUpgrade_SPT-140D]
  - id: ep_multiKilowattPPU
    title: "Multi-Kilowatt Discharge Supply"
    discipline: ElectricalPower
    tier: 12
    parents: [ep_kilowattPPU]
    flavor: "Ten kilowatts through a single discharge supply, and the waste heat of running it becomes the design problem rather than the electronics. This is the class that moves a real spacecraft under its own electric power instead of merely holding it in station."
    upgrades: [RFUpgrade_AEPS]
  - id: ep_fiftyKilowattPPU
    title: "Fifty-Kilowatt Power Conditioning"
    discipline: ElectricalPower
    tier: 13
    parents: [ep_multiKilowattPPU]
    flavor: "Past twenty kilowatts the power chain stops resembling spacecraft electronics and starts resembling a substation: high-voltage switching, deliberate thermal paths, and an array whose area is now the vehicle's defining feature. Every experimental thruster of the era waits on this box."
    upgrades: [RFUpgrade_PITV-Hydrazine-40, RFUpgrade_DS4G-25-mid, RFUpgrade_DS4G-25-hi, RFUpgrade_457M-V2, RFUpgrade_DS4G-50-low, RFUpgrade_DS4G-50-hi]
  - id: ep_hundredKilowattPPU
    title: "Hundred-Kilowatt Power Conditioning"
    discipline: ElectricalPower
    tier: 14
    parents: [ep_fiftyKilowattPPU, elec_galliumArsenideCell]
    flavor: "A hundred kilowatts is where solar-electric propulsion stops being a probe technology. The array is measured in hundreds of square metres, the radiators rival it in area, and the conditioning stage is a larger engineering problem than the thruster it feeds."
    upgrades: [RFUpgrade_X3-HV, RFUpgrade_NuPIT-7000]
  - id: ep_megawattPPU
    title: "Megawatt Power Conditioning"
    discipline: ElectricalPower
    tier: 15
    parents: [ep_hundredKilowattPPU, nuc_modernFissionReactor]
    flavor: "At a megawatt the sun is no longer a plausible source and the question becomes what else you are willing to carry. The conditioning stage that survives this much power is the gate on every high-thrust electric concept ever drawn — the pulsed inductive machines that would push tonnes rather than kilogrammes."
    upgrades: [RFUpgrade_PITV-Ammonia-1200, RFUpgrade_PITV-Hydrazine-1200]
    # Both 1200-class configs sit here: one power uprate on two working fluids, ammonia at Isp 7000 and
    # hydrazine at 4100 — a CHOICE of propellant, not two generations. R1 permits it because electric
    # propulsion is exempt (build_tree.py `_is_electric`). PITV-Hydrazine-1200 reached the EP lane at all
    # only on 2026-07-28: it had been stranded on pc_hydrazineMonoprop T5, homed by its propellant, seven
    # tiers below its own host part.
    # CROSSOVER — nuc_modernFissionReactor (NuclearEngineering T11). This node inherited a SOLAR parent
    # (elec_metamorphicMultijunction) from ep_kilowattClassPPU, which it replaces, and that contradicted its
    # own flavor: a megawatt off the best modern cell at 301 W/m² is ~3,300 m² of array, which is why real
    # megawatt-class electric propulsion is nuclear-electric and nothing else. Swapped, not added — the
    # solar dependency stays where it is still true, on ep_hundredKilowattPPU (elec_galliumArsenideCell).
    # The lane now says the thing it means: solar carries you to a hundred kilowatts, fission takes you to
    # a megawatt.
  - id: ep_kryptonHighPower
    title: "High-Voltage Krypton Discharge"
    discipline: ElectricalPower
    tier: 15
    parents: [ep_kryptonFeed, ep_hundredKilowattPPU]
    flavor: "Krypton ionises harder than xenon and wants more volts to do it, which is tolerable on a stationkeeping thruster and punishing on anything drawing a fifth of a megawatt. Run the cheap propellant at that scale — through a nested Hall channel or a magnetic nozzle alike — and the constellation that was unaffordable in xenon becomes buildable."
    upgrades: [RFUpgrade_457M-V1-K, RFUpgrade_X3-HV-K, RFUpgrade_VF-200-Kr, RFUpgrade_VX-200SS-Kr]
    # The conjunction the user asked for, expressed in PARENTS: krypton (ep_kryptonFeed) AND the power chain
    # that can drive it (ep_hundredKilowattPPU). A config carries only one techRequired, so the AND has to
    # live on the node. 74 kW and 219 kW is a 3x spread — inside the gate's 5x band.

  # ---- NuclearEngineering: NTR matures past NERVA ----
  - id: nuc_ammoniaWorkingFluid
    title: "Ammonia Reactor Working Fluid"
    discipline: NuclearEngineering
    tier: 11
    parents: [nuc_flightRatedNTR]
    flavor: "Feed the reactor ammonia instead of hydrogen. Specific impulse halves — the exhaust is heavy now — but thrust doubles and the propellant stops needing a cryogenic tank that boils off on the way to anywhere. A nuclear engine you can leave parked for a year."
    upgrades: [RFUpgrade_PEWEE100-Ammonia, RFUpgrade_NERVA-I-Ammonia, RFUpgrade_RD-0410MID-Ammonia, RFUpgrade_BNTR-Ammonia, RFUpgrade_SNTPPFE100-Ammonia]
    # LADDER PASS (2026-07-27): NTR "upgrades" that halve Isp are not uprates at all -- they are
    # WORKING-FLUID forks, trading exhaust velocity for thrust and storability. They belong at the fluid.
  - id: nuc_methaneWorkingFluid
    title: "Methane Reactor Working Fluid"
    discipline: NuclearEngineering
    tier: 12
    parents: [nuc_ammoniaWorkingFluid]
    flavor: "Methane splits in the core and leaves carbon behind on everything it touches, which is why nobody flew it — but it is denser than hydrogen, milder than ammonia, and sits in a tank the same equipment already handles. Forty seconds better than ammonia for a reactor you will have to inspect afterwards."
    upgrades: [RFUpgrade_PEWEE100-Methane, RFUpgrade_NERVA-I-Methane, RFUpgrade_RD-0410MID-Methane, RFUpgrade_RD-0410MID-MethaneSpec]
  - id: nuc_blendedWorkingFluid
    title: "Blended Reactor Working Fluid"
    discipline: NuclearEngineering
    tier: 13
    parents: [nuc_methaneWorkingFluid]
    flavor: "Mix the ammonia with methane and you get most of methane's exhaust velocity without all of its carbon, or most of ammonia's manners without its weight. Neither propellant alone was the right answer, so the answer stopped being one propellant."
    upgrades: [RFUpgrade_RD-0410MID-MethaneSpec, RFUpgrade_BNTR-Methane, RFUpgrade_SNTPPFE100-Methane]
    # LADDER PASS (2026-07-27): these read as "-Methane" but their propellant string is LqdAmmonia+LqdMethane
    # -- a BLEND, distinct from the pure-methane marks they were sharing a node with.
  - id: nuc_flightDesignNTR
    title: "Flight-Design Solid-Core NTR"
    discipline: NuclearEngineering
    tier: 12
    parents: [nuc_flightRatedNTR]
    flavor: "The nuclear rocket stops being a ground-test article and becomes a flight design. The Soviet RD-0410 was actually built and fired; NERVA II is the largest solid-core engine ever drawn. The end of the solid-core line — reactors meant, at last, to leave the ground."
    parts: [RD0410MID, ROE-NERVAII, restock-engine-cherenkov]
  - id: nuc_particleBedNTR
    title: "Particle-Bed NTR"
    discipline: NuclearEngineering
    tier: 12
    parents: [nuc_flightRatedNTR]
    flavor: "Pack the reactor fuel as loose particles instead of solid rods and the coolant can pull heat out far faster — more power in less core. The particle-bed NTR of the Timberwind program is a denser, hotter path to the same nuclear thrust."
    parts: [ROE-SNTPPFE100]
    # doctrine-4 fix (2026-07): SNTPPFE100-Hydrogen is this node's own base part's later mark - moved down
