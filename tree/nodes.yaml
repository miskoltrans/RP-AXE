  # ---- Lane 7: nuclear -- NTR maturation, split clean from Nuclear Pulse (Orion) ----
  - id: nuc_fullScaleNTRTesting
    title: "Full-Scale Nuclear Thermal Testing"
    discipline: NuclearEngineering
    tier: 10
    parents: [nuc_nuclearThermalRocket]
    flavor: "Move on from a demonstration reactor to full engine-scale ground tests — NRX proves the reactor survives real duty, Phoebus proves it can run bigger still, NERVA-XE proves the whole engine system together. The ground-test programme a flight engine still has to earn its way out of."
    parts: [NERVA_NRX, Phoebus1N50, ROE-NERVAXE]
    # Real lineage: KIWI (already kinged in nuc_nuclearThermalRocket) -> NRX -> Phoebus-1 -> NERVA-XE, the
    # actual NASA/AEC ground-test progression toward a flight engine.
  - id: nuc_flightRatedNTR
    title: "Flight-Rated Nuclear Thermal Engine"
    discipline: NuclearEngineering
    tier: 11
    parents: [nuc_fullScaleNTRTesting]
    flavor: "The design NASA actually meant to fly — bracketed by Pewee's efficiency record and Phoebus-2A's raw power, the ground tests that shaped it. Cancelled in 1972 before it ever left the test stand; build it here instead."
    parts: [ROE-NERVA, PEWEE100, Phoebus2N100, RO-KA-PrincetonLNTR]
    # King NERVA I - the flight-design goal of the whole US NTR programme. Pewee (highest-Isp test
    # article) and Phoebus-2A (most powerful test) ride along; Princeton LNTR (a modern LEU what-if
    # design) too. Ties cryo_ssme for the deepest tier in this pass - both real flight-design capstones.
  - id: str_pusherPlate
    title: "Pusher-Plate Shock Absorption"
    discipline: StructuresMechanisms
    tier: 9
    parents: [str_stationStructures]
    flavor: "A thick steel plate that shrugs off a nuclear detonation close enough to push it, backed by a two-stage shock absorber that turns a violent kick into an acceleration a crew can survive. Nothing about the fission itself is the hard part — surviving your own propulsion is."
    # Pure structural/mechanical enabler, no curated part represents it directly (like cryo_hydrogen's
    # empty commitment gate) - the real prerequisite Nuclear Pulse Propulsion needs and nothing else in
    # the tree provides. Added per standing user TODO to split Orion cleanly from the NTR reactor ladder.
  - id: nuc_pulsePropulsion
    title: "Nuclear Pulse Propulsion"
    discipline: NuclearEngineering
    tier: 10
    parents: [nuc_fissionReactor, str_pusherPlate]
    flavor: "Skip the reactor and the nozzle entirely — drop small fission charges out the back and ride the shockwave off an ablative plate, one controlled detonation at a time. Absurd, filthy, and on paper the only chemistry-free way to put a truly heavy ship anywhere in the solar system fast. Project Orion never flew; here, it can."
    parts: [RO-fftorion8, RO-fftorion12, fft-fission-orion-5-1, fft-fueltank-pulseunits-5-1, fft-fueltank-pulseunits-5-2, fft-fueltank-pulseunits-5-3, RO-fft20mMMOtank, fft-fueltank-targets-5-1]
    # Pulse-unit magazines (small/medium/large) added (2026-07, materials pass): the drive's own ammunition
    # tankage - rides with its king, same pattern as any engine + its dedicated fuel tank.
    # Crossover: fissile-material access (nuc_fissionReactor) x the pusher-plate/shock-absorber enabler
    # above. Deliberately NOT parented on nuc_nuclearThermalRocket - mechanically unrelated to a reactor
    # heating propellant (RP-1 only grouped Orion with NRX/Phoebus/NERVA-XE by calendar year). What-if/fun
    # curation (Orion never flew) - a what-if sim, not a documentary. Pulse-unit magazine tankage
    # (fft-fueltank-pulseunits-5-1/2/3) joins this king once the non-engine parts pass authors it.

  # ---- Lane 8: electric propulsion -- brand-new lane (ion/Hall-effect thrusters) ----
  - id: ep_hallEffectThruster
    title: "Hall-Effect Ion Acceleration"
    discipline: ElectricalPower
    tier: 9
    parents: [elec_siliconPV, nuc_isotopePowerII]
    flavor: "Trap electrons in a magnetic field to ionise a noble gas, then let an electric field fling the ions out far faster than any flame — thrust measured in millinewtons, specific impulse measured in the thousands of seconds. Too weak to launch anything, and exactly what a satellite needs to hold its station for a decade on a tank of xenon."
    parts: [RO-SPT50, RO-SPT60, RO-ionSPT60]
    # First placement of electric propulsion anywhere in the tree. Crossover: needs continuous kW-class
    # power (elec_siliconPV solar, nuc_isotopePowerII RTGs) to run at all - rewires "electrical power" into
    # "propulsion" for the first time. `ep_` prefix (not `elec_`, already used by both ElectricalPower
    # diodes/PV and Microelectronics transistors/ICs).
  - id: ep_higherPowerHallThruster
    title: "Higher-Power Hall Thrusters"
    discipline: ElectricalPower
    tier: 10
    parents: [ep_hallEffectThruster]
    flavor: "The same magnetic bottle, fed more power and more propellant — still a whisper of thrust, still an Isp no chemical engine will ever touch."
    parts: [RO-SPT70]
    # doctrine-4 fix (2026-07): SPT-70M/SPT-70MK are this node's own base part's later marks - moved down
    # to ep_operationalHall.

