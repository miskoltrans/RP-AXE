    # rob_rotorActuation like every other actuator sibling, not forced under the wheel node. Same real
    # tech bucket as the wheels (advancedMotors); split by mass into small/heavy classes below.
  - id: rob_heavyTrackDrive
    title: "Heavy-Class Track Drive"
    discipline: Robotics
    tier: 8
