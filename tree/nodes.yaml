  # ================================================================================================
  # ===================== BAND 3 * RCS PROPELLANT CHEMISTRY (T7) — Cluster F, resolved =============
  # ================================================================================================
  - id: pc_storableRcsPropellants
    title: "Storable RCS Propellant Selection"
    discipline: PropellantChemistry
    tier: 8
    parents: [pc_ntoHypergolics, gnc_smallRcsCatalog]
    flavor: "The same reaction-control block, filled with whatever storable hypergolic blend the mission calls for — five real combinations flown across five different programs, none of them meaningfully better than the others. A menu, not a ladder."
    upgrades: [RFUpgrade_MMH+NTO, RFUpgrade_MMH+MON3, RFUpgrade_MMH+MON10, RFUpgrade_UDMH+NTO, RFUpgrade_Aerozine50+NTO, RFUpgrade_ISPS, RFUpgrade_ISPS-HDA, RFTech-rcs-tltech2, RFTech-rcs-tltech3]
    # 2026-07 (tail): ISPS/ISPS-HDA extend the storable-RCS propellant menu; rcs-tltech3 continues
    # the RCS tech-level ladder (bases in gnc_rcs, doctrine-4 clean).
    # Confirmed via the live RealismOverhaul config (thrusterPower 0.442-0.455, ALL specLevel=operational):
    # a genuine simultaneous menu, not a sequence — matches why no era-ordering was ever findable.
    # LADDER PASS (2026-07-27, docs/UPGRADE-LADDERS.md step 3): this node kept EXACTLY the class its title
    # and flavor name. The five storables above are one measured performance point (1.78 kN / Isp 0.95 —
    # MMH+NTO, MMH+MON3, MMH+MON10, UDMH+NTO, Aerozine50+NTO), so they are one decision presented as five
    # flavors, which is what "a menu, not a ladder" always meant. What left were seven OTHER chemistries
    # added later as gap-fill, each a genuinely different performance point that was never storable at all:
    #   Hydrazine -> pc_hydrazineMonoprop | ASCENT -> pc_ascent | Ethanol+O2 -> pc_cryogenicRcsFeed
    #   RP-1+O2, Syntin+O2 -> fd_reusableGasGenKerolox | H2+O2 -> cryo_deepThrottleHydrolox
    #   CH4+O2 -> cryo_smallScaleMethalox
    # (HTP was already correctly homed at pc_htp and NitrousOxide never carried a token — it comes free
    # with the thruster via the layer-1 fallback, like the Nitrogen/Helium cold gas.)
    # The +O2 combos are a CRYOGENIC-FEED capability, not fuel forks — gating each at its fuel's own tier
    # would have put Isp-0.95 RCS at T2 and left this T8 node worth only +29% thrust over it.
  # ---- RCS chemistry forks pulled out of the storable menu (2026-07-27, docs/UPGRADE-LADDERS.md) ----
  - id: pc_hydrazineMonoprop
    title: "Catalytic Hydrazine Decomposition"
    discipline: PropellantChemistry
    tier: 5
    parents: [pc_hypergolics, pc_htp]
    flavor: "Run hydrazine over an iridium catalyst bed and it tears itself apart into hot gas with no oxidiser and no ignition — one tank, one valve, a thruster that fires ten thousand times and never needs a spark. The attitude control of nearly every satellite ever flown, and the reason a spacecraft can still point itself after a decade in the dark."
    upgrades: [RFUpgrade_Hydrazine]
    # RFUpgrade_PITV-Hydrazine-1200 moved OUT 2026-07-28 -> ep_pulsedInductiveII (T13). It was homed here by
    # PROPELLANT, but the propellant fork had already happened: PITV-Hydrazine-40 ("this thruster can burn
    # hydrazine") sits on ep_highPowerHall T12, so the -1200 is a POWER uprate inside an already-unlocked
    # fork, 24 kW -> 737 kW. Homing it on a T5 catalytic-monoprop node put a 737 kW pulsed inductive
    # thruster SEVEN TIERS BELOW its own host part (pit-125, on ep_pulsedInductive T12) — buying the
    # thruster handed you the top of its hydrazine branch free, while the ammonia twin cost a T13 node.
    # The ladder gate never caught it: R2 exempts propellant FORKS from rung ordering, and a fork's own
    # internal ordering is never checked (docs/UPGRADE-LADDERS.md).
    # The catalyst bed is the mechanism, so this gates on peroxide's silver catalyst as much as on the
    # amine lane that supplies the fuel — both parents are real prerequisites, not a decorative crossover.
  - id: pc_cryogenicRcsFeed
    title: "Cryogenic Reaction-Control Feed"
    discipline: PropellantChemistry
    tier: 10
    parents: [pc_storableRcsPropellants, cryo_deepThrottleHydrolox]
    flavor: "Stop carrying a second propellant just to turn: tap the main tanks and feed the attitude thrusters the same cryogens the engine burns, through lines that must not boil, freeze or gulp vapour when the vehicle is coasting and cold. Dead mass disappears, and every drop left in the tank is usable either way."
    upgrades: [RFUpgrade_Ethanol+O2, RFTech-AddOxygenGas, RFTech-rcs-tltech6]
  - id: pc_ascent
    title: "Ionic-Liquid Monopropellant"
    discipline: PropellantChemistry
    tier: 13
    parents: [pc_hydrazineMonoprop, gnc_longLifeRCS]
    flavor: "A hydroxylammonium-nitrate salt that is denser and hotter than hydrazine and barely toxic enough to need a respirator — fuel the spacecraft in shirtsleeves instead of a hazmat suit. It needs a preheated catalyst bed to light, which is the whole reason it took forty years to replace the thing it beats."
    upgrades: [RFUpgrade_ASCENT]
  - id: pc_caveaB
    title: "Cavea-B Oxidiser"
    discipline: PropellantChemistry
    tier: 9
    parents: [pc_storableRcsPropellants]
    flavor: "A storable blend studied but never flown — a paper concept, the one entry in this family that never left the bench. Worse thrust and worse Isp than every operational choice beside it; nobody flew it because it never won the argument, but a completionist can still burn it."
    upgrades: [RFUpgrade_Cavea-B]
    # REVIEW FIX (2026-07, band-3 review #high): flavor claimed "a small edge over
    # the operational choices" — ground truth (RCS_Config.cfg/engine-stats.tsv) says the opposite:
    # thrusterPower=0.425 and IspV=0.939 are BELOW all five operational alternatives in this same node
    # (weakest of those, UDMH+NTO, is still IspV=0.943). Corrected to the true story: a bench-only loser,
    # not a hidden edge.

