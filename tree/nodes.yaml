    title: "Turbine-Temperature Uprating"
    discipline: AirBreathing
    tier: 8
    parents: [av_highBypassTurbofan, av_lowBypassTurbofan]
    anyToUnlock: true
    # FALSE-FORK FIX (2026-07-28, docs/TREE.md §10): high-bypass (airliner) and low-bypass (fighter) are
