# RP-AXE tech tree — SOURCE OF TRUTH (compiled by tools/build_tree.py).
# ============================ SPINE-FIRST REBUILD (2026-07) ============================
# The tree is grown along the EXPLORATION CRITICAL PATH: a chain of milestone convergence nodes
# (root -> first orbit -> crewed orbit -> applications -> rendezvous -> lunar), each anchored by an
# ICONIC part. The 18 engineering disciplines are TRIBUTARIES that feed those milestones — they
# emerge and taper, they are not full-height era lanes. Names/flavour are pulled from
# tree/library.yaml (the preserved 235-node P1 tree = the flavour/part-home bank).
#
# AHISTORICAL PRINCIPLE: 1950, Kerbalkind is united; there is no ICBM legacy and no military doctrine
# forcing a kerolox-first path. After a VERY THIN start you CHOOSE your propulsion philosophy
# (kerolox / hydrolox / solid) as a multi-entry fork (anyToUnlock:true). Milestones are propulsion-
# AGNOSTIC: they gate on the systems-integration breakthroughs (staging, guidance, telemetry, probe
# brain), and you fly whatever engine you invested in. Committing early to hydrolox is allowed — it
# just costs more program (deeper, pricier climb) than the cheap kerolox/solid start.
#
# HOMING = scatter-by-difficulty: a part lives at the discipline of its SIGNATURE breakthrough (the
# bottleneck that kept it from existing earlier), not its fuel/function. Convergence PARENTS carry the
# other enabling breakthroughs. anyToUnlock:false = convergence (need ALL parents); true = multi-entry.
#
# STATUS: FOUNDATION SLICE — two thin roots + the propulsion fork + milestone (1) First Orbit.
# Extends milestone-by-milestone toward crewed lunar. (Full P1 tree preserved in tree/library.yaml.)
# node: id / title / discipline / tier / [parents] / [anyToUnlock] / [cost] / flavor / [parts] / [upgrades]

meta:
  scalar: 1.0                       # global science-cost dial (SCIENCE.md §4); tune at P3 play-session
  auto_placement: false             # spine rebuild: parts come ONLY from explicit `parts:` seeds (P2 auto-placement rejected)
  tier_cost:                        # base cost per tier (pre-scalar) — front-loaded bite
    0: 0
    1: 20
    2: 90
    3: 400
    4: 900
    5: 1500
    6: 2000
    7: 2300
    8: 2100
    9: 1700
    10: 1300

nodes:
  # ================================= ORIGIN =================================
  - id: start
    title: "United Kerbalkind"
    discipline: SystemsIntegration
    tier: 0
    parents: []
    flavor: "1950. Kerbalkind is united under one world government; they understand that the universe is blind without us. No missiles to repurpose, no doctrine to obey — only the choice of how to begin."

  # ===================== TWO THIN ROOTS (soft fork; both free at start) =====================
  - id: rocketryStart
    title: "Sounding-Rocket Program"
    discipline: PropellantChemistry
    tier: 1
    parents: [start]
    flavor: "The rocketry beginning, kept deliberately bare: a procedural airframe, a simple solid motor, and an instrument package to loft above the Karman line. Everything else — how you push, how you steer, how you talk home — you will choose."
    parts: [proceduralAvionics, RO-RFTank-Separate, proceduralStructural, proceduralNoseCone, B9_Aero_Wing_Procedural_TypeA, ROE-BabySergeant]
  - id: xplaneStart
    title: "Experimental Aircraft Program"
    discipline: Aerodynamics
    tier: 1
    parents: [start]
    flavor: "The aeroplane beginning: a cockpit, wings, undercarriage, and both an air-breathing jet and a propeller. The runway route to the edge of space — the rocketplane and, one day, the spaceplane."
    parts: [RO-X1Cockpit, RO-OldFighterCockpit, B9_Aero_Wing_Procedural_TypeA, B9_Aero_Wing_Procedural_TypeB, GearFixed, RO-J35, SXTNK12M, proceduralNoseCone, proceduralStructural]

  # ===================== AHISTORICAL PROPULSION FORK (your choice) =====================
  # Three philosophies branch from the rocketry start. Kerolox = cheapest to orbit; solids = cheap but
  # single-shot; hydrolox = pricier, deeper climb, highest Isp. None is forced. Each is the head of a
  # discipline ladder that continues later (turbopumps -> combustion stability -> F-1, etc.).
  - id: pc_solidGrain
    title: "Cast Composite Solid Grains"
    discipline: PropellantChemistry
    tier: 2
    parents: [rocketryStart]
    flavor: "Ammonium-perchlorate oxidiser and powdered aluminium bound in a rubbery binder, cast and cured into a structural grain. Cheap, dense, storable — you light it once and it does not stop. The cheapest way up, and the strap-on that boosts everything else."
    parts: [ROE-Aerobee, ROE-Castor1, ROE-Star13]
  - id: pc_ethanolLox
    title: "Ethanol/LOX Film-Cooled Combustion"
    discipline: PropellantChemistry
    tier: 2
    parents: [rocketryStart]
    flavor: "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry, and the gateway to kerosene."
    parts: [ROE-A4]
  - id: pc_kerosene
    title: "Hydrotreated Narrow-Cut Kerosene (RP-1)"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_ethanolLox]
    flavor: "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. The cheap, forgiving road to orbit."
    parts: [ROE-A7, ROE-Merlin1A]
  - id: fd_gasGenerator
    title: "Gas-Generator (Open) Cycle"
    discipline: FluidDynamics
    tier: 3
    parents: [pc_ethanolLox]
    flavor: "Burn a little propellant in a side chamber to spin the turbopump, then dump the turbine exhaust overboard. Simple, proven, slightly wasteful — the pump-fed workhorse that puts real mass in orbit."
  - id: cryo_earlyHydrolox
    title: "Early Hydrogen/Oxygen Upper Stages"
    discipline: Cryogenics
    tier: 3
    parents: [rocketryStart, pc_ethanolLox]
    anyToUnlock: true                # MULTI-ENTRY: the early-hydrogen gamble, reachable from the bare start
    flavor: "No doctrine says you must burn kerosene first. Commit early to hydrogen — vacuum-jacketed tanks, insulation, boil-off you fight every hour on the pad — and you buy the highest specific impulse chemistry there is, years ahead of history. It simply costs more program to get there."
    parts: [ROE-RL10Fixed]

  # ===================== SYSTEMS TRIBUTARIES that converge into milestone (1) =====================
  - id: str_stageSeparation
    title: "Staging & Ullage Separation"
    discipline: StructuresMechanisms
    tier: 2
    parents: [rocketryStart]
    flavor: "Explosive bolts cut a spent stage away on a millisecond's command; small motors settle the propellant so the next stage lights clean. Multi-stage flight — the only way to the orbital velocities chemistry can't reach in one go — begins here."
    parts: [ROE-BabySergeantX3Dec, ROE-CastorDecoupler]
  - id: gnc_earlyGuidance
    title: "Rate-Gyro Attitude Guidance"
    discipline: GuidanceControl
    tier: 2
    parents: [rocketryStart]
    flavor: "Spinning-mass gyroscopes sense the vehicle's turn rates and drive the fins and gimbals to hold a programmed pitch. The first machine that flies itself uphill instead of tumbling."
  - id: tel_pcmTelemetry
    title: "PCM/FM Telemetry Downlink"
    discipline: Telecommunications
    tier: 1
    parents: [start]
    flavor: "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it a failure tells you nothing about why — and an orbit you cannot hear is an orbit you cannot prove."
  - id: mic_probeAvionics
    title: "Vacuum-Tube Sequencers & Sensors"
    discipline: Microelectronics
    tier: 1
    parents: [start]
    flavor: "Hot-cathode tubes and simple transducers turn a satellite's state into numbers and its timeline into relay clicks — the minimum brain a spacecraft needs to be more than ballast."

  # ===================== MILESTONE (1): FIRST ORBIT =====================
  - id: int_firstOrbit
    title: "First Orbital Capability"
    discipline: SystemsIntegration
    tier: 3
    parents: [str_stageSeparation, gnc_earlyGuidance, tel_pcmTelemetry, mic_probeAvionics]
    anyToUnlock: false               # CONVERGENCE: staging + guidance + telemetry + a probe brain (propulsion is your soft choice, not a gate)
    flavor: "Staging, guidance, telemetry and a probe brain converge — and whatever engine you chose to build now has somewhere to go. The first artificial moon. Beep. Beep. Beep."
    parts: [sputnik1, sputnik2, vanguard-1, explorer_6]
