    upgrades: [RFUpgrade_J-2-225K, RFUpgrade_J-2-230K, RFUpgrade_LR87-LH2-Vacuum, RFUpgrade_RL10A-3-3B]
    # ROE-J2X (2026-07, band-5 gap sweep): the Constellation-era uprated J-2 (Ares I upper stage) - same
