    discipline: StructuresMechanisms
    tier: 9
    parents: [str_stationStructures]
    flavor: "Bolt an unpressurised scaffold onto the station instead of cramming everything inside a hull — a lattice to hang solar arrays, radiators and berthing ports from, structure that never needs to hold air. The adjustable mounting frames and radial berthing points that let a station grow module by module instead of launching whole."
    parts: [truss-hex-01, truss-hex-02, truss-hex-03, truss-hex-adapter-01, sspx-adjusting-base-125-1, sspx-adjusting-base-25-1, sspx-adjusting-base-cradle-125-1, sspx-adjusting-base-cradle-25-1, sspx-attach-125-1, sspx-attach-1875-1]
    # King Hexa-Girder truss family (external unpressurised structure, a genuinely different mechanism
    # from str_stationStructures' pressurised tubes/adapters). Adjustable base frames/cradles (mounting
    # hardware) and radial pressurised attachment points (berthing, not axial docking) ride along - same
    # "station assembly hardware" theme. Fixed catalog, cap-exempt, matching its str_stationStructures parent.
  - id: str_soforaTruss
    title: "EVA-Assembled External Truss"
    discipline: StructuresMechanisms
    tier: 10
    parents: [str_externalTrussStructure]
    flavor: "A lattice tower built piece by piece by a spacewalking crew instead of arriving pre-built on a single launch — the first truss put together by hand in orbit, proving a station's own structure could grow past whatever fit under one payload fairing."
    parts: [rana_mount_srf_1, rana_truss_srf_1, rana_truss_srf_2]
    # 2026-07 (Tantares placement pass): Mir's Sofora truss (1991) - a genuine first (EVA-assembled, not
    # launched whole) distinct enough from the pre-fabricated Hexa-Girder/octo/spinal/circular truss
    # families already in this tree to earn its own node.

