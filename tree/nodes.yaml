    tier: 10
    parents: [pc_refinedStorableORSC]
    flavor: "Push oxidiser-rich staged combustion on storable hypergolics as far as raw chemistry allows — the largest hypergolic engine ever built, drawn for a booster that never flew. A record nobody has beaten since, and nobody needed to."
    parts: [ROE-RD270]
    upgrades: [RFUpgrade_RD-277M-14D16M, RFUpgrade_RD-275M]
    # King RD-270 (6713 kN vacuum - the real UR-700 engine, still the largest hypergolic ever tested).
    # Sibling of fd_gasGeneratorApex/cryo_largeHydrolox: every propellant family gets its own "pushed past
    # sane thrust for one more chemistry-ceiling record" dead-end. Same "drawn but never poured" flavor as AJ-260.
  - id: pc_rd270Variants
    title: "Re-Fuelled Ceiling Variants"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_stagedCombustionCeiling]
    flavor: "The same enormous chamber, tried on two propellant combinations nobody ultimately chose — an exotic boron-fuel blend, and a plain kerolox re-fuelling of hardware built for hypergolics. Neither changed the verdict; the ceiling stands where it stood."
    upgrades: [RFUpgrade_RD-270M-8D420M]
    # Thin, upgrades-only: doctrine-4 forces RD-270's own later configs off its own node. Both are what-if
    # re-fuellings of the same hardware, not separate engines.

