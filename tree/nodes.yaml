    title: "Refined Expander-Cycle Combustion"
    discipline: Cryogenics
    tier: 7
    parents: [cryo_expanderCycle]
    flavor: "Wring more specific impulse out of the closed expander cycle — hotter, tighter plumbing on the efficient small upper stage."
    upgrades: [RFUpgrade_RL10A-3-3, RFUpgrade_RL10A-4-1N, RFUpgrade_RL10A-4N, RFUpgrade_RL10B-2, RFUpgrade_LE-5A]  # RL10A-3-3B added 2026-07 (engine-upgrade gap-fill; sibling RL10A-3-3 here)
    # 2026-07 (shuttle/station batch): the long RL-10 chain arrives, as anticipated below - widened rather
    # than a new node, exactly the "fills out" case this stub was left for.
    # Thin stub (RL-10 base sits in cryo_expanderCycle; its refinements can't live with it). Fills out as
    # the long RL-10 chain arrives in later batches.

  # ---- Lane 4: kerolox ORSC (N1) ----
  - id: pc_throttledClosedCycle
    title: "Derated Closed-Cycle Sustainer"
    discipline: PropellantChemistry
    tier: 10
    parents: [pc_n1ClosedCycle]
    flavor: "Take the booster's closed-cycle engine and deliberately run it below what it can do. Chamber pressure comes down, the turbine stops living on the edge, and the engine that was a reliability problem at full throttle becomes one you can stack thirty of and still expect to reach orbit."
    upgrades: [RFUpgrade_NK-21]
  - id: pc_refinedMixtureClosedCycle
    title: "Trimmed Closed-Cycle Mixture Ratio"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_throttledClosedCycle]
    flavor: "Re-trim the oxidiser-to-fuel ratio and the preburner split until the cycle gives up another twelve seconds without touching the hardware — the cheapest specific impulse in rocketry, and the hardest to find, because everything upstream of the injector has to be measured before it can be moved."
    upgrades: [RFUpgrade_NK-39]
  - id: pc_restartableClosedCycle
    title: "Restartable Oxidiser-Rich Closed Cycle"
    discipline: PropellantChemistry
    tier: 12
    parents: [pc_refinedMixtureClosedCycle]
    flavor: "Relight a staged-combustion engine in vacuum, which means restarting an oxidiser-rich preburner that will happily burn its own turbine if the start sequence slips. Two ignitions instead of one, and the upper stage can finally choose when to fall."
    upgrades: [RFUpgrade_NK-31]
  - id: pc_closedCycleUpper
    title: "Closed-Cycle Upper-Stage Combustion"
    discipline: PropellantChemistry
    tier: 9
    parents: [pc_orscDebut]
    flavor: "Shrink the oxidiser-rich preburner until it fits an upper stage, where the gain is not thrust but the specific impulse you carry all the way to escape. A small closed-cycle engine is harder per kilonewton than a big one — the turbine still has to survive its own exhaust, and now there is no mass budget to armour it with."
    upgrades: [RFUpgrade_11D33, RFUpgrade_11D33M]
    # LADDER PASS (2026-07-27): the Blok-D engine's kerosene marks. They were on pc_n1ClosedCycle, whose
    # subject is SUBCOOLED propellant — but these burn plain Kerosene+LqdOxygen and the N1 engines beside
    # them are all Cooled*. Wrong node by its own title.
  - id: pc_rg1
    title: "High-Density Kerosene Cut"
    discipline: PropellantChemistry
    tier: 10
    parents: [pc_closedCycleUpper]
    flavor: "Distil the kerosene to a narrower, denser, more thermally stable cut than anything an aircraft would burn — more mass of fuel in the same tank, and it stops coking the regenerative passages when the chamber runs hot. The fuel stops being a commodity and becomes part of the engine's design."
    upgrades: [RFUpgrade_RD-58, RFUpgrade_NK-9-1972]
  - id: pc_rg1Uprating
    title: "Oxidiser-Rich Preburner Uprating"
    discipline: PropellantChemistry
    tier: 11
    parents: [pc_rg1]
    flavor: "Drive the preburner harder and re-trim the mixture until the closed cycle gives up another seven seconds — the last easy specific impulse in a design that is already recycling everything it burns."
    upgrades: [RFUpgrade_RD-58M]
  - id: pc_extendedNozzleUpper
    title: "Extended-Nozzle Upper Stage"
    discipline: PropellantChemistry
    tier: 12
    parents: [pc_rg1Uprating]
    flavor: "Hang a far larger bell on an upper-stage engine that will never see air: sea-level performance collapses and nobody cares, because every second of it is spent in vacuum. The nozzle stops being a compromise between two regimes and is cut for the only one that matters."
    upgrades: [RFUpgrade_RD-58M-CCN]
  - id: pc_syntin
    title: "Strained-Ring Synthetic Fuel"
    discipline: PropellantChemistry
    tier: 12
    parents: [pc_rg1Uprating]
    flavor: "Synthesise the fuel instead of refining it: pack the energy into strained hydrocarbon rings that give it back when they break. Denser and hotter than any kerosene cut, absurdly expensive, and flown anyway when a few seconds of specific impulse were worth more than the money."
    upgrades: [RFUpgrade_17D12, RFUpgrade_RD-108-11D511P, RFUpgrade_RD-107-11D512P]
    # LADDER PASS (2026-07-27): 17D12 and RD-58S are one performance point (86.2/86.3 kN, ispV 362/361)
    # on Syntin+LqdOxygen -- the same decision, so they share this node under R4. RD-58S came back from
    # fd_terminalGasGenKerolox, which is a gas-generator node and the wrong cycle entirely.
  - id: pc_n1ClosedCycle
    title: "Subcooled-Propellant Staged Combustion"
    discipline: PropellantChemistry
    tier: 9
    parents: [pc_orscDebut]
    flavor: "Chill the propellants until they are dense enough, then run oxidiser-rich staged combustion at booster scale — the most efficient kerosene engine anyone ever fired. The rocket it flew on failed; the engine never did."
    parts: [ROE-NK33, ROE-NK43, SXTNK21BlockV]
    upgrades: [RFUpgrade_NK-19]
    # King NK-33. Fillers cascade UP by doctrine-4: NK-9/NK-9V's upgrades (NK-19/21) + the whole RD-58
    # chain (11D33/11D33M/RD-58) - all their base parts live one tier down in pc_orscDebut. FIXED 2026-07:
    # the previous gap-fill pass wrongly co-located NK-33/NK-43's OWN later marks (NK-33/43 configs + the
    # whole AJ-26 family) here, alongside their own base parts (ROE-NK33/ROE-NK43/SXTNK21BlockV, doctrine-4
    # violation) - moved down to pc_zenitKerolox.

  # ---- Lane 5: NTO ORSC (Proton) ----
  - id: pc_protonStagedCombustion
    title: "Storable Staged Combustion"
    discipline: PropellantChemistry
    tier: 8
    parents: [fd_regenCooling, fd_sovietStorable]
    flavor: "Bring staged combustion to the storables: route the preburner exhaust back through the chamber on nitrogen tetroxide and hydrazine, and the workhorse hypergolic booster gets its efficiency jump without ever needing a cryogen. The engine that is still flying."
    parts: [ROE-RD275, ROE-RD254, ROE-RD0210]
    # King RD-253/275. Parallel storable ORSC debut, sharing the regen-cooling root with the kerolox debut
    # (pc_orscDebut) in a different propellant branch. Lower Isp than kerolox ORSC -> a tier below N1.
    # doctrine-4 fix (2026-07): RD-277M-14D16M/RD-275M are later marks of this node's own base parts
    # (ROE-RD254/ROE-RD275) - moved down to pc_refinedStorableORSC, which already hosts their Mk2 siblings.
  - id: pc_refinedStorableORSC
    title: "Refined Storable Staged Combustion"
    discipline: PropellantChemistry
    tier: 9
    parents: [pc_protonStagedCombustion, pc_storableVernierFamily]
    flavor: "Squeeze the storable staged-combustion boosters a little further — Mk-II chambers, higher flow, the same dependable poison."
    upgrades: [RFUpgrade_RD-253-Mk2, RFUpgrade_RD-254-11D44-Mk2, RFUpgrade_RD-0210, RFUpgrade_RD-0203U, RFUpgrade_RD-0212, RFUpgrade_RD-0213, RFUpgrade_RD-0214]  # RD-277M/RD-275M moved down from pc_protonStagedCombustion (doctrine-4 fix, 2026-07) - direct continuation of their own Mk2 siblings already here
    # Pure doctrine-4 catch node: every upgrade's base lives in pc_protonStagedCombustion or
    # pc_storableVernierFamily, so none can sit with its base.

  # ---- Lane 6: nuclear thermal (opens NuclearEngineering as a propulsion branch) ----
  - id: nuc_nuclearThermalRocket
    title: "Solid-Core Nuclear Thermal Propulsion"
    discipline: NuclearEngineering
    tier: 9
    parents: [cryo_hydrogen, nuc_fissionReactor]
    flavor: "Heat liquid hydrogen in a fission reactor and blow it out a nozzle — twice the specific impulse of the best chemical engine, bought as a heavy, low-thrust, radioactive gamble. The road to deep space forks here."
    parts: [KIWIB48, KIWIA24]
    # King KIWI-B4E. Opens NuclearEngineering as a PROPULSION discipline (was radiation science only).
    # Reactor parent WIRED 2026-07: nuc_fissionReactor (SNAP/BES) + cryo_hydrogen (LH2) = the two prereqs.
  - id: nuc_nuclearRamjet
    title: "Reactor-Heated Ramjet"
    discipline: NuclearEngineering
    tier: 9
    parents: [nuc_fissionReactor, av_ramjet]
    flavor: "Skip the propellant entirely: ram air through a live reactor and let the heat do the rest — an engine that could fly for weeks and irradiate everything it passed. A frontier curiosity that goes nowhere, on purpose."
    parts: [RO-A136]
    # 2026-07: reactor parent WIRED (nuc_fissionReactor) + av_ramjet - the Pluto dead-end crossover, now a
    # direct reactor x ramjet (T9), no longer routed through the NTR rocket.

  # ================================================================================================
  # ===================== BAND 3 * AVIONICS GRANTS LADDER + DSN LEVELS (T7 -> T10) =================
  # `Science-Core-*`/`RP0Level*TrackingStation` are RP-1 PARTUPGRADE names marked REFERENCE in the T3
  # curation audit (AXE doesn't emit the literal RP-1 upgrade) — but the SAME names are already reused
  # live as `grants:` values by AXE's own plugin-facing tier system (gnc_basicAvionics/tel_dopplerRanging/
  # tel_pcmTelemetry already do this). These are the next rungs of that same already-live ladder, not
  # superseded content — confirmed by checking disposition consistency before placing. Real generation
  # order ground-truthed against RP-1's own RP0TechTree.cfg (x-position, not guessed): basicAvionics(T5)
  # -> interplanetaryProbes(1961) -> improvedAvionics(1962-63) -> matureAvionics(1964-66) ->
  # largeScaleAvionics(1967-71) — confirms the tier order below IS the real generation order.
  #
  # REVIEW FIX (2026-07, band-3 review #3): the three rungs were named after their
  # raw RP-1 tier label ("...Avionics Tier"), breaking with every earlier rung's mechanism-named
  # precedent (Gyroscopic Autopilot, Analog Inertial Guidance, Stable-Platform Guidance...). Renamed
  # AND re-categorized, not just relabeled: 1961-63 is exactly the real transition from analog guidance
  # hardware to digital, integrated-circuit-built flight computers (Minuteman II's D-17B, 1962, was
  # among the first guidance computers built from ICs) — a genuine discipline change, not decoration.
  # `Computing` (disciplines.yaml order:15) already existed as a defined-but-unused lane, exactly
  # earmarked for this by docs/PLACEHOLDERS.md's own open question ("confirm discipline: GuidanceControl
  # vs Computing"). Split here: GuidanceControl keeps the analog-instrumentation ladder through the 1961
  # endurance rung; Computing picks up the moment a real digital computer arrives and carries it
  # forward. The new elec_integratedCircuit enabler (Microelectronics) makes that crossover concrete
  # instead of asserted — same crossover pattern as gnc_earlyAvionics x elec_transistor in band 1, one
  # generation on. Also fills a real gap: largeScaleAvionics (the 4th of the doc's 8 Science-Core tiers)
  # was never authored at all until now.
  # ================================================================================================
  - id: gnc_interplanetaryAvionics
    title: "Long-Duration Cruise Guidance"
    discipline: GuidanceControl
    tier: 7
    parents: [gnc_basicAvionics]
    flavor: "Stretch the same miniaturised inertial stack to survive a cruise measured in months instead of an orbit measured in hours — redundant circuitry and a sun-and-star reference that never loses its lock on the long coast out to another planet."
    grants: [Science-Core-interplanetaryProbes]
  - id: shd_interplanetaryAvionics
    title: "Radiation-Shielded Avionics — Interplanetary"
    discipline: GuidanceControl
    tier: 8
    parents: [shd_basicAvionics, gnc_interplanetaryAvionics]
    flavor: "Harden the long-duration cruise stack itself, not just its chassis — shielded electronics for a coast that spends months, not hours, deep in interplanetary radiation."
    grants: [Deep-Space-interplanetaryProbes]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: elec_integratedCircuit
    title: "Monolithic Integrated Circuits"
    discipline: Microelectronics
    tier: 7
    parents: [elec_transistor]
    flavor: "Print a whole handful of transistors, resistors and their wiring onto one slice of silicon instead of soldering each one by hand — a logic circuit that shrinks from a rack to a fingertip, and survives a launch the discrete parts never could. Minuteman II flew guidance built from these in 1962; nothing that follows goes back to wires."
  - id: comp_digitalGuidanceComputer
    title: "Digital Guidance Computer"
    discipline: Computing
    tier: 8
    parents: [gnc_interplanetaryAvionics, elec_integratedCircuit]
    flavor: "Trade the analog integrator for a true digital computer, built from the first integrated circuits — a machine that computes a fresh trajectory correction instead of just holding one, fast enough to fly a booster instead of merely stabilizing it. The line between an instrument and a computer, crossed for good."
    parts: [RO-SaturnI-IU]
    grants: [Science-Core-improvedAvionics]
    # RO-SaturnI-IU (2026-07, backlog sweep): the Saturn I's own instrument-unit ring, contemporaneous with
    # this generation of digital guidance hardware (early-mid 1960s) - tagged for AXE's own avionics module
    # at the P4 config-patch pass, per docs/PARTLIST.md.
  - id: shd_digitalGuidanceComputer
    title: "Radiation-Shielded Avionics — Digital"
    discipline: Computing
    tier: 9
    parents: [shd_interplanetaryAvionics, comp_digitalGuidanceComputer]
    flavor: "The first digital guidance computer, rebuilt around radiation-hardened logic — a machine that keeps computing fresh corrections after a dose that would upset an unshielded chip."
    grants: [Deep-Space-improvedAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_realTimeFlightComputer
    title: "Priority-Interrupt Flight Computer"
    discipline: Computing
    tier: 9
    parents: [comp_digitalGuidanceComputer]
    flavor: "One flight computer that juggles guidance, navigation and engine control at once, always answering whichever task is most urgent instead of finishing one program before starting the next — real-time computing built to fly a crew, not just a probe. The Apollo Guidance Computer's real trick, and the reason it could do five jobs on hardware that could barely do one."
    parts: [restock-drone-core-375-1]
    grants: [Science-Core-matureAvionics]
    # restock-drone-core-375-1 (2026-07, backlog sweep): the Saturn IB/V instrument unit - the real ring
    # that carried the actual Apollo Guidance Computer's ground-side LVDC counterpart. Tagged for AXE's
    # own avionics module at the P4 config-patch pass, per docs/PARTLIST.md.
  - id: shd_realTimeFlightComputer
    title: "Radiation-Shielded Avionics — Real-Time"
    discipline: Computing
    tier: 10
    parents: [shd_digitalGuidanceComputer, comp_realTimeFlightComputer]
    flavor: "The priority-interrupt flight computer, shielded to keep juggling guidance, navigation and engine control after a dose that would otherwise upset its scheduler."
    grants: [Deep-Space-matureAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_networkedAvionics
    title: "Multi-Vehicle Avionics Integration"
    discipline: Computing
    tier: 10
    parents: [comp_realTimeFlightComputer]
    flavor: "Coordinate guidance, power and data across several docked modules as one system instead of one hull — the avionics architecture a space station, not just a single spacecraft, needs to hold together."
    grants: [Science-Core-largeScaleAvionics]
    upgrades: [HDD-Upgrade-1969, RFTech-ComSat-III, RFTech-NavSat-III]  # 2026-07 tech-level fill: HDD/comsat/navsat rungs of the largeScaleAvionics era (siblings on the earlier avionics nodes)
  - id: shd_networkedAvionics
    title: "Radiation-Shielded Avionics — Networked"
    discipline: Computing
    tier: 11
    parents: [shd_realTimeFlightComputer, comp_networkedAvionics]
    flavor: "Multi-vehicle avionics integration, hardened for a station or relay constellation that spends its whole service life outside Earth's protective magnetosphere."
    grants: [Deep-Space-largeScaleAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_multiplyRedundantFlightComputer
    title: "Multiply-Redundant General-Purpose Computer"
    discipline: Computing
    tier: 11
    parents: [comp_networkedAvionics]
    flavor: "Four identical general-purpose computers vote on every result, and a fifth arbitrates a tie — fly-by-wire trusted with a crew's life because no single failure, or even a single disagreement, can bring it down. The Shuttle's own avionics generation."
    grants: [Science-Core-advancedAvionics]
    upgrades: [HDD-Upgrade-1975]  # 2026-07 tech-level fill: HDD rung of the advancedAvionics era
    # 2026-07 (full-manifest re-audit): closes a real gap - the Science-Core avionics grants ladder
    # dead-ended at comp_networkedAvionics (T10) even though the tree runs to T16 elsewhere. 5 REFERENCE-
    # tagged rungs (docs/UPGRADES.md T3 audit) were never granted anywhere. Continued linearly, same
    # pattern as comp_digitalGuidanceComputer/comp_realTimeFlightComputer/comp_networkedAvionics
    # (pure grants nodes, no parts - these mark an avionics-generation milestone, not new hardware).
  - id: shd_multiplyRedundantFlightComputer
    title: "Radiation-Shielded Avionics — Redundant"
    discipline: Computing
    tier: 12
    parents: [shd_networkedAvionics, comp_multiplyRedundantFlightComputer]
    flavor: "Quadruple-redundant fly-by-wire, shielded to keep out-voting a radiation-flipped bit the same way it out-votes any other single failure — trusted with a crew on a mission that never comes home to Earth's shelter."
    grants: [Deep-Space-advancedAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_distributedAvionicsBus
    title: "Distributed Avionics Data Bus"
    discipline: Computing
    tier: 12
    parents: [comp_multiplyRedundantFlightComputer]
    flavor: "Stop wiring every sensor and actuator straight to the computer and put them all on one shared data bus instead — a single twisted pair carrying every subsystem's traffic, addressed and time-sliced instead of home-run cabled. The wiring-harness weight a modular station can no longer afford to carry."
    grants: [Science-Core-nextGenAvionics]
  - id: shd_distributedAvionicsBus
    title: "Radiation-Shielded Avionics — Distributed Bus"
    discipline: Computing
    tier: 13
    parents: [shd_multiplyRedundantFlightComputer, comp_distributedAvionicsBus]
    flavor: "The shared data bus, radiation-hardened end to end — every sensor and actuator on the line survives the same dose the flight computer does, for an outer-system mission with no wiring-harness weight to spare."
    grants: [Deep-Space-nextGenAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_digitalEngineControl
    title: "Full-Authority Digital Engine Control"
    discipline: Computing
    tier: 13
    parents: [comp_multiplyRedundantFlightComputer]
    flavor: "Put a computer between the throttle and the engine and let it, not a hydromechanical governor, decide what the valves do. It trims mixture ratio in closed loop against measured chamber pressure, holds the engine at a margin a mechanical linkage could never be trusted near, and shuts it down cleanly on a sensor trend instead of a failure. The same step that turned a carburettor into an engine management unit, applied to something with a turbopump."
    upgrades: [RFUpgrade_RS-68B, RFUpgrade_HG-3A-SL]
    # LADDER PASS (2026-07-27, user's ECU idea): RS-68B is +2.2 s ispVac at IDENTICAL thrust to RS-68A --
    # nothing was made stronger, it was made better-governed. That is a controls gain, so it homes in
    # Computing rather than on the cycle node. Expect more of the tail to land here.
  - id: comp_softwareDefinedFlightControl
    title: "Software-Defined Flight Control"
    discipline: Computing
    tier: 13
    parents: [comp_distributedAvionicsBus]
    flavor: "Move the control laws out of hardwired logic and into software that can be patched after launch — a flight computer whose behaviour is a file to update, not a board to re-etch, for a vehicle meant to keep flying for years."
    grants: [Science-Core-longTermAvionics]
    upgrades: [HDD-Upgrade-1990]  # 2026-07 tech-level fill: HDD rung of the longTermAvionics era
  - id: shd_softwareDefinedFlightControl
    title: "Radiation-Shielded Avionics — Software-Defined"
    discipline: Computing
    tier: 14
    parents: [shd_distributedAvionicsBus, comp_softwareDefinedFlightControl]
    flavor: "Software-patchable flight control, shielded for a vehicle meant to keep flying for years deep in the outer system, where a board re-etch is never an option."
    grants: [Deep-Space-longTermAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_interoperableAvionicsStandard
    title: "Interoperable Avionics Standard"
    discipline: Computing
    tier: 14
    parents: [comp_softwareDefinedFlightControl]
    flavor: "Agree on a common data-bus protocol and command format across national space programmes, so a module built on one continent can dock, hand off power and share telemetry with one built on another without a custom adapter for every pairing."
    grants: [Science-Core-internationalAvionics]
    upgrades: [HDD-Upgrade-1998]  # 2026-07 tech-level fill: HDD rung of the internationalAvionics era
  - id: shd_interoperableAvionicsStandard
    title: "Radiation-Shielded Avionics — Interoperable"
    discipline: Computing
    tier: 15
    parents: [shd_softwareDefinedFlightControl, comp_interoperableAvionicsStandard]
    flavor: "The common data-bus standard, hardened alike across every national programme's hardware — an international deep-space handoff that survives the same radiation on either end."
    grants: [Deep-Space-internationalAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note.
  - id: comp_commercialOffTheShelfAvionics
    title: "Commercial Off-The-Shelf Flight Computer"
    discipline: Computing
    tier: 15
    parents: [comp_interoperableAvionicsStandard]
    flavor: "Skip the custom-built, radiation-hardened rack and fly triple-redundant commercial processors instead — orders of magnitude more computing power for a fraction of the cost and years off the schedule, the same bet the whole modern commercial launch industry made."
    grants: [Science-Core-modernAvionics]
    upgrades: [HDD-Upgrade-2010, HDD-Upgrade-2020]  # 2026-07 tech-level fill: HDD rungs of the modern/advModern era (avionics ladder tops out here, no separate advModern node)
  - id: shd_commercialOffTheShelfAvionics
    title: "Radiation-Shielded Avionics — Commercial"
    discipline: Computing
    tier: 16
    parents: [shd_interoperableAvionicsStandard, comp_commercialOffTheShelfAvionics]
    flavor: "Take the same commercial processors and wrap them in the hardening they skipped — cheap compute, radiation-rated, for a deep-space mission that can't afford a custom rack but also can't afford a bit-flipped autopilot."
    grants: [Deep-Space-modernAvionics]
    # V2 avionics redesign (2026-07-08): see shd_basicAvionics for the Shielded-axis note. Tops out the
    # Shielded ladder here, same as the paired Guided/Computing ladder.

