# RP-AXE tech tree — SOURCE OF TRUTH (compiled by tools/build_tree.py).
# VERTICAL SLICE v2 (P1 prototype) — SCATTER-BY-DIFFICULTY + research-paper node names.
# Each engine is homed at the discipline of its SIGNATURE BREAKTHROUGH (the bottleneck that kept it
# from existing earlier), NOT its fuel. So the slice spans the engine-relevant disciplines:
#   Propellant Chemistry · Fluid Dynamics · Thermodynamics · Metallurgy · Cryogenics · Telecommunications
# Proves: scatter-by-difficulty (F-1->Fluids combustion instability; RD-170->Metallurgy ox-rich
# superalloys; J-2->Cryo LH2 insulation; AJ10->Chemistry storables; RS-25->Cryo n Metallurgy),
# PARENT RULE: convergence parents = LIMITING breakthroughs only, not routine consumed inputs. A
# propellant-production node gates an engine ONLY when that production was itself hard (cryogen
# liquefaction -> hydrolox YES; kerosene refining -> F-1/RD-170 NO — kerosene was routine). Keeps the
# tree from sprouting "true but boring" fuel-hub edges. (Parked: fuels as a separate USABILITY gate.)
# emergence, convergence (anyToUnlock:false = ALL parents), multi-entry (true = ANY parent),
# upgrade-scatter, and a clean ladder (Telecom) for contrast.
#
# node: id / title / discipline / tier / [parents] / [anyToUnlock] / [cost] / flavor / [parts] / [upgrades]

meta:
  scalar: 1.0                       # global science-cost dial (SCIENCE.md §4); tune at P3 play-session
  tier_cost:                        # base cost per tier (pre-scalar) — front-loaded bite
    0: 0
    1: 20
    2: 90
    3: 400
    4: 900
    5: 1500
    6: 2000
    7: 2300
    8: 2100
    9: 1700
    10: 1300

nodes:
  # ---------- bootstrap ----------
  - id: start
    title: Start
    discipline: PropellantChemistry
    tier: 0
    parents: []
    flavor: "1950. Kerbalkind is united; the universe is blind without us."
  - id: soundingRocketry
    title: "Spin-Stabilized Sounding Rockets"
    discipline: PropellantChemistry
    tier: 1
    parents: [start]
    flavor: "Fin-and-spin powder rockets loft the first instrument packages above the Karman line. (Rocket start; the X-plane root lives in Aerodynamics, off-slice.)"
    parts: [PioneerVernier]

  # ---------- Propellant Chemistry (homes chemistry-bottlenecked: storables, grains, fuel production) ----------
  - id: pc_ethanolLox
    title: "Ethanol/LOX Film-Cooled Combustion"
    discipline: PropellantChemistry
    tier: 2
    parents: [soundingRocketry]
    flavor: "75% ethanol against liquid oxygen, the chamber wall protected by a deliberately fuel-rich boundary film. Crude, sooty, and enough to reach space — the A-4/V-2 chemistry."
  - id: pc_keroseneHydrotreating
    title: "Hydrotreated Narrow-Cut Kerosene (RP-1)"
    discipline: PropellantChemistry
    tier: 2
    parents: [soundingRocketry]
    flavor: "Catalytic hydrotreating strips sulfur and heavy aromatics to a narrow distillation cut that won't coke a cooling jacket — the dense, storable kerosene every kerolox engine burns. Homes the simplest early kerolox; the harder kerolox engines mature in Fluid Dynamics and Metallurgy."
    parts: [ROE-Merlin1A]
  - id: pc_apcpGrain
    title: "Aluminized AP/HTPB Composite Grain"
    discipline: PropellantChemistry
    tier: 3
    parents: [soundingRocketry]
    flavor: "Ammonium-perchlorate oxidizer and aluminum powder bound in hydroxyl-terminated polybutadiene, cast and cured into a structural grain. The propellant chemistry, not the casing, is the headline here."
    parts: [MassiveBooster]
  - id: pc_hypergolicChemistry
    title: "Self-Igniting Amine-Nitrate Hypergolics"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_ethanolLox, pc_keroseneHydrotreating]
    anyToUnlock: true                # MULTI-ENTRY: storables build on either prior liquid line
    flavor: "Fuels that detonate on contact with their oxidizer — no igniter, indefinite restarts, storable for years. The entire difficulty is chemistry and corrosion: handling hydrazines and nitric oxidizers that attack everything. The chemistry of upper stages and spacecraft."
    parts: [ROE-AJ10Early, ROE-AJ10Mid, ROE-AJ10-137]
  - id: pc_cryoLiquefaction
    title: "Claude-Cycle H2/O2 Liquefaction"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_ethanolLox]
    flavor: "Industrial Claude-cycle plants liquefy hydrogen and oxygen by the ton. You can now MAKE deep cryogens; STORING and flying them is Cryogenics' problem next door (a convergence)."
  - id: pc_storableOxidizers
    title: "Passivated MON/NTO Storable Oxidizers"
    discipline: PropellantChemistry
    tier: 5
    parents: [pc_hypergolicChemistry]
    flavor: "Mixed oxides of nitrogen and passivated dinitrogen tetroxide: denser, higher-performing, marginally less murderous storables for mature service propulsion."
    parts: [ROE-AJ10Adv, ROE-AJ10-190]

  # ---------- Metallurgy (homes materials-bottlenecked engines — the "metallurgy unlocks an engine" aha) ----------
  - id: met_earlyAlloys
    title: "Aluminum Isogrid & Maraging-Steel Cases"
    discipline: Metallurgy
    tier: 2
    parents: [met_weldedSteel]
    flavor: "Chemically-milled isogrid aluminum for light pressure vessels; ultra-high-strength maraging steel for solid-motor cases and pump housings. The structural backbone everything else bolts to."
  - id: met_oxRichSuperalloys
    title: "Oxidizer-Rich Preburner Superalloys"
    discipline: Metallurgy
    tier: 4
    parents: [met_earlyAlloys, fd_turbopumps, th_regenCooling]
    anyToUnlock: false               # CONVERGENCE: alloys + turbomachinery + regen cooling (RD-170 is regen-cooled, like F-1/J-2; kerosene was routine, NOT a gate)
    flavor: "For decades the West held that an oxygen-rich preburner would simply burn through any turbine. Soviet metallurgy disproved it: chrome-nickel alloys with burn-passivated surfaces survive hot, oxygen-rich gas, unlocking the most efficient kerolox engines ever flown. THE engine that metallurgy unlocks."
    parts: [ROE-RD170, ROE-RD180, ROE-NK33]

  # ---------- Fluid Dynamics (homes flow/combustion-bottlenecked engines — F-1) ----------
  - id: fd_turbopumps
    title: "Inducer-Stabilized Cryogenic Turbopumps"
    discipline: FluidDynamics
    tier: 3
    parents: [met_earlyAlloys]
    flavor: "Move propellant by the ton per second without cavitating the pump. An axial inducer ahead of the centrifugal impeller suppresses cavitation at low inlet pressure — the enabling piece of every high-thrust engine."
  - id: fd_combustionStability
    title: "Baffled-Injector Combustion-Instability Suppression"
    discipline: FluidDynamics
    tier: 4
    parents: [fd_turbopumps, th_regenCooling]
    anyToUnlock: false               # CONVERGENCE: turbopumps + cooling (kerosene was routine, NOT a gate)
    flavor: "Tangential acoustic modes can couple to combustion and tear a large chamber apart in milliseconds. Injector baffles and tuned cavities damp them. Taming this — not the fuel — is why the F-1 took years and why it lives in Fluid Dynamics."
    parts: [ROE-F1, ROE-F1B]
    upgrades: [RFUpgrade_F-1-1.52M, RFUpgrade_F-1A]

  # ---------- Thermodynamics (homes cooling-bottlenecked breakthroughs) ----------
  - id: th_regenCooling
    title: "Regenerative Forced-Convection Wall Cooling"
    discipline: Thermodynamics
    tier: 3
    parents: [met_earlyAlloys]
    flavor: "Route the fuel through milled channels in the chamber wall before burning it, carrying away heat flux that would melt any uncooled metal. The thermodynamics that lets a chamber run hotter than its own melting point."

  # ---------- Cryogenics (homes cryo-bottlenecked engines — J-2, RS-25, BE-3) ----------
  - id: cryo_loxHandling
    title: "Subcooled LOX Densification"
    discipline: Cryogenics
    tier: 3
    parents: [pc_ethanolLox]
    flavor: "Hold oxygen below its boiling point: vacuum-jacketed lines, careful materials, and the operational discipline to load minutes before launch. Subcooling buys density — more propellant in the same tank."
  - id: cryo_lh2Insulation
    title: "Multilayer Vacuum Insulation for LH2"
    discipline: Cryogenics
    tier: 4
    parents: [cryo_loxHandling, pc_cryoLiquefaction, fd_turbopumps, th_regenCooling]
    anyToUnlock: false               # CONVERGENCE: cryo handling + cryogen supply + pumps + cooling
    flavor: "Hydrogen boils at -253 C and diffuses through metal lattices. Dozens of radiation-shield layers under vacuum make hydrolox — the highest specific impulse chemistry there is — actually flyable. The J-2 lives here, fed by Chemistry's cryogen supply."
    parts: [ROE-J2, ROE-BE3]
  - id: cryo_stagedHydrolox
    title: "Fuel-Rich Staged-Combustion Hydrolox"
    discipline: Cryogenics
    tier: 5
    parents: [cryo_lh2Insulation, met_oxRichSuperalloys]
    anyToUnlock: false               # CONVERGENCE across TWO home disciplines: Cryo n Metallurgy
    flavor: "Burn every gram twice: a fuel-rich preburner drives the turbopumps, then the exhaust is fully combusted in the chamber. The RS-25 needs both deep-cryo hydrogen handling AND reusable hot-section superalloys — a convergence of Cryogenics and Metallurgy."
    parts: [ROE-RS25]
  - id: cryo_zbo
    title: "Reverse-Brayton Zero-Boiloff Cryocooling"
    discipline: Cryogenics
    tier: 6
    parents: [cryo_lh2Insulation, ext_powerGrid]
    anyToUnlock: false               # CONVERGENCE: needs a real power grid to run the coolers
    flavor: "A closed reverse-Brayton cryocooler actively pumps heat out of the tank, driving boiloff to zero — if you can spare the kilowatts. Multi-year outer-planet cryo stages stop bleeding propellant."

  # ---------- Telecommunications (clean single-discipline ladder, for contrast) ----------
  - id: tel_pcmTelemetry
    title: "PCM/FM Telemetry Downlink"
    discipline: Telecommunications
    tier: 1
    parents: [start]
    flavor: "Pulse-code-modulated vehicle health, FM-keyed to the ground. Without it, a failure tells you nothing about why."
  - id: tel_helicalDirectional
    title: "Helical Directional Arrays"
    discipline: Telecommunications
    tier: 2
    parents: [tel_pcmTelemetry]
    flavor: "Axial-mode helices give circularly-polarized gain that tolerates a tumbling spacecraft — range and data rate at the cost of having to point."
    parts: [HighGainAntenna5_v2]
  - id: tel_cassegrainHGA
    title: "Cassegrain Parabolic High-Gain Reflector"
    discipline: Telecommunications
    tier: 3
    parents: [tel_helicalDirectional]
    flavor: "A subreflector folds the feed back through the dish vertex, shortening the assembly and closing the link from lunar distance. Apollo talked home through one."
    parts: [HighGainAntenna, ROC-ApolloHGABDB]
  - id: tel_dsnRanging
    title: "Coherent Two-Way Doppler & Ranging"
    discipline: Telecommunications
    tier: 4
    parents: [tel_cassegrainHGA]
    flavor: "Phase-coherent ground dishes pull a few bits per second out of interplanetary noise and, from the round-trip Doppler, fix the spacecraft's state vector to meters."
  - id: tel_phasedArray
    title: "Electronically-Steered Phased Arrays"
    discipline: Telecommunications
    tier: 5
    parents: [tel_dsnRanging]
    flavor: "Steer the beam by element phasing, no moving parts. Higher rates, graceful degradation, the backbone of a relay constellation."

  # ---------- external stub (off-slice; full node lives in Electrical Power) ----------
  - id: ext_powerGrid
    title: "Kilowatt-Class Regulated Power Bus"
    discipline: ElectricalPower
    tier: 5
    parents: [start]
    flavor: "(off-slice stub) Electrical Power. Regulated high-voltage buses for active cryocooling and electric propulsion."

  # ======================= STAGE 1 — Materials & Chemistry cluster =======================
  # ---------- Metallurgy (metals, casting, forming) ----------
  - id: met_weldedSteel
    title: "Welded Steel Pressure Vessels"
    discipline: Metallurgy
    tier: 1
    parents: [start]
    flavor: "Roll, weld and proof-test mild-steel cylinders that hold pressure without bursting. The first tank that flies."
  - id: met_chemMilling
    title: "Chemical Milling & Isogrid"
    discipline: Metallurgy
    tier: 3
    parents: [met_earlyAlloys]
    flavor: "Etch away everything that isn't load path, leaving a triangular-rib isogrid skin — stiffness at a fraction of the mass."
  - id: met_vacuumInductionMelting
    title: "Vacuum Induction Melting"
    discipline: Metallurgy
    tier: 4
    parents: [met_chemMilling]
    flavor: "Melt under vacuum to strip dissolved gases and inclusions, casting the clean nickel-base superalloys that hot sections demand."
  - id: met_titaniumForming
    title: "Superplastic Titanium Forming"
    discipline: Metallurgy
    tier: 5
    parents: [met_chemMilling]
    flavor: "Heat titanium until it flows like taffy and form one-piece, diffusion-bonded structures — strong, light, corrosion-proof."
  - id: met_vacuumArcRemelting
    title: "Vacuum Arc Remelting"
    discipline: Metallurgy
    tier: 5
    parents: [met_vacuumInductionMelting]
    flavor: "A consumable-electrode second melt homogenises the ingot grain by grain — the pedigree steel of turbine discs and gun-pressure cases."
  - id: met_powderMetallurgyHIP
    title: "Powder Metallurgy & Hot Isostatic Pressing"
    discipline: Metallurgy
    tier: 6
    parents: [met_vacuumInductionMelting]
    flavor: "Consolidate atomised powder under heat and pressure into near-net shapes with no casting porosity — complex parts, full density."
  - id: met_singleCrystalTurbine
    title: "Single-Crystal Turbine Castings"
    discipline: Metallurgy
    tier: 6
    parents: [met_vacuumArcRemelting]
    flavor: "Grow a turbine blade as one crystal with no grain boundaries to creep — it runs hotter and lasts longer than any equiaxed casting."
  - id: met_refractoryMetals
    title: "Refractory Metal Hot Sections"
    discipline: Metallurgy
    tier: 7
    parents: [met_vacuumArcRemelting]
    flavor: "Niobium, tantalum and tungsten alloys that stay strong red-hot — radiation-cooled nozzles and nuclear-thermal cores."
  - id: met_additiveManufacturing
    title: "Laser Powder-Bed Additive Manufacturing"
    discipline: Metallurgy
    tier: 8
    parents: [met_powderMetallurgyHIP]
    flavor: "Print a regen-cooled chamber as a single part with internal channels no machine could cut. Geometry becomes free; the alloy becomes the limit."
  - id: met_amorphousAlloys
    title: "Bulk Metallic Glasses"
    discipline: Metallurgy
    tier: 9
    parents: [met_additiveManufacturing]
    flavor: "Quench fast enough that the metal never crystallises — glassy alloys with spring-like elasticity and extreme strength-to-weight."
  # ---------- Composite Materials (non-metallic structures & thermal protection) ----------
  - id: cmp_glassFiber
    title: "Glass-Fiber Laminates"
    discipline: CompositeMaterials
    tier: 2
    parents: [met_weldedSteel]
    flavor: "Glass cloth in cured resin: light, transparent to radio, and the gateway to every structural composite that follows."
  - id: cmp_ablativeTPS
    title: "Ablative Heatshields"
    discipline: CompositeMaterials
    tier: 3
    parents: [cmp_glassFiber]
    flavor: "A phenolic char layer that burns away on purpose, carrying reentry heat with it. The only thing between a capsule and a meteor's fate."
    parts: [ROC-ApolloHSBDB]
  - id: cmp_filamentWinding
    title: "Filament-Wound Cases"
    discipline: CompositeMaterials
    tier: 4
    parents: [cmp_glassFiber]
    flavor: "Wind continuous fiber under tension around a mandrel for pressure vessels and solid-motor cases far lighter than steel."
  - id: cmp_carbonCarbon
    title: "Carbon-Carbon Hot Structures"
    discipline: CompositeMaterials
    tier: 5
    parents: [cmp_ablativeTPS]
    flavor: "Carbon fiber in a carbon matrix that gets STRONGER as it heats — reusable wing leading edges and throat inserts."
  - id: cmp_carbonFiberComposite
    title: "Carbon-Fiber Airframes"
    discipline: CompositeMaterials
    tier: 5
    parents: [cmp_filamentWinding]
    flavor: "Tailored carbon-epoxy laminates lay stiffness exactly along the load paths — the modern lightweight airframe and interstage."
  - id: cmp_pica
    title: "PICA / AVCOAT Reentry Ablators"
    discipline: CompositeMaterials
    tier: 6
    parents: [cmp_ablativeTPS]
    flavor: "Ultralight phenolic-impregnated carbon ablators survive lunar- and Mars-return entry velocities at a fraction of the mass."
  - id: cmp_copv
    title: "Composite Overwrapped Pressure Vessels"
    discipline: CompositeMaterials
    tier: 6
    parents: [cmp_carbonFiberComposite]
    flavor: "A thin metal liner overwrapped in carbon fiber holds helium at hundreds of bar for a tiny mass — the modern pressurant bottle."
  - id: cmp_ceramicTiles
    title: "Reusable Ceramic Tile TPS"
    discipline: CompositeMaterials
    tier: 6
    parents: [cmp_carbonCarbon]
    flavor: "Silica tiles so insulating you can hold one glowing at the edges — the Shuttle's reusable skin, fragile but flyable again."
  - id: cmp_ceramicMatrixComposite
    title: "Ceramic-Matrix Composites"
    discipline: CompositeMaterials
    tier: 7
    parents: [cmp_carbonCarbon]
    flavor: "Ceramic fibers in a ceramic matrix add toughness to refractory ceramics — uncooled nozzle extensions and turbine shrouds."
  - id: cmp_metalMatrixComposite
    title: "Metal-Matrix Composites"
    discipline: CompositeMaterials
    tier: 8
    parents: [cmp_copv]
    flavor: "Silicon-carbide whiskers in an aluminum or titanium matrix: stiffer, more dimensionally stable struts and booms."
  - id: cmp_transpirationTPS
    title: "Transpiration-Cooled TPS"
    discipline: CompositeMaterials
    tier: 8
    parents: [cmp_ceramicMatrixComposite]
    flavor: "Sweat coolant through a porous skin to hold a fully reusable surface below its limit through repeated high-energy entries."
  # ---------- Propellant Chemistry (additions to the fuel-timeline ladder) ----------
  - id: pc_blackPowder
    title: "Pressed Black-Powder Grains"
    discipline: PropellantChemistry
    tier: 1
    parents: [start]
    flavor: "Charcoal, sulfur and saltpetre pressed into a grain — the oldest rocket propellant, and where solids begin."
  - id: pc_doubleBaseSolid
    title: "Double-Base Solid Propellant"
    discipline: PropellantChemistry
    tier: 2
    parents: [pc_blackPowder]
    flavor: "Nitrocellulose gelled with nitroglycerine burns hotter and cleaner than powder — the smokeless propellant of early missiles."
  - id: pc_hydrogenPeroxide
    title: "High-Test Peroxide (HTP)"
    discipline: PropellantChemistry
    tier: 3
    parents: [pc_ethanolLox]
    flavor: "Concentrated peroxide decomposes over a silver catalyst into hot steam and oxygen — monopropellant gas generators and soft-start oxidiser."
  - id: pc_castableComposite
    title: "Castable AP/Al Composite Grains"
    discipline: PropellantChemistry
    tier: 4
    parents: [pc_apcpGrain]
    flavor: "Cast and cure a meganewton-class grain directly into a segmented case — the chemistry of the largest boosters ever flown."
    parts: [RO-RSRM]
  - id: pc_greenMonoprop
    title: "Green Monopropellants"
    discipline: PropellantChemistry
    tier: 5
    parents: [pc_hypergolicChemistry]
    flavor: "Ionic-liquid blends (LMP-103S, AF-M315E) match hydrazine's performance without the lethal toxicity — safer satellite propulsion."
  - id: pc_gelledPropellant
    title: "Gelled Hypergolic Propellants"
    discipline: PropellantChemistry
    tier: 6
    parents: [pc_storableOxidizers]
    flavor: "Thicken storables to a gel that won't slosh or leak yet still flows when throttled — restartable, safer high-density propulsion."
  - id: pc_methalox
    title: "Methane Liquefaction & Methalox"
    discipline: PropellantChemistry
    tier: 6
    parents: [pc_cryoLiquefaction]
    flavor: "Liquid methane: clean-burning, coke-free, dense enough for deep throttling and — crucially — makeable from CO2 on Mars."
  - id: pc_subcooledDensified
    title: "Densified Sub-cooled Propellants"
    discipline: PropellantChemistry
    tier: 7
    parents: [pc_methalox]
    flavor: "Chill propellant below its boiling point and pack more mass in the same tank — the last few percent of performance, at operational cost."
  # ---------- Resource Engineering (ISRU — emerges mid-tree) ----------
  - id: res_electrolysis
    title: "Water Electrolysis"
    discipline: ResourceEngineering
    tier: 4
    parents: [pc_cryoLiquefaction]
    flavor: "Split water into hydrogen and oxygen with electricity — life-support oxygen now, in-situ propellant later."
  - id: res_regolithExcavation
    title: "Regolith Excavation & Augering"
    discipline: ResourceEngineering
    tier: 5
    parents: [met_earlyAlloys]
    flavor: "Dig and convey abrasive regolith in vacuum and low gravity — the unglamorous front end of every off-world supply chain."
    parts: [kerbalism-drill]
  - id: res_cryoLiquefactionISRU
    title: "In-Situ Cryogenic Liquefaction"
    discipline: ResourceEngineering
    tier: 5
    parents: [res_electrolysis]
    flavor: "Liquefy and store electrolysis products as flight cryogens on the surface — close the loop from water to propellant."
  - id: res_sabatier
    title: "Sabatier Methane Synthesis"
    discipline: ResourceEngineering
    tier: 6
    parents: [res_electrolysis]
    flavor: "React CO2 with hydrogen over a catalyst to make methane and water — the reaction that fuels the trip home from Mars."
    parts: [kerbalism-chemicalplant]
  - id: res_oreBeneficiation
    title: "Ore Beneficiation & Sintering"
    discipline: ResourceEngineering
    tier: 6
    parents: [res_regolithExcavation]
    flavor: "Concentrate and sinter raw regolith into feedstock and bricks — the first step from dirt toward parts and shielding."
  - id: res_metalExtraction
    title: "In-Situ Metal Extraction"
    discipline: ResourceEngineering
    tier: 7
    parents: [res_oreBeneficiation]
    flavor: "Molten-regolith electrolysis pulls iron, aluminium and oxygen out of the dirt itself — structural metal without a launch."
    parts: [kerbalism-ISRU]
  - id: res_propellantDepot
    title: "Orbital Propellant Depots"
    discipline: ResourceEngineering
    tier: 7
    parents: [res_sabatier]
    flavor: "Aggregate, store and transfer cryogens on orbit so missions launch dry and tank up — the logistics keystone of deep space."
  - id: res_atmosphericMining
    title: "Atmospheric & Gas-Giant Mining"
    discipline: ResourceEngineering
    tier: 8
    parents: [res_metalExtraction]
    flavor: "Scoop and separate gases from a planet's air on the fly — hydrogen and helium harvested without ever landing."
  - id: res_closedLoopFab
    title: "Closed-Loop In-Situ Fabrication"
    discipline: ResourceEngineering
    tier: 9
    parents: [res_metalExtraction]
    flavor: "Mine, refine, print and assemble entirely off-world, recycling scrap — a foothold that builds the next foothold."
  - id: res_heliumMining
    title: "Helium-3 Extraction"
    discipline: ResourceEngineering
    tier: 9
    parents: [res_atmosphericMining]
    flavor: "Separate the rare fusion isotope from regolith or gas-giant atmosphere — the propellant of an ambitious, far-future endgame."
