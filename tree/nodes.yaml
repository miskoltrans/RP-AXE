  - id: fd_continuousThrottleDescent
    title: "Continuous-Throttle Descent"
    discipline: FluidDynamics
    tier: 7
    parents: [pc_retroKick, gnc_spacecraftRCS]
    flavor: "Fly the last stretch of a landing on gimbaled, throttleable liquid thrusters that can be told to slow down instead of just shutting off. The generic hardware behind any soft landing — the historical Surveyor-branded version of this same engine ships separately, through the charter."
    parts: [ROE-TD339, ROE-MR80TDE, ROE-MR80B]
    # ROE-MR80B (2026-07, band-5 sweep): the same real MR-80 family's later "MLE" mark (MER/MSL sky-crane) -
    # RP-1 tech-gates it by when the KSP part's craft flew (largeRoverDesigns, modern), not engine debut.
    # ROE-MR80TDE (2026-07, band-3 lunar batch): 10:1 monopropellant terminal-descent engine - the deeper
    # robotic soft-landing successor to TD-339, same lineage.
    # landingLeg1 split OUT to str_fixedLanderLegs (2026-07 fix, user call) — a structural touchdown strut
    # is not a propellant/combustion breakthrough; bundling it here just because Surveyor happened to use
    # both together was mission-sequence bundling, not mechanism bundling.
    # RE-SCOPED (2026-07 fix): rn_surveyor_engines/rn_surveyor_retro/rn_surveyor_s_engine are all
    # mod=RN_US_Probes, auto-routed to hire_JPL by tools/build_tree.py regardless of nodes.yaml — they never
    # actually lived here, so removed rather than left as a silent no-op. ROE-TD339 is a SEPARATE
    # mod=ROEngines part (the same engine, RO-curated rather than mission-branded) — the real normal-tree
    # king. landingLeg1 moved IN from edl_crewedRecovery (was mis-filed there — crewed capsules of this era
    # never used landing legs; this is robotic-lander structural gear, which is what this node actually is).
    # Surveyor's retro rocket (Star-37) has no normal-tree home in THIS node anymore, but the generic
    # Star-37 hardware already lives in pc_apogeeKickStage — a normal-tree lander can still combine both.
  - id: cmp_airbagTouchdown
    title: "Airbag-Cushioned Touchdown"
    discipline: CompositeMaterials
    tier: 7
    parents: [pc_retroKick]
    flavor: "Skip the throttled engine entirely — kill your speed with one solid burn, then just bounce. A cluster of inflated bags absorbs the impact a precision-landed craft would rather not risk on a bad sensor reading. Nobody has actually tried landing this way here; go find out if it holds."
    parts: [SXTAirbag, SXTAirbagSmall]
    # Placed now rather than deferred to the Luna-9 file (2026-07, user call): ahistorical tree, and the
    # parts are already in hand — no reason to wait on hardware from a later file when the mechanism stands
