  - id: opt_recon
    title: "Film Reconnaissance"
    discipline: OpticsPhotonics
    tier: 3
    parents: [opt_fineGrainEmulsion]
    flavor: "A rotating lens sweeps the ground across a curved film gate, laying a horizon-to-horizon strip onto one frame — the whole swath at reconnaissance scale, in a camera small enough to orbit. The high-resolution photography that was the real reason the first satellites flew, and it gets there before the television does."
