    # King EATCS radiator panels (the Shuttle orbiter's own payload-bay radiators). Continues
    # th_activeLouvers' ACTIVE heat-rejection side (th_hermeticBus's passive side continues separately in
    # th_extendedMLIWrapping, above) - scaled from a probe's small adjustable louvers to a pumped-coolant-
