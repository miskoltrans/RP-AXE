    flavor: "One methyl group away from the hydrazine that came before it, and worth the detour: it stays liquid over a far wider band, resists shock decomposition, and does not freeze in a spacecraft's plumbing on the cold side of a long coast. The fuel that made storable engines something you could still trust after two years in orbit."
