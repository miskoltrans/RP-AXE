  # ---- Lane 5c: the CELL, not the paddle -- the silicon-cell ladder ----
  # Added 2026-07-28. Lane 5 above builds PADDLES (area, stowage, and all the real solar hardware); this
  # lane builds the CELL that goes on them. The two are independent axes and both are load-bearing -- a
  # better cell is worthless with no array to mount it on, and vice versa.
  # WHY IT EXISTS: divide ROSolar's per-rung W/m² by the solar constant (1361) and the tech levels become
  # panel efficiency, at which point each rung says plainly what it is. Four of the eleven move a column by
  # a MULTIPLE -- TL2 (x2.7 radiation life at unchanged mass), TL4 (x4 radiation), TL6 (all three at once),
  # TL7 (-42% mass) -- and each maps onto a real, nameable silicon-cell mechanism whose signature is exactly
  # the column that jumps. Radiation life leaping alone in 1961 and again in 1964 is not a coincidence: it
  # is the junction inversion, then the cover glass. The other three rungs (TL1, TL3, TL5) are refinements
  # and ride along with the breakthrough they follow.
  # WHAT MOVED: these rungs previously sat on Lane 5's SIZE nodes -- three of which say "nothing new about
  # how it works" in their own flavor. An efficiency uprate homed on a paddle-size node is rule 3 backwards;
  # its bottleneck is the cell. Lane 5 keeps every part and loses only its upgrades.
  # NOTE the pairing leaves the lower rung of each pair dominated (maxTechLevel is max-wins, so a node
  # granting TL0+TL1 effectively grants TL1). That is accepted: the alternative is one node per rung, which
  # needs eight nodes and forces invented breakthrough names onto three refinements that are not
  # breakthroughs. Zero their entryCost if the dead shelf-item ever reads badly in R&D.
  # TIERS are a parallel lane branching off elec_arCoatings (T4), NOT an insertion into the Lane 5 spine --
  # so nothing downstream cascades a tier.
  - id: elec_nOnPCell
    title: "N-on-P Radiation-Tolerant Cells"
    discipline: ElectricalPower
    tier: 6
    parents: [elec_arCoatings]
    flavor: "Build the junction the other way up — diffuse phosphorus into a boron-doped wafer instead of the reverse — and the cell stops dying in the belts. The first satellites came home with their output halved after a few months in the trapped radiation; the same silicon, inverted, holds its power for a season and gives back more of the blue end of the spectrum besides."
    upgrades: [solarTL2, solarTL3]
  - id: elec_dopedCoverglass
    title: "Cerium-Doped Cover Glass"
    discipline: ElectricalPower
    tier: 7
    parents: [elec_nOnPCell]
    flavor: "The cell was never the fragile part — the glass over it was. Ultraviolet darkens an ordinary cover slip until the array is looking at the sun through smoked quartz. Dope the glass with cerium and it stops browning, and a panel that used to fade inside a month holds its output for a third of a year."
    upgrades: [solarTL4, solarTL5]
  - id: elec_backSurfaceField
    title: "Back-Surface-Field Silicon Cells"
    discipline: ElectricalPower
    tier: 9
    parents: [elec_dopedCoverglass, elec_integratedCircuit]
    # CROSSOVER (2026-07-28) — elec_integratedCircuit (Microelectronics T7). Same-family, not "X led to Y":
    # this is the rung where cell-making stops being metallurgy and becomes semiconductor PROCESSING. A
    # back-surface field IS a heavy p+ diffusion laid across the back of the wafer, and the textured front
    # face is masked etching — the planar process, precise diffusion profiles and photolithographic masking,
    # is what makes both a monolithic IC and this cell. The two lanes are the same physics filed under
    # different disciplines and had not touched since elec_semiconductorDiode (T2); this reconnects them at
    # the one point where the shared process is genuinely load-bearing. Also rescues elec_integratedCircuit
    # from being a near-dead-end (fan-out 1 -> 2). Used sparingly per rule 9 — this is the ONLY crossover
    # added to the cell lane; the nuc_geiger -> elec_nOnPCell edge (Van Allen belts caused the n-on-p
    # switch) was considered and REJECTED: T1 -> T6 gates nothing, and that story is already told in the
    # node's own flavor. Lineage without gating belongs in the prose, not the edge.
    flavor: "Diffuse a heavily doped layer across the back of the cell so carriers that reach it are turned around instead of lost, and texture the front face so light that would have glanced off is trapped inside instead. The same silicon, worked properly, gives half again what it did — and a thinner wafer will now do the work of a thick one."
    upgrades: [solarTL6]
  - id: elec_thinSiliconCell
    title: "Thin-Substrate Silicon Cells"
    discipline: ElectricalPower
    tier: 10
    parents: [elec_backSurfaceField]
    flavor: "Grind the wafer down to a fraction of its old thickness and put a mirror behind it, so the light that would have passed straight through gets a second pass on the way out. Silicon is very nearly finished as a space cell here — but an array that once weighed six kilogrammes to the square metre now weighs three and a half."
    upgrades: [solarTL7]

  # ---- Lane 5d: silicon runs out and the III-V ladder takes over ----
  # Added 2026-07-28 to home solarTL8/9/10, which had fallen through to `parking`. Dividing ROSolar's
  # per-rung W/m² by the solar constant (1361) turns the ladder into panel efficiency, and it reads as one
  # story: TL0 4.6% -> TL7 15.1%, which is exactly where a space-grade SILICON cell stops. TL8 17.1%,
  # TL9 19.5% and TL10 22.1% are past that ceiling, and no amount of silicon gets there -- they are a
  # MATERIALS change. That also explains why their other two columns move in lockstep: III-V cells are
  # grown thin and lifted off the wafer (3.5 -> 0.8 kg/m²) and degrade far slower under radiation than
  # silicon (2 y -> 10 y). Three numbers, one mechanism.
  # A strict CHAIN, not siblings, and that is load-bearing: ROSolar's rungs set `maxTechLevel = N`, so the
  # highest unlocked rung wins OUTRIGHT. Spread across the four parallel T11 structure siblings above,
  # TL10 would short-circuit TL8/TL9 the moment a player took the wrong branch first.
  - id: elec_galliumArsenideCell
    title: "Gallium-Arsenide Heterojunction Cells"
    discipline: ElectricalPower
    tier: 11
    parents: [elec_thinSiliconCell]
    # Reparented off elec_matureSolarArrays 2026-07-28 when Lane 5c was built: this is where the silicon
    # ladder ENDS and the compound-semiconductor one starts, so its parent is the last silicon cell, not the
    # largest paddle. Lane 5 (structure) and Lane 5c/5d (cells) are now cleanly separate axes.
    flavor: "Silicon has run out of room — fifteen percent of the sunlight landing on it is all a crystal of it will ever give back. Grow the junction from gallium arsenide instead and the cell absorbs harder, keeps its output in the heat that wilts a silicon panel, and shrugs off the radiation that ages an array into uselessness."
    upgrades: [solarTL8]
  - id: elec_tripleJunctionCell
    title: "Triple-Junction III-V Cells"
    discipline: ElectricalPower
    tier: 12
    parents: [elec_galliumArsenideCell]
    flavor: "Stack three junctions of different bandgaps in one cell, each harvesting the part of the spectrum the one above it let through — indium gallium phosphide takes the blue, gallium arsenide the visible, germanium the infrared that silicon only ever wasted as heat."
    upgrades: [solarTL9]
  - id: elec_metamorphicMultijunction
    title: "Inverted Metamorphic Multijunction Cells"
    discipline: ElectricalPower
    tier: 13
    parents: [elec_tripleJunctionCell]
    flavor: "Grow the junctions upside down on a wafer, then peel the finished cell away and discard the wafer it was built on. What is left is a few microns of semiconductor with no substrate to carry — the most efficient cell ever flown, and light enough that the array's mass stops being the reason it is small."
    upgrades: [solarTL10]

