  # ---- Lane 4: robotic grapple (a genuinely new capability - Robotics, not GuidanceControl) ----
  - id: rob_grappleEndEffector
    title: "Robotic Grapple End-Effector"
    discipline: Robotics
    tier: 9
    parents: [rob_linearActuation, rob_hingeActuation]
    flavor: "Close a powered claw around a grapple fixture instead of threading a docking port together by eye — the business end of a robotic arm, built to catch and hold a vehicle that never has to fly all the way in."
    parts: [GrapplingDevice]
    # Crossover: needs both the reach (rob_linearActuation) and the articulated joint (rob_hingeActuation)
    # already established for arms/booms. A real alternative to precision docking, not a docking-port
    # variant, so it's homed in Robotics rather than folded into gnc_stationBerthing.

