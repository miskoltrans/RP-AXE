  # ================================================================================================
  # ===================== BAND 3 * RADIOISOTOPE POWER (T7 -> T8) ===================================
  # First nuclear-power-GENERATION content in the tree (NuclearEngineering so far only had radiation
  # DETECTION — nuc_geiger, nuc_cosmicRay). The real 2-step history: SNAP-3A flew on polonium-210
  # because that's the isotope on hand, and it's a genuine dead end (138-day half-life — power is
  # mostly gone before a mission gets going); SNAP-3B swapped in plutonium-238 (87.7-year half-life)
  # and THAT is the actual breakthrough that makes an RTG a real power source, not a demonstration.
  # ================================================================================================
  - id: nuc_isotopePower
    title: "Radioisotope Thermoelectric Power"
    discipline: ElectricalPower
    tier: 7
    parents: [nuc_geiger]
    flavor: "Stack thermocouples across a radioactive pellet and draw current straight from the heat of its own decay — power with no sun angle and no moving part, fuelled with whatever isotope happens to be on hand. Polonium-210 proves the generator works; it does not prove it lasts — the source itself is mostly spent within a season."
    parts: [RO-SNAP-3-RTGPo210]
    # REVIEW FIX (2026-07, band-3 review #medium): dropped elec_deployableArrays as
    # an unlabeled second parent — same issue as elec_fuelCellPower below: photovoltaic tech shares no
    # mechanism with RTG thermoelectrics, and nothing in the flavor mentioned solar cells. nuc_geiger
    # alone (radioactive-material handling preceding deliberate isotope-heat use) is the real lineage.
  - id: nuc_isotopePowerII
    title: "Long-Lived Isotope Power"
    discipline: ElectricalPower
    tier: 8
    parents: [nuc_isotopePower]
    flavor: "Swap in plutonium-238 for the same generator and the output barely sags in a decade instead of collapsing in a season — the fuel choice that turns a demonstration into a power source you can fly past the orbit of Mars and still hear from."
    parts: [rtgMini, RO-SNAP-9-RTG, RO-SNAP-19-RTG, ca_rtg2000, nfe-rtg-snap27-1, ROC-LEMFoldingSNAP27BDB, ROC-LEMRackSNAP9BDB]

