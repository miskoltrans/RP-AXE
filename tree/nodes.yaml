  # ---- Lane 1: reusable/restartable hydrolox -- LR129/RD-57/KVD-1 -> HG-3 -> SSME ----
  - id: cryo_deepThrottleHydrolox
    title: "Deep-Throttle Restartable Hydrolox Combustion"
    discipline: Cryogenics
    tier: 9
    parents: [cryo_gasGeneratorHydrolox]
    flavor: "Redesign the hydrolox engine to restart on command and throttle across a wide range instead of firing once at full bore — the deliberate first step toward an engine built to fly again, not just fly. LR129 was drawn for exactly that job; RD-57 and KVD-1 are the Soviet answer, chasing the same restartable, reusable goal from the other side of the Iron Curtain."
    parts: [ROE-LR129, ROE-RD57, RO_KVD1]
    upgrades: [RFUpgrade_H2+O2, RFUpgrade_AJ10-133-Hylas]
    # LADDER PASS (2026-07-27): hydrolox RCS (Isp 1.33, the strongest in the whole RCS menu) gates on
    # small restartable deep-throttling hydrolox combustion - the same trick at thruster scale.
    # doctrine-4 fix (2026-07): CE-7.5 is this node's own base part's (RO_KVD1) later mark - moved down to
    # cryo_uprateRestartableHydrolox.
    # Scales cryo_gasGeneratorHydrolox's thrust (J-2/HM-7 lineage) with restart know-how the same node
    # already draws on (cryo_expanderCycle is one of its own parents - listing it again here was a
    # redundant transitive edge, dropped per build_tree.py's check). KVD-1 RESEARCHED (2026-07): fuel-rich
    # staged combustion, not
    # expander cycle (that's RD-0146, a different, later Kosberg engine) - correctly grouped here, not
    # with the RL-10 chain. All three are king-class: real parallel prototype studies toward a reusable
    # hydrolox engine, none of them the SSME itself yet.
  - id: cryo_uprateRestartableHydrolox
    title: "Uprated Restartable Hydrolox Combustion"
    discipline: Cryogenics
    tier: 10
    parents: [cryo_deepThrottleHydrolox]
    flavor: "Scale the restartable hydrolox engine toward booster thrust while keeping the reusable engine's whole point — deep throttle, many restarts, margin instead of a one-shot redline. Rocketdyne's own HG-3 studies fed straight into the engine still to come."
    parts: [ROE-HG3]
    upgrades: [RFUpgrade_LR129-P-1, RFUpgrade_CE-7.5, RFUpgrade_RL10A-3-7]
    # King HG-3 (real SSME-precursor study). Doctrine-4 catches: KVD-1/LR129-P-1 are later configs
    # of this node's own parent (cryo_deepThrottleHydrolox); CE-7.5 moved down here 2026-07 for the same
    # reason (KVD-1's own next mark). HG-3-SL (this node's OWN base part's later mark) moved further down
    # to cryo_ssme - it was wrongly co-located with ROE-HG3 by the previous gap-fill pass.
    # REVISED (2026-07): HM-7B/J-2S/YF-75D/M-1/M-1SL originally caught here were pulled out into their own
    # node (cryo_matureGasGeneratorHydrolox, below) once upgrades were re-weighted at 0.8 parts each - the
    # combined 8 upgrades (7.4 weighted) broke the 6-part cap.

  - id: cryo_matureGasGeneratorHydrolox
    title: "Mature Gas-Generator Hydrolox Uprating"
    discipline: Cryogenics
    tier: 10
    parents: [cryo_largeHydrolox]
    flavor: "The 1972-76 gas-generator hydrolox engines maturing mark by mark in the shadow of the new reusable-engine programme — more thrust, tighter margins, no change to the single-start cycle underneath."
    upgrades: [RFUpgrade_HM-7B, RFUpgrade_J-2S, RFUpgrade_YF-75D, RFUpgrade_M-1, RFUpgrade_Vulcain-2]  # HM-7B+ added 2026-07 (gap-fill; sits between HM-7B and HM-7B++ siblings here)
    # Bases (J-2/HM-7/YF-75/M-1) already king cryo_gasGeneratorHydrolox/cryo_largeHydrolox. Split out from
    # cryo_uprateRestartableHydrolox (2026-07) once upgrades started counting 0.8-parts toward the cap.
  - id: cryo_ssme
    title: "Reusable Staged-Combustion Hydrolox"
    discipline: Cryogenics
    tier: 11
    parents: [cryo_uprateRestartableHydrolox]
    flavor: "Close the cycle for good: burn the fuel-rich preburner exhaust back through the main chamber at a pressure no earlier hydrolox engine touched, throttleable across a wide range and rated to fly the same hardware again and again. The engine the whole restartable-hydrolox lineage was built toward — the Shuttle's main engine."
    parts: [ROE-RS25]
    upgrades: [RFUpgrade_HG-3A, RFUpgrade_LR129-P-2]
    # King RS-25 (SSME) - the headline engine of the whole era. Doctrine-4 catches: HG-3A/HG-3A-SL (later
    # configs of this node's own parent) and LR129-P-2 (LR129's own final config). Deepest tier of this
    # pass alongside nuc_flightRatedNTR (T11) - both are real flight-design capstones of multi-step programmes.
    # HG-3-SL moved down from cryo_uprateRestartableHydrolox (doctrine-4 fix, 2026-07): same-era sibling of
    # its own base part ROE-HG3, bundled with the next real mark rather than left colliding.

