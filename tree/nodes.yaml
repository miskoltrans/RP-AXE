    tier: 9
    parents: [gnc_rendezvousDocking]
    flavor: "A new generation of station-joining hardware built for a permanent outpost instead of a single rendezvous — a dedicated berthing adapter for mating two different national programmes' hardware, androgynous ports that don't care which side is active, and the instruments riding along on the join itself."
    parts: [ROC-ApolloAPAS75BDB, ROC-ApolloASTPAdapterBDB, ROC-ApolloASTPUVXBDB, ROC-ApolloASTPVHFBDB, ROC-BigGeminiMOLPort, mk2DockingPort]
    # King APAS-75 (androgynous, the design lineage that outlives every program-specific port before it) +
    # the ASTP docking module. Its UV experiment/VHF antenna ride along (mission-specific bolt-ons on the
    # same docking module, not separate science/comms breakthroughs). MOL port + Mk2 Clamp-O-Tron = the
    # same docking-hardware generation, parallel programs.
  - id: gnc_largeReactionWheels
    title: "Large-Class Reaction Wheels"
    discipline: GuidanceControl
    tier: 9
    parents: [gnc_reactionWheelAttitude]
    flavor: "The same momentum-exchange trick, sized for a station instead of a probe — a flywheel heavy enough to hold a whole crewed module steady without spending a gram of propellant."
    parts: [ca_rw_large, advSasModule, asasmodule1-2, restock-reactionwheel-radial-1]
    # Bases (ca_rw_small/medium/xsmall, sasModule) already king gnc_reactionWheelAttitude, which is at its
