  - id: cryo_toroidalAerospikeNozzle
    title: "Toroidal Aerospike Nozzle"
    discipline: Cryogenics
    tier: 9
    parents: [cryo_gasGeneratorHydrolox]
    flavor: "Bend the bell into an open ring around a truncated plug and let the atmosphere itself complete the nozzle — an annular chamber that keeps its thrust efficient from the pad to vacuum without ever changing shape. Ground-tested for a shortened Saturn upper stage that was never built."
    parts: [ROE-J2T]
    # King J-2T (J-2 Toroidal) - real Rocketdyne program, an altitude-compensating annular/aerospike
    # derivative of the J-2 (T8) studied for a shortened S-II ("Saturn INT-20"); its own RP-1 configs span
    # 1976-1985 (hydrolox1976/1981), squarely the already-authored space-stations-shuttle batch
    # (x=-1932..-1592, docs/shuttle-station-engine-kings.md) - missed entirely in that engine-only pass.
    # Distinct mechanism from a plain thrust uprate (nozzle geometry, not just a bigger bell), so it earns
    # its own node rather than folding into cryo_largeHydrolox.
    # doctrine-4 fix (2026-07): J-2T-250K is this node's own base part's (ROE-J2T) later mark - moved down
    # to cryo_toroidalAerospikeNozzleII (new node, no existing child here).
  - id: cryo_toroidalAerospikeNozzleII
    title: "Uprated Toroidal Aerospike Nozzle"
    discipline: Cryogenics
    tier: 10
    parents: [cryo_toroidalAerospikeNozzle]
    flavor: "The same annular aerospike, pushed to a longer burn and higher chamber pressure — the J-2T's own final study mark before the program quietly ended."
    upgrades: [RFUpgrade_J-2T-250K]
    # doctrine-4 catch: J-2T-250K's own base part (ROE-J2T) lives in cryo_toroidalAerospikeNozzle.

  - id: pc_fluorineOxidizerChemistry
    title: "Fluorine Oxidizer Chemistry"
    discipline: PropellantChemistry
    tier: 10
