# RP-AXE disciplines — the 18 engineering fields you fund (see docs/RESTART.md P1).
# A discipline is a TAG/thread, not a node: you research the breakthroughs (nodes) inside it.
# `order` = lane Y-order (top→bottom), grouped in the 4 clusters. `color` = render fill.
# `icon` = stock RDicon_* (placeholder until AXE icon set exists). Naming obeys the
# "no X & Y unless the real world names it one field" rule (GuidanceControl, OpticsPhotonics = exceptions).

